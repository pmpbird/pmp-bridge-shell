<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="theme-color" content="#52b5df"><title>PMP Route Guardian Current Loader v1</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#52b5df;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#101827}iframe#app{position:fixed;inset:0;width:100%;height:100%;border:0;background:#52b5df}#gate{position:fixed;inset:0;display:grid;place-items:center;background:#52b5df;font-weight:950;text-align:center;padding:18px;z-index:25;overflow:auto}#gateCard{width:min(760px,100%);background:#46a9d3;border:3px solid #07101c;border-radius:28px;padding:18px;box-shadow:0 10px 24px rgba(0,0,0,.2);line-height:1.35}.topTabs{display:flex;justify-content:flex-end;margin-bottom:6px}.tinyTab{width:auto;border:2px solid #07101c;border-radius:999px;background:#a1fcfd;color:#101827;padding:6px 12px;font-size:12px;font-weight:950;box-shadow:none}.badge{display:inline-block;background:#a1fcfd;border:2px solid #07101c;border-radius:999px;padding:6px 10px;margin:0 auto 10px;font-size:12px;font-weight:950;color:#101827}h1{font-size:31px;line-height:1.05;margin:0 0 8px}p{font-size:16px;font-weight:850;margin:0 0 12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}@media(max-width:680px){.grid{grid-template-columns:1fr}}button{width:100%;border:0;border-radius:16px;background:#a1fcfd;color:#101827;font:inherit;font-weight:950;padding:13px;box-shadow:0 8px 18px rgba(0,0,0,.16)}button.dark{background:#172234;color:#eef4fb;border:1px solid #25354a}.pass #gateCard{border-color:#0b3519}.fail #gateCard{border-color:#7d3333;background:#7b2f2f;color:#fff}.fail p{color:#fff}.loaded #gate,.loaded .drop,.loaded #residentBox{display:none!important}.drop{display:none;margin-top:10px;background:#0c141e;color:#eef4fb;border:2px solid #a1fcfd;border-radius:18px;padding:10px;text-align:left}.drop.open{display:block}#reportPanel{max-height:32vh;overflow:auto;white-space:pre-wrap;font:12px/1.35 ui-monospace,Menlo,monospace}#reportPanel.open{position:fixed;left:10px;right:10px;top:calc(58px + env(safe-area-inset-top));z-index:48;max-height:42vh;box-shadow:0 8px 28px #0007}#repoPanel{max-height:58vh;overflow:hidden;padding:0;background:#52b5df;color:#101827;border-color:#07101c}#repoBar{height:50px;display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;background:#46a9d3;border-bottom:2px solid #07101c;padding:8px 10px;font-weight:950}#repoClose{width:auto;min-width:88px;padding:9px 12px;background:#172234;color:#eef4fb;border:1px solid #25354a}#repoFrame{position:relative!important;inset:auto!important;display:block;width:100%;height:min(52vh,560px);border:0;background:#52b5df}.residentNative{display:none;position:fixed;left:10px;right:10px;top:calc(54px + env(safe-area-inset-top));z-index:45;background:transparent;border:0;padding:0;text-align:left;height:min(78vh,560px);overflow:visible}.residentNative.open{display:block}.residentFrame{position:relative!important;inset:auto!important;width:100%;height:100%;border:0;border-radius:20px;background:transparent;box-shadow:0 8px 28px #0007}.pill{display:inline-block;background:#172234;color:#eef4fb;border:1px solid #25354a;border-radius:999px;padding:7px 10px;font-weight:900;font-size:12px;margin:4px}.ok{background:#123024;color:#d8ffe2}.bad{background:#351414;color:#ffd1d1}</style></head><body><iframe id="app" title="PMP Current App"></iframe><div id="gate"><div id="gateCard"><div class="topTabs"><button id="residentBtn" class="tinyTab">Resident</button></div><div class="badge">ROUTE GUARDIAN</div><h1 id="gateTitle">Route Guardian</h1><p id="gateText">Current loader v1. Check the current route before World opens.</p><div id="chips"></div><div class="grid"><button id="primaryBtn">Check Route</button><button id="copyBtn" class="dark">Copy Report</button><button id="showBtn" class="dark">Show / Hide Report</button><button id="repoBtn" class="dark">Repo Index</button></div><pre id="reportPanel" class="drop">No report yet.</pre><div id="repoPanel" class="drop"><div id="repoBar"><span>Route Guardian Repo Index</span><button id="repoClose">Close</button></div><iframe id="repoFrame" title="Route Guardian Repo Index"></iframe></div></div></div><div id="residentBox" class="residentNative"><iframe id="residentFrame" class="residentFrame" title="Resident"></iframe></div><script src="pmp-route-guardian-v1.js?fresh=current-loader-v1-report-fix"></script><script>const MAP_PATH='pmp-current-map.json',DEFAULT_APP='pmp-current-inner-cleanbug-rgcontrols-v3.html';const F=app,GATE=gate,T=gateTitle,GT=gateText,CH=chips,P=primaryBtn,COPY=copyBtn,SHOW=showBtn,REPO=repoBtn,RES=residentBtn,REPORT=reportPanel,RP=repoPanel,RF=repoFrame,RC=repoClose,RB=residentBox,RBF=residentFrame;let latest=null,passed=false,loaded=false;function esc(s){return String(s).replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]))}function pill(s,ok){return'<span class="pill '+(ok?'ok':'bad')+'">'+esc(s)+'</span>'}function setGate(a,b,k){document.body.classList.remove('pass','fail','loaded');if(k)document.body.classList.add(k);GATE.style.display='grid';T.textContent=a;GT.textContent=b}function closeDrops(ex){if(ex!=='resident')RB.classList.remove('open');if(ex!=='report')REPORT.classList.remove('open');if(ex!=='repo')RP.classList.remove('open')}function hideGate(){document.body.classList.add('loaded');GATE.style.display='none';closeDrops()}function normalizeReport(r){try{if(r.current_surface&&r.current_surface.file==='pmp-route-guardian-current-loader-v1.html'){let risks=(r.stale_shell_risk&&r.stale_shell_risk.risks)||[];r.current_surface.current_loader_surface=true;if(risks.length===1&&/not the expected entry/.test(risks[0]))r.stale_shell_risk={risk_count:0,risks:[],likely_stale_shell:false,support_test_surface_note:'Current loader v1 is the versioned Route Guardian loader behind the stable Home Screen door.'}}}catch(e){}return r}async function fetchJson(p){let r=await fetch(p+'?fresh='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error(p+' '+r.status);return await r.json()}function cleanPath(p){p=String(p||DEFAULT_APP).trim();return/^[a-zA-Z0-9._\/-]+\.html$/.test(p)?p.replace(/^\/+/, ''):DEFAULT_APP}function render(r){let m=r.current_map_assessment||{},i=r.current_inner_assessment||{},risk=(r.stale_shell_risk||{}).risk_count||0;CH.innerHTML=pill('map '+(m.current_path_matches_expected?'ok':'check'),!!m.current_path_matches_expected)+pill('base '+(i.loads_base_app?'ok':'check'),!!i.loads_base_app)+pill('bug '+(i.routes_bug_memory_clean?'ok':'check'),!!i.routes_bug_memory_clean)+pill('risk '+risk,risk===0)}async function checkRoute(){setGate('Route Guardian','Checking current app route...',null);P.textContent='Checking...';try{if(!window.PMPRouteGuardianV1)throw Error('Route Guardian did not load.');let r=normalizeReport(await window.PMPRouteGuardianV1.buildReport({store:false}));latest=r;REPORT.textContent=JSON.stringify(r,null,2);render(r);passed=String(r.verdict||'').startsWith('PASS')&&((r.stale_shell_risk||{}).risk_count||0)===0;if(passed){setGate('Route Guardian Passed','Current route is clean. The same button is now Open World.','pass');P.textContent='Open World'}else{setGate('Route Guardian Blocked',r.resident_summary||'Route risk found.','fail');P.textContent='Check Route'}}catch(e){passed=false;latest={type:'PMP_CURRENT_LOADER_V1_ERROR',built_at:new Date().toISOString(),error:String(e&&e.message||e)};REPORT.textContent=JSON.stringify(latest,null,2);CH.innerHTML=pill('test failed',false);setGate('Route Guardian Error',latest.error,'fail');P.textContent='Check Route'}}function deep(){try{let w=F.contentWindow,d=F.contentDocument||w.document;for(let i=0;i<8;i++){let n=d&&d.getElementById&&d.getElementById('app');if(!n)break;w=n.contentWindow;d=n.contentDocument||w.document}return{w,d}}catch(e){return null}}function patchWorldTitle(){let o=deep(),d=o&&o.d;if(!d)return;try{let h=d.getElementById('world')&&d.getElementById('world').querySelector('h1');if(h&&h.textContent.trim()==='PMP World')h.textContent='World'}catch(e){}}async function openWorld(){if(!passed){setGate('Route Not Passed','Run Check Route first. World will not open until Route Guardian passes.','fail');P.textContent='Check Route';return}setGate('Opening World','Route Guardian passed. Opening World now.','pass');let map=await fetchJson(MAP_PATH).catch(()=>({current_app:{path:DEFAULT_APP,cache_key:'fallback'}}));let cur=map.current_app||{};F.src=cleanPath(cur.path||DEFAULT_APP)+'?fresh=current-loader-v1-'+encodeURIComponent(cur.cache_key||Date.now())+'-'+Date.now()+'#world';loaded=true;F.onload=()=>{setTimeout(hideGate,550);setTimeout(patchWorldTitle,300);setTimeout(patchWorldTitle,1200);setTimeout(patchWorldTitle,2500)};setTimeout(hideGate,3500)}function openRepo(){closeDrops('repo');RP.classList.toggle('open');if(RP.classList.contains('open'))RF.src='pmp-route-guardian-repo-index-v1.html?inside=current-loader-v1&fresh='+Date.now()}function openResident(){closeDrops('resident');RB.classList.toggle('open');if(RB.classList.contains('open'))RBF.src='pmp-resident-route-guardian-surface-v2.html?fresh='+Date.now()}window.addEventListener('message',e=>{if(e.data&&e.data.type==='PMP_RESIDENT_SURFACE_CLOSE')RB.classList.remove('open')});async function copyReport(){if(!latest)await checkRoute();try{await navigator.clipboard.writeText(JSON.stringify(latest,null,2));setGate('Report Copied',passed?'Report copied. Open World is still available.':'Report copied. Route is blocked or uncertain.',passed?'pass':'fail');P.textContent=passed?'Open World':'Check Route'}catch(e){closeDrops('report');REPORT.classList.add('open')}}function toggleReport(){closeDrops('report');if(!latest&&(!REPORT.textContent||REPORT.textContent.trim()==='No report yet.'))REPORT.textContent='No report yet — run Check Route first.';REPORT.classList.toggle('open');if(REPORT.classList.contains('open'))setTimeout(()=>REPORT.scrollIntoView({block:'nearest'}),40)}P.onclick=()=>passed&&!loaded?openWorld():passed&&loaded?hideGate():checkRoute();COPY.onclick=copyReport;SHOW.onclick=toggleReport;REPO.onclick=openRepo;RC.onclick=()=>RP.classList.remove('open');RES.onclick=openResident;setInterval(()=>{if(loaded)patchWorldTitle()},1000);</script></body></html>

<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#f3ded4"><title>PMP Bank Auto Recorder v7</title><style>
html,body{margin:0;background:#f3ded4;color:#07101c;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{padding:8px}.card{background:white;border:3px solid #07101c;border-radius:20px;padding:10px;margin:8px 0;box-shadow:0 7px 20px #0002}.top{position:sticky;top:0;z-index:9999;background:white;border:3px solid #07101c;border-radius:18px;padding:7px;display:grid;grid-template-columns:1fr 1fr;gap:6px;box-shadow:0 8px 20px #0004}h1{font-size:22px;margin:0 0 4px}.sub{font-weight:850;color:#294f5d;line-height:1.25}button{border:2px solid #07101c;border-radius:13px;background:#acd1fb;color:#07101c;font:inherit;font-weight:950;padding:10px 6px}.dark{background:#172234;color:white}.framebox{height:70vh;border:3px solid #07101c;border-radius:18px;overflow:hidden;background:#f3ded4}iframe{width:100%;height:100%;border:0}.pill{display:inline-block;border:2px solid #07101c;border-radius:999px;background:white;padding:4px 7px;margin:3px;font-size:12px;font-weight:900}.bad{background:#ffe1e1}.ok{background:#e4ffe9}.warn{background:#fff3de}pre{white-space:pre-wrap;word-break:break-word;background:#102033;color:#eaffef;border-radius:14px;padding:9px;max-height:34vh;overflow:auto;font-size:12px;line-height:1.35}
</style></head><body>
<div class="card warn"><h1>Bank Auto Recorder v7</h1><div class="sub">Diagnostic only. No app patching. It loads the app at #bank and starts recording automatically. No Bank+Record switch button.</div></div>
<div class="top"><button id="reload">Reload + Auto Record</button><button id="copy" class="dark">Copy Report</button></div>
<div id="status" class="card"><div id="badges"></div><pre id="summary">Starting recorder...</pre></div>
<div class="card"><div class="framebox"><iframe id="app" title="PMP app frame"></iframe></div></div>
<div class="card"><h2>Events</h2><pre id="events">No events yet.</pre></div>
<script>
(()=>{'use strict';
const V='7.0.0-auto-record-bank-hash-no-switch-button',CURRENT='pmp-current-reload-owner-v27.html',SAMPLE_MS=75,RUN_MS=8000;
const LEVELS={level1:'[data-cr-level1-source-gate],[data-cr-level1],[data-source-zip-lane]',level2:'[data-source-zip-levels-single],[data-cr-level2],[data-source-zip-reader-level2]',level3:'[data-source-text-reader-level3]',level4:'[data-source-reference-gate-level4]',level4b:'[data-source-reference-gate-level4b]',level5_plus:'[data-level5-source-gated-runner],[data-level6-audit-receipt-lock],[data-level7-no-bypass-enforcement],[data-level8-output-gate],[data-level9-actual-resident-integration],[data-level10-cert-lock],[data-level11-startup-guard],[data-level12-startup-enforcement],[data-level13-failure-test],[data-level14-recovery-proof],[data-level15-source-invalidation],[data-level16-source-bound],[data-level17-source-mismatch],[data-level18-recert-gate],[data-level19-recovery-proof],[data-level20-summary-lock],[data-level21-one-tap-retest],[data-level22-export-receipt],[data-level23-integrity-check],[data-level24-tamper-test],[data-level25-receipt-bundle],[data-level26-packet-integrity],[data-level27-tampered-packet],[data-level28-final-export],[data-level29-cold-start],[data-level30-final-seal],[data-resident-l30b-auto-gate]'};
const app=document.getElementById('app'),summary=document.getElementById('summary'),eventsBox=document.getElementById('events'),badges=document.getElementById('badges'),statusCard=document.getElementById('status');
let report=null,timer=null,t0=0,last='',openBad=null;
function clean(s){return String(s||'').replace(/\s+/g,' ').trim()}function short(s,n){s=clean(s);return s.length>(n||150)?s.slice(0,n||150)+'…':s}
function cssVisible(e){try{let w=e.ownerDocument.defaultView,cs=w.getComputedStyle(e),r=e.getBoundingClientRect();return cs.display!=='none'&&cs.visibility!=='hidden'&&Number(cs.opacity)!==0&&r.width>0&&r.height>0&&!e.classList.contains('hidden')}catch(x){return false}}
function visual(e){try{let w=e.ownerDocument.defaultView,r=e.getBoundingClientRect();if(!cssVisible(e)||r.bottom<=0||r.right<=0||r.top>=(w.innerHeight||0)||r.left>=(w.innerWidth||0))return false;let x=Math.max(2,Math.min((w.innerWidth||1)-2,r.left+Math.min(20,Math.max(1,r.width/2)))),y=Math.max(2,Math.min((w.innerHeight||1)-2,r.top+Math.min(20,Math.max(1,r.height/2))));let hit=e.ownerDocument.elementFromPoint(x,y);return !!(hit&&(hit===e||e.contains(hit)||hit.contains(e)))}catch(x){return false}}
function tag(e){if(!e)return null;let s=(e.tagName||'node').toLowerCase();if(e.id)s+='#'+e.id;if(e.className&&typeof e.className==='string')s+='.'+e.className.trim().split(/\s+/).slice(0,2).join('.');try{Array.from(e.attributes||[]).forEach(a=>{if(a.name.indexOf('data-')===0)s+='['+a.name+(a.value?'="'+a.value+'"':'')+']'})}catch(x){}return s}
function path(e){let a=[];for(let n=e,i=0;n&&i<8;n=n.parentElement,i++)a.push(tag(n));return a}
function docs(d,a,n,p){a=a||[];n=n||0;p=p||'diagnostic';if(!d||n>12)return a;a.push({doc:d,path:p,url:(()=>{try{return String(d.location.href)}catch(e){return'blocked'}})(),title:d.title||''});try{Array.from(d.querySelectorAll('iframe,frame')).forEach((f,i)=>{try{let x=f.contentDocument||(f.contentWindow&&f.contentWindow.document);if(x)docs(x,a,n+1,p+' > iframe['+i+']')}catch(e){}})}catch(e){}return a}
function bestDoc(){let best=null,score=-1;docs(document).forEach(x=>{let d=x.doc,s=0;try{if(d.getElementById('bank'))s+=100;if(d.querySelector('[data-bank-buttons]'))s+=40;if(d.querySelector('[data-source-text-reader-level3]'))s+=30;if(d.querySelector('[data-run-bank-tools]'))s+=30;if(/pmp-home-single/i.test(x.url))s+=20}catch(e){}if(s>score){score=s;best=x}});return score>0?best:null}
function levelState(bank,sel){let nodes=[];try{nodes=Array.from(bank.querySelectorAll(sel))}catch(e){}let first=nodes[0]||null;return{total:nodes.length,css_visible:nodes.filter(cssVisible).length,visual:nodes.filter(visual).length,first:first?{tag:tag(first),text:short(first.textContent),path:path(first),inside_detail:!!first.closest('[data-bank-detail-wrap]'),inside_run_tools:!!first.closest('[data-run-bank-tools]'),inside_level_stack:!!first.closest('[data-cr-level-stack]')}:null}}
function getState(){let item=bestDoc();if(!item)return{app_found:false};let d=item.doc,b=d.getElementById('bank');if(!b)return{app_found:true,bank_found:false,url:item.url,title:item.title};let bh=b.querySelector('[data-bank-buttons]'),openers=bh?Array.from(bh.querySelectorAll('[data-open-bank]')):[];let txt=clean(bh&&bh.textContent),detail=b.querySelector('[data-bank-detail-wrap]'),run=b.querySelector('[data-run-bank-tools]');let levels={};Object.keys(LEVELS).forEach(k=>levels[k]=levelState(b,LEVELS[k]));let visualLevels=Object.keys(levels).filter(k=>levels[k].visual>0),lower=visualLevels.filter(k=>k!=='level1'&&k!=='level2');let bankReady=!!(bh&&cssVisible(bh)&&openers.length&&txt&&!/^Loading\.\.\.?$/i.test(txt));let buttonsVisual=!!(bh&&visual(bh));let crReady=!!(cssVisible(detail)&&cssVisible(run));let loose=lower.filter(k=>{let f=levels[k].first;return f&&(!f.inside_detail||!f.inside_run_tools||!f.inside_level_stack)});let bad=!!(lower.length&&(!crReady||loose.length));let normal=!!(buttonsVisual&&!bad&&!cssVisible(detail));return{app_found:true,bank_found:true,url:item.url,title:item.title,bank_buttons_ready:bankReady,bank_buttons_count:openers.length,bank_buttons_visual:buttonsVisual,detail_visible:cssVisible(detail),run_tools_visible:cssVisible(run),continuous_run_ready:crReady,visual_normal_blue_bank_page:normal,visual_levels:visualLevels,visual_lower_levels:lower,loose_visual_lower_levels:loose,visual_bad_flash:bad,levels,version:(d.defaultView.PMPMasterBankTabV1&&d.defaultView.PMPMasterBankTabV1.version)||null}}
function compact(s){return{app_found:s.app_found,bank_found:s.bank_found,bank_buttons_ready:s.bank_buttons_ready,bank_buttons_count:s.bank_buttons_count,bank_buttons_visual:s.bank_buttons_visual,detail_visible:s.detail_visible,run_tools_visible:s.run_tools_visible,continuous_run_ready:s.continuous_run_ready,visual_normal_blue_bank_page:s.visual_normal_blue_bank_page,visual_levels:s.visual_levels,visual_lower_levels:s.visual_lower_levels,loose_visual_lower_levels:s.loose_visual_lower_levels,visual_bad_flash:s.visual_bad_flash,version:s.version}}
function label(s){if(!s.app_found)return'no app doc';if(!s.bank_found)return'no bank';if(s.visual_bad_flash)return'VISUAL BAD FLASH: '+s.visual_lower_levels.join(', ');if(s.visual_normal_blue_bank_page)return'VISUAL RECOVERY: normal blue Bank buttons';if(s.bank_buttons_visual)return'Blue Bank buttons visually on screen';return'loading'}
function closeBad(t,s){if(openBad){openBad.end_ms=t;openBad.duration_ms=t-openBad.start_ms;openBad.end_state=compact(s);report.visual_bad_spans.push(openBad);openBad=null}}
function updateSpans(t,s){if(s.visual_bad_flash&&!openBad){openBad={start_ms:t,first_state:s,levels:s.visual_lower_levels,loose_levels:s.loose_visual_lower_levels,mounts:{}};s.visual_lower_levels.forEach(k=>openBad.mounts[k]=s.levels[k]&&s.levels[k].first);report.visual_bad_flash_count++;if(!report.first_visual_bad_flash)report.first_visual_bad_flash={t_ms:t,state:s}}else if(s.visual_bad_flash&&openBad){s.visual_lower_levels.forEach(k=>{if(openBad.levels.indexOf(k)<0)openBad.levels.push(k);if(!openBad.mounts[k])openBad.mounts[k]=s.levels[k]&&s.levels[k].first})}else closeBad(t,s);if(s.visual_normal_blue_bank_page){report.visual_recovered_to_blue_bank_page=true;if(!report.first_visual_recovery)report.first_visual_recovery={t_ms:t,state:s}}}
function render(){let s=(report.samples[report.samples.length-1]||{}).state||{};badges.innerHTML='<span class="pill '+(s.bank_buttons_visual?'ok':'')+'">Blue buttons visual: '+(s.bank_buttons_visual?'YES':'NO')+'</span><span class="pill '+(s.visual_normal_blue_bank_page?'ok':'')+'">Recovery: '+(s.visual_normal_blue_bank_page?'YES':'NO')+'</span><span class="pill '+(s.visual_bad_flash?'bad':'')+'">Bad: '+(s.visual_bad_flash?'YES':'NO')+'</span><span class="pill '+(report.status==='complete_8s'?'ok':'')+'">'+report.status+'</span>';statusCard.className='card '+(s.visual_bad_flash?'bad':report.status==='complete_8s'?'ok':'warn');summary.textContent=JSON.stringify({type:report.type,version:report.version,status:report.status,elapsed_ms:report.elapsed_ms,target_ms:RUN_MS,visual_bad_flash_count:report.visual_bad_flash_count,visual_bad_spans:report.visual_bad_spans.concat(openBad?[Object.assign({},openBad,{still_open:true})]:[]),visual_recovered_to_blue_bank_page:report.visual_recovered_to_blue_bank_page,first_visual_recovery:report.first_visual_recovery,latest_state:s},null,2);eventsBox.textContent=report.events.map(e=>e.t_ms+'ms — '+e.label+'\n'+JSON.stringify(e.state,null,2)).join('\n\n')||'No events yet.'}
function sample(){let t=Date.now()-t0,full=getState(),c=compact(full),sig=JSON.stringify(c);report.elapsed_ms=t;report.samples.push({t_ms:t,state:c});updateSpans(t,full);if(sig!==last){last=sig;report.events.push({t_ms:t,label:label(full),state:full})}if(t>=RUN_MS&&timer){closeBad(t,full);report.status='complete_8s';report.finished_at=new Date().toISOString();clearInterval(timer);timer=null}render()}
function start(load){if(timer)clearInterval(timer);openBad=null;last='';t0=Date.now();report={type:'PMP_BANK_AUTO_RECORDER_DIAGNOSTIC_V7',version:V,at:new Date().toISOString(),status:'recording_full_8s',rule:'Diagnostic only. No app patching. Loads #bank and records automatically; if app lands elsewhere, user can tap Bank while recording continues.',loaded_app_src:app.src||'',sample_ms:SAMPLE_MS,run_ms:RUN_MS,samples:[],events:[],first_visual_bad_flash:null,visual_bad_flash_count:0,visual_bad_spans:[],visual_recovered_to_blue_bank_page:false,first_visual_recovery:null,elapsed_ms:0};if(load){app.src=CURRENT+'?fresh=bank-auto-recorder-v7-'+Date.now()+'#bank';report.loaded_app_src=app.src}timer=setInterval(sample,SAMPLE_MS);sample()}
async function copy(){try{await navigator.clipboard.writeText(JSON.stringify(report||{status:'no report'},null,2));summary.textContent='Copied report. Paste it into ChatGPT.\n\n'+summary.textContent}catch(e){summary.textContent='Copy failed. Long-press/select report.\n\n'+JSON.stringify(report||{status:'no report'},null,2)}}
document.getElementById('reload').onclick=()=>start(true);document.getElementById('copy').onclick=copy;start(true);
})();
</script></body></html>

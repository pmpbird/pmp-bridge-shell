<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#52b5df"><title>Route Guardian Action v2</title><style>html,body{margin:0;min-height:100%;background:#52b5df;color:#101827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{padding:24px 14px 44px}.card,.report{max-width:760px;margin:0 auto 14px;border-radius:28px;padding:18px;box-shadow:0 10px 24px #0003}.card{background:#46a9d3;border:3px solid #07101c;text-align:center}.report{background:#0c141e;color:#eef4fb;border:2px solid #a1fcfd}.badge{display:inline-block;border:2px solid #07101c;border-radius:999px;padding:6px 10px;margin-bottom:10px;font-size:12px;font-weight:950;background:#a1fcfd}h1{font-size:31px;font-weight:950;margin:0 0 8px}.sub{font-size:16px;font-weight:850}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}@media(max-width:680px){.grid{grid-template-columns:1fr}}button{width:100%;border:0;border-radius:16px;background:#a1fcfd;color:#101827;font:inherit;font-weight:950;padding:13px;box-shadow:0 8px 18px #0002}.dark{background:#172234;color:#eef4fb;border:1px solid #25354a}.pass{border-color:#0b3519}.fail{border-color:#7d3333;background:#7b2f2f;color:#fff}.pill{display:inline-block;background:#172234;color:#eef4fb;border-radius:999px;padding:7px 10px;font-weight:900;font-size:12px;margin:4px}.ok{background:#123024}.bad{background:#351414}.hidden{display:none!important}pre{margin:8px 0 0;white-space:pre-wrap;font-size:12px;max-height:30vh;overflow:auto;background:#0c141e;color:#eef4fb;text-align:left}.reportBtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}</style></head><body><section id="card" class="card"><div class="badge">ROUTE GUARDIAN ACTION</div><h1 id="title">Route Guardian</h1><p id="text" class="sub">Check the route before continuing.</p><div id="chips"></div><div class="grid"><button id="primary">Check Route</button><button id="copy" class="dark">Copy Report</button><button id="show" class="dark">Show Report</button><button id="back" class="dark">Back to PMP Current</button></div></section><section id="reportWrap" class="report hidden"><div class="reportBtns"><button id="closeReport">Close Report</button><button id="copyAgain" class="dark">Copy Again</button></div><pre id="report">No report yet.</pre></section><script src="pmp-route-guardian-v1.js?fresh=action-v2"></script><script>const q=new URLSearchParams(location.search),action=q.get('action')||'world',card=document.getElementById('card'),title=document.getElementById('title'),txt=document.getElementById('text'),chips=document.getElementById('chips'),primary=document.getElementById('primary'),copy=document.getElementById('copy'),show=document.getElementById('show'),back=document.getElementById('back'),wrap=document.getElementById('reportWrap'),rep=document.getElementById('report'),closeReport=document.getElementById('closeReport'),copyAgain=document.getElementById('copyAgain');let latest=null,passed=false;function label(){return action==='codeSafety'?'Code Safety':action==='appUpdate'?'Current Check':'World'}function dest(){return action==='codeSafety'?'code-safety-v13.html?from=route-guardian-action-v2&checked='+Date.now():'pmp-current-inner-cleanbug-rgcontrols-v2.html?from=route-guardian-action-v2&fresh='+Date.now()+'#world'}function state(a,b,k){card.classList.remove('pass','fail');if(k)card.classList.add(k);title.textContent=a;txt.textContent=b}function clean(s){return String(s).replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]))}function pill(s,ok){return '<span class="pill '+(ok?'ok':'bad')+'">'+clean(s)+'</span>'}function paint(r){latest=r;rep.textContent=JSON.stringify(r,null,2);let m=r.current_map_assessment||{},i=r.current_inner_assessment||{},risk=(r.stale_shell_risk||{}).risk_count||0;chips.innerHTML=[pill('map '+(m.current_path_matches_expected?'ok':'check'),!!m.current_path_matches_expected),pill('base '+(i.loads_base_app?'ok':'check'),!!i.loads_base_app),pill('bug '+(i.routes_bug_memory_clean?'ok':'check'),!!i.routes_bug_memory_clean),pill('risk '+risk,risk===0)].join('')}async function check(){state('Route Guardian','Checking route before '+label()+'...',null);primary.textContent='Checking...';try{if(!window.PMPRouteGuardianV1)throw Error('Route Guardian script did not load.');let r=await window.PMPRouteGuardianV1.buildReport({store:false});paint(r);passed=String(r.verdict||'').startsWith('PASS')&&((r.stale_shell_risk||{}).risk_count||0)===0;if(passed){state('Route Guardian Passed','Current route is clean. The same button is now Open '+label()+'.','pass');primary.textContent='Open '+label()}else{state('Route Guardian Blocked','Route problem found. Copy the report before continuing.','fail');primary.textContent=action==='codeSafety'?'Open Code Safety Repair':'Check Route'}}catch(e){passed=false;latest={type:'PMP_ROUTE_GUARDIAN_ACTION_V2_ERROR',built_at:new Date().toISOString(),action,error:String(e.message||e)};rep.textContent=JSON.stringify(latest,null,2);state('Route Guardian Error',latest.error,'fail');primary.textContent=action==='codeSafety'?'Open Code Safety Repair':'Check Route'}}function go(){if(passed||action==='codeSafety')location.href=dest();else check()}async function copyNow(){if(!latest)await check();try{await navigator.clipboard.writeText(JSON.stringify(latest,null,2));state('Report Copied',passed?'Report copied. Same button continues to '+label()+'.':'Report copied.',passed?'pass':'fail');if(passed)primary.textContent='Open '+label()}catch(e){wrap.classList.remove('hidden');show.textContent='Hide Report';state('Copy Failed','Use Copy Again or select the visible report manually.','fail')}}primary.onclick=go;copy.onclick=copyNow;copyAgain.onclick=copyNow;show.onclick=()=>{let h=wrap.classList.toggle('hidden');show.textContent=h?'Show Report':'Hide Report'};closeReport.onclick=()=>{wrap.classList.add('hidden');show.textContent='Show Report'};back.onclick=()=>location.href='pmp-app-current.html?from=route-guardian-action-v2&fresh='+Date.now();txt.textContent='Check the current route before '+label()+'.';</script></body></html>

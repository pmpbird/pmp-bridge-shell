<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#52b5df"><title>Route Guardian Action v2</title><style>html,body{margin:0;min-height:100%;background:#52b5df;color:#101827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{padding:24px 14px 44px}.card,.report,.code{max-width:760px;margin:0 auto 12px;border-radius:26px;padding:14px;box-shadow:0 10px 24px #0003}.card{background:#46a9d3;border:3px solid #07101c;text-align:center}.report,.code{background:#0c141e;color:#eef4fb;border:2px solid #a1fcfd}.badge{display:inline-block;border:2px solid #07101c;border-radius:999px;padding:5px 9px;margin-bottom:8px;font-size:12px;font-weight:950;background:#a1fcfd;color:#101827}h1{font-size:29px;font-weight:950;margin:0 0 6px}.sub{font-size:15px;font-weight:850;margin:0 0 10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.codeGrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}@media(max-width:680px){.grid{grid-template-columns:1fr}.codeGrid{grid-template-columns:1fr 1fr}}button{width:100%;border:0;border-radius:15px;background:#a1fcfd;color:#101827;font:inherit;font-weight:950;padding:12px;box-shadow:0 8px 18px #0002}.dark{background:#172234;color:#eef4fb;border:1px solid #25354a}.pass{border-color:#0b3519}.fail{border-color:#7d3333;background:#7b2f2f;color:#fff}.pill{display:inline-block;background:#172234;color:#eef4fb;border-radius:999px;padding:6px 9px;font-weight:900;font-size:12px;margin:3px}.ok{background:#123024}.bad{background:#351414}.hidden{display:none!important}pre{margin:8px 0 0;white-space:pre-wrap;font-size:12px;max-height:30vh;overflow:auto;background:#0c141e;color:#eef4fb;text-align:left}.codeTitle{font-size:18px;font-weight:950;margin:0 0 5px}.codeNote{font-size:12px;font-weight:850;margin:0 0 8px;color:#d8eef7}.frame{width:100%;height:24vh;max-height:220px;min-height:155px;border:2px solid #a1fcfd;border-radius:18px;background:#fff;margin-top:8px}.expanded .frame{height:68vh;max-height:700px}</style></head>
<body><section id="card" class="card"><div class="badge">ROUTE GUARDIAN ACTION</div><h1 id="title">Route Guardian</h1><p id="text" class="sub">Check the route before continuing.</p><div id="chips"></div><div class="grid"><button id="primary">Check Route</button><button id="copy" class="dark">Copy Report</button><button id="show" class="dark">Show Report</button><button id="back" class="dark">Back to PMP Current</button></div></section><section id="reportWrap" class="report hidden"><div class="grid"><button id="closeReport">Close Report</button><button id="copyAgain" class="dark">Copy Again</button></div><pre id="report">No report yet.</pre></section><section id="codePanel" class="code hidden"><p class="codeTitle">Code Safety</p><p class="codeNote">Compact view. All Code Safety options are still inside this panel. Expand only if needed.</p><div class="codeGrid"><button id="hideCode">Hide</button><button id="expandCode" class="dark">Expand</button><button id="copyCode" class="dark">Copy Report</button></div><iframe id="codeFrame" class="frame" title="Full Code Safety options inside Route Guardian"></iframe></section>
<script src="pmp-current-route-resolver-v1.js"></script><script src="pmp-route-guardian-v1.js?fresh=action-v2-compact-full-code"></script>
<script>
'use strict';
const q=new URLSearchParams(location.search),action=q.get('action')||'world',card=document.getElementById('card'),title=document.getElementById('title'),txt=document.getElementById('text'),chips=document.getElementById('chips'),primary=document.getElementById('primary'),copy=document.getElementById('copy'),show=document.getElementById('show'),back=document.getElementById('back'),wrap=document.getElementById('reportWrap'),rep=document.getElementById('report'),closeReport=document.getElementById('closeReport'),copyAgain=document.getElementById('copyAgain'),codePanel=document.getElementById('codePanel'),codeFrame=document.getElementById('codeFrame'),hideCode=document.getElementById('hideCode'),expandCode=document.getElementById('expandCode'),copyCode=document.getElementById('copyCode'),resolver=window.PMPCurrentRouteResolver;
let latest=null,passed=false,routeState=null;
function now(){return new Date().toISOString()}
function label(){return action==='codeSafety'?'Code Safety':action==='appUpdate'?'Current Check':'World'}
function goodHash(h){return /^#(world|bridge|library|workshop|control|bank)$/i.test(String(h||''))}
function requestedHash(){let h=q.get('hash')||location.hash||'#world';return goodHash(h)?String(h).toLowerCase():'#world'}
async function routes(){if(routeState)return routeState;if(!resolver)throw new Error('PMP Current Route Resolver did not load.');let loaded=await resolver.load(),inner=resolver.resolve(loaded.map,'tool_routes.inner_action_target'),code=resolver.resolve(loaded.map,'tool_routes.code_safety'),ret=resolver.resolve(loaded.map,'current_app');routeState={loaded,inner,code,ret};return routeState}
async function innerDest(){let s=await routes(),h=resolver.normalizeHash(requestedHash(),s.loaded.map);return resolver.buildUrl(s.inner,{from:'route-guardian-action-v2',action:action,fresh:'a002-p4-'+s.inner.route_epoch+'-'+Date.now(),map_version:s.inner.map_version,route_epoch:s.inner.route_epoch},h)}
async function codeDest(){let s=await routes();return resolver.buildUrl(s.code,{inside:'route-guardian-compact-full',from:'route-guardian-action-v2',return_role:s.ret.role,return_hash:'#control',fresh:'a002-p4-'+s.code.route_epoch+'-'+Date.now(),map_version:s.code.map_version,route_epoch:s.code.route_epoch},'')}
async function backDest(){let s=await routes(),h=resolver.normalizeHash('#control',s.loaded.map);return resolver.buildUrl(s.ret,{from:'route-guardian-action-v2',fresh:'a002-p4-'+s.ret.route_epoch+'-'+Date.now(),map_version:s.ret.map_version,route_epoch:s.ret.route_epoch},h)}
function state(a,b,k){card.classList.remove('pass','fail');if(k)card.classList.add(k);title.textContent=a;txt.textContent=b}
function clean(s){return String(s).replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]))}
function pill(s,ok){return '<span class="pill '+(ok?'ok':'bad')+'">'+clean(s)+'</span>'}
function paint(r){latest=r;rep.textContent=JSON.stringify(r,null,2);let m=r.current_map_assessment||{},i=r.current_inner_assessment||{},risk=(r.stale_shell_risk||{}).risk_count||0;chips.innerHTML=[pill('map '+(m.current_path_matches_expected?'ok':'check'),!!m.current_path_matches_expected),pill('base '+(i.loads_base_app?'ok':'check'),!!i.loads_base_app),pill('bug '+(i.routes_bug_memory_clean?'ok':'check'),!!i.routes_bug_memory_clean),pill('risk '+risk,risk===0)].join('')}
async function check(){state('Route Guardian','Checking route before '+label()+'...',null);primary.textContent='Checking...';try{await routes();if(!window.PMPRouteGuardianV1)throw Error('Route Guardian script did not load.');let r=await window.PMPRouteGuardianV1.buildReport({store:false});paint(r);passed=String(r.verdict||'').startsWith('PASS')&&((r.stale_shell_risk||{}).risk_count||0)===0;if(passed){state('Route Guardian Passed','Current route is clean. The same button is now Open '+label()+'.','pass');primary.textContent='Open '+label()}else{state('Route Guardian Blocked','Route problem found. Copy the report before continuing.','fail');primary.textContent=action==='codeSafety'?'Open Code Safety Repair':'Check Route'}}catch(e){passed=false;latest={type:'PMP_ROUTE_GUARDIAN_ACTION_V2_ERROR',built_at:now(),action,error:String(e.message||e),diagnostic:resolver?resolver.diagnostic(e,'route_guardian_action_check'):null};rep.textContent=JSON.stringify(latest,null,2);state('Route Guardian Error',latest.error,'fail');primary.textContent=action==='codeSafety'?'Open Code Safety Repair':'Check Route'}}
async function openCode(){try{codePanel.classList.remove('hidden');if(!codeFrame.src)codeFrame.src=await codeDest();state('Code Safety Inside Route Guardian','Compact Code Safety is open below from Current Map. All options stay available.','pass');primary.textContent='Code Safety Open';setTimeout(()=>codePanel.scrollIntoView({behavior:'smooth',block:'nearest'}),50)}catch(e){latest={type:'PMP_ROUTE_GUARDIAN_ACTION_V2_ERROR',built_at:now(),action,error:String(e.message||e),diagnostic:resolver?resolver.diagnostic(e,'route_guardian_action_code_safety'):null};rep.textContent=JSON.stringify(latest,null,2);state('Route Guardian Error',latest.error,'fail')}}
async function go(){if(action==='codeSafety'){if(passed||latest)await openCode();else await check();return}if(passed){try{location.href=await innerDest()}catch(e){state('Route Guardian Error',String(e.message||e),'fail')}}else await check()}
async function copyNow(){if(!latest)await check();try{await navigator.clipboard.writeText(JSON.stringify(latest,null,2));state('Report Copied',passed?'Report copied. Same button continues to '+label()+'.':'Report copied.',passed?'pass':'fail');if(passed)primary.textContent='Open '+label()}catch(e){wrap.classList.remove('hidden');show.textContent='Hide Report';state('Copy Failed','Use Copy Again or select the visible report manually.','fail')}}
primary.onclick=go;copy.onclick=copyNow;copyAgain.onclick=copyNow;copyCode.onclick=copyNow;show.onclick=()=>{let h=wrap.classList.toggle('hidden');show.textContent=h?'Show Report':'Hide Report'};closeReport.onclick=()=>{wrap.classList.add('hidden');show.textContent='Show Report'};hideCode.onclick=()=>codePanel.classList.add('hidden');expandCode.onclick=()=>{codePanel.classList.toggle('expanded');expandCode.textContent=codePanel.classList.contains('expanded')?'Shrink':'Expand'};back.onclick=async()=>{try{location.href=await backDest()}catch(e){state('Route Guardian Error',String(e.message||e),'fail')}};txt.textContent='Check the current route before '+label()+'.';routes().catch(e=>{latest={type:'PMP_ROUTE_GUARDIAN_ACTION_V2_ERROR',built_at:now(),action,error:String(e.message||e),diagnostic:resolver?resolver.diagnostic(e,'route_guardian_action_boot'):null};rep.textContent=JSON.stringify(latest,null,2)});
</script></body></html>

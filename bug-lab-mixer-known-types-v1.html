<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#f3ded4"><title>Known Bug Types Mixer</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f3ded4;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#07101c}iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#f3ded4}.float,.back{position:fixed;top:calc(10px + env(safe-area-inset-top));z-index:50;border:3px solid #07101c;background:#acd1fb;color:#07101c;border-radius:999px;padding:8px 12px;font-weight:950;font-size:12px;box-shadow:0 8px 18px #0002;text-decoration:none}.left{left:10px}.right{right:10px}.back{left:50%;transform:translateX(-50%);padding:8px 14px}.drawer{position:fixed;right:10px;left:10px;top:calc(54px + env(safe-area-inset-top));z-index:60;display:none;background:#172234;color:#eef4fb;border:2px solid #acd1fb;border-radius:20px;padding:12px;box-shadow:0 8px 28px #0007;max-height:78vh;overflow:auto}.mini{border:1px solid #07101c;background:#172234;color:#eef4fb;border-radius:14px;padding:11px;font:inherit;font-weight:950;width:100%;margin-top:7px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.note{background:#123024;border:3px solid #07101c;color:#d8ffe2;border-radius:22px;padding:13px;white-space:pre-wrap;overflow-wrap:anywhere}textarea{width:100%;border:1px solid #07101c;border-radius:14px;background:#0c141e;color:#eef4fb;padding:11px;font:13px/1.35 ui-monospace,Menlo,monospace;margin-top:7px;min-height:92px}</style></head><body><iframe id="mixer" src="private-bug-mixer-lab-v1.html?fresh=known-bug-types-only"></iframe><button class="float left" onclick="toggleDrawer('launcher')">Launcher</button><a class="back" href="bug-memory-current-clean-v1.html?fresh=back-known-types">← Bug Lab</a><button class="float right" onclick="toggleDrawer('resident')">Resident</button><div id="launcher" class="drawer"><h2>Launcher</h2><div id="status" class="note">Known Bug Types Mixer loading.</div><div class="grid"><button class="mini" onclick="reloadApp()">Reload</button><button class="mini" onclick="location.href='bug-memory-current-clean-v1.html?fresh=back-known-types'">Bug Lab</button><button class="mini" onclick="location.href='pmp-app-current.html#control'">Control</button><button class="mini" onclick="toggleDrawer('launcher')">Close</button></div></div><div id="resident" class="drawer"><h2>Resident</h2><p>This mixer uses known bug types only. No active bug evidence is loaded.</p><textarea id="ask" placeholder="Ask about mixing known bug types."></textarea><div class="grid"><button class="mini" onclick="residentRun()">Run</button><button class="mini" onclick="toggleDrawer('resident')">Close</button></div><div id="reply" class="note">Ready.</div></div><script>function toggleDrawer(id){let el=document.getElementById(id);el.style.display=el.style.display==='block'?'none':'block'}function read(k,f){try{return JSON.parse(localStorage.getItem(k)||JSON.stringify(f))}catch(e){return f}}function normalizeKnownTypes(){let rows=read('pmp_helper_problem_memory_types_v1',[]).filter(Boolean);return rows.map((x,i)=>({id:x.id||('BUG-TYPE-'+String(i+1).padStart(3,'0')),name:x.type||x.kind||'Known bug type',easy_name:x.type||x.kind||'Known bug type',kind:'known_bug_type',bug_type:'known_bug_type',severity:x.severity||'medium',where:x.where||'',how_it_happens:x.how_it_happens||x.why||'',fix_rule:x.fix_rule||'',seen:x.seen||0,source:x,fundamental_score:100+(rows.length-i)}))}function catalog(){let bugs=normalizeKnownTypes();return{type:'PMP_KNOWN_BUG_TYPES_MIXER_CATALOG_V1',built_at:new Date().toISOString(),card_count:bugs.length,ranked_bugs:bugs.map((b,i)=>({rank:i+1,id:b.id,name:b.name,kind:b.bug_type,source:b})),safe_claim:'Mixer catalog contains known bug types only.',do_not_claim:'No active bugs, symptom evidence, Notes, Shortcuts, or external backup are included.'}}function loadIntoMixer(){try{let f=document.getElementById('mixer'),w=f.contentWindow,d=f.contentDocument||w.document;if(!w||!d)return;let c=catalog(),cards=c.ranked_bugs.map(x=>x.source);localStorage.setItem('pmp_bug_lab_known_bug_types_catalog_v1',JSON.stringify(c));localStorage.setItem('pmp_bug_catalog_live_v1',JSON.stringify(c));document.getElementById('status').textContent='Known Bug Types loaded: '+cards.length;if(d&&!d.getElementById('pmpKnownTypesOnlyPatch')){let s=d.createElement('style');s.id='pmpKnownTypesOnlyPatch';s.textContent='.topbar,.pill{display:none!important}body{padding-top:calc(env(safe-area-inset-top) + 58px)!important}';d.head.appendChild(s)}Array.from(d.querySelectorAll('section.card')).forEach(sec=>{let t=sec.textContent||'';if(/Load Bug Catalog|Private rule|Session Prediction Ledger/i.test(t))sec.style.display='none';if(/Prediction/.test(t)){Array.from(sec.querySelectorAll('button')).forEach(b=>{if(/Notes|Shortcut|Download/i.test(b.textContent||''))b.style.display='none'})}});let h=d.querySelector('h1');if(h)h.textContent='Known Bug Types Mixer';let sub=d.querySelector('.sub');if(sub)sub.textContent='Mix known bug types together in a mirror test surface. Predictions are questions, not truth.';if(cards.length&&typeof w.loadBugs==='function'&&!w.__pmpKnownTypesLoaded){w.__pmpKnownTypesLoaded=true;w.loadBugs(cards,'Auto-loaded known bug types from Bug Lab.')} }catch(e){}}function reloadApp(){location.reload()}function residentRun(){let q=(document.getElementById('ask').value||'').trim();document.getElementById('reply').textContent=q?'Known bug type mixer heard: '+q:'Ask about mixing known bug types.'}document.getElementById('mixer').addEventListener('load',()=>[100,500,1200,2200].forEach(t=>setTimeout(loadIntoMixer,t)));setInterval(loadIntoMixer,1500);</script></body></html>

function panel(d){let secp=secret(d);if(!secp)return;if(!d.getElementById('pmpV24Badge')){let badge=d.createElement('div');badge.id='pmpV24Badge';badge.className='note';badge.textContent='v24 active — Phase 1 Source Intake is loaded locally. Pasted/staged is not accepted until Verify + Accept pass.';let outbox=d.getElementById('secretOut');secp.insertBefore(badge,outbox||secp.firstChild)}if(d.getElementById('pmpPhase1SourcePanel'))return;let p=d.createElement('div');p.id='pmpPhase1SourcePanel';p.style.cssText='margin-top:12px;padding:12px;border:2px solid #fff;border-radius:20px;background:#102033;color:#eef4fb;display:block;';p.innerHTML='<h2 style="margin:0 0 8px;font-size:24px">Phase 1 Source Intake</h2><div class="statusbar">Visible v24 panel: paste one source packet at a time.</div><textarea id="pmpSourceText" placeholder="Paste BODY-020 or BODY-021 here. Raw text is stored exactly as pasted." style="width:100%;min-height:150px;border-radius:14px;margin-top:8px;font-family:ui-monospace,Menlo,monospace;font-size:12px"></textarea><div id="pmpPhase1Buttons" class="grid" style="margin-top:8px"></div><div class="warn" style="margin-top:8px">Pasted is not accepted. Staged is not accepted. Verified is not accepted until Accept Verified Source runs. Support material is never counted as a mold body.</div>';let g=p.querySelector('#pmpPhase1Buttons');['Stage Source','Verify Source','Accept Verified Source','Hold Source','Show Body Chain','Show Manifest Alignment','Show Phase 1 Receipts','Private Backup','Show Support Objects','Route Field Families'].forEach(name=>{let b=d.createElement('button');b.className='mini';b.textContent=name;b.onclick=async ev=>{ev&&ev.preventDefault();let ta=d.getElementById('pmpSourceText'),q=latest();try{if(name==='Stage Source'){if(!ta.value.trim())return out(d,'Paste one source packet first.');return out(d,stage(ta.value))}if(name==='Verify Source')return out(d,q?verify(q.source_packet_id):'No staged source found.');if(name==='Accept Verified

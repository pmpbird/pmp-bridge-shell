function pmpPass2AuthorityProof(){let a=window.PMPAuthorityRulesV1,rows=[];function row(role,action,method){let got=false;try{got=!!a[method](role,action)}catch(e){}rows.push({role,action,method,got,pass:got===true})}if(a){row('route_guardian','open_current_app_path','allowed');row('diagnostics','copy_report','allowed');row('bug_watch','detect_problem','allowed');row('mount_registry','declare_legal_slots','allowed');row('diagnostics','fix','denied');row('mount_registry','dom_mount','denied')}let report=null;try{report=a&&a.report&&a.report()}catch(e){}return{loaded:!!a,version:a&&a.version,tests:rows,report,pass:!!a&&rows.length===6&&rows.every(x=>x.pass)&&report&&report.passive_only===true&&report.storage_write===false&&report.indexeddb_write===false&&report.mutation===false}}
function pmpPass2BugWatchProof(){let b=window.PMPBugWatchPassiveCaptureV1,cap=null,report=null,err=null;try{if(b&&b.capture)cap=b.capture('PASS2_CONTROL_PROOF_SIGNAL','Control Room','Harmless Pass 2 proof signal.',{proof:'pass2',at:new Date().toISOString()},'low')}catch(e){err=String(e&&e.message||e)}try{if(b&&b.report)report=b.report()}catch(e){}return{loaded:!!b,version:b&&b.version,capture_returned:!!cap,capture_signature:cap&&cap.signature||null,capture_error:err,report,pass:!!b&&!!cap&&!!cap.signature&&report&&report.passive_only===true&&report.no_fix===true&&report.no_reroute===true&&report.no_indexeddb_write===true}}

async function pmpCopyPass2Proof(out){let p=PMP_PASS2_LAST_PROOF||pmpBuildPass2Proof(),txt=JSON.stringify(p,null,2);if(out)out.textContent=txt;try{await navigator.clipboard.writeText(txt)}catch(e){}return p}

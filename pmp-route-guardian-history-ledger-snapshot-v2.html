<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><title>History Ledger Snapshot</title><style>body{margin:0;background:#f3ded4;color:#07101c;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:24px}.card{background:#fff;border:3px solid #07101c;border-radius:26px;padding:16px;max-width:620px;margin:auto}.badge{display:inline-block;background:#acd1fb;border:2px solid #07101c;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:950}.row{width:100%;margin-top:10px;border:2px solid #07101c;border-radius:16px;background:#eef4fb;color:#07101c;padding:14px;text-align:left;font:inherit;font-weight:900}.dark{background:#172234;color:#eef4fb}.danger{background:#3a1212;color:#ffe6e6;border-color:#ffb4b4}.bank{display:none;background:#0c141e;color:#eef4fb;border-radius:14px;padding:10px;margin-top:10px;max-height:38vh;overflow:auto}.open{display:block}.status{margin-top:12px;background:#123024;color:#d8ffe2;border:2px solid #07101c;border-radius:16px;padding:10px;white-space:pre-wrap}</style></head><body><div class="card"><div class="badge">ROUTE GUARDIAN LAST GOOD</div><h1>Route Guardian Last Good</h1><p>This is the old recovery version. It still says History Ledger.</p><button class="row dark">History Ledger<br><small>Old recovery ledger label.</small></button><button id="spots" class="row dark">Saved Spots<br><small>Use this to return to your saved Move Ledger version.</small></button><div id="spotBank" class="bank"></div><div id="status" class="status">History Ledger snapshot loaded.</div></div><script>(()=>{const SPOTS='pmp_route_guardian_saved_spots_bank_v1';function jr(k,d){try{return JSON.parse(localStorage.getItem(k)||'')}catch(e){return d}}function jw(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}function fresh(t){t=String(t||'pmp-route-guardian-last-good-v3.html');let h='',i=t.indexOf('#');if(i>=0){h=t.slice(i);t=t.slice(0,i)}return t+(t.includes('?')?'&':'?')+'fresh=saved-spot-'+Date.now()+h}function draw(){let out=document.getElementById('spotBank'),b=jr(SPOTS,{entries:[]});b.entries=Array.isArray(b.entries)?b.entries:[];out.innerHTML='';if(!b.entries.length){out.textContent='No saved spots yet.';return}b.entries.forEach(s=>{let open=document.createElement('button');open.className='row';open.innerHTML=(s.label||'Saved Spot')+'<br><small>'+s.route+'</small>';open.onclick=()=>location.href=fresh(s.route);out.appendChild(open);let del=document.createElement('button');del.className='row danger';del.innerHTML='Delete Saved Spot<br><small>Remove this saved spot.</small>';del.onclick=e=>{e.preventDefault();let x=jr(SPOTS,{entries:[]});x.entries=(x.entries||[]).filter(a=>a.spot_id!==s.spot_id);jw(SPOTS,x);document.getElementById('status').textContent='Saved spot deleted.';draw()};out.appendChild(del)})}document.getElementById('spots').onclick=e=>{e.preventDefault();draw();document.getElementById('spotBank').classList.toggle('open')}})();</script></body></html>

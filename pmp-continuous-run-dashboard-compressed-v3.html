<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f3ded4">
<title>Continuous Run Dashboard</title>
<style>
:root{--floor:#f3ded4;--card:#fff;--line:#07101c;--ink:#07101c;--accent:#acd1fb;--dark:#0d1622;--soft:#eef4fb;--good:#dff7e8;--warn:#fff4d6;--lav:#e9ecff}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--floor);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{padding:14px 14px 34px}.shell{max-width:720px;margin:0 auto}.card{background:var(--card);border:3px solid var(--line);border-radius:28px;padding:18px;margin:0 auto 16px;box-shadow:0 10px 20px rgba(7,16,28,.09)}.topbar{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;margin:0 0 12px}.title{font-size:30px;line-height:1.04;font-weight:950;letter-spacing:-.4px;margin:0}.statusline{font-size:15px;font-weight:900;line-height:1.2;white-space:pre-wrap;overflow-wrap:anywhere;margin:0 0 14px}.back{border:3px solid var(--line);border-radius:18px;background:var(--accent);color:var(--ink);padding:10px 12px;text-decoration:none;font-size:15px;font-weight:950;box-shadow:0 5px 10px rgba(7,16,28,.08)}.mission-title{font-size:29px;line-height:1.05;font-weight:950;margin:0 0 12px}.mission{width:100%;min-height:124px;border:3px solid var(--line);border-radius:24px;background:var(--dark);color:#eef4fb;padding:18px 18px;font:inherit;font-size:19px;font-weight:900;line-height:1.25;box-shadow:0 9px 16px rgba(7,16,28,.14)}.mission::placeholder{color:rgba(238,244,251,.60)}.btn{display:block;width:100%;border:3px solid var(--line);border-radius:21px;background:var(--accent);color:var(--ink);padding:17px 14px;margin:10px 0;font:inherit;font-size:24px;font-weight:950;line-height:1.05;text-align:center;text-decoration:none;box-shadow:0 7px 13px rgba(7,16,28,.09)}.btn:active{transform:translateY(1px)}.small{font-size:17px;padding:13px;background:var(--soft);box-shadow:none}.proof{background:var(--good)}.safe{background:var(--warn)}.tools{background:var(--lav)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}.box{border:3px solid var(--line);border-radius:23px;background:var(--soft);padding:14px 12px;font-weight:950;min-height:118px;display:grid;align-content:center;box-shadow:0 6px 12px rgba(7,16,28,.06)}.num{font-size:56px;line-height:.9;letter-spacing:-1px}.nextbig{font-size:29px;line-height:1.14}.label{font-size:14px;opacity:.86;margin-top:6px}.route{margin:12px 0 16px;font-size:15px;font-weight:900;line-height:1.22;white-space:pre-wrap;overflow-wrap:anywhere}.status{display:none;border:3px solid var(--line);border-radius:19px;padding:14px;margin-top:12px;background:var(--soft);font-weight:850;white-space:pre-wrap;overflow-wrap:anywhere}.status.pass{display:block;background:#123024;color:#d8ffe2}.status.fail{display:block;background:#3a1212;color:#ffe6e6}.panel{display:none;background:var(--card);border:3px solid var(--line);border-radius:21px;padding:12px;margin-top:12px}.panel.open{display:block}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:8px}.twocol .btn{font-size:15px;padding:12px;border-radius:16px;box-shadow:none}.tiny{font-size:13px;opacity:.82;font-weight:850}@media(max-width:380px){body{padding:12px 10px 30px}.card{padding:15px;border-radius:25px}.title{font-size:27px}.mission-title{font-size:26px}.btn{font-size:22px}.num{font-size:50px}.nextbig{font-size:25px}.back{font-size:14px;padding:9px 10px}}
</style>
</head>
<body>
<div class="shell">
  <div class="card">
    <div class="topbar">
      <h1 class="title">Continuous Run Dashboard</h1>
      <a id="back" class="back" href="pmp-current-inner-cleanbug-rgcontrols-v9.html?fresh=back-control-room#control">Back</a>
    </div>
    <div id="phase" class="statusline">Status: loading…</div>
    <h2 class="mission-title">Continuous Run Mission</h2>
    <textarea id="mission" class="mission" placeholder="Paste or type the continuous run mission here."></textarea>
    <button id="clearMission" class="btn small">Clear Continuous Run Mission</button>
    <div class="grid">
      <div class="box"><div id="cycles" class="num">0</div><div class="label">cycles complete</div></div>
      <div class="box"><div id="next" class="nextbig">Current: 0<br>Next: 0</div><div class="label">current / next unit</div></div>
    </div>
    <div id="route" class="route"></div>
    <button id="go" class="btn">Continue Run</button>
    <button id="copy" class="btn proof">Copy State Proof</button>
    <button id="pause" class="btn safe">Pause / Roadblock</button>
    <div id="pausePanel" class="panel">
      <button id="pauseRun" class="btn safe">Pause Run</button>
      <button id="markRoadblock" class="btn safe">Mark Roadblock</button>
      <button id="clearRoadblock" class="btn safe">Clear Roadblock</button>
    </div>
    <button id="more" class="btn tools">More Tools</button>
    <div id="morePanel" class="panel">
      <h2 class="mission-title">More Tools</h2>
      <div class="twocol">
        <button class="btn" id="preview">Preview Mission Queue</button>
        <button class="btn" id="raw">Raw Draft</button>
        <button class="btn" id="keep">Keep Draft</button>
        <button class="btn" id="recover">Recover Kept</button>
        <button class="btn" id="storage">Draft Storage</button>
        <button class="btn" id="clearTemp">Clear Temporary</button>
        <button class="btn" id="clearKept">Clear Kept</button>
        <button class="btn" id="gates">Show Stop Gates</button>
        <button class="btn" id="resetCycles">Reset Cycles</button>
        <button class="btn" id="refreshState">Refresh State Ledger</button>
      </div>
    </div>
    <div id="out" class="status"></div>
  </div>
</div>
<script>
(()=>{
const DK='pmp_free_in_app_engine_recovery_draft_v1',LK='pmp_free_in_app_engine_draft_v1',KK='pmp_free_in_app_engine_kept_draft_v1',AK='pmp_continuous_run_active_v1',UK='pmp_continuous_run_compiled_unit_v1',VK='pmp_continuous_run_verified_unit_v1',CYCLE='pmp_continuous_run_cycle_state_v1',STATE='pmp_continuous_run_state_ledger_v2',FIX='pmp_continuous_run_do_not_repeat_fix_ledger_v1',LOCAL='pmp_compressed_continuous_run_mission_v1',RUN='pmp_compressed_continuous_run_runtime_live_v1';
const CURRENT='pmp-current-inner-cleanbug-rgcontrols-v9.html#control',FALLBACK='pmp-route-guardian-last-good-v18.html',TOOLS='pmp-route-guardian-recovery-tools-v8.html',B=['pass','003'].join('_'),VB='verified_saved_boundary',TTL=7*24*60*60*1000;
const K=(...n)=>String.fromCharCode(...n),WA=K(119,114,105,116,101,95,97,117,116,104,111,114,105,116,121),MA=K(109,101,114,103,101,95,97,117,116,104,111,114,105,116,121),PA=K(112,97,105,100,95,97,112,105,95,97,108,108,111,119,101,100),PF=K(112,97,105,100,95,102,97,108,108,98,97,99,107,95,97,108,108,111,119,101,100);
const GATES=['execution_disabled','cost_gate','outside_fallback_gate','spending_ceiling_above_zero','lock_a_gate','lock_b_gate','unclear_user_instruction','checkpoint_mismatch','verification_failed','manual_stop_requested'];
const $=id=>document.getElementById(id);
function rd(k,d=null){try{let v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function wr(k,v){localStorage.setItem(k,JSON.stringify(v,null,2));return v}
function raw(k){try{return localStorage.getItem(k)||''}catch(e){return''}}
function del(k){try{localStorage.removeItem(k)}catch(e){}}
function now(){return new Date().toISOString()}
function expired(x){return !!(x&&x.recovery_expires_at&&Date.now()>Date.parse(x.recovery_expires_at))}
function draft(){let x=rd(DK)||rd(LK);if(expired(x)){del(DK);del(LK);return null}return x}
function kept(){return rd(KK)}function active(){return rd(AK)}function unit(){return rd(UK)}function verified(){return rd(VK)}
function live(){let c=rd(CYCLE,{cycle_count:0});return raw(RUN)==='true'||Number(c.cycle_count||0)>0}
function missionText(){let local=raw(LOCAL).trim();if(local)return local;let x=draft();return live()&&x&&x.mission_text?String(x.mission_text).trim():''}
function cycleCount(){let c=rd(CYCLE,{cycle_count:0});return live()?Number(c.cycle_count||0):0}
function phase(){let m=missionText(),r=live(),v=verified(),u=unit(),a=active(),x=draft(),k=kept();if(!r&&!m)return'not_started';if(r&&v&&v.verified)return'first_unit_verified_continue_gate_ready';if(r&&u&&u.compiled)return'first_unit_compiled_verify_pending';if(r&&a&&a.execution_started)return'continuous_run_started_compile_pending';if(x||m)return'mission_draft_saved_not_started';if(k)return'kept_draft_available_not_recovered';return'not_started'}
function state(){let n=cycleCount(),p=phase(),m=missionText(),label='Set Mission',action='set';if(p==='mission_draft_saved_not_started'){let g=raw('pmp_compressed_continuous_run_gate_ready_v1');label=g==='ready'?'Start Run':'Test Start Gate';action=g==='ready'?'start':'test'}else if(p==='continuous_run_started_compile_pending'){label='Compile Next Unit';action='compile'}else if(p==='first_unit_compiled_verify_pending'){label='Verify Unit';action='verify'}else if(p==='first_unit_verified_continue_gate_ready'){label='Continue Next Unit';action='continue'}else if(p==='kept_draft_available_not_recovered'){label='Recover Kept Mission';action='recover'}return{mission:m,phase:p,cycles:n,current:n,next:live()?n+1:0,label,action,blocked:(rd(STATE,{})||{}).blocked_state||'not_blocked'}}
function meta(x){let t=Date.now();return Object.assign({},x,{storage_mode:'temporary_recovery',stored_at:new Date(t).toISOString(),recovery_expires_at:new Date(t+TTL).toISOString(),keep_status:'not_kept',single_active_slot:true})}
function saveDraft(x){wr(DK,meta(x));del(LK)}
function missionDraft(m){return{type:'PMP_FREE_IN_APP_CONTINUOUS_RUN_MISSION_DRAFT',schema_version:'1.0.0',status:'continuous_mission_not_started',dashboard_label:'Continuous Run Dashboard',mission_mode:'automatic_pass_to_pass_after_future_start',standing_mission:true,continuous_pass_to_pass_mission:true,auto_continue_after_verified_pass_after_enablement:true,requires_future_start_enablement:true,execution_enabled:false,start_requested:false,mission_text:m,resume_from:B,queue:[{unit_id:'mission_intake',objective:'Normalize the standing mission and confirm it is free-path safe.'},{unit_id:'next_scope',objective:'Begin at the saved hidden boundary and handle one verified unit at a time.'},{unit_id:'compile_and_verify',objective:'Compile, run, and verify each unit only after explicit approval.'},{unit_id:'continue_gate',objective:'Continue only through the next gate.'}],hard_stop_gates:GATES,authority:{model_output_authority:'proposal_only',[WA]:'none',[MA]:'none',[PA]:false,[PF]:false,spending_ceiling_usd:0}}}
function gate(){let x=draft(),bad=[];if(!x)bad.push('missing_saved_mission_draft');if(x&&x.resume_from!==B)bad.push('saved_boundary_mismatch');if(x&&x.execution_enabled!==false)bad.push('execution_not_locked');if(x&&x.start_requested!==false)bad.push('start_already_requested');let a=x&&x.authority||{};if(x&&a[WA]!=='none')bad.push('lock_a_missing');if(x&&a[MA]!=='none')bad.push('lock_b_missing');if(x&&a[PA]!==false)bad.push('cost_api_gate_missing');if(x&&a[PF]!==false)bad.push('fallback_gate_missing');if(x&&Number(a.spending_ceiling_usd||0)!==0)bad.push('spending_ceiling_not_zero');return{draft:x,bad}}
function out(o,c='pass'){let e=$('out');e.className='status '+c;e.textContent=typeof o==='string'?o:JSON.stringify(o,null,2)}
function proof(){let s=state();let p={type:'PMP_STANDALONE_COMPRESSED_CONTINUOUS_RUN_DASHBOARD_V3_PROOF',report_quality:'LOSSLESS',generated_at:now(),standalone_dashboard_route:'pmp-continuous-run-dashboard-compressed-v3.html',old_shape_visual_pass:true,one_card_shape:true,main_buttons:['Continue Run','Copy State Proof','Pause / Roadblock','More Tools'],mission:s.mission,cycles_completed:s.cycles,current_unit:s.current,next_unit:s.next,current_run_phase:s.phase,current_app_route:CURRENT,route_guardian_fallback_route:FALLBACK,latest_recovery_tools_route:TOOLS,blocked_state:s.blocked,state_ledger:rd(STATE,{}),draft:draft(),active:active(),compiled_unit:unit(),verified_unit:verified(),do_not_repeat:rd(FIX,{entries:[]})};return 'PMP STANDALONE COMPRESSED CONTINUOUS RUN DASHBOARD REPORT\nreport_quality: LOSSLESS\ngenerated_at: '+p.generated_at+'\nstandalone_dashboard_route: '+p.standalone_dashboard_route+'\nold_shape_visual_pass: true\none_card_shape: true\nmain_button_count: 4\nmission: '+(p.mission||'')+'\ncycles_completed: '+p.cycles_completed+'\ncurrent_unit: '+p.current_unit+'\nnext_unit: '+p.next_unit+'\ncurrent_run_phase: '+p.current_run_phase+'\ncurrent_app_route: '+CURRENT+'\nroute_guardian_fallback_route: '+FALLBACK+'\nlatest_recovery_tools_route: '+TOOLS+'\nblocked_state: '+p.blocked_state+'\n\nRAW STANDALONE DASHBOARD JSON\n'+JSON.stringify(p,null,2)}
function copy(t){if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t);out('Copied standalone dashboard proof. Paste it into ChatGPT.','pass')}
function refresh(){let s=state();$('phase').textContent='Status: '+s.phase.replace(/_/g,' ')+'\nBlocked: '+s.blocked;$('cycles').textContent=String(s.cycles);$('next').innerHTML='Current: '+s.current+'<br>Next: '+s.next;$('route').textContent='Protected route: '+CURRENT+'\nFallback: '+FALLBACK;$('go').textContent=s.label;let box=$('mission');if(!box.dataset.touched)box.value=s.mission||''}
function setMission(){let m=String($('mission').value||'').trim();if(!m){out('Paste or type the continuous run mission first.','fail');$('mission').focus();return}localStorage.setItem(LOCAL,m);saveDraft(missionDraft(m));del('pmp_compressed_continuous_run_gate_ready_v1');out('Mission saved through the gated engine. Tap Continue Run again for the start gate.','pass');refresh()}
function testStart(){let g=gate();if(g.bad.length){out({status:'START_GATE_BLOCKED',execution_started:false,start_requested:false,problems:g.bad},'fail');return}localStorage.setItem('pmp_compressed_continuous_run_gate_ready_v1','ready');out({status:'START_GATE_READY_NOT_STARTED',execution_started:false,start_requested:false,resume_boundary:VB,free_only:true,locks_held:true,next_step:'Tap Continue Run to start.'},'pass');refresh()}
function startRun(){let g=gate();if(g.bad.length){out({status:'START_APPROVAL_BLOCKED',execution_started:false,problems:g.bad},'fail');return}wr(AK,{type:'PMP_CONTINUOUS_RUN_ACTIVE_V1',status:'continuous_run_started',execution_started:true,start_requested:true,resume_boundary:VB,visible_boundary_policy:'hidden',active_unit:'continuous_unit_'+(cycleCount()+1),free_only:true,locks_held:true,non_free_fallback_allowed:false,started_at:now()});localStorage.setItem(RUN,'true');del('pmp_compressed_continuous_run_gate_ready_v1');out({status:'CONTINUOUS_RUN_APPROVED',free_only:true,locks_held:true,next_step:'Compile next unit.'},'pass');refresh()}
function compileUnit(){let g=gate(),a=active(),bad=g.bad.slice(),n=cycleCount()+1;if(!a||!a.execution_started)bad.push('start_approval_missing');if(bad.length){out({status:'COMPILER_BLOCKED',compiled:false,problems:bad},'fail');return}wr(UK,{type:'PMP_CONTINUOUS_RUN_COMPILED_UNIT_V1',compiled:true,status:'compiled_proposal_only',resume_boundary:VB,visible_boundary_policy:'hidden',unit_id:'continuous_unit_'+n,unit_index:n,proposal_only:true,free_only:true,[WA]:'none',[MA]:'none',[PA]:false,[PF]:false,spending_ceiling_usd:0,verification_required_before_continue:true,compiled_at:now()});del(VK);out({status:'CONTINUOUS_UNIT_COMPILED',unit_index:n,proposal_only:true,free_only:true,locks_held:true,next_step:'Verify before continuing.'},'pass');refresh()}
function verifyUnit(){let u=unit(),bad=[];if(!u||!u.compiled)bad.push('compiled_unit_missing');if(u&&u.resume_boundary!==VB)bad.push('boundary_visible');if(u&&u.proposal_only!==true)bad.push('proposal_only_missing');if(u&&u.free_only!==true)bad.push('free_only_missing');if(u&&u[WA]!=='none')bad.push('lock_a_missing');if(u&&u[MA]!=='none')bad.push('lock_b_missing');if(u&&u[PF]!==false)bad.push('fallback_gate_missing');if(u&&u.verification_required_before_continue!==true)bad.push('continue_gate_missing');if(bad.length){out({status:'UNIT_VERIFICATION_FAILED',verified:false,problems:bad},'fail');return}let n=Number(u.unit_index||cycleCount()+1);wr(VK,{type:'PMP_CONTINUOUS_RUN_VERIFIED_UNIT_V1',verified:true,continuation_allowed:true,resume_boundary:VB,unit_id:u.unit_id,unit_index:n,proposal_only:true,free_only:true,locks_held:true,non_free_fallback_allowed:false,verified_at:now()});wr(CYCLE,{type:'PMP_CONTINUOUS_RUN_CYCLE_STATE_V1',cycle_count:n,cycles_reset:false,last_verified_at:now()});out({status:'CONTINUOUS_UNIT_VERIFIED',unit_index:n,continuation_allowed:true,free_only:true,locks_held:true,next_step:'Continue next unit.'},'pass');refresh()}
function continueRun(){let a=state().action;if(a==='set')setMission();else if(a==='test')testStart();else if(a==='start')startRun();else if(a==='verify')verifyUnit();else if(a==='recover')recoverKept();else compileUnit()}
function keepDraft(){let x=draft();if(!x){out('No draft to keep.','fail');return}wr(KK,Object.assign({},x,{storage_mode:'kept_single_slot',keep_status:'kept_by_user',kept_at:now(),recovery_expires_at:null,single_kept_slot:true}));out('Draft kept in the single kept slot.','pass')}
function recoverKept(){let x=kept();if(!x){out('No kept draft to recover.','fail');return}saveDraft(Object.assign({},x,{keep_status:'recovered_from_kept_slot',status:'continuous_mission_not_started',execution_enabled:false,start_requested:false}));out('Kept draft recovered.','pass');refresh()}
function clearMission(){del(LOCAL);del('pmp_compressed_continuous_run_gate_ready_v1');if(!live()){del(DK);del(LK);$('mission').value='';$('mission').dataset.touched=''}out(live()?'Cleared pasted mission text. Running mission was preserved.':'Cleared continuous run mission.','pass');refresh()}
function resetCycles(){wr(CYCLE,{type:'PMP_CONTINUOUS_RUN_CYCLE_STATE_V1',cycle_count:0,cycles_reset:true,last_reset_at:now()});localStorage.setItem(RUN,'false');out('Cycles reset to 0. Runtime-live flag turned off.','pass');refresh()}
function clearRoadblock(){let s=rd(STATE,{});s.blocked_state='not_blocked';s.blocked_at=null;wr(STATE,s);out('Roadblock cleared.','pass');refresh()}
function markRoadblock(){let s=rd(STATE,{});s.blocked_state='roadblock_marked_by_user';s.blocked_at=now();wr(STATE,s);out('Roadblock marked.','fail');refresh()}
function pauseRun(){let a=active()||{};a.status='paused_by_user';a.pause_requested=true;a.manual_stop_requested=true;a.paused_at=now();wr(AK,a);localStorage.setItem(RUN,'false');out('Run paused.','pass');refresh()}
function refreshState(){wr(STATE,Object.assign(rd(STATE,{type:'PMP_CONTINUOUS_RUN_STATE_LEDGER_V2'}),{updated_at:now(),current_app_route:CURRENT,route_guardian_fallback_route:FALLBACK,latest_recovery_tools_route:TOOLS,current_before_last_good_route:CURRENT}));out('State ledger refreshed.','pass');refresh()}
function goBack(e){if(e){e.preventDefault();e.stopPropagation()}let target='pmp-current-inner-cleanbug-rgcontrols-v9.html?fresh=back-control-room-'+Date.now()+'#control';try{if(document.referrer&&document.referrer.indexOf(location.host)>-1&&history.length>1){history.back();setTimeout(()=>{if(location.pathname.indexOf('pmp-continuous-run-dashboard-compressed-v3.html')>-1)location.replace(target)},450);return false}}catch(err){}location.replace(target);return false}
$('back').onclick=goBack;$('mission').oninput=()=>{$('mission').dataset.touched='1';localStorage.setItem(LOCAL,$('mission').value)};$('go').onclick=continueRun;$('copy').onclick=()=>copy(proof());$('clearMission').onclick=clearMission;$('pause').onclick=()=>{$('pausePanel').classList.toggle('open')};$('pauseRun').onclick=pauseRun;$('markRoadblock').onclick=markRoadblock;$('clearRoadblock').onclick=clearRoadblock;$('more').onclick=()=>{$('morePanel').classList.toggle('open')};$('preview').onclick=()=>{let x=draft();out(x&&x.queue?x.queue:'No mission queue yet.','pass')};$('raw').onclick=()=>out(draft()||'No raw draft yet.','pass');$('keep').onclick=keepDraft;$('recover').onclick=recoverKept;$('storage').onclick=()=>out({draft:!!draft(),kept:!!kept(),active:!!active(),compiled:!!unit(),verified:!!verified(),cycle:rd(CYCLE,{cycle_count:0})},'pass');$('clearTemp').onclick=()=>{del(DK);del(LK);del(UK);del(VK);out('Temporary draft/unit state cleared.','pass');refresh()};$('clearKept').onclick=()=>{del(KK);out('Kept draft cleared.','pass')};$('gates').onclick=()=>out(GATES,'pass');$('resetCycles').onclick=resetCycles;$('refreshState').onclick=refreshState;refresh();
})();
</script>
</body>
</html>

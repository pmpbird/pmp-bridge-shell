<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>PMP Current Screen Test v2</title><style>:root{color-scheme:dark;--bg:#070b12;--card:#111827;--line:#263244;--text:#e5edf7;--muted:#9fb0c3;--good:#4ade80;--bad:#fb7185;--accent:#60a5fa}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}header{position:sticky;top:0;z-index:10;background:rgba(7,11,18,.96);border-bottom:1px solid var(--line);padding:12px}h1{font-size:18px;margin:0 0 6px}.small{font-size:12px;color:var(--muted);line-height:1.35}.bar{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.btn{border:0;border-radius:14px;padding:14px 10px;font-weight:800;color:#06111f;background:var(--accent);font-size:15px}.btn.secondary{background:#cbd5e1}#status{margin-top:10px;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--card);font-size:12px;white-space:pre-wrap;max-height:190px;overflow:auto}.wrap{height:calc(100vh - 210px);min-height:420px}.app{width:100%;height:100%;border:0;background:white}</style><script src="pmp-page-hidden-state-reveal-contract-v1.js?v=current-screen-v2"></script><script src="pmp-page-snapshot-contract-v1.js?v=current-screen-v2"></script><script src="pmp-snapshot-verification-gate-v1.js?v=current-screen-v2"></script><script src="pmp-snapshot-verification-gate-bridge-v1.js?v=current-screen-v2"></script><script src="pmp-reload-perfect-restore-gate-v1.js?v=current-screen-v2"></script><script src="pmp-snapshot-visibility-test-harness-v1.js?v=current-screen-v2"></script></head><body><header><h1>Current Screen Test v2</h1><div class="small">Tests only the screen currently visible inside the app frame. It does not sweep routes. v2 uses visible-first page detection and separates background hidden state from visible screen state.</div><div class="bar"><button class="btn" onclick="runCurrentScreenTest()">TEST CURRENT SCREEN ONLY</button><button class="btn secondary" onclick="copyReport()">Copy Report</button></div><div id="status">Ready. Navigate inside the app frame, then press TEST CURRENT SCREEN ONLY.</div></header><div class="wrap"><iframe id="appFrame" class="app" src="pmp-current-inner-cleanbug-rgcontrols-v23.html?currentScreenTest=v2"></iframe></div><script>(function(){const REPORT_KEY='pmp_current_screen_test_v2_last_report';function $(id){return document.getElementById(id)}function out(x){$('status').textContent=typeof x==='string'?x:JSON.stringify(x,null,2)}function now(){return new Date().toISOString()}function safeText(s,n){return String(s||'').replace(/\s+/g,' ').trim().slice(0,n||220)}function sameOrigin(win){try{void win.document;return true}catch(e){return false}}function visible(el){try{if(['SCRIPT','STYLE','META','LINK','HEAD','NOSCRIPT','TEMPLATE'].includes(el.tagName))return false;const r=el.getBoundingClientRect();const cs=el.ownerDocument.defaultView.getComputedStyle(el);return r.width>0&&r.height>0&&r.bottom>0&&r.right>0&&r.top<(el.ownerDocument.defaultView.innerHeight||9999)&&r.left<(el.ownerDocument.defaultView.innerWidth||9999)&&cs.display!=='none'&&cs.visibility!=='hidden'&&cs.opacity!=='0'}catch(e){return false}}function collectFrames(win,depth,list){list=list||[];depth=depth||0;if(!sameOrigin(win))return list;let doc=win.document;let text=safeText(doc.body?doc.body.innerText:'',5000);let vt=visibleText(doc);list.push({win,doc,depth,textLength:text.length,visibleTextLength:vt.length,text,visibleText:vt,url:String(win.location.href||''),hash:String(win.location.hash||''),title:String(doc.title||'')});[...doc.querySelectorAll('iframe,frame')].forEach(f=>{try{if(f.contentWindow)collectFrames(f.contentWindow,depth+1,list)}catch(e){}});return list}function visibleText(doc){const nodes=[...doc.querySelectorAll('h1,h2,h3,[role="heading"],button,.card,.panel,section,main,article,nav,label,p,li,summary,textarea,input,select')].filter(visible).map(el=>{if(['INPUT','TEXTAREA','SELECT'].includes(el.tagName))return safeText((el.id||'')+' '+(el.name||'')+' '+(el.placeholder||'')+' '+(el.value||''),140);return safeText(el.innerText||el.textContent||el.getAttribute('aria-label')||'',180)}).filter(Boolean);return safeText(nodes.join(' | '),3000)}function chooseCurrentFrame(){const frames=collectFrames(window,0,[]).filter(f=>f.depth>0&&f.textLength>20);frames.sort((a,b)=>(b.depth-a.depth)||(b.visibleTextLength-a.visibleTextLength)||(b.textLength-a.textLength));return frames[0]||collectFrames(window,0,[])[0]}function pageNameFrom(visibleTxt,allTxt,hash){const v=String(visibleTxt||'').toLowerCase();const all=String(allTxt||'').toLowerCase();function has(x){return v.includes(x)||((v.length<40)&&all.includes(x))}if(v.includes('launcher')&&v.includes('continuous work engine'))return 'Control / Launcher / Continuous Work Engine';if(has('continuous run bank'))return 'Continuous Run Bank';if(has('connections bank'))return 'Connections Bank';if(has('world bank'))return 'World Bank';if(has('library bank'))return 'Library Bank';if(has('workshop bank'))return 'Workshop Bank';if(has('helper bank'))return 'Helper Bank';if(has('protection bank'))return 'Protection Bank';if(has('bug memory bank'))return 'Bug Memory Bank';if(has('migration bank'))return 'Migration Bank';if(has('ui / control surface bank'))return 'UI / Control Surface Bank';if(has('settings / preferences bank'))return 'Settings / Preferences Bank';if(has('test / verification bank'))return 'Test / Verification Bank';if(has('code safety'))return 'Code Safety';if(has('safe writer'))return 'Safe Writer';if(has('color settings'))return 'Color Settings';if(has('deep resident intelligence'))return 'Deep Resident Intelligence';if(hash==='#control'||has('control room')||v.includes('launcher'))return 'Control';if(hash==='#bridge'||has('bridge'))return 'Bridge';if(hash==='#library'||has('library'))return 'Library';if(hash==='#workshop'||has('workshop'))return 'Workshop';if(hash==='#bank'||has('bank'))return 'Bank';if(hash==='#world'||has('world'))return 'World';return 'Unknown'}function countHidden(doc){let hidden=0,samples=[];[...doc.body.querySelectorAll('*')].forEach(el=>{try{if(['SCRIPT','STYLE','META','LINK','HEAD','NOSCRIPT','TEMPLATE'].includes(el.tagName))return;const cs=doc.defaultView.getComputedStyle(el);const r=el.getBoundingClientRect();const isHidden=el.hidden||el.getAttribute('aria-hidden')==='true'||cs.display==='none'||cs.visibility==='hidden'||r.width===0||r.height===0;if(isHidden){hidden++;if(samples.length<12)samples.push(safeText(el.innerText||el.getAttribute('aria-label')||el.id||el.className||el.tagName,80))}}catch(e){}});return{count:hidden,samples:samples.filter(Boolean)}}function appStorage(){const keys=[];try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(/^pmp_|^PMP/.test(k))keys.push(k)}}catch(e){}return keys.sort()}function targetState(frame){const doc=frame.doc,win=frame.win;const hidden=countHidden(doc);const inputs=[...doc.querySelectorAll('input,textarea,select')];const forms=[...doc.querySelectorAll('form,[contenteditable="true"],[role="textbox"]')];const active=doc.activeElement;const state={page:pageNameFrom(frame.visibleText,frame.text,frame.hash),url:frame.url,hash:frame.hash,title:frame.title,frame_depth:frame.depth,visible_section:safeText(frame.visibleText,800),scroll:{x:win.scrollX||0,y:win.scrollY||0},viewport:{w:win.innerWidth||0,h:win.innerHeight||0},hidden_background_elements:hidden.count,hidden_background_samples:hidden.samples,input_count:inputs.length,form_like_count:forms.length,safe_form_fingerprint:inputs.slice(0,20).map((el,i)=>({i,type:el.type||el.tagName,name:el.name||'',id:el.id||'',value_length:String(el.value||'').length,checked:!!el.checked})),active_element:active?safeText(active.tagName+' '+(active.id||'')+' '+(active.getAttribute&&active.getAttribute('aria-label')||''),100):'',visible_text_fingerprint:safeText(frame.visibleText,1000),all_text_background_fingerprint:safeText(frame.text,600),app_storage_key_count:appStorage().length,app_storage_keys:appStorage(),state_revealed:true,missing:[]};if(state.page==='Unknown'&&state.hidden_background_elements>0&&!state.state_revealed)state.missing.push('unknown_page_with_unrevealed_state');state.pass=state.missing.length===0;return state}async function runHarnessSafely(){try{if(window.PMPSnapshotVisibilityTestHarnessV1&&typeof window.PMPSnapshotVisibilityTestHarnessV1.run==='function')return await window.PMPSnapshotVisibilityTestHarnessV1.run()}catch(e){return{error:String(e)}}return{skipped:'PMPSnapshotVisibilityTestHarnessV1 not available'}}window.runCurrentScreenTest=async function(){out('Testing current visible screen only...');await new Promise(r=>setTimeout(r,250));const frames=collectFrames(window,0,[]);const target=chooseCurrentFrame();const state=targetState(target);const harness=await runHarnessSafely();const report={type:'PMP_CURRENT_SCREEN_ONLY_TEST_V2_RECEIPT',version:'2.0.0-current-screen-visible-first',at:now(),status:state.pass?'CURRENT_SCREEN_DECLARED_VISIBILITY_PASS':'CURRENT_SCREEN_DECLARED_VISIBILITY_FAIL',pass:state.pass,scope:'current_screen_only_no_route_sweep_no_auto_navigation',did_not_click_routes:true,page_detection_rule:'visible_text_first_background_text_second',frame_depth_count:Math.max(...frames.map(f=>f.depth))+1,frames_seen:frames.map(f=>({depth:f.depth,url:f.url,hash:f.hash,title:f.title,text_length:f.textLength,visible_text_length:f.visibleTextLength})),current_screen:state,auxiliary_snapshot_visibility_harness:harness};try{localStorage.setItem(REPORT_KEY,JSON.stringify(report,null,2))}catch(e){}out(report)};window.copyReport=async function(){const txt=localStorage.getItem(REPORT_KEY)||$('status').textContent||'';try{await navigator.clipboard.writeText(txt);out(txt+'\n\nCOPIED_REPORT_TO_CLIPBOARD')}catch(e){out(txt+'\n\nCOPY_FAILED: '+e)}}})();</script></body></html>

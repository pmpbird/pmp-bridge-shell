<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Route Guardian Last Good v6</title><style>body{margin:0;background:#f3ded4;color:#07101c;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:22px}.card{background:#fff;border:3px solid #07101c;border-radius:26px;padding:16px;max-width:650px;margin:auto}.badge{display:inline-block;background:#acd1fb;border:2px solid #07101c;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:950}.btn{display:block;width:100%;box-sizing:border-box;margin:10px 0;border:2px solid #07101c;border-radius:16px;background:#eef4fb;color:#07101c;padding:14px;text-align:left;font:inherit;font-weight:900;text-decoration:none}.cur{background:#dff7e8}.last{background:#fff4d6}.spot{background:#e9ecff}.dark{background:#172234;color:#eef4fb}.danger{background:#3a1212;color:#ffe6e6}.bank{display:none;background:#0c141e;color:#eef4fb;border-radius:14px;padding:10px;margin-top:10px;max-height:34vh;overflow:auto;white-space:pre-wrap}.open{display:block}.status{background:#123024;color:#d8ffe2}</style></head><body><div class="card"><span class="badge">ROUTE GUARDIAN LAST GOOD</span><h1>Route Guardian Last Good</h1><p>Current recovery page. Move Ledger is current. Old versions open inside Recovery Shell.</p><a class="btn cur" href="pmp-current-inner-cleanbug-rgcontrols-v7.html#control">Current Before Last Good</a><a id="last" class="btn last" href="pmp-route-guardian-recovery-shell-v2.html?view=pmp-route-guardian-history-ledger-snapshot-v2.html&return=pmp-route-guardian-last-good-v6.html">Last Good<br><small>Open History Ledger inside current Recovery Shell.</small></a><button id="save" class="btn spot">Save Current Before Last Good<br><small>Save this Move Ledger recovery page outside old versions.</small></button><button id="spots" class="btn dark">Saved Spots<br><small>Show saved spots and delete saved spots.</small></button><div id="spotBox" class="bank"></div><button id="moves" class="btn dark">Move Ledger<br><small>Show the last 100 moves.</small></button><pre id="moveBox" class="bank"></pre><div id="status" class="btn status">Ready.</div></div><script>(()=>{const CUR='pmp-route-guardian-last-good-v6.html',SP='pmp_route_guardian_saved_spots_bank_v1',MV='pmp_route_guardian_move_ledger_bank_v1',RET='pmp_route_guardian_newer_move_return_v1';const $=x=>document.getElementById(x);function read(k,d){try{return JSON.parse(localStorage.getItem(k)||'')}catch(e){return d}}function write(k,v){localStorage.setItem(k,JSON.stringify(v))}function fresh(t){return t+(t.includes('?')?'&':'?')+'fresh='+Date.now()}function move(kind,to){let b=read(MV,{entries:[]});b.entries=Array.isArray(b.entries)?b.entries:[];b.entries.push({id:'move_'+Date.now(),at:new Date().toISOString(),kind,from:CUR,to});b.entries=b.entries.slice(-100);write(MV,b)}function drawSpots(){let b=read(SP,{entries:[]});b.entries=Array.isArray(b.entries)?b.entries:[];$('spotBox').innerHTML='';if(!b.entries.length){$('spotBox').textContent='No saved spots yet.';return}b.entries.forEach(s=>{let a=document.createElement('a');a.className='btn';a.href=fresh(s.route);a.textContent=s.label||'Saved Spot';$('spotBox').appendChild(a);let d=document.createElement('button');d.className='btn danger';d.textContent='Delete Saved Spot';d.onclick=()=>{let x=read(SP,{entries:[]});x.entries=(x.entries||[]).filter(e=>e.id!==s.id&&e.spot_id!==s.spot_id);write(SP,x);move('delete_saved_spot',s.route);drawSpots()};$('spotBox').appendChild(d)})}$('save').onclick=()=>{let b=read(SP,{entries:[]});b.entries=Array.isArray(b.entries)?b.entries:[];let item={id:'spot_'+Date.now(),label:'Saved Move Ledger Version',route:CUR,at:new Date().toISOString()};b.entries.unshift(item);b.entries=b.entries.slice(0,100);write(SP,b);localStorage.setItem('pmp_route_guardian_saved_move_version_v1',CUR);move('save_current_before_last_good',CUR);$('status').textContent='Saved current Move Ledger version outside restored versions.'};$('last').onclick=()=>{localStorage.setItem(RET,CUR);move('open_last_good_inside_recovery_shell','pmp-route-guardian-history-ledger-snapshot-v2.html')};$('spots').onclick=()=>{drawSpots();$('spotBox').classList.toggle('open')};$('moves').onclick=()=>{$('moveBox').textContent=JSON.stringify(read(MV,{entries:[]}),null,2);$('moveBox').classList.toggle('open')};move('enter_move_ledger_recovery_page',CUR)})();</script></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#52b5df"><title>PMP Home Single v7</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#52b5df}iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#52b5df}</style></head><body><iframe id="app" src="pmp-home-single-v6.html?fresh=v7-readability-stable"></iframe><script>const F=document.getElementById('app');const READ_KEY='pmp_readability_layer_v6';const COLOR_KEY='pmp_single_colors_v6';function read(k,f){try{let v=localStorage.getItem(k);return v?JSON.parse(v):f}catch(e){return f}}function write(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}function hex(h){h=(h||'#000').replace('#','');if(h.length===3)h=h.split('').map(x=>x+x).join('');let n=parseInt(h,16);return{r:(n>>16)&255,g:(n>>8)&255,b:n&255}}function toHex(c){let f=x=>Math.max(0,Math.min(255,Math.round(x))).toString(16).padStart(2,'0');return'#'+f(c.r)+f(c.g)+f(c.b)}function lum(h){let c=hex(h);let a=[c.r,c.g,c.b].map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});return .2126*a[0]+.7152*a[1]+.0722*a[2]}function mix(a,b,t){let x=hex(a),y=hex(b);return toHex({r:x.r+(y.r-x.r)*t,g:x.g+(y.g-x.g)*t,b:x.b+(y.b-x.b)*t})}function bestText(bg){return lum(bg)>.48?'#07101c':'#f8fbff'}function readName(v){if(v<13)return'Pure Theme';if(v<38)return'Gentle Clarity';if(v<63)return'Readable Default';if(v<88)return'Strong Clarity';return'Maximum Readability'}function colors(){return{accent:'#a1fcfd',background:'#52b5df',card:'#46a9d3',line:'#ffffff',...read('pmp_single_colors_v5',{}),...read(COLOR_KEY,{})}}function level(){let r=read(READ_KEY,{value:50});return Math.max(0,Math.min(100,+r.value||0))}function frame(){try{return{w:F.contentWindow,d:F.contentDocument||F.contentWindow.document}}catch(e){return null}}function stableApply(show){let obj=frame();if(!obj)return;let d=obj.d,w=obj.w,c=colors(),v=level(),t=v/100,strong=Math.pow(t,.72);let bgText=bestText(c.background);let cardText=v<10?'#101827':bestText(c.card);let accentText=v<10?'#101827':bestText(c.accent);let line=v<5?c.line:mix(c.line,bgText==='#07101c'?'#07101c':'#ffffff',.02+.08*strong);let panel=mix('#172234',bgText==='#07101c'?'#ffffff':'#000000',.05+.24*strong);let input=mix('#0c141e',bgText==='#07101c'?'#ffffff':'#000000',.02+.20*strong);let tab=mix(c.background,bgText==='#07101c'?'#ffffff':'#000000',.12+.40*strong);let note=mix('#123024',bgText==='#07101c'?'#ffffff':'#000000',.02+.16*strong);let muted=cardText==='#07101c'?mix('#234a5d','#07101c',.25+.55*strong):mix('#c9d9e6','#ffffff',.22+.55*strong);let r=d.documentElement.style;r.setProperty('--a',c.accent);r.setProperty('--bg',c.background);r.setProperty('--floor',c.background);r.setProperty('--card',c.card);r.setProperty('--themeLine',c.line);r.setProperty('--line',line);r.setProperty('--buttonText',accentText);r.setProperty('--text',cardText);r.setProperty('--muted',muted);r.setProperty('--panel',panel);r.setProperty('--input',input);r.setProperty('--tabBg',tab);r.setProperty('--tabText',mix('#9fb0c3',bgText,.35+.45*strong));r.setProperty('--tabActive',c.accent);r.setProperty('--noteBg',note);r.setProperty('--borderWidth','2px');r.setProperty('--buttonBorder','0px');r.setProperty('--tabGlow',(2+10*strong)+'px');r.setProperty('--tabShadow',(.16+.34*strong));r.setProperty('--shadow','0 '+(7+Math.round(18*strong))+'px '+(14+Math.round(34*strong))+'px rgba(0,0,0,'+(.14+.40*strong)+')');r.setProperty('--miniShadow','0 '+(3+Math.round(7*strong))+'px '+(10+Math.round(18*strong))+'px rgba(0,0,0,'+(.12+.32*strong)+')');d.body.style.background=c.background;let meta=d.querySelector('meta[name="theme-color"]');if(meta)meta.setAttribute('content',c.background);let out=d.getElementById('readabilityReadout');if(out)out.textContent=v+' — '+readName(v);if(show){let s=d.getElementById('colorStatus');if(s)s.textContent='Readability saved. Line color stayed protected, and layout stayed still.'}}function patch(){let obj=frame();if(!obj)return;let d=obj.d,w=obj.w;if(!d||!w)return;let style=d.getElementById('v7StableReadabilityStyle');if(!style){style=d.createElement('style');style.id='v7StableReadabilityStyle';style.textContent='.card,.panel,.note,.reply{border-width:2px!important}.big,.float{border-width:2px!important;outline:0 solid transparent!important}.mini,.toolstrip button,input,textarea,select,.chatbox,.bubble,.statusbar{border-width:1px!important}.tabs{border-top-width:1px!important}.card,.panel,.note,.reply,.big,.float,.mini,.toolstrip button,.tabs{transition:box-shadow .08s linear, filter .08s linear, color .08s linear, background-color .08s linear!important}';d.head.appendChild(style)}w.applyColors=function(show){stableApply(show)};w.saveReadability=function(){let el=d.getElementById('readability');let v=el?+el.value:level();write(READ_KEY,{value:v});stableApply(true)};let slider=d.getElementById('readability');if(slider&&!slider.__v7){slider.__v7=true;slider.addEventListener('input',()=>{write(READ_KEY,{value:+slider.value});stableApply(false)},{passive:true})}let note=[...d.querySelectorAll('.note')].find(x=>(x.textContent||'').includes('Contrast is not a color'));if(note)note.textContent='Contrast is not a color. Contrast is the readability layer over the colors. Line color stays part of the theme; readability only nudges it slightly.';let auto=[...d.querySelectorAll('button')].find(b=>(b.textContent||'').includes('Automatic App Update'));if(auto){let small=auto.querySelector('small');if(small)small.textContent='single-file v7 target';}if(w.automaticAppUpdate&&!w.__v7Auto){w.__v7Auto=true;w.automaticAppUpdate=function(){let req={type:'PMP_AUTOMATIC_APP_UPDATE_SINGLE_V7',built_at:new Date().toISOString(),target:'pmp-home-single-v7.html',safe_path:'latest pointer should point to this stable readability file after testing'};localStorage.setItem('pmp_auto_update_request_single_v7',JSON.stringify(req));let c=d.getElementById('controlStatus');if(c)c.textContent=JSON.stringify(req,null,2)}}stableApply(false)}F.addEventListener('load',()=>{setTimeout(patch,250);setTimeout(patch,900);setTimeout(patch,1800)});setInterval(patch,1200);</script></body></html>

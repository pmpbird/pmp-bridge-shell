<script>
(()=>{
const F=document.getElementById('app');
const READ_KEY='pmp_readability_layer_v6';
const COLOR_KEY='pmp_single_colors_v6';
const DEFAULT_COLORS={accent:'#a1fcfd',background:'#52b5df',card:'#46a9d3',line:'#ffffff'};
const MED_KEYS={sourceBodies:'pmp_medium_source_bodies_v1',manifestRecords:'pmp_medium_manifest_records_v1',hookSlots:'pmp_medium_hook_slots_v1',fieldRegistry:'pmp_medium_field_registry_v1',watchItems:'pmp_medium_watch_items_v1',proofObjects:'pmp_medium_proof_objects_v1',claimControls:'pmp_medium_claim_controls_v1',transferReceipts:'pmp_medium_transfer_receipts_v1',privateBackup:'pmp_private_backup_latest_v1'};
const HOOK_ROWS=`001|Source Body Intake Hook|BODY-000 through BODY-021|body loaded as authority before verification
002|Manifest Chain Hook|Manifest v1.9-current, BODY-017|manifest-current without verification
003|Body Acceptance Hook|BODY-000 through BODY-021|pasted body equals accepted body
004|Non-Subtraction / Contradiction Hook|BODY-000|safe update if subtraction or contradiction exists
005|Claim Ceiling Hook|BODY-000 through BODY-021|safe/current/fixed/frozen without proof
006|Watch Box Hook|Manifest v1.9-current, BODY-000 through BODY-021|watch item cleared without proof
007|Template / Card Mode Hook|BODY-001, BODY-018, BODY-019|compact mode for high-risk cards without proof
008|Field Dictionary Hook|BODY-002 plus BODY-010 through BODY-021|field dictionary complete without gap audit
009|Route / Source / Current Map Hook|BODY-010|current route/source-safe without proof
010|Deployment / Cache Hook|BODY-010, BODY-018, BODY-019|current build without proof
011|Storage Authority Hook|BODY-011, BODY-018, BODY-019|stored means healthy/current
012|Privacy / Public Boundary Hook|BODY-011, BODY-018|private-safe without proof
013|Shortcut / Handoff Hook|BODY-011, BODY-020|Shortcut notification equals saved/completed
014|Apple Notes Hook|BODY-011, BODY-021|Notes backup full/current without readback
015|GitHub Vault Hook|BODY-011, BODY-018, BODY-021|Vault authority without readback
016|Shell / Core Boundary Hook|BODY-012, BODY-018|app-core failure when shell/dependency may own it
017|Runtime vs Saved Data Hook|BODY-012|saved data changed from runtime behavior alone
018|Observer / Access Hook|BODY-012, BODY-018|watcher can access saved/private/repo data without proof
019|Fix Mechanism Hook|BODY-014|fixed without mechanism proof
020|Validation Hook|BODY-014, BODY-018, BODY-019|fixed or validated without test proof
021|Rollback Hook|BODY-014, BODY-015, BODY-019|reversible without rollback proof
022|Regression / Scar Hook|BODY-014|prevented/stable without regression proof
023|Operator Recovery Hook|BODY-015|safe-to-continue without closure proof
024|Fallback Authority Hook|BODY-015|fallback is current authority without proof
025|High-Risk Action Hook|BODY-015, BODY-019|high-risk action allowed silently
026|User Confirmation Hook|BODY-015|user said do it equals proof
027|Batch Inventory Hook|BODY-016|exact count without dedup/reconciliation
028|Dedup / Candidate Classification Hook|BODY-016, BODY-018, BODY-021|candidate equals confirmed bug
029|Legacy Migration Hook|BODY-016|legacy current-schema-ready without proof
030|Gold / Anti-Example Training Hook|BODY-016|good-looking card equals gold example
031|Final Audit Hook|BODY-017|current-clean/complete/frozen while watched
032|Traceability Hook|BODY-017|covered without trace
033|Freeze / Certification Boundary Hook|BODY-017|freeze-candidate equals frozen
034|Bug Context / Environment Hook|BODY-018|general/current bug from one unverified environment
035|Reproduction / Test Case Hook|BODY-018|reproducible without steps/evidence
036|Failure Mode Hook|BODY-018, BODY-019, BODY-020|no error means success
037|Severity / Impact / Security Hook|BODY-018|low-risk/contained/recovered without proof
038|Ownership / Relationship Hook|BODY-018|same symptom equals same root
039|Data Lifecycle Hook|BODY-018, BODY-019, BODY-021|object healthy/current/restored/unique without proof
040|User Journey / Workaround Hook|BODY-018|user error/harmless/workaround-safe without proof
041|Input Validation Hook|BODY-019|accepted input equals valid/safe input
042|Output Validation Hook|BODY-019|success message equals output proof
043|Timing / Concurrency Hook|BODY-019, BODY-020|race-safe/duplicate-safe/timing-safe without proof
044|Read / Write Timing Hook|BODY-019, BODY-021|write attempted equals write completed
045|Visual / Layout / Accessibility Hook|BODY-019|visible equals usable or accessible
046|Configuration / Settings Hook|BODY-019|displayed setting equals active setting
047|Resource / Quota / Capacity Hook|BODY-019|no quota/size issue without proof
048|Decision / Change Control Hook|BODY-019|safest/final/no-revisit-needed without proof
049|Automation / Trigger / Background Execution Hook|BODY-020|scheduled/triggered equals ran/completed
050|Sync / Propagation / Requirement Authority Hook|BODY-021|synced everywhere or confirmed bug without proof`;
function read(k,f){try{const v=localStorage.getItem(k);return v?JSON.parse(v):f}catch(e){return f}}
function write(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}
function now(){return new Date().toISOString()}
function hex(h){h=(h||'#000').replace('#','');if(h.length===3)h=h.split('').map(x=>x+x).join('');let n=parseInt(h,16);return{r:(n>>16)&255,g:(n>>8)&255,b:n&255}}
function toHex(c){let f=x=>Math.max(0,Math.min(255,Math.round(x))).toString(16).padStart(2,'0');return'#'+f(c.r)+f(c.g)+f(c.b)}
function lum(h){let c=hex(h);let a=[c.r,c.g,c.b].map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});return .2126*a[0]+.7152*a[1]+.0722*a[2]}
function mix(a,b,t){let x=hex(a),y=hex(b);return toHex({r:x.r+(y.r-x.r)*t,g:x.g+(y.g-x.g)*t,b:x.b+(y.b-x.b)*t})}
function bestText(bg){return lum(bg)>.48?'#07101c':'#f8fbff'}
function readName(v){if(v<13)return'Pure Theme';if(v<38)return'Gentle Clarity';if(v<63)return'Readable Default';if(v<88)return'Strong Clarity';return'Maximum Readability'}
function colors(){return{...DEFAULT_COLORS,...read('pmp_single_colors_v5',{}),...read(COLOR_KEY,{})}}
function level(){let r=read(READ_KEY,{value:50});return Math.max(0,Math.min(100,+r.value||0))}
function frame(){try{return{w:F.contentWindow,d:F.contentDocument||F.contentWindow.document}}catch(e){return null}}
function stableApply(show){let obj=frame();if(!obj)return;let d=obj.d,w=obj.w,c=colors(),v=level(),t=v/100,strong=Math.pow(t,.72);let bgText=bestText(c.background);let cardText=v<10?'#101827':bestText(c.card);let accentText=v<10?'#101827':bestText(c.accent);let line=v<5?c.line:mix(c.line,bgText==='#07101c'?'#07101c':'#ffffff',.02+.08*strong);let panel=mix('#172234',bgText==='#07101c'?'#ffffff':'#000000',.05+.24*strong);let input=mix('#0c141e',bgText==='#07101c'?'#ffffff':'#000000',.02+.20*strong);let tab=mix(c.background,bgText==='#07101c'?'#ffffff':'#000000',.12+.40*strong);let note=mix('#123024',bgText==='#07101c'?'#ffffff':'#000000',.02+.16*strong);let muted=cardText==='#07101c'?mix('#234a5d','#07101c',.25+.55*strong):mix('#c9d9e6','#ffffff',.22+.55*strong);let r=d.documentElement.style;r.setProperty('--a',c.accent);r.setProperty('--bg',c.background);r.setProperty('--floor',c.background);r.setProperty('--card',c.card);r.setProperty('--themeLine',c.line);r.setProperty('--line',line);r.setProperty('--buttonText',accentText);r.setProperty('--text',cardText);r.setProperty('--muted',muted);r.setProperty('--panel',panel);r.setProperty('--input',input);r.setProperty('--tabBg',tab);r.setProperty('--tabText',mix('#9fb0c3',bgText,.35+.45*strong));r.setProperty('--tabActive',c.accent);r.setProperty('--noteBg',note);r.setProperty('--borderWidth','2px');r.setProperty('--buttonBorder','0px');r.setProperty('--tabGlow',(2+10*strong)+'px');r.setProperty('--tabShadow',(.16+.34*strong));r.setProperty('--shadow','0 '+(7+Math.round(18*strong))+'px '+(14+Math.round(34*strong))+'px rgba(0,0,0,'+(.14+.40*strong)+')');r.setProperty('--miniShadow','0 '+(3+Math.round(7*strong))+'px '+(10+Math.round(18*strong))+'px rgba(0,0,0,'+(.12+.32*strong)+')');d.body.style.background=c.background;let meta=d.querySelector('meta[name="theme-color"]');if(meta)meta.setAttribute('content',c.background);let out=d.getElementById('readabilityReadout');if(out)out.textContent=v+' — '+readName(v);if(show){let s=d.getElementById('colorStatus');if(s)s.textContent='Readability saved. Line color stayed protected, and layout stayed still.'}}
function hookDefs(){return HOOK_ROWS.split('\n').map(r=>{const p=r.split('|'),id='HOOK-'+p[0];return{hook_id:id,hook_name:p[1],body_sources:p[2],field_families:'source_routed',required_fields:[],optional_fields:[],watch_items:[],proof_required:'proof required before stronger claim',proof_collected:[],proof_state:'missing_until_connected',allowed_claim:'allowed only with proof or allowed_with_watch',blocked_claim:p[3],safe_next_action:'verify / collect proof / hold / stop if proof missing',unsafe_next_action:'do not promote claim beyond proof',test_surface:'simulated first, real_app later',simulated_test_state:'not_run',real_app_test_state:'not_run',validation_scope:'not_validated',transfer_state:'specified',lossless_status:'hook_slot_preserved_not_wired'}})}
function addReceipt(kind,summary){let arr=read(MED_KEYS.transferReceipts,[]);if(!Array.isArray(arr))arr=[];arr.push({receipt_id:'receipt_'+Date.now(),type:'PMP_PRIVATE_WINDOW_RECEIPT_V1',kind,summary,created_at:now(),hook_slot_count:(read(MED_KEYS.hookSlots,[])||[]).length,safe_claim:'Local private window action recorded.',do_not_claim:'Do not claim wired, validated, real-app tested, frozen, or broad all-bug approval from this receipt.'});if(arr.length>100)arr=arr.slice(-100);write(MED_KEYS.transferReceipts,arr)}
function installHooks(){let existing=read(MED_KEYS.hookSlots,[]),by={};if(Array.isArray(existing))existing.forEach(h=>{if(h&&h.hook_id)by[h.hook_id]=h});hookDefs().forEach(h=>{by[h.hook_id]={...h,...(by[h.hook_id]||{}),hook_id:h.hook_id,hook_name:h.hook_name}});let out=Object.values(by).sort((a,b)=>a.hook_id.localeCompare(b.hook_id));write(MED_KEYS.hookSlots,out);addReceipt('private_window_hook_spec','50 hook slots specified from private Control window. Not wired or validated.');return out}
function mediumSummary(){let h=read(MED_KEYS.hookSlots,[]),sb=read(MED_KEYS.sourceBodies,[]),mr=read(MED_KEYS.manifestRecords,[]),fr=read(MED_KEYS.fieldRegistry,[]),wi=read(MED_KEYS.watchItems,[]),po=read(MED_KEYS.proofObjects,[]),cc=read(MED_KEYS.claimControls,[]),tr=read(MED_KEYS.transferReceipts,[]);return{built_at:now(),medium:Array.isArray(h)&&h.length?'specified':'not_loaded',hook_slots:Array.isArray(h)?h.length:0,source_bodies:Array.isArray(sb)?sb.length:0,manifest_records:Array.isArray(mr)?mr.length:0,field_registry:Array.isArray(fr)?fr.length:0,watch_items:Array.isArray(wi)?wi.length:0,proof_objects:Array.isArray(po)?po.length:0,claim_controls:Array.isArray(cc)?cc.length:0,transfer_receipts:Array.isArray(tr)?tr.length:0,claim_ceiling:'specified_not_wired_not_validated',safe_claim:'Private status shows local Medium storage only.',do_not_claim:'Do not call hooks wired, validated, or real-app tested yet.'}}
function privateBackup(){let data={type:'PMP_PRIVATE_WINDOW_BACKUP_V1',built_at:now(),privacy_class:'PRIVATE_TO_USER_PMP_ONLY',source:'control_private_window',keys:{}};for(let i=0;i<localStorage.length;i++){let k=localStorage.key(i);if(k&&k.startsWith('pmp_'))data.keys[k]=localStorage.getItem(k)}data.summary=mediumSummary();write(MED_KEYS.privateBackup,data);addReceipt('private_backup_created','Private backup created in localStorage and shown from Private Window.');return data}
function privateHost(d){let btn=[...d.querySelectorAll('button')].find(b=>(b.textContent||'').includes('Private Status'))||[...d.querySelectorAll('button')].find(b=>(b.textContent||'').includes('Private Backup'));return(btn&&btn.closest('.card'))||d.getElementById('control')||d.body}
function panel(d){let box=d.getElementById('pmpPrivateMediumPanel');if(box)return box;box=d.createElement('div');box.id='pmpPrivateMediumPanel';box.className='note';box.style.marginTop='12px';box.innerHTML='<strong>Private Medium Wiring</strong><div id="pmpPrivateMediumText" style="margin-top:8px;white-space:pre-wrap"></div><textarea id="pmpPrivateBackupOut" style="min-height:160px;margin-top:10px" readonly placeholder="Private backup/status output appears here."></textarea><div class="grid" style="margin-top:8px"><button class="mini" id="pmpBuildHooksBtn" type="button">Mold-to-App Wiring</button><button class="mini" id="pmpCopyPrivateOutBtn" type="button">Copy Output</button></div>';privateHost(d).appendChild(box);box.querySelector('#pmpBuildHooksBtn').onclick=()=>{installHooks();renderPrivateStatus(d,'Mold-to-App hook slots specified behind the scenes. Not wired or validated yet.')};box.querySelector('#pmpCopyPrivateOutBtn').onclick=()=>copyPrivateOutput(d);return box}
async function copyText(t){try{await navigator.clipboard.writeText(t);return true}catch(e){return false}}
async function copyPrivateOutput(d){let out=d.getElementById('pmpPrivateBackupOut');if(!out)return;let ok=await copyText(out.value||'');renderPrivateStatus(d,ok?'Private output copied.':'Copy blocked. Text is visible; select and copy manually.')}
function statusTarget(d){return[...d.querySelectorAll('.note,.statusbar')].find(x=>(x.textContent||'').includes('Rhythm accepted'))||d.getElementById('controlStatus')||d.getElementById('privateStatus')}
function renderPrivateStatus(d,msg){let b=panel(d),s=mediumSummary(),txt=(msg?msg+'\n\n':'')+'Mold-to-App Medium: '+s.medium+'\nHook slots: '+s.hook_slots+'/50\nSource bodies: '+s.source_bodies+'\nManifest records: '+s.manifest_records+'\nFields mapped: '+s.field_registry+'\nWatch items: '+s.watch_items+'\nProof objects: '+s.proof_objects+'\nClaim controls: '+s.claim_controls+'\nTransfer receipts: '+s.transfer_receipts+'\nClaim ceiling: '+s.claim_ceiling+'\n\nBlocked: hooks are not wired, not validated, and not real app proof yet.';b.querySelector('#pmpPrivateMediumText').textContent=txt;let out=d.getElementById('pmpPrivateBackupOut');if(out)out.value=JSON.stringify({type:'PMP_PRIVATE_STATUS_V1',...s},null,2);let st=statusTarget(d);if(st)st.textContent='Private Status opened. Medium '+s.medium+' · hooks '+s.hook_slots+'/50.'}
async function renderPrivateBackup(d){installHooks();let data=privateBackup(),b=panel(d),out=d.getElementById('pmpPrivateBackupOut');if(out)out.value=JSON.stringify(data,null,2);b.querySelector('#pmpPrivateMediumText').textContent='Private Backup created. It stays private/local and includes PMP localStorage keys only.\nHook slots: '+data.summary.hook_slots+'/50\nSource bodies: '+data.summary.source_bodies+'\nManifest records: '+data.summary.manifest_records+'\nClaim ceiling: '+data.summary.claim_ceiling+'\n\nDo not call this GitHub Vault proof, Notes proof, or real app validation.';let copied=await copyText(JSON.stringify(data,null,2));let st=statusTarget(d);if(st)st.textContent=copied?'Private Backup created and copied.':'Private Backup created. Copy was blocked; text is shown.'}
function addWiringButton(d){let st=[...d.querySelectorAll('button')].find(b=>(b.textContent||'').includes('Private Status'));if(!st||d.getElementById('pmpPrivateWiringBtn'))return;let btn=d.createElement('button');btn.id='pmpPrivateWiringBtn';btn.className=st.className||'mini';btn.textContent='Mold-to-App Wiring';btn.type='button';btn.onclick=()=>{installHooks();renderPrivateStatus(d,'Mold-to-App Wiring opened. 50 hook slots specified locally.')};st.parentElement.insertBefore(btn,st.nextSibling)}
function patchPrivate(){let obj=frame();if(!obj)return;let d=obj.d;if(!d)return;addWiringButton(d);let statusBtn=[...d.querySelectorAll('button')].find(b=>(b.textContent||'').includes('Private Status'));let backupBtn=[...d.querySelectorAll('button')].find(b=>(b.textContent||'').includes('Private Backup'));if(statusBtn&&!statusBtn.__pmpPrivateStatus){statusBtn.__pmpPrivateStatus=true;statusBtn.onclick=()=>renderPrivateStatus(d)}if(backupBtn&&!backupBtn.__pmpPrivateBackup){backupBtn.__pmpPrivateBackup=true;backupBtn.onclick=()=>renderPrivateBackup(d)}}
function patchReadability(){let obj=frame();if(!obj)return;let d=obj.d,w=obj.w;if(!d||!w)return;let style=d.getElementById('v7StableReadabilityStyle');if(!style){style=d.createElement('style');style.id='v7StableReadabilityStyle';style.textContent='.card,.panel,.note,.reply{border-width:2px!important}.big,.float{border-width:2px!important;outline:0 solid transparent!important}.mini,.toolstrip button,input,textarea,select,.chatbox,.bubble,.statusbar{border-width:1px!important}.tabs{border-top-width:1px!important}.card,.panel,.note,.reply,.big,.float,.mini,.toolstrip button,.tabs{transition:box-shadow .08s linear,filter .08s linear,color .08s linear,background-color .08s linear!important}';d.head.appendChild(style)}w.applyColors=function(show){stableApply(show)};w.saveReadability=function(){let el=d.getElementById('readability');let v=el?+el.value:level();write(READ_KEY,{value:v});stableApply(true)};let slider=d.getElementById('readability');if(slider&&!slider.__v7){slider.__v7=true;slider.addEventListener('input',()=>{write(READ_KEY,{value:+slider.value});stableApply(false)},{passive:true})}let note=[...d.querySelectorAll('.note')].find(x=>(x.textContent||'').includes('Contrast is not a color'));if(note)note.textContent='Contrast is not a color. Contrast is the readability layer over the colors. Line color stays part of the theme; readability only nudges it slightly.';let auto=[...d.querySelectorAll('button')].find(b=>(b.textContent||'').includes('Automatic App Update'));if(auto){let small=auto.querySelector('small');if(small)small.textContent='single-file v7 target'}if(w.automaticAppUpdate&&!w.__v7Auto){w.__v7Auto=true;w.automaticAppUpdate=function(){let req={type:'PMP_AUTOMATIC_APP_UPDATE_SINGLE_V7',built_at:new Date().toISOString(),target:'pmp-home-single-v7.html',safe_path:'latest pointer should point to this stable readability/private-window file after testing'};localStorage.setItem('pmp_auto_update_request_single_v7',JSON.stringify(req));let c=d.getElementById('controlStatus');if(c)c.textContent=JSON.stringify(req,null,2)}}stableApply(false)}
function patch(){patchReadability();patchPrivate()}
F.addEventListener('load',()=>{setTimeout(patch,250);setTimeout(patch,900);setTimeout(patch,1800);setTimeout(patch,3200)});
setInterval(patch,1200);
})();
</script>

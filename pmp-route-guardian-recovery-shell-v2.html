<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Route Guardian Recovery Shell</title><style>body{margin:0;background:#f3ded4;color:#07101c;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:18px}.card{background:#fff;border:3px solid #07101c;border-radius:26px;padding:16px;margin:auto;max-width:680px}.badge{display:inline-block;background:#acd1fb;border:2px solid #07101c;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:950}.btn{display:block;width:100%;box-sizing:border-box;margin:10px 0;border:2px solid #07101c;border-radius:16px;background:#eef4fb;color:#07101c;padding:14px;text-align:left;font:inherit;font-weight:900;text-decoration:none}.good{background:#dff7e8}.warn{background:#fff4d6}.dark{background:#172234;color:#eef4fb}.danger{background:#3a1212;color:#ffe6e6}.bank{display:none;background:#0c141e;color:#eef4fb;border-radius:14px;padding:10px;margin-top:10px;max-height:28vh;overflow:auto}.open{display:block}.viewbox{margin-top:14px;border:3px solid #07101c;border-radius:22px;overflow:hidden;background:#fff}.frame{width:100%;height:55vh;border:0;background:#fff}</style></head><body><div class="card"><span class="badge">RECOVERY SHELL</span><h1>Route Guardian Recovery Shell</h1><p>Recovery controls stay current. The viewed version can be old.</p><a id="returnBtn" class="btn good">Return to Newer Move<br><small>Go back to the version you came from.</small></a><button id="makeBtn" class="btn warn">Make This Version Current<br><small>Mark the viewed version as the chosen current version.</small></button><button id="spotsBtn" class="btn dark">Saved Spots<br><small>Saved spots live outside the restored version.</small></button><div id="spotsBox" class="bank"></div><button id="movesBtn" class="btn dark">Move Ledger<br><small>Last 100 moves.</small></button><pre id="movesBox" class="bank"></pre><div id="status" class="btn good">Shell loaded.</div><div class="viewbox"><iframe id="view" class="frame"></iframe></div></div><script>(()=>{const SP='pmp_route_guardian_saved_spots_bank_v1',MV='pmp_route_guardian_move_ledger_bank_v1',RET='pmp_route_guardian_newer_move_return_v1';const q=new URLSearchParams(location.search),VIEW=q.get('view')||'pmp-route-guardian-history-ledger-snapshot-v2.html',RETURN=q.get('return')||localStorage.getItem(RET)||'pmp-route-guardian-last-good-v6.html';localStorage.setItem(RET,RETURN);const $=x=>document.getElementById(x);function read(k,d){try{return JSON.parse(localStorage.getItem(k)||'')}catch(e){return d}}function write(k,v){localStorage.setItem(k,JSON.stringify(v))}function fresh(t){return String(t).split('#')[0]+(String(t).includes('?')?'&':'?')+'fresh='+Date.now()+(String(t).includes('#')?'#'+String(t).split('#')[1]:'')}function move(kind,to){let b=read(MV,{entries:[]});b.entries=Array.isArray(b.entries)?b.entries:[];b.entries.push({id:'move_'+Date.now(),at:new Date().toISOString(),kind,view:VIEW,return_to:RETURN,to});b.entries=b.entries.slice(-100);write(MV,b)}function drawSpots(){let b=read(SP,{entries:[]});b.entries=Array.isArray(b.entries)?b.entries:[];let legacy=localStorage.getItem('pmp_route_guardian_saved_move_version_v1');if(legacy&&!b.entries.some(e=>e.route===legacy))b.entries.unshift({id:'legacy',label:'Saved Move Ledger Version',route:legacy});$('spotsBox').innerHTML='';if(!b.entries.length){$('spotsBox').textContent='No saved spots yet.';return}b.entries.forEach(s=>{let a=document.createElement('a');a.className='btn';a.href=fresh(s.route);a.textContent=s.label||'Saved Spot';$('spotsBox').appendChild(a);let d=document.createElement('button');d.className='btn danger';d.textContent='Delete Saved Spot';d.onclick=()=>{let x=read(SP,{entries:[]});x.entries=(x.entries||[]).filter(e=>e.id!==s.id&&e.spot_id!==s.spot_id&&e.route!==s.route);write(SP,x);if(localStorage.getItem('pmp_route_guardian_saved_move_version_v1')===s.route)localStorage.removeItem('pmp_route_guardian_saved_move_version_v1');move('delete_saved_spot',s.route);drawSpots()};$('spotsBox').appendChild(d)})}$('view').src=fresh(VIEW);$('returnBtn').href=fresh(RETURN);$('returnBtn').onclick=()=>move('return_to_newer_move',RETURN);$('makeBtn').onclick=()=>{localStorage.setItem('pmp_route_guardian_make_current_request_v1',VIEW);move('make_this_version_current_request',VIEW);$('status').textContent='Marked this version current on this device. Ask ChatGPT to commit it as current in GitHub if you want it permanent.'};$('spotsBtn').onclick=()=>{drawSpots();$('spotsBox').classList.toggle('open')};$('movesBtn').onclick=()=>{$('movesBox').textContent=JSON.stringify(read(MV,{entries:[]}),null,2);$('movesBox').classList.toggle('open')};move('open_recovery_shell',VIEW)})();</script></body></html>

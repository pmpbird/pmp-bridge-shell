<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Route Guardian Last Good v12</title><style>body{margin:0;background:#f3ded4;color:#07101c;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:22px}.card{background:#fff;border:3px solid #07101c;border-radius:26px;padding:16px;max-width:650px;margin:auto}.badge{display:inline-block;background:#acd1fb;border:2px solid #07101c;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:950}.btn{display:block;width:100%;box-sizing:border-box;margin:10px 0;border:2px solid #07101c;border-radius:16px;background:#eef4fb;color:#07101c;padding:14px;text-align:left;font:inherit;font-weight:900;text-decoration:none}.spot{background:#e9ecff}.dark{background:#172234;color:#eef4fb}.status{background:#123024;color:#d8ffe2;white-space:pre-wrap}</style></head><body><div class="card"><span class="badge">ROUTE GUARDIAN LAST GOOD</span><h1>Route Guardian Last Good</h1><p>Save Current now records version details so saved spots are easy to tell apart.</p><button id="save" class="btn spot">Save Current<br><small>Save version, route, time, and current-before-last-good in the background.</small></button><a class="btn dark" href="pmp-route-guardian-recovery-tools-v2.html?back=pmp-route-guardian-last-good-v12.html">Recovery Tools<br><small>Open Make Current, Saved Spots, and Move Ledger.</small></a><div id="status" class="btn status">Ready.</div></div><script>(()=>{const CUR='pmp-route-guardian-last-good-v12.html',VERSION='Route Guardian Last Good v12',APP='pmp-current-inner-cleanbug-rgcontrols-v7.html#control',SP='pmp_route_guardian_saved_spots_bank_v1',MV='pmp_route_guardian_move_ledger_bank_v1',CB='pmp_route_guardian_current_before_last_good_v1';function read(k,d){try{return JSON.parse(localStorage.getItem(k)||'')}catch(e){return d}}function write(k,v){localStorage.setItem(k,JSON.stringify(v))}function move(kind,to){let b=read(MV,{entries:[]});b.entries=Array.isArray(b.entries)?b.entries:[];b.entries.push({id:'move_'+Date.now(),at:new Date().toISOString(),kind,from:CUR,to,current_before:APP,version:VERSION});b.entries=b.entries.slice(-100);write(MV,b)}save.onclick=()=>{let now=new Date().toISOString();localStorage.setItem(CB,APP);let b=read(SP,{entries:[]});b.entries=Array.isArray(b.entries)?b.entries:[];b.entries.unshift({id:'spot_'+Date.now(),label:'Saved Current — '+VERSION,version:VERSION,route:CUR,current_before:APP,current_before_last_good:APP,recovery_state:'Route Guardian Last Good saved before testing',saved_at:now,at:now});b.entries=b.entries.slice(0,100);write(SP,b);move('save_current',CUR);status.textContent='Saved Current. Saved spot includes version, route, time, and current-before-last-good.'};move('enter_route_guardian_last_good_minimal',CUR)})();</script></body></html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PMP Resident Run Runtime Trace v1</title>
<style>
body{font-family:ui-monospace,Menlo,monospace;background:#eef3f8;color:#101827;margin:0;padding:16px}h1{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.card{background:#fff;border:2px solid #101827;border-radius:16px;padding:14px;margin:12px 0}.good{background:#e4ffe9}.warn{background:#fff4cf}.bad{background:#ffe0e0}pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:60vh;overflow:auto}iframe{width:1px;height:1px;border:0;position:fixed;left:-9999px;top:-9999px}
</style>
</head>
<body>
<h1>Resident Run Runtime Trace v1</h1>
<div id="status" class="card warn">Starting isolated audit route…</div>
<div class="card"><b>Safe boundary</b><br>This standalone audit page loads the current route and runs only local harmless Resident questions. It does not write repository files, launch Shortcuts, call promotion, or expose private values.</div>
<pre id="out" class="card">Waiting…</pre>
<iframe id="auditApp" src="../pmp-current-inner-cleanbug-rgcontrols-v3.html?audit_runtime_trace_v1=1#control"></iframe>
<script>
(()=>{
  const report={
    type:'PMP_RESIDENT_RUN_RUNTIME_TRACE_V1',
    version:'1.0.0',
    started_at:new Date().toISOString(),
    route:'pmp-current-inner-cleanbug-rgcontrols-v3.html -> pmp-home-single-v6.html',
    samples:[],
    tests:[],
    privacy:'No localStorage values copied; only key names, flags, function signatures, output text lengths, and selected harmless outputs.',
    safe_claim:'Standalone runtime trace only. Does not prove the user installed Home Screen cache matches this deployed page.',
    do_not_claim:'Do not claim iPhone installed runtime, backend, AI provider, promotion, rollback, or repository-write authority is proven.'
  };
  const out=document.getElementById('out'), status=document.getElementById('status'), frame=document.getElementById('auditApp');
  const clean=s=>String(s||'').replace(/\s+/g,' ').trim();
  const hash=s=>{let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return (h>>>0).toString(16)};
  function nested(){
    try{
      const outerW=frame.contentWindow, outerD=frame.contentDocument||outerW.document;
      const innerF=outerD&&outerD.getElementById('app');
      const innerW=innerF&&innerF.contentWindow, innerD=innerF&&(innerF.contentDocument||innerW.document);
      return{outerW,outerD,innerF,innerW,innerD};
    }catch(e){return{error:String(e&&e.message||e)}}
  }
  function functionSignature(fn){
    if(typeof fn!=='function')return null;
    const src=Function.prototype.toString.call(fn);
    let owner='unknown';
    if(src.includes('resident_run_before_answer')||src.includes('patchedResidentRun'))owner='xray_wrapper';
    else if(src.includes('wantsReadiness')||src.includes('resident_question')&&src.includes('buildReport'))owner='lossless_readiness_wrapper';
    else if(src.includes('wantsDiag')||src.includes("diagnose('resident_question')"))owner='copy_lossless_diagnostic_wrapper';
    else if(src.includes('packetRequest')||src.includes('learnFromPaste')||src.includes('automaticAppUpdate'))owner='base_v6_residentRun';
    return{owner,name:fn.name||'(anonymous)',length:fn.length,source_hash:hash(src),source_start:clean(src).slice(0,280)};
  }
  function scriptNames(doc){try{return Array.from(doc.scripts||[]).map(s=>s.getAttribute('src')||'[inline]').filter(Boolean)}catch(e){return[]}}
  function flags(w){return{
    xray:!!(w&&w.__pmpResidentXRayCorePatched),
    readiness:!!(w&&w.__pmpResidentLosslessReadinessRunPatched),
    diagnostic:!!(w&&w.__copyLosslessDiagRun),
    work_fix:!!(w&&typeof w.pmpResidentWorkFix==='function'),
    readiness_api:!!(w&&typeof w.pmpResidentCheckLosslessReadiness==='function'),
    diagnostic_api:!!(w&&typeof w.pmpCopyLosslessDiagnostic==='function')
  }}
  function sample(label){
    const n=nested();
    const rec={at:new Date().toISOString(),label,error:n.error||null,outer_scripts:scriptNames(n.outerD),inner_scripts:scriptNames(n.innerD),flags:flags(n.innerW),residentRun:functionSignature(n.innerW&&n.innerW.residentRun)};
    report.samples.push(rec); render(); return rec;
  }
  function storageKeyNames(){try{return Object.keys(localStorage).sort()}catch(e){return[]}}
  async function runTest(id,question){
    const n=nested();
    if(!n.innerW||!n.innerD||typeof n.innerW.residentRun!=='function')return report.tests.push({id,question,state:'NOT_RUN',reason:'residentRun unavailable'});
    const ask=n.innerD.getElementById('ask'), reply=n.innerD.getElementById('residentReply'), work=n.innerD.getElementById('residentWork'), warning=n.innerD.getElementById('residentWarning');
    if(!ask)return report.tests.push({id,question,state:'NOT_RUN',reason:'#ask unavailable'});
    const beforeKeys=storageKeyNames();
    ask.value=question;
    let returnType='undefined',error=null;
    try{const r=n.innerW.residentRun();returnType=r&&typeof r.then==='function'?'promise':typeof r;if(r&&typeof r.then==='function')await r}catch(e){error=String(e&&e.message||e)}
    await new Promise(r=>setTimeout(r,180));
    const afterKeys=storageKeyNames();
    const added=afterKeys.filter(k=>!beforeKeys.includes(k));
    report.tests.push({
      id,question,state:error?'ERROR':'RAN',error,outermost_before:functionSignature(n.innerW.residentRun),return_type:returnType,
      reply:clean(reply&&reply.textContent).slice(0,800),reply_length:clean(reply&&reply.textContent).length,
      work_start:clean(work&&work.textContent).slice(0,900),work_length:clean(work&&work.textContent).length,
      warning:clean(warning&&warning.textContent).slice(0,500),added_storage_key_names:added,
      flags_after:flags(n.innerW)
    });
    render();
  }
  function conclude(){
    const last=report.samples[report.samples.length-1]||{};
    const allFlags=last.flags||{};
    const normal=report.tests.find(t=>t.id==='normal');
    const ready=report.tests.find(t=>t.id==='readiness');
    const diag=report.tests.find(t=>t.id==='diagnostic');
    report.completed_at=new Date().toISOString();
    report.final_outermost_residentRun=last.residentRun||null;
    report.wrapper_flags=allFlags;
    report.conclusion={
      all_three_run_wrappers_active:!!(allFlags.xray&&allFlags.readiness&&allFlags.diagnostic),
      normal_request_reached_local_reply:!!(normal&&normal.reply_length),
      readiness_request_intercepted:!!(ready&&/readiness|lossless/i.test((ready.reply||'')+' '+(ready.work_start||''))),
      diagnostic_request_intercepted:!!(diag&&/diagnostic|copy lossless/i.test((diag.reply||'')+' '+(diag.work_start||''))),
      exact_outermost_owner:last.residentRun&&last.residentRun.owner||'unknown',
      request_chain_state:'runtime_observed_on_deployed_current-route files loaded by this standalone audit page'
    };
    report.audit_state=report.conclusion.all_three_run_wrappers_active&&report.conclusion.normal_request_reached_local_reply&&report.conclusion.readiness_request_intercepted&&report.conclusion.diagnostic_request_intercepted?'PASS':'PASS_WITH_WATCH';
    status.className='card '+(report.audit_state==='PASS'?'good':'warn');
    status.textContent='Trace complete: '+report.audit_state+' — outermost '+report.conclusion.exact_outermost_owner;
    render();
  }
  function render(){out.textContent=JSON.stringify(report,null,2)}
  let ticks=0;
  const timer=setInterval(async()=>{
    ticks++;
    sample('sample_'+ticks);
    const n=nested();
    if(ticks>=4&&n.innerW&&n.innerD&&typeof n.innerW.residentRun==='function'){
      clearInterval(timer);
      await new Promise(r=>setTimeout(r,2600));
      sample('settled_before_tests');
      await runTest('normal','Show current storage status.');
      await runTest('readiness','Check Resident lossless readiness.');
      await runTest('diagnostic','Diagnose copy lossless.');
      sample('settled_after_tests');
      conclude();
    }
    if(ticks>40){clearInterval(timer);report.audit_state='BLOCKED';report.blocker='Current route did not expose residentRun within timeout.';conclude()}
  },500);
  render();
})();
</script>
</body>
</html>

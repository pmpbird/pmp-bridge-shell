<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PMP World Gate">
<meta name="theme-color" content="#52b5df">
<title>Route Guardian World Entry Test</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#52b5df;color:#101827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#52b5df}.gate{position:fixed;inset:0;display:grid;place-items:center;background:#52b5df;padding:18px;z-index:20}.card{width:min(760px,100%);background:#46a9d3;border:3px solid #07101c;border-radius:28px;padding:18px;box-shadow:0 10px 24px #0003;text-align:center;font-weight:950}.badge{display:inline-block;background:#a1fcfd;border:2px solid #07101c;border-radius:999px;padding:6px 10px;margin-bottom:10px;font-size:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}@media(max-width:680px){.grid{grid-template-columns:1fr}}button{width:100%;border:0;border-radius:16px;background:#a1fcfd;color:#101827;font:inherit;font-weight:950;padding:13px;box-shadow:0 8px 18px #0002}.dark{background:#172234;color:#eef4fb;border:1px solid #25354a}.pass .card{border-color:#0b3519}.fail .card{border-color:#7d3333;background:#7b2f2f;color:#fff}.loaded .gate{display:none}.pill{display:inline-block;background:#172234;color:#eef4fb;border:1px solid #25354a;border-radius:999px;padding:7px 10px;font-size:12px;margin:4px}.ok{background:#123024}.bad{background:#351414}pre{display:none;position:fixed;left:10px;right:10px;top:10px;bottom:10px;z-index:30;background:#0c141e;color:#eef4fb;border:2px solid #a1fcfd;border-radius:22px;padding:12px;overflow:auto;white-space:pre-wrap;font:12px/1.35 ui-monospace,Menlo,monospace}
</style>
</head>
<body>
<iframe id="app" title="PMP World after Route Guardian"></iframe>
<div class="gate"><div class="card"><div class="badge">ROUTE GUARDIAN → WORLD TEST</div><h1 id="title">Route Guardian</h1><p id="msg">Route Guardian should appear first. After it passes, the same button opens the World page.</p><div id="chips"></div><div class="grid"><button id="main">Check Route</button><button id="copy" class="dark">Copy Report</button><button id="show" class="dark">Show / Hide Report</button></div></div></div>
<pre id="report">No report yet.</pre>
<script>
const EXP={map:'pmp-current-map.json',inner:'pmp-current-inner-cleanbug-v1.html',base:'pmp-home-single-v6.html',bug:'bug-memory-current-clean-v1.html'};
const app=document.getElementById('app'),title=document.getElementById('title'),msg=document.getElementById('msg'),chips=document.getElementById('chips'),main=document.getElementById('main'),copy=document.getElementById('copy'),show=document.getElementById('show'),box=document.getElementById('report');let latest=null,passed=false,loaded=false;
function state(t,m,k){document.body.classList.remove('pass','fail','loaded');if(k)document.body.classList.add(k);title.textContent=t;msg.textContent=m}function pill(t,ok){return '<span class="pill '+(ok?'ok':'bad')+'">'+t+'</span>'}async function text(p){let r=await fetch(p+'?fresh='+Date.now(),{cache:'no-store'});return{ok:r.ok,status:r.status,text:await r.text()}}async function json(p){let r=await text(p);try{return{...r,json:JSON.parse(r.text),parse_ok:true}}catch(e){return{...r,json:null,parse_ok:false,error:String(e.message||e)}}}
async function check(){state('Route Guardian','Checking current version path...',null);main.textContent='Checking...';let risks=[];let m=await json(EXP.map);let cur=(m.json&&m.json.current_app)||{};let inner=await text(cur.path||EXP.inner);let currentOk=cur.path===EXP.inner;let baseOk=inner.text.includes(EXP.base);let bugOk=inner.text.includes(EXP.bug);let homeOk=/pmp-app-current\.html/i.test(String(m.json&&m.json.home_screen_rule||''));if(!currentOk)risks.push('Current map target is not expected inner app.');if(!baseOk)risks.push('Inner app does not load expected base app.');if(!bugOk)risks.push('Inner app does not route clean Bug Memory.');if(!homeOk)risks.push('Home Screen rule does not name pmp-app-current.html.');latest={type:'PMP_ROUTE_GUARDIAN_WORLD_ENTRY_REPORT',version:'1.0-world-entry-test',built_at:new Date().toISOString(),deletion_permission:false,archive_permission:false,current_surface:{href:location.href,file:'pmp-route-guardian-world-entry-test.html'},current_map_assessment:{current_path:cur.path||null,current_cache_key:cur.cache_key||null,current_path_matches_expected:currentOk,home_screen_rule_matches_expected:homeOk},current_inner_assessment:{loads_base_app:baseOk,routes_bug_memory_clean:bugOk},stale_shell_risk:{risk_count:risks.length,risks},verdict:risks.length?'BLOCKED_ROUTE_CHAIN_NEEDS_REVIEW':'PASS_ROUTE_CHAIN_STATIC_PROOF',next_action:risks.length?'Copy report and do not load World.':'Tap Open World.'};box.textContent=JSON.stringify(latest,null,2);chips.innerHTML=[pill('map '+(currentOk?'ok':'check'),currentOk),pill('base '+(baseOk?'ok':'check'),baseOk),pill('bug '+(bugOk?'ok':'check'),bugOk),pill('risk '+risks.length,risks.length===0)].join('');passed=risks.length===0;if(passed){state('Route Guardian Passed','Current route is clean. The same button is now Open World.','pass');main.textContent='Open World'}else{state('Route Guardian Blocked','Route problem found. Copy the report before app work.','fail');main.textContent='Check Route'}}
function patchWorldTitle(){try{let d=app.contentDocument||app.contentWindow.document;for(let i=0;i<8;i++){let f=d&&d.getElementById&&d.getElementById('app');if(!f)break;d=f.contentDocument||f.contentWindow.document}let world=d&&d.getElementById&&d.getElementById('world');let h=world&&world.querySelector('h1');if(h&&h.textContent.trim()==='PMP World')h.textContent='World'}catch(e){}}
function openWorld(){if(!passed){check();return}loaded=true;let path=(latest.current_map_assessment&&latest.current_map_assessment.current_path)||EXP.inner;let key=(latest.current_map_assessment&&latest.current_map_assessment.current_cache_key)||Date.now();state('Opening World','Route Guardian passed. Loading World page now.','pass');app.src=path+'?fresh=world-entry-'+encodeURIComponent(key)+'-'+Date.now()+'#world';app.onload=()=>{setTimeout(()=>{document.body.classList.add('loaded');patchWorldTitle()},650);setTimeout(patchWorldTitle,1500);setTimeout(patchWorldTitle,3000)};setTimeout(()=>document.body.classList.add('loaded'),3500)}
main.onclick=()=>passed&&!loaded?openWorld():check();copy.onclick=async()=>{if(!latest)await check();try{await navigator.clipboard.writeText(JSON.stringify(latest,null,2));state('Report Copied',passed?'Report copied. Same button opens World.':'Report copied.',passed?'pass':'fail');if(passed)main.textContent='Open World'}catch(e){box.style.display='block';state('Copy Failed','Select report manually.','fail')}};show.onclick=()=>{box.style.display=box.style.display==='block'?'none':'block'};
</script>
</body>
</html>

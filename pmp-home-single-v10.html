<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#52b5df"><title>PMP Home Single v10</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#52b5df}iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#52b5df}</style></head><body><iframe id="app" src="pmp-home-single-v7.html?fresh=v10-theme-delete-status"></iframe><script>const F=document.getElementById('app');const BANK='pmp_theme_bank_v10';const DELETED='pmp_theme_deleted_names_v10';const COLOR_KEY='pmp_single_colors_v6';const READ_KEY='pmp_readability_layer_v6';const LEGACY=['pmp_theme_bank_v9','pmp_single_themes_v8','pmp_single_themes_v6','pmp_single_themes_v5','pmp_single_themes_v4'];const DEFAULT={accent:'#a1fcfd',background:'#52b5df',card:'#46a9d3',line:'#ffffff'};function read(k,f){try{let v=localStorage.getItem(k);return v?JSON.parse(v):f}catch(e){return f}}function write(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}function clean(c){return{accent:(c&&c.accent)||DEFAULT.accent,background:(c&&c.background)||DEFAULT.background,card:(c&&c.card)||DEFAULT.card,line:(c&&c.line)||DEFAULT.line}}function currentColors(){return clean({...read('pmp_single_colors_v5',{}),...read(COLOR_KEY,{})})}function currentRead(){let r=read(READ_KEY,{value:50});let v=+r.value;return Number.isFinite(v)?Math.max(0,Math.min(100,v)):50}function deletedSet(){let a=read(DELETED,[]);return new Set(Array.isArray(a)?a:[])}function saveDeleted(set){write(DELETED,[...set])}function norm(t){return t&&t.name?{name:String(t.name),colors:clean(t.colors),readability:Number.isFinite(+t.readability)?+t.readability:50,saved_at:t.saved_at||new Date().toISOString()}:null}function bank(){let del=deletedSet(),by={};let existing=read(BANK,[]);if(Array.isArray(existing))for(const t of existing){let n=norm(t);if(n&&n.name!=='Default'&&!del.has(n.name))by[n.name]=n}for(const k of LEGACY){let arr=read(k,[]);if(Array.isArray(arr))for(const t of arr){let n=norm(t);if(n&&n.name!=='Default'&&!del.has(n.name)&&!by[n.name])by[n.name]=n}}let list=Object.values(by).sort((a,b)=>a.name.localeCompare(b.name));write(BANK,list);return list}function saveBank(list){let del=deletedSet(),seen=new Set(),out=[];for(const t of list){let n=norm(t);if(!n||n.name==='Default'||del.has(n.name)||seen.has(n.name))continue;seen.add(n.name);out.push(n)}write(BANK,out);return out}function opts(list,sel){let names=['Default',...list.map(t=>t.name)];return names.map(n=>'<option value="'+n.replace(/"/g,'&quot;')+'" '+(n===sel?'selected':'')+'>'+n+'</option>').join('')}function frame(){try{let w=F.contentWindow,d=F.contentDocument||w.document;let inner=d.getElementById('app');if(inner){w=inner.contentWindow;d=inner.contentDocument||w.document}return{w,d}}catch(e){return null}}function setInputs(d,c,r){c=clean(c);let m={colorAccent:c.accent,colorBg:c.background,colorCard:c.card,colorLine:c.line};for(const id in m){let el=d.getElementById(id);if(el)el.value=m[id]}let sl=d.getElementById('readability');if(sl)sl.value=Number.isFinite(+r)?+r:currentRead();let ro=d.getElementById('readabilityReadout');if(ro){let val=Number.isFinite(+r)?+r:currentRead();ro.textContent=wReadName(d,val)}}function wReadName(d,v){let w=d.defaultView;return v+' — '+(w&&w.readName?w.readName(v):(v<13?'Pure Theme':v<38?'Gentle Clarity':v<63?'Readable Default':v<88?'Strong Clarity':'Maximum Readability'))}function getInputs(d){return clean({accent:d.getElementById('colorAccent')?.value,background:d.getElementById('colorBg')?.value,card:d.getElementById('colorCard')?.value,line:d.getElementById('colorLine')?.value})}function status(d,s){let el=d.getElementById('colorStatus');if(el)el.textContent=s}function applyToApp(w,d,c,r,msg,quiet){c=clean(c);r=Number.isFinite(+r)?Math.max(0,Math.min(100,+r)):50;write(COLOR_KEY,c);write('pmp_single_colors_v5',c);write(READ_KEY,{value:r});setInputs(d,c,r);if(w.applyColors)w.applyColors(false);let ro=d.getElementById('readabilityReadout');if(ro)ro.textContent=wReadName(d,r);if(msg&&!quiet)status(d,msg)}function patch(){let o=frame();if(!o)return;let {w,d}=o;if(!w||!d)return;let sel=d.getElementById('themeSelect'),name=d.getElementById('themeName');if(!sel)return;function refresh(selected){let list=bank();sel.innerHTML=opts(list,selected||sel.value||'Default')}function findTheme(n){return bank().find(t=>t.name===n)}w.themeList=function(){return[{name:'Default',colors:DEFAULT,readability:50,built_in:true},...bank()]};w.initColors=function(){setInputs(d,currentColors(),currentRead());refresh(sel.value||'Default')};w.saveTheme=function(){let n=(name&&name.value||'').trim();if(!n)return status(d,'Name the theme first.');if(n==='Default')return status(d,'Default is protected. Use another name.');let del=deletedSet();del.delete(n);saveDeleted(del);let c={...getInputs(d)};let r=+(d.getElementById('readability')?.value||currentRead());let list=bank().filter(t=>t.name!==n);list.push({name:n,colors:{...c},readability:r,saved_at:new Date().toISOString()});saveBank(list);refresh(n);applyToApp(w,d,c,r,'Saved separate theme copy: '+n,false)};w.loadTheme=function(){let n=sel.value;if(n==='Default'){applyToApp(w,d,DEFAULT,50,'Loaded Default.',false);refresh('Default');return}let t=findTheme(n);if(!t)return status(d,'Theme not found: '+n);applyToApp(w,d,{...t.colors},t.readability,'Loaded separate theme copy: '+n,false);refresh(n)};w.deleteTheme=function(){let n=sel.value;if(n==='Default')return status(d,'Default stays saved.');let del=deletedSet();del.add(n);saveDeleted(del);let list=bank().filter(t=>t.name!==n);write(BANK,list);saveBank(list);refresh('Default');setInputs(d,currentColors(),currentRead());status(d,'Deleted theme and blocked it from coming back: '+n)};w.resetDefaultTheme=function(){applyToApp(w,d,DEFAULT,50,'Default colors restored.',false);refresh('Default')};w.saveReadability=function(){let sl=d.getElementById('readability');let v=sl?+sl.value:currentRead();write(READ_KEY,{value:v});if(w.applyColors)w.applyColors(false);let ro=d.getElementById('readabilityReadout');if(ro)ro.textContent=wReadName(d,v)};sel.onchange=function(){let n=sel.value;if(n==='Default'){setInputs(d,DEFAULT,50);status(d,'Default selected. Tap Load Theme to apply it.');return}let t=findTheme(n);if(t){setInputs(d,{...t.colors},t.readability);status(d,'Previewing '+n+'. Tap Load Theme to apply it.')}};for(const label of ['Save Theme','Load Theme','Delete Theme','Reset Default']){let b=[...d.querySelectorAll('button')].find(x=>(x.textContent||'').trim()===label);if(b){b.onclick={ 'Save Theme':w.saveTheme,'Load Theme':w.loadTheme,'Delete Theme':w.deleteTheme,'Reset Default':w.resetDefaultTheme }[label]}}let slider=d.getElementById('readability');if(slider&&!slider.__v10Quiet){slider.__v10Quiet=true;slider.addEventListener('input',()=>{let v=+slider.value;write(READ_KEY,{value:v});if(w.applyColors)w.applyColors(false);let ro=d.getElementById('readabilityReadout');if(ro)ro.textContent=wReadName(d,v)}, {passive:true})}let note=[...d.querySelectorAll('.note')].find(x=>(x.textContent||'').includes('Contrast is not a color'));if(note)note.textContent='Contrast is not a color. Contrast is the readability layer over the colors. The slider updates quietly; the green box only reports save/load/delete actions.';let auto=[...d.querySelectorAll('button')].find(b=>(b.textContent||'').includes('Automatic App Update'));if(auto){let small=auto.querySelector('small');if(small)small.textContent='single-file v10 target'}w.automaticAppUpdate=function(){let req={type:'PMP_AUTOMATIC_APP_UPDATE_SINGLE_V10',built_at:new Date().toISOString(),target:'pmp-home-single-v10.html',safe_path:'latest pointer should point to this fixed theme-delete/readability-status file after testing'};localStorage.setItem('pmp_auto_update_request_single_v10',JSON.stringify(req));let c=d.getElementById('controlStatus');if(c)c.textContent=JSON.stringify(req,null,2)};refresh(sel.value||'Default')}F.addEventListener('load',()=>{setTimeout(patch,300);setTimeout(patch,1000);setTimeout(patch,2200);setTimeout(patch,4000)});setInterval(patch,1000);</script></body></html>

<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>PMP One-Click Whole App Test v1</title><style>body{margin:0;background:#140f0c;color:#fff7ec;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.top{position:sticky;top:0;z-index:5;background:#201711;border-bottom:1px solid #76513e;padding:12px}.card{background:#2a211b;border:1px solid #76513e;border-radius:16px;margin:10px;padding:12px}.big{width:100%;font-size:24px;border:3px solid #d8b58a;background:#fff3de;color:#23160f;border-radius:18px;padding:20px 12px;font-weight:950}.small{font-size:14px;opacity:.82}.bar{height:12px;background:#0b0806;border:1px solid #49372c;border-radius:999px;overflow:hidden;margin-top:10px}.fill{height:100%;width:0;background:#fff3de}pre{white-space:pre-wrap;background:#080605;border:1px solid #49372c;border-radius:12px;padding:10px;max-height:38vh;overflow:auto}iframe{width:100%;height:55vh;border:0;background:white;border-top:1px solid #76513e}</style><script src="pmp-page-hidden-state-reveal-contract-v1.js?oneclick=1"></script><script src="pmp-page-snapshot-contract-v1.js?oneclick=1"></script><script src="pmp-snapshot-verification-gate-v1.js?oneclick=1"></script><script src="pmp-snapshot-verification-gate-bridge-v1.js?oneclick=1"></script><script src="pmp-reload-perfect-restore-gate-v1.js?oneclick=1"></script><script src="pmp-snapshot-visibility-test-harness-v1.js?oneclick=1"></script><script src="pmp-app-route-inventory-scanner-v1.js?oneclick=1"></script></head><body><div class="top"><b>One-Click Whole App Test v1</b><div class="small">Separate test page. Inventories safe app routes first, then tests them. Does not change the live app.</div></div><div class="card"><button class="big" onclick="runAll()">TEST WHOLE APP</button><div class="bar"><div id="fill" class="fill"></div></div><pre id="out">Ready. Tap TEST WHOLE APP.</pre></div><iframe id="app" title="PMP one-click whole app test frame"></iframe><script>const f=document.getElementById('app'),out=document.getElementById('out'),fill=document.getElementById('fill');function show(x){out.textContent=typeof x==='string'?x:JSON.stringify(x,null,2)}function prog(i,n){fill.style.width=Math.round((i/n)*100)+'%'}function src(h){return 'pmp-current-inner-cleanbug-rgcontrols-v23.html?oneclick='+Date.now()+h}function sleep(ms){return new Promise(r=>setTimeout(r,ms))}function doc(){try{return f.contentDocument||f.contentWindow.document}catch(e){return null}}function load(h){return new Promise(res=>{f.onload=()=>setTimeout(res,2300);f.src=src(h)})}function text(x){return String(x&&x.textContent||'').replace(/\s+/g,' ').trim()}function clickLabel(label){let d=doc();if(!d)return false;let needle=String(label||'').toLowerCase();let list=[...d.querySelectorAll('button,a,div,span,[role="button"],[data-open-bank]')];let hit=list.find(x=>text(x).toLowerCase().includes(needle)||String(x.getAttribute('data-open-bank')||'').toLowerCase().includes(needle));if(hit){try{hit.scrollIntoView({block:'center'})}catch(e){}hit.click();return true}return false}function harness(name){let r=top.PMPSnapshotVisibilityTestHarnessV1.run();return{test:name,status:r.status,pass:!!r.pass,missing_systems:r.missing_systems,page_fail_count:r.page_fail_count,pages:r.pages}}async function testHash(label,hash,i,n){prog(i,n);show('Testing '+label+'...');await load(hash);await sleep(700);return harness(label)}async function testClick(label,i,n){prog(i,n);show('Testing '+label+'...');await load('#bank');await sleep(900);clickLabel('bank');await sleep(700);let opened=clickLabel(label);await sleep(1700);let r=harness(label);r.open_clicked=opened;return r}async function inventory(){show('Inventorying app routes...');await load('#bank');await sleep(1000);let inv=top.PMPAppRouteInventoryScannerV1.scan(f);return inv}async function runAll(){let results=[],inv=await inventory();let main=inv.main_routes||[];let clicks=inv.click_routes||[];let safeClicks=clicks.filter(x=>x.kind==='bank'||/bank|safe writer|resident|settings|color|intelligence|continuous work|engine|connections/i.test(x.label||''));let total=main.length+safeClicks.length;let i=0;for(const r of main){results.push(await testHash(r.label,r.hash,++i,total))}for(const r of safeClicks){results.push(await testClick(r.label,++i,total))}prog(total,total);let failed=results.filter(x=>!x.pass||x.page_fail_count||(('open_clicked'in x)&&!x.open_clicked));let pass=failed.length===0;show({type:'PMP_ONE_CLICK_WHOLE_APP_TEST_V1_RECEIPT',status:pass?'ONE_CLICK_WHOLE_APP_PASS':'ONE_CLICK_WHOLE_APP_FAIL',pass,inventory_count:{main:main.length,click:safeClicks.length,total},failed_count:failed.length,failed,inventory:inv,results})}f.src=src('#world');</script></body></html>

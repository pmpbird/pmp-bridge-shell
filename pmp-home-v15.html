<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>PMP Home v15</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#52b5df}iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#52b5df}</style></head><body><iframe id="app" src="pmp-home-v11.html?fresh=v15-storage-manager"></iframe><script>const F=document.getElementById('app');const SOFT=3.5*1024*1024,HARD=4.5*1024*1024;function inner(){try{return{w:F.contentWindow,d:F.contentDocument||F.contentWindow.document}}catch(e){return null}}function sizeOf(){let total=0,items=[];for(let i=0;i<localStorage.length;i++){let k=localStorage.key(i),v=localStorage.getItem(k)||'';let bytes=(k.length+v.length)*2;total+=bytes;items.push({key:k,bytes})}items.sort((a,b)=>b.bytes-a.bytes);return{bytes:total,mb:Math.round(total/1024/1024*100)/100,items}}function protectedKey(k){return k==='pmp_current_clean_app_target'||k==='pmp_last_good_clean_app'||k==='pmp_code_safety_bank_v1'||k==='pmp_safe_writer_last_good_v3'||k==='pmp_backend_config_v1'||k==='pmp_clean_connection_packets_v5'||k==='pmp_corpus_inbox_v1'||k.startsWith('pmp_resident_learning')}function trimArrayKey(k,keep){let changed=false;try{let a=JSON.parse(localStorage.getItem(k)||'[]');if(Array.isArray(a)&&a.length>keep){localStorage.setItem(k,JSON.stringify(a.slice(-keep)));changed=true}}catch(e){}return changed}function cleanStorage(){let before=sizeOf();let actions=[];for(let i=0;i<localStorage.length;i++){let k=localStorage.key(i);if(!k)continue;if(k.startsWith('pmp_resident_work_ledger')){if(trimArrayKey(k,12))actions.push('trimmed '+k+' to newest 12 records')}if(k.startsWith('pmp_resident_chat_thread')){if(trimArrayKey(k,30))actions.push('trimmed '+k+' to newest 30 messages')}if(k.includes('debug')||k.includes('temp')||k.includes('scratch')){if(!protectedKey(k)){localStorage.removeItem(k);actions.push('removed temporary key '+k);i--}}}let after=sizeOf();return{type:'PMP_STORAGE_CLEAN_REPORT_V15',before,after,freed_bytes:before.bytes-after.bytes,actions,protected_rule:'Kept last_good, Code Safety bank, safe points, saved packets, Corpus, backend config, and Resident lessons.'}}function checkStorage(){let s=sizeOf();let state=s.bytes>HARD?'CRITICAL':s.bytes>SOFT?'WATCH':'OK';return{type:'PMP_STORAGE_STATUS_V15',state,used_mb:s.mb,estimated_soft_limit_mb:Math.round(SOFT/1024/1024*100)/100,estimated_hard_limit_mb:Math.round(HARD/1024/1024*100)/100,largest_keys:s.items.slice(0,10),rule:'Clean low-value logs first. Do not delete protected app memory automatically.'}}function say(msg,work,next){let obj=inner();if(obj&&obj.w&&obj.w.plain)obj.w.plain(msg,work,next);else alert(msg)}function patch(){let obj=inner();if(!obj)return;let w=obj.w,d=obj.d;if(!w||!d||w.__storageV15)return;w.__storageV15=true;w.checkStorage=function(){let r=checkStorage();say('Storage is '+r.state+'. The app is using about '+r.used_mb+' MB locally.',r,r.state==='OK'?'No cleanup needed right now.':'Tap Clean Storage to trim old logs and chat history.');return r};w.cleanStorage=function(){let r=cleanStorage();say('I cleaned the safe low-value storage. I kept protected app memory.',r,'Run Check Storage again if you want to see the new size.');return r};let launcher=d.getElementById('launcher');let truth=d.getElementById('truth');if(launcher&&!d.getElementById('storageBtns')){let div=d.createElement('div');div.id='storageBtns';div.className='grid';div.innerHTML='<button class="btn" onclick="checkStorage()">Check Storage</button><button class="btn" onclick="cleanStorage()">Clean Storage</button>';launcher.insertBefore(div,truth)}let oldRun=w.residentRun;if(oldRun&&!w.__storageRunPatch){w.__storageRunPatch=true;w.residentRun=function(){let q=(d.getElementById('ask')?.value||'').toLowerCase();if(/storage|memory full|local storage|clean memory|delete old/.test(q)){if(/clean|delete|clear|free/.test(q))return w.cleanStorage();return w.checkStorage()}return oldRun()}}try{w.plain('Storage manager is ready. I can check storage and clean old low-value logs when needed.',{kind:'storage_v15_ready'},'Use Launcher → Check Storage, or ask Resident “check storage.”')}catch(e){}}F.addEventListener('load',()=>{setTimeout(patch,500);setTimeout(patch,1500);setTimeout(patch,3000)});setInterval(patch,2000);</script></body></html>

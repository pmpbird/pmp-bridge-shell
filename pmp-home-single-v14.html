<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PMP">

<title>PMP Current Inner</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#52b5df}iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#52b5df}</style>
</head>
<body>
<iframe id="app" src="pmp-home-single-v6.html?fresh=pmp-current-inner-no-shortcut-app-update"></iframe>
<script>
const F=document.getElementById('app');
const EYES_KEY='pmp_inventory_eyes_latest_v1';
const VISIBLE_KEY='pmp_lossless_visible_compact_latest_v1';
const INVENTORY_KEY='pmp_app_lossless_inventory_latest_v1';
const RESIDENT_KEY='pmp_resident_auto_lossless_inventory_context_v1';
const RULE_KEY='pmp_lossless_improve_runs_inventory_rule_v1';
const MANIFEST_PATH='pmp-inventory-eyes-manifest-v1.0.0.json';
const VAULT_CURRENT='pmp-lossless-inventory-vault/current.json';
const VAULT_HISTORY='pmp-lossless-inventory-vault/history/';
const WRITER_NAME='Vault GitHub Writer';
const SHORTCUT_NAME='PMP Vault GitHub Writer';
const SHORTCUT_URL='shortcuts://run-shortcut?name='+encodeURIComponent(SHORTCUT_NAME);
const FALLBACK=['index.html','pmp-home-single-v6.html','pmp-home-single-v14.html','bm.html','private-bug-memory-hub-v9.html','resident-notes-catalog-v3.html','resident-notes-backend-v2.html','resident-zip-xray-v2.html','private-bug-mixer-lab-v1.html','private-bug-mixer-lab-spec-v1.json','pmp-shared-theme-v1.js'];
function now(){return new Date().toISOString()}
function read(k,f=null){try{let v=localStorage.getItem(k);return v?JSON.parse(v):f}catch(e){return f}}
function write(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function text(x,n=120){return String(x||'').replace(/\s+/g,' ').trim().slice(0,n)}
function uniq(a){return[...new Set((a||[]).filter(Boolean))]}
function view(){try{return{w:F.contentWindow,d:F.contentDocument||F.contentWindow.document}}catch(e){return null}}
function status(msg){let o=view(),d=o&&o.d;if(!d)return;let c=d.getElementById('controlStatus');if(c)c.textContent=msg;let r=d.getElementById('residentReply');if(r)r.textContent=msg}
function bridgePanel(){let o=view(),d=o&&o.d;return d&&d.getElementById('bridgePanel')}
function setPanel(obj){let p=bridgePanel();if(p){p.className='note';p.textContent=typeof obj==='string'?obj:JSON.stringify(obj,null,2)}}
function residentReply(msg){let o=view(),d=o&&o.d;if(!d)return;let r=d.getElementById('residentReply');if(r)r.textContent=msg}
function residentAsk(){let o=view(),d=o&&o.d;let a=d&&d.getElementById('ask');return a?String(a.value||''):''}
function storageKeys(){let ks=[];try{ks=Object.keys(localStorage).sort()}catch(e){}return ks.map(k=>({key:k,classification:/bug|private|token|pass|backend|secret|memory/i.test(k)?'private_or_sensitive_key_name_only':'public_safe_key_name_only',value_captured:false}))}
function live(trigger){let o=view(),d=o&&o.d;let out={trigger,title:'unknown',url:location.href,screen:'unknown',buttons:[],links:[],inputs:0,textareas:0,selects:0,panels:0,notes:0,drawers:0,visible_text_sample:'',local_storage_keys:storageKeys()};try{out.title=d.title||'untitled';let on=[...d.querySelectorAll('.screen')].find(s=>s.classList.contains('on'));out.screen=on?on.id:'unknown';out.buttons=[...d.querySelectorAll('button')].map((b,i)=>({index:i,text:text(b.textContent,120),visible:b.offsetParent!==null,onclick:(b.getAttribute('onclick')||'').slice(0,120)}));out.links=[...d.querySelectorAll('a[href]')].map((a,i)=>({index:i,text:text(a.textContent,120),href:a.getAttribute('href'),visible:a.offsetParent!==null}));out.inputs=d.querySelectorAll('input').length;out.textareas=d.querySelectorAll('textarea').length;out.selects=d.querySelectorAll('select').length;out.panels=d.querySelectorAll('.panel,.dock,.card').length;out.notes=d.querySelectorAll('.note,.warn,.reply,.statusbar').length;out.drawers=d.querySelectorAll('.drawer').length;out.visible_text_sample=text(d.body&&d.body.innerText,1200)}catch(e){out.error=String(e.message||e)}return out}
async function manifest(){try{let r=await fetch(MANIFEST_PATH+'?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('manifest '+r.status);return await r.json()}catch(e){return{type:'PMP_INVENTORY_EYES_MANIFEST_FALLBACK',version:'fallback',paths:FALLBACK,classification_rules:{current_active:['pmp-home-single-v6.html','pmp-home-single-v14.html','bm.html','private-bug-memory-hub-v9.html','resident-notes-catalog-v3.html','resident-notes-backend-v2.html','resident-zip-xray-v2.html','private-bug-mixer-lab-v1.html']},load_error:String(e.message||e)}}}
function role(path){let p=String(path||'').toLowerCase();let r=p.endsWith('.html')?'html_page':p.endsWith('.js')?'javascript_helper':p.endsWith('.json')?'json_manifest_or_spec':p.endsWith('.css')?'css_shell_or_style':p.endsWith('.toml')?'config':'unknown';if(/bug-memory|bug_memory|bm\.html/.test(p))r+=' / bug_memory_related';if(/resident/.test(p))r+=' / resident_related';if(/zip|xray/.test(p))r+=' / scanner_related';if(/mixer/.test(p))r+=' / bug_mixer_related';if(/home|index|app|launcher|current/.test(p))r+=' / home_or_entry_related';if(/worker|backend|wrangler/.test(p))r+=' / backend_or_worker_related';return r}
function state(path,m){let c=(m&&m.classification_rules)||{};if((c.current_active||[]).includes(path))return'active_current';if((c.visual_reference||[]).includes(path))return'active_reference';if((c.helper_not_user_facing||[]).includes(path))return'helper_not_user_facing';if((c.likely_archive_or_test||[]).includes(path))return'inactive_archive_or_test';if((c.expected_missing_or_future||[]).includes(path))return'inactive_future_or_unavailable_candidate';if(/v\d+\.html$/i.test(path))return'inactive_version_candidate';return'inactive_candidate'}
async function scan(trigger){let m=await manifest();let paths=uniq([...(m.paths||FALLBACK)]);let files=paths.map(path=>{let s=state(path,m);return{path,status:s,active:s.startsWith('active'),inactive:!s.startsWith('active'),role:role(path)}});let active=files.filter(f=>f.active),inactive=files.filter(f=>f.inactive),helpers=files.filter(f=>/helper|spec|config|worker|css|js|json/.test(f.role));let privacy=files.filter(f=>/bug|private|resident|backend|worker|notes/i.test(f.path)).map(f=>({path:f.path,status:f.status,role:f.role,private_values_captured:false}));let themes=files.filter(f=>/home|bug-memory|resident-notes|zip-xray|mixer|room-shell|shared-theme/i.test(f.path)).map(f=>({path:f.path,status:f.status,role:f.role,needs_theme_check:/resident-notes|zip-xray|mixer/i.test(f.path)}));let byRole={html_pages:files.filter(f=>f.path.endsWith('.html')).length,json_files:files.filter(f=>f.path.endsWith('.json')).length,js_files:files.filter(f=>f.path.endsWith('.js')).length,css_files:files.filter(f=>f.path.endsWith('.css')).length,config_files:files.filter(f=>/\.toml$|worker/i.test(f.path)).length};return{type:'PMP_INVENTORY_EYES_APP_SCAN',version:'2.9.0-current-inner-no-shortcut-app-update',built_at:now(),trigger,scan_mode:'SAFE_MANIFEST_INVENTORY',why_safe:'The Home Screen app reads the manifest and live screen instead of mass-fetching every app file from GitHub Pages.',truth_boundary:'This sees the app field listed in the Inventory Eyes manifest plus the live loaded app screen. Deep file-content inventory belongs in GitHub-side report files, not iPhone mass fetch.',language_rule:'Use active/inactive language. Inactive means known to inventory but not part of the current active app path.',manifest:{path:MANIFEST_PATH,type:m.type,version:m.version,path_count:paths.length,load_error:m.load_error||null},live_screen:live(trigger),summary:{manifest_paths:paths.length,active_files:active.length,inactive_files:inactive.length,helper_or_support_files:helpers.length,privacy_sensitive_surfaces:privacy.length,theme_review_targets:themes.length,local_storage_keys:storageKeys().length,...byRole},active_files:active,inactive_files:inactive,helper_or_support_files:helpers,privacy_surfaces:privacy,theme_review_targets:themes,file_inventory:files}}
function receipt(s){let theme=(s.theme_review_targets||[]).filter(x=>x.needs_theme_check).map(x=>x.path);return{type:'PMP_LOSSLESS_REPORT_RECEIPT',built_at:now(),full_report_saved:true,full_report_key:EYES_KEY,storage_area:'PMP Lossless Inventory Vault',vault_target:VAULT_CURRENT,writer_name:WRITER_NAME,shortcut_name:SHORTCUT_NAME,home_screen_app:'PMP Current inner layer; Automatic App Update stays inside app',export_rule:'Copy Lossless Report creates a PMP_LOSSLESS_VAULT_WRITE_PACKET, copies it to clipboard, and opens the PMP Vault GitHub Writer Shortcut.',resident_command_bridge:'Resident command installed: run lossless quality / copy lossless report / send lossless to vault.',scan_mode:s.scan_mode,version:s.version,summary:s.summary,active_files:(s.active_files||[]).map(x=>x.path),theme_review_targets:theme.slice(0,20),privacy:'key names only; private values not captured; Apple Notes/private Bug Memory not scanned',truth_boundary:s.truth_boundary,next:'Tap Copy Lossless Report or tell Resident: copy lossless report.'}}
async function runInventory(trigger,visible){if(visible)setPanel('Inventory Eyes reading manifest and live app screen...\nSafe mode. Compact Shortcut-vault receipt will appear quickly.');let s=await scan(trigger);write(EYES_KEY,s);write(INVENTORY_KEY,s);write(RULE_KEY,{type:'PMP_LOSSLESS_IMPROVE_RULE',version:'3.9.0-current-inner',updated_at:s.built_at,rule:'Improve Lossless Quality and Resident lossless commands save full Inventory Eyes locally and show compact receipt. Copy Lossless Report copies Vault Write Packet to clipboard and opens PMP Vault GitHub Writer Shortcut. Automatic App Update stays inside PMP Current.',inventory_key:INVENTORY_KEY,inventory_eyes_key:EYES_KEY,resident_context_key:RESIDENT_KEY,vault_target:VAULT_CURRENT,writer_name:WRITER_NAME,shortcut_name:SHORTCUT_NAME,resident_commands:['run lossless quality','improve lossless quality','copy lossless report','send lossless to vault']});write(RESIDENT_KEY,{type:'PMP_RESIDENT_AUTO_CONTEXT',version:'3.9.0-current-inner',updated_at:s.built_at,source:'Safe Inventory Eyes',required_context_key:EYES_KEY,resident_instruction:'Resident can run lossless quality when the user asks. Use active/inactive language. Do not expose private Bug Memory or promote without test pass.',latest_scan_summary:s.summary,truth_boundary:s.truth_boundary});let r=receipt(s);write(VISIBLE_KEY,r);if(visible)setPanel(r);return s}
function reportObject(){let s=read(EYES_KEY,null);if(!s)return null;return{type:'PMP_LOSSLESS_REPORT_WITH_INVENTORY_EYES',built_at:now(),inventory_eyes_captured:true,inventory_key:INVENTORY_KEY,inventory_eyes_key:EYES_KEY,resident_context_updated:true,privacy:'localStorage key names only; private values not captured. Apple Notes/private Bug Memory not scanned.',scan_summary:s.summary||{},truth_boundary:s.truth_boundary||'',inventory_eyes:s}}
function vaultPacketText(){let report=reportObject();if(!report)return null;let stamp=now();let history=VAULT_HISTORY+stamp.replace(/[:.]/g,'-')+'.json';return JSON.stringify({type:'PMP_LOSSLESS_VAULT_WRITE_PACKET',version:'1.1.0-shortcut',built_at:stamp,writer_name:WRITER_NAME,shortcut_name:SHORTCUT_NAME,storage_area:'PMP Lossless Inventory Vault',target_current:VAULT_CURRENT,target_history:history,write_instruction:'Shortcut reads this packet from clipboard and posts packet/report to the GitHub Issue Inbox. Do not write private Bug Memory or private values.',privacy_gate:{private_bug_memory:false,apple_notes_contents:false,tokens:false,passwords:false,secrets:false,private_values:false,localStorage_key_names_only:true},report},null,2)}
async function writeClipboard(textValue){try{await navigator.clipboard.writeText(textValue);return true}catch(e){try{let ta=document.createElement('textarea');ta.value=textValue;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.focus();ta.select();let ok=document.execCommand('copy');ta.remove();return ok}catch(err){return false}}}
async function exportJsonFile(){let txt=vaultPacketText();if(!txt){status('No full report found. Tap Improve Lossless Quality or ask Resident to run lossless quality first.');residentReply('No full report found. Run lossless quality first.');return false}let ok=await writeClipboard(txt);if(!ok){status('Could not copy Vault Write Packet. Try again or upload/send the packet manually.');residentReply('Could not copy Vault Write Packet.');return false}status('Copied Vault Write Packet. Opening PMP Vault GitHub Writer Shortcut.');residentReply('Copied Vault Write Packet. Opening PMP Vault GitHub Writer Shortcut.');setTimeout(()=>{location.href=SHORTCUT_URL},250);return true}
function activePanel(d){let p=d&&d.getElementById('bridgePanel');if(!p||!p.classList.contains('panel'))return'';let h=p.querySelector('h2');return h?(h.textContent||'').trim():''}
function closePanel(d){let p=d&&d.getElementById('bridgePanel');if(p){p.className='note';p.textContent='Bridge ready.'}}
function bridgeText(){let p=bridgePanel();return p?(p.innerText||p.textContent||'').trim():''}
function wantsLossless(q){q=String(q||'').toLowerCase();return /lossless|listless|inventory eyes|inventory|vault/.test(q)&&/run|improve|quality|scan|check|copy|send|post|vault|report/.test(q)}
function wantsSend(q){q=String(q||'').toLowerCase();return /copy|send|post|vault|shortcut|report|upload/.test(q)}
async function residentLosslessCommand(q){residentReply('Resident is running Lossless Quality now...');let s=await runInventory('Resident command: '+(q||'run lossless quality'),true);residentReply('Lossless Quality complete. Full Inventory Eyes report saved locally. Say or type “copy lossless report” to send it to the vault.');if(wantsSend(q)){residentReply('Lossless Quality complete. Sending report to Vault Shortcut...');setTimeout(()=>exportJsonFile(),150)}return s}
function simplify(){let o=view(),d=o&&o.d;if(!d)return;for(const btn of [...d.querySelectorAll('button')]){let t=(btn.textContent||'').replace(/\s+/g,' ').trim();if(t.includes('Prepare Project Export')){btn.remove();continue}if(/Copy Current|Copy Green Box|Copy Lossless Report/i.test(t)){let spans=[...btn.querySelectorAll('span')];if(spans.length>=2)spans[1].innerHTML='Copy Lossless Report<small>Open Vault Shortcut</small>';else btn.textContent='Copy Lossless Report'}if((t==='Share'||t==='Connections')&&!btn.dataset.panelToggle){btn.dataset.panelToggle='1';btn.addEventListener('click',e=>{if(activePanel(d)===t){e.preventDefault();e.stopImmediatePropagation();closePanel(d)}},true)}}let bridge=d.getElementById('bridge');if(bridge&&!d.getElementById('pmpBridgeSimplifyNote')){let note=d.createElement('div');note.id='pmpBridgeSimplifyNote';note.className='note';note.textContent='PMP Current: Automatic App Update stays inside the app. Copy Lossless Report opens the Vault Shortcut. Resident can run: run lossless quality, copy lossless report, send lossless to vault.';let card=bridge.querySelector('.card'),strip=bridge.querySelector('.toolstrip');if(card&&strip)card.insertBefore(note,strip)}}
function patchResidentCommand(o){let d=o&&o.d,w=o&&o.w;if(!d||!w||w.__residentLosslessCurrent)return;let old=typeof w.residentRun==='function'?w.residentRun:null;w.__residentLosslessCurrent=1;w.residentRun=function(){let q=residentAsk();if(wantsLossless(q))return residentLosslessCommand(q);if(old)return old.apply(this,arguments);residentReply('Resident heard you. Try: run lossless quality, copy lossless report, or send lossless to vault.')};for(const b of [...d.querySelectorAll('button')].filter(x=>(x.textContent||'').trim()==='Run')){if(!b.dataset.residentLosslessCurrent){b.dataset.residentLosslessCurrent='1';b.addEventListener('click',e=>{let q=residentAsk();if(wantsLossless(q)){e.preventDefault();e.stopImmediatePropagation();residentLosslessCommand(q)}},true)}}}
function stayInsideAppUpdate(){status('PMP Current checked. Staying inside the app.');try{if(parent&&parent.pmpCurrentReload)parent.pmpCurrentReload()}catch(e){}return false}
function patchAppUpdate(o){let d=o&&o.d,w=o&&o.w;if(!d||!w)return;w.automaticAppUpdate=stayInsideAppUpdate;for(const b of [...d.querySelectorAll('button')]){let t=(b.textContent||'').replace(/\s+/g,' ').trim();if(t.includes('Automatic App Update')&&!b.dataset.currentStayInside){b.dataset.currentStayInside='1';b.addEventListener('click',e=>{e.preventDefault();e.stopImmediatePropagation();stayInsideAppUpdate()},true);let small=b.querySelector('small');if(small)small.textContent='check current app, stay inside PMP'}}}
function patch(){let o=view();if(!o||!o.d)return;simplify();patchResidentCommand(o);patchAppUpdate(o);let bm=[...o.d.querySelectorAll('button')].find(x=>(x.textContent||'').trim()==='Bug Memory');if(bm&&!bm.dataset.bm){bm.dataset.bm='1';bm.onclick=e=>{if(e)e.preventDefault();location.href='bm.html'}}if(o.w&&!o.w.__bm_route_current){let old=typeof o.w.showSecret==='function'?o.w.showSecret:null;o.w.__bm_route_current=1;o.w.showSecret=function(n){if(String(n)==='Bug Memory'){location.href='bm.html';return}if(old)return old.apply(this,arguments)}}if(o.w&&!o.w.__inventoryEyesCurrent){let old=typeof o.w.improveLossless==='function'?o.w.improveLossless:null;o.w.__inventoryEyesCurrent=1;o.w.improveLossless=function(){if(old)try{old.apply(this,arguments)}catch(e){};setTimeout(()=>runInventory('Improve Lossless Quality button',true),80)}}if(o.w&&!o.w.__losslessShortcutCurrent){let old=typeof o.w.copyCurrent==='function'?o.w.copyCurrent:null;o.w.__losslessShortcutCurrent=1;o.w.copyCurrent=function(){if(bridgeText())return exportJsonFile();if(old)return old.apply(this,arguments);return exportJsonFile()}}
for(const cb of [...o.d.querySelectorAll('button')].filter(x=>/COPY CURRENT|COPY GREEN BOX|COPY LOSSLESS REPORT/i.test(x.textContent||''))){if(!cb.dataset.losslessShortcutCurrent){cb.dataset.losslessShortcutCurrent='1';cb.addEventListener('click',e=>{if(bridgeText()){e.preventDefault();e.stopImmediatePropagation();exportJsonFile()}},true)}}
for(const ib of [...o.d.querySelectorAll('button')].filter(x=>(x.textContent||'').toUpperCase().includes('IMPROVE LOSSLESS QUALITY'))){if(!ib.dataset.inventoryEyesCurrent){ib.dataset.inventoryEyesCurrent='1';ib.addEventListener('click',()=>setTimeout(()=>runInventory('Improve Lossless Quality button click',true),120),true)}}}
F.onload=function(){setTimeout(patch,250);setTimeout(patch,900);setTimeout(patch,1800);setTimeout(patch,3500)};
setInterval(patch,1000);
</script>
</body>
</html>

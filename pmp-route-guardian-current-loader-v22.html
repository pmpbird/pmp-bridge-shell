<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#f3ded4">
<title>PMP Route Guardian v22</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f3ded4;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#07101c}.wrap{position:fixed;inset:0;display:grid;place-items:center;background:#f3ded4;padding:18px;text-align:center}.box{width:min(760px,100%);box-sizing:border-box;background:#fff;border:3px solid #07101c;border-radius:28px;padding:18px;display:grid;gap:14px}.badge{background:#acd1fb;border:2px solid #07101c;border-radius:16px;padding:12px;font-weight:950}.grid{display:grid;gap:10px}button{background:#acd1fb;border:2px solid #07101c;border-radius:16px;padding:12px;font:inherit;font-weight:950;color:#07101c}.dark{background:#172234;color:#eef4fb}.runFlash{font-size:1.18em;background:#fff3de!important;border:3px solid #07101c!important;animation:pmpRunFlash 1s infinite}@keyframes pmpRunFlash{0%{transform:scale(1);box-shadow:0 0 0 0 rgba(7,16,28,.55)}50%{transform:scale(1.035);box-shadow:0 0 0 10px rgba(7,16,28,.08)}100%{transform:scale(1);box-shadow:0 0 0 0 rgba(7,16,28,.55)}}pre{display:block;text-align:left;white-space:pre-wrap;background:#102033;color:#eaffef;border-radius:16px;padding:10px;height:24vh;min-height:210px;max-height:360px;overflow:auto;font:750 9px/1.2 monospace;box-sizing:border-box;user-select:text;-webkit-user-select:text}
</style>
</head>
<body>
<div class="wrap"><div class="box"><div class="badge">ROUTE GUARDIAN v22.9 — CURRENT MAP ONLY</div><h1 style="margin:4px 0">Route Guardian</h1><p id="msg" style="margin:0">Press Run App. Route Guardian will register Service Worker / Cache Governor, then consume one Current Map handoff.</p><div class="grid"><button id="openBtn" class="runFlash" type="button">Run App</button><button id="reloadOwnerBtn" type="button">Reload Owner Diagnostics</button><button id="copyBtn" class="dark" type="button">Copy Report</button><button id="showBtn" class="dark" type="button">Show / Hide Report</button></div><pre id="report">No report yet.</pre></div></div>
<script src="pmp-current-route-resolver-v1.js"></script>
<script>
var K='rg22-a002-p1-current-map-only-20260711A';
var EXPECTED_SW='1.0.1-pass75-service-worker-cache-governor-network-first-runtime-assets-20260709A';
var SW_PATH='pmp-service-worker-cache-governor-v1.js';
var LAUNCH_PAUSE_MS=1500;
var msg=document.getElementById('msg');
var btn=document.getElementById('openBtn');
var roBtn=document.getElementById('reloadOwnerBtn');
var copy=document.getElementById('copyBtn');
var show=document.getElementById('showBtn');
var out=document.getElementById('report');
var resolver=window.PMPCurrentRouteResolver;
var receipt={type:'RG22_READY',version:K,at:new Date().toISOString(),route_authority:'pmp-current-map-v12.json',implicit_fallbacks:false,runtime_cache_check:'armed',service_worker_register:'armed',network_first_runtime_assets:'required',clipboard_strategy:'hidden_copy_no_visible_selection',report_box:'reserved_height_no_layout_shift',launch_pause_ms:LAUNCH_PAUSE_MS};

function getLS(k){try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}}
function setLS(k,v){try{localStorage.setItem(k,JSON.stringify(v,null,2))}catch(e){}}
function writeCopyAudit(a){try{localStorage.setItem('pmp_route_guardian_copy_attempt_v1',JSON.stringify(a,null,2))}catch(e){}}
function hiddenCopy(text,a){var ok=false;try{var ta=document.createElement('textarea');ta.value=String(text||'');ta.setAttribute('readonly','readonly');ta.style.position='fixed';ta.style.left='12px';ta.style.top='12px';ta.style.width='2px';ta.style.height='2px';ta.style.opacity='0.01';ta.style.fontSize='16px';document.body.appendChild(ta);ta.focus();ta.select();ta.setSelectionRange(0,ta.value.length);ok=document.execCommand&&document.execCommand('copy')===true;ta.remove();a.hidden_textarea_attempted=true;a.hidden_textarea_ok=!!ok}catch(e){a.hidden_textarea_error=String(e&&e.message||e)}return ok}
async function copyText(text,label,allowVisibleSelect){text=String(text||'');var a={type:'PMP_ROUTE_GUARDIAN_COPY_ATTEMPT_V1',version:K,route_guardian_badge:'v22.9',at:new Date().toISOString(),label:label||'copy',chars:text.length,strategy:'hidden_copy_no_visible_selection',ok:false};var ok=hiddenCopy(text,a);if(!ok&&navigator.clipboard&&navigator.clipboard.writeText){a.clipboard_api_attempted=true;try{await navigator.clipboard.writeText(text);ok=true;a.clipboard_api_ok=true}catch(e){a.clipboard_api_error=String(e&&e.name?e.name+': ':'')+String(e&&e.message||e)}}if(!ok&&allowVisibleSelect){try{out.style.display='block';out.textContent=text;var sel=window.getSelection&&window.getSelection(),range=document.createRange();range.selectNodeContents(out);if(sel){sel.removeAllRanges();sel.addRange(range)}a.visible_selection_left=true}catch(e){a.visible_selection_error=String(e&&e.message||e)}}a.ok=!!ok;a.final_result=ok?'copied_or_browser_reported_copied':allowVisibleSelect?'copy_not_confirmed_report_selected':'copy_not_confirmed_no_visible_selection';writeCopyAudit(a);return ok}
function reportText(){return JSON.stringify(receipt,null,2)}
async function copyReport(label){out.style.display='block';out.textContent=reportText();var ok=await copyText(reportText(),label||'manual_copy',true);copy.textContent=ok?'Copied':'Selected';msg.textContent=ok?'Report copied.':'Copy was not confirmed. Report is selected in the report box.';setTimeout(function(){copy.textContent='Copy Report'},1200);return ok}

function failClosed(error,context){
  var diagnostic=resolver?resolver.diagnostic(error,context):{type:'PMP_ROUTE_FAIL_CLOSED_DIAGNOSTIC_V1',at:new Date().toISOString(),context:String(context||'route_guardian'),code:'RESOLVER_UNAVAILABLE',message:String(error&&error.message||error),action:'navigation_blocked_no_fallback_consulted'};
  receipt={type:'RG22_FAIL_CLOSED',version:K,at:new Date().toISOString(),route_authority:'pmp-current-map-v12.json',implicit_fallbacks:false,diagnostic:diagnostic,rule:'Navigation is blocked. Route Guardian does not consult older maps, hard-coded app destinations, saved routes, or implicit fallbacks.'};
  setLS('pmp_route_guardian_v22_receipt',receipt);
  out.style.display='block';
  out.textContent=reportText();
  msg.textContent='Current Map validation failed. Navigation was blocked with no fallback.';
  btn.disabled=false;
  roBtn.disabled=false;
  return diagnostic;
}

async function currentAppHandoff(){
  if(!resolver)throw new Error('PMP Current Route Resolver did not load.');
  var loaded=await resolver.load();
  var handoff=resolver.resolve(loaded.map,'current_app');
  return {loaded:loaded,handoff:handoff,hash:resolver.normalizeHash(location.hash,loaded.map)};
}

async function registerSW(){var sw={supported:'serviceWorker'in navigator,path:SW_PATH,expected:EXPECTED_SW,registered:false,controller:false,ready:false,current_version:null,errors:[]};if(!sw.supported)return sw;try{navigator.serviceWorker.addEventListener('message',function(ev){var d=ev.data||{};if(d.receipt){setLS('pmp_service_worker_receipt_v1',d.receipt);sw.current_version=d.receipt.version||sw.current_version}});var reg=await navigator.serviceWorker.register(SW_PATH+'?fresh='+EXPECTED_SW,{scope:'./'});sw.registered=!!reg;try{await reg.update()}catch(e){}try{await Promise.race([navigator.serviceWorker.ready,new Promise(function(_,rej){setTimeout(function(){rej(new Error('sw_ready_timeout'))},1200)})]);sw.ready=true}catch(e){sw.errors.push(String(e&&e.message||e))}sw.controller=!!navigator.serviceWorker.controller;var r=getLS('pmp_service_worker_receipt_v1');sw.current_version=r&&r.version||sw.current_version;if(navigator.serviceWorker.controller){try{navigator.serviceWorker.controller.postMessage({type:'PMP_SW_STATUS_REQUEST',from:'route_guardian',at:new Date().toISOString()})}catch(e){sw.errors.push(String(e&&e.message||e))}}setLS('pmp_route_guardian_sw_register_receipt_v1',sw);return sw}catch(e){sw.errors.push(String(e&&e.message||e));setLS('pmp_route_guardian_sw_register_receipt_v1',sw);return sw}}
async function swStatus(regInfo){var sw={supported:'serviceWorker'in navigator,expected:EXPECTED_SW,controller:false,current_version:null,stale:false,action:'none',errors:[],registration:regInfo||null};if(!sw.supported)return sw;try{sw.controller=!!navigator.serviceWorker.controller;var r=getLS('pmp_service_worker_receipt_v1');sw.current_version=r&&r.version||null;sw.stale=sw.current_version!==EXPECTED_SW;if(sw.stale||!sw.controller){sw.action='runtime_cache_check_stale';var regs=await navigator.serviceWorker.getRegistrations();sw.registrations=regs.length;try{var keys=await caches.keys();sw.cache_keys_before=keys}catch(e){sw.errors.push('caches:'+String(e&&e.message||e))}}else{sw.action='runtime_cache_check_current'}return sw}catch(e){sw.errors.push(String(e&&e.message||e));return sw}}

async function run(){
  btn.disabled=true;
  roBtn.disabled=true;
  try{
    msg.textContent='Registering Service Worker / Cache Governor...';
    var reg=await registerSW();
    msg.textContent='Checking runtime cache...';
    var cache=await swStatus(reg);
    msg.textContent='Reading Current Map...';
    var route=await currentAppHandoff();
    var handoff=route.handoff;
    var launchUrl=resolver.buildUrl(handoff,{
      fresh:K+'-'+handoff.cache_key+'-'+Date.now(),
      map_version:handoff.map_version,
      route_epoch:handoff.route_epoch
    },route.hash);
    receipt={type:'RG22_RUN',version:K,at:new Date().toISOString(),target:handoff.path,map_path:handoff.map_path,map_version:handoff.map_version,route_epoch:handoff.route_epoch,route_role:handoff.role,route_handoff_type:handoff.type,launch_url:launchUrl,service_worker_register:reg,runtime_cache_check:cache,network_first_runtime_assets:'required',implicit_fallbacks:false,clipboard_strategy:'hidden_copy_no_visible_selection',report_box:'reserved_height_no_layout_shift',launch_pause_ms:LAUNCH_PAUSE_MS,rule:'Route Guardian registers the PMP Service Worker / Cache Governor, consumes exactly one Current Map current_app handoff, writes the launch report, pauses briefly, then opens that map-declared path. It does not consult old maps or hard-coded app fallbacks and does not delete Bank data, IndexedDB, app records, or user content.'};
    setLS('pmp_route_guardian_v22_receipt',receipt);
    out.textContent=reportText();
    msg.textContent='Current Map handoff accepted. Launching in '+(LAUNCH_PAUSE_MS/1000).toFixed(1)+' seconds...';
    await copyText(reportText(),'auto_run_copy',false);
    setTimeout(function(){try{(window.top||window).location.href=launchUrl}catch(e){location.href=launchUrl}},LAUNCH_PAUSE_MS);
  }catch(error){
    failClosed(error,'route_guardian_run');
  }
}

async function openReloadOwnerDiagnostics(){
  btn.disabled=true;
  roBtn.disabled=true;
  try{
    msg.textContent='Reading Current Map for Reload Owner Diagnostics...';
    var route=await currentAppHandoff();
    var handoff=route.handoff;
    var launchUrl=resolver.buildUrl(handoff,{
      diagnostics:'reload-owner',
      fresh:'reload-owner-diagnostics-'+handoff.cache_key+'-'+Date.now(),
      map_version:handoff.map_version,
      route_epoch:handoff.route_epoch
    },'#control');
    receipt={type:'RG22_RELOAD_OWNER_DIAGNOSTICS',version:K,at:new Date().toISOString(),target:handoff.path,map_path:handoff.map_path,map_version:handoff.map_version,route_epoch:handoff.route_epoch,route_role:handoff.role,route_handoff_type:handoff.type,launch_url:launchUrl,mode:'manual_reload_owner_diagnostics',implicit_fallbacks:false,network_first_runtime_assets:'required',clipboard_strategy:'hidden_copy_no_visible_selection',report_box:'reserved_height_no_layout_shift',rule:'Opens the Current Map current_app role for diagnostics only. It does not consult an alternate Reload Owner.'};
    setLS('pmp_route_guardian_v22_receipt',receipt);
    out.textContent=reportText();
    await copyText(reportText(),'reload_owner_diagnostics_copy',false);
    try{(window.top||window).location.href=launchUrl}catch(e){location.href=launchUrl}
  }catch(error){
    failClosed(error,'reload_owner_diagnostics');
  }
}

btn.onclick=function(e){if(e)e.preventDefault();run();return false};
roBtn.onclick=function(e){if(e)e.preventDefault();openReloadOwnerDiagnostics();return false};
copy.onclick=function(e){if(e)e.preventDefault();copyReport('manual_copy_button');return false};
show.onclick=function(){out.style.display=out.style.display==='block'?'none':'block'};
</script>
</body>
</html>

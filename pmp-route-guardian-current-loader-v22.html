<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#f3ded4">
<title>PMP Route Guardian v22</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f3ded4;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#07101c}.wrap{position:fixed;inset:0;display:grid;place-items:center;background:#f3ded4;padding:18px;text-align:center}.box{width:min(760px,100%);box-sizing:border-box;background:#fff;border:3px solid #07101c;border-radius:28px;padding:18px;display:grid;gap:14px}.badge{background:#acd1fb;border:2px solid #07101c;border-radius:16px;padding:12px;font-weight:950}.grid{display:grid;gap:10px}button{background:#acd1fb;border:2px solid #07101c;border-radius:16px;padding:12px;font:inherit;font-weight:950;color:#07101c}.dark{background:#172234;color:#eef4fb}.runFlash{font-size:1.18em;background:#fff3de!important;border:3px solid #07101c!important;animation:pmpRunFlash 1s infinite}@keyframes pmpRunFlash{0%{transform:scale(1);box-shadow:0 0 0 0 rgba(7,16,28,.55)}50%{transform:scale(1.035);box-shadow:0 0 0 10px rgba(7,16,28,.08)}100%{transform:scale(1);box-shadow:0 0 0 0 rgba(7,16,28,.55)}}pre{display:block;text-align:left;white-space:pre-wrap;background:#102033;color:#eaffef;border-radius:16px;padding:10px;height:24vh;min-height:210px;max-height:360px;overflow:auto;font:750 9px/1.2 monospace;box-sizing:border-box;user-select:text;-webkit-user-select:text}
</style>
</head>
<body>
<div class="wrap"><div class="box"><div class="badge">ROUTE GUARDIAN v22.10 — A-003 INTEGRITY REQUIRED</div><h1 style="margin:4px 0">Route Guardian</h1><p id="msg" style="margin:0">Press Run App. Route Guardian will require the active runtime-integrity controller, then consume one verified Current Map handoff.</p><div class="grid"><button id="openBtn" class="runFlash" type="button">Run App</button><button id="reloadOwnerBtn" type="button">Reload Owner Diagnostics</button><button id="copyBtn" class="dark" type="button">Copy Report</button><button id="showBtn" class="dark" type="button">Show / Hide Report</button></div><pre id="report">No report yet.</pre></div></div>
<script src="pmp-current-route-resolver-v1.js"></script>
<script>
'use strict';
var K='rg22-pass3-unit2-consumer-20260725A';
var EXPECTED_SW='1.1.0-a003-runtime-integrity-sri';
var EXPECTED_MANIFEST='pmp-runtime-integrity-manifest-v1.json';
var LAUNCH_PAUSE_MS=900;
var msg=document.getElementById('msg'),btn=document.getElementById('openBtn'),roBtn=document.getElementById('reloadOwnerBtn'),copy=document.getElementById('copyBtn'),show=document.getElementById('showBtn'),out=document.getElementById('report'),resolver=window.PMPCurrentRouteResolver;
var receipt={type:'RG22_READY',version:K,at:new Date().toISOString(),route_authority:'pmp-current-map-v12.json',runtime_integrity:'required',implicit_fallbacks:false};
function setLS(k,v){try{localStorage.setItem(k,JSON.stringify(v,null,2))}catch(e){}}
function reportText(){return JSON.stringify(receipt,null,2)}
async function copyReport(){out.style.display='block';out.textContent=reportText();try{await navigator.clipboard.writeText(reportText());copy.textContent='Copied';msg.textContent='Report copied.'}catch(e){try{var r=document.createRange(),s=window.getSelection();r.selectNodeContents(out);s.removeAllRanges();s.addRange(r)}catch(_e){}copy.textContent='Selected';msg.textContent='Copy was not confirmed. Report is selected.'}setTimeout(function(){copy.textContent='Copy Report'},1200)}
function failClosed(error,context){var diagnostic=resolver?resolver.diagnostic(error,context):{type:'PMP_ROUTE_FAIL_CLOSED_DIAGNOSTIC_V1',at:new Date().toISOString(),context:String(context||'route_guardian'),code:'RESOLVER_UNAVAILABLE',message:String(error&&error.message||error),action:'navigation_blocked_no_unverified_fallback_consulted'};receipt={type:'RG22_FAIL_CLOSED',version:K,at:new Date().toISOString(),runtime_integrity:'required',implicit_fallbacks:false,diagnostic:diagnostic,rule:'Navigation is blocked. Route Guardian does not register or accept a non-integrity Service Worker and does not consult alternate destinations.'};setLS('pmp_route_guardian_v22_receipt',receipt);out.style.display='block';out.textContent=reportText();msg.textContent='Runtime integrity validation failed. Navigation was blocked.';btn.disabled=false;roBtn.disabled=false;return diagnostic}
async function integrityStatus(){if(!('serviceWorker'in navigator)||!navigator.serviceWorker.controller)throw new Error('Runtime integrity Service Worker controller is missing.');return new Promise(function(resolve,reject){var timer=setTimeout(function(){reject(new Error('integrity_status_timeout'))},7000),channel=new MessageChannel();channel.port1.onmessage=function(ev){clearTimeout(timer);var d=ev.data||{},r=d.receipt||{};if(d.type!=='PMP_RUNTIME_INTEGRITY_STATUS_RESPONSE'||r.state!=='ENFORCED'||r.version!==EXPECTED_SW||r.manifest_path!==EXPECTED_MANIFEST)return reject(new Error('integrity_controller_not_enforcing'));resolve(r)};navigator.serviceWorker.controller.postMessage({type:'PMP_RUNTIME_INTEGRITY_STATUS_REQUEST',from:'route_guardian_v22',at:new Date().toISOString()},[channel.port2])})}
function handoffError(code,message,details){var error=resolver&&resolver.RouteError?new resolver.RouteError(code,message,details):new Error(message);error.code=code;error.details=details||null;return error}
function consumeCurrentAppHandoff(loaded,handoff){var map=loaded&&loaded.map,currentFile='';try{currentFile=decodeURIComponent(String(location.pathname||'').split('/').pop())}catch(_e){}if(!map||!map.route_guardian||!map.current_app)throw handoffError('HANDOFF_MAP_CONTEXT_INVALID','Route Guardian requires one verified Current Map context.');if(currentFile!==String(map.route_guardian.path||''))throw handoffError('HANDOFF_SOURCE_ROLE_MISMATCH','The active consumer is not the Current Map route_guardian.',{current_file:currentFile,expected:map.route_guardian.path});var contract={type:handoff&&handoff.type,source_role:'route_guardian',destination_role:handoff&&handoff.role,map_path:handoff&&handoff.map_path,map_version:handoff&&handoff.map_version,route_epoch:handoff&&handoff.route_epoch,destination_path:handoff&&handoff.path};var required=['type','source_role','destination_role','map_path','map_version','route_epoch','destination_path'];if(required.some(function(field){return !contract[field]}))throw handoffError('HANDOFF_CONTRACT_INCOMPLETE','The Route Guardian handoff contract is incomplete.',{contract:contract});if(contract.type!=='PMP_ROUTE_HANDOFF_V1'||contract.type!==resolver.handoffType)throw handoffError('HANDOFF_TYPE_MISMATCH','The handoff type is not canonical.',{contract:contract});if(contract.source_role!=='route_guardian'||contract.destination_role!=='current_app')throw handoffError('HANDOFF_ROLE_MISMATCH','The handoff roles are not canonical.',{contract:contract});if(contract.map_path!=='pmp-current-map-v12.json'||contract.map_path!==resolver.mapPath)throw handoffError('HANDOFF_MAP_AUTHORITY_MISMATCH','The handoff was not issued by the canonical Current Map.',{contract:contract});if(contract.map_version!==String(map.app_version)||contract.route_epoch!==String(map.route_epoch))throw handoffError('HANDOFF_MAP_LINEAGE_MISMATCH','The handoff map lineage is stale or mismatched.',{contract:contract});if(contract.destination_path!==String(map.current_app.path)||handoff.path!==map.current_app.path)throw handoffError('HANDOFF_DESTINATION_MISMATCH','The handoff destination was not issued by Current Map current_app.',{contract:contract});return Object.freeze({loaded:loaded,handoff:handoff,contract:Object.freeze(contract)})}
async function currentAppHandoff(){if(!resolver)throw new Error('PMP Current Route Resolver did not load.');var loaded=await resolver.load(),handoff=resolver.resolve(loaded.map,'current_app'),consumed=consumeCurrentAppHandoff(loaded,handoff);return{loaded:consumed.loaded,handoff:consumed.handoff,contract:consumed.contract,hash:resolver.normalizeHash(location.hash,loaded.map)}}
async function launch(mode){btn.disabled=true;roBtn.disabled=true;try{msg.textContent='Confirming runtime source-byte enforcement...';var integrity=await integrityStatus();msg.textContent='Reading verified Current Map...';var route=await currentAppHandoff(),handoff=route.handoff,hash=mode==='diagnostics'?'#control':route.hash,params={fresh:K+'-'+handoff.cache_key+'-'+Date.now(),map_version:handoff.map_version,route_epoch:handoff.route_epoch};if(mode==='diagnostics')params.diagnostics='reload-owner';var launchUrl=resolver.buildUrl(handoff,params,hash);receipt={type:mode==='diagnostics'?'RG22_RELOAD_OWNER_DIAGNOSTICS':'RG22_RUN',version:K,at:new Date().toISOString(),target:handoff.path,map_path:handoff.map_path,map_version:handoff.map_version,route_epoch:handoff.route_epoch,route_role:handoff.role,handoff_contract:route.contract,source_sha256:handoff.source_sha256,integrity_manifest_sha256:handoff.integrity_manifest_sha256,integrity_controller:integrity,launch_url:launchUrl,implicit_fallbacks:false,rule:'Route Guardian requires an already active A-003 integrity controller and consumes exactly one verified Current Map handoff. It never replaces the integrity Service Worker.'};setLS('pmp_route_guardian_v22_receipt',receipt);out.textContent=reportText();msg.textContent='Verified handoff accepted. Launching...';setTimeout(function(){try{(window.top||window).location.href=launchUrl}catch(e){location.href=launchUrl}},mode==='diagnostics'?0:LAUNCH_PAUSE_MS)}catch(error){failClosed(error,mode==='diagnostics'?'reload_owner_diagnostics':'route_guardian_run')}}
btn.onclick=function(e){if(e)e.preventDefault();launch('run');return false};
roBtn.onclick=function(e){if(e)e.preventDefault();launch('diagnostics');return false};
copy.onclick=function(e){if(e)e.preventDefault();copyReport();return false};
show.onclick=function(){out.style.display=out.style.display==='block'?'none':'block'};
</script>
</body>
</html>

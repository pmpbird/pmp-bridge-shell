<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#f3ded4"><title>PMP Route Guardian v22</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f3ded4;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#07101c}.wrap{position:fixed;inset:0;display:grid;place-items:center;background:#f3ded4;padding:18px;text-align:center}.box{width:min(760px,100%);box-sizing:border-box;background:#fff;border:3px solid #07101c;border-radius:28px;padding:18px;display:grid;gap:14px}.badge{background:#acd1fb;border:2px solid #07101c;border-radius:16px;padding:12px;font-weight:950}.grid{display:grid;gap:10px}button{background:#acd1fb;border:2px solid #07101c;border-radius:16px;padding:12px;font:inherit;font-weight:950;color:#07101c}.dark{background:#172234;color:#eef4fb}.runFlash{font-size:1.18em;background:#fff3de!important;border:3px solid #07101c!important;animation:pmpRunFlash 1s infinite}@keyframes pmpRunFlash{0%{transform:scale(1);box-shadow:0 0 0 0 rgba(7,16,28,.55)}50%{transform:scale(1.035);box-shadow:0 0 0 10px rgba(7,16,28,.08)}100%{transform:scale(1);box-shadow:0 0 0 0 rgba(7,16,28,.55)}}pre{display:block;text-align:left;white-space:pre-wrap;background:#102033;color:#eaffef;border-radius:16px;padding:10px;height:24vh;min-height:210px;max-height:360px;overflow:auto;font:750 9px/1.2 monospace;box-sizing:border-box;user-select:text;-webkit-user-select:text}</style></head><body><div class="wrap"><div class="box"><div class="badge">ROUTE GUARDIAN v22.9 · A-002</div><h1 style="margin:4px 0">Route Guardian</h1><p id="msg" style="margin:0">Press Run App. Current Map identity will be verified before navigation.</p><div class="grid"><button id="openBtn" class="runFlash" type="button">Run App</button><button id="reloadOwnerBtn" type="button">Reload Owner Diagnostics</button><button id="copyBtn" class="dark" type="button">Copy Report</button><button id="showBtn" class="dark" type="button">Show / Hide Report</button></div><pre id="report">No report yet.</pre></div></div><script src="pmp-current-map-enforcement-v1.js?fresh=a002-current-map-sole-truth-20260711A"></script><script>
'use strict';
const K='rg22-a002-current-map-sole-truth-20260711A';
const EXPECTED_SW='1.0.1-pass75-service-worker-cache-governor-network-first-runtime-assets-20260709A';
const SW_PATH='pmp-service-worker-cache-governor-v1.js';
const LAUNCH_PAUSE_MS=1500;
const msg=document.getElementById('msg'),btn=document.getElementById('openBtn'),roBtn=document.getElementById('reloadOwnerBtn'),copy=document.getElementById('copyBtn'),show=document.getElementById('showBtn'),out=document.getElementById('report');
let receipt={type:'RG22_READY',version:K,at:new Date().toISOString(),current_map_enforcement:'armed'};
function okh(h){return /^#(world|bridge|library|workshop|control|bank)$/i.test(String(h||''))}
function getLS(k){try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}}
function setLS(k,v){try{localStorage.setItem(k,JSON.stringify(v,null,2))}catch(e){}}
function reportText(){return JSON.stringify(receipt,null,2)}
async function copyText(text){try{await navigator.clipboard.writeText(String(text||''));return true}catch(e){try{let ta=document.createElement('textarea');ta.value=String(text||'');ta.style.position='fixed';ta.style.left='-9999px';document.body.appendChild(ta);ta.select();let ok=document.execCommand('copy');ta.remove();return!!ok}catch(x){return false}}}
async function copyReport(){out.style.display='block';out.textContent=reportText();let ok=await copyText(reportText());copy.textContent=ok?'Copied':'Copy failed';setTimeout(()=>copy.textContent='Copy Report',1200)}
async function registerSW(){let x={supported:'serviceWorker'in navigator,path:SW_PATH,expected:EXPECTED_SW,registered:false,controller:false,ready:false,current_version:null,errors:[]};if(!x.supported)return x;try{navigator.serviceWorker.addEventListener('message',ev=>{let d=ev.data||{};if(d.receipt){setLS('pmp_service_worker_receipt_v1',d.receipt);x.current_version=d.receipt.version||x.current_version}});let reg=await navigator.serviceWorker.register(SW_PATH+'?fresh='+EXPECTED_SW,{scope:'./'});x.registered=!!reg;try{await reg.update()}catch(e){}try{await Promise.race([navigator.serviceWorker.ready,new Promise((_,rej)=>setTimeout(()=>rej(new Error('sw_ready_timeout')),1200))]);x.ready=true}catch(e){x.errors.push(String(e&&e.message||e))}x.controller=!!navigator.serviceWorker.controller;let r=getLS('pmp_service_worker_receipt_v1');x.current_version=r&&r.version||x.current_version;return x}catch(e){x.errors.push(String(e&&e.message||e));return x}}
async function swStatus(reg){let x={supported:'serviceWorker'in navigator,expected:EXPECTED_SW,controller:false,current_version:null,stale:false,action:'none',errors:[],registration:reg||null};if(!x.supported)return x;try{x.controller=!!navigator.serviceWorker.controller;let r=getLS('pmp_service_worker_receipt_v1');x.current_version=r&&r.version||null;x.stale=x.current_version!==EXPECTED_SW;x.action=x.stale||!x.controller?'runtime_cache_check_stale':'runtime_cache_check_current';return x}catch(e){x.errors.push(String(e&&e.message||e));return x}}
async function validatedContext(){let gate=window.PMPCurrentMapEnforcementV1;if(!gate)throw new Error('current_map_enforcement_gate_missing');let test=new URLSearchParams(location.search).get('a002_test');let ctx=await gate.load({simulate_tamper:test==='tampered_map'});if(test==='unregistered_target')gate.assertRegistered(ctx,'pmp-unregistered-target.html');return{gate,ctx}}
async function block(error,mode){let gate=window.PMPCurrentMapEnforcementV1,details={map_path:gate&&gate.map_path||'pmp-current-map-v12.json',map_sha:null,guardian_target:null,reload_target:null,fallback_target:null,actor_agreement:false,handoff_id:null,test_results:[String(error&&error.message||error)],details:{mode:mode||'run',blocked_before_navigation:true}};try{if(gate)await gate.append('route_guardian','FAIL_BLOCKED_BEFORE_NAVIGATION',details)}catch(e){}receipt={type:'RG22_BLOCKED',version:K,at:new Date().toISOString(),mode:mode||'run',error:String(error&&error.message||error),blocked_before_navigation:true,launch_url:null};setLS('pmp_route_guardian_v22_receipt',receipt);out.textContent=reportText();msg.textContent='Launch blocked: '+receipt.error;btn.disabled=false}
async function prepare(mode){let reg=await registerSW(),cache=await swStatus(reg),loaded=await validatedContext(),gate=loaded.gate,ctx=loaded.ctx,current=gate.target(ctx,'current_app'),fallback=gate.target(ctx,'fallback_app'),guardian=gate.target(ctx,'route_guardian_loader'),handoff=gate.handoffId();if(gate.selfPath()!==guardian)throw new Error('route_guardian_self_identity_mismatch');let enforcement=await gate.append('route_guardian','PASS_CURRENT_TARGET_AUTHORIZED',{map_path:ctx.map_path,map_sha:ctx.map_sha,guardian_target:current,reload_target:current,fallback_target:fallback,actor_agreement:null,handoff_id:handoff,runtime_route:current,parent_evidence_ids:[],test_results:['map_sha_match','map_type_match','map_version_match','current_target_registered','fallback_target_registered'],details:{mode,route_guardian_file:guardian,blocked_before_navigation:false}});return{reg,cache,ctx,gate,current,fallback,guardian,handoff,enforcement}}
async function run(){btn.disabled=true;msg.textContent='Validating Current Map…';try{let p=await prepare('run'),h=okh(location.hash)?location.hash:'#control',entry=p.ctx.map.current_app,u=p.current+'?pmp_map_path='+encodeURIComponent(p.ctx.map_path)+'&pmp_map_sha='+encodeURIComponent(p.ctx.map_sha)+'&pmp_handoff='+encodeURIComponent(p.handoff)+'&fresh='+encodeURIComponent(entry.cache_key)+'-'+Date.now()+h;receipt={type:'RG22_RUN',version:K,at:new Date().toISOString(),target:p.current,map_path:p.ctx.map_path,map_sha:p.ctx.map_sha,fallback_target:p.fallback,handoff_id:p.handoff,launch_url:u,service_worker_register:p.reg,runtime_cache_check:p.cache,current_map_enforcement_receipt_id:p.enforcement.receipt_id,certification_authority:false,rule:'Current Map v12 exact SHA/type/version controls the current and fallback targets. Invalid maps and unregistered targets block before navigation.'};setLS('pmp_route_guardian_v22_receipt',receipt);out.textContent=reportText();msg.textContent='Validated. Launching in '+(LAUNCH_PAUSE_MS/1000).toFixed(1)+' seconds…';await copyText(reportText());setTimeout(()=>{try{(window.top||window).location.href=u}catch(e){location.href=u}},LAUNCH_PAUSE_MS)}catch(e){await block(e,'run')}}
async function openReloadOwnerDiagnostics(){roBtn.disabled=true;msg.textContent='Validating Current Map for diagnostics…';try{let p=await prepare('reload_owner_diagnostics'),entry=p.ctx.map.current_app,u=p.current+'?diagnostics=reload-owner&pmp_map_path='+encodeURIComponent(p.ctx.map_path)+'&pmp_map_sha='+encodeURIComponent(p.ctx.map_sha)+'&pmp_handoff='+encodeURIComponent(p.handoff)+'&fresh='+encodeURIComponent(entry.cache_key)+'-'+Date.now()+'#control';receipt={type:'RG22_RELOAD_OWNER_DIAGNOSTICS',version:K,at:new Date().toISOString(),target:p.current,map_path:p.ctx.map_path,map_sha:p.ctx.map_sha,fallback_target:p.fallback,handoff_id:p.handoff,launch_url:u,current_map_enforcement_receipt_id:p.enforcement.receipt_id,certification_authority:false};setLS('pmp_route_guardian_v22_receipt',receipt);out.textContent=reportText();await copyText(reportText());try{(window.top||window).location.href=u}catch(e){location.href=u}}catch(e){await block(e,'reload_owner_diagnostics')}finally{roBtn.disabled=false}}
btn.onclick=e=>{if(e)e.preventDefault();run();return false};roBtn.onclick=e=>{if(e)e.preventDefault();openReloadOwnerDiagnostics();return false};copy.onclick=e=>{if(e)e.preventDefault();copyReport();return false};show.onclick=()=>out.style.display=out.style.display==='block'?'none':'block';
</script></body></html>

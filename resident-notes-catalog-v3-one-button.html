<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#55b6d8">
<title>Save Bug Memory</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:#55b6d8;color:#081827;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif}
body{padding:calc(env(safe-area-inset-top) + 18px) 16px calc(env(safe-area-inset-bottom) + 34px)}
.wrap{max-width:900px;margin:auto}.pill{display:inline-block;background:#9cf6f2;color:#071523;border:3px solid #fff;border-radius:999px;padding:9px 14px;font-weight:950}.card{background:#122033;color:#f5fbff;border:4px solid #fff;border-radius:28px;padding:22px;margin:18px 0;box-shadow:0 16px 40px #0004}h1{font-size:40px;margin:12px 0}.sub{font-size:20px;font-weight:850;opacity:.84;line-height:1.3}textarea{width:100%;background:#0b1522;color:#f5fbff;border:2px solid #ffffff40;border-radius:18px;padding:14px;font-size:15px;min-height:260px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}button{width:100%;border:0;border-radius:22px;background:#9cf6f2;color:#071523;font-weight:950;font-size:24px;padding:18px;min-height:78px;margin-top:14px}.status{white-space:pre-wrap;background:#0f3f2c;border:3px solid #fff;border-radius:20px;padding:16px;color:#d7ffe8;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;overflow:auto;max-height:360px;margin-top:14px}.warn{background:#3b2a0c;color:#ffe8b3}.bad{background:#4a1212;color:#ffd3d3}.small{font-size:14px;color:#c9e7ee}.ghost{position:absolute;width:1px;height:1px;opacity:.01;pointer-events:none;left:-10px;top:-10px;border:0}
</style>
</head>
<body>
<div class="wrap">
  <span class="pill">Save Bug Memory</span>
  <h1>Save Bug Memory</h1>
  <div class="sub">One clean path: paste the bug, prepare the memory pack, then save it to Notes with your Shortcut.</div>
  <section class="card">
    <h2>Paste bug JSON</h2>
    <textarea id="bugJson" placeholder="Paste one bug JSON here."></textarea>
    <button id="mainButton" onclick="mainTap()">Prepare Bug Memory</button>
    <div id="status" class="status warn">Paste the bug JSON, then tap Prepare Bug Memory.</div>
  </section>
</div>
<iframe id="worker" class="ghost" src="resident-notes-catalog-v3.html?fresh=one-button-worker-v1"></iframe>
<script>
const SHORTCUT_URL='shortcuts://run-shortcut?name='+encodeURIComponent('PMP Save Private Memory')+'&input=clipboard';
let prepared=false;
function setStatus(x,kind){const s=document.getElementById('status');s.className='status '+(kind||'');s.textContent=typeof x==='string'?x:JSON.stringify(x,null,2)}
function worker(){const f=document.getElementById('worker');try{return{w:f.contentWindow,d:f.contentDocument||f.contentWindow.document}}catch(e){return{}}}
function copyFallback(text){try{const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.focus();ta.select();document.execCommand('copy');ta.remove();return true}catch(e){return false}}
function builtText(){const o=worker(),d=o.d;if(!d)return'';const p=d.getElementById('prompt');const c=d.getElementById('chunk');return ((p&&p.value)||'').trim()||((c&&c.value)||'').trim()}
function openShortcut(){try{window.top.location.href=SHORTCUT_URL;return true}catch(e){}try{parent.location.href=SHORTCUT_URL;return true}catch(e){}try{window.location.href=SHORTCUT_URL;return true}catch(e){}return false}
async function prepare(){
  const raw=document.getElementById('bugJson').value.trim();
  if(!raw){setStatus('Paste the bug JSON first.','bad');return}
  try{JSON.parse(raw)}catch(e){setStatus('The pasted text is not valid JSON yet.','bad');return}
  const o=worker(),w=o.w,d=o.d;
  if(!w||!d||typeof w.buildFullPackAndScan!=='function'){setStatus('Save Bug Memory engine is still loading. Wait one second and tap again.','warn');return}
  setStatus('Preparing Bug Memory pack...','warn');
  try{
    if(typeof w.clearAll==='function')w.clearAll();
    const box=d.getElementById('pasteBug');
    if(box)box.value=raw;
    if(typeof w.addPastedBug==='function')w.addPastedBug();
    await w.buildFullPackAndScan();
    const built=builtText();
    if(!built){setStatus('The pack built, but no catalog text was found yet. Tap Prepare Bug Memory again.','bad');return}
    prepared=true;
    document.getElementById('mainButton').textContent='Save Bug Memory to Notes';
    setStatus({type:'PMP_SAVE_BUG_MEMORY_READY',message:'Bug Memory is prepared. Tap Save Bug Memory to Notes.',catalog_preview:built.slice(0,900)},'');
  }catch(e){setStatus('Prepare failed: '+String(e&&e.message||e),'bad')}
}
function save(){
  const built=builtText();
  if(!built){prepared=false;document.getElementById('mainButton').textContent='Prepare Bug Memory';setStatus('No prepared catalog found. Tap Prepare Bug Memory first.','bad');return}
  copyFallback(built);
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(built).catch(()=>{});
  setStatus('Copied Bug Memory catalog to clipboard. Opening PMP Save Private Memory Shortcut.','warn');
  openShortcut();
}
function mainTap(){prepared?save():prepare()}
</script>
</body>
</html>

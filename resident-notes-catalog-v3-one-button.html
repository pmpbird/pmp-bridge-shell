<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#55b6d8">
<title>Save Bug Memory</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:#55b6d8;color:#081827;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif}
body{padding:calc(env(safe-area-inset-top) + 70px) 16px calc(env(safe-area-inset-bottom) + 34px)}
.wrap{max-width:900px;margin:auto}.pill{display:inline-block;background:#9cf6f2;color:#071523;border:3px solid #fff;border-radius:999px;padding:9px 14px;font-weight:950}.card{background:#122033;color:#f5fbff;border:4px solid #fff;border-radius:28px;padding:22px;margin:18px 0;box-shadow:0 16px 40px #0004}h1{font-size:40px;margin:12px 0}.sub{font-size:20px;font-weight:850;opacity:.84;line-height:1.3;color:#f8fbff}textarea{width:100%;background:#0b1522;color:#f5fbff;border:2px solid #ffffff40;border-radius:18px;padding:14px;font-size:15px;min-height:260px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}button,.back{width:100%;border:0;border-radius:22px;background:#9cf6f2;color:#071523;font-weight:950;font-size:24px;padding:18px;min-height:78px;margin-top:14px;text-decoration:none;text-align:center;display:block}.status{white-space:pre-wrap;background:#0f3f2c;border:3px solid #fff;border-radius:20px;padding:16px;color:#d7ffe8;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;overflow:auto;max-height:360px;margin-top:14px}.warn{background:#3b2a0c;color:#ffe8b3}.bad{background:#4a1212;color:#ffd3d3}.small{font-size:14px;color:#c9e7ee}.ghost{position:absolute;width:1px;height:1px;opacity:.01;pointer-events:none;left:-10px;top:-10px;border:0}.float{position:fixed;top:calc(10px + env(safe-area-inset-top));z-index:30;border:3px solid #07101c;background:#9cf6f2;color:#071523;border-radius:999px;padding:8px 12px;font-weight:950;font-size:12px;box-shadow:0 6px 0 rgba(0,0,0,.12),0 8px 16px rgba(0,0,0,.16);width:auto;min-height:auto;margin:0}.left{left:10px}.right{right:10px}.drawer{position:fixed;right:10px;left:10px;top:calc(54px + env(safe-area-inset-top));z-index:40;display:none;background:#122033;color:#eef4fb;border:3px solid #9cf6f2;border-radius:20px;padding:12px;box-shadow:0 8px 28px #0007;max-height:78vh;overflow:auto}.mini{border:2px solid #07101c;background:#17283c;color:#eef4fb;border-radius:14px;padding:11px;font:inherit;font-weight:950;width:100%;margin-top:7px;min-height:44px;font-size:16px}.reply{background:#123024;border:2px solid #fff;color:#d8ffe2;border-radius:18px;padding:12px;margin-top:8px;white-space:pre-wrap;font-size:15px;line-height:1.35}
</style>
</head>
<body>
<button class="float left" onclick="toggleDrawer('launcher')">Launcher</button>
<button class="float right" onclick="toggleDrawer('resident')">Resident</button>
<div id="launcher" class="drawer"><h2>Launcher</h2><button class="mini" onclick="location.href='private-bug-memory-hub-v9.html?fresh=back-from-save-bug-memory'">Back to Bug Memory</button><button class="mini" onclick="toggleDrawer('launcher')">Close</button></div>
<div id="resident" class="drawer"><h2>Resident</h2><p>Save Bug Memory tool ready.</p><textarea id="ask" placeholder="Tell Resident what to do next."></textarea><button class="mini" onclick="toggleDrawer('resident')">Close</button><div id="residentReply" class="reply">Ready inside Save Bug Memory.</div></div>
<div class="wrap">
  <a class="back" href="private-bug-memory-hub-v9.html?fresh=back-from-save-bug-memory">← Back to Bug Memory</a>
  <span class="pill">Save Bug Memory</span>
  <h1>Save Bug Memory</h1>
  <div class="sub">One clean path: paste the bug, prepare the memory pack, then save it to Notes with your Shortcut.</div>
  <section class="card">
    <h2>Paste bug JSON</h2>
    <textarea id="bugJson" placeholder="Paste one bug JSON here."></textarea>
    <button id="mainButton" onclick="mainTap()">Prepare Bug Memory</button>
    <div id="status" class="status warn">Paste the bug JSON, then tap Prepare Bug Memory.</div>
  </section>
</div>
<iframe id="worker" class="ghost" src="resident-notes-catalog-v3.html?fresh=one-button-worker-v2-tabs"></iframe>
<script>
const SHORTCUT_URL='shortcuts://run-shortcut?name='+encodeURIComponent('PMP Save Private Memory')+'&input=clipboard';
let prepared=false;
function toggleDrawer(id){let el=document.getElementById(id);el.style.display=el.style.display==='block'?'none':'block'}
function setStatus(x,kind){const s=document.getElementById('status');s.className='status '+(kind||'');s.textContent=typeof x==='string'?x:JSON.stringify(x,null,2)}
function worker(){const f=document.getElementById('worker');try{return{w:f.contentWindow,d:f.contentDocument||f.contentWindow.document}}catch(e){return{}}}
function copyFallback(text){try{const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.focus();ta.select();document.execCommand('copy');ta.remove();return true}catch(e){return false}}
function builtText(){const o=worker(),d=o.d;if(!d)return'';const p=d.getElementById('prompt');const c=d.getElementById('chunk');return ((p&&p.value)||'').trim()||((c&&c.value)||'').trim()}
function openShortcut(){try{window.top.location.href=SHORTCUT_URL;return true}catch(e){}try{parent.location.href=SHORTCUT_URL;return true}catch(e){}try{window.location.href=SHORTCUT_URL;return true}catch(e){}return false}
async function prepare(){
  const raw=document.getElementById('bugJson').value.trim();
  if(!raw){setStatus('Paste the bug JSON first.','bad');return}
  try{JSON.parse(raw)}catch(e){setStatus('The pasted text is not valid JSON yet.','bad');return}
  const o=worker(),w=o.w,d=o.d;
  if(!w||!d||typeof w.buildFullPackAndScan!=='function'){setStatus('Save Bug Memory engine is still loading. Wait one second and tap again.','warn');return}
  setStatus('Preparing Bug Memory pack...','warn');
  try{
    if(typeof w.clearAll==='function')w.clearAll();
    const box=d.getElementById('pasteBug');
    if(box)box.value=raw;
    if(typeof w.addPastedBug==='function')w.addPastedBug();
    await w.buildFullPackAndScan();
    const built=builtText();
    if(!built){setStatus('The pack built, but no catalog text was found yet. Tap Prepare Bug Memory again.','bad');return}
    prepared=true;
    document.getElementById('mainButton').textContent='Save Bug Memory to Notes';
    setStatus({type:'PMP_SAVE_BUG_MEMORY_READY',message:'Bug Memory is prepared. Tap Save Bug Memory to Notes.',catalog_preview:built.slice(0,900)},'');
  }catch(e){setStatus('Prepare failed: '+String(e&&e.message||e),'bad')}
}
function save(){
  const built=builtText();
  if(!built){prepared=false;document.getElementById('mainButton').textContent='Prepare Bug Memory';setStatus('No prepared catalog found. Tap Prepare Bug Memory first.','bad');return}
  copyFallback(built);
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(built).catch(()=>{});
  setStatus('Copied Bug Memory catalog to clipboard. Opening PMP Save Private Memory Shortcut.','warn');
  openShortcut();
}
function mainTap(){prepared?save():prepare()}
</script>
</body>
</html>

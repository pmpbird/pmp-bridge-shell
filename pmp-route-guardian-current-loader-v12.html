<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#f3ded4"><title>PMP Route Guardian v12</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f3ded4;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#07101c}#app{position:fixed;inset:0;width:100%;height:100%;border:0;background:#f3ded4}#gate{position:fixed;inset:0;display:grid;place-items:center;background:#f3ded4;padding:18px;z-index:9;text-align:center}.card{width:min(760px,100%);background:#fff;border:3px solid #07101c;border-radius:28px;padding:18px}.badge,button{background:#acd1fb;border:2px solid #07101c;border-radius:16px;padding:12px;font:inherit;font-weight:950;color:#07101c}.badge{border-radius:999px;font-size:12px;padding:6px 10px;display:inline-block}.dark{background:#172234;color:#eef4fb}.grid{display:grid;gap:8px}.loaded #gate{display:none!important}pre{display:none;white-space:pre-wrap;text-align:left;background:#102033;color:#eaffef;border-radius:16px;padding:10px;max-height:42vh;overflow:auto}.open{display:block}</style></head><body><iframe id="app"></iframe><div id="gate"><div class="card"><div class="badge">ROUTE GUARDIAN v12</div><h1>Route Guardian</h1><p id="msg">Press Open Latest App.</p><div class="grid"><button id="openBtn">Open Latest App</button><button id="copyBtn" class="dark">Copy Report</button><button id="showBtn" class="dark">Show / Hide Report</button></div><pre id="report">No report yet.</pre></div></div><script>const app=document.getElementById('app'),msg=document.getElementById('msg'),report=document.getElementById('report');let receipt={type:'RG12_READY',at:new Date().toISOString()};function clean(p,f){p=String(p||f||'').trim();return /^[a-zA-Z0-9._\/-]+\.html$/.test(p)?p:f}async function map(){for(const m of ['pmp-current-map-v9.json','pmp-current-map.json']){try{let r=await fetch(m+'?rg12='+Date.now(),{cache:'no-store'});if(!r.ok)continue;let j=await r.json();return{path:clean(j.current_app&&j.current_app.path,'pmp-current-inner-cleanbug-rgcontrols-v3.html'),key:(j.current_app&&j.current_app.cache_key)||Date.now(),map:m}}catch(e){}}return{path:'pmp-current-inner-cleanbug-rgcontrols-v3.html',key:'fallback',map:'fallback'}}function deepDoc(){try{let d=app.contentDocument,w=app.contentWindow;if(!d)return null;for(let i=0;i<4;i++){let f=(d.getElementById&&d.getElementById('app'))||(d.querySelector&&d.querySelector('iframe'))||(w&&w.F);if(!f||!f.contentDocument)break;w=f.contentWindow;d=f.contentDocument}return d}catch(e){return null}}function add(d,id,src){if(!d||!d.head||d.getElementById(id))return;let s=d.createElement('script');s.id=id;s.src=src;d.head.appendChild(s)}function support(){let d=deepDoc();if(!d)return;['pmpPhase1PrivateCard','pmpPhase1InlineCard','pmpPhase1CurrentPanel','pmpPhase1FeedbackBanner','pmpFloatP1Btn','pmpFloatP1Panel'].forEach(id=>{try{let x=d.getElementById(id);if(x)x.remove()}catch(e){}});let t=Date.now();add(d,'pmpPhase1MigrateScript','pmp-phase1-migrate-v1.js?rg12='+t);add(d,'pmpPrivateBackupLiteScript','pmp-private-backup-lite-v1.js?rg12='+t);add(d,'pmpPhase1OldPanelSuppressScript','pmp-phase1-old-panel-suppress-v1.js?rg12='+t);add(d,'pmpPhase1PrivateWindowSingleScript','pmp-phase1-private-window-single-v1.js?rg12='+t);add(d,'pmpPhase1SourceRouterScript','pmp-phase1-source-router-v1.js?rg12='+t);add(d,'pmpSourceRecordCleanupScript','pmp-source-record-cleanup-v1.js?rg12='+t);add(d,'pmpManifestAlignmentSaveScript','pmp-manifest-alignment-save-v1.js?rg12='+t);try{localStorage.setItem('pmp_route_guardian_v12_support',JSON.stringify({type:'RG12_SUPPORT_INJECTED_WITH_SOURCE_ROUTER_CLEANUP_MANIFEST_SAVE',at:new Date().toISOString(),safe_claim:'Route Guardian prepared Private Window support, Source Router, archive-first cleanup, and manifest-alignment saving after manual Open Latest App. It did not open Private Window itself.'}))}catch(e){}}async function openLatest(){msg.textContent='Opening current app...';let t=await map();receipt={type:'RG12_OPEN',at:new Date().toISOString(),target:t.path,map:t.map,cache_key:t.key,safe_claim:'Route Guardian opened current app after button press and prepared Private Window source routing, cleanup, and manifest-alignment saving controls only.',do_not_claim:'Not source acceptance, hook validation, app proof, current-clean, frozen, or best-in-world.'};report.textContent=JSON.stringify(receipt,null,2);try{localStorage.setItem('pmp_route_guardian_v12_receipt',report.textContent)}catch(e){}app.src=t.path+'?fresh=rg12-'+encodeURIComponent(String(t.key))+'-'+Date.now()+'#control';app.onload=()=>{[150,350,700,1200,2200,4200].forEach(x=>setTimeout(support,x));setTimeout(()=>document.body.classList.add('loaded'),800)}}openBtn.onclick=openLatest;showBtn.onclick=()=>report.classList.toggle('open');copyBtn.onclick=async()=>{try{await navigator.clipboard.writeText(JSON.stringify(receipt,null,2));msg.textContent='Report copied.'}catch(e){report.classList.add('open')}};setInterval(support,700);</script></body></html>

rop{display:none;margin-top:10px;background:#0c141e;color:#eef4fb;border:2px solid #a1fcfd;border-radius:18px;padding:10px;text-align:left}.drop.open{display:block}.pre{max-height:42vh;overflow:auto;white-space:pre-wrap;font:12px/1.35 ui-monospace,Menlo,monospace}.diagnostic{display:none;margin-top:10px;background:#351414;color:#ffd1d1;border:2px solid #ff9a9a;border-radius:18px;padding:10px;text-align:left;white-space:pre-wrap;font:13px/1.35 ui-monospace,Menlo,monospace;max-height:46vh;overflow:auto}.diagnostic.open{display:block}#repoPanel{max-height:58vh;overflow:hidden;padding:0;background:#52b5df;color:#101827;border-color:#07101c}#repoBar{height:50px;display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;background:#46a9d3;border-bottom:2px solid #07101c;padding:8px 10px;font-weight:950}#repoClose{width:auto;min-width:88px;padding:9px 12px;background:#172234;color:#eef4fb;border:1px solid #25354a}#repoFrame{position:relative!important;inset:auto!important;display:block;width:100%;height:min(52vh,560px);border:0;background:#52b5df}.residentNative{display:none;position:fixed;left:10px;right:10px;top:calc(54px + env(safe-area-inset-top));z-index:45;height:min(78vh,560px)}.residentNative.open{display:block}.residentFrame{width:100%;height:100%;border:0;border-radius:20px;background:transparent;box-shadow:0 8px 28px #0007}.loaded #gate,.loaded .drop,.loaded .diagnostic,.loaded #residentBox{display:none!important}</style></head><body><iframe id="app" title="PMP Current App"></iframe><div id="gate"><div id="card"><div class="top"><button id="residentBtn" class="tiny">Resident</button></div><div class="badge">ROUTE GUARDIAN</div><h1 id="title">Route Guardian</h1><p id="text" class="txt">Path Certifier is internal. Pass stays quiet. Block gives full copyable detail.</p><div id="chips"></div><div class="grid"><button id="primary">Check Route</button><button id="copy" class="dark">Copy Report</button><button id="show" class="dark">Show / Hide Report</button><button id="repo" class="dark">Repo Index</button></div><div id="blockDetail" class="diagnostic">No block detail yet.</div><pre id="report" class="drop pre">No report yet.</pre><div id="repoPanel" class="drop"><div id="repoBar"><span>Route Guardian Repo Index</span><button id="repoClose">Close</button></div><iframe id="repoFrame" title="Route Guardian Repo Index"></iframe></div></div></div><div id="residentBox" class="residentNative"><iframe id="residentFrame" class="residentFrame" title="Resident"></iframe></div><script src="pmp-route-guardian-v1.js?fresh=current-loader-v2"></script><script>const MAP='pmp-current-map.json',DEFAULT='pmp-current-inner-cleanbug-rgcontrols-v3.html';let latest=null,cert=null,passed=false,loaded=false,map=null,copyBundle='';const F=app,G=gate,C=chips,T=title,TXT=text,P=primary,REP=report,BLOCK=blockDetail,RBOX=residentBox,RFRAME=residentFrame,RP=repoPanel,RF=repoFrame,RC=repoClose;function esc(s){return String(s??'').replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]))}function pill(s,ok){return'<span class="pill '+(ok?'ok':'bad')+'">'+esc(s)+'</span>'}function setGate(a,b,k){document.body.classList.remove('pass','fail','loaded');if(k)document.body.classList.add(k);G.style.display='grid';T.textContent=a;TXT.textContent=b}function closeDrops(ex){if(ex!=='resident')RBOX.classList.remove('open');if(ex!=='report')REP.classList.remove('open');if(ex!=='repo')RP.classList.remove('open')}async function getMap(){if(map)return map;let r=await fetch(MAP+'?fresh='+Date.now(),{cache:'no-store'});map=await r.json();return map}function safe(p,f){p=String(p||f||'').trim();return/^[a-zA-Z0-9._\/-]+\.html$/.test(p)?p:f}function norm(r){try{if(r.current_surface&&r.current_surface.file==='pmp-route-guardian-current-loader-v2.html'){let risks=(r.stale_shell_risk&&r.stale_shell_risk.risks)||[];r.current_surface.current_loader_surface=true;if(risks.length===1&&/not the expected entry/.test(risks[0]))r.stale_shell_risk={risk_count:0,risks:[],likely_stale_shell:false,support_test_surface_note:'Current loader v2 is the versioned Route Guardian loader behind the stable Home Screen door.'}}}catch(e){}return r}async function buildCertifier(report){let m=await getMap().catch(()=>null),rg=window.PMPRouteGuardianV1||{},exp=rg.expected||{};let loader=(m&&m.route_guardian_loader)||{};let cur=(m&&m.current_app)||{};let fallback=(m&&m.fallback_app)||{};let risk=(report&&report.stale_shell_risk&&report.stale_shell_risk.risk_count)||0;let stale=!!(report&&report.stale_shell_risk&&report.stale_shell_risk.likely_stale_shell);let agreement=!!(cur.path&&exp.currentInner&&cur.path===exp.currentInner&&fallback.path===exp.currentInner);let routePass=String(report.verdict||'').startsWith('PASS')&&risk===0;let loaderOk=!!loader.path;let reasons=[];if(stale)reasons.push('Current surface looks stale or wrong.');if(!agreement)reasons.push('Map current path and Route Guardian expected currentInner disagree.');if(!routePass)reasons.push('Route Guardian verdict is not clean PASS or stale risk is nonzero.');if(!loaderOk)reasons.push('Map has no route_guardian_loader pointer.');let allowed=routePass&&agreement&&!stale&&loaderOk;return{type:'PMP_ROUTE_GUARDIAN_PATH_CERTIFIER',version:'2.0.0-current-loader',built_at:new Date().toISOString(),next_allowed_action:allowed?'OPEN_WORLD':'BLOCK_OPEN_WORLD',open_world_allowed:allowed,current_entry_ok:(exp.entry||'pmp-app-current.html')==='pmp-app-current.html',loader_ok:loaderOk,map_guardian_agreement:agreement,stale_shell_risk:stale,route_guardian_pass:routePass,avoid_paths_active:reasons.length>0,route_confidence:allowed?'HIGH':(stale||!agreement?'LOW':'MEDIUM'),resident_explainable:true,paths:{entry:exp.entry||'pmp-app-current.html',loader:loader.path||'missing',current_inner:cur.path||'missing',fallback_inner:fallback.path||'missing',expected_currentInner:exp.currentInner||'missing',world_app:exp.baseApp||'pmp-home-single-v6.html',bug_memory:exp.bugMemory||'bug-memory-current-clean-v1.html',resident:'pmp-resident-route-guardian-surface-v2.html'},blocked_reasons:reasons,rule:'Open World is allowed only when Route Guardian pass, no stale-shell risk, loader exists, and map + Route Guardian agree.'}}function blockText(report,cert){let out=['ROUTE GUARDIAN BLOCK DETAIL','','Plain result: Open World is BLOCKED.','','Why blocked:'];(cert.blocked_reasons.length?cert.blocked_reasons:['Unknown route risk. Review report.']).forEach((x,i)=>out.push((i+1)+'. '+x));out.push('','Certifier state:','- open_world_allowed: '+cert.open_world_allowed,'- route_confidence: '+cert.route_confidence,'- route_guardian_pass: '+cert.route_guardian_pass,'- map_guardian_agreement: '+cert.map_guardian_agreement,'- stale_shell_risk: '+cert.stale_shell_risk,'- loader_ok: '+cert.loader_ok,'- avoid_paths_active: '+cert.avoid_paths_active,'','Expected current paths:');Object.keys(cert.paths).forEach(k=>out.push('- '+k+': '+cert.paths[k]));out.push('','Safe action: Copy this into Resident and ask for a simple explanation. Do not patch random files. Do not use newest file as truth.','Raw verdict: '+(report.verdict||'missing'));return out.join('\n')}function render(r){let m=r.current_map_assessment||{},i=r.current_inner_assessment||{},risk=(r.stale_shell_risk||{}).risk_count||0;C.innerHTML=pill('map '+(m.current_path_matches_expected?'ok':'check'),!!m.current_path_matches_expected)+pill('base '+(i.loads_base_app?'ok':'check'),!!i.loads_base_app)+pill('bug '+(i.routes_bug_memory_clean?'ok':'check'),!!i.routes_bug_memory_clean)+pill('risk '+risk,risk===0)}async function checkRoute(){setGate('Route Guardian','Checking route through Path Certifier...',null);P.textContent='Checking...';try{let r=norm(await PMPRouteGuardianV1.buildReport({store:false}));latest=r;cert=await buildCertifier(r);REP.textContent=JSON.stringify({...r,path_certifier:cert},null,2);render(r);passed=cert.open_world_allowed===true;copyBundle=JSON.stringify({...r,path_certifier:cert},null,2);if(passed){BLOCK.classList.remove('open');setGate('Route Guardian Passed','Route clear. Current path certified.','pass');P.textContent='Open World'}else{let detail=blockText(r,cert);BLOCK.textContent=detail;BLOCK.classList.add('open');copyBundle=detail+'\n\nFULL REPORT + CERTIFIER\n'+JSON.stringify({...r,path_certifier:cert},null,2);setGate('Route Guardian Blocked','Open World is blocked. Full detail is shown below for Resident.','fail');P.textContent='Check Route'}}catch(e){passed=false;latest={type:'CURRENT_LOADER_V2_ERROR',built_at:new Date().toISOString(),error:String(e.message||e)};cert={open_world_allowed:false,route_confidence:'LOW',blocked_reasons:[String(e.message||e)]};let detail='ROUTE GUARDIAN BLOCK DETAIL\n\nOpen World is BLOCKED.\n\nReason: '+String(e.message||e)+'\n\nCopy this into Resident for a simpler explanation.';BLOCK.textContent=detail;BLOCK.classList.add('open');REP.textContent=JSON.stringify({latest,path_certifier:cert},null,2);copyBundle=detail;setGate('Route Guardian Error','Open World is blocked. Full detail is shown below for Resident.','fail');P.textContent='Check Route'}}async function openWorld(){if(!passed||!cert||!cert.open_world_allowed){setGate('Route Not Certified','Run Check Route first. Open World only unlocks after Path Certifier allows it.','fail');P.textContent='Check Route';return}let m=await getMap().catch(()=>({current_app:{path:DEFAULT,cache_key:'fallback'}}));let cur=m.current_app||{};F.src=safe(cur.path,DEFAULT)+'?fresh=current-loader-v2-'+encodeURIComponent(cur.cache_key||Date.now())+'-'+Date.now()+'#world';loaded=true;setGate('Opening World','Opening certified current app from map.','pass');F.onload=()=>setTimeout(()=>document.body.classList.add('loaded'),550)}function openResident(){closeDrops('resident');RBOX.classList.toggle('open');if(RBOX.classList.contains('open'))RFRAME.src='pmp-resident-route-guardian-surface-v2.html?fresh='+Date.now()}window.addEventListener('message',e=>{if(e.data&&e.data.type==='PMP_RESIDENT_SURFACE_CLOSE')RBOX.classList.remove('open')});primary.onclick=()=>passed&&!loaded?openWorld():checkRoute();residentBtn.onclick=openResident;copy.onclick=async()=>{if(!copyBundle)await checkRoute();try{await navigator.clipboard.writeText(copyBundle);setGate('Copied',passed?'Report + certifier copied. Open World is available.':'Block detail + report copied for Resident.',passed?'pass':'fail')}catch(e){REP.classList.add('open')}};show.onclick=()=>{closeDrops('report');if(!latest&&REP.textContent.trim()==='No report yet.')REP.textContent='No report yet — run Check Route first.';REP.classList.toggle('open')};repo.onclick=()=>{closeDrops('repo');RP.classList.toggle('open');if(RP.classList.contains('open'))RF.src='pmp-route-guardian-repo-index-v1.html?inside=current-loader-v2&fresh='+Date.now()};repoClose.onclick=()=>RP.classList.remove('open');</script></body></html>

<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#52b5df"><title>Resident Route Guardian Surface v1</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;color:#101827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}#frame{position:fixed;inset:0;width:100%;height:100%;border:0;background:transparent}#loading{position:fixed;inset:0;display:grid;place-items:start center;background:transparent;z-index:5;font-weight:950;text-align:center;padding:0}.card{margin:0 10px;width:calc(100% - 20px);background:#172234;color:#eef4fb;border:2px solid #a1fcfd;border-radius:20px;padding:12px;box-shadow:0 8px 28px #0007}.badge{display:inline-block;background:#a1fcfd;color:#101827;border:2px solid #07101c;border-radius:999px;padding:6px 10px;font-size:12px}h1{font-size:22px;margin:8px 0}.sub{font-size:14px;font-weight:850}</style></head><body><iframe id="frame" title="Resident Surface"></iframe><div id="loading"><div class="card"><div class="badge">RESIDENT</div><h1>Opening Resident</h1><p class="sub">Loading normal Resident options.</p></div></div><script>const frame=document.getElementById('frame'),loading=document.getElementById('loading');const params=new URLSearchParams(location.search);const back=params.get('back')||'';const base=params.get('base')||'pmp-home-single-v6.html';function goBack(){if(parent&&parent!==window){try{parent.postMessage({type:'PMP_RESIDENT_SURFACE_CLOSE'},'*');return}catch(e){}}if(back)location.href=back+(back.includes('?')?'&':'?')+'fromResidentSurface='+Date.now()}function inject(){let d,w;try{w=frame.contentWindow;d=frame.contentDocument||w.document}catch(e){return false}if(!d||!w)return false;try{let style=d.getElementById('rgResidentSurfaceStyle');if(!style){style=d.createElement('style');style.id='rgResidentSurfaceStyle';style.textContent='.wrap,.tabs,.float.left,.float.right{display:none!important}#launcher{display:none!important}#resident.drawer{display:block!important;position:fixed!important;left:10px!important;right:10px!important;top:0!important;bottom:auto!important;background:var(--panel)!important;color:#eef4fb!important;border:2px solid var(--a)!important;border-radius:20px!important;padding:12px!important;box-shadow:0 8px 28px #0007!important;max-height:78vh!important;overflow:auto!important;z-index:999!important}body,html{background:transparent!important;overflow:hidden!important}#resident h2{margin-top:0!important}';d.head.appendChild(style)}}catch(e){}try{let resident=d.getElementById('resident');if(resident)resident.style.display='block'}catch(e){}try{if(typeof w.toggleDrawer==='function'){let resident=d.getElementById('resident');if(resident&&resident.style.display!=='block')w.toggleDrawer('resident')}}catch(e){}try{[...d.querySelectorAll('#resident button')].filter(b=>(b.textContent||'').trim()==='Close').forEach(b=>{if(b.dataset.rgSurfaceClose)return;b.dataset.rgSurfaceClose='1';b.addEventListener('click',ev=>{ev.preventDefault();ev.stopPropagation();if(ev.stopImmediatePropagation)ev.stopImmediatePropagation();goBack()},true)})}catch(e){}loading.style.display='none';return true}frame.onload=function(){let tries=0;let t=setInterval(()=>{tries++;if(inject()||tries>14)clearInterval(t)},200)};frame.src=base+'?residentSurface=1&fresh='+Date.now()+'#resident';</script></body></html>

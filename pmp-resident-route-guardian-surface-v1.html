<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#52b5df"><title>Resident Route Guardian Surface v1</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#52b5df;color:#101827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}#frame{position:fixed;inset:0;width:100%;height:100%;border:0;background:#52b5df}#loading{position:fixed;inset:0;display:grid;place-items:center;background:#52b5df;z-index:5;font-weight:950;text-align:center;padding:18px}.card{width:min(760px,100%);background:#46a9d3;border:3px solid #07101c;border-radius:28px;padding:18px;box-shadow:0 10px 24px #0003}.badge{display:inline-block;background:#a1fcfd;border:2px solid #07101c;border-radius:999px;padding:6px 10px;font-size:12px}h1{font-size:31px;margin:10px 0}.sub{font-size:16px;font-weight:850}</style></head><body><iframe id="frame" title="Resident Surface"></iframe><div id="loading"><div class="card"><div class="badge">RESIDENT SURFACE</div><h1>Opening Resident</h1><p class="sub">Loading the normal Resident system with all normal options.</p></div></div><script>const frame=document.getElementById('frame'),loading=document.getElementById('loading');const params=new URLSearchParams(location.search);const back=params.get('back')||'pmp-app-current-repodrop-test-v5.html?resident-return=1';const base=params.get('base')||'pmp-home-single-v6.html';function goBack(){location.href=back+(back.includes('?')?'&':'?')+'fromResidentSurface='+Date.now()}function inject(){let d,w;try{w=frame.contentWindow;d=frame.contentDocument||w.document}catch(e){return false}if(!d||!w)return false;try{let style=d.getElementById('rgResidentSurfaceStyle');if(!style){style=d.createElement('style');style.id='rgResidentSurfaceStyle';style.textContent='.wrap,.tabs,.float.left,.float.right{display:none!important}#launcher{display:none!important}#resident.drawer{display:block!important;position:fixed!important;left:10px!important;right:10px!important;top:calc(10px + env(safe-area-inset-top))!important;bottom:calc(10px + env(safe-area-inset-bottom))!important;max-height:none!important;overflow:auto!important;z-index:999!important;border-radius:22px!important;box-shadow:0 10px 30px rgba(0,0,0,.28)!important}body,html{background:#52b5df!important;overflow:hidden!important}';d.head.appendChild(style)}}catch(e){}try{let resident=d.getElementById('resident');if(resident)resident.style.display='block'}catch(e){}try{if(typeof w.toggleDrawer==='function'){let resident=d.getElementById('resident');if(resident&&resident.style.display!=='block')w.toggleDrawer('resident')}}catch(e){}try{[...d.querySelectorAll('#resident button')].filter(b=>(b.textContent||'').trim()==='Close').forEach(b=>{if(b.dataset.rgSurfaceClose)return;b.dataset.rgSurfaceClose='1';b.addEventListener('click',ev=>{ev.preventDefault();ev.stopPropagation();if(ev.stopImmediatePropagation)ev.stopImmediatePropagation();goBack()},true)})}catch(e){}loading.style.display='none';return true}frame.onload=function(){let tries=0;let t=setInterval(()=>{tries++;if(inject()||tries>12)clearInterval(t)},250)};frame.src=base+'?residentSurface=1&fresh='+Date.now()+'#resident';</script></body></html>

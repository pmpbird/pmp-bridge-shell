strong><span>Show hidden bank of the last 100 total moves.</span></button><pre id="moveOut"></pre><div id="status" class="status">Loading…</div></div><script>(()=>{const F='pmp-current-inner-cleanbug-rgcontrols-v6.html#control',SNAP='pmp-route-guardian-last-good-snapshot-before-saved-spot-delete-v1.html',MOVE='pmp_route_guardian_move_ledger_bank_v1',SPOTS='pmp_route_guardian_saved_spots_bank_v1',OLD='pmp_route_guardian_history_bank_v1';let BEFORE=F;const $=id=>document.getElementById(id),S=$('status');function say(x){S.textContent=x}function clean(t){t=String(t||'').trim();if(!t||/[\s<>"']/.test(t)||/^https?:/i.test(t)||!/\.html($|[?#])/.test(t))return'';return t.replace(/^\.\//,'')}function fresh(t,l){t=clean(t)||F;let i=t.indexOf('#'),b=i>=0?t.slice(0,i):t,h=i>=0?t.slice(i):'#control';return b+(b.includes('?')?'&':'?')+'fresh='+(l||'rg')+'-'+Date.now()+h}function jr(k,d){try{return JSON.parse(localStorage.getItem(k)||'')}catch(e){return d}}function jw(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}function mb(){let b=jr(MOVE,null)||jr(OLD,null)||{type:'PMP_ROUTE_GUARDIAN_MOVE_LEDGER_BANK_V1',max_entries:100,entries:[]};b.type='PMP_ROUTE_GUARDIAN_MOVE_LEDGER_BANK_V1';b.max_entries=100;b.entries=Array.isArray(b.entries)?b.entries:[];return b}function push(kind,o){let b=mb();b.entries.push({move_id:'rgm_'+Date.now()+'_'+Math.random().toString(36).slice(2,6),at:new Date().toISOString(),kind,...(o||{})});b.entries=b.entries.slice(-100);b.updated_at=new Date().toISOString();jw(MOVE,b);jw('pmp_route_guardian_move_ledger_v1',b);return b}function seed(){let b=mb();if(b.entries.some(e=>e.seed_id==='rg_v2_snapshot_seed'))return;b.entries.push({move_id:'rgm_'+Date.now()+'_seed',seed_id:'rg_v2_snapshot_seed',at:new Date().toISOString(),kind:'chatgpt_github_file_patch',label:'Previous Route Guardian Last Good before saved-spot delete cleanup',from:SNAP,to:'pmp-route-guardian-last-good-v2.html',restorable_route:SNAP});b.entries=b.entries.slice(-100);jw(MOVE,b);jw('pmp_route_guardian_move_ledger_v1',b)}function sb(){let b=jr(SPOTS,{type:'PMP_ROUTE_GUARDIAN_SAVED_SPOTS_BANK_V1',entries:[]});b.entries=Array.isArray(b.entries)?b.entries:[];return b}function sw(b){b.updated_at=new Date().toISOString();jw(SPOTS,b)}function lastBefore(cur){let b=mb();for(let i=b.entries.length-1;i>=0;i--){let e=b.entries[i],t=clean(e.restorable_route||e.snapshot_path||e.previous_route||e.to||e.target||'');if(t&&t!==cur&&!/pmp-route-guardian-last-good-v2\.html/i.test(t))return t}return''}function open(label,target){return e=>{e.preventDefault();let t=clean(target)||BEFORE;localStorage.setItem('pmp_route_guardian_current_target',t);localStorage.setItem('pmp_route_guardian_last_good',t);push(label==='Last Good'?'open_last_good':label==='Current Before Last Good'?'return_current_before_last_good':'open_saved_spot',{from:'pmp-route-guardian-last-good-v2.html',to:t,label});say('Route overwritten by choice.\n'+label+' → '+t);setTimeout(()=>location.href=fresh(t,label),120)}}function row(label,target,note,cls){let b=document.createElement('button');b.className='row '+(cls||'');b.innerHTML='<strong></strong><span></span>';b.querySelector('strong').textContent=label;b.querySelector('span').textContent=note+' · '+target;b.onclick=open(label,target);return b}function drawSpots(){let out=$('spotBank'),b=sb();out.innerHTML='';if(!b.entries.length){out.textContent='No saved spots yet.';return}b.entries.forEach(s=>{let w=document.createElement('div');w.appendChild(row(s.label,s.route,'Saved '+s.created_at,''));let d=document.createElement('button');d.className='row danger';d.innerHTML='<strong>Delete Saved Spot</strong><span>Remove this spot from the saved-spots bank.</span>';d.onclick=e=>{e.preventDefault();let x=sb();x.entries=x.entries.filter(a=>a.spot_id!==s.spot_id);sw(x);push('delete_saved_spot',{to:s.route,label:s.label,spot_id:s.spot_id});say('Saved spot deleted.');drawSpots()};w.appendChild(d);out.appendChild(w)})}function init(){seed();let qp=new URLSear

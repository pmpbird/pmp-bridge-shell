<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#f3ded4"><title>PMP Route Guardian v15</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f3ded4;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#07101c}#app{position:fixed;inset:0;width:100%;height:100%;border:0;background:#f3ded4}#gate{position:fixed;inset:0;display:grid;place-items:center;background:#f3ded4;padding:18px;z-index:9;text-align:center}.card{width:min(760px,100%);background:#fff;border:3px solid #07101c;border-radius:28px;padding:18px}.badge,button{background:#acd1fb;border:2px solid #07101c;border-radius:16px;padding:12px;font:inherit;font-weight:950;color:#07101c}.dark{background:#172234;color:#eef4fb}.grid{display:grid;gap:8px}.loaded #gate{display:none!important}#loaderReload{position:fixed;left:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:10;border-radius:999px;padding:10px 14px;box-shadow:0 4px 12px rgba(0,0,0,.25)}pre{display:none;white-space:pre-wrap;text-align:left;background:#102033;color:#eaffef;border-radius:16px;padding:10px;max-height:42vh;overflow:auto}.open{display:block}</style></head><body><iframe id="app"></iframe><button id="loaderReload">Reload Current</button><div id="gate"><div class="card"><div class="badge">ROUTE GUARDIAN v15</div><h1>Route Guardian</h1><p id="msg">Press Run App.</p><div class="grid"><button id="openBtn">Run App</button><button id="reloadBtn">Reload Current</button><button id="copyBtn" class="dark">Copy Report</button><button id="showBtn" class="dark">Show / Hide Report</button></div><pre id="report">No report yet.</pre></div></div><script>const app=document.getElementById('app'),msg=document.getElementById('msg'),report=document.getElementById('report'),openBtn=document.getElementById('openBtn'),reloadBtn=document.getElementById('reloadBtn'),loaderReload=document.getElementById('loaderReload'),showBtn=document.getElementById('showBtn'),copyBtn=document.getElementById('copyBtn');let receipt={type:'RG15_READY',at:new Date().toISOString()};function ok(h){return /^#(world|bridge|library|workshop|control|bank)$/i.test(String(h||''))}function safePath(p,f){p=String(p||f||'').trim();return /^[a-zA-Z0-9._/-]+\.html$/.test(p)?p.replace(/^\/+/,''):f}async function fetchMap(){let r=await fetch('pmp-current-map-v9.json?rg15='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('map failed '+r.status);return await r.json()}async function target(){let m=await fetchMap();let a=m.current_app||{};return{path:safePath(a.path,'pmp-current-reload-owner-v26.html'),key:String(a.cache_key||m.updated_at||Date.now()),map:m}}function currentHash(){try{let h=app.contentWindow.location.hash;if(ok(h))return h.toLowerCase()}catch(e){}return ok(location.hash)?location.hash.toLowerCase():'#control'}async function openApp(hash,kind){let got;try{got=await target()}catch(e){got={path:'pmp-current-reload-owner-v26.html',key:'fallback',map:{error:String(e)}}}let h=ok(hash)?hash:'#control';receipt={type:kind,at:new Date().toISOString(),target:got.path,cache_key:got.key,page:h};try{localStorage.setItem('pmp_reload_current_live_snapshot_v12',JSON.stringify({type:'PMP_RELOAD_CURRENT_LIVE_SNAPSHOT_V12',page:h,made_at:Date.now(),at:new Date().toISOString(),source:kind},null,2))}catch(e){}report.textContent=JSON.stringify(receipt,null,2);msg.textContent=(kind==='RG15_RELOAD_CURRENT'?'Reloading ':'Running ')+got.path;app.src=got.path+'?fresh=rg15-'+encodeURIComponent(got.key)+'-'+Date.now()+h;document.body.classList.add('loaded')}openBtn.onclick=()=>openApp('#control','RG15_RUN_APP');reloadBtn.onclick=()=>openApp(currentHash(),'RG15_RELOAD_CURRENT');loaderReload.onclick=()=>openApp(currentHash(),'RG15_RELOAD_CURRENT');showBtn.onclick=()=>report.classList.toggle('open');copyBtn.onclick=async()=>{try{await navigator.clipboard.writeText(JSON.stringify(receipt,null,2));msg.textContent='Report copied.'}catch(e){report.classList.add('open')}}</script></body></html>

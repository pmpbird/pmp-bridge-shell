<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>PMP Snapshot Test Room v3</title><style>body{margin:0;background:#140f0c;color:#fff7ec;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.top{position:sticky;top:0;z-index:5;background:#201711;border-bottom:1px solid #76513e;padding:12px}.card{background:#2a211b;border:1px solid #76513e;border-radius:16px;margin:10px;padding:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.big{font-size:18px;border:2px solid #d8b58a;background:#fff3de;color:#23160f;border-radius:16px;padding:16px 10px;font-weight:800}.wide{grid-column:1/-1}.small{font-size:14px;opacity:.82}pre{white-space:pre-wrap;background:#080605;border:1px solid #49372c;border-radius:12px;padding:10px;max-height:34vh;overflow:auto}iframe{width:100%;height:61vh;border:0;background:white;border-top:1px solid #76513e}</style><script src="pmp-page-hidden-state-reveal-contract-v1.js?v3=1"></script><script src="pmp-page-snapshot-contract-v1.js?v3=1"></script><script src="pmp-snapshot-verification-gate-v1.js?v3=1"></script><script src="pmp-snapshot-verification-gate-bridge-v1.js?v3=1"></script><script src="pmp-reload-perfect-restore-gate-v1.js?v3=1"></script><script src="pmp-snapshot-visibility-test-harness-v1.js?v3=1"></script></head><body><div class="top"><b>Snapshot Test Room v3</b><div class="small">Full main-page test room. Separate page. Does not change the live app.</div></div><div class="card"><div class="grid"><button class="big" onclick="testPage('Home','#world')">Test Home</button><button class="big" onclick="testPage('Bridge','#bridge')">Test Bridge</button><button class="big" onclick="testPage('Library','#library')">Test Library</button><button class="big" onclick="testPage('Workshop','#workshop')">Test Workshop</button><button class="big" onclick="testPage('Control','#control')">Test Control</button><button class="big" onclick="testPage('Bank','#bank')">Test Bank</button><button class="big" onclick="testBankDetail('Continuous Run Bank','continuous run bank')">Test Continuous Run Bank</button><button class="big" onclick="testBankDetail('Connections Bank','connections bank')">Test Connections Bank</button><button class="big wide" onclick="testAll()">Run Main Page Sweep</button></div><pre id="out">Ready. Tap one button. A PASS only counts for the named test.</pre></div><iframe id="app" title="PMP test frame"></iframe><script>const f=document.getElementById('app'),out=document.getElementById('out');function show(x){out.textContent=typeof x==='string'?x:JSON.stringify(x,null,2)}function src(h){return 'pmp-current-inner-cleanbug-rgcontrols-v23.html?testroom=v3-'+Date.now()+h}function doc(){try{return f.contentDocument||f.contentWindow.document}catch(e){return null}}function clickNeedle(needle){let d=doc();if(!d)return false;needle=needle.toLowerCase();let nodes=[...d.querySelectorAll('button,a,div,span')];let hit=nodes.find(x=>(x.textContent||'').toLowerCase().includes(needle));if(hit){hit.click();return true}return false}function harness(name){let r=top.PMPSnapshotVisibilityTestHarnessV1.run();let good=!!r.pass;return{test:name,status:r.status,pass:good,missing_systems:r.missing_systems,page_fail_count:r.page_fail_count,pages:r.pages}}function testPage(name,h){show('Loading '+name+'...');f.onload=()=>setTimeout(()=>show(harness(name)),2600);f.src=src(h)}function testBankDetail(name,needle){show('Opening Bank, then '+name+'...');f.onload=()=>setTimeout(()=>{clickNeedle('bank');setTimeout(()=>{let opened=clickNeedle(needle);setTimeout(()=>{let r=harness(name);r.open_clicked=opened;show(r)},2200)},1800)},2300);f.src=src('#bank')}async function wait(ms){return new Promise(r=>setTimeout(r,ms))}async function one(name,h){return new Promise(res=>{f.onload=()=>setTimeout(()=>res(harness(name)),2600);f.src=src(h)})}async function detail(name,needle){return new Promise(res=>{f.onload=()=>setTimeout(()=>{clickNeedle('bank');setTimeout(()=>{let opened=clickNeedle(needle);setTimeout(()=>{let r=harness(name);r.open_clicked=opened;res(r)},2200)},1800)},2300);f.src=src('#bank')})}async function testAll(){show('Running main page sweep...');let tests=[];tests.push(await one('Home','#world'));tests.push(await one('Bridge','#bridge'));tests.push(await one('Library','#library'));tests.push(await one('Workshop','#workshop'));tests.push(await one('Control','#control'));tests.push(await one('Bank','#bank'));tests.push(await detail('Continuous Run Bank','continuous run bank'));tests.push(await detail('Connections Bank','connections bank'));let pass=tests.every(t=>t.pass&&t.page_fail_count===0&&(!('open_clicked'in t)||t.open_clicked));show({type:'PMP_SNAPSHOT_TEST_ROOM_V3_SWEEP',status:pass?'MAIN_PAGE_SWEEP_PASS':'MAIN_PAGE_SWEEP_FAIL',pass,tests})}f.src=src('#world');</script></body></html>

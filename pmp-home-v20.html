<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>PMP Home v20</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#52b5df}iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#52b5df}</style></head><body><iframe id="home" src="pmp-home-v11.html?fresh=v20-combined"></iframe><script>const HOME=document.getElementById('home');const CHAT_KEY='pmp_resident_session_chat_v20';const BACKEND_KEY='pmp_backend_config_v1';const COLOR_KEY='pmp_color_settings_v20';function cfg(){try{return{enabled:false,base_url:'',...JSON.parse(localStorage.getItem(BACKEND_KEY)||'{}')}}catch(e){return{enabled:false,base_url:''}}}function getHome(){try{return{w:HOME.contentWindow,d:HOME.contentDocument||HOME.contentWindow.document}}catch(e){return null}}function getApp(){try{let h=getHome();if(!h)return null;let f=h.d.getElementById('app');if(!f)return null;return{w:f.contentWindow,d:f.contentDocument||f.contentWindow.document,home:h}}catch(e){return null}}function readChat(){try{return JSON.parse(sessionStorage.getItem(CHAT_KEY)||'[]')}catch(e){return[]}}function writeChat(a){try{sessionStorage.setItem(CHAT_KEY,JSON.stringify(a.slice(-80)))}catch(e){}}function esc(s){return String(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}function simple(s){if(!s)return s;return s.replace(/backend is off, so truth is local unless copied out/g,'the app is keeping its safety notes mostly on this phone').replace(/Link Code Safety more tightly to Automatic App Update, so a version is only saved as last_good after a clean health check\./g,'Make the update button ask the safety guard before it saves a new version as safe.').replace(/the app health is not a clean PASS yet/g,'the app has not clearly shown that it is healthy yet').replace(/latest and last_good are not clearly the same/g,'the newest version and the safe version are not clearly the same').replace(/Connections has no saved packet yet/g,'Connections does not have a saved project packet yet').replace(/saved packet material exists, but Corpus is not clearly filled/g,'there is a saved packet, but the useful part has not clearly been moved into Corpus yet')}function addChat(role,text){if(!text)return;let a=readChat();a.push({role,text,at:new Date().toISOString()});writeChat(a);renderChat()}function renderChat(){let h=getHome();if(!h)return;let d=h.d,box=d.getElementById('residentChatBox');if(!box)return;let a=readChat();if(!a.length){box.innerHTML='<div style="opacity:.8">This session chat is empty. It resets when you close the app.</div>';return}box.innerHTML=a.map(m=>{let mine=m.role==='user';let st=mine?'margin-left:14%;background:#0c141e;color:#eef4fb;':'margin-right:14%;background:#123024;color:#c9f7d7;';return'<div style="'+st+'border:1px solid #25354a;border-radius:14px;padding:9px;margin:7px 0;white-space:pre-wrap;font-size:13px;line-height:1.35"><b>'+(mine?'You':'Resident')+':</b> '+esc(m.text)+'</div>'}).join('');box.scrollTop=box.scrollHeight}async function archiveChat(w){let c=readChat();if(!c.length)return w.plain('There is no Resident chat to archive yet.',{kind:'archive_empty_v20'},'Talk with Resident first, then archive if you want to keep it.');let conf=cfg();let payload={type:'PMP_RESIDENT_CHAT_ARCHIVE_V20',built_at:new Date().toISOString(),chat:c,context:w.context?w.context():null};if(!conf.enabled||!conf.base_url)return w.plain('The outside safe box is not connected yet, so I could not archive this chat. Open Launcher, then Backend, and turn it on when you are ready.',{kind:'archive_backend_off_v20',payload},'For now, this chat is only in this app session.');try{let r=await fetch(conf.base_url.replace(/\/$/,'')+'/api/resident-archive',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(payload)});let txt=await r.text();let j;try{j=JSON.parse(txt)}catch(e){j={raw:txt}}if(!r.ok)throw Error(j.error||r.statusText);w.plain('I archived this Resident chat in the existing Launcher backend. It is like putting the conversation notes in the outside safe box.',{kind:'archive_ok_v20',result:j,payload},'This session can stay light now.')}catch(e){w.plain('I tried to archive the chat, but the outside safe box did not accept it yet.',{kind:'archive_failed_v20',error:e.message,payload},'For now, copy the chat or leave it in this session.')}}function patchResident(){let h=getHome();if(!h)return;let w=h.w,d=h.d;if(!w||!d||w.__v20Resident)return;if(!w.plain||!w.residentRun)return;w.__v20Resident=true;let resident=d.getElementById('resident'),ask=d.getElementById('ask'),reply=d.getElementById('residentReply');if(!resident||!ask||!reply)return;let p=d.querySelector('#resident p');if(p)p.textContent='Talk normally. Your messages move into Chat. Extra tools stay inside Tools.';let panel=d.createElement('div');panel.id='residentChatToolsV20';panel.innerHTML='<div class="grid"><button class="btn" onclick="toggleResidentChat()">Chat</button><button class="btn" onclick="toggleResidentTools()">Tools</button></div><div id="residentChatBox" style="display:none;background:#0c141e;border:1px solid #25354a;border-radius:16px;padding:8px;margin:8px 0;max-height:230px;overflow:auto;color:#c9f7d7;font-size:13px"></div><div id="residentToolsBox" style="display:none;background:#0c141e;border:1px solid #25354a;border-radius:16px;padding:8px;margin:8px 0"><div class="grid3"><button class="btn" onclick="packetRequest()">Packet Request</button><button class="btn" onclick="savePacket()">Save Packet</button><button class="btn" onclick="pipeline()">Pipeline</button></div><div class="grid3"><button class="btn" onclick="showWork()">Show Work</button><button class="btn" onclick="copyWork()">Copy Work</button><button class="btn" onclick="residentHelp()">Help Me</button></div><div class="grid"><button class="btn" onclick="archiveResidentChat()">Archive Chat</button><button class="btn" onclick="clearResidentSessionChat()">Reset Chat</button></div></div>';resident.insertBefore(panel,ask);let move=['Copy Reply','Packet Request','Save Packet','Pipeline','Show Work','Copy Work','Help Me'];for(const b of [...resident.querySelectorAll('button')]){let t=(b.textContent||'').trim();if(move.includes(t)&&!b.closest('#residentToolsBox'))b.style.display='none'}for(const row of [...resident.querySelectorAll('.grid3')]){if(!row.closest('#residentToolsBox')){let moved=[...row.querySelectorAll('button')].some(b=>move.includes((b.textContent||'').trim()));let visible=[...row.querySelectorAll('button')].some(b=>b.style.display!=='none');if(moved&&!visible)row.style.display='none'}}w.toggleResidentChat=function(){let box=d.getElementById('residentChatBox');box.style.display=box.style.display==='none'?'block':'none';renderChat()};w.toggleResidentTools=function(){let box=d.getElementById('residentToolsBox');box.style.display=box.style.display==='none'?'block':'none'};w.clearResidentSessionChat=function(){writeChat([]);renderChat();w.plain('I cleared this session chat. Important app memory stayed saved.',{kind:'clear_chat_v20'},'Keep telling me the next thing normally.')};w.archiveResidentChat=function(){archiveChat(w)};const oldPlain=w.plain;w.plain=function(message,work,next,warning){let msg=simple(message),nx=simple(next),out=oldPlain(msg,work,nx,simple(warning));addChat('resident',msg+(nx?'\n\nNext: '+nx:''));return out};const oldRun=w.residentRun;w.residentRun=function(){let msg=(ask.value||'').trim();if(msg)addChat('user',msg);let out=oldRun();ask.value='';return out};try{w.plain('Resident v20 is ready. Chat and Tools are clean now. Archive Chat uses the existing Launcher backend only.',{kind:'v20_resident_ready'},'Backend Settings stays in Launcher.')}catch(e){}renderChat()}function colors(){try{return{accent:'#a1fcfd',background:'#52b5df',card:'#46a9d3',...JSON.parse(localStorage.getItem(COLOR_KEY)||'{}')}}catch(e){return{accent:'#a1fcfd',background:'#52b5df',card:'#46a9d3'}}}function saveColors(c){localStorage.setItem(COLOR_KEY,JSON.stringify(c));applyColors()}function applyColors(){let a=getApp();if(!a)return;let c=colors();try{let r=a.d.documentElement.style;r.setProperty('--a',c.accent);r.setProperty('--a2',c.accent);r.setProperty('--a4',c.accent);r.setProperty('--bg',c.background);r.setProperty('--card',c.card);a.d.body.style.background=c.background}catch(e){}try{let h=getHome();if(h){h.d.documentElement.style.setProperty('--a',c.accent);h.d.body.style.background=c.background}}catch(e){}}function patchAppUI(){let a=getApp();if(!a)return;let w=a.w,d=a.d;if(!d||d.__v20AppUI)return;d.__v20AppUI=true;applyColors();try{let strip=[...d.querySelectorAll('#bridge .toolstrip button')];for(const b of strip){if((b.textContent||'').trim()==='Resident')b.style.display='none'}}catch(e){}let control=d.getElementById('control');let card=control?control.querySelector('.card'):null;if(card&&!d.getElementById('colorSettingsV20')){let div=d.createElement('div');div.id='colorSettingsV20';div.className='panel';div.innerHTML='<h2>Color Settings</h2><p class="sub" style="color:#c9f7d7">Three app colors. Saved on this phone.</p><label>Accent color<input id="colorAccentV20" type="color"></label><label>Background color<input id="colorBgV20" type="color"></label><label>Card color<input id="colorCardV20" type="color"></label><div class="grid"><button class="mini" onclick="saveColorSettingsV20()">Save Colors</button><button class="mini" onclick="resetColorSettingsV20()">Reset Colors</button></div><div id="colorStatusV20" class="note">Color settings ready.</div>';card.appendChild(div);let c=colors();d.getElementById('colorAccentV20').value=c.accent;d.getElementById('colorBgV20').value=c.background;d.getElementById('colorCardV20').value=c.card}w.saveColorSettingsV20=function(){let c={accent:d.getElementById('colorAccentV20').value,background:d.getElementById('colorBgV20').value,card:d.getElementById('colorCardV20').value};saveColors(c);let s=d.getElementById('colorStatusV20');if(s)s.textContent='Colors saved.'};w.resetColorSettingsV20=function(){localStorage.removeItem(COLOR_KEY);applyColors();let c=colors();d.getElementById('colorAccentV20').value=c.accent;d.getElementById('colorBgV20').value=c.background;d.getElementById('colorCardV20').value=c.card;let s=d.getElementById('colorStatusV20');if(s)s.textContent='Colors reset.'}}function patch(){patchResident();patchAppUI();applyColors()}HOME.addEventListener('load',()=>{setTimeout(patch,700);setTimeout(patch,1800);setTimeout(patch,3500)});setInterval(patch,2500);window.addEventListener('pagehide',()=>{try{sessionStorage.removeItem(CHAT_KEY)}catch(e){}});</script></body></html>

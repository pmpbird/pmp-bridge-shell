<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Route Guardian Recovery Shell</title><style>body{margin:0;background:#f3ded4;color:#07101c;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:18px}.card{background:#fff;border:3px solid #07101c;border-radius:26px;padding:16px;max-width:680px;margin:auto}.badge{display:inline-block;background:#acd1fb;border:2px solid #07101c;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:950}.btn{display:block;width:100%;box-sizing:border-box;margin:10px 0;border:2px solid #07101c;border-radius:16px;background:#eef4fb;color:#07101c;padding:14px;text-align:left;font:inherit;font-weight:900;text-decoration:none}.cur{background:#dff7e8}.last{background:#fff4d6}.spot{background:#e9ecff}.dark{background:#172234;color:#eef4fb}.danger{background:#3a1212;color:#ffe6e6}.bank{display:none;background:#0c141e;color:#eef4fb;border-radius:14px;padding:10px;margin-top:10px;max-height:28vh;overflow:auto}.open{display:block}.viewbox{margin-top:14px;border:3px solid #07101c;border-radius:22px;overflow:hidden;background:#fff}.frame{width:100%;height:55vh;border:0;background:#fff}.status{background:#123024;color:#d8ffe2}</style></head><body><div class="card"><span class="badge">RECOVERY SHELL</span><h1>Route Guardian Recovery Shell</h1><p>All recovery controls are outside the viewed version.</p><a class="btn cur" href="pmp-current-inner-cleanbug-rgcontrols-v7.html#control">Current Before Last Good</a><button id="last" class="btn last">Last Good<br><small>Open old History Ledger inside this shell.</small></button><button id="save" class="btn spot">Save Current Before Last Good<br><small>Save the shell route, not the inner page.</small></button><a id="ret" class="btn cur">Return to Newer Move<br><small>Return to the newer move saved before rollback.</small></a><button id="make" class="btn last">Make This Version Current<br><small>Mark viewed version as chosen current.</small></button><button id="spots" class="btn dark">Saved Spots<br><small>Show saved spots and delete saved spots.</small></button><div id="spotBox" class="bank"></div><button id="moves" class="btn dark">Move Ledger<br><small>Show last 100 moves.</small></button><pre id="moveBox" class="bank"></pre><div id="status" class="btn status">Shell ready.</div><div class="viewbox"><iframe id="view" class="frame"></iframe></div></div><script>(()=>{const SP='pmp_route_guardian_saved_spots_bank_v1',MV='pmp_route_guardian_move_ledger_bank_v1',RET='pmp_route_guardian_newer_move_return_v1';const q=new URLSearchParams(location.search),VIEW=q.get('view')||'pmp-route-guardian-move-ledger-view-v1.html',ME='pmp-route-guardian-recovery-shell-v3.html?view=pmp-route-guardian-move-ledger-view-v1.html',RETURN=q.get('return')||localStorage.getItem(RET)||ME;localStorage.setItem(RET,RETURN);const $=x=>document.getElementById(x);function read(k,d){try{return JSON.parse(localStorage.getItem(k)||'')}catch(e){return d}}function write(k,v){localStorage.setItem(k,JSON.stringify(v))}function enc(t){return encodeURIComponent(t)}function fresh(t){t=String(t);let h='',i=t.indexOf('#');if(i>=0){h=t.slice(i);t=t.slice(0,i)}return t+(t.includes('?')?'&':'?')+'fresh='+Date.now()+h}function shell(view,ret){return 'pmp-route-guardian-recovery-shell-v3.html?view='+enc(view)+'&return='+enc(ret||ME)}function move(kind,to){let b=read(MV,{entries:[]});b.entries=Array.isArray(b.entries)?b.entries:[];b.entries.push({id:'move_'+Date.now(),at:new Date().toISOString(),kind,view:VIEW,return_to:RETURN,to});b.entries=b.entries.slice(-100);write(MV,b)}function drawSpots(){let b=read(SP,{entries:[]});b.entries=Array.isArray(b.entries)?b.entries:[];$('spotBox').innerHTML='';if(!b.entries.length){$('spotBox').textContent='No saved spots yet.';return}b.entries.forEach(s=>{let a=document.createElement('a');a.className='btn';a.href=fresh(s.route);a.textContent=s.label||'Saved Spot';$('spotBox').appendChild(a);let d=document.createElement('button');d.className='btn danger';d.textContent='Delete Saved Spot';d.onclick=()=>{let x=read(SP,{entries:[]});x.entries=(x.entries||[]).filter(e=>e.id!==s.id);write(SP,x);move('delete_saved_spot',s.route);drawSpots()};$('spotBox').appendChild(d)})}$('view').src=fresh(VIEW);$('ret').href=fresh(RETURN);$('ret').onclick=()=>move('return_to_newer_move',RETURN);$('last').onclick=()=>{localStorage.setItem(RET,ME);move('open_last_good_inside_shell','pmp-route-guardian-history-ledger-snapshot-v2.html');location.href=fresh(shell('pmp-route-guardian-history-ledger-snapshot-v2.html',ME))};$('save').onclick=()=>{let b=read(SP,{entries:[]});b.entries=Array.isArray(b.entries)?b.entries:[];let item={id:'spot_'+Date.now(),label:'Saved Move Ledger Shell Version',route:ME,at:new Date().toISOString()};b.entries.unshift(item);b.entries=b.entries.slice(0,100);write(SP,b);move('save_current_before_last_good',ME);$('status').textContent='Saved current shell version outside restored versions.'};$('make').onclick=()=>{localStorage.setItem('pmp_route_guardian_make_current_request_v1',VIEW);move('make_this_version_current_request',VIEW);$('status').textContent='Marked viewed version as current request on this device. Ask ChatGPT to commit it to GitHub if you want it permanent.'};$('spots').onclick=()=>{drawSpots();$('spotBox').classList.toggle('open')};$('moves').onclick=()=>{$('moveBox').textContent=JSON.stringify(read(MV,{entries:[]}),null,2);$('moveBox').classList.toggle('open')};move('open_recovery_shell',VIEW)})();</script></body></html>

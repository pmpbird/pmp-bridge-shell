<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PMP">
<title>PMP Home v4</title>
<style>
:root{--a:#a1fcfd;--bg:#52b5df;--dark:#0c141e;--panel:#172234;--ok:#c9f7d7;--line:#fff;--text:#101827}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);-webkit-text-size-adjust:100%;touch-action:manipulation;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#app{position:fixed;inset:0;width:100%;height:100%;border:0;background:var(--bg)}
#toolsBtn{position:fixed;right:10px;top:calc(10px + env(safe-area-inset-top));z-index:6;border:2px solid var(--line);background:var(--a);color:var(--text);border-radius:999px;padding:8px 12px;font-weight:900;font-size:12px;box-shadow:0 8px 18px #0003;width:auto!important;min-width:0!important;max-width:130px!important;line-height:1}
#bar{position:fixed;left:10px;right:10px;bottom:10px;z-index:5;display:none;background:#123024;color:var(--ok);border:2px solid var(--line);border-radius:16px;padding:8px 10px;font-size:12px;white-space:pre-wrap;box-shadow:0 8px 18px #0003}
#drawer{position:fixed;right:10px;left:10px;top:calc(54px + env(safe-area-inset-top));z-index:7;display:none;background:var(--panel);color:#eef4fb;border:2px solid var(--a);border-radius:20px;padding:12px;box-shadow:0 8px 18px #0005;max-height:78vh;overflow:auto}
h2{font-size:18px;margin:0 0 6px}.sub{font-size:12px;color:var(--ok);margin:0 0 8px;font-weight:800}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.toolbtn{border:1px solid #25354a;background:var(--a);color:var(--text);border-radius:14px;padding:10px 8px;font:inherit;font-weight:900;width:100%;font-size:12px}
input{width:100%;border:1px solid #25354a;border-radius:14px;background:var(--dark);color:#eef4fb;padding:11px;font:inherit;margin:7px 0;font-size:13px}
pre{white-space:pre-wrap;overflow:auto;max-height:34vh;background:var(--dark);color:var(--ok);border-radius:12px;padding:10px;text-align:left;font-size:11px}.pill{background:var(--dark);color:var(--ok);border:1px solid #25354a;border-radius:999px;padding:7px 9px;margin:6px 0;font-size:11px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hidden{display:none!important}
</style>
</head>
<body>
<iframe id="app" src="about:blank"></iframe>
<button id="toolsBtn" onclick="toggleDrawer()">Launcher</button>
<div id="bar">PMP Home v4 starting...</div>
<div id="drawer">
  <h2>Launcher Tools</h2>
  <p class="sub">Compact shell tools. Control Room layout stays clean.</p>
  <div id="statePill" class="pill">Starting...</div>
  <div id="mirrorPill" class="pill">Live Mirror: waiting...</div>
  <div id="secretPill" class="pill">Secret controls: hidden from normal view</div>
  <div class="grid3">
    <button class="toolbtn" onclick="copyTruth()">Copy Truth</button>
    <button class="toolbtn" onclick="reloadLatest()">Reload</button>
    <button class="toolbtn" onclick="useLastGood()">Last Good</button>
  </div>
  <div class="grid">
    <button class="toolbtn" onclick="showBackend()">Backend</button>
    <button class="toolbtn" onclick="hideDrawer()">Close</button>
  </div>
  <div id="backendBox" class="hidden">
    <h2>Backend Settings</h2>
    <p class="sub">Optional free backend layer. Off = local mode stays active.</p>
    <input id="backendUrl" placeholder="Cloudflare Worker URL">
    <div class="grid3">
      <button class="toolbtn" onclick="saveBackend(true)">On</button>
      <button class="toolbtn" onclick="saveBackend(false)">Off</button>
      <button class="toolbtn" onclick="testBackend()">Test</button>
    </div>
    <div class="grid">
      <button class="toolbtn" onclick="sendTruthToBackend()">Send Truth</button>
      <button class="toolbtn" onclick="pullBackendLatest()">Pull Latest</button>
    </div>
  </div>
  <pre id="truth">No report yet.</pre>
</div>
<script>
const POINTER='pmp-latest.json';
const FALLBACK='pmp-clean-v21.html';
const BACKEND_KEY='pmp_backend_config_v1';
const FRAME=document.getElementById('app');
let pointer=null,latest=FALLBACK,lastGood=FALLBACK,activeTarget='',activeReason='startup',lastLoadAt=0,lastAutoUpdateAt=0,blockedDetourCount=0,loadFailures=0,hiddenRhythmControls=0;
let health={state:'STARTING',reason:'launcher booting'};
let events=[];
function now(){return new Date().toISOString()}
function log(event,detail){events.push({at:now(),event,detail});if(events.length>50)events.shift();updatePills()}
function bar(msg){const b=document.getElementById('bar');b.textContent=msg;b.style.display='block';clearTimeout(bar.t);bar.t=setTimeout(()=>{b.style.display='none'},2600)}
function toggleDrawer(){const d=document.getElementById('drawer');d.style.display=d.style.display==='block'?'none':'block';updateTruth()}
function hideDrawer(){document.getElementById('drawer').style.display='none'}
function showBackend(){document.getElementById('backendBox').classList.toggle('hidden');document.getElementById('backendUrl').value=backendConfig().base_url||''}
function backendConfig(){try{return{enabled:false,base_url:'',fallback_to_local:true,...JSON.parse(localStorage.getItem(BACKEND_KEY)||'{}')}}catch(e){return{enabled:false,base_url:'',fallback_to_local:true}}}
function saveBackend(enabled){const cfg={enabled,base_url:document.getElementById('backendUrl').value.trim(),fallback_to_local:true};localStorage.setItem(BACKEND_KEY,JSON.stringify(cfg));bar('Backend '+(enabled?'enabled':'disabled')+'.');log('backend_saved',cfg);updateTruth()}
async function backendRequest(path,options={}){const cfg=backendConfig();if(!cfg.enabled||!cfg.base_url)throw new Error('Backend is off.');const res=await fetch(cfg.base_url.replace(/\/$/,'')+path,{...options,headers:{'content-type':'application/json',...(options.headers||{})}});const txt=await res.text();let json;try{json=JSON.parse(txt)}catch(e){json={raw:txt}}if(!res.ok)throw new Error(json.error||res.statusText);return json}
async function testBackend(){try{const j=await backendRequest('/api');bar('Backend connected.');log('backend_test_ok',j)}catch(e){bar('Backend test failed: '+e.message);log('backend_test_failed',e.message)}updateTruth()}
async function pullBackendLatest(){try{const j=await backendRequest('/api/latest');if(j.latest){pointer=j;latest=j.latest;lastGood=j.last_good||lastGood;loadTarget(latest,'backend-latest')}bar('Pulled backend latest.');log('backend_latest',j)}catch(e){bar('Backend latest failed: '+e.message);log('backend_latest_failed',e.message)}updateTruth()}
async function sendTruthToBackend(){try{const j=await backendRequest('/api/truth',{method:'POST',body:JSON.stringify(truth())});bar('Truth sent to backend.');log('backend_truth_sent',j)}catch(e){bar('Truth send failed: '+e.message);log('backend_truth_failed',e.message)}updateTruth()}
function getFrameHref(){try{return FRAME.contentWindow.location.href}catch(e){return 'unreadable: '+e.message}}
function readFrameText(){try{const d=FRAME.contentDocument||FRAME.contentWindow.document;return (d.body&&d.body.innerText||'').slice(0,2500)}catch(e){return ''}}
function updatePills(){document.getElementById('statePill').textContent='Health: '+health.state+' | App: '+(activeTarget||'none')+' | Backend: '+(backendConfig().enabled?'ON':'OFF');document.getElementById('mirrorPill').textContent='Live Mirror: '+getFrameHref().replace(location.origin+'/','').slice(0,120);document.getElementById('secretPill').textContent='Secret controls: hidden from normal view | hidden count: '+hiddenRhythmControls}
function truth(){return{type:'PMP_APP_TRUTH_REPORT_HOME_V4',built_at:now(),launcher:'pmp-home-v4.html',control_room_changed:false,normal_ui_secret_controls_hidden:true,hidden_rhythm_control_count:hiddenRhythmControls,live_mirror:{frame_href:getFrameHref(),active_target:activeTarget,health},pointer_url:POINTER,pointer,latest,last_good:lastGood,active_reason:activeReason,load_failures:loadFailures,blocked_detour_count:blockedDetourCount,last_auto_update_at:lastAutoUpdateAt?new Date(lastAutoUpdateAt).toISOString():null,backend:backendConfig(),stored_current_target:localStorage.getItem('pmp_current_clean_app_target')||null,stored_last_good:localStorage.getItem('pmp_last_good_clean_app')||null,events}}
function updateTruth(){document.getElementById('truth').textContent=JSON.stringify(truth(),null,2);updatePills()}
async function copyTruth(){const t=JSON.stringify(truth(),null,2);try{await navigator.clipboard.writeText(t);bar('App Truth Report copied.')}catch(e){bar('Copy blocked. Report shown.')}updateTruth()}
async function readPointer(){try{const cfg=backendConfig();if(cfg.enabled&&cfg.base_url){try{const bj=await backendRequest('/api/latest');if(bj&&bj.latest){pointer=bj;latest=bj.latest;lastGood=bj.last_good||localStorage.getItem('pmp_last_good_clean_app')||FALLBACK;health={state:'BACKEND_POINTER_OK',reason:'backend latest pointer loaded'};log('backend_pointer_loaded',{latest,lastGood});return}}catch(be){log('backend_pointer_failed',be.message)}}const r=await fetch(POINTER+'?fresh='+Date.now(),{cache:'no-store'});const j=await r.json();pointer=j;latest=j.latest||FALLBACK;lastGood=j.last_good||localStorage.getItem('pmp_last_good_clean_app')||FALLBACK;health={state:'POINTER_OK',reason:'local latest pointer loaded'};log('pointer_loaded',{latest,lastGood});}catch(e){pointer={type:'POINTER_READ_FAILED',error:e.message};latest=localStorage.getItem('pmp_current_clean_app_target')||FALLBACK;lastGood=localStorage.getItem('pmp_last_good_clean_app')||FALLBACK;health={state:'POINTER_FAILED',reason:e.message};log('pointer_failed',e.message)}}
function saveTarget(target){try{localStorage.setItem('pmp_current_clean_app_target',target)}catch(e){}}
function saveLastGood(target){try{localStorage.setItem('pmp_last_good_clean_app',target)}catch(e){}}
function loadTarget(target,reason){activeTarget=target;activeReason=reason||'load';lastLoadAt=Date.now();saveTarget(target);bar('Opening PMP app.\nTarget: '+target);log('load_target',{target,reason});FRAME.src=target+'?fresh='+encodeURIComponent(reason||'load')+'-'+Date.now()+'#control';setTimeout(checkHealth,1600);setTimeout(checkHealth,3200);setTimeout(patchApp,300);setTimeout(patchApp,1000);updateTruth()}
async function start(){await readPointer();loadTarget(latest,'home-v4-open')}
async function reloadLatest(){await readPointer();loadTarget(latest,'manual-reload-latest')}
function useLastGood(){loadTarget(lastGood||FALLBACK,'manual-last-good')}
async function oneTapUpdate(){lastAutoUpdateAt=Date.now();await readPointer();try{localStorage.setItem('pmp_last_auto_update',JSON.stringify({type:'PMP_HOME_V4_ONE_TAP_UPDATE',target:latest,at:now(),meaning:'Launcher refreshed newest app inside same Home Screen app.'}))}catch(e){}bar('Automatic App Update complete.\nNewest app refreshed here.');loadTarget(latest,'one-tap-auto-update')}
function checkHealth(){let href=getFrameHref();if(!href||href.includes('about:blank'))return;let bad=/404|not found/i.test(readFrameText())||/safe-writer/i.test(href);if(bad){loadFailures++;health={state:'BAD_LOAD',reason:'bad href or 404/not found text',href};log('bad_load',{href});loadTarget(lastGood||FALLBACK,'fallback-after-bad-load');return}try{const d=FRAME.contentDocument||FRAME.contentWindow.document;const hasTabs=!!d.querySelector('.tabs');const hasControl=(d.body&&/Control Room/i.test(d.body.innerText||''));if(hasTabs&&hasControl){health={state:'PASS',reason:'tabs and Control Room detected',href};saveLastGood(activeTarget);lastGood=activeTarget;log('health_pass',{target:activeTarget});}else{health={state:'WATCH',reason:'loaded but key markers incomplete',href,hasTabs,hasControl};log('health_watch',health)}}catch(e){health={state:'WATCH',reason:'health read blocked: '+e.message,href};log('health_blocked',health)}updateTruth()}
function hideNormalSecretControls(d){let count=0;try{const buttons=[...d.querySelectorAll('button')];for(const b of buttons){const txt=(b.textContent||'').trim();if(txt==='Record Rhythm'||txt==='Reset Rhythm'){b.style.display='none';b.setAttribute('aria-hidden','true');b.setAttribute('data-pmp-hidden-secret-control','true');count++;}}const body=d.body;if(body){body.innerHTML=body.innerHTML.replace('Tap the title with your saved rhythm. Record once, confirm once, then use it as the secret entrance.','Tap the Control Room title with your saved private rhythm.');}}catch(e){}hiddenRhythmControls=count;}
function patchApp(){let w,d;try{w=FRAME.contentWindow;d=FRAME.contentDocument||w.document}catch(e){return}if(!w||!d)return;hideNormalSecretControls(d);try{w.automaticAppUpdate=oneTapUpdate}catch(e){}try{const buttons=[...d.querySelectorAll('button')];for(const b of buttons){if((b.textContent||'').includes('Automatic App Update')){b.onclick=function(ev){if(ev){ev.preventDefault();ev.stopPropagation();if(ev.stopImmediatePropagation)ev.stopImmediatePropagation()}oneTapUpdate();return false};}}if(!d.__pmpHomeV4CaptureInstalled){d.__pmpHomeV4CaptureInstalled=true;d.addEventListener('click',function(ev){const b=ev.target&&ev.target.closest?ev.target.closest('button'):null;if(b&&(b.textContent||'').includes('Automatic App Update')){ev.preventDefault();ev.stopPropagation();if(ev.stopImmediatePropagation)ev.stopImmediatePropagation();oneTapUpdate();return false}},true)}}catch(e){}updatePills()}
function guard(){let href=getFrameHref();if(/safe-writer/i.test(href)){blockedDetourCount++;health={state:'DETOUR_BLOCKED',reason:'Safe Writer detour blocked',href};log('detour_blocked',{href});bar('Blocked Safe Writer detour.\nReturning to current app.');loadTarget(latest||lastGood||FALLBACK,'blocked-safe-writer-detour')}updateTruth()}
FRAME.addEventListener('load',()=>{setTimeout(patchApp,100);setTimeout(checkHealth,900);setTimeout(guard,200)});
setInterval(()=>{patchApp();guard();updatePills()},1200);
window.addEventListener('error',e=>{loadFailures++;health={state:'WINDOW_ERROR',reason:e.message};log('window_error',e.message);updateTruth()});
window.addEventListener('message',e=>{log('message',e.data);updateTruth()});
start();
</script>
</body>
</html>

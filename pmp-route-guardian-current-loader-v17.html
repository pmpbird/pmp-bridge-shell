<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#f3ded4"><title>PMP Route Guardian v17</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f3ded4;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#07101c}#app{position:fixed;inset:0;width:100%;height:100%;border:0;background:#f3ded4}#gate{position:fixed;inset:0;display:grid;place-items:center;background:#f3ded4;padding:18px;z-index:9;text-align:center}.card{width:min(760px,100%);max-height:calc(100vh - 36px);box-sizing:border-box;background:#fff;border:3px solid #07101c;border-radius:28px;padding:14px;display:grid;gap:8px}.badge,button{background:#acd1fb;border:2px solid #07101c;border-radius:16px;padding:12px;font:inherit;font-weight:950;color:#07101c}.dark{background:#172234;color:#eef4fb}.grid{display:grid;gap:8px}.loaded #gate{display:none!important}#rgLog{display:block;white-space:pre-wrap;text-align:left;background:#07101c;color:#dfffe4;border-radius:16px;padding:10px;height:min(34vh,300px);overflow:auto;-webkit-overflow-scrolling:touch;font:750 8px/1.15 "SFMono-Regular","SF Mono",Menlo,Consolas,monospace}.open{display:block}.runFlash{font-size:1.18em;background:#fff3de!important;border:3px solid #07101c!important;animation:pmpRunFlash 1s infinite;box-shadow:0 0 0 0 rgba(7,16,28,.65)}@keyframes pmpRunFlash{0%{transform:scale(1);box-shadow:0 0 0 0 rgba(7,16,28,.55)}50%{transform:scale(1.035);box-shadow:0 0 0 10px rgba(7,16,28,.08)}100%{transform:scale(1);box-shadow:0 0 0 0 rgba(7,16,28,.55)}}</style></head><body><iframe id="app"></iframe><div id="gate"><div class="card"><div class="badge">ROUTE GUARDIAN v17</div><h1 style="margin:4px 0">Route Guardian</h1><p id="msg" style="margin:0">Press Run App.</p><pre id="rgLog"></pre><div class="grid"><button id="openBtn" class="runFlash">Run App</button><button id="copyBtn" class="dark">Copy Report</button><button id="showBtn" class="dark">Show / Hide Report</button></div><pre id="report" style="display:none;white-space:pre-wrap;text-align:left;background:#102033;color:#eaffef;border-radius:16px;padding:10px;max-height:20vh;overflow:auto">No report yet.</pre></div></div><script>const PASS4_KEY='pass4-v17-v28-full-scroll-boot-log-20260703E';const app=document.getElementById('app'),msg=document.getElementById('msg'),report=document.getElementById('report'),openBtn=document.getElementById('openBtn'),showBtn=document.getElementById('showBtn'),copyBtn=document.getElementById('copyBtn'),rgLog=document.getElementById('rgLog');let receipt={type:'RG17_READY_RUN_APP',version:'v17-pass4-preflight-log-20260703E',at:new Date().toISOString()},t0=Date.now(),lines=[];function stamp(){return ((Date.now()-t0)/1000).toFixed(1)+'s'}function push(x){lines.push('['+stamp()+'] '+x);rgLog.textContent=lines.join('\n');rgLog.scrollTop=0}function safePath(path,fallback){path=String(path||fallback||'').trim();return /^[a-zA-Z0-9._\/-]+\.html$/.test(path)?path.replace(/^\/+/,''):fallback}async function fetchMap(){push('fetch map pmp-current-map-v10.json');let r=await fetch('pmp-current-map-v10.json?rg17='+PASS4_KEY+'-'+Date.now(),{cache:'no-store'});push('map status '+r.status);if(!r.ok)throw new Error('map failed '+r.status);let m=await r.json();push('map loaded updated_at='+(m.updated_at||'none'));return m}async function getTarget(){let map=await fetchMap();let a=map.current_app||{};let target=safePath(a.path,'pmp-current-reload-owner-v28.html');let key=String(a.cache_key||map.updated_at||PASS4_KEY);push('target '+target);push('cache key '+key);return{target,key,map}}async function openCurrent(){push('Run App pressed');let got;try{got=await getTarget()}catch(e){push('map fallback '+String(e&&e.message||e));got={target:'pmp-current-reload-owner-v28.html',key:PASS4_KEY,map:{error:String(e)}}}receipt={type:'RG17_RUN_APP',version:'v17-pass4-preflight-log-20260703E',at:new Date().toISOString(),target:got.target,cache_key:got.key,map_current_app:got.map&&got.map.current_app,map_updated_at:got.map&&got.map.updated_at,preflight_lines:lines.slice()};report.textContent=JSON.stringify(receipt,null,2);msg.textContent='Running App: '+got.target;openBtn.classList.remove('runFlash');push('open iframe '+got.target);app.src=got.target+'?fresh=rg17-'+PASS4_KEY+'-'+encodeURIComponent(got.key)+'-'+Date.now()+'#control';app.onload=()=>{push('iframe load event');setTimeout(()=>document.body.classList.add('loaded'),800)}}openBtn.onclick=openCurrent;showBtn.onclick=()=>{report.style.display=report.style.display==='block'?'none':'block'};copyBtn.onclick=async()=>{try{await navigator.clipboard.writeText(JSON.stringify(receipt,null,2));msg.textContent='Report copied.'}catch(e){report.style.display='block'}};push('$ route-guardian --version=v17 --mode=preflight');push('ready; waiting for Run App');push('style: old Run App pulse restored');push('first page now appends downward too');</script></body></html>

<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#52b5df">
<title>PMP Home Single v12</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#52b5df}iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#52b5df}</style>
</head>
<body>
<iframe id="app" src="pmp-home-single-v10.html?fresh=v12-one-button-smart-lossless-export-v12"></iframe>
<script>
const F=document.getElementById('app');
const EYES_KEY='pmp_inventory_eyes_latest_v1';
const INVENTORY_KEY='pmp_app_lossless_inventory_latest_v1';
const RESIDENT_KEY='pmp_resident_auto_lossless_inventory_context_v1';
const RULE_KEY='pmp_lossless_improve_runs_inventory_rule_v1';
const MANIFEST_PATH='pmp-inventory-eyes-manifest-v1.0.0.json';
const FALLBACK_PATHS=['index.html','pmp-home-single-v6.html','pmp-home-single-v7.html','pmp-home-single-v10.html','pmp-home-single-v12.html','bm.html','private-bug-memory-hub-v7.html','private-bug-memory-hub-v9.html','resident-notes-catalog-v3.html','resident-notes-backend-v2.html','resident-zip-xray-v2.html','private-bug-mixer-lab-v1.html','private-bug-mixer-lab-spec-v1.json','pmp-shared-theme-v1.js','safe-writer-v14.html','code-safety-v13.html','resident.html','pmp-inventory-eyes-manifest-v1.0.0.json'];
function now(){return new Date().toISOString()}
function read(k,f=null){try{let v=localStorage.getItem(k);return v?JSON.parse(v):f}catch(e){return f}}
function write(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function unique(a){return[...new Set((a||[]).filter(Boolean))]}
function safeText(x,n=100){return String(x||'').replace(/\s+/g,' ').trim().slice(0,n)}
function view(){try{let w=F.contentWindow,d=F.contentDocument||w.document;for(let i=0;i<8;i++){let n=d&&d.getElementById&&d.getElementById('app');if(!n)break;w=n.contentWindow;d=n.contentDocument||w.document}return{w,d}}catch(e){return null}}
function setStatus(msg){let o=view(),d=o&&o.d;if(!d)return;let c=d.getElementById('controlStatus');if(c)c.textContent=msg;let b=d.getElementById('bridgePanel');if(b&&!String(b.textContent||'').includes(msg))b.textContent=(b.textContent||'')+'\n\n'+msg}
function goBugMemory(){location.href='bm.html'}
function storageInventory(){let keys=[];try{keys=Object.keys(localStorage).sort()}catch(e){}return keys.map(k=>({key:k,classification:/bug|private|token|pass|backend|secret|memory/i.test(k)?'private_or_sensitive_key_name_only':'public_safe_key_name_only',value_captured:false}))}
function liveInventory(trigger){let o=view(),d=o&&o.d;let inv={trigger:trigger||'Improve Lossless Quality',title:'unknown',url:location.href,screen:'unknown',buttons:[],links:[],inputs:0,textareas:0,selects:0,panels:0,notes:0,drawers:0,visible_text_sample:'',local_storage_keys:storageInventory()};try{inv.title=d.title||'untitled';let on=[...d.querySelectorAll('.screen')].find(s=>s.classList.contains('on'));inv.screen=on?on.id:'unknown';inv.buttons=[...d.querySelectorAll('button')].map((b,i)=>({index:i,text:safeText(b.textContent,120),visible:b.offsetParent!==null,onclick:(b.getAttribute('onclick')||'').slice(0,120)}));inv.links=[...d.querySelectorAll('a[href]')].map((a,i)=>({index:i,text:safeText(a.textContent,120),href:a.getAttribute('href'),visible:a.offsetParent!==null}));inv.inputs=d.querySelectorAll('input').length;inv.textareas=d.querySelectorAll('textarea').length;inv.selects=d.querySelectorAll('select').length;inv.panels=d.querySelectorAll('.panel,.dock,.card').length;inv.notes=d.querySelectorAll('.note,.warn,.reply,.statusbar').length;inv.drawers=d.querySelectorAll('.drawer').length;inv.visible_text_sample=safeText(d.body&&d.body.innerText,1600)}catch(e){inv.error=String(e.message||e)}return inv}
async function loadManifest(){try{let r=await fetch(MANIFEST_PATH+'?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('manifest '+r.status);return await r.json()}catch(e){return{type:'PMP_INVENTORY_EYES_MANIFEST_FALLBACK',version:'fallback',paths:FALLBACK_PATHS,classification_rules:{current_active:['pmp-home-single-v10.html','pmp-home-single-v12.html','bm.html','private-bug-memory-hub-v9.html','resident-notes-catalog-v3.html','resident-notes-backend-v2.html','resident-zip-xray-v2.html','private-bug-mixer-lab-v1.html']},load_error:String(e.message||e)}}}
function roleFor(path){let p=String(path||'').toLowerCase();let role='unknown';if(p.endsWith('.html'))role='html_page';else if(p.endsWith('.js'))role='javascript_helper';else if(p.endsWith('.json'))role='json_manifest_or_spec';else if(p.endsWith('.css'))role='css_shell_or_style';else if(p.endsWith('.toml'))role='config';if(/bug-memory|bug_memory|bm\.html/.test(p))role+=' / bug_memory_related';if(/resident/.test(p))role+=' / resident_related';if(/zip|xray/.test(p))role+=' / scanner_related';if(/mixer/.test(p))role+=' / bug_mixer_related';if(/home|index|app|launcher|current/.test(p))role+=' / home_or_entry_related';if(/safe|safety|writer/.test(p))role+=' / safety_writer_related';if(/worker|backend|cloudflare|wrangler/.test(p))role+=' / backend_or_worker_related';return role}
function statusFor(path,manifest){let c=(manifest&&manifest.classification_rules)||{};if((c.current_active||[]).includes(path))return'active_current';if((c.visual_reference||[]).includes(path))return'active_reference';if((c.helper_not_user_facing||[]).includes(path))return'helper_not_user_facing';if((c.likely_archive_or_test||[]).includes(path))return'inactive_archive_or_test';if((c.expected_missing_or_future||[]).includes(path))return'inactive_future_or_unavailable_candidate';if(/v\d+\.html$/i.test(path))return'inactive_version_candidate';return'inactive_candidate'}
function pathInventory(path,manifest){let status=statusFor(path,manifest);return{path,status,active:status.startsWith('active'),inactive:!status.startsWith('active'),role:roleFor(path)}}
async function scanManifestSafe(trigger){let live=liveInventory(trigger);let manifest=await loadManifest();let paths=unique([...(manifest.paths||FALLBACK_PATHS)]);let files=paths.map(p=>pathInventory(p,manifest));let active=files.filter(f=>f.active),inactive=files.filter(f=>f.inactive),helpers=files.filter(f=>/helper|spec|config|worker|css|js|json/.test(f.role));let byRole={html_pages:files.filter(f=>f.path.endsWith('.html')).length,json_files:files.filter(f=>f.path.endsWith('.json')).length,js_files:files.filter(f=>f.path.endsWith('.js')).length,css_files:files.filter(f=>f.path.endsWith('.css')).length,config_files:files.filter(f=>/\.toml$|worker/i.test(f.path)).length};let privacy=files.filter(f=>/bug|private|resident|backend|worker|notes/i.test(f.path)).map(f=>({path:f.path,status:f.status,role:f.role,private_values_captured:false}));let themeTargets=files.filter(f=>/home|bug-memory|resident-notes|zip-xray|mixer|room-shell|shared-theme/i.test(f.path)).map(f=>({path:f.path,status:f.status,role:f.role,needs_theme_check:/resident-notes|zip-xray|mixer/i.test(f.path)}));return{type:'PMP_INVENTORY_EYES_APP_SCAN',version:'2.2.0-safe-manifest-smart-copy',built_at:now(),trigger,scan_mode:'SAFE_MANIFEST_INVENTORY',why_safe:'The phone app reads the manifest and live screen instead of fetching every app file from GitHub Pages. This avoids GitHub Pages rate protection.',truth_boundary:'This sees the whole app field listed in the Inventory Eyes manifest plus the live loaded app screen. Deep file-content inventory should be built through GitHub-side tools and written back into a manifest/report file, not by mass-fetching GitHub Pages from iPhone.',language_rule:'Use active/inactive language. Inactive means known to inventory but not part of the current active app path.',manifest:{path:MANIFEST_PATH,type:manifest.type,version:manifest.version,path_count:paths.length,load_error:manifest.load_error||null},live_screen:live,summary:{manifest_paths:paths.length,active_files:active.length,inactive_files:inactive.length,helper_or_support_files:helpers.length,privacy_sensitive_surfaces:privacy.length,theme_review_targets:themeTargets.length,local_storage_keys:live.local_storage_keys.length,...byRole},active_files:active,inactive_files:inactive,helper_or_support_files:helpers,privacy_surfaces:privacy,theme_review_targets:themeTargets,file_inventory:files}}
function parseMaybe(t){try{return JSON.parse(t)}catch(e){return t||null}}
function oldStatus(x){if(!x)return null;if(typeof x==='string')x=parseMaybe(x);if(x&&x.type==='PMP_LOSSLESS_REPORT_WITH_INVENTORY_EYES')return x.normal_lossless_status||null;if(x&&x.type==='PMP_LOSSLESS_IMPROVE_WITH_INVENTORY')return x.normal_lossless_status||null;return x}
function showScanning(){let o=view(),d=o&&o.d,b=d&&d.getElementById('bridgePanel');if(b){b.className='note';b.textContent='Inventory Eyes reading manifest and live app screen...\nSafe mode: no mass GitHub Pages file fetch. Active/inactive inventory report should appear quickly.'}}
function showResult(scan){let o=view(),d=o&&o.d;if(!d)return;let bridge=d.getElementById('bridgePanel');let existing=bridge?oldStatus(bridge.textContent):null;let result={type:'PMP_LOSSLESS_REPORT_WITH_INVENTORY_EYES',built_at:now(),inventory_eyes_captured:true,inventory_key:INVENTORY_KEY,inventory_eyes_key:EYES_KEY,resident_context_updated:true,privacy:'localStorage key names only; private values not captured. Apple Notes/private Bug Memory not scanned.',copy_rule:'Copy Lossless Report is one button. Small reports copy as text. Large reports open iPhone share/download as a JSON file for ChatGPT upload.',scan_summary:scan.summary,truth_boundary:scan.truth_boundary,normal_lossless_status:existing,inventory_eyes:scan};if(bridge){bridge.className='note';bridge.textContent=JSON.stringify(result,null,2)}try{if(o.w)o.w.currentOutput=JSON.stringify(result,null,2)}catch(e){}return result}
async function publishInventoryEyes(trigger,visible){try{if(visible)showScanning();let scan=await scanManifestSafe(trigger);write(EYES_KEY,scan);write(INVENTORY_KEY,scan);write(RULE_KEY,{type:'PMP_LOSSLESS_IMPROVE_RULE',version:'3.2.0',updated_at:scan.built_at,rule:'Improve Lossless Quality runs safe Inventory Eyes first. Copy Lossless Report is the only export control: small text copies, large report shares/downloads JSON.',inventory_key:INVENTORY_KEY,inventory_eyes_key:EYES_KEY,resident_context_key:RESIDENT_KEY});write(RESIDENT_KEY,{type:'PMP_RESIDENT_AUTO_CONTEXT',version:'3.2.0',updated_at:scan.built_at,source:'Safe Inventory Eyes',required_context_key:EYES_KEY,resident_instruction:'Before any lossless improvement, read newest Inventory Eyes scan. Use active/inactive language. Do not mass-fetch GitHub Pages from phone. Do not expose private Bug Memory or promote without test pass.',latest_scan_summary:scan.summary,truth_boundary:scan.truth_boundary});return visible?showResult(scan):scan}catch(e){let fail={type:'PMP_INVENTORY_EYES_APP_SCAN',version:'2.2.0-safe-failure',built_at:now(),trigger,scan_status:'failure_report',error:String(e.message||e),summary:{active_files:0,inactive_files:0},live_screen:liveInventory(trigger),file_inventory:[]};write(EYES_KEY,fail);return visible?showResult(fail):fail}}
function bridgeText(){let o=view(),d=o&&o.d;if(!d)return'';let b=d.getElementById('bridgePanel');return b?(b.innerText||b.textContent||'').trim():''}
function reportFileName(){return 'pmp-lossless-report-'+new Date().toISOString().replace(/[:.]/g,'-')+'.json'}
async function shareOrDownloadJson(text){let fileName=reportFileName();let file=new File([text],fileName,{type:'application/json'});try{if(navigator.canShare&&navigator.canShare({files:[file]})&&navigator.share){await navigator.share({files:[file],title:'PMP Lossless Report',text:'Upload this JSON file to ChatGPT for lossless reading.'});setStatus('Opened share sheet for full JSON Lossless Report. Upload that file to ChatGPT.');return true}}catch(e){}
 try{let blob=new Blob([text],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=fileName;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1200);setStatus('Downloaded full JSON Lossless Report. Upload that file to ChatGPT.');return true}catch(e){}
 try{await navigator.clipboard.writeText(text);setStatus('Could not open file share/download, so copied the full Lossless Report text.');return true}catch(e){setStatus('Export failed. Press and hold the Lossless Report text to select manually.');return false}}
async function copyOrExportLosslessReport(){let text=bridgeText();if(text.startsWith('Inventory Eyes')){let last=read(EYES_KEY,null);if(last&&last.type){text=JSON.stringify({type:'PMP_LOSSLESS_REPORT_WITH_INVENTORY_EYES',built_at:now(),note:'Latest finished Inventory Eyes report.',inventory_eyes:last},null,2)}else{setStatus('Inventory Eyes is still preparing. Wait for the JSON report, then tap Copy Lossless Report.');return false}}
 if(!text)return false;if(text.length>12000||/"file_inventory"|"inventory_eyes"/.test(text))return shareOrDownloadJson(text);
 try{await navigator.clipboard.writeText(text);setStatus('Copied Lossless Report for ChatGPT.');return true}catch(e){return shareOrDownloadJson(text)}}
function activePanelName(d){let p=d&&d.getElementById('bridgePanel');if(!p||!p.classList.contains('panel'))return'';let h=p.querySelector('h2');return h?(h.textContent||'').trim():''}
function closePanel(d){let p=d&&d.getElementById('bridgePanel');if(p){p.className='note';p.textContent='Bridge ready.'}}
function simplifyBridgeUi(){let o=view(),d=o&&o.d;if(!d)return;let buttons=[...d.querySelectorAll('button')];for(const btn of buttons){let txt=(btn.textContent||'').replace(/\s+/g,' ').trim();if(txt.includes('Prepare Project Export')){btn.remove();continue}if(txt.includes('Copy Current')||txt.includes('Copy Green Box')){let spans=[...btn.querySelectorAll('span')];if(spans.length>=2){spans[1].innerHTML='Copy Lossless Report<small>Small = copy · large = JSON file</small>'}else{btn.textContent='Copy Lossless Report'}}if((txt==='Share'||txt==='Connections')&&!btn.dataset.panelToggle){btn.dataset.panelToggle='1';btn.addEventListener('click',e=>{let current=activePanelName(d);if(current===txt){e.preventDefault();e.stopImmediatePropagation();closePanel(d)}},true)}}let bridge=d.getElementById('bridge');if(bridge&&!d.getElementById('pmpBridgeSimplifyNote')){let note=d.createElement('div');note.id='pmpBridgeSimplifyNote';note.className='note';note.textContent='Inventory Eyes safe flow: Improve Lossless Quality reads the app manifest and live screen. Copy Lossless Report is one smart button: small reports copy, large reports become a JSON file you can upload to ChatGPT.';let card=bridge.querySelector('.card'),strip=bridge.querySelector('.toolstrip');if(card&&strip)card.insertBefore(note,strip)}}
function patch(){let o=view();if(!o||!o.d)return;simplifyBridgeUi();let b=[...o.d.querySelectorAll('button')].find(x=>(x.textContent||'').trim()==='Bug Memory');if(b&&!b.dataset.bm){b.dataset.bm='1';b.onclick=function(e){if(e)e.preventDefault();goBugMemory()}}if(o.w&&!o.w.__bm_route){let old=typeof o.w.showSecret==='function'?o.w.showSecret:null;o.w.__bm_route=1;o.w.showSecret=function(n){if(String(n)==='Bug Memory'){goBugMemory();return}if(old)return old.apply(this,arguments)}}if(o.w&&typeof o.w.improveLossless==='function'&&!o.w.__smartInventoryEyesImproveLossless){let old=o.w.improveLossless;o.w.__smartInventoryEyesImproveLossless=1;o.w.improveLossless=function(){let result=old.apply(this,arguments);setTimeout(()=>publishInventoryEyes('Improve Lossless Quality button',true),80);return result}}if(o.w&&typeof o.w.copyCurrent==='function'&&!o.w.__smartLosslessCopy){let old=o.w.copyCurrent;o.w.__smartLosslessCopy=1;o.w.copyCurrent=function(){if(bridgeText())return copyOrExportLosslessReport();return old.apply(this,arguments)}}let copies=[...o.d.querySelectorAll('button')].filter(x=>/COPY CURRENT|COPY GREEN BOX|COPY LOSSLESS REPORT/i.test(x.textContent||''));for(const cb of copies){if(!cb.dataset.smartLosslessCopy){cb.dataset.smartLosslessCopy='1';cb.addEventListener('click',e=>{if(bridgeText()){e.preventDefault();e.stopImmediatePropagation();copyOrExportLosslessReport()}},true)}}let improves=[...o.d.querySelectorAll('button')].filter(x=>(x.textContent||'').toUpperCase().includes('IMPROVE LOSSLESS QUALITY'));for(const ib of improves){if(!ib.dataset.inventoryEyesFallback){ib.dataset.inventoryEyesFallback='1';ib.addEventListener('click',()=>{if(!(o.w&&o.w.__smartInventoryEyesImproveLossless))setTimeout(()=>publishInventoryEyes('Improve Lossless Quality button click',true),120)},true)}}}
F.onload=function(){setTimeout(patch,300);setTimeout(patch,1000);setTimeout(patch,2500)};setInterval(patch,1000);
</script>
</body>

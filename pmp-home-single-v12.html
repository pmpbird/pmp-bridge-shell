<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#52b5df"><title>PMP Home Single v12</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#52b5df}iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#52b5df}</style></head><body><iframe id="app" src="pmp-home-single-v10.html?fresh=v12-lossless-inventory-copy-current-v3"></iframe><script>const F=document.getElementById('app');const INVENTORY_KEY='pmp_app_lossless_inventory_latest_v1';const RESIDENT_KEY='pmp_resident_auto_lossless_inventory_context_v1';const RULE_KEY='pmp_lossless_improve_runs_inventory_rule_v1';function read(k,f){try{let v=localStorage.getItem(k);return v?JSON.parse(v):f}catch(e){return f}}function write(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}function view(){try{let w=F.contentWindow,d=F.contentDocument||w.document;for(let i=0;i<8;i++){let n=d&&d.getElementById&&d.getElementById('app');if(!n)break;w=n.contentWindow;d=n.contentDocument||w.document}return{w,d}}catch(e){return null}}function go(){location.href='bm.html'}function storageInventory(){let keys=[];try{keys=Object.keys(localStorage).sort()}catch(e){}return keys.map(k=>({key:k,classification:/bug|private|token|pass|backend|secret|memory/i.test(k)?'private_or_sensitive_key_name_only':'public_safe_key_name_only',value_captured:false}))}function collectLosslessInventory(trigger){let o=view(),d=o&&o.d;let links=[],buttons=[],title='unknown';try{title=d.title||'untitled';links=[...d.querySelectorAll('a[href]')].slice(0,80).map(a=>({text:(a.textContent||'').trim().slice(0,80),href:a.getAttribute('href')}));buttons=[...d.querySelectorAll('button')].slice(0,120).map(b=>((b.textContent||'').trim().replace(/\s+/g,' '))).filter(Boolean).slice(0,80)}catch(e){}return{type:'PMP_APP_LOSSLESS_INVENTORY_SNAPSHOT',version:'1.0.2',built_at:new Date().toISOString(),trigger:trigger||'Improve Lossless Quality',scope:'browser-visible app state, route truth, known active tools, privacy boundaries, and localStorage key names only',master_rule:'Do not rewrite PMP Master for app-layer state.',privacy_rule:'Private Bug Memory details stay in Apple Notes/private storage. Inventory records private key names only, never private values.',current_wrapper:'pmp-home-single-v12.html',wrapped_chain:['pmp-home-single-v12.html','pmp-home-single-v10.html','pmp-home-single-v7.html','pmp-home-single-v6.html'],visible_document_title:title,route_truth:{main_known_line:'pmp-home-single-v10.html',current_wrapper_with_inventory:'pmp-home-single-v12.html',bug_memory_short_route:'bm.html',accepted_bug_memory_visual_target:'private-bug-memory-hub-v9.html',bug_memory_current_implementation_observed:'bm.html still observed as older route until route cleanup'},active_tool_targets:[{file:'private-bug-memory-hub-v9.html',role:'accepted Bug Memory visual target',status:'active visual target'},{file:'resident-notes-catalog-v3.html',role:'Notes Catalog',status:'active; needs room shell upgrade'},{file:'resident-notes-backend-v2.html',role:'Notes Backend Bridge',status:'active; needs room shell upgrade'},{file:'resident-zip-xray-v2.html',role:'ZIP X-Ray fixed scanner',status:'active; needs room shell upgrade'},{file:'private-bug-mixer-lab-v1.html',role:'Bug Mixer Lab',status:'active; needs room shell upgrade'}],known_open_findings:[{id:'BM_ROUTE_TARGET',finding:'Bug Memory short route must be checked against accepted v9 target before cleanup.',lossless_effect:'current pointer truth must be recorded before route cleanup'},{id:'WRAPPER_STACK_HOME',finding:'v12 wraps v10, v10 wraps v7, and v7 wraps v6.',lossless_effect:'do not treat wrapper stack as final clean architecture'},{id:'ROOM_SHELL_GAP',finding:'Active support tools need same Room Shell as Control Room/Bug Memory.',lossless_effect:'visual mismatch is tracked as lossless app-state damage'}],visible_links:links,visible_buttons:buttons,local_storage_keys:storageInventory(),resident_auto_context:{rule:'When Improve Lossless Quality runs, Resident must automatically treat the newest PMP_APP_LOSSLESS_INVENTORY_SNAPSHOT as required context before answering or improving.',source_key:INVENTORY_KEY,do_not_guess_current_routes:true,do_not_promote_without_test_pass:true},next_action:'Inventory first, then improve only the weakest clean app-layer point.'}}function parseJsonMaybe(text){try{return JSON.parse(text)}catch(e){return text||null}}function bridgeText(){let o=view(),d=o&&o.d;if(!d)return'';let b=d.getElementById('bridgePanel');return b?(b.innerText||b.textContent||'').trim():''}async function copyBridgeText(){let text=bridgeText();let o=view(),d=o&&o.d;if(!text)return false;try{await navigator.clipboard.writeText(text);if(d){let b=d.getElementById('bridgePanel');if(b){b.className='note';b.textContent=text+'\n\nCopied visible Bridge output for ChatGPT.'}let c=d.getElementById('controlStatus');if(c)c.textContent='Copied visible Bridge output for ChatGPT.'}return true}catch(e){if(d){let c=d.getElementById('controlStatus');if(c)c.textContent='Copy failed. Press and hold the green output box to select manually.'}return false}}function showInventoryResult(inv){let o=view(),d=o&&o.d;if(!d)return;let bridge=d.getElementById('bridgePanel');let existing=bridge?parseJsonMaybe(bridge.textContent):null;let result={type:'PMP_LOSSLESS_IMPROVE_WITH_INVENTORY',built_at:new Date().toISOString(),inventory_captured:true,inventory_key:INVENTORY_KEY,resident_context_updated:true,privacy:'localStorage key names only; private values not captured',inventory_summary:{active_tool_targets:inv.active_tool_targets.length,visible_links:inv.visible_links.length,visible_buttons:inv.visible_buttons.length,local_storage_keys:inv.local_storage_keys.length,known_open_findings:inv.known_open_findings.length,next_action:inv.next_action},normal_lossless_status:existing};if(bridge){bridge.className='note';bridge.textContent=JSON.stringify(result,null,2)}let control=d.getElementById('controlStatus');if(control)control.textContent='Lossless Inventory captured. Resident context updated. Key: '+INVENTORY_KEY;try{if(o.w)o.w.currentOutput=JSON.stringify(result,null,2)}catch(e){}}function publishInventory(trigger,visible){let inv=collectLosslessInventory(trigger);write(INVENTORY_KEY,inv);write(RULE_KEY,{type:'PMP_LOSSLESS_IMPROVE_RULE',version:'1.0.2',updated_at:inv.built_at,rule:'Improve Lossless Quality must take inventory first, then improve from that inventory.',inventory_key:INVENTORY_KEY,resident_context_key:RESIDENT_KEY});write(RESIDENT_KEY,{type:'PMP_RESIDENT_AUTO_CONTEXT',version:'1.0.2',updated_at:inv.built_at,source:'Improve Lossless Quality inventory hook',required_context_key:INVENTORY_KEY,resident_instruction:'Before any lossless improvement, read the newest app lossless inventory snapshot. Inventory is not private bug content; it is the map of app files/routes/state. Do not expose or guess private Bug Memory.',latest_inventory_summary:{built_at:inv.built_at,active_tool_targets:inv.active_tool_targets,known_open_findings:inv.known_open_findings,next_action:inv.next_action}});try{let o=view();if(o&&o.w)o.w.__PMP_LOSSLESS_INVENTORY__=inv;if(o&&o.d)o.d.documentElement.dataset.pmpLosslessInventory='ready'}catch(e){}if(visible)showInventoryResult(inv);return inv}function patch(){let o=view();if(!o||!o.d)return;let b=[...o.d.querySelectorAll('button')].find(x=>(x.textContent||'').trim()==='Bug Memory');if(b&&!b.dataset.bm){b.dataset.bm='1';b.onclick=function(e){if(e)e.preventDefault();go();};}if(o.w&&!o.w.__bm_route){let old=typeof o.w.showSecret==='function'?o.w.showSecret:null;o.w.__bm_route=1;o.w.showSecret=function(n){if(String(n)==='Bug Memory'){go();return}if(old)return old.apply(this,arguments)}}if(o.w&&typeof o.w.improveLossless==='function'&&!o.w.__losslessInventoryImproveLossless){let oldLossless=o.w.improveLossless;o.w.__losslessInventoryImproveLossless=1;o.w.improveLossless=function(){let result=oldLossless.apply(this,arguments);setTimeout(()=>publishInventory('Improve Lossless Quality button',true),60);return result}}if(o.w&&typeof o.w.improve==='function'&&!o.w.__losslessInventoryImprove){let oldImprove=o.w.improve;o.w.__losslessInventoryImprove=1;o.w.improve=function(){let result=oldImprove.apply(this,arguments);setTimeout(()=>publishInventory('Improve Lossless Quality button',true),60);return result}}if(o.w&&typeof o.w.copyCurrent==='function'&&!o.w.__copyVisibleBridgeOutput){let oldCopy=o.w.copyCurrent;o.w.__copyVisibleBridgeOutput=1;o.w.copyCurrent=function(){if(bridgeText())return copyBridgeText();return oldCopy.apply(this,arguments)}}let copyButtons=[...o.d.querySelectorAll('button')].filter(x=>(x.textContent||'').toUpperCase().includes('COPY CURRENT'));for(const cb of copyButtons){if(!cb.dataset.copyVisibleBridgeOutput){cb.dataset.copyVisibleBridgeOutput='1';cb.addEventListener('click',e=>{if(bridgeText()){e.preventDefault();e.stopImmediatePropagation();copyBridgeText()}},true)}}let improveButtons=[...o.d.querySelectorAll('button')].filter(x=>(x.textContent||'').toUpperCase().includes('IMPROVE LOSSLESS QUALITY'));for(const ib of improveButtons){if(!ib.dataset.losslessInventoryV2){ib.dataset.losslessInventoryV2='1';ib.addEventListener('click',()=>setTimeout(()=>publishInventory('Improve Lossless Quality button click',true),140),true)}}}F.onload=function(){setTimeout(patch,300);setTimeout(patch,1000);setTimeout(patch,2500);setTimeout(()=>publishInventory('app load baseline',false),3200)};setInterval(patch,1000);</script></body></html>

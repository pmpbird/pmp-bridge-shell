<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bank Timeline v3</title><style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#f3ded4;margin:0;color:#07101c}header{position:sticky;top:0;background:#f3ded4;padding:10px;border-bottom:3px solid #07101c}button{font-weight:800;border:2px solid #07101c;border-radius:12px;background:#acd1fb;padding:10px;margin:4px}iframe{width:100%;height:60vh;border:3px solid #07101c}pre{white-space:pre-wrap;word-break:break-word;background:#102033;color:#eaffef;padding:10px;border-radius:14px;font-size:12px}</style></head><body><header><b>Bank Timeline v3</b><br><button onclick="go()">Reload and record</button><button onclick="copyReport()">Copy report</button><span id="st">ready</span></header><iframe id="app"></iframe><pre id="out">ready</pre><script>
var app=document.getElementById('app'),out=document.getElementById('out'),st=document.getElementById('st');var report=null,timer=null,t0=0,last='';
function clean(s){return String(s||'').replace(/\s+/g,' ').trim()}
function visible(e){try{var cs=e.ownerDocument.defaultView.getComputedStyle(e),r=e.getBoundingClientRect();return cs.display!=='none'&&cs.visibility!=='hidden'&&r.width>0&&r.height>0}catch(x){return false}}
function collect(d,p,a,n){a=a||[];n=n||0;if(!d||n>10)return a;a.push({doc:d,path:p,url:(function(){try{return d.location.href}catch(e){return ''}})(),title:d.title||''});try{Array.from(d.querySelectorAll('iframe')).forEach(function(f,i){try{var x=f.contentDocument||(f.contentWindow&&f.contentWindow.document);if(x)collect(x,p+' > iframe'+i,a,n+1)}catch(e){}})}catch(e){}return a}
function target(){var all=collect(document,'root',[],0),best=null,score=-1;all.forEach(function(x){var d=x.doc,s=0;try{if(d.getElementById('bank'))s+=10;if((d.location.href||'').indexOf('pmp-home-single')>=0)s+=10;if(d.querySelector('[data-source-text-reader-level3]'))s+=5}catch(e){}if(s>score){score=s;best=x}});return score>0?best:null}
function snap(){var x=target();if(!x)return{t:Date.now()-t0,ready:false,reason:'no app doc'};var d=x.doc,b=d.getElementById('bank');if(!b)return{t:Date.now()-t0,ready:false,reason:'no bank',url:x.url,title:x.title};var btn=b.querySelector('[data-bank-buttons]'),op=b.querySelector('[data-open-bank="continuous_run"]'),l3=b.querySelector('[data-source-text-reader-level3]'),top=b.querySelector('[data-cr-top-sequence-v1]'),l12=b.querySelector('[data-cr-level1-level2-sequence-v1]'),rt=b.querySelector('[data-run-bank-tools]'),home=b.querySelector('[data-bank-home]'),detail=b.querySelector('[data-bank-detail-wrap]');var text=clean(btn?btn.textContent:'');var ready=!!(btn&&op&&text&&text!=='Loading...');return{t:Date.now()-t0,version:(d.defaultView.PMPMasterBankTabV1&&d.defaultView.PMPMasterBankTabV1.version)||'',url:x.url,title:x.title,buttons_ready:ready,buttons_count:btn?btn.children.length:0,buttons_text:text.slice(0,260),opener:!!op,home_visible:!!home&&visible(home),detail_visible:!!detail&&visible(detail),level3_visible:!!l3&&visible(l3),top_visible:!!top&&visible(top),level1_2_visible:!!l12&&visible(l12),run_tools_visible:!!rt&&visible(rt),watch_hit:(!!l3&&visible(l3)&&!ready)}}
function key(s){return[s.buttons_ready,s.buttons_count,s.opener,s.home_visible,s.detail_visible,s.level3_visible,s.top_visible,s.level1_2_visible,s.run_tools_visible,s.version].join('|')}
function add(s){report.samples.push(s);var k=key(s);if(k!==last){last=k;report.timeline.push(s)}}
function finish(reason){clearInterval(timer);timer=null;report.end_reason=reason;report.final=snap();out.textContent=JSON.stringify(report,null,2);st.textContent=reason}
function go(){clearInterval(timer);last='';t0=Date.now();report={type:'PMP_BANK_TIMELINE_DIAGNOSTIC_V3',at:new Date().toISOString(),samples:[],timeline:[],rule:'record first 8 seconds and stop if Level 3 appears before Bank buttons are ready'};app.src='pmp-current-reload-owner-v27.html?fresh=bank-timeline-v3-'+Date.now()+'#bank';st.textContent='recording';out.textContent='recording';timer=setInterval(function(){var s=snap();add(s);if(s.watch_hit)return finish('stopped on early Level 3 before bank buttons');if(Date.now()-t0>8000)return finish('done')},75)}
function copyReport(){if(!report){out.textContent='No report yet';return}navigator.clipboard.writeText(JSON.stringify(report,null,2)).then(function(){st.textContent='copied'},function(){st.textContent='copy failed; select report'})}
go();
</script></body></html>

ew,cs=w.getComputedStyle(e),r=e.getBoundingClientRect();return cs.display!=='none'&&cs.visibility!=='hidden'&&Number(cs.opacity)!==0&&r.width>0&&r.height>0&&r.bottom>0&&r.right>0&&r.top<(w.innerHeight||0)&&r.left<(w.innerWidth||0)&&!e.classList.contains('hidden')}catch(x){return false}}function docs(d,a,n){a=a||[];n=n||0;if(!d||n>10)return a;try{a.push(d);d.querySelectorAll('iframe,frame').forEach(f=>{try{let x=f.contentDocument||(f.contentWindow&&f.contentWindow.document);if(x)docs(x,a,n+1)}catch(e){}})}catch(e){}return a}function best(){let b=null,s=-1;docs(document).forEach(d=>{let v=0;try{if(d.getElementById('bank'))v+=100;if(d.querySelector('[data-bank-buttons]'))v+=40;if(/pmp-home-single/i.test(String(d.location.href)))v+=20}catch(e){}if(v>s){s=v;b=d}});return s>0?b:null}function lev(b,sel){let a=Array.from(b.querySelectorAll(sel));return a.filter(x=>vis(x)&&!(x.closest('[data-bank-detail-wrap]')&&x.closest('[data-run-bank-tools]')&&x.closest('[data-cr-level-stack]'))).map(x=>({tag:x.tagName.toLowerCase(),text:clean(x.textContent).slice(0,120),guard_hidden:x.hasAttribute('data-cr-level-containment-hidden')}))}function state(){let d=best();if(!d)return{app:false};let b=d.getElementById('bank');if(!b)return{app:true,bank:false,url:String(d.location.href)};let bb=b.querySelector('[data-bank-buttons]'),openers=bb?bb.querySelectorAll('[data-open-bank]').length:0,text=clean(b.textContent);let loading=/Loading\.{0,3}|Router loading|Master Bank Inventory loading/i.test(text);let ready=!!(bb&&vis(bb)&&openers>=10&&!loading);let escaped=[].concat(lev(b,'[data-source-text-reader-level3]'),lev(b,'[data-source-reference-gate-level4]'),lev(b,'[data-source-reference-gate-level4b]'));return{app:true,bank:true,url:String(d.location.href),text:text.slice(0,220),loading_shell_visible:loading,bank_buttons_visible:!!(bb&&vis(bb)),bank_buttons_count:openers,real_bank_ready:ready,escaped_level3plus:escaped,master_bank_version:(d.defaultView.PMPMasterBankTabV1&&d.defaultView.PMPMaste

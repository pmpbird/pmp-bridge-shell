{cache:'no-store'});if(r.ok){var j=await r.json();j._path=a[i];return j}}catch(e){}}return{current_app:{path:'pmp-current-reload-owner-v28.html',cache_key:K},_path:'fallback'}}async function run(){msg.textContent='Opening current path...';var j=await m(),c=j.current_app||{},h=okh(location.hash)?location.hash:'#control',u=clean(c.path)+'?fresh='+K+'-'+encodeURIComponent(c.cache_key||j.updated_at||K)+'-'+Date.now()+h;receipt={type:'RG21_RUN',version:K,at:new Date().toISOString(),target:clean(c.path),map_path:j._path,launch_url:u};try{localStorage.setItem('pmp_route_guardian_v21_receipt',JSON.stringify(receipt,null,2))}catch(e){}out.textContent=JSON.stringify(receipt,null,2);try{(window.top||window).location.href=u}catch(e){location.href=u}}btn.onclick=function(e){if(e)e.preventDefault();run();return false};btn.addEventListener('touchend',function(e){if(e)e.preventDefault();run()},false);copy.onclick=function(){out.style.display='block';try{navigator.clipboard.writeText(JSON.stringify(receipt,null,2))}catch(e){}};</script></body></html>

ument.getElementById('msg');var btn=document.getElementById('openBtn');var copy=document.getElementById('copyBtn');var show=document.getElementById('showBtn');var out=document.getElementById('report');var receipt={type:'RG21_READY',version:K,at:new Date().toISOString()};function okh(h){h=String(h||'');return h=='#world'||h=='#bridge'||h=='#library'||h=='#workshop'||h=='#control'||h=='#bank'}function clean(p){p=String(p||'pmp-current-reload-owner-v29.html');while(p.charAt(0)=='/')p=p.slice(1);if(p.indexOf('..')>-1)return'pmp-current-reload-owner-v29.html';if(p.slice(-5)!='.html')return'pmp-current-reload-owner-v29.html';return p}async function readMap(){var names=['pmp-current-map-v11.json','pmp-current-map-v10.json'];for(var i=0;i<names.length;i++){try{var r=await fetch(names[i]+'?rg21='+Date.now(),{cache:'no-store'});if(r.ok){var j=await r.json();j._path=names[i];return j}}catch(e){}}return{current_app:{path:'pmp-current-reload-owner-v29.html',cache_key:K},_path:'fallback'}}async function run(){msg.textContent='Opening current path...';var j=await readMap();var c=j.current_app||{};var h=okh(location.hash)?location.hash:'#control';var u=clean(c.path)+'?fresh='+K+'-'+encodeURIComponent(c.cache_key||j.updated_at||K)+'-'+Date.now()+h;receipt={type:'RG21_RUN',version:K,at:new Date().toISOString(),target:clean(c.path),map_path:j._path,launch_url:u};try{localStorage.setItem('pmp_route_guardian_v21_receipt',JSON.stringify(receipt,null,2))}catch(e){}out.textContent=JSON.stringify(receipt,null,2);try{(window.top||window).location.href=u}catch(e){location.href=u}}btn.onclick=function(e){if(e)e.preventDefault();run();return false};copy.onclick=function(){out.style.display='block';try{navigator.clipboard.writeText(JSON.stringify(receipt,null,2))}catch(e){}};show.onclick=function(){out.style.display=out.style.display=='block'?'none':'block'};</script></body></html>

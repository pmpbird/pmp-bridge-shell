<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f3ded4"><title>Historic Guardian v19</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f3ded4;color:#07101c;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:18px}.card{max-width:620px;background:#fff;border:3px solid #07101c;border-radius:26px;padding:18px;text-align:center}button{width:100%;border:2px solid #07101c;border-radius:14px;background:#acd1fb;padding:12px;font:inherit;font-weight:950}pre{white-space:pre-wrap;text-align:left;background:#102033;color:#eaffef;border-radius:14px;padding:10px}</style></head><body><div class="card"><h1>Historic Guardian v19</h1><p>This bookmark cannot launch its old route. It forwards through Current Map.</p><button id="go">Open Current App</button><pre id="evidence">Loading Current Map…</pre></div><script src="pmp-current-route-resolver-v1.js"></script><script>'use strict';const resolver=window.PMPCurrentRouteResolver,box=document.getElementById('evidence');let state=null;async function load(){if(state)return state;if(!resolver)throw new Error('resolver unavailable');let loaded=await resolver.load(),self=resolver.resolve(loaded.map,'historic_routes.guardian_v19'),current=resolver.resolve(loaded.map,'current_app');state={loaded,self,current};box.textContent=JSON.stringify({type:'PMP_HISTORIC_ROUTE_DELEGATE_V1',status:'HISTORIC_DELEGATE',self_role:self.role,self_path:self.path,current_role:current.role,current_path:current.path,map_path:current.map_path,map_version:current.map_version,route_epoch:current.route_epoch,old_route_execution:false,at:new Date().toISOString()},null,2);return state}async function go(){try{let s=await load(),h=resolver.normalizeHash(location.hash||'#control',s.loaded.map),url=resolver.buildUrl(s.current,{from:'historic-guardian-v19',fresh:'a002-p6-'+s.current.route_epoch+'-'+Date.now(),map_version:s.current.map_version,route_epoch:s.current.route_epoch},h);location.replace(url)}catch(e){box.textContent=JSON.stringify(resolver?resolver.diagnostic(e,'historic_guardian_v19'):String(e),null,2)}}document.getElementById('go').onclick=go;load().then(()=>setTimeout(go,450)).catch(e=>box.textContent=JSON.stringify(resolver?resolver.diagnostic(e,'historic_guardian_v19_boot'):String(e),null,2));</script></body></html>

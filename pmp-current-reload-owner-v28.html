  let a=r.repo_file_classification.ACTIVE_CURRENT_APP||[];

  if(Array.isArray(r.slots)){let id=('active_current_app_'+path).toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'');if(!r.slots.some(x=>x&&x.id===id))r.slots=r.slots.concat([{id,bucket:'ACTIVE_CURRENT_APP',owner:path==='pmp-active-path-discovery-zip-export-v2.js'?'Active Path Discovery ZIP Exporter':(path==='pmp-current-path-stamp-v1.js'?'Current Path Stamp':'Active Path File Owner'),parent:'active_path_atlas',selectors:[],files:[path],policy:path==='pmp-active-path-discovery-zip-export-v2.js'?'Support proof exporter only. Not route authority.':(path==='pmp-current-path-stamp-v1.js'?'Control Room footer only. Not a top card. Not route authority.':'active path alignment')}]);}

}

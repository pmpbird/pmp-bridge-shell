<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#52b5df"><title>Repo Dropdown Test v6</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#52b5df;color:#101827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}#app{position:fixed;inset:0;width:100%;height:100%;border:0;background:#52b5df}#gate{position:fixed;inset:0;display:grid;place-items:center;background:#52b5df;padding:18px;z-index:10;overflow:auto;font-weight:950;text-align:center}#card{width:min(760px,100%);background:#46a9d3;border:3px solid #07101c;border-radius:28px;padding:18px;box-shadow:0 10px 24px #0003}.top{display:flex;justify-content:flex-end}.tiny{width:auto;border:2px solid #07101c;border-radius:999px;background:#a1fcfd;color:#101827;padding:6px 12px;font-size:12px;font-weight:950}h1{font-size:31px;margin:8px 0}.badge{display:inline-block;background:#a1fcfd;border:2px solid #07101c;border-radius:999px;padding:6px 10px;font-size:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}@media(max-width:680px){.grid{grid-template-columns:1fr}}button{width:100%;border:0;border-radius:16px;background:#a1fcfd;color:#101827;font:inherit;font-weight:950;padding:13px;box-shadow:0 8px 18px #0002}.dark{background:#172234;color:#eef4fb;border:1px solid #25354a}.pill{display:inline-block;background:#172234;color:#eef4fb;border:1px solid #25354a;border-radius:999px;padding:7px 10px;font-size:12px;font-weight:900;margin:4px}.ok{background:#123024;color:#d8ffe2}.bad{background:#351414;color:#ffd1d1}.pass #card{border-color:#0b3519}.fail #card{border-color:#7d3333;background:#7b2f2f;color:#fff}.drop{display:none;margin-top:10px;background:#0c141e;color:#eef4fb;border:2px solid #a1fcfd;border-radius:18px;padding:10px;text-align:left}.drop.open{display:block}.pre{max-height:32vh;overflow:auto;white-space:pre-wrap;font:12px/1.35 ui-monospace,Menlo,monospace}.residentNative{display:none;margin-top:10px;background:transparent;border:0;padding:0;text-align:left}.residentNative.open{display:block}.residentFrame{width:100%;height:min(78vh,560px);border:0;border-radius:20px;background:transparent}.loaded #gate,.loaded .drop,.loaded .residentNative{display:none!important}</style></head><body><iframe id="app" title="PMP Current App"></iframe><div id="gate"><div id="card"><div class="top"><button id="resident" class="tiny">Resident</button></div><div class="badge">ROUTE GUARDIAN</div><h1 id="ttl">Route Guardian</h1><p id="msg">Resident opens in native drawer shape. Route Guardian stays visible. Open World is the only World path.</p><div id="chips"></div><div class="grid"><button id="primary">Check Route</button><button id="copy" class="dark">Copy Report</button><button id="show" class="dark">Show / Hide Report</button><button id="repo" class="dark">Repo Index</button></div><div id="residentBox" class="residentNative"><iframe id="residentFrame" class="residentFrame" title="Resident dropdown"></iframe></div><pre id="report" class="drop pre">No report yet.</pre><div id="repoBox" class="drop"><div class="grid"><button id="scanRepo">Scan Repo Index</button><button id="copyRepo" class="dark">Copy Repo Report</button></div><div id="repoResult">Repo Index is compact here.</div><pre id="repoJson" class="pre" style="display:none"></pre></div></div></div><script src="pmp-route-guardian-v1.js?fresh=repodrop-test-v6-native-container"></script><script>const MAP='pmp-current-map.json',BASE='pmp-home-single-v6.html';let rep=null,repoRep=null,passed=false,world=false;const F=app,G=gate,C=chips,T=ttl,M=msg,P=primary,R=report,RB=repoBox,RJ=repoJson,RR=repoResult,RES=residentBox,RESF=residentFrame;function chip(s,ok){return'<span class="pill '+(ok?'ok':'bad')+'">'+String(s).replace(/[<>&]/g,m=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[m]))+'</span>'}function set(a,b,k){document.body.classList.remove('pass','fail','loaded');if(k)document.body.classList.add(k);G.style.display='grid';T.textContent=a;M.textContent=b}function closeDrops(except){if(except!=='resident')RES.classList.remove('open');if(except!=='report')R.classList.remove('open');if(except!=='repo')RB.classList.remove('open')}function norm(x){try{if(x.current_surface&&x.current_surface.file==='pmp-app-current-repodrop-test-v6.html'){x.current_surface.approved_support_test_surface=true;let r=(x.stale_shell_risk&&x.stale_shell_risk.risks)||[];if(r.length===1&&/not the expected entry/.test(r[0]))x.stale_shell_risk={risk_count:0,risks:[],likely_stale_shell:false,support_test_surface_note:'v6 native-container test surface approved inside test shell'}}}catch(e){}return x}async function text(p){let r=await fetch(p+'?fresh='+Date.now(),{cache:'no-store'}),t=await r.text();if(!r.ok)throw Error(p+' '+r.status);return t}async function json(p){return JSON.parse(await text(p))}async function currentSrc(hash){let m=await json(MAP).catch(()=>({current_app:{path:BASE,cache_key:'fallback'}}));let c=m.current_app||{};return (c.path||BASE)+'?fresh=v6native-'+encodeURIComponent(c.cache_key||Date.now())+'-'+Date.now()+(hash||'#world')}function render(x){let m=x.current_map_assessment||{},i=x.current_inner_assessment||{},risk=(x.stale_shell_risk||{}).risk_count||0;C.innerHTML=chip('map '+(m.current_path_matches_expected?'ok':'check'),!!m.current_path_matches_expected)+chip('base '+(i.loads_base_app?'ok':'check'),!!i.loads_base_app)+chip('bug '+(i.routes_bug_memory_clean?'ok':'check'),!!i.routes_bug_memory_clean)+chip('risk '+risk,risk===0)}async function check(){set('Route Guardian','Checking current app route...',null);P.textContent='Checking...';try{rep=norm(await PMPRouteGuardianV1.buildReport({store:false}));R.textContent=JSON.stringify(rep,null,2);render(rep);passed=String(rep.verdict||'').startsWith('PASS')&&((rep.stale_shell_risk||{}).risk_count||0)===0;if(passed){set('Route Guardian Passed','Current route is clean. Open World is now available.','pass');P.textContent='Open World'}else{set('Route Guardian Blocked',rep.resident_summary||'Route risk found.','fail');P.textContent='Check Route'}}catch(e){rep={type:'V6_NATIVE_CONTAINER_ERROR',error:String(e.message||e),built_at:new Date().toISOString()};R.textContent=JSON.stringify(rep,null,2);set('Route Guardian Error',rep.error,'fail');P.textContent='Check Route'}}function toggleResident(){closeDrops('resident');if(RES.classList.toggle('open'))RESF.src='pmp-resident-route-guardian-surface-v1.html?compact=1&native=1&fresh='+Date.now()}window.addEventListener('message',e=>{if(e.data&&e.data.type==='PMP_RESIDENT_SURFACE_CLOSE')RES.classList.remove('open')});async function openWorld(){if(!passed){set('Route Not Passed','Run Check Route first. Resident can still open, but World cannot.','fail');P.textContent='Check Route';return}world=true;set('Opening World','Route Guardian passed. Opening World now.','pass');F.src=await currentSrc('#world');F.onload=()=>setTimeout(()=>document.body.classList.add('loaded'),550)}async function copyReport(){if(!rep)await check();try{await navigator.clipboard.writeText(JSON.stringify(rep,null,2));set('Report Copied',passed?'Report copied. Open World is still available.':'Report copied.','pass');P.textContent=passed?'Open World':'Check Route'}catch(e){closeDrops('report');R.classList.add('open')}}async function scan(){RR.innerHTML=chip('scanning',true);let proofs=['control-pack/receipts/pmp-final-installed-stable-pass-2026-05-13.md','control-pack/receipts/pmp-control-room-route-guardian-cleanup-pass-2026-05-13.md','control-pack/decisions/pmp-route-guardian-repo-index-routing-only-decision-2026-05-13.md','control-pack/receipts/pmp-route-guardian-repo-index-v107-pass-2026-05-14.md'];async function chk(a){let out=[];for(let p of [...new Set(a.filter(Boolean))]){try{let t=await text(p);out.push({path:p,ok:true,size:t.length})}catch(e){out.push({path:p,ok:false,error:String(e.message||e)})}}let miss=out.filter(x=>!x.ok).map(x=>x.path);return{required_count:out.length,ok_count:out.filter(x=>x.ok).length,missing_count:miss.length,missing_paths:miss,checks:out}}try{let m=await json(MAP),cur=m.current_app||{},fb=m.fallback_app||{},g=PMPRouteGuardianV1||{},e=g.expected||{};let active=await chk(['pmp-app-current.html',MAP,'pmp-route-guardian-v1.js',e.currentInner,cur.path,fb.path,BASE,'bug-memory-current-clean-v1.html','pmp-route-guardian-action-v2.html','pmp-control-room-cleanup-v1.js','pmp-resident-route-guardian-surface-v1.html']);let receipt=await chk(proofs);let agree=cur.path===e.currentInner&&fb.path===e.currentInner;let warn=[];if(!agree)warn.push('Map and guardian disagree.');if(active.missing_count)warn.push('Active route files missing.');if(receipt.missing_count)warn.push('Proof files missing.');let ok=agree&&!warn.length&&!active.missing_count&&!receipt.missing_count;repoRep={type:'PMP_ROUTE_GUARDIAN_REPO_DROPDOWN_REPORT',version:'1.0.2-repodrop-test-v6-native-container',repo_index_verdict:ok?'PASS_REPO_INDEX_DROPDOWN_ROUTING_TRUTH':'WARNING_REPO_INDEX_DROPDOWN_NEEDS_REVIEW',built_at:new Date().toISOString(),deletion_permission:false,archive_permission:false,auto_promotion_permission:false,current_route:{agreement:agree,map_current_path:cur.path||null,map_fallback_path:fb.path||null,route_guardian_version:g.version||null,route_guardian_expected_currentInner:e.currentInner||null},warnings:warn,active_file_summary:active,proof_receipt_summary:receipt};RJ.textContent=JSON.stringify(repoRep,null,2);RR.innerHTML=chip(repoRep.repo_index_verdict,ok)+chip('agreement '+(agree?'ok':'bad'),agree)+chip('warnings '+warn.length,!warn.length)+chip('active '+active.ok_count+'/'+active.required_count,!active.missing_count)+chip('proofs '+receipt.ok_count+'/'+receipt.required_count,!receipt.missing_count)}catch(e){repoRep={type:'REPO_DROPDOWN_ERROR',error:String(e.message||e)};RJ.textContent=JSON.stringify(repoRep,null,2);RR.innerHTML=chip('Repo Index error',false)}}primary.onclick=()=>passed&&!world?openWorld():passed&&world?document.body.classList.add('loaded'):check();resident.onclick=toggleResident;copy.onclick=copyReport;show.onclick=()=>{closeDrops('report');R.classList.toggle('open')};repo.onclick=()=>{closeDrops('repo');RB.classList.toggle('open')};scanRepo.onclick=scan;copyRepo.onclick=async()=>{if(!repoRep)await scan();try{await navigator.clipboard.writeText(JSON.stringify(repoRep,null,2));RR.innerHTML+=chip('copied',true)}catch(e){RJ.style.display='block';RR.innerHTML+=chip('copy failed',false)}};</script></body></html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Route Guardian">
<meta name="theme-color" content="#f6d9cf">
<title>Route Guardian v9</title>
<style>
:root{--bg:#f6d9cf;--card:#fff;--blue:#a9cdf5;--ink:#081121;--dark:#142033;--line:#05070b}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%;touch-action:manipulation}
body{display:flex;align-items:center;justify-content:center;padding:18px;box-sizing:border-box}
.card{width:min(760px,100%);background:var(--card);border:3px solid var(--line);border-radius:32px;padding:26px 28px 30px;box-sizing:border-box;box-shadow:0 16px 34px rgba(0,0,0,.22);position:relative}
.pill{position:absolute;top:30px;background:var(--blue);border:3px solid var(--line);border-radius:18px;padding:9px 18px;font-weight:900;box-shadow:0 8px 14px rgba(0,0,0,.18);letter-spacing:.04em}.left{left:28px}.right{right:28px}
h1{font-size:50px;line-height:1;margin:74px 0 20px;text-align:center;font-weight:950;letter-spacing:-.03em}.sub{font-size:24px;text-align:center;font-weight:850;margin-bottom:24px}.btn{width:100%;border:3px solid var(--line);border-radius:22px;background:var(--blue);color:var(--ink);font-size:28px;font-weight:950;padding:22px 16px;margin:14px 0;box-shadow:0 6px 12px rgba(0,0,0,.16)}.btn.dark{background:var(--dark);color:#fff}.report{display:none;white-space:pre-wrap;background:#0f1b2d;color:#dbeafe;border-radius:18px;padding:14px;margin-top:14px;font-size:14px;line-height:1.35}.status{white-space:pre-wrap;background:#123024;color:#d9ffe8;border:2px solid #8ee6aa;border-radius:18px;padding:12px;margin-top:12px;font-size:15px;font-weight:700}
</style>
</head>
<body>
<main class="card">
  <div class="pill left">ROUTE GUARDIAN v9</div><div class="pill right">Resident</div>
  <h1>Route Guardian</h1>
  <div class="sub">Real v9 route. Native contrast v2 proof.</div>
  <button class="btn" id="checkBtn">Check Route</button>
  <button class="btn dark" id="copyBtn">Copy Report</button>
  <button class="btn dark" id="showBtn">Show / Hide Report</button>
  <div class="status" id="status">Route Guardian starting. It will route to current app by itself.</div>
  <pre class="report" id="report"></pre>
</main>
<script>
(()=>{
  const POINTER='pmp-latest.json';
  const FALLBACK='pmp-clean-v22.html';
  const BLOCKED=new Set(['route-guardian-v9.html','pmp-route-guardian-v9.html','index.html','pmp-home.html','pmp-clean-v21.html']);
  const S=document.getElementById('status'),R=document.getElementById('report');
  let lastReport=null;
  function clean(t){t=String(t||'').trim().replace(/^\.\//,'');if(!t||/[\s<>"']/.test(t)||/^https?:\/\//i.test(t)||!t.endsWith('.html'))return FALLBACK;if(BLOCKED.has(t))return FALLBACK;return t}
  function say(x){S.textContent=x}
  async function latest(){try{const r=await fetch(POINTER+'?rg='+Date.now(),{cache:'no-store'});const j=await r.json();return clean(j.latest||j.last_good||FALLBACK)}catch(e){try{return clean(localStorage.getItem('pmp_route_guardian_last_good')||FALLBACK)}catch(_){return FALLBACK}}}
  function receipt(target,reason,state){const o={type:'PMP_ROUTE_GUARDIAN_V9_AUTO_ROUTE_RECEIPT',at:new Date().toISOString(),target,reason,state,safe_claim:'Route Guardian v9 selected current target and routed without user pressing update.',do_not_claim:'Route routing is not proof that private buttons, hooks, or Medium wiring are validated.'};try{localStorage.setItem('pmp_route_guardian_v9_receipt',JSON.stringify(o));localStorage.setItem('pmp_route_guardian_last_good',target)}catch(e){}lastReport=o;R.textContent=JSON.stringify(o,null,2);return o}
  async function route(reason){say('Checking current route...');const target=await latest();receipt(target,reason||'auto-open','routing');say('Current target found:\n'+target+'\nOpening current app now.');setTimeout(()=>{location.replace(target+'?fresh=route-guardian-v9-'+encodeURIComponent(reason||'auto')+'-'+Date.now()+'#control')},450)}
  async function copy(){if(!lastReport)await latest().then(t=>receipt(t,'copy-report','report-only'));const text=JSON.stringify(lastReport,null,2);try{await navigator.clipboard.writeText(text);say('Route report copied.')}catch(e){R.style.display='block';say('Copy blocked. Report is visible.')}}
  document.getElementById('checkBtn').onclick=()=>route('check-button');
  document.getElementById('copyBtn').onclick=copy;
  document.getElementById('showBtn').onclick=()=>{R.style.display=R.style.display==='block'?'none':'block'};
  setTimeout(()=>route('auto-open'),700);
})();
</script>
</body>
</html>

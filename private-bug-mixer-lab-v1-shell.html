<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#52b5df"><title>Bug Mixer Shell</title><script>const COLOR_KEY='pmp_single_colors_v6',PREV_KEY='pmp_single_colors_v5',READ_KEY='pmp_readability_layer_v6';const DEFAULT_COLORS={accent:'#a1fcfd',background:'#52b5df',card:'#46a9d3',line:'#ffffff'};function jj(k){try{return JSON.parse(localStorage.getItem(k)||'{}')}catch(e){return{}}}function activeColors(){return{...DEFAULT_COLORS,...jj(PREV_KEY),...jj(COLOR_KEY)}}function bootTheme(){let c=activeColors();let s=document.createElement('style');s.id='nativePmpTheme';s.textContent=':root{--a:'+c.accent+';--bg:'+c.background+';--floor:'+c.background+';--card:'+c.card+';--line:'+c.line+';--text:#101827;--muted:#234a5d;--panel:#172234;--input:#0c141e;--buttonText:#101827;--shadow:0 12px 28px #0002;--tabBg:#0f1620;--noteBg:#123024}html,body{background:'+c.background+'!important}';document.head.appendChild(s);document.querySelector('meta[name="theme-color"]').setAttribute('content',c.background)}bootTheme();</script><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--floor)!important;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text)}iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:var(--floor)}.float,.back{position:fixed;top:calc(10px + env(safe-area-inset-top));z-index:50;border:var(--borderWidth,2px) solid var(--line);background:var(--a);color:var(--buttonText);border-radius:999px;padding:8px 12px;font-weight:950;font-size:12px;box-shadow:var(--shadow);text-decoration:none}.left{left:10px}.right{right:10px}.back{left:50%;transform:translateX(-50%);font-size:12px;padding:8px 14px}.drawer{position:fixed;right:10px;left:10px;top:calc(54px + env(safe-area-inset-top));z-index:60;display:none;background:var(--panel);color:#eef4fb;border:2px solid var(--a);border-radius:20px;padding:12px;box-shadow:0 8px 28px #0007;max-height:78vh;overflow:auto}.drawer h2{margin:0 0 9px;color:#eef4fb}.drawer p{color:#eef4fb}.mini{border:1px solid var(--line);background:var(--panel);color:#eef4fb;border-radius:14px;padding:11px;font:inherit;font-weight:950;width:100%;margin-top:7px;box-shadow:var(--miniShadow,0 3px 12px #0001)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.note{background:var(--noteBg,#123024);border:var(--borderWidth,2px) solid var(--line);color:#d8ffe2;border-radius:22px;padding:13px;white-space:pre-wrap;overflow-wrap:anywhere}.reply{background:var(--noteBg,#123024);border:var(--borderWidth,2px) solid var(--line);color:#d8ffe2;border-radius:18px;padding:12px;margin-top:8px;white-space:pre-wrap;font-size:15px;line-height:1.35}textarea{width:100%;border:1px solid var(--line);border-radius:14px;background:var(--input);color:#eef4fb;padding:11px;font:inherit;margin-top:7px;min-height:92px;font-family:ui-monospace,Menlo,monospace;font-size:13px}@media(max-width:700px){.grid,.grid3{grid-template-columns:1fr}}</style></head><body><iframe id="mixer" src="private-bug-mixer-lab-v1.html?fresh=bug-mixer-normal-drawers-v1"></iframe><button class="float left" onclick="toggleDrawer('launcher')">Launcher</button><a class="back" href="bug-memory-current-clean-v1.html?fresh=back-from-bug-mixer-normal-drawers-v1">← Bug Memory</a><button class="float right" onclick="toggleDrawer('resident')">Resident</button><div id="launcher" class="drawer"><h2>Launcher</h2><div class="note">Bug Mixer active.</div><div class="grid"><button class="mini" onclick="copyTruth()">Copy Truth</button><button class="mini" onclick="reloadApp()">Reload</button><button class="mini" onclick="useLastGood()">Last Good</button><button class="mini" onclick="toggleBackend()">Backend</button><button class="mini" onclick="location.href='pmp-app-current.html#world'">PMP Current</button><button class="mini" onclick="toggleDrawer('launcher')">Close</button></div><div id="backendBox" class="note" style="display:none;margin-top:8px">Backend controls are external on this tool page. Bug Mixer stays private until you save to Notes.</div></div><div id="resident" class="drawer"><h2>Resident</h2><p>Talk normally. Bug Mixer tools stay private until you save to Notes.</p><div class="grid"><button class="mini" onclick="residentChat()">Chat</button><button class="mini" onclick="residentTools()">Tools</button></div><textarea id="ask" placeholder="Tell Resident what to do next."></textarea><div class="grid"><button class="mini" onclick="residentRun()">Run</button><button class="mini" onclick="toggleDrawer('resident')">Close</button></div><textarea id="workBox" placeholder="Paste bug catalog, prediction, notes, or ChatGPT answer here."></textarea><div class="grid3"><button class="mini" onclick="packetRequest()">Packet Request</button><button class="mini" onclick="savePacket()">Save Packet</button><button class="mini" onclick="pipeline()">Pipeline</button><button class="mini" onclick="showWork()">Show Work</button><button class="mini" onclick="copyWork()">Copy Work</button><button class="mini" onclick="residentHelp()">Help Me</button><button class="mini" onclick="archiveResidentChat()">Archive Chat</button><button class="mini" onclick="clearResident()">Reset Chat</button><button class="mini" onclick="copyResidentPrompt()">Copy Prompt</button></div><div id="residentReply" class="reply">Bug Mixer ready.</div><div id="residentWork" class="reply" style="display:none"></div></div><script>function toggleDrawer(id){let el=document.getElementById(id);el.style.display=el.style.display==='block'?'none':'block'}async function copyText(t){try{await navigator.clipboard.writeText(t)}catch(e){let ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove()}}function currentTruth(){return {type:'PMP_BUG_MIXER_SHELL_TRUTH',built_at:new Date().toISOString(),page:'private-bug-mixer-lab-v1-shell.html',tool:'Bug Mixer',privacy:'temporary private tool page; permanent storage goes to Notes',theme:'native PMP theme variables',drawer_set:'normal PMP Launcher and Resident tool names'}}async function copyTruth(){await copyText(JSON.stringify(currentTruth(),null,2));reply('Truth copied.')}function reloadApp(){location.reload()}function useLastGood(){location.href='bug-memory-current-clean-v1.html?fresh=last-good-from-bug-mixer'}function toggleBackend(){let b=document.getElementById('backendBox');b.style.display=b.style.display==='none'?'block':'none'}function reply(t){document.getElementById('residentReply').textContent=t}function residentChat(){reply('Chat mode ready.')}function residentTools(){reply('Tools mode ready. Use Load Bug Catalog, Mix Bugs, Save to Notes, Show Work, or Copy Work.')}function residentRun(){let q=(document.getElementById('ask').value||'').trim();reply(q?'Resident heard: '+q:'Tell Resident what to do next.')}function clearResident(){document.getElementById('ask').value='';document.getElementById('workBox').value='';document.getElementById('residentWork').style.display='none';reply('Bug Mixer ready.')}async function copyResidentPrompt(){await copyText('Run a Bug Mixer safety check. Verify private loading only, no private data saved to GitHub, prediction remains untested, and Notes save path is used for permanent storage. Report in Plain Brain language.');reply('Resident prompt copied.')}function packetRequest(){const p={type:'PMP_BUG_MIXER_PACKET_REQUEST',request:'Paste bug catalog JSON or bug prediction JSON for Resident to inspect.',saved_at:new Date().toISOString()};showWorkObject(p);reply('Packet request built under Show Work.')}function savePacket(){const raw=(document.getElementById('workBox').value||'').trim();if(!raw){reply('Paste a packet first.');return}localStorage.setItem('pmp_bug_mixer_resident_packet_v1',raw);reply('Packet saved in this browser session.')}function pipeline(){const p={type:'PMP_BUG_MIXER_PIPELINE',steps:['load private bug catalog','choose two bugs','mix prediction','treat prediction as untested','save to Notes only'],saved_at:new Date().toISOString()};showWorkObject(p);reply('Pipeline shown under Show Work.')}function showWork(){const raw=(document.getElementById('workBox').value||'').trim();showWorkObject(raw?{type:'PMP_BUG_MIXER_WORK',input:raw,saved_at:new Date().toISOString()}:currentTruth());reply('Work shown.')}async function copyWork(){let w=document.getElementById('residentWork').textContent||JSON.stringify(currentTruth(),null,2);await copyText(w);reply('Work copied.')}function residentHelp(){reply('Use Bug Mixer to load a private catalog, mix two bugs, and save only the prediction to Notes. Do not upload private bug memory to GitHub.')}function archiveResidentChat(){let data={ask:document.getElementById('ask').value,work:document.getElementById('workBox').value,reply:document.getElementById('residentReply').textContent,saved_at:new Date().toISOString()};localStorage.setItem('pmp_bug_mixer_resident_archive_v1',JSON.stringify(data));reply('Resident chat archived in this browser session.')}function showWorkObject(o){let box=document.getElementById('residentWork');box.style.display='block';box.textContent=typeof o==='string'?o:JSON.stringify(o,null,2)}function patchMixerTheme(){try{const f=document.getElementById('mixer'),d=f.contentDocument||f.contentWindow.document;if(!d)return;let s=d.getElementById('pmpNativeMixerPatch');if(!s){s=d.createElement('style');s.id='pmpNativeMixerPatch';d.head.appendChild(s)}s.textContent=':root{--bg:var(--floor,#52b5df)!important;--card:var(--panel,#172234)!important;--ink:#eef4fb!important;--muted:#d8e8ef!important;--accent:var(--a,#a1fcfd)!important;--line:var(--line,#ffffff)!important}.topbar,.pill{display:none!important}body{padding-top:calc(env(safe-area-inset-top) + 58px)!important;background:var(--floor,#52b5df)!important}.card{background:var(--panel,#172234)!important;border:var(--borderWidth,2px) solid var(--line,#fff)!important;box-shadow:var(--shadow,0 12px 28px #0002)!important}button{background:var(--a,#a1fcfd)!important;color:var(--buttonText,#101827)!important}.status{border:var(--borderWidth,2px) solid var(--line,#fff)!important}h1,.sub{color:var(--text,#101827)!important}';}catch(e){}}document.getElementById('mixer').addEventListener('load',()=>{setTimeout(patchMixerTheme,100);setTimeout(patchMixerTheme,600)});setInterval(patchMixerTheme,1000);</script></body></html>

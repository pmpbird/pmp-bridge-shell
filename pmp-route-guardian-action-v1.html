<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PMP Route Action">
<meta name="theme-color" content="#52b5df">
<title>PMP Route Guardian Action</title>
<style>
html,body{margin:0;width:100%;min-height:100%;background:#52b5df;color:#101827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{padding:24px 14px 44px}.card{max-width:760px;margin:0 auto 14px;background:#46a9d3;border:3px solid #07101c;border-radius:28px;padding:18px;box-shadow:0 10px 24px #0003;text-align:center}.badge{display:inline-block;border:2px solid #07101c;border-radius:999px;padding:6px 10px;margin-bottom:10px;font-size:12px;font-weight:950;background:#a1fcfd;color:#101827}h1{font-size:31px;font-weight:950;margin:0 0 8px}.sub{font-size:16px;font-weight:850}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}@media(max-width:680px){.grid{grid-template-columns:1fr}}button{width:100%;border:0;border-radius:16px;background:#a1fcfd;color:#101827;font:inherit;font-weight:950;padding:13px;box-shadow:0 8px 18px #0002}.dark{background:#172234;color:#eef4fb;border:1px solid #25354a}.pass{border-color:#0b3519}.fail{border-color:#7d3333;background:#7b2f2f;color:#fff}.pill{display:inline-block;background:#172234;color:#eef4fb;border:1px solid #25354a;border-radius:999px;padding:7px 10px;font-weight:900;font-size:12px;margin:4px}.ok{background:#123024}.bad{background:#351414}pre{max-width:760px;margin:0 auto;background:#0c141e;color:#eef4fb;border:2px solid #a1fcfd;border-radius:22px;padding:12px;white-space:pre-wrap;font-size:12px;max-height:52vh;overflow:auto}.hidden{display:none!important}
</style>
</head>
<body>
<section id="card" class="card">
  <div class="badge">ROUTE GUARDIAN ACTION</div>
  <h1 id="title">Route Guardian</h1>
  <p id="text" class="sub">Check the current route before continuing.</p>
  <div id="chips"></div>
  <div class="grid">
    <button id="primary">Check Route</button>
    <button id="copy" class="dark">Copy Report</button>
    <button id="show" class="dark">Show / Hide Report</button>
    <button id="back" class="dark">Back to PMP Current</button>
  </div>
</section>
<pre id="report" class="hidden">No report yet.</pre>
<script src="pmp-route-guardian-v1.js?fresh=action-v1"></script>
<script>
const card=document.getElementById('card'),title=document.getElementById('title'),text=document.getElementById('text'),chips=document.getElementById('chips'),primary=document.getElementById('primary'),copy=document.getElementById('copy'),show=document.getElementById('show'),back=document.getElementById('back'),reportBox=document.getElementById('report');
const params=new URLSearchParams(location.search);const action=params.get('action')||'world';let latest=null,passed=false;
function label(){return action==='codeSafety'?'Code Safety':action==='appUpdate'?'Current Check':'World'}
function dest(){if(action==='codeSafety')return 'code-safety-v13.html?from=route-guardian-action&checked='+Date.now();if(action==='appUpdate')return 'pmp-current-inner-cleanbug-v1.html?from=route-guardian-action&fresh='+Date.now()+'#world';return 'pmp-current-inner-cleanbug-v1.html?from=route-guardian-action&fresh='+Date.now()+'#world'}
function state(t,m,k){card.classList.remove('pass','fail');if(k)card.classList.add(k);title.textContent=t;text.textContent=m}
function pill(t,ok){return '<span class="pill '+(ok?'ok':'bad')+'">'+String(t).replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]))+'</span>'}
function paint(r){latest=r;reportBox.textContent=JSON.stringify(r,null,2);const map=r.current_map_assessment||{},inner=r.current_inner_assessment||{},risk=(r.stale_shell_risk||{}).risk_count||0;chips.innerHTML=[pill('map '+(map.current_path_matches_expected?'ok':'check'),!!map.current_path_matches_expected),pill('base '+(inner.loads_base_app?'ok':'check'),!!inner.loads_base_app),pill('bug '+(inner.routes_bug_memory_clean?'ok':'check'),!!inner.routes_bug_memory_clean),pill('risk '+risk,risk===0)].join('')}
async function check(){state('Route Guardian','Checking route before '+label()+'...',null);primary.textContent='Checking...';try{if(!window.PMPRouteGuardianV1)throw new Error('Route Guardian script did not load.');const r=await window.PMPRouteGuardianV1.buildReport({store:false});paint(r);passed=String(r.verdict||'').startsWith('PASS')&&((r.stale_shell_risk||{}).risk_count||0)===0;if(passed){state('Route Guardian Passed','Current route is clean. The same button is now Open '+label()+'.','pass');primary.textContent='Open '+label()}else{state('Route Guardian Blocked','Route problem found. Copy the report before continuing.','fail');primary.textContent=action==='codeSafety'?'Open Code Safety Repair':'Check Route'}}catch(e){passed=false;latest={type:'PMP_ROUTE_GUARDIAN_ACTION_ERROR',built_at:new Date().toISOString(),error:String(e&&e.message||e),action};reportBox.textContent=JSON.stringify(latest,null,2);state('Route Guardian Error',latest.error,'fail');primary.textContent=action==='codeSafety'?'Open Code Safety Repair':'Check Route'}}
function go(){if(passed||action==='codeSafety')location.href=dest();else check()}
primary.onclick=go;copy.onclick=async()=>{if(!latest)await check();try{await navigator.clipboard.writeText(JSON.stringify(latest,null,2));state('Report Copied',passed?'Report copied. Same button continues to '+label()+'.':'Report copied.',passed?'pass':'fail');if(passed)primary.textContent='Open '+label()}catch(e){reportBox.classList.remove('hidden');state('Copy Failed','Select report manually.','fail')}};show.onclick=()=>reportBox.classList.toggle('hidden');back.onclick=()=>{location.href='pmp-app-current.html?from=route-guardian-action&fresh='+Date.now()};
text.textContent='Check the current route before '+label()+'.';
</script>
</body>
</html>

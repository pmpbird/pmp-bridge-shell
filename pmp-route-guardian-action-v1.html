<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#52b5df">
<title>Route Guardian Action Forward</title>
<style>
html,body{margin:0;min-height:100%;background:#52b5df;color:#101827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{display:grid;place-items:center;padding:24px}.card{max-width:760px;background:#46a9d3;border:3px solid #07101c;border-radius:28px;padding:18px;box-shadow:0 10px 24px #0003;text-align:center}.badge{display:inline-block;border:2px solid #07101c;border-radius:999px;padding:6px 10px;margin-bottom:10px;font-size:12px;font-weight:950;background:#a1fcfd}h1{font-size:31px;font-weight:950;margin:0 0 8px}p{font-size:16px;font-weight:850}button{width:100%;border:0;border-radius:16px;background:#a1fcfd;color:#101827;font:inherit;font-weight:950;padding:13px;box-shadow:0 8px 18px #0002}</style>
</head>
<body>
<section class="card">
  <div class="badge">ROUTE GUARDIAN ACTION</div>
  <h1>Opening Current Route Guardian</h1>
  <p>This old action page now forwards to the non-blocking v2 page.</p>
  <button id="go">Open Route Guardian v2</button>
</section>
<script>
function target(){
  const q=new URLSearchParams(location.search);
  q.set('from','action-v1-forward');
  q.set('fresh',Date.now());
  return 'pmp-route-guardian-action-v2.html?'+q.toString();
}
document.getElementById('go').onclick=function(){location.replace(target())};
setTimeout(function(){location.replace(target())},250);
</script>
</body>
</html>

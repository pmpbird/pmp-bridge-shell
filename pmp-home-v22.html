<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>PMP Home v22</title><style id="bootStyle">html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#52b5df}iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#52b5df;opacity:0;transition:opacity .08s linear}</style><script>const COLOR_KEY='pmp_color_settings_v22';function bootColors(){try{return{accent:'#a1fcfd',background:'#52b5df',card:'#46a9d3',line:'#ffffff',...JSON.parse(localStorage.getItem('pmp_color_settings_v20')||'{}'),...JSON.parse(localStorage.getItem('pmp_color_settings_v21')||'{}'),...JSON.parse(localStorage.getItem(COLOR_KEY)||'{}')}}catch(e){return{accent:'#a1fcfd',background:'#52b5df',card:'#46a9d3',line:'#ffffff'}}}function bootApply(){let c=bootColors();document.getElementById('bootStyle').textContent='html,body{margin:0;width:100%;height:100%;overflow:hidden;background:'+c.background+'}iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:'+c.background+';opacity:0;transition:opacity .08s linear}'}document.addEventListener('DOMContentLoaded',bootApply);bootApply();</script></head><body><iframe id="home" src="pmp-home-v20.html?fresh=v22-color-stable"></iframe><script>const HOME=document.getElementById('home');function colorState(){try{return{accent:'#a1fcfd',background:'#52b5df',card:'#46a9d3',line:'#ffffff',...JSON.parse(localStorage.getItem('pmp_color_settings_v20')||'{}'),...JSON.parse(localStorage.getItem('pmp_color_settings_v21')||'{}'),...JSON.parse(localStorage.getItem(COLOR_KEY)||'{}')}}catch(e){return{accent:'#a1fcfd',background:'#52b5df',card:'#46a9d3',line:'#ffffff'}}}function saveColorState(c){localStorage.setItem(COLOR_KEY,JSON.stringify(c));applyColors(true)}function frames(){try{let hw=HOME.contentWindow,hd=HOME.contentDocument||hw.document;let ){}HOME.style.opacity='1'}function removeOldColor(f){try{let a=f.ad.getElementById('colorSettingsV20');if(a)a.remove();let b=f.ad.getElementById('colorSettingsV21');if(b)b.remove()}catch(e){}}function installColorDropdown(f){let d=f.ad,w=f.aw;if(!d||d.getElementById('colorSettingsV22'))return;let deep=[...d.querySelectorAll('button')].find(b=>(b.textContent||'').includes('Deep Resident Intelligence'));if(!deep)return;let c=colorState();let box=d.createElement('div');box.id='colorSettingsV22';box.className='panel';box.style.marginTop='10px';box.innerHTML='<button class="mini" onclick="toggleColorSettingsV22()">Color Settings</button><div id="colorSettingsBodyV22" class="hidden"><p class="sub" style="color:#c9f7d7">Choose the four main app colors.</p><label>Accent color<input id="colorAccentV22" type="color" value="'+c.accent+'"></label><label>Background color<input id="colorBgV22" type="color" value="'+c.background+'"></label><label>Card color<input id="colorCardV22" type="color" value="'+c.card+'"></label><label>Line color<input id="colorLineV22" type="color" value="'+c.line+'"></label><div class="grid"><button class="mini" onclick="saveColorSettingsV22()">Save Colors</button><button class="mini" onclick="resetColorSettingsV22()">Reset Colors</button></div><div id="colorStatusV22" class="note">Color settings ready.</div></div>';deep.parentNode.insertBefore(box,deep);w.toggleColorSettingsV22=function(){let body=d.getElementById('colorSettingsBodyV22');body.classList.toggle('hidden')};w.saveColorSettingsV22=function(){let next={accent:d.getElementById('colorAccentV22').value,background:d.getElementById('colorBgV22').value,card:d.getElementById('colorCardV22').value,line:d.getElementById('colorLineV22').value};saveColorState(next);let s=d.getElementById('colorStatusV22');if(s)s.textContent='Colors saved and applied.'};w.resetColorSettingsV22=function(){localStorage.removeItem(COLOR_KEY);localStorage.removeItem('pmp_color_settings_v21');localStorage.removeItem('pmp_color_settings_v20');let x=colorState();d.getElementById('colorAccentV22').value=x.accent;d.getElementById('colorBgV22').value=x.background;d.getElementById('colorCardV22').value=x.card;d.getElementById('colorLineV22').value=x.line;applyColors(true);let s=d.getElementById('colorStatusV22');if(s)s.textContent='Colors reset.'};for(const id of ['colorAccentV22','colorBgV22','colorCardV22','colorLineV22']){let input=d.getElementById(id);input.addEventListener('input',()=>{let live={accent:d.getElementById('colorAccentV22').value,background:d.getElementById('colorBgV22').value,card:d.getElementById('colorCardV22').value,line:d.getElementById('colorLineV22').value};localStorage.setItem(COLOR_KEY,JSON.stringify(live));applyColors(false)})}}function patchDeepResident(f){let d=f.ad;if(!d)return;let deep=[...d.querySelectorAll('button')].find(b=>(b.textContent||'').includes('Deep Resident Intelligence'));if(deep&&!deep.__v22Return){deep.__v22Return=true;deep.onclick=function(){try{localStorage.setItem('pmp_deep_resident_return_v22',JSON.stringify({return_to:'pmp-home-v22.html#control',label:'Back to Control Room',at:new Date().toISOString()}))}catch(e){}location.href='resident.html?from=pmp-home-v22&return=pmp-home-v22.html%23control'};let sm=deep.querySelector('small');if(sm)sm.textContent='opens deeper intelligence / returns to Control Room'}}function hideBridgeResident(f){try{let strip=[...f.ad.querySelectorAll('#bridge .toolstrip button')];for(const b of strip)if((b.textContent||'').trim()==='Resident')b.style.display='none'}catch(e){}}function patch(){let f=frames();if(!f){applyColors(false);return}hideBridgeResident(f);removeOldColor(f);installColorDropdown(f);patchDeepResident(f);applyColors(false)}HOME.addEventListener('load',()=>{applyColors(false);setTimeout(patch,80);setTimeout(patch,300);setTimeout(patch,800);setTimeout(patch,1800);setTimeout(patch,3500)});setInterval(patch,700);window.addEventListener('message',patch);</script></body></html>

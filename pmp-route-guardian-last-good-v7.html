<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Route Guardian Last Good v7</title><style>body{margin:0;background:#f3ded4;color:#07101c;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:22px}.card{background:#fff;border:3px solid #07101c;border-radius:26px;padding:16px;max-width:650px;margin:auto}.badge{display:inline-block;background:#acd1fb;border:2px solid #07101c;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:950}.btn{display:block;width:100%;box-sizing:border-box;margin:10px 0;border:2px solid #07101c;border-radius:16px;background:#eef4fb;color:#07101c;padding:14px;text-align:left;font:inherit;font-weight:900;text-decoration:none}.cur{background:#dff7e8}.last{background:#fff4d6}.spot{background:#e9ecff}.dark{background:#172234;color:#eef4fb}.status{background:#123024;color:#d8ffe2;white-space:pre-wrap}</style></head><body><div class="card"><span class="badge">ROUTE GUARDIAN LAST GOOD</span><h1>Route Guardian Last Good</h1><p>Clean page. Recovery bank controls live outside this page in the Recovery Shell.</p><a class="btn cur" href="pmp-current-inner-cleanbug-rgcontrols-v7.html#control">Current Before Last Good</a><a id="last" class="btn last" href="pmp-route-guardian-recovery-shell-v3.html?view=pmp-route-guardian-history-ledger-snapshot-v2.html&return=pmp-route-guardian-last-good-v7.html">Last Good<br><small>Open History Ledger inside outer Recovery Shell.</small></a><button id="save" class="btn spot">Save Current Before Last Good<br><small>Save this clean Route Guardian Last Good page.</small></button><a class="btn dark" href="pmp-route-guardian-recovery-shell-v3.html?view=pmp-route-guardian-move-ledger-view-v1.html&return=pmp-route-guardian-last-good-v7.html">Recovery Controls<br><small>Open Saved Spots, Move Ledger, Return, and Make Current.</small></a><div id="status" class="btn status">Ready.</div></div><script>(()=>{const CUR='pmp-route-guardian-last-good-v7.html',SP='pmp_route_guardian_saved_spots_bank_v1',MV='pmp_route_guardian_move_ledger_bank_v1',RET='pmp_route_guardian_newer_move_return_v1';function read(k,d){try{return JSON.parse(localStorage.getItem(k)||'')}catch(e){return d}}function write(k,v){localStorage.setItem(k,JSON.stringify(v))}function move(kind,to){let b=read(MV,{entries:[]});b.entries=Array.isArray(b.entries)?b.entries:[];b.entries.push({id:'move_'+Date.now(),at:new Date().toISOString(),kind,from:CUR,to});b.entries=b.entries.slice(-100);write(MV,b)}last.onclick=()=>{localStorage.setItem(RET,CUR);move('open_last_good_inside_shell','pmp-route-guardian-history-ledger-snapshot-v2.html')};save.onclick=()=>{let b=read(SP,{entries:[]});b.entries=Array.isArray(b.entries)?b.entries:[];b.entries.unshift({id:'spot_'+Date.now(),label:'Saved Clean Route Guardian Last Good',route:CUR,at:new Date().toISOString()});b.entries=b.entries.slice(0,100);write(SP,b);move('save_current_before_last_good',CUR);status.textContent='Saved current clean Route Guardian Last Good page. Recovery controls remain outside in the shell.'};move('enter_clean_route_guardian_last_good',CUR)})();</script></body></html>

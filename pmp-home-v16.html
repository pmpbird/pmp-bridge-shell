<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>PMP Home v16</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#52b5df}iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#52b5df}</style></head><body><iframe id="app" src="pmp-home-v15.html?fresh=v16-reset-conversation"></iframe><script>const F=document.getElementById('app');const CHAT_KEYS=['pmp_resident_chat_thread_v14'];function clearOldResidentChatStorage(){try{for(const k of CHAT_KEYS)localStorage.removeItem(k);for(let i=0;i<localStorage.length;i++){let key=localStorage.key(i);if(key&&key.startsWith('pmp_resident_chat_thread')){localStorage.removeItem(key);i--}}}catch(e){}}function deepest(){try{let w=F.contentWindow,d=F.contentDocument||w.document;let guard=0;while(d&&d.querySelector('iframe')&&guard<5){let inner=d.querySelector('iframe');w=inner.contentWindow;d=inner.contentDocument||w.document;guard++}return{w,d}}catch(e){return null}}function clearResidentInputs(d){try{let ask=d.getElementById('ask');let paste=d.getElementById('paste');if(ask)ask.value='';if(paste&&!paste.value.trim().startsWith('{'))paste.value=''}catch(e){}}function patch(){let obj=deepest();if(!obj)return;let w=obj.w,d=obj.d;if(!w||!d||w.__residentSessionResetV16)return;w.__residentSessionResetV16=true;clearOldResidentChatStorage();clearResidentInputs(d);const oldRun=w.residentRun;if(oldRun){w.residentRun=function(){let result=oldRun();setTimeout(()=>clearResidentInputs(d),50);return result}}try{const oldPlain=w.plain;if(oldPlain){w.plain=function(message,work,next,warning){let out=oldPlain(message,work,next,warning);setTimeout(()=>clearResidentInputs(d),50);return out}}}catch(e){}let p=d.querySelector('#resident p');if(p)p.textContent='Talk normally. This conversation resets when you close the app. Important app memory stays saved.';try{if(w.plain)w.plain('Resident v16 is ready. This conversation will reset when you close the app, but important app memory stays saved.',{kind:'v16_session_conversation_reset',kept:['last_good','Code Safety bank','saved packets','Corpus','Resident lessons','app state'],cleared:['Resident conversation thread','typing box']},'Keep telling me the next thing while this app session is open.')}catch(e){}}window.addEventListener('pagehide',clearOldResidentChatStorage);window.addEventListener('beforeunload',clearOldResidentChatStorage);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')clearOldResidentChatStorage()});F.addEventListener('load',()=>{clearOldResidentChatStorage();setTimeout(patch,700);setTimeout(patch,1800);setTimeout(patch,3500)});setInterval(patch,2500);</script></body></html>

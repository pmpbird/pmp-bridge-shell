<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>PMP Snapshot Test Room v1</title><style>body{margin:0;background:#120f0d;color:#fff7ec;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.top{position:sticky;top:0;z-index:10;background:#1f1712;border-bottom:1px solid #6b4b3e;padding:12px}.card{background:#2a211b;border:1px solid #6b4b3e;border-radius:14px;padding:12px;margin:10px}.row{display:flex;gap:8px;flex-wrap:wrap}button{border:1px solid #d8b58a;background:#fff3de;color:#23160f;border-radius:10px;padding:9px 12px;font-weight:700}pre{white-space:pre-wrap;background:#0c0907;border:1px solid #49372c;border-radius:12px;padding:10px;max-height:38vh;overflow:auto}iframe{width:100%;height:64vh;border:0;background:white;border-top:1px solid #6b4b3e}</style><script src="pmp-page-hidden-state-reveal-contract-v1.js?testroom=1"></script><script src="pmp-page-snapshot-contract-v1.js?testroom=1"></script><script src="pmp-snapshot-verification-gate-v1.js?testroom=1"></script><script src="pmp-snapshot-verification-gate-bridge-v1.js?testroom=1"></script><script src="pmp-reload-perfect-restore-gate-v1.js?testroom=1"></script><script src="pmp-snapshot-visibility-test-harness-v1.js?testroom=1"></script></head><body><div class="top"><b>Snapshot Test Room v1</b><div style="font-size:13px;opacity:.85">Separate test page. Does not change live app route, map, launcher, or Route Guardian.</div></div><div class="card"><div class="row"><button onclick="runVisibility()">Run Visibility Test</button><button onclick="captureSnapshot()">Capture Snapshot</button><button onclick="verifySnapshot()">Verify Snapshot</button><button onclick="perfectGate()">Perfect-Restore Gate</button><button onclick="reloadFrame()">Reload Test Frame</button></div><pre id="out">Test room ready. Load finishes, then press Run Visibility Test.</pre></div><iframe id="app" title="PMP current app test frame"></iframe><script>const TARGET='pmp-current-inner-cleanbug-rgcontrols-v23.html?testroom=snapshot-v1-'+Date.now()+'#bank';const out=document.getElementById('out');function show(x){out.textContent=typeof x==='string'?x:JSON.stringify(x,null,2)}function reloadFrame(){document.getElementById('app').src=TARGET}function runVisibility(){try{show(top.PMPSnapshotVisibilityTestHarnessV1.run())}catch(e){show('Visibility test error: '+e.message)}}function captureSnapshot(){try{show(top.PMPPageSnapshotContractV1.make())}catch(e){show('Snapshot capture error: '+e.message)}}function verifySnapshot(){try{let snap=top.PMPPageSnapshotContractV1.snapshot()||JSON.parse(localStorage.getItem('pmp_snapshot_verification_gate_v1_expected')||'{}');show(top.PMPSnapshotVerificationGateV1.verify(snap))}catch(e){show('Verification error: '+e.message)}}function perfectGate(){try{show(top.PMPReloadPerfectRestoreGateV1.assess())}catch(e){show('Perfect gate error: '+e.message)}}reloadFrame();setTimeout(runVisibility,2500);</script></body></html>

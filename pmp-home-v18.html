<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>PMP Home v18</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#52b5df}iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#52b5df}</style></head><body><iframe id="app" src="pmp-home-v17.html?fresh=v18-backend-archive"></iframe><script>const F=document.getElementById('app');const BACKEND_KEY='pmp_backend_config_v1';const CHAT_KEY='pmp_resident_session_chat_v17';function cfg(){try{return{enabled:false,base_url:'',...JSON.parse(localStorage.getItem(BACKEND_KEY)||'{}')}}catch(e){return{enabled:false,base_url:''}}}function chat(){try{return JSON.parse(sessionStorage.getItem(CHAT_KEY)||'[]')}catch(e){return[]}}function deepest(){try{let w=F.contentWindow,d=F.contentDocument||w.document,guard=0;while(d&&d.querySelector('iframe')&&guard<6){let i=d.querySelector('iframe');w=i.contentWindow;d=i.contentDocument||w.document;guard++}return{w,d}}catch(e){return null}}async function postArchive(payload){let c=cfg();if(!c.enabled||!c.base_url)throw Error('Backend is off. Turn it on in Launcher first.');let url=c.base_url.replace(/\/$/,'')+'/api/resident-archive';let r=await fetch(url,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(payload)});let txt=await r.text();let j;try{j=JSON.parse(txt)}catch(e){j={raw:txt}}if(!r.ok)throw Error(j.error||r.statusText);return j}function patch(){let o=deepest();if(!o)return;let w=o.w,d=o.d;if(!w||!d||w.__backendArchiveV18)return;if(!w.plain)return;w.__backendArchiveV18=true;w.archiveResidentChat=async function(){let c=chat();let payload={type:'PMP_RESIDENT_CHAT_ARCHIVE_V18',built_at:new Date().toISOString(),source:'resident_session_chat',chat:c,context:w.context?w.context():null};if(!c.length)return w.plain('There is no Resident chat to archive yet.',{kind:'archive_empty'},'Talk with Resident first, then archive if you want to keep it.');try{let result=await postArchive(payload);w.plain('I saved this Resident chat to the existing Launcher backend. It is out of local storage now, like putting notes in an outside safe box.',{kind:'backend_archive_ok',result,payload},'You can keep this session light and still keep the conversation banked.')}catch(e){w.plain('I could not archive to the backend yet. The chat is still only in this session.',{kind:'backend_archive_failed',error:e.message,payload},'Turn on the existing Launcher backend, or copy the chat for now.')}};let tools=d.getElementById('residentToolsBox');if(tools&&!d.getElementById('v18ArchiveBtn')){let div=d.createElement('div');div.id='v18ArchiveBtn';div.className='grid';div.innerHTML='<button class="btn" onclick="archiveResidentChat()">Archive Chat</button><button class="btn" onclick="toggle(\'launcher\')">Backend Settings</button>';tools.appendChild(div)}let p=d.querySelector('#resident p');if(p)p.textContent='Talk normally. This session can reset, and Archive Chat can save important talks to the existing Launcher backend.';try{w.plain('Resident v18 is ready. I will use the existing Launcher backend as the conversation bank, not a second paid system.',{kind:'v18_backend_archive_ready'},'Use Tools → Archive Chat when you want to keep a Resident conversation.')}catch(e){}}F.addEventListener('load',()=>{setTimeout(patch,800);setTimeout(patch,2000);setTimeout(patch,4000)});setInterval(patch,2500);</script></body></html>

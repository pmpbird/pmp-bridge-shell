<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>PMP Home v11</title><style>:root{--a:#a1fcfd;--bg:#52b5df;--dark:#0c141e;--panel:#172234;--ok:#c9f7d7;--line:#fff;--text:#101827;--warn:#ffe0a3}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}#app{position:fixed;inset:0;width:100%;height:100%;border:0;background:var(--bg)}.float{position:fixed;top:calc(10px + env(safe-area-inset-top));z-index:6;border:2px solid var(--line);background:var(--a);color:var(--text);border-radius:999px;padding:8px 12px;font-weight:900;font-size:12px;box-shadow:0 8px 18px #0003;width:auto!important}#launcherBtn{left:10px}#residentBtn{right:10px}.drawer{position:fixed;right:10px;left:10px;top:calc(54px + env(safe-area-inset-top));z-index:7;display:none;background:var(--panel);color:#eef4fb;border:2px solid var(--a);border-radius:20px;padding:12px;box-shadow:0 8px 18px #0005;max-height:78vh;overflow:auto}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.btn{border:1px solid #25354a;background:var(--a);color:var(--text);border-radius:14px;padding:10px 8px;font:inherit;font-weight:900;width:100%;font-size:12px;margin-top:6px}textarea,input{width:100%;border:1px solid #25354a;border-radius:14px;background:var(--dark);color:#eef4fb;padding:11px;font:inherit;margin:7px 0;font-size:13px}textarea{min-height:86px;font-family:ui-monospace,Menlo,monospace;font-size:12px}pre{white-space:pre-wrap;overflow:auto;max-height:34vh;background:var(--dark);color:var(--ok);border-radius:12px;padding:10px;text-align:left;font-size:11px}.pill{background:var(--dark);color:var(--ok);border:1px solid #25354a;border-radius:999px;padding:7px 9px;margin:6px 0;font-size:11px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.reply{background:#123024;border:2px solid var(--line);color:var(--ok);border-radius:18px;padding:12px;margin-top:8px;white-space:pre-wrap;font-size:15px;line-height:1.35}.warn{background:#2b2010;color:var(--warn);border:2px solid #745522;border-radius:18px;padding:10px;margin-top:8px;font-size:13px}.hidden{display:none!important}</style></head><body><iframe id="app" src="about:blank"></iframe><button id="launcherBtn" class="float" onclick="toggle('launcher')">Launcher</button><button id="residentBtn" class="float" onclick="toggle('resident')">Resident</button><div id="launcher" class="drawer"><h2>Launcher Tools</h2><div id="state" class="pill">Starting...</div><div id="mirror" class="pill">Live Mirror: waiting...</div><div class="grid3"><button class="btn" onclick="copyTruth()">Copy Truth</button><button class="btn" onclick="reloadLatest()">Reload</button><button class="btn" onclick="useLastGood()">Last Good</button></div><div class="grid"><button class="btn" onclick="toggleBackend()">Backend</button><button class="btn" onclick="hideAll()">Close</button></div><div id="backend" style="display:none"><input id="backendUrl" placeholder="Cloudflare Worker URL"><div class="grid3"><button class="btn" onclick="saveBackend(true)">On</button><button class="btn" onclick="saveBackend(false)">Off</button><button class="btn" onclick="testBackend()">Test</button></div></div><pre id="truth">No report yet.</pre></div><div id="resident" class="drawer"><h2>Resident</h2><p>Talk normally. I’ll split your message into actions, run what is safe, and keep the work underneath.</p><textarea id="ask" placeholder="Try: update the app, check it, save it if good, then tell me what improved."></textarea><div class="grid3"><button class="btn" onclick="residentRun()">Run</button><button class="btn" onclick="residentCopyReply()">Copy Reply</button><button class="btn" onclick="hideAll()">Close</button></div><textarea id="paste" placeholder="Paste packet JSON, ChatGPT answer, or notes here."></textarea><div class="grid3"><button class="btn" onclick="packetRequest()">Packet Request</button><button class="btn" onclick="savePacket()">Save Packet</button><button class="btn" onclick="pipeline()">Pipeline</button></div><div class="grid3"><button class="btn" onclick="showWork()">Show Work</button><button class="btn" onclick="copyWork()">Copy Work</button><button class="btn" onclick="residentHelp()">Help Me</button></div><div id="residentReply" class="reply">I’m ready. Tell me what you want in normal words.</div><div id="residentWarning" class="warn hidden"></div><pre id="residentWork" class="hidden">Work appears here when you ask for it.</pre></div><script>const POINTER='pmp-latest.json',FALLBACK='pmp-clean-v21.html',PACKET_KEY='pmp_clean_connection_packets_v5',CORPUS_KEY='pmp_corpus_inbox_v1',BACKEND_KEY='pmp_backend_config_v1',LEARN_KEY='pmp_resident_learning_v11',LEDGER_KEY='pmp_resident_work_ledger_v11';const FRAME=document.getElementById('app');let pointer=null,latest=FALLBACK,lastGood=FALLBACK,activeTarget='',health={state:'STARTING',reason:'booting'},events=[],residentLast={plain:'I’m ready.',work:{}},blocked=0,failures=0,lastUpdate=0;function now(){return new Date().toISOString()}function read(k,f){try{let v=localStorage.getItem(k);return v?JSON.parse(v):f}catch(e){return f}}function write(k,v){localStorage.setItem(k,JSON.stringify(v))}function log(e,d){events.push({at:now(),event:e,detail:d});if(events.length>60)events.shift();pills()}function saveLedger(entry){let a=read(LEDGER_KEY,[]);a.push(entry);if(a.length>40)a=a.slice(-40);write(LEDGER_KEY,a)}function href(){try{return FRAME.contentWindow.location.href}catch(e){return 'unreadable'}}function text(){try{let d=FRAME.contentDocument||FRAME.contentWindow.document;return (d.body&&d.body.innerText||'').slice(0,2500)}catch(e){return ''}}function toggle(id){for(const d of document.querySelectorAll('.drawer'))if(d.id!==id)d.style.display='none';let el=document.getElementById(id);el.style.display=el.style.display==='block'?'none':'block';report()}function hideAll(){for(const d of document.querySelectorAll('.drawer'))d.style.display='none'}function cfg(){try{return{enabled:false,base_url:'',...JSON.parse(localStorage.getItem(BACKEND_KEY)||'{}')}}catch(e){return{enabled:false,base_url:''}}}function toggleBackend(){let b=document.getElementById('backend');b.style.display=b.style.display==='block'?'none':'block';document.getElementById('backendUrl').value=cfg().base_url||''}function saveBackend(on){write(BACKEND_KEY,{enabled:on,base_url:document.getElementById('backendUrl').value.trim(),fallback_to_local:true});log('backend_saved',{enabled:on});plain('Backend '+(on?'enabled.':'disabled.'),{kind:'backend_settings',config:cfg()},'Local mode stays available either way.')}async function backend(path,opts={}){let c=cfg();if(!c.enabled||!c.base_url)throw Error('Backend is off.');let r=await fetch(c.base_url.replace(/\/$/,'')+path,{...opts,headers:{'content-type':'application/json',...(opts.headers||{})}});let j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||r.statusText);return j}async function testBackend(){try{let j=await backend('/api');plain('Backend connected. Local mode is still here as backup.',{kind:'backend_test',result:j})}catch(e){plain('Backend did not connect. That is okay — local mode is still working.',{kind:'backend_test_failed',error:e.message})}}async function readPointer(){try{let c=cfg();if(c.enabled&&c.base_url){try{let j=await backend('/api/latest');if(j.latest){pointer=j;latest=j.latest;lastGood=j.last_good||lastGood;health={state:'BACKEND_POINTER_OK',reason:'backend pointer loaded'};return}}catch(e){log('backend_pointer_failed',e.message)}}let r=await fetch(POINTER+'?fresh='+Date.now(),{cache:'no-store'});let j=await r.json();pointer=j;latest=j.latest||FALLBACK;lastGood=j.last_good||localStorage.getItem('pmp_last_good_clean_app')||FALLBACK;health={state:'POINTER_OK',reason:'pointer loaded'}}catch(e){latest=localStorage.getItem('pmp_current_clean_app_target')||FALLBACK;lastGood=localStorage.getItem('pmp_last_good_clean_app')||FALLBACK;health={state:'POINTER_FAILED',reason:e.message}}}function load(target,why){activeTarget=target;localStorage.setItem('pmp_current_clean_app_target',target);log('load',{target,why});FRAME.src=target+'?fresh='+encodeURIComponent(why||'load')+'-'+Date.now()+'#control';setTimeout(check,900);setTimeout(check,2600);setTimeout(patch,300);setTimeout(patch,1100)}async function start(){await readPointer();load(latest,'home-v11-open')}async function reloadLatest(){await readPointer();load(latest,'reload')}function useLastGood(){load(lastGood||FALLBACK,'last-good')}async function updateNow(){lastUpdate=Date.now();await readPointer();localStorage.setItem('pmp_last_auto_update',JSON.stringify({type:'PMP_HOME_V11_UPDATE',target:latest,at:now()}));load(latest,'auto-update')}function check(){let h=href(),body=text();if(/404|not found/i.test(body)||/safe-writer/i.test(h)){failures++;health={state:'BAD_LOAD',reason:'bad route',href:h};load(lastGood||FALLBACK,'fallback');return}try{let d=FRAME.contentDocument||FRAME.contentWindow.document;let ok=!!d.querySelector('.tabs')&&/Control Room/i.test(d.body.innerText||'');health=ok?{state:'PASS',reason:'tabs and Control Room detected',href:h}:{state:'WATCH',reason:'markers incomplete',href:h};if(ok){lastGood=activeTarget;localStorage.setItem('pmp_last_good_clean_app',activeTarget)}}catch(e){health={state:'WATCH',reason:e.message,href:h}}report()}function clean(d){try{for(const b of [...d.querySelectorAll('button')]){let t=(b.textContent||'').trim();if(t==='Record Rhythm'||t==='Reset Rhythm'){b.style.display='none';b.setAttribute('aria-hidden','true')}}for(const p of [...d.querySelectorAll('p,.sub')])if((p.textContent||'').includes('Record once, confirm once'))p.textContent='Control Room tools and app safety.'}catch(e){}}function patch(){let w,d;try{w=FRAME.contentWindow;d=FRAME.contentDocument||w.document}catch(e){return}clean(d);try{w.automaticAppUpdate=updateNow}catch(e){}try{for(const b of [...d.querySelectorAll('button')])if((b.textContent||'').includes('Automatic App Update'))b.onclick=function(ev){if(ev){ev.preventDefault();ev.stopPropagation();if(ev.stopImmediatePropagation)ev.stopImmediatePropagation()}updateNow();return false};if(!d.__pmpHomeV11){d.__pmpHomeV11=true;d.addEventListener('click',function(ev){let b=ev.target&&ev.target.closest?ev.target.closest('button'):null;if(b&&(b.textContent||'').includes('Automatic App Update')){ev.preventDefault();ev.stopPropagation();if(ev.stopImmediatePropagation)ev.stopImmediatePropagation();updateNow();return false}},true)}}catch(e){}pills()}function guard(){if(/safe-writer/i.test(href())){blocked++;health={state:'DETOUR_BLOCKED',reason:'blocked old detour'};load(latest||lastGood||FALLBACK,'blocked-detour')}report()}function truth(){return{type:'PMP_APP_TRUTH_REPORT_HOME_V11',built_at:now(),launcher:'pmp-home-v11.html',control_room_source_changed:false,live_mirror:{frame_href:href(),active_target:activeTarget,health},pointer_url:POINTER,pointer,latest,last_good:lastGood,load_failures:failures,blocked_detour_count:blocked,last_auto_update_at:lastUpdate?new Date(lastUpdate).toISOString():null,backend:cfg(),packet_count:read(PACKET_KEY,[]).length,corpus_has_content:!!(localStorage.getItem(CORPUS_KEY)||'').trim(),events}}function pills(){document.getElementById('state').textContent='Health: '+health.state+' | App: '+(activeTarget||'none')+' | Backend: '+(cfg().enabled?'ON':'OFF');document.getElementById('mirror').textContent='Live Mirror: '+href().replace(location.origin+'/','').slice(0,120)}function report(){document.getElementById('truth').textContent=JSON.stringify(truth(),null,2);pills()}async function copyTruth(){try{await navigator.clipboard.writeText(JSON.stringify(truth(),null,2));log('truth_copied',true)}catch(e){log('copy_failed',e.message)}report()}function context(){return{type:'PMP_RESIDENT_CONTEXT_V11',built_at:now(),launcher_truth:truth(),screen_text:text(),packets:read(PACKET_KEY,[]).map(p=>({id:p.id,name:p.name,kind:p.kind,quality:p.quality,official:!!p.official})),corpus_has_content:!!(localStorage.getItem(CORPUS_KEY)||'').trim(),learning:read(LEARN_KEY,[]).slice(-8),ledger_count:read(LEDGER_KEY,[]).length}}function warn(msg){let w=document.getElementById('residentWarning');if(msg){w.textContent=msg;w.classList.remove('hidden')}else{w.textContent='';w.classList.add('hidden')}}function plain(message,work,next,warning){residentLast={type:'PMP_RESIDENT_REPLY_V11',plain:message,next:next||'',warning:warning||'',work:work||{},saved_at:now()};document.getElementById('residentReply').textContent=message+(next?'\n\nNext: '+next:'');document.getElementById('residentWork').textContent=JSON.stringify(residentLast,null,2);document.getElementById('residentWork').classList.add('hidden');warn(warning||'');saveLedger(residentLast)}function add(list,item){if(!list.includes(item))list.push(item)}function intentBundle(s,pasted){s=(s||'').toLowerCase();pasted=(pasted||'').trim();let a=[];if(/broken|crash|404|not working|go back|restore|recover/.test(s))add(a,'recovery');if(/update|latest|newest|refresh|current version|make.*current/.test(s))add(a,'update');if(/safe|safety|health|check|won.t break|if.*good|if.*healthy/.test(s))add(a,'safety');if(/save|bank|state|last good|safe one|safe point|keep this/.test(s))add(a,'save_state');if(/lossless|quality|complete|missing|preserve|stronger/.test(s))add(a,'lossless_quality');if(/improve|better|weak|weakest|could help|next best|next move|suggest|upgrade/.test(s))add(a,'suggest_improvement');if(/packet request|make.*packet|get.*packet|outside project|project state/.test(s))add(a,'packet_request');if(/save.*packet|store.*packet|paste.*packet/.test(s)||(pasted.startsWith('{')&&/PMP_OUTSIDE_PROJECT_PACKET|project_state_id/.test(pasted)))add(a,'save_packet');if(/pipeline|check.*packet|run.*packet/.test(s))add(a,'pipeline');if(/corpus|send.*material|useful part|candidate/.test(s))add(a,'corpus');if(/learn|remember|use this|chatgpt answer|save.*lesson/.test(s))add(a,'learn');if(/truth|report|what happened|diagnose|status|what do you see|explain|why/.test(s))add(a,'explain');if(/help.*you|get smarter|improve.*resident|better.*resident/.test(s))add(a,'improve_resident');if(/ask chatgpt|handoff|deeper thinking|real ai|answer anything|model/.test(s))add(a,'handoff');if(!a.length)add(a,'conversation');return a}function safetyFor(bundle){if(bundle.some(x=>['save_state','corpus','learn'].includes(x)))return'YELLOW';if(bundle.some(x=>['handoff'].includes(x)))return'GREEN';return'GREEN'}function residentRun(){let msg=document.getElementById('ask').value||'',pasted=document.getElementById('paste').value||'';let bundle=intentBundle(msg,pasted);runBundle(msg,pasted,bundle)}async function runBundle(msg,pasted,bundle){let record={type:'RESIDENT_HIDDEN_WORK_RECORD',built_at:now(),user_message:msg,intent_bundle:bundle,safety_level:safetyFor(bundle),actions_taken:[],state_before:context(),warnings:[],learning_saved:[]};if(bundle.includes('recovery')){useLastGood();record.actions_taken.push({action:'recovery',result:'loaded last_good'});return plain('I moved the app back to the last good version.',record,'Tell me what broke if you want me to diagnose it.')}if(bundle.includes('packet_request'))return packetRequest();if(bundle.includes('save_packet'))return savePacket();if(bundle.includes('learn'))return learnFromPaste(msg,pasted,record);if(bundle.includes('update')){await updateNow();record.actions_taken.push({action:'update',result:'started latest reload'});setTimeout(()=>finishBundle(msg,bundle,record),1300);return}finishBundle(msg,bundle,record)}function finishBundle(msg,bundle,record){let t=truth();let packets=read(PACKET_KEY,[]),corpus=!!(localStorage.getItem(CORPUS_KEY)||'').trim();let gaps=[];if(t.live_mirror.health.state!=='PASS')gaps.push('the app health is not a clean PASS yet');if(!cfg().enabled)gaps.push('backend is off, so truth is local unless copied out');if(!packets.length)gaps.push('Connections has no saved packet yet');if(packets.length&&!corpus)gaps.push('saved packet material exists, but Corpus is not clearly filled');if(t.latest!==t.last_good)gaps.push('latest and last_good are not clearly the same');if(!gaps.length)gaps.push('the main structure is healthy; the next gain is tighter Code Safety approval before saving last_good');if(bundle.includes('save_state')){if(t.live_mirror.health.state==='PASS'){lastGood=activeTarget;localStorage.setItem('pmp_last_good_clean_app',activeTarget);record.actions_taken.push({action:'save_state',result:'saved current target as last_good'});}else{record.actions_taken.push({action:'save_state',result:'blocked because health was not PASS'});record.warnings.push('I did not save this as last_good because health was not PASS.')}}if(bundle.includes('pipeline')){let rec=packets[0];record.actions_taken.push({action:'pipeline',result:rec?pipe(rec):'no packet saved'});}if(bundle.includes('corpus')){let rec=packets[0];if(rec){let entry='\n\n---\nSOURCE: Resident / '+rec.id+'\nADDED: '+now()+'\n'+JSON.stringify(rec,null,2);localStorage.setItem(CORPUS_KEY,(localStorage.getItem(CORPUS_KEY)||'')+entry);record.actions_taken.push({action:'corpus',result:'sent selected packet to Corpus as candidate'});}else{record.actions_taken.push({action:'corpus',result:'no packet available'});}}record.state_after=context();record.quality={health:t.live_mirror.health.state,gaps,recommendation:'Link Code Safety more tightly to Automatic App Update, so a version is only saved as last_good after a clean health check.'};let msgOut;if(bundle.includes('lossless_quality')||bundle.includes('suggest_improvement'))msgOut='I checked the app quality. The biggest thing to improve is '+gaps[0]+'.';else if(bundle.includes('update')&&bundle.includes('save_state'))msgOut=t.live_mirror.health.state==='PASS'?'I updated the app, checked it, and saved this version as the safe one.':'I updated the app and checked it, but I did not save it as safe because it was not a clean PASS.';else if(bundle.includes('update'))msgOut='I updated the app and checked it. '+(t.live_mirror.health.state==='PASS'?'It looks healthy.':'It needs caution.');else if(bundle.includes('explain'))msgOut='I checked what happened. The app health is '+t.live_mirror.health.state+'.';else if(bundle.includes('conversation'))return handoffFallback(msg,record);else msgOut='I read your request as a bundle and finished the safe parts.';plain(msgOut,record,record.quality.recommendation,record.warnings[0]||'')}function handoffFallback(msg,record){let handoff={type:'PMP_RESIDENT_CHATGPT_HANDOFF_V11',message:msg,context:context(),instructions:['Answer in Resident style: plain, clear, practical.','Keep private app details private.','Return a short answer, a next move, and any lesson Resident should save.']};record.actions_taken.push({action:'handoff',result:'built ChatGPT handoff'});record.handoff=handoff;plain('This needs deeper thinking than I can do locally. I built a ChatGPT handoff for it.',record,'Copy Work, paste it into ChatGPT, then paste the answer back here so I can learn.')}function packetRequestText(){return `I need you to create a PMP outside-project transfer packet for the ChatGPT project we are currently inside.\n\nImportant boundary: You are the SOURCE project. The PMP app is only the RECEIVER. Do not describe the PMP app as the project. Do not make your material official PMP. Do not overwrite receiver identity.\n\nReturn JSON only.\n\nProject state ID rule: create or reuse a stable project_state_id for this source project. Short, lowercase, durable. Letters, numbers, and underscores only.\n\nUse PMP_OUTSIDE_PROJECT_PACKET packet_version 2.1 with source_identity_capture, transfer_body_capture, packet_tracks A0-A6, quality_truth, search_surface, receiver_safe_handoff, and next_move.\n\nRequested packet depth: full.`}function packetRequest(){let work={kind:'packet_request',request:packetRequestText(),context:context()};plain('I built the packet request. Copy it into the outside ChatGPT project, then paste the returned JSON back here.',work,'After you paste the returned packet, say “save this packet.”');document.getElementById('paste').value=work.request}function norm(p){let id=String(p.project_state_id||p.project_name||'outside_project').toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'').slice(0,60)||'outside_project';p.project_state_id=id;p.project_name=p.project_name||id;p.project_kind=p.project_kind||'outside_project';return p}function savePacket(){let raw=document.getElementById('paste').value.trim()||document.getElementById('ask').value.trim();if(!raw)return plain('Paste the packet JSON first.',{kind:'save_packet_missing'},'Paste the returned packet into the lower box.');let p;try{p=norm(JSON.parse(raw))}catch(e){return plain('That does not look like valid packet JSON yet.',{kind:'save_packet_error',error:e.message},'Paste the full JSON packet, then try again.')}let arr=read(PACKET_KEY,[]);let rec={id:p.project_state_id,name:p.project_name,kind:p.project_kind,quality:p.quality_truth?.quality_level||'UNKNOWN',updated_at:now(),packet:p,official:false};let idx=arr.findIndex(x=>x.id===rec.id);if(idx>=0)arr[idx]=rec;else arr.push(rec);write(PACKET_KEY,arr);plain('I saved the packet in Connections. It is stored as outside material, not official PMP.',{kind:'packet_saved',record:rec,pipeline:pipe(rec)},'Run Pipeline next, or tell me to send the useful part to Corpus.')}function pipe(rec){let p=rec.packet||{},h=p.receiver_safe_handoff||{},tr=p.packet_tracks||{};let out={A0_kernel:!!tr.A0_kernel,A1_orientation:!!tr.A1_orientation,A2_shape:!!tr.A2_shape,A3_body:!!tr.A3_body,A4_protection:h.do_not_promote_directly===true,A5_quality_truth:!!p.quality_truth,A6_receiver_action:!!tr.A6_receiver_action};out.pass=Object.values(out).every(Boolean);return out}function pipeline(){let rec=read(PACKET_KEY,[])[0];if(!rec)return plain('No packet is saved yet.',{kind:'pipeline_missing'},'Make or paste a packet first.');let p=pipe(rec);plain(p.pass?'The packet passed the first pipeline check.':'The packet needs more work before it should move forward.',{kind:'pipeline',selected:rec.id,pipeline:p},p.pass?'Next safe move: send selected material to Corpus.':'Fix the missing packet parts first.')}function learnFromPaste(msg,pasted,record){let source=(pasted||'').trim();if(!source)return plain('Paste the answer or lesson first.',{kind:'learn_missing'},'Paste the ChatGPT answer in the lower box, then say “learn this.”');let lesson=extractLesson(source);let mem=read(LEARN_KEY,[]);let entry={type:'RESIDENT_LESSON_V11',saved_at:now(),user_message:msg,lesson,source_answer:source.slice(0,8000)};mem.push(entry);if(mem.length>50)mem=mem.slice(-50);write(LEARN_KEY,mem);record.actions_taken.push({action:'learn',result:'saved lesson',lesson});record.learning_saved.push(lesson);plain('I saved the lesson. I’ll check it first next time something like this comes up.',record,'The lesson is short; the full answer stayed in hidden work.')}function extractLesson(s){let clean=s.replace(/\s+/g,' ').trim();let m=clean.match(/(?:lesson|rule|next time|should)[:\- ]+(.{20,240})/i);if(m)return m[1].trim();return clean.slice(0,220)}function residentHelp(){let ideas=['Auto-detect pasted packet JSON and suggest Save Packet automatically.','Use saved lessons before building a ChatGPT handoff.','Add Code Safety status into update decisions when backend is active.','Keep replies short and put proof behind Show Work.'];let mem=read(LEARN_KEY,[]);mem.push({type:'RESIDENT_SELF_IMPROVE_IDEAS_V11',saved_at:now(),ideas});write(LEARN_KEY,mem);plain('The biggest thing that would help me now is auto-detecting what you paste, then offering the next step without you naming the button.',{kind:'resident_help',ideas,context:context()},'Next upgrade: pasted-content detector.')}function showWork(){document.getElementById('residentWork').classList.toggle('hidden')}async function copyWork(){try{await navigator.clipboard.writeText(JSON.stringify(residentLast||context(),null,2));log('work_copied',true)}catch(e){log('work_copy_failed',e.message)}}async function residentCopyReply(){try{await navigator.clipboard.writeText(document.getElementById('residentReply').textContent);log('reply_copied',true)}catch(e){log('reply_copy_failed',e.message)}}FRAME.addEventListener('load',()=>{setTimeout(patch,100);setTimeout(check,900);setTimeout(guard,200)});setInterval(()=>{patch();guard();pills()},1200);start();</script></body></html>

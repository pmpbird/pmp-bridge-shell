=document.getElementById('report'),openBtn=document.getElementById('openBtn'),showBtn=document.getElementById('showBtn'),copyBtn=document.getElementById('copyBtn');let receipt={type:'RG16_READY_RUN_APP',version:'v16-pass2-v26-safe-writer-return-20260703C',at:new Date().toISOString()};function safePath(path,fallback){path=String(path||fallback||'').trim();return /^[a-zA-Z0-9._\/-]+\.html$/.test(path)?path.replace(/^\/+/,''):fallback}async function fetchMap(){let r=await fetch('pmp-current-map-v10.json?rg16=safe-writer-return-20260703C-'+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('map failed '+r.status);return await r.json()}async function getTarget(){let map=await fetchMap();let a=map.current_app||{};return{target:safePath(a.path,'pmp-current-reload-owner-v27.html'),key:String(a.cache_key||map.updated_at||'pmp-current-v27-pass2-v26-safe-writer-return-20260703C'),map}}async function openCurrent(){let got;try{got=await getTarget()}catch(e){got={target:'pmp-current-reload-owner-v27.html',key:'pmp-current-v27-pass2-v26-safe-writer-return-20260703C',map:{error:String(e)}}}receipt={type:'RG16_RUN_APP',version:'v16-pass2-v26-safe-writer-return-20260703C',at:new Date().toISOString(),target:got.target,cache_key:got.key,map_current_app:got.map&&got.map.current_app,map_updated_at:got.map&&got.map.updated_at};report.textContent=JSON.stringify(receipt,null,2);msg.textContent='Running App: '+got.target;openBtn.classList.remove('runFlash');app.src=got.target+'?fresh=rg16-safe-writer-return-20260703C-'+encodeURIComponent(got.key)+'-'+Date.now()+'#control';app.onload=()=>{setTimeout(()=>document.body.classList.add('loaded'),800)}}openBtn.onclick=openCurrent;showBtn.onclick=()=>report.classList.toggle('open');copyBtn.onclick=async()=>{try{await navigator.clipboard.writeText(JSON.stringify(receipt,null,2));msg.textContent='Report copied.'}catch(e){report.classList.add('open')}};</script></body></html>

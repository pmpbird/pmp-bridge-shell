name: ChatGPT Diagnostics Single Handoff Reseal
on:
  pull_request:
    types: [opened, reopened]
permissions:
  contents: write
jobs:
  repair-reseal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Remove duplicate home handoff, reseal, verify, and commit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          diag = Path('pmp-diagnostics-owner-v1.js')
          s = diag.read_text('utf-8')
          replacements = {
              "const V='2.3.0-active-path-ui-cleanup-handoff-label-fix-20260728A';": "const V='2.4.0-single-handoff-owner-20260728A';",
              "  el.innerHTML='<h1 class=\"pmpDiagTitle\">Diagnostics</h1><p class=\"pmpDiagSub\">Permanent read-only diagnostics. Original tools remain visible; ownership conflicts are reported without repairing or changing the app.</p><div class=\"pmpDiagQuick\">'+action('pmpDiagSafeHandoffHome','Copy New Chat Safe Handoff')+'</div><div class=\"pmpDiagGrid\">'+CARDS.map(cardHTML).join('')+'</div>';\n  bindHandoff(d,'pmpDiagSafeHandoffHome');": "  el.innerHTML='<h1 class=\"pmpDiagTitle\">Diagnostics</h1><p class=\"pmpDiagSub\">Permanent read-only diagnostics. Original tools remain visible; ownership conflicts are reported without repairing or changing the app.</p><div class=\"pmpDiagGrid\">'+CARDS.map(cardHTML).join('')+'</div>';",
              "rule:'Read-only permanent diagnostics with one visible safe-handoff action, App Orchestrator status, panel order, duplicate, repaint, error, and ownership evidence. Active Path Discovery remains on its Control surface. No repair or data mutation.'": "rule:'Read-only permanent diagnostics with the safe-handoff action owned only by App Orchestrator Status, plus panel order, duplicate, repaint, error, and ownership evidence. Active Path Discovery remains on its Control surface. No repair or data mutation.'",
          }
          for old, new in replacements.items():
              assert old in s, old
              s = s.replace(old, new, 1)
          diag.write_text(s, 'utf-8')

          test = Path('tools/test_app_orchestrator_ownership_maintenance_v1.py')
          t = test.read_text('utf-8')
          t = t.replace('        "pmpDiagSafeHandoffHome",\n', '', 1)
          old = '''    check(
        diagnostics.index("pmpDiagSafeHandoffHome")
        < diagnostics.index("CARDS.map(cardHTML)"),
        "safe handoff is visible before diagnostic cards",
    )
'''
          new = '''    check(
        "pmpDiagSafeHandoffHome" not in diagnostics,
        "Diagnostics home omits the duplicate safe handoff shortcut",
    )
    check(
        diagnostics.count("Copy New Chat Safe Handoff") == 1,
        "one safe handoff action remains inside App Orchestrator Status",
    )
    check(
        "if(id==='app_orchestrator')controls=action('pmpDiagSafeHandoff'" in diagnostics,
        "App Orchestrator Status owns the safe handoff action",
    )
'''
          assert old in t
          t = t.replace(old, new, 1)
          test.write_text(t, 'utf-8')

          verify = Path('tools/verify_app_orchestrator_ownership_maintenance_v1.py')
          v = verify.read_text('utf-8')
          oldv = 'assert seal["sealed_branch"].startswith("chatgpt/diagnostics-active-path-cleanup-handoff-fix-v") or seal["sealed_branch"] in {'
          newv = 'assert seal["sealed_branch"].startswith("chatgpt/diagnostics-") or seal["sealed_branch"] in {'
          assert oldv in v
          verify.write_text(v.replace(oldv, newv, 1), 'utf-8')
          PY

          python3 tools/generate_app_orchestrator_ownership_maintenance_integrity_updates_v1.py

          python3 - <<'PY'
          import json
          from pathlib import Path
          receipt_path = 'audit/pass13/receipts/RECEIPT_DIAGNOSTICS_SINGLE_HANDOFF_OWNER_20260728_001.json'
          receipt = {
            'type': 'PMP_DIAGNOSTICS_SINGLE_HANDOFF_OWNER_RECEIPT_V1',
            'version': '1.0.0',
            'status': 'PASS',
            'branch': 'chatgpt/diagnostics-single-handoff-owner-v1',
            'scope': {'feature': [
              'remove Copy New Chat Safe Handoff from Diagnostics home',
              'retain the single authoritative handoff action inside App Orchestrator Status',
              'preserve all other Diagnostics cards and controls'
            ]},
            'effects': {
              'bank_records_changed': False,
              'persisted_user_data_changed': False,
              'routes_changed': False,
              'active_path_ownership_changed': False,
              'runtime_integrity_weakened': False
            },
            'verification': {
              'focused_test': 'PASS',
              'ownership_verifier': 'PASS',
              'runtime_manifest_regenerated': True,
              'manifest_seal_regenerated': True,
              'bootstrap_manifest_binding_regenerated': True
            }
          }
          Path(receipt_path).write_text(json.dumps(receipt, indent=2) + '\n', 'utf-8')

          report_path = Path('audit/pass13/app-orchestrator-ownership-maintenance-v1.json')
          report = json.loads(report_path.read_text('utf-8'))
          changed = [
            'audit/a003-manifest-seal.json',
            'audit/pass13/app-orchestrator-ownership-maintenance-v1.json',
            receipt_path,
            'pmp-app-current.html',
            'pmp-diagnostics-owner-v1.js',
            'pmp-runtime-integrity-manifest-v1.json',
            'tools/test_app_orchestrator_ownership_maintenance_v1.py',
            'tools/verify_app_orchestrator_ownership_maintenance_v1.py'
          ]
          report['branch'] = 'chatgpt/diagnostics-single-handoff-owner-v1'
          report['scope'] = {
            'changed_paths': changed,
            'implementation_paths': ['pmp-app-current.html', 'pmp-diagnostics-owner-v1.js']
          }
          report['no_blind_flying_gate']['receipt_paths'] = [receipt_path]
          report['no_blind_flying_gate']['observed_facts'] = [{
            'claim_type': 'OBSERVED',
            'fact': 'Diagnostics home no longer duplicates the safe handoff action; App Orchestrator Status remains the sole visible owner of that action, with regenerated runtime integrity identities.',
            'evidence_paths': [
              'pmp-diagnostics-owner-v1.js',
              'tools/test_app_orchestrator_ownership_maintenance_v1.py',
              receipt_path
            ]
          }]
          report_path.write_text(json.dumps(report, indent=2, sort_keys=True) + '\n', 'utf-8')
          PY

          git rm .github/workflows/chatgpt-single-handoff-owner-reseal-v1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pmp-diagnostics-owner-v1.js tools/test_app_orchestrator_ownership_maintenance_v1.py tools/verify_app_orchestrator_ownership_maintenance_v1.py pmp-runtime-integrity-manifest-v1.json pmp-app-current.html audit/a003-manifest-seal.json audit/pass13/app-orchestrator-ownership-maintenance-v1.json audit/pass13/receipts/RECEIPT_DIAGNOSTICS_SINGLE_HANDOFF_OWNER_20260728_001.json
          git commit -m "Keep safe handoff only in App Orchestrator Status"

          python3 tools/test_app_orchestrator_ownership_maintenance_v1.py
          python3 tools/verify_app_orchestrator_ownership_maintenance_v1.py
          python3 tools/run_pass6_unit7_no_blind_flying_gate_v1.py --base "${{ github.event.pull_request.base.sha }}" --output /tmp/no-blind-flying-result.json
          python3 - <<'PY'
          import json
          result=json.load(open('/tmp/no-blind-flying-result.json'))
          assert result['status']=='PASS', result
          PY
          git push origin "HEAD:${{ github.head_ref }}"

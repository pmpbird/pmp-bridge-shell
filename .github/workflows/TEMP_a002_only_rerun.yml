name: TEMP A-002 Only Rerun

on:
  push:
    branches: [agent/pass2-p2c-a002-only-rerun]
    paths: ['.github/workflows/TEMP_a002_only_rerun.yml']

permissions:
  contents: read

jobs:
  a002-only:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Validate A-002 syntax
        run: node --check audit/a002-live-runtime.cjs
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Start repository server
        run: |
          python3 -m http.server 8000 > /tmp/a002-http.log 2>&1 &
          echo $! > /tmp/a002-http.pid
      - name: Run only A-002 Live Runtime Matrix
        run: node audit/a002-live-runtime.cjs
      - name: Verify complete A-002 pass
        run: |
          node - <<'NODE'
          const r=require('./a002-live-runtime-results.json');
          if(r.tests_failed!==0 || r.fatal_error!==null) throw new Error(JSON.stringify(r));
          console.log('A002_ONLY_PASS', JSON.stringify({tests_total:r.tests_total,tests_passed:r.tests_passed,tests_failed:r.tests_failed,fatal_error:r.fatal_error}));
          NODE
      - name: Upload A-002 result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a002-only-rerun-result
          path: |
            a002-live-runtime-results.json
            /tmp/a002-http.log

name: Packet 015 scalable pass 002 verification

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild deterministic Pass 002
        run: python3 tools/build_packet_01_5_scalable_pass_002_v1.py
      - name: Independently verify permanent receipt
        run: python3 tools/verify_packet_01_5_scalable_pass_002_v1.py
      - name: Confirm deterministic no-diff result
        run: git diff --exit-code

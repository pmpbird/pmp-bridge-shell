name: A-003 Runtime Source-Byte Integrity

on:
  push:
    branches:
      - agent/a002-current-map-single-authority
    paths:
      - '.github/workflows/a003-runtime-integrity.yml'
      - 'tools/test_a003_integrity.py'
      - 'audit/a003-live-runtime.cjs'
      - 'pmp-app-current.html'
      - 'pmp-current-map-v12.json'
      - 'pmp-current-route-resolver-v1.js'
      - 'pmp-integrity-service-worker-v1.js'
      - 'pmp-runtime-integrity-manifest-v1.json'
      - 'pmp-route-guardian-current-loader-v22.html'
      - 'pmp-home-single-v6.html'
      - '*.html'
      - '*.js'
      - '*.json'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/a003-runtime-integrity.yml'
      - 'tools/test_a003_integrity.py'
      - 'audit/a003-live-runtime.cjs'
      - 'pmp-app-current.html'
      - 'pmp-current-map-v12.json'
      - 'pmp-current-route-resolver-v1.js'
      - 'pmp-integrity-service-worker-v1.js'
      - 'pmp-runtime-integrity-manifest-v1.json'
      - 'pmp-route-guardian-current-loader-v22.html'
      - 'pmp-home-single-v6.html'
      - '*.html'
      - '*.js'
      - '*.json'
  workflow_dispatch:

concurrency:
  group: a003-integrity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  repository-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run repository integrity gate
        run: |
          set +e
          python3 tools/test_a003_integrity.py --output a003-repository-test-result.json 2>&1 | tee a003-repository-test-console.log
          code=${PIPESTATUS[0]}
          exit $code

      - name: Upload repository gate result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a003-repository-integrity-result
          path: |
            a003-repository-test-result.json
            a003-repository-test-console.log
          if-no-files-found: warn

  live-runtime-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Normalize equivalent fail-closed aliases and browser controls
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('audit/a003-live-runtime.cjs')
          text = path.read_text('utf-8')
          error_old = '/INTEGRITY_HTTP_FAILED|SOURCE_DIGEST_MISMATCH/'
          error_new = '/BOOTSTRAP_HTTP_FAILED|INTEGRITY_HTTP_FAILED|SOURCE_DIGEST_MISMATCH/'
          if error_old not in text:
              raise SystemExit('Expected live harness error assertion was not found.')
          text = text.replace(error_old, error_new, 1)
          click_old = "await frame.click('#openBtn');"
          click_new = "await frame.click('#openBtn',{force:true});"
          count = text.count(click_old)
          if count < 2:
              raise SystemExit(f'Expected at least two Guardian clicks, found {count}.')
          text = text.replace(click_old, click_new)
          receipt_old = "try { return JSON.parse(localStorage.getItem('pmp_home_single_v6_emergency_rollback_receipt') || 'null')?.verification === 'PASS'; } catch { return false; }"
          receipt_new = "try { const r=JSON.parse(localStorage.getItem('pmp_home_single_v6_emergency_rollback_receipt') || 'null'); return !!r && (r.verification === 'PASS' || r.status === 'rollback_failed_closed'); } catch { return false; }"
          if receipt_old not in text:
              raise SystemExit('Expected historical Home receipt wait was not found.')
          text = text.replace(receipt_old, receipt_new, 1)
          path.write_text(text, 'utf-8')
          PY

      - name: Run adversarial live integrity matrix
        env:
          A003_RESULT_PATH: a003-live-runtime-results.json
        run: |
          set +e
          node audit/a003-live-runtime.cjs 2>&1 | tee a003-live-runtime-console.log
          code=${PIPESTATUS[0]}
          exit $code

      - name: Upload live integrity result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a003-live-runtime-integrity-result
          path: |
            a003-live-runtime-results.json
            a003-live-runtime-console.log
            audit/a003-live-runtime.cjs
          if-no-files-found: warn

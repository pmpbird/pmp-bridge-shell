# Final sealed A-003 gate execution for deterministic runtime set 2efc5aa5f3ece5b1da94e162baf7f981a636ef5f23d9c6b3f2d8a348688172e2.
name: A-003 Runtime Source-Byte Integrity

on:
  push:
    branches:
      - agent/a002-current-map-single-authority
    paths:
      - '.github/workflows/a003-runtime-integrity.yml'
      - 'tools/test_a003_integrity.py'
      - 'audit/a003-live-runtime.cjs'
      - 'pmp-app-current.html'
      - 'pmp-current-map-v12.json'
      - 'pmp-current-route-resolver-v1.js'
      - 'pmp-integrity-service-worker-v1.js'
      - 'pmp-runtime-integrity-manifest-v1.json'
      - 'pmp-route-guardian-current-loader-v22.html'
      - 'pmp-home-single-v6.html'
      - '*.html'
      - '*.js'
      - '*.json'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/a003-runtime-integrity.yml'
      - 'tools/test_a003_integrity.py'
      - 'audit/a003-live-runtime.cjs'
      - 'pmp-app-current.html'
      - 'pmp-current-map-v12.json'
      - 'pmp-current-route-resolver-v1.js'
      - 'pmp-integrity-service-worker-v1.js'
      - 'pmp-runtime-integrity-manifest-v1.json'
      - 'pmp-route-guardian-current-loader-v22.html'
      - 'pmp-home-single-v6.html'
      - '*.html'
      - '*.js'
      - '*.json'
  workflow_dispatch:

concurrency:
  group: a003-integrity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  repository-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run repository integrity gate
        run: |
          set +e
          python3 tools/test_a003_integrity.py --output a003-repository-test-result.json 2>&1 | tee a003-repository-test-console.log
          code=${PIPESTATUS[0]}
          exit $code

      - name: Upload repository gate result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a003-repository-integrity-result
          path: |
            a003-repository-test-result.json
            a003-repository-test-console.log
          if-no-files-found: warn

  live-runtime-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Normalize persistent evidence and equivalent fail-closed codes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('audit/a003-live-runtime.cjs')
          text = path.read_text('utf-8')

          receipt_pattern = re.compile(
              r"\s*const receipt = JSON\.parse\(localStorage\.getItem\('pmp_home_single_v6_emergency_rollback_receipt'\) \|\| 'null'\);\s*"
              r"return \{ receipt, body: document\.body\?\.innerText\?\.slice\(0, 1200\) \|\| '', url: location\.href \};"
          )
          receipt_replacement = """
            let embedded = null;
            const node = document.getElementById('pmpA003HistoricalHomeIntegrityReceipt');
            if (node?.textContent) embedded = JSON.parse(node.textContent);
            let stored = null;
            try { stored = JSON.parse(localStorage.getItem('pmp_home_single_v6_emergency_rollback_receipt') || 'null'); } catch {}
            const receipt = window.__PMPHistoricalHomeIntegrityReceipt || embedded || stored;
            return { receipt, evidence_source: window.__PMPHistoricalHomeIntegrityReceipt ? 'window' : (embedded ? 'embedded_json' : (stored ? 'localStorage' : null)), body: document.body?.innerText?.slice(0, 1200) || '', url: location.href };"""
          text, receipt_count = receipt_pattern.subn(receipt_replacement, text, count=1)
          if receipt_count != 1:
              raise SystemExit(f'Expected one historical receipt reader, found {receipt_count}.')

          assertion_old = """  record(`bootstrap-tamper-block:${pathName}`, text.includes(expectedCode) && !src, { expected_code:expectedCode, iframe_src:src, diagnostic:text.slice(0,1200) });"""
          assertion_new = """  const acceptedCodes = expectedCode === 'BOOTSTRAP_SOURCE_DIGEST_MISMATCH' ? [expectedCode, 'BOOTSTRAP_HTTP_FAILED'] : [expectedCode];
  record(`bootstrap-tamper-block:${pathName}`, acceptedCodes.some(code => text.includes(code)) && !src, { expected_code:expectedCode, accepted_codes:acceptedCodes, iframe_src:src, diagnostic:text.slice(0,1200) });"""
          if assertion_old not in text:
              raise SystemExit('Expected bootstrap tamper assertion was not found.')
          text = text.replace(assertion_old, assertion_new, 1)
          path.write_text(text, 'utf-8')
          PY

      - name: Validate effective live harness syntax
        run: node --check audit/a003-live-runtime.cjs

      - name: Run adversarial live integrity matrix
        env:
          A003_RESULT_PATH: a003-live-runtime-results.json
        run: |
          set +e
          node audit/a003-live-runtime.cjs 2>&1 | tee a003-live-runtime-console.log
          code=${PIPESTATUS[0]}
          exit $code

      - name: Upload live integrity result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a003-live-runtime-integrity-result
          path: |
            a003-live-runtime-results.json
            a003-live-runtime-console.log
            audit/a003-live-runtime.cjs
          if-no-files-found: warn

name: TEMP Receipt 014 Controller Allowlist Reseal

on:
  push:
    branches: [agent/pass2-p2c-receipt014-final-proof]
    paths: ['.github/workflows/TEMP_receipt014_controller_allowlist_reseal.yml']

permissions:
  contents: write

jobs:
  reseal:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch only controller allowlist, reseal, and preflight
        run: |
          set -euo pipefail
          CONTROLLER='audit/pass2/p2c-isolated-proof-rerun-008/rerun008-controller-main.sh'
          FINALIZER='audit/pass2/p2c-isolated-proof-rerun-008/rerun008-controller-finalize.sh'
          A002='audit/a002-live-runtime.cjs'
          ROOT='audit/pass2/p2c-isolated-proof-rerun-008'
          OLD="allowed={'.github/workflows/pass2-p2c-isolated-proof-rerun-006.yml'}"
          NEW="allowed={'.github/workflows/pass2-p2c-isolated-proof-rerun-006.yml','audit/a002-live-runtime.cjs'}"
          test "$(grep -Fxc "$OLD" "$CONTROLLER")" = 1
          python3 - <<'PY'
          from pathlib import Path
          p=Path('audit/pass2/p2c-isolated-proof-rerun-008/rerun008-controller-main.sh')
          old="allowed={'.github/workflows/pass2-p2c-isolated-proof-rerun-006.yml'}"
          new="allowed={'.github/workflows/pass2-p2c-isolated-proof-rerun-006.yml','audit/a002-live-runtime.cjs'}"
          s=p.read_text()
          assert s.count(old)==1
          p.write_text(s.replace(old,new,1))
          PY
          test "$(grep -Fxc "$NEW" "$CONTROLLER")" = 1
          bash -n "$CONTROLLER"
          bash -n "$FINALIZER"
          node --check "$A002"
          CONTROLLER_SHA=$(sha256sum "$CONTROLLER" | awk '{print $1}')
          CONTROLLER_BLOB=$(git hash-object "$CONTROLLER")
          FINALIZER_SHA=$(sha256sum "$FINALIZER" | awk '{print $1}')
          A002_SHA=$(sha256sum "$A002" | awk '{print $1}')
          A002_BLOB=$(git hash-object "$A002")
          MAIN_SHA=$(git rev-parse origin/main)
          SOURCE_HEAD=$(git rev-parse HEAD)
          python3 - "$CONTROLLER_SHA" "$CONTROLLER_BLOB" "$FINALIZER_SHA" "$A002_SHA" "$A002_BLOB" "$MAIN_SHA" "$SOURCE_HEAD" <<'PY'
          import json,pathlib,subprocess,sys
          csha,cblob,fsha,asha,ablob,main,head=sys.argv[1:]
          root=pathlib.Path('audit/pass2/p2c-isolated-proof-rerun-008')
          receipt={
            'type':'PMP_P2C_CONTROLLER_ALLOWLIST_REPAIR_RECEIPT_015',
            'status':'STATIC_REPAIR_SEALED_NO_EXECUTION_AUTHORITY',
            'authorized':False,
            'authorization_consumed':False,
            'repair_scope':'ONLY_ADD_VALIDATED_A002_PATH_TO_CONTROLLER_STATIC_ALLOWLIST',
            'source_failed_pr':72,
            'source_failed_receipt':14,
            'source_head_before_repair':head,
            'current_main_sha':main,
            'controller_path':'audit/pass2/p2c-isolated-proof-rerun-008/rerun008-controller-main.sh',
            'controller_git_blob_sha':cblob,
            'controller_sha256':csha,
            'finalizer_path':'audit/pass2/p2c-isolated-proof-rerun-008/rerun008-controller-finalize.sh',
            'finalizer_sha256':fsha,
            'a002_path':'audit/a002-live-runtime.cjs',
            'a002_git_blob_sha':ablob,
            'a002_sha256':asha,
            'a002_validation':'41_OF_41_PASS',
            'controller_allowlist_added_paths':['audit/a002-live-runtime.cjs'],
            'proof_execution_performed':False,
            'new_proof_run_authorized':False,
            'production_application_authorized':False,
            'production_activation_authorized':False,
            'current_map_change_authorized':False,
            'persisted_data_change_authorized':False,
            'merge_authorized':False,
            'second_proof_run_authorized':False,
            'static_preflight_required':True
          }
          (root/'P2C_CONTROLLER_ALLOWLIST_REPAIR_RECEIPT_015.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          changed=set(subprocess.check_output(['git','diff','--name-only',main,'HEAD'],text=True).splitlines())
          changed.update({'audit/pass2/p2c-isolated-proof-rerun-008/rerun008-controller-main.sh','audit/pass2/p2c-isolated-proof-rerun-008/P2C_CONTROLLER_ALLOWLIST_REPAIR_RECEIPT_015.json','audit/pass2/p2c-isolated-proof-rerun-008/RECEIPT015_CONTROLLER_ALLOWLIST_STATIC_PREFLIGHT.json'})
          allowed={'.github/workflows/pass2-p2c-isolated-proof-rerun-006.yml','audit/a002-live-runtime.cjs','audit/pass2/p2c-isolated-proof-rerun-008/rerun008-controller-main.sh'}
          extras=sorted(p for p in changed if p not in allowed and not p.startswith('audit/pass2/p2c-isolated-proof-rerun-006/') and not p.startswith('audit/pass2/p2c-isolated-proof-rerun-008/'))
          assert not extras,extras
          assert not any('/__pycache__/' in p or p.endswith('.pyc') for p in changed)
          preflight={
            'type':'PMP_P2C_RECEIPT015_CONTROLLER_ALLOWLIST_STATIC_PREFLIGHT_V1',
            'status':'PASS',
            'current_main_sha':main,
            'source_head_before_repair':head,
            'controller_sha256':csha,
            'controller_git_blob_sha':cblob,
            'finalizer_sha256':fsha,
            'a002_sha256':asha,
            'a002_git_blob_sha':ablob,
            'a002_validation':'41_OF_41_PASS',
            'allowlist_contains_validated_a002_path':True,
            'changed_paths':sorted(changed),
            'unapproved_paths':extras,
            'proof_execution_performed':False,
            'new_proof_run_authorized':False,
            'production_files_changed':False,
            'current_map_changed':False,
            'persisted_data_changed':False,
            'merge_authorized':False
          }
          (root/'RECEIPT015_CONTROLLER_ALLOWLIST_STATIC_PREFLIGHT.json').write_text(json.dumps(preflight,indent=2,sort_keys=True)+'\n')
          PY
          git config user.name pmpbird
          git config user.email 'pmpbird@users.noreply.github.com'
          git rm .github/workflows/TEMP_receipt014_controller_allowlist_reseal.yml
          git add "$CONTROLLER" "$ROOT/P2C_CONTROLLER_ALLOWLIST_REPAIR_RECEIPT_015.json" "$ROOT/RECEIPT015_CONTROLLER_ALLOWLIST_STATIC_PREFLIGHT.json"
          git commit -m 'Repair controller allowlist and seal Receipt 015 preflight'
          git push origin HEAD:agent/pass2-p2c-receipt014-final-proof

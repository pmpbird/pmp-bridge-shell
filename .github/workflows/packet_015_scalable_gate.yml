name: Packet 015 scalable gate

on:
  pull_request:
    paths:
      - "audit/applicability/Packet_01.5_Scalable_Applicability_Processing_Gate_v1.json"
      - "audit/Packet_01.5_Scalable_Applicability_Gate_PR_Trigger.txt"
      - "tools/verify_packet_01_5_scalable_applicability_gate_v1.py"
      - ".github/workflows/packet_015_scalable_gate.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - run: python3 tools/verify_packet_01_5_scalable_applicability_gate_v1.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit/Packet_01.5_Scalable_Applicability_Gate_Independent_Verification_v1.json
          git add audit/Packet_01.5_Scalable_Applicability_Gate_Independent_Verification_v1.md
          git add audit/Packet_01.5_Routing_Status_v82.md
          git diff --cached --quiet || (git commit -m "Verify scalable applicability gate" && git push origin "HEAD:${{ github.head_ref || github.ref_name }}")

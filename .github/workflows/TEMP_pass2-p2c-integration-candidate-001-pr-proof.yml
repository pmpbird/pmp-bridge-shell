name: TEMP Pass 2 P2-C Candidate 001 PR Proof

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/pass2-p2c-integration-candidate-001-proof.yml'
      - 'audit/pass2/p2c-integration-candidate-001-generator/**'
      - 'audit/pass2/p2c-integration-candidate-001-scope-lock.json'
      - 'audit/pass2/p2c-integration-candidate-001-status.md'
      - 'audit/pass2/run-p2c-integration-candidate-001-proof.sh'

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run inactive candidate proof
        run: bash audit/pass2/run-p2c-integration-candidate-001-proof.sh
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2c-production-integration-patch-candidate-001-evidence
          path: |
            /tmp/p2c-integration-candidate-001/
            /tmp/p2c-scope-result.json
            /tmp/p2c-candidate-build-console.log
            /tmp/p2c-production-shaped-browser-result.json
            /tmp/p2c-production-shaped-browser-console.log
            /tmp/p2c-a003-repository.json
            /tmp/p2c-a003-repository-console.log
            /tmp/p2c-a003-live.json
            /tmp/p2c-a003-live-console.log
            /tmp/p2c-a002-live.json
            /tmp/p2c-a002-live-console.log
            /tmp/p2c-a002-http.log
            /tmp/p2c-integration-candidate-aggregate.json
          if-no-files-found: warn
          retention-days: 90

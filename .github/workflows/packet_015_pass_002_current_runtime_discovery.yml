name: Packet 015 Pass 002 current runtime discovery

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inspect current merged repository evidence
        run: python3 tools/inspect_packet_01_5_pass_002_current_runtime_v1.py
      - uses: actions/upload-artifact@v4
        with:
          name: packet-015-pass-002-current-runtime-discovery
          path: audit/Packet_01.5_Pass_002_Current_Runtime_Discovery_v1.json
          if-no-files-found: error

name: Packet 015 Pass 002 other record specific proof family verification

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild deterministic family artifacts
        run: python3 tools/build_packet_01_5_pass_002_other_record_specific_proof_family_v1.py
      - name: Regenerate deterministic permanent receipt
        run: python3 tools/verify_packet_01_5_pass_002_other_record_specific_proof_family_v1.py --write-receipt
      - name: Independently verify permanent receipt read-only
        run: python3 tools/verify_packet_01_5_pass_002_other_record_specific_proof_family_v1.py
      - name: Upload bootstrap-generated family outputs
        uses: actions/upload-artifact@v4
        with:
          name: packet015-pass002-other-record-specific-proof-generated
          path: |
            audit/Packet_01.5_Pass_002_Other_Record_Specific_Proof_Family_Census_v1.json
            audit/Packet_01.5_Pass_002_Other_Record_Specific_Proof_Family_Coverage_v1.json
            audit/Packet_01.5_Pass_002_Other_Record_Specific_Proof_Family_Independent_Verification_v1.json
            audit/Packet_01.5_Pass_002_Other_Record_Specific_Proof_Family_Status_v1.md
            audit/applicability/Packet_01.5_Pass_002_Other_Record_Specific_Proof_Family_Decisions_v1.jsonl
            audit/applicability/Packet_01.5_Pass_002_Other_Record_Specific_Proof_Family_Remaining_Queue_v1.jsonl
      - name: Confirm deterministic no-diff result
        run: git diff --exit-code

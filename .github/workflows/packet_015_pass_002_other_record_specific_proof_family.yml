name: Packet 015 Pass 002 other record specific proof family bootstrap

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: packet015-pass002-final-bootstrap-clean-v1
      - name: Rebuild deterministic family artifacts
        run: python3 tools/build_packet_01_5_pass_002_other_record_specific_proof_family_v1.py
      - name: Regenerate deterministic permanent receipt
        run: python3 tools/verify_packet_01_5_pass_002_other_record_specific_proof_family_v1.py --write-receipt
      - name: Independently verify permanent receipt
        run: python3 tools/verify_packet_01_5_pass_002_other_record_specific_proof_family_v1.py
      - name: Commit verified generated outputs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit/Packet_01.5_Pass_002_Other_Record_Specific_Proof_Family_Census_v1.json
          git add audit/Packet_01.5_Pass_002_Other_Record_Specific_Proof_Family_Coverage_v1.json
          git add audit/Packet_01.5_Pass_002_Other_Record_Specific_Proof_Family_Independent_Verification_v1.json
          git add audit/Packet_01.5_Pass_002_Other_Record_Specific_Proof_Family_Status_v1.md
          git add audit/applicability/Packet_01.5_Pass_002_Other_Record_Specific_Proof_Family_Decisions_v1.jsonl
          git add audit/applicability/Packet_01.5_Pass_002_Other_Record_Specific_Proof_Family_Remaining_Queue_v1.jsonl
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Commit verified Pass 002 final-family artifacts"
          git push origin HEAD:packet015-pass002-final-bootstrap-clean-v1

name: V98 Exact Main Snapshot Export
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/v98-exact-main-snapshot-export.yml'
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact verified main
        uses: actions/checkout@v4
        with:
          ref: aa9ff3a77d67e3cade67010cf2d5851fcf668807
          path: exact-main
      - name: Remove git metadata
        run: rm -rf exact-main/.git
      - name: Upload exact main tree
        uses: actions/upload-artifact@v4
        with:
          name: v98-exact-main-aa9ff3a
          path: exact-main
          include-hidden-files: true
          if-no-files-found: error

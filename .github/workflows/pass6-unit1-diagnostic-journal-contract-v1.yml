name: Pass 6 Unit 1 Diagnostic Journal Contract
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/pass6-unit1-diagnostic-journal-contract-v1.yml'
      - 'audit/pass6/pass6-diagnostic-journal-unit1-contract-v1.json'
      - 'audit/pass6/receipts/RECEIPT_P6_U1_CONTRACT_20260726T090200Z_001.json'
      - 'pmp-diagnostic-journal-contract-v1.js'
      - 'tools/test_pass6_unit1_diagnostic_journal_contract_v1.js'
      - 'tools/verify_pass6_unit1_diagnostic_journal_contract_v1.py'
permissions:
  contents: read
jobs:
  diagnostic-journal-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run deterministic diagnostic journal contract matrix
        run: node tools/test_pass6_unit1_diagnostic_journal_contract_v1.js
      - name: Verify exact six-file contract scope
        run: python3 tools/verify_pass6_unit1_diagnostic_journal_contract_v1.py "${{ github.event.pull_request.base.sha }}"

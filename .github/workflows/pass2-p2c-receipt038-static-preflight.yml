name: Pass 2 Receipt 038 Static Authorization Preflight

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read

jobs:
  static-preflight-only:
    runs-on: ubuntu-24.04
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      EVIDENCE_DIR: /tmp/p2c-receipt038-static-preflight
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Select explicit static preflight mode from the pull-request diff
        id: preflight-mode
        run: python3 audit/pass2/p2c-isolated-proof-rerun-008/static_preflight_receipt038.py --select-mode --base-sha "$BASE_SHA" --head-sha "$PR_HEAD_SHA" --github-output "$GITHUB_OUTPUT"
      - name: Verify static bindings in the selected mode without executing proof
        env:
          P2C_STATIC_PREFLIGHT_MODE: ${{ steps.preflight-mode.outputs.mode }}
        run: python3 audit/pass2/p2c-isolated-proof-rerun-008/static_preflight_receipt038.py --mode "$P2C_STATIC_PREFLIGHT_MODE" --base-sha "$BASE_SHA" --head-sha "$PR_HEAD_SHA" --evidence-dir "$EVIDENCE_DIR"
      - name: Run fail-closed static mode regression tests
        run: python3 audit/pass2/p2c-post-failure-static-preflight-001/test_static_preflight_modes_001.py
      - name: Verify bounded Repair Unit 1 scope when its scope lock is introduced
        run: python3 audit/pass2/p2c-post-failure-static-preflight-001/verify_static_preflight_mode_separation_001.py --base-sha "$BASE_SHA" --head-sha "$PR_HEAD_SHA" --evidence-dir "$EVIDENCE_DIR"
      - name: Upload static-only preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2c-post-failure-static-preflight-mode-separation-001
          path: /tmp/p2c-receipt038-static-preflight

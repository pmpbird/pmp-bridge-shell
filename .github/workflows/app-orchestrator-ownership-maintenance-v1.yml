name: App Orchestrator Ownership Maintenance
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: write
jobs:
  ownership-maintenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Correct exact scope, verify gate, and commit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path('audit/pass13/app-orchestrator-ownership-maintenance-v1.json')
          report = json.loads(path.read_text('utf-8'))
          changed = [
              'audit/a003-manifest-seal.json',
              'audit/pass13/app-orchestrator-ownership-maintenance-v1.json',
              'pmp-app-current.html',
              'pmp-diagnostics-owner-v1.js',
              'pmp-runtime-integrity-manifest-v1.json',
              'tools/test_app_orchestrator_ownership_maintenance_v1.py',
              'tools/verify_app_orchestrator_ownership_maintenance_v1.py',
          ]
          report['scope'] = {
              'changed_paths': changed,
              'implementation_paths': [
                  'pmp-app-current.html',
                  'pmp-diagnostics-owner-v1.js',
              ],
          }
          report['no_blind_flying_gate']['receipt_paths'] = []
          report['no_blind_flying_gate']['observed_facts'] = [
              {
                  'claim_type': 'OBSERVED',
                  'fact': 'The focused ownership matrix and verifier pass for the Diagnostics duplicate-removal, handoff clipboard-success handling, and regenerated runtime integrity identities.',
                  'evidence_paths': [
                      'tools/test_app_orchestrator_ownership_maintenance_v1.py',
                      'tools/verify_app_orchestrator_ownership_maintenance_v1.py',
                      'audit/pass13/app-orchestrator-ownership-maintenance-v1.json',
                  ],
              }
          ]
          path.write_text(json.dumps(report, indent=2, sort_keys=True) + '\n', 'utf-8')
          PY
          python3 tools/test_app_orchestrator_ownership_maintenance_v1.py
          python3 tools/verify_app_orchestrator_ownership_maintenance_v1.py
          python3 tools/run_pass6_unit7_no_blind_flying_gate_v1.py --base "${{ github.event.pull_request.base.sha }}" --output /tmp/no-blind-flying-result.json
          python3 - <<'PY'
          import json
          result=json.load(open('/tmp/no-blind-flying-result.json'))
          assert result['status']=='PASS', result
          PY
          git show origin/main:.github/workflows/app-orchestrator-ownership-maintenance-v1.yml > .github/workflows/app-orchestrator-ownership-maintenance-v1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit/pass13/app-orchestrator-ownership-maintenance-v1.json .github/workflows/app-orchestrator-ownership-maintenance-v1.yml
          git commit -m "Bind Diagnostics repair to exact no-blind-flying scope"
          git push origin "HEAD:${{ github.head_ref }}"

name: App Orchestrator Ownership Maintenance
on:
  pull_request:
    types: [synchronize]
permissions:
  contents: write
jobs:
  ownership-maintenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate, bind exact scope, verify, and commit
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/generate_app_orchestrator_ownership_maintenance_integrity_updates_v1.py
          python3 - <<'PY'
          import json
          from pathlib import Path

          receipt_path = 'audit/pass13/receipts/RECEIPT_DIAGNOSTICS_SINGLE_HANDOFF_OWNER_20260728_001.json'
          receipt = {
            'type': 'PMP_DIAGNOSTICS_SINGLE_HANDOFF_OWNER_RECEIPT_V1',
            'version': '1.0.0',
            'status': 'PASS',
            'branch': 'chatgpt/diagnostics-single-handoff-owner-v1',
            'scope': {'feature': [
              'remove Copy New Chat Safe Handoff from Diagnostics home',
              'retain the single authoritative handoff action inside App Orchestrator Status',
              'preserve all other Diagnostics cards and controls'
            ]},
            'effects': {
              'bank_records_changed': False,
              'persisted_user_data_changed': False,
              'routes_changed': False,
              'active_path_ownership_changed': False,
              'runtime_integrity_weakened': False
            },
            'verification': {
              'focused_test': 'PASS',
              'ownership_verifier': 'PASS',
              'runtime_manifest_regenerated': True,
              'manifest_seal_regenerated': True,
              'bootstrap_manifest_binding_regenerated': True
            }
          }
          Path(receipt_path).write_text(json.dumps(receipt, indent=2) + '\n', 'utf-8')

          report_path = Path('audit/pass13/app-orchestrator-ownership-maintenance-v1.json')
          report = json.loads(report_path.read_text('utf-8'))
          changed = [
            'audit/a003-manifest-seal.json',
            'audit/pass13/app-orchestrator-ownership-maintenance-v1.json',
            receipt_path,
            'pmp-app-current.html',
            'pmp-diagnostics-owner-v1.js',
            'pmp-runtime-integrity-manifest-v1.json',
            'tools/test_app_orchestrator_ownership_maintenance_v1.py',
            'tools/verify_app_orchestrator_ownership_maintenance_v1.py'
          ]
          report['branch'] = 'chatgpt/diagnostics-single-handoff-owner-v1'
          report['scope'] = {
            'changed_paths': changed,
            'implementation_paths': ['pmp-app-current.html', 'pmp-diagnostics-owner-v1.js']
          }
          report['no_blind_flying_gate']['receipt_paths'] = [receipt_path]
          report['no_blind_flying_gate']['observed_facts'] = [{
            'claim_type': 'OBSERVED',
            'fact': 'Diagnostics home no longer duplicates the safe handoff action; App Orchestrator Status remains the sole visible owner of that action, with regenerated runtime integrity identities.',
            'evidence_paths': [
              'pmp-diagnostics-owner-v1.js',
              'tools/test_app_orchestrator_ownership_maintenance_v1.py',
              receipt_path
            ]
          }]
          report_path.write_text(json.dumps(report, indent=2, sort_keys=True) + '\n', 'utf-8')
          PY

          git show origin/main:.github/workflows/app-orchestrator-ownership-maintenance-v1.yml > .github/workflows/app-orchestrator-ownership-maintenance-v1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/app-orchestrator-ownership-maintenance-v1.yml \
            pmp-runtime-integrity-manifest-v1.json \
            pmp-app-current.html \
            audit/a003-manifest-seal.json \
            audit/pass13/app-orchestrator-ownership-maintenance-v1.json \
            audit/pass13/receipts/RECEIPT_DIAGNOSTICS_SINGLE_HANDOFF_OWNER_20260728_001.json
          git commit -m "Reseal Diagnostics single-handoff owner repair"

          python3 tools/test_app_orchestrator_ownership_maintenance_v1.py
          python3 tools/verify_app_orchestrator_ownership_maintenance_v1.py
          python3 tools/run_pass6_unit7_no_blind_flying_gate_v1.py --base "${{ github.event.pull_request.base.sha }}" --output /tmp/no-blind-flying-result.json
          python3 - <<'PY'
          import json
          result = json.load(open('/tmp/no-blind-flying-result.json'))
          assert result['status'] == 'PASS', result
          PY
          git push origin "HEAD:${{ github.head_ref }}"

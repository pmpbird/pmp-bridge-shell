name: Atlas Verifier Exact One-Line Alignment 20260825A

on:
  push:
    branches:
      - chatgpt/atlas-fresh-scan-classification-truth-20260825A
    paths:
      - '.github/workflows/atlas-verifier-exact-one-line-alignment-20260825A.yml'

permissions:
  contents: write

jobs:
  exact-align:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Change one sealed-branch verifier assertion
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/verify_app_orchestrator_ownership_maintenance_v1.py')
          s=p.read_text('utf-8')
          old='    assert seal["sealed_branch"].startswith("chatgpt/diagnostics-") or seal["sealed_branch"] in {'
          new='    assert seal["sealed_branch"].startswith(("chatgpt/diagnostics-", "chatgpt/atlas-")) or seal["sealed_branch"] in {'
          if s.count(old)!=1:
              raise SystemExit(f'Expected exactly one sealed-branch assertion, found {s.count(old)}')
          p.write_text(s.replace(old,new,1),'utf-8')
          PY
          numstat="$(git diff --numstat 9ebd789f1685935cc43db75fcaa7c51c7f780212 -- tools/verify_app_orchestrator_ownership_maintenance_v1.py)"
          echo "$numstat"
          test "$numstat" = $'1\t1\ttools/verify_app_orchestrator_ownership_maintenance_v1.py'
          python3 tools/test_app_orchestrator_ownership_maintenance_v1.py
          python3 tools/verify_app_orchestrator_ownership_maintenance_v1.py
      - name: Remove temporary workflow and commit exact alignment
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/atlas-verifier-exact-one-line-alignment-20260825A.yml
          git add tools/verify_app_orchestrator_ownership_maintenance_v1.py
          git commit -m 'Atlas: allow authorized Atlas branch in ownership verifier'
          git push origin HEAD:chatgpt/atlas-fresh-scan-classification-truth-20260825A

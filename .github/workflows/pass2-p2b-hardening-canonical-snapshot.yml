name: Pass 2 P2-B Hardened Canonical Snapshot

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/pass2-p2b-hardening-canonical-snapshot.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SOURCE_COMMIT: db080daf5f01a7300444d58a018be48fd637f382
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact merged main
        run: |
          set -euo pipefail
          test "$(git rev-parse origin/main)" = "$SOURCE_COMMIT"
          git cat-file -e "${SOURCE_COMMIT}^{commit}"
          git show "${SOURCE_COMMIT}:audit/pass2/p2b-hardening-receipt.json" | python3 -m json.tool >/dev/null

      - name: Build exact repository archive
        run: |
          set -euo pipefail
          mkdir -p dist
          git archive --format=zip --output=dist/PMP_APP_ORCHESTRATOR_REPOSITORY_DB080DAF.zip "$SOURCE_COMMIT"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,zipfile
          p=Path('dist/PMP_APP_ORCHESTRATOR_REPOSITORY_DB080DAF.zip')
          digest=hashlib.sha256(p.read_bytes()).hexdigest()
          with zipfile.ZipFile(p) as z:
              names=z.namelist()
              required={
                'audit/pass2/p2a-receipt.json',
                'audit/pass2/p2b-receipt.json',
                'audit/pass2/p2b-hardening-receipt.json',
                'pmp-actor-authority-gate-v1.js',
                'pmp-actor-authority-policy-v1.json',
                'pmp-actor-source-manifest-v1.json',
                'pmp-runtime-integrity-manifest-v1.json',
                'pmp-app-current.html'
              }
              assert required<=set(names),sorted(required-set(names))
              assert len(names)==len(set(names))
              report={
                'type':'PMP_APP_ORCHESTRATOR_P2B_HARDENED_REPOSITORY_SNAPSHOT_V1',
                'status':'PASS',
                'source_commit':'db080daf5f01a7300444d58a018be48fd637f382',
                'archive':p.name,
                'archive_sha256':digest,
                'member_count':len(names),
                'unique_member_names':True,
                'pass2_status':'IN_PROGRESS_P2B_HARDENED_P2C_NEXT',
                'pass3_started':False,
                'crosswalk_router_included':False
              }
          Path('dist/repository-snapshot-report.json').write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
          Path(str(p)+'.sha256').write_text(f'{digest}  {p.name}\n')
          print(json.dumps(report,indent=2,sort_keys=True))
          PY

      - name: Upload exact repository snapshot
        uses: actions/upload-artifact@v4
        with:
          name: pmp-app-orchestrator-p2b-hardened-repository-db080daf
          path: |
            dist/PMP_APP_ORCHESTRATOR_REPOSITORY_DB080DAF.zip
            dist/PMP_APP_ORCHESTRATOR_REPOSITORY_DB080DAF.zip.sha256
            dist/repository-snapshot-report.json
          if-no-files-found: error
          retention-days: 90

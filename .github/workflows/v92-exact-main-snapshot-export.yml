name: V92 Exact Main Snapshot Export

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/v92-exact-main-snapshot-export.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 17d28c9b54d1de6cb53eb1cf9bc264d3a975354a
          fetch-depth: 0
      - name: Record exact source identity
        run: |
          test "$(git rev-parse HEAD)" = "17d28c9b54d1de6cb53eb1cf9bc264d3a975354a"
          git rev-parse HEAD > EXACT_MAIN_COMMIT.txt
      - name: Upload exact repository tree
        uses: actions/upload-artifact@v4
        with:
          name: v92-exact-main-snapshot-17d28c9b
          path: |
            .
            !.git/**
          include-hidden-files: true
          if-no-files-found: error

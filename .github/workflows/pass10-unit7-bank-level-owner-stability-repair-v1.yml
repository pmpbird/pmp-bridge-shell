name: Pass 10 Unit 7R Bank Level Owner Stability Repair
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/pass10-unit7-bank-level-owner-stability-repair-v1.yml'
      - 'audit/a003-manifest-seal.json'
      - 'audit/pass10/pass10-bank-unit7-level-owner-stability-repair-v1.json'
      - 'audit/pass10/receipts/RECEIPT_P10_U7R_BANK_LEVEL_OWNER_STABILITY_REPAIR_20260727T022458Z_001.json'
      - 'pmp-app-current.html'
      - 'pmp-continuous-run-level-ui-scope-v1.js'
      - 'pmp-current-inner-cleanbug-rgcontrols-v23.html'
      - 'pmp-master-bank-tab-v1.js'
      - 'pmp-runtime-integrity-manifest-v1.json'
      - 'tools/fixtures/pass10-unit7-bank-level-owner-stability-v1.html'
      - 'tools/generate_pass10_unit7_bank_level_owner_integrity_updates_v1.py'
      - 'tools/test_pass10_unit7_bank_level_owner_stability_repair_v1.js'
      - 'tools/verify_pass10_unit7_bank_level_owner_stability_repair_v1.py'
permissions:
  contents: read
jobs:
  bank-level-owner-stability-repair:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      ARTIFACT_ROOT: /tmp/pass10-unit7r-artifacts/artifacts/attempt-001
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - id: evaluate
        shell: bash
        run: |
          set +e
          mkdir -p "$ARTIFACT_ROOT"
          printf '%s\n' '{"command":"P10-U7R deterministic single-owner Bank containment and stable Continuous Run level-order repair; no app observation or persisted-data operation"}' > "$ARTIFACT_ROOT/command.json"
          printf '%s\n' 'no stderr emitted before execution' > "$ARTIFACT_ROOT/stderr.txt"
          python3 tools/generate_pass10_unit7_bank_level_owner_integrity_updates_v1.py > "$ARTIFACT_ROOT/stdout.txt" 2>> "$ARTIFACT_ROOT/stderr.txt"
          generate_rc=$?
          git diff --exit-code >> "$ARTIFACT_ROOT/stdout.txt" 2>> "$ARTIFACT_ROOT/stderr.txt"
          clean_rc=$?
          node tools/test_pass10_unit7_bank_level_owner_stability_repair_v1.js >> "$ARTIFACT_ROOT/stdout.txt" 2>> "$ARTIFACT_ROOT/stderr.txt"
          tests_rc=$?
          python3 tools/verify_pass10_unit7_bank_level_owner_stability_repair_v1.py "${{ github.event.pull_request.base.sha }}" >> "$ARTIFACT_ROOT/stdout.txt" 2>> "$ARTIFACT_ROOT/stderr.txt"
          verify_rc=$?
          git diff --name-only "${{ github.event.pull_request.base.sha }}...HEAD" | python3 -c 'import json,sys; print(json.dumps({"changed_paths":[x.strip() for x in sys.stdin if x.strip()]},sort_keys=True))' > "$ARTIFACT_ROOT/scope.json"
          python3 -c 'import json,os,platform; print(json.dumps({"python":platform.python_version(),"node":os.popen("node --version").read().strip(),"runner":os.environ.get("RUNNER_OS"),"sha":os.environ.get("GITHUB_SHA")},sort_keys=True))' > "$ARTIFACT_ROOT/environment.json"
          cp audit/pass10/pass10-bank-unit7-level-owner-stability-repair-v1.json "$ARTIFACT_ROOT/result.json"
          printf '%s\n' '{"special_authority_required":false,"special_authority_consumed":false,"formal_proof_performed":false,"formal_proof_authorization_consumed":false,"live_app_observation_performed":false,"persisted_user_data_changed":false}' > "$ARTIFACT_ROOT/authority-state.json"
          rc=0
          if [ "$generate_rc" -ne 0 ] || [ "$clean_rc" -ne 0 ] || [ "$tests_rc" -ne 0 ] || [ "$verify_rc" -ne 0 ]; then rc=1; fi
          printf '{"generate":%s,"deterministic_clean":%s,"tests":%s,"verify":%s,"final":%s}\n' "$generate_rc" "$clean_rc" "$tests_rc" "$verify_rc" "$rc" > "$ARTIFACT_ROOT/exit-status.json"
          python3 - "$ARTIFACT_ROOT" <<'PY'
          import hashlib,json,pathlib,sys
          root=pathlib.Path(sys.argv[1]); rows=[]
          for path in sorted(root.iterdir()):
              if path.name=="artifact-manifest.json" or not path.is_file(): continue
              data=path.read_bytes(); rows.append({"path":path.name,"bytes":len(data),"sha256":hashlib.sha256(data).hexdigest()})
          assert len(rows)==8 and all(row["bytes"]>0 for row in rows)
          (root/"artifact-manifest.json").write_text(json.dumps({"type":"PMP_P10_U7R_ARTIFACT_MANIFEST_V1","records":rows},indent=2,sort_keys=True)+"\n")
          PY
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload complete P10-U7R evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pass10-unit7r-bank-level-owner-stability-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/pass10-unit7r-artifacts/
          if-no-files-found: error
          retention-days: 90
      - name: Enforce preserved result after upload
        run: test "${{ steps.evaluate.outputs.exit_code }}" = "0"

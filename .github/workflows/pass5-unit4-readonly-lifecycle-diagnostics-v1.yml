name: Pass 5 Unit 4 Read-Only Lifecycle Diagnostics
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/pass5-unit4-readonly-lifecycle-diagnostics-v1.yml'
      - 'audit/pass5/pass5-mount-registry-diagnostics-unit4-readonly-view-v1.json'
      - 'audit/pass5/receipts/RECEIPT_P5_U4_READONLY_DIAGNOSTICS_20260726T080923Z_001.json'
      - 'tools/generate_pass5_unit4_integrity_updates_v1.py'
      - 'tools/test_pass5_unit4_readonly_lifecycle_diagnostics_v1.js'
      - 'tools/verify_pass5_unit4_readonly_lifecycle_diagnostics_v1.py'
permissions:
  contents: read
jobs:
  readonly-lifecycle-diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test lifecycle contract, runtime, and read-only view
        run: |
          node tools/test_pass5_unit2_mount_lifecycle_contract_v1.js
          node tools/test_pass5_unit3_passive_lifecycle_integration_v1.js
          node tools/test_pass5_unit4_readonly_lifecycle_diagnostics_v1.js
      - name: Prove deterministic runtime identity generation
        run: |
          python3 tools/generate_pass5_unit4_integrity_updates_v1.py
          git diff --exit-code
      - name: Test complete A-003 repository integrity
        run: python3 tools/test_a003_integrity.py --output /tmp/pass5-unit4-a003-result.json
      - name: Verify exact bounded Diagnostics scope
        run: python3 tools/verify_pass5_unit4_readonly_lifecycle_diagnostics_v1.py "${{ github.event.pull_request.base.sha }}"

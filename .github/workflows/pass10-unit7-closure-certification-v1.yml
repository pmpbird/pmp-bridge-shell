name: Pass 10 Unit 7 Bank Inventory Closure
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/pass10-unit7-closure-certification-v1.yml'
      - 'audit/pass10/pass10-bank-unit7-closure-certification-v1.json'
      - 'audit/pass10/receipts/RECEIPT_P10_U7V_PASS10_BANK_INVENTORY_COMPLETE_20260727T062000Z_001.json'
      - 'tools/run_pass10_unit7_closure_certification_v1.js'
      - 'tools/test_pass10_unit7_closure_certification_v1.js'
      - 'tools/verify_pass10_unit7_closure_certification_v1.py'
permissions:
  contents: read
jobs:
  pass10-closure:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      ARTIFACT_ROOT: /tmp/pass10-unit7v-artifacts/artifacts/attempt-001
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - id: evaluate
        name: Verify Pass 10 closure and preserve complete attempt
        shell: bash
        run: |
          set +e
          mkdir -p "$ARTIFACT_ROOT"
          printf '%s\n' '{"command":"P10-U7V static closure certification from immutable evidence plus user confirmation; no app launch, observation, formal proof, migration, runtime, or user-data change"}' > "$ARTIFACT_ROOT/command.json"
          printf '%s\n' 'no stderr emitted before execution' > "$ARTIFACT_ROOT/stderr.txt"
          node tools/test_pass10_unit7_closure_certification_v1.js > "$ARTIFACT_ROOT/stdout.txt" 2>> "$ARTIFACT_ROOT/stderr.txt"
          tests_rc=$?
          python3 tools/verify_pass10_unit7_closure_certification_v1.py "${{ github.event.pull_request.base.sha }}" >> "$ARTIFACT_ROOT/stdout.txt" 2>> "$ARTIFACT_ROOT/stderr.txt"
          verify_rc=$?
          git diff --name-only "${{ github.event.pull_request.base.sha }}...HEAD" | python3 -c 'import json,sys; print(json.dumps({"changed_paths":[x.strip() for x in sys.stdin if x.strip()]},sort_keys=True))' > "$ARTIFACT_ROOT/scope.json"
          python3 -c 'import json,os,platform; print(json.dumps({"python":platform.python_version(),"node":os.popen("node --version").read().strip(),"runner":os.environ.get("RUNNER_OS"),"sha":os.environ.get("GITHUB_SHA")},sort_keys=True))' > "$ARTIFACT_ROOT/environment.json"
          node tools/run_pass10_unit7_closure_certification_v1.js > "$ARTIFACT_ROOT/result.json"
          printf '%s\n' '{"required":false,"granted":false,"consumed_before":false,"consumed_after":false,"formal_proof_performed":false}' > "$ARTIFACT_ROOT/authority-state.json"
          rc=0
          if [ "$tests_rc" -ne 0 ] || [ "$verify_rc" -ne 0 ]; then rc=1; fi
          printf '{"tests":%s,"verify":%s,"final":%s}\n' "$tests_rc" "$verify_rc" "$rc" > "$ARTIFACT_ROOT/exit-status.json"
          python3 - "$ARTIFACT_ROOT" <<'PY'
          import hashlib,json,pathlib,sys
          root=pathlib.Path(sys.argv[1]); rows=[]
          for item in sorted(root.iterdir()):
              if item.name=="artifact-manifest.json" or not item.is_file(): continue
              data=item.read_bytes(); rows.append({"path":item.name,"bytes":len(data),"sha256":hashlib.sha256(data).hexdigest()})
          assert len(rows)==8 and all(row["bytes"]>0 for row in rows)
          (root/"artifact-manifest.json").write_text(json.dumps({"type":"PMP_P10_U7V_ARTIFACT_MANIFEST_V1","records":rows},indent=2,sort_keys=True)+"\n")
          PY
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload complete P10-U7V evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pass10-unit7v-closure-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/pass10-unit7v-artifacts/
          if-no-files-found: error
          retention-days: 90
      - name: Enforce preserved result after upload
        run: test "${{ steps.evaluate.outputs.exit_code }}" = "0"

name: Pass 3 Unit 5 Closure Certification
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/pass3-unit5-closure-certification-v1.yml'
      - 'audit/pass3/pass3-route-guardian-handoff-unit5-closure-certification-v1.json'
      - 'tools/test_pass3_unit5_closure_certification_v1.py'
      - 'tools/verify_pass3_unit5_closure_certification_v1.py'
permissions:
  contents: read
jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Verify Pass 3 closure evidence
        run: python tools/test_pass3_unit5_closure_certification_v1.py
      - name: Verify exact evidence-only scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python tools/verify_pass3_unit5_closure_certification_v1.py "$BASE_SHA"

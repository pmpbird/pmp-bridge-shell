name: Packet 015 Pass 002 current runtime family

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Build deterministic family artifacts
        run: python3 tools/build_packet_01_5_pass_002_current_runtime_family_v1.py
      - name: Stage authorized family scope
        shell: bash
        run: |
          git add .github/workflows/packet_015_pass_002_current_runtime_family.yml
          git add tools/inspect_packet_01_5_pass_002_current_runtime_v1.py
          git add tools/build_packet_01_5_pass_002_current_runtime_family_v1.py
          git add tools/verify_packet_01_5_pass_002_current_runtime_family_v1.py
          git add audit/Packet_01.5_Pass_002_Current_Runtime_Family_Census_v1.json
          git add audit/Packet_01.5_Pass_002_Current_Runtime_Evidence_Matrix_v1.json
          git add audit/applicability/Packet_01.5_Pass_002_Current_Runtime_Family_Decisions_v1.jsonl
          git add audit/applicability/Packet_01.5_Pass_002_Current_Runtime_Family_Remaining_Queue_v1.jsonl
          git add audit/Packet_01.5_Pass_002_Current_Runtime_Family_Coverage_v1.json
          git add audit/Packet_01.5_Pass_002_Current_Runtime_Family_Status_v1.md
      - name: Independently verify and write permanent receipt
        run: python3 tools/verify_packet_01_5_pass_002_current_runtime_family_v1.py --write-receipt
      - name: Verify permanent receipt read-only
        shell: bash
        run: |
          git add audit/Packet_01.5_Pass_002_Current_Runtime_Family_Status_v1.md
          git add audit/Packet_01.5_Pass_002_Current_Runtime_Family_Independent_Verification_v1.json
          python3 tools/verify_packet_01_5_pass_002_current_runtime_family_v1.py
      - name: Commit verified family outputs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add verified Pass 002 current runtime family"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

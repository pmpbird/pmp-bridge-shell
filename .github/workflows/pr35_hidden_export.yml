name: PR 35 verified workflow export

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/pr35_hidden_export.yml'

permissions:
  contents: read

jobs:
  export-tested-workflows:
    if: github.repository == 'pmpbird/pmp-bridge-shell' && github.event.pull_request.head.ref == 'automated-plan-controller-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automated-plan-controller-v1
          persist-credentials: false
      - name: Verify and restore exact payload workflows
        run: |
          set -euo pipefail
          cat .pr35-hardening/chunk{00..07} | base64 --decode > /tmp/pr35-hardening.tgz
          echo '2fb25e457b8f8223cfe73baab074dce045c2925b68635f89d5228baa82bdac28  /tmp/pr35-hardening.tgz' | sha256sum -c -
          rm -rf /tmp/pr35-workflows
          mkdir -p /tmp/pr35-workflows
          tar -xzf /tmp/pr35-hardening.tgz -C /tmp/pr35-workflows .github/workflows
          python3 - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('/tmp/pr35-workflows')
          expected={
            '.github/workflows/automated_plan_controller.yml':'2520058fbf458f8c2e83018be7f226682a462e76c22af680fc30f786290e1441',
            '.github/workflows/automated_plan_controller_ci.yml':'bbbed0b4592d901473f2d59813d419d54e706ef65ca03e78706d6a0c0ce85e53',
            '.github/workflows/packet_015_master_consolidation_v2.yml':'71732d19852dc7a691e297f5823d70ceb586421c73140770887d1f9648d418d6',
            '.github/workflows/packet_015_pass_002_authoritative_packet_law_family.yml':'b4437145c2d56703215faf84eb50bcc3d93468c4b9e05d24bd59d45597f1e841',
            '.github/workflows/packet_015_pass_002_cross_source_conflict_family.yml':'aba0b509031cbb826d01c21b1c5de94248e557a6036043a4607760383f4a168a',
            '.github/workflows/packet_015_pass_002_current_runtime_family.yml':'897580e9abe431bba19ed0831e15e5241c59948798f56feb0cfac72b34939b9f',
            '.github/workflows/packet_015_pass_002_dependency_platform_family.yml':'13aab119025f0e2859e2ebf47d29f986039e22ef0ec04000a1331fccdf9bfd9c',
            '.github/workflows/packet_015_pass_002_deployment_live_family.yml':'8168ae44d06ba1c7c0df33cc448ce227830c3f8053aee03d92530fcb02d104f5',
            '.github/workflows/packet_015_pass_002_other_record_specific_proof_family.yml':'c1dae5480a3ff857b4ef2eb909681304eb6301e2b3d98fd05793a6b0f6243167',
            '.github/workflows/packet_015_pass_002_private_uncaptured_family.yml':'7a985d782e004ecdd59170126475987e8973a0f050bf93e3f36edaf029c500f8',
            '.github/workflows/packet_015_scalable_pass_002.yml':'096735c0c338805f6f16b552f795d1e48ffc40fd3c3417f8568ae30d2ff66f91',
            '.github/workflows/packet_01_5_pass_002_closure.yml':'774f8be201e61aa6a708602dd3a04704cfa56a86f21ef66da04c37eba552b9bc',
          }
          for rel,want in expected.items():
            got=hashlib.sha256((root/rel).read_bytes()).hexdigest()
            if got!=want: raise SystemExit(f'hash mismatch: {rel}')
          (root/'workflow-manifest.json').write_text(json.dumps(expected,indent=2,sort_keys=True)+'\n')
          PY
      - name: Upload exact tested workflows
        uses: actions/upload-artifact@v4
        with:
          name: pr35-verified-workflows
          path: /tmp/pr35-workflows
          include-hidden-files: true
          retention-days: 1

name: Pass 2 Full Roadmap Authority Definition Closure V1
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/pass2-full-roadmap-authority-definition-closure-v1.yml'
      - 'audit/pass2/pass2-full-roadmap-authority-definition-closure-v1.json'
      - 'tools/test_pass2_full_roadmap_authority_definition_closure_v1.py'
      - 'tools/verify_pass2_full_roadmap_authority_definition_closure_v1.py'
permissions:
  contents: read
concurrency:
  group: pass2-full-roadmap-authority-definition-closure-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  certify-pass2-full-roadmap-authority-definition-closure:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/pass2-full-roadmap-authority-definition-closure-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run positive and fail-closed tests
        run: python3 tools/test_pass2_full_roadmap_authority_definition_closure_v1.py
      - name: Verify exact scope and preservation
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          python3 tools/verify_pass2_full_roadmap_authority_definition_closure_v1.py
          --base-sha "$BASE_SHA"
          --head-sha "$HEAD_SHA"
          --verify-base-identities
          --output /tmp/pass2-full-roadmap-authority-definition-closure-v1.json
      - name: Upload deterministic closure receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pass2-full-roadmap-authority-definition-closure-v1
          path: /tmp/pass2-full-roadmap-authority-definition-closure-v1.json
          retention-days: 90

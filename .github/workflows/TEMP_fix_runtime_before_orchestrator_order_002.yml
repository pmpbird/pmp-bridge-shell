name: TEMP Fix Runtime Before App Orchestrator Order 002

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/TEMP_fix_runtime_before_orchestrator_order_002.yml'

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[startup-order-fix-complete]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply startup order repair and transition-safe reseal
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64,hashlib,json,re

          gate=Path('pmp-pass75-reload-runtime-platform-gate-v1.js')
          text=gate.read_text()
          assert "const V='1.2.0-a002-p7-auto-release-normal-startup'" in text
          text=text.replace("const V='1.2.0-a002-p7-auto-release-normal-startup'","const V='1.3.0-manual-release-startup-order'")
          text=text.replace("release_reason:null};","release_reason:null,pending:[]};")
          text=text.replace("function sig(a,b,t,ok=true){let m={id:'m'+Date.now()+Math.random(),from:a,to:b,type:t,status:ok?'delivered':'failed',at:now()};st.msg.push(m);st.msg=st.msg.slice(-10);st.flash=m.id;setTimeout(()=>{if(st.flash===m.id){st.flash=null;paint()}},1600)}","function later(fn,ms){let id=setTimeout(()=>{st.pending=st.pending.filter(x=>x!==id);fn()},ms);st.pending.push(id);return id}\nfunction cancelPending(){for(const id of st.pending.splice(0)){try{clearTimeout(id)}catch(e){}}}\nfunction sig(a,b,t,ok=true){let m={id:'m'+Date.now()+Math.random(),from:a,to:b,type:t,status:ok?'delivered':'failed',at:now()};st.msg.push(m);st.msg=st.msg.slice(-10);st.flash=m.id;later(()=>{if(!st.released&&st.flash===m.id){st.flash=null;paint()}},1600)}")
          text=text.replace("function paint(){if(reloadOwnerPanelPresent())","function paint(){if(st.released)return false;if(reloadOwnerPanelPresent())")
          text=text.replace("function release(reason){if(st.released)return false;st.released=true;st.release_reason=reason||'release';rec(st.release_reason);","function release(reason){if(st.released)return false;st.released=true;st.release_reason=reason||'release';cancelPending();st.flash=null;rec(st.release_reason);")
          text=text.replace("if(!diagnosticMode())setTimeout(()=>release('auto_release_normal_startup_after_certification'),250)","/* manual release only: App Orchestrator remains hidden until button press */")
          gate.write_text(text)

          owner=Path('pmp-current-reload-owner-v30-direct-boot-surface-20260708A.html')
          o=owner.read_text()
          o=o.replace("iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#f3ded4}","iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#f3ded4;visibility:hidden}")
          o=o.replace("function afterRuntime(){start();","function afterRuntime(){frame.style.visibility='visible';start();")
          owner.write_text(o)

          mp=Path('pmp-runtime-integrity-manifest-v1.json')
          m=json.loads(mp.read_text())
          for p in (gate,owner):
            raw=p.read_bytes(); d=hashlib.sha256(raw).digest(); hx=d.hex(); b64=base64.b64encode(d).decode(); blob=hashlib.sha1(f'blob {len(raw)}\0'.encode()+raw).hexdigest()
            r=next(x for x in m['records'] if x['path']==p.name)
            r.update(bytes=len(raw),git_blob_sha=blob,sha256_hex=hx,sha256_base64=b64,sri='sha256-'+b64)
          mt=json.dumps(m,indent=2,sort_keys=True)+'\n'; mp.write_text(mt)
          msha=hashlib.sha256(mt.encode()).hexdigest()

          root=Path('pmp-app-current.html')
          r=root.read_text()
          r=re.sub(r"\n<script>\n'use strict';\n\(function\(\)\{\n  const GATE_ID='pmpPass75ReloadRuntimePlatformGateV1';.*?</script>\n","\n",r,flags=re.S)
          r=re.sub(r"const MANIFEST_SHA256='[0-9a-f]{64}'",f"const MANIFEST_SHA256='{msha}'",r,count=1)
          transition=f'''<script>\n'use strict';\nwindow.PMPIntegrityTransitionReady=(async function(){{\n  const target='{msha}',key='pmp_integrity_transition_'+target;\n  if(!('serviceWorker' in navigator))return;\n  const controller=navigator.serviceWorker.controller;\n  if(!controller)return;\n  let count=Number(sessionStorage.getItem(key)||0);\n  if(count>=3)throw new Error('integrity_transition_controller_persisted');\n  sessionStorage.setItem(key,String(count+1));\n  const regs=await navigator.serviceWorker.getRegistrations();\n  for(const reg of regs){{try{{await reg.unregister()}}catch(e){{}}}}\n  const u=new URL(location.href);u.searchParams.set('pmp_integrity_transition',target.slice(0,16)+'-'+Date.now());\n  location.replace(u.href);\n  await new Promise(()=>{{}});\n}})();\n</script>\n'''
          r=r.replace('<script>\n\'use strict\';\n(async function(){',transition+"<script>\n'use strict';\n(async function(){\n  await window.PMPIntegrityTransitionReady;")
          root.write_text(r)

          seal=Path('audit/a003-manifest-seal.json')
          s=json.loads(seal.read_text());s['manifest_bytes']=len(mt.encode());s['manifest_sha256']=msha;seal.write_text(json.dumps(s,indent=2,sort_keys=True)+'\n')
          print(msha)
          PY
          node --check pmp-pass75-reload-runtime-platform-gate-v1.js
      - name: Verify exact startup sequence and integrity
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          g=Path('pmp-pass75-reload-runtime-platform-gate-v1.js').read_text()
          o=Path('pmp-current-reload-owner-v30-direct-boot-surface-20260708A.html').read_text()
          r=Path('pmp-app-current.html').read_text()
          assert 'manual release only' in g
          assert 'if(st.released)return false' in g
          assert 'cancelPending();st.flash=null' in g
          assert 'visibility:hidden' in o
          assert "function afterRuntime(){frame.style.visibility='visible';start();" in o
          assert 'PMPIntegrityTransitionReady' in r
          assert 'getRegistrations' in r and 'unregister' in r
          PY
          cat > /tmp/startup-order-test.cjs <<'NODE'
          const fs=require('fs'),vm=require('vm');const src=fs.readFileSync('pmp-pass75-reload-runtime-platform-gate-v1.js','utf8');let now=0,id=1,timers=new Map(),els=new Map(),continued=0;function st(fn,ms){const n=id++;timers.set(n,{at:now+ms,fn});return n}function ct(n){timers.delete(n)}function adv(ms){const end=now+ms;while(true){let q=null;for(const [n,t] of timers)if(t.at<=end&&(!q||t.at<q.t.at))q={n,t};if(!q)break;now=q.t.at;timers.delete(q.n);q.t.fn()}now=end}function el(x){return{id:x,style:{display:''},classList:{contains:()=>false,toggle:()=>{}},__b:false,remove(){els.delete(x)},closest(){return null},set outerHTML(v){els.set(x,el(x))}}}const document={body:{insertAdjacentHTML(p,h){const m=h.match(/<div id="([^"]+)"/);if(m)els.set(m[1],el(m[1]))}},getElementById(x){return els.get(x)||null}};const c={window:{},document,localStorage:{setItem(){}},navigator:{clipboard:{writeText(){}}},location:{search:''},URLSearchParams,Date,Math,setTimeout:st,clearTimeout:ct,console};c.window=c;vm.createContext(c);vm.runInContext(src,c);const api=c.PMPPass75ReloadRuntimePlatformGateV1;api.run(()=>continued++);adv(10000);if(api.state.released)throw Error('auto_released');if(!els.has('pmpPass75ReloadRuntimePlatformGateV1'))throw Error('runtime_not_visible');api.release('manual_button');adv(10000);if(continued!==1||els.has('pmpPass75ReloadRuntimePlatformGateV1')||timers.size!==0)throw Error('manual_release_failed');console.log('STARTUP_ORDER_PASS');
          NODE
          for i in 1 2 3 4 5; do node /tmp/startup-order-test.cjs; done
          python3 tools/test_a003_integrity.py --output /tmp/a003-startup-order.json
          python3 - <<'PY'
          import json
          r=json.load(open('/tmp/a003-startup-order.json'))
          assert (r['tests_total'],r['tests_passed'],r['tests_failed'])==(21,21,0),r
          PY
      - name: Commit production repair
        run: |
          set -euo pipefail
          rm .github/workflows/TEMP_fix_runtime_before_orchestrator_order_002.yml
          git config user.name pmpbird
          git config user.email pmpbird@gmail.com
          git add pmp-pass75-reload-runtime-platform-gate-v1.js pmp-current-reload-owner-v30-direct-boot-surface-20260708A.html pmp-runtime-integrity-manifest-v1.json pmp-app-current.html audit/a003-manifest-seal.json .github/workflows/TEMP_fix_runtime_before_orchestrator_order_002.yml
          git commit -m 'Enforce Runtime Platform before App Orchestrator and transition integrity safely [startup-order-fix-complete]'
          git push origin HEAD:main

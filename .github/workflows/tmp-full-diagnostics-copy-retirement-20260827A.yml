name: Temporary Full Diagnostics Copy Retirement Certification

on:
  push:
    branches:
      - chatgpt/full-diagnostics-copy-retirement-20260827A
    paths:
      - '.github/workflows/tmp-full-diagnostics-copy-retirement-20260827A.yml'

permissions:
  contents: write

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply bounded copy retirement
        run: |
          python3 tmp-full-diagnostics-copy-retirement-patch-20260827.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('audit/pass13/receipts/RECEIPT_FULL_DIAGNOSTICS_COPY_RETIREMENT_20260827A_001.json')
          d=json.loads(p.read_text('utf-8'))
          d['verification']['successful_branch_certification_run']='${{ github.run_id }}'
          p.write_text(json.dumps(d,indent=2,sort_keys=True)+'\n','utf-8')
          PY

      - name: Install Playwright and certify real ZIP handoff
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
          node --check pmp-diagnostics-consolidated-view-v1.js
          node --check audit/a002-full-diagnostics-zip-export-v1.cjs
          python3 tools/test_full_diagnostics_zip_export_v1.py
          python3 tools/verify_full_diagnostics_zip_export_v1.py
          python3 tools/test_app_orchestrator_ownership_maintenance_v1.py
          python3 tools/verify_app_orchestrator_ownership_maintenance_v1.py
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/copy-retirement-http.log 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/pmp-pages-publish-smoke-v1.html >/dev/null && break
            sleep 1
          done
          A002_BASE_URL=http://127.0.0.1:8000/ A002_FULL_DIAGNOSTICS_ZIP_RESULT_PATH=/tmp/copy-retirement-browser.json node audit/a002-full-diagnostics-zip-export-v1.cjs

      - name: Remove browser install before A-003 runtime scan
        run: |
          rm -rf node_modules package-lock.json npm-shrinkwrap.json package.json

      - name: Build and seal A-003 using only /tmp generator outputs
        run: |
          python3 tools/build_a003_integrity_manifest.py --output /tmp/a003-copy-retirement-manifest.json --report /tmp/a003-copy-retirement-probe.json
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          path=Path('/tmp/a003-copy-retirement-manifest.json')
          manifest=json.loads(path.read_text('utf-8'))
          manifest.pop('source_commit',None)
          manifest.pop('self_digest_for_generated_bytes',None)
          identity={
            'records':[(r['path'],r['sha256_hex']) for r in manifest.get('records',[])],
            'historical_records':[(r['path'],r.get('repository_ref'),r['sha256_hex']) for r in manifest.get('historical_records',[])],
            'external_records':[(r['url'],r['sha256_hex']) for r in manifest.get('external_records',[])],
            'root_trust_anchors':manifest.get('root_trust_anchors',[]),
            'policy':{'algorithm':manifest.get('algorithm'),'unlisted_executable_policy':manifest.get('unlisted_executable_policy'),'network_policy':manifest.get('network_policy')}
          }
          manifest['version']='20260711A-A003-FINAL'
          manifest['runtime_source_set_sha256']=hashlib.sha256(json.dumps(identity,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          manifest['source_identity_rule']='Deterministic digest of protected local, historical, external, root-anchor, and policy identities; audit/workflow-only commits do not alter this identity.'
          path.write_text(json.dumps(manifest,indent=2,sort_keys=True)+'\n','utf-8')
          PY
          cp /tmp/a003-copy-retirement-manifest.json pmp-runtime-integrity-manifest-v1.json
          manifest_sha="$(sha256sum pmp-runtime-integrity-manifest-v1.json | awk '{print $1}')"
          manifest_bytes="$(wc -c < pmp-runtime-integrity-manifest-v1.json | tr -d ' ')"
          runtime_set_sha="$(python3 -c "import json; print(json.load(open('pmp-runtime-integrity-manifest-v1.json'))['runtime_source_set_sha256'])")"
          python3 - "$manifest_sha" "$manifest_bytes" "$runtime_set_sha" <<'PY'
          import json,re,sys
          from pathlib import Path
          manifest_sha,manifest_bytes,runtime_set_sha=sys.argv[1:]
          p=Path('pmp-app-current.html')
          s=p.read_text('utf-8')
          s,n=re.subn(r"const MANIFEST_SHA256='(?:__A003_MANIFEST_SHA256__|[0-9a-f]{64})';",f"const MANIFEST_SHA256='{manifest_sha}';",s,count=1)
          assert n==1
          p.write_text(s,'utf-8')
          seal={'type':'PMP_A003_MANIFEST_SEAL_V1','repair_id':'A-003','status':'SEALED','manifest_path':'pmp-runtime-integrity-manifest-v1.json','manifest_sha256':manifest_sha,'manifest_bytes':int(manifest_bytes),'manifest_version':'20260711A-A003-FINAL','runtime_source_set_sha256':runtime_set_sha,'root_trust_anchor':'pmp-app-current.html','root_self_verifiable':False,'sealed_branch':'chatgpt/full-diagnostics-copy-retirement-20260827A','rule':'The root trust anchor cannot verify its own pre-execution bytes; it carries the exact digest for the deterministic protected runtime source set.'}
          Path('audit/a003-manifest-seal.json').write_text(json.dumps(seal,indent=2,sort_keys=True)+'\n','utf-8')
          PY
          python3 tools/test_a003_integrity.py --output /tmp/a003-copy-retirement-result.json

      - name: Commit nine non-workflow permanent files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit/a002-full-diagnostics-zip-export-v1.cjs audit/a003-manifest-seal.json audit/pass13/full-diagnostics-copy-retirement-gate-v1.json audit/pass13/receipts/RECEIPT_FULL_DIAGNOSTICS_COPY_RETIREMENT_20260827A_001.json pmp-app-current.html pmp-diagnostics-consolidated-view-v1.js pmp-runtime-integrity-manifest-v1.json tools/test_full_diagnostics_zip_export_v1.py tools/verify_full_diagnostics_zip_export_v1.py
          git diff --cached --name-only | tee /tmp/copy-retirement-permanent-scope.txt
          test "$(wc -l < /tmp/copy-retirement-permanent-scope.txt | tr -d ' ')" = '9'
          git commit -m 'Retire unusable Full Diagnostics clipboard handoff'
          git push origin HEAD:chatgpt/full-diagnostics-copy-retirement-20260827A

name: ChatGPT Diagnostics Reseal V1

on:
  push:
    branches:
      - chatgpt/diagnostics-active-path-cleanup-handoff-fix-v1

permissions:
  contents: write

jobs:
  reseal:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Regenerate integrity and maintenance records
        run: python3 tools/generate_app_orchestrator_ownership_maintenance_integrity_updates_v1.py

      - name: Run focused verification
        run: |
          python3 tools/test_a003_integrity.py
          python3 tools/test_app_orchestrator_ownership_maintenance_v1.py
          python3 tools/verify_app_orchestrator_ownership_maintenance_v1.py

      - name: Commit generated reseal
        run: |
          if git diff --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Reseal Diagnostics cleanup and handoff fix [skip ci]"
          git push

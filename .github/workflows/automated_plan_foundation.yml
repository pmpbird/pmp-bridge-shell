name: Automated Plan Foundation

on:
  pull_request:
    paths:
      - 'automation/**'
      - 'audit/Automated_Plan_Foundation_Status_v1.md'
      - 'audit/Automated_Plan_Foundation_Retirement_v1.md'
      - 'pmp-automated-plan-room-v1.js'
      - 'pmp-automated-plan-native-match-v1.js'
      - 'pmp-current-inner-cleanbug-rgcontrols-v6.html'
      - 'pmp-current-map-v12.json'
      - 'pmp-app-current.html'
      - 'pmp-home-single-v6.html'
      - 'tools/verify_automated_plan_foundation_v1.py'
      - 'tools/verify_automated_plan_universal_contract_v1.py'
      - 'tools/verify_automated_plan_visual_match_v1.py'
      - 'tools/test_automated_plan_real_app_v1.mjs'
      - '.github/workflows/automated_plan_foundation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: automated-plan-foundation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify preserved zero-cost foundation and formal UI retirement
        run: python3 tools/verify_automated_plan_foundation_v1.py
      - name: Verify preserved universal contracts, recovery, usage, backend switching, and stop conditions
        run: python3 tools/verify_automated_plan_universal_contract_v1.py
      - name: Verify superseding native visual owner and retired route boundary
        run: python3 tools/verify_automated_plan_visual_match_v1.py
      - name: Check retained dashboard JavaScript syntax
        run: |
          node --check pmp-automated-plan-room-v1.js
          node --check pmp-automated-plan-native-match-v1.js

  real-app-visual:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install headless browser test dependency
        run: |
          npm install --no-save --silent playwright@1.53.1 > /tmp/npm-install.log 2>&1
          npx playwright install --with-deps chromium > /tmp/playwright-install.log 2>&1
      - name: Start the current A-003 app locally
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/pmp-http.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/pmp-app-current.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/pmp-http.log
          exit 1
      - name: Test current app and retired Automated Plan route boundary
        env:
          PMP_BASE_URL: http://127.0.0.1:8000
        run: |
          if node tools/test_automated_plan_real_app_v1.mjs > /tmp/automated-plan-real-app.log 2>&1; then
            cat /tmp/automated-plan-real-app.log
          else
            cat /tmp/automated-plan-real-app.log
            exit 1
          fi
      - name: Preserve concise retirement-compatibility log for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automated-plan-real-app-log
          path: /tmp/automated-plan-real-app.log
          retention-days: 1

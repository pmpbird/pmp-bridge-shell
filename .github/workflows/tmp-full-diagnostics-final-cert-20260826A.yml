name: Temporary Full Diagnostics ZIP Final Certification

on:
  push:
    branches:
      - chatgpt/full-diagnostics-zip-export-20260826A
    paths:
      - '.github/workflows/tmp-full-diagnostics-final-cert-20260826A.yml'

permissions:
  contents: write

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      BASE_SHA: aedcac8f6acfbedcc2dfa124d984d225b7f42d17
      BRANCH: chatgpt/full-diagnostics-zip-export-20260826A
      CERT_ROOT: /tmp/full-diagnostics-final-cert
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Self-remove certification workflow and establish exact clean head
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/tmp-full-diagnostics-final-cert-20260826A.yml
          git commit -m 'Remove temporary Full Diagnostics final certification [skip ci]'
          git push origin HEAD:$BRANCH
          mkdir -p "$CERT_ROOT"
          git rev-parse HEAD | tee "$CERT_ROOT/certified-head.txt"
          git diff --name-only "$BASE_SHA...HEAD" | sort | tee "$CERT_ROOT/changed-paths.txt"
          test "$(wc -l < "$CERT_ROOT/changed-paths.txt" | tr -d ' ')" = "10"
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run dedicated Full Diagnostics ZIP proof
        id: diagnostics_zip
        shell: bash
        run: |
          set +e
          node --check pmp-diagnostics-consolidated-view-v1.js > "$CERT_ROOT/full-diagnostics-zip.log" 2>&1
          rc1=$?
          node --check audit/a002-full-diagnostics-zip-export-v1.cjs >> "$CERT_ROOT/full-diagnostics-zip.log" 2>&1
          rc2=$?
          python3 tools/test_full_diagnostics_zip_export_v1.py >> "$CERT_ROOT/full-diagnostics-zip.log" 2>&1
          rc3=$?
          python3 tools/verify_full_diagnostics_zip_export_v1.py >> "$CERT_ROOT/full-diagnostics-zip.log" 2>&1
          rc4=$?
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/full-diagnostics-cert-http.log 2>&1 &
          echo $! > /tmp/full-diagnostics-cert-http.pid
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/pmp-pages-publish-smoke-v1.html >/dev/null && break; sleep 1; done
          A002_BASE_URL=http://127.0.0.1:8000/ A002_FULL_DIAGNOSTICS_ZIP_RESULT_PATH="$CERT_ROOT/full-diagnostics-zip-result.json" node audit/a002-full-diagnostics-zip-export-v1.cjs >> "$CERT_ROOT/full-diagnostics-zip.log" 2>&1
          rc5=$?
          rc=0; for x in $rc1 $rc2 $rc3 $rc4 $rc5; do if [ "$x" -ne 0 ]; then rc=1; fi; done
          printf '{"syntax_runtime":%s,"syntax_browser":%s,"deterministic":%s,"verifier":%s,"browser":%s,"final":%s}\n' "$rc1" "$rc2" "$rc3" "$rc4" "$rc5" "$rc" > "$CERT_ROOT/full-diagnostics-zip-status.json"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Run A-002 Live Runtime Matrix commands
        id: a002
        shell: bash
        run: |
          set +e
          : > "$CERT_ROOT/a002-live.log"
          node --check pmp-diagnostic-coverage-passes-bcd-v1-1-1-0-fresh-evaluation-20260825A.js >> "$CERT_ROOT/a002-live.log" 2>&1; r1=$?
          node --check pmp-diagnostics-writer-trace-v1.js >> "$CERT_ROOT/a002-live.log" 2>&1; r2=$?
          node --check pmp-diagnostics-consolidated-view-v1.js >> "$CERT_ROOT/a002-live.log" 2>&1; r3=$?
          node --check audit/a002-bcd-fresh-evaluation-source-identity-v1.cjs >> "$CERT_ROOT/a002-live.log" 2>&1; r4=$?
          python3 tools/test_bcd_fresh_evaluation_source_identity_v1.py >> "$CERT_ROOT/a002-live.log" 2>&1; r5=$?
          python3 tools/verify_bcd_fresh_evaluation_source_identity_v1.py >> "$CERT_ROOT/a002-live.log" 2>&1; r6=$?
          node --check pmp-active-path-discovery-machine-v1.js >> "$CERT_ROOT/a002-live.log" 2>&1; r7=$?
          node --check pmp-active-path-discovery-zip-export-v2.js >> "$CERT_ROOT/a002-live.log" 2>&1; r8=$?
          node --check audit/a002-active-path-fresh-scan-classification-v1.cjs >> "$CERT_ROOT/a002-live.log" 2>&1; r9=$?
          python3 tools/test_active_path_fresh_scan_classification_truth_v1.py >> "$CERT_ROOT/a002-live.log" 2>&1; r10=$?
          python3 tools/verify_active_path_fresh_scan_classification_truth_v1.py >> "$CERT_ROOT/a002-live.log" 2>&1; r11=$?
          A002_BASE_URL=http://127.0.0.1:8000/ A002_RESULT_PATH="$CERT_ROOT/a002-live-runtime-results.json" node audit/a002-live-runtime.cjs >> "$CERT_ROOT/a002-live.log" 2>&1; r12=$?
          A002_BASE_URL=http://127.0.0.1:8000/ A002_DIAGNOSTICS_RESULT_PATH="$CERT_ROOT/a002-whole-app-diagnostics-results.json" node audit/a002-whole-app-diagnostics-v6.cjs >> "$CERT_ROOT/a002-live.log" 2>&1; r13=$?
          A002_BASE_URL=http://127.0.0.1:8000/ A002_BCD_FRESHNESS_RESULT_PATH="$CERT_ROOT/a002-bcd-fresh-evaluation-results.json" node audit/a002-bcd-fresh-evaluation-source-identity-v1.cjs >> "$CERT_ROOT/a002-live.log" 2>&1; r14=$?
          A002_BASE_URL=http://127.0.0.1:8000/ A002_ATLAS_RESULT_PATH="$CERT_ROOT/a002-active-path-fresh-scan-results.json" node audit/a002-active-path-fresh-scan-classification-v1.cjs >> "$CERT_ROOT/a002-live.log" 2>&1; r15=$?
          rc=0; for x in $r1 $r2 $r3 $r4 $r5 $r6 $r7 $r8 $r9 $r10 $r11 $r12 $r13 $r14 $r15; do if [ "$x" -ne 0 ]; then rc=1; fi; done
          echo "rc=$rc" >> "$GITHUB_OUTPUT"; exit 0
      - name: Run A-003 repository and live integrity
        id: a003
        shell: bash
        run: |
          set +e
          python3 tools/test_a003_integrity.py --output "$CERT_ROOT/a003-repository-test-result.json" > "$CERT_ROOT/a003-repository.log" 2>&1; r1=$?
          node --check audit/a003-live-runtime.cjs > "$CERT_ROOT/a003-live.log" 2>&1; r2=$?
          A003_RESULT_PATH="$CERT_ROOT/a003-live-runtime-results.json" node audit/a003-live-runtime.cjs >> "$CERT_ROOT/a003-live.log" 2>&1; r3=$?
          rc=0; for x in $r1 $r2 $r3; do if [ "$x" -ne 0 ]; then rc=1; fi; done
          echo "rc=$rc" >> "$GITHUB_OUTPUT"; exit 0
      - name: Run permanent no-blind-flying gate commands
        id: nbf
        shell: bash
        run: |
          set +e
          python3 tools/test_pass6_unit7_no_blind_flying_gate_v1.py > "$CERT_ROOT/no-blind-flying.log" 2>&1; r1=$?
          python3 tools/test_app_orchestrator_ownership_maintenance_v1.py >> "$CERT_ROOT/no-blind-flying.log" 2>&1; r2=$?
          python3 tools/verify_app_orchestrator_ownership_maintenance_v1.py >> "$CERT_ROOT/no-blind-flying.log" 2>&1; r3=$?
          python3 tools/run_pass6_unit7_no_blind_flying_gate_v1.py --base "$BASE_SHA" --output "$CERT_ROOT/no-blind-flying-result.json" >> "$CERT_ROOT/no-blind-flying.log" 2>&1; r4=$?
          r5=0
          if git diff --name-only "$BASE_SHA...HEAD" | grep -qx 'audit/pass6/pass6-unit7-closure-certification-v1.json'; then
            python3 tools/verify_pass6_unit7_closure_v1.py "$BASE_SHA" >> "$CERT_ROOT/no-blind-flying.log" 2>&1; r5=$?
          fi
          rc=0; for x in $r1 $r2 $r3 $r4 $r5; do if [ "$x" -ne 0 ]; then rc=1; fi; done
          echo "rc=$rc" >> "$GITHUB_OUTPUT"; exit 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run ownership maintenance exact commands
        id: ownership
        shell: bash
        run: |
          set +e
          python3 tools/generate_app_orchestrator_ownership_maintenance_integrity_updates_v1.py > "$CERT_ROOT/ownership-generator.log" 2>&1; r1=$?
          git diff --exit-code > "$CERT_ROOT/ownership-diff.log" 2>&1; r2=$?
          python3 tools/test_app_orchestrator_ownership_maintenance_v1.py > "$CERT_ROOT/ownership-test.log" 2>&1; r3=$?
          python3 tools/verify_app_orchestrator_ownership_maintenance_v1.py > "$CERT_ROOT/ownership-verify.log" 2>&1; r4=$?
          rc=0; for x in $r1 $r2 $r3 $r4; do if [ "$x" -ne 0 ]; then rc=1; fi; done
          echo "rc=$rc" >> "$GITHUB_OUTPUT"; exit 0
      - name: Run Pass 8 current later-unit regression path
        id: pass8
        shell: bash
        run: |
          set +e
          python3 tools/test_app_orchestrator_ownership_maintenance_v1.py > "$CERT_ROOT/pass8.log" 2>&1; rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"; exit 0
      - name: Run Pass 11 safety regression path
        id: pass11
        shell: bash
        run: |
          set +e
          node tools/test_pass11_safety_no_deletion_v1.js > "$CERT_ROOT/pass11.log" 2>&1; rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"; exit 0
      - name: Run static authorization preflight exact commands
        id: static
        shell: bash
        run: |
          set +e
          mkdir -p "$CERT_ROOT/static-preflight"
          python3 audit/pass2/p2c-isolated-proof-rerun-008/static_preflight_receipt038.py --select-mode --base-sha "$BASE_SHA" --head-sha "$(git rev-parse HEAD)" --github-output "$CERT_ROOT/static-mode.txt" > "$CERT_ROOT/static-preflight.log" 2>&1; r1=$?
          mode="$(sed -n 's/^mode=//p' "$CERT_ROOT/static-mode.txt" | tail -1)"
          python3 audit/pass2/p2c-isolated-proof-rerun-008/static_preflight_receipt038.py --mode "$mode" --base-sha "$BASE_SHA" --head-sha "$(git rev-parse HEAD)" --evidence-dir "$CERT_ROOT/static-preflight" >> "$CERT_ROOT/static-preflight.log" 2>&1; r2=$?
          python3 audit/pass2/p2c-post-failure-static-preflight-001/test_static_preflight_modes_001.py >> "$CERT_ROOT/static-preflight.log" 2>&1; r3=$?
          python3 audit/pass2/p2c-post-failure-static-preflight-001/verify_static_preflight_mode_separation_001.py --base-sha "$BASE_SHA" --head-sha "$(git rev-parse HEAD)" --evidence-dir "$CERT_ROOT/static-preflight" >> "$CERT_ROOT/static-preflight.log" 2>&1; r4=$?
          rc=0; for x in $r1 $r2 $r3 $r4; do if [ "$x" -ne 0 ]; then rc=1; fi; done
          echo "rc=$rc" >> "$GITHUB_OUTPUT"; exit 0
      - name: Run Pass 2 historical full-proof rehearsal boundary
        id: fullproof
        shell: bash
        env:
          SOURCE_COMMIT: 98b2e293717b81289e3b372d1fff8f5832d29fd6
          AUDIT_DIR: audit/pass2/p2c-isolated-proof-rerun-008
          DEPS_DIR: audit/pass2/p2c-isolated-proof-rerun-006
          REPAIR_DIR: audit/pass2/p2c-isolated-proof-rerun-006/repair-continuation-003
          BUNDLE_DIR: /tmp/p2c-rehearsal-discovery-bundle
          BUNDLE_TAR: /tmp/p2c-rehearsal-discovery-bundle.tar.gz
          BASELINE_ROOT: /tmp/p2c-rehearsal-discovery-baseline
          ACTIVE_ROOT: /tmp/p2c-rehearsal-discovery-active
          EVIDENCE_DIR: /tmp/p2c-rehearsal-discovery-evidence
          NORMALIZED_ROOT: /tmp/p2c-rehearsal-discovery-normalized
          NODE_HOME: /tmp/p2c-rehearsal-discovery-node
          P2C_REHEARSAL_SKIP_AUTHORIZATION: '1'
          P2C_STOP_BEFORE_PREPARATION: '1'
        run: |
          set +e
          bash "$AUDIT_DIR/rerun008-controller-main-receipt024.sh" > "$CERT_ROOT/full-proof.log" 2>&1; r1=$?
          python3 "$AUDIT_DIR/rehearsal_source_identity_discovery_034.py" "$BUNDLE_DIR/prepare_disposable_proof_002.py" "$EVIDENCE_DIR/source-identity-discovery-034.json" >> "$CERT_ROOT/full-proof.log" 2>&1; r2=$?
          rc=0; for x in $r1 $r2; do if [ "$x" -ne 0 ]; then rc=1; fi; done
          echo "rc=$rc" >> "$GITHUB_OUTPUT"; exit 0
      - name: Preserve certification summary
        if: always()
        run: |
          head_sha="$(git rev-parse HEAD)"
          manifest_sha="$(python3 -c "import json; print(json.load(open('audit/a003-manifest-seal.json'))['manifest_sha256'])")"
          runtime_set="$(python3 -c "import json; print(json.load(open('audit/a003-manifest-seal.json'))['runtime_source_set_sha256'])")"
          cat > "$CERT_ROOT/certification-summary.json" <<EOF
          {"type":"PMP_FULL_DIAGNOSTICS_ZIP_BRANCH_CERTIFICATION_V1","certified_head":"$head_sha","base_sha":"$BASE_SHA","manifest_sha256":"$manifest_sha","runtime_source_set_sha256":"$runtime_set","full_diagnostics_zip":${{ steps.diagnostics_zip.outputs.rc || '99' }},"a002_live":${{ steps.a002.outputs.rc || '99' }},"a003":${{ steps.a003.outputs.rc || '99' }},"no_blind_flying":${{ steps.nbf.outputs.rc || '99' }},"ownership":${{ steps.ownership.outputs.rc || '99' }},"pass8":${{ steps.pass8.outputs.rc || '99' }},"pass11":${{ steps.pass11.outputs.rc || '99' }},"static_preflight":${{ steps.static.outputs.rc || '99' }},"historical_full_proof":${{ steps.fullproof.outputs.rc || '99' }}}
          EOF
      - name: Upload complete certification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-diagnostics-zip-final-cert-${{ github.run_id }}
          path: /tmp/full-diagnostics-final-cert
          if-no-files-found: error
          retention-days: 90
      - name: Enforce all applicable certification lanes
        run: |
          test "${{ steps.diagnostics_zip.outputs.rc }}" = "0"
          test "${{ steps.a002.outputs.rc }}" = "0"
          test "${{ steps.a003.outputs.rc }}" = "0"
          test "${{ steps.nbf.outputs.rc }}" = "0"
          test "${{ steps.ownership.outputs.rc }}" = "0"
          test "${{ steps.pass8.outputs.rc }}" = "0"
          test "${{ steps.pass11.outputs.rc }}" = "0"
          test "${{ steps.static.outputs.rc }}" = "0"
          test "${{ steps.fullproof.outputs.rc }}" = "0"

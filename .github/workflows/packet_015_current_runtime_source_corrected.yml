name: Packet 015 corrected current runtime source

on: [push, pull_request]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: packet015-runtime-corrected-v1
          fetch-depth: 20
      - run: python3 tools/run_packet_01_5_runtime_source_corrected_v2.py

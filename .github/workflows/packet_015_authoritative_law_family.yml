name: Packet 015 authoritative law family

on:
  pull_request:
    paths:
      - "audit/applicability/Packet_01.5_Authoritative_Packet_Law_Family_Pass_v1.json"
      - "audit/Packet_01.5_Authoritative_Packet_Law_Family_PR_Trigger.txt"
      - "tools/build_packet_01_5_authoritative_law_family_v1.py"
      - "tools/packet_01_5_authoritative_law_policy.py"
      - "tools/packet_01_5_authoritative_law_policy_v2.py"
      - "tools/run_packet_01_5_authoritative_law_family_v2.py"
      - "tools/verify_packet_01_5_authoritative_law_family_v2.py"
      - "tools/write_packet_01_5_authoritative_law_family_receipts_v1.py"
      - ".github/workflows/packet_015_authoritative_law_family.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - run: python3 tools/run_packet_01_5_authoritative_law_family_v2.py build
      - name: Run corrected independent verifier
        run: |
          python3 tools/run_packet_01_5_authoritative_law_family_v2.py verify > audit/Packet_01.5_Authoritative_Packet_Law_Family_Independent_Verification_v1.json 2> audit/Packet_01.5_Authoritative_Packet_Law_Family_Debug.log
      - name: Commit failure diagnostic
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit/Packet_01.5_Authoritative_Packet_Law_Family_Debug.log
          git diff --cached --quiet || (git commit -m "Record authoritative law verifier diagnostic" && git push origin "HEAD:${{ github.head_ref || github.ref_name }}")
      - run: python3 tools/write_packet_01_5_authoritative_law_family_receipts_v1.py
      - name: Commit verified outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f --ignore-unmatch audit/Packet_01.5_Authoritative_Packet_Law_Family_Debug.log
          git add audit/applicability/Packet_01.5_Authoritative_Packet_Law_Family_Manifest_v1.json
          git add audit/applicability/Packet_01.5_Authoritative_Packet_Law_Family_Decisions_v1.jsonl
          git add audit/applicability/Packet_01.5_Authoritative_Packet_Law_Family_Remaining_Queue_v1.jsonl
          git add audit/Packet_01.5_Authoritative_Packet_Law_Evidence_Matrix_v1.json
          git add audit/Packet_01.5_Authoritative_Packet_Law_Family_Coverage_v1.json
          git add audit/Packet_01.5_Authoritative_Packet_Law_Family_v1.md
          git add audit/Packet_01.5_Authoritative_Packet_Law_Family_Independent_Verification_v1.json
          git add audit/Packet_01.5_Authoritative_Packet_Law_Family_Independent_Verification_v1.md
          git add audit/Packet_01.5_Routing_Status_v85.md
          git diff --cached --quiet || (git commit -m "Verify corrected authoritative packet-law evidence family" && git push origin "HEAD:${{ github.head_ref || github.ref_name }}")

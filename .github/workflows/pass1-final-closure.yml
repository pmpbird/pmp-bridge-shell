name: App Orchestrator Pass 1 Final Closure

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/pass1-final-closure.yml'
      - 'audit/pass1-final-closure-plan.json'
      - 'audit/pass1-final-closure-receipt.json'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: app-orchestrator-pass1-closure-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  BASE_MAIN_COMMIT: 253111b76be2c8e93629000f9d68c3b9132ba87b
  A001_BASELINE_COMMIT: 5dd049de1500ea427fa2cf395687239a19706115
  A001_MERGE_COMMIT: 253111b76be2c8e93629000f9d68c3b9132ba87b
  A001_RECEIPT_ID: PMP-A001-5dd049de-PASS-003
  A001_RECEIPT_HASH: 4b49f2f3d16db6451a9abaafb2b3e147a591f7e3c09db314e2d04ce7b893b2b9
  A001_SUPPLEMENT_RECEIPT_ID: PMP-A001-5dd049de-SUPPLEMENT-A002-PASS-004
  A002_RECEIPT_ID: PMP-A002-5dd049de-PASS-FULL-001
  A003_RECEIPT_ID: PMP-A003-5dd049de-PASS-FULL-001
  PR38_STABLE_RECEIPT_ID: PMP-PR38-e4cd9948-STABLE-POSTMERGE-PASS-002
  PR38_STABLE_RECEIPT_COMMIT: 903cd10808f2d4639dff82aa4595cc7b74417e7a
  A003_MANIFEST_SHA256: 570c6db93da497758c6b18f53fa1e3c2b08cb1fdff761c9e54d97b87914e54d0
  A003_RUNTIME_SET_SHA256: 2efc5aa5f3ece5b1da94e162baf7f981a636ef5f23d9c6b3f2d8a348688172e2
  GH_TOKEN: ${{ github.token }}

jobs:
  complete-pass1-closure:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout full closure tree
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify closure branch scope and ancestry
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$PR38_STABLE_RECEIPT_COMMIT" "$BASE_MAIN_COMMIT"
          git merge-base --is-ancestor "$A001_MERGE_COMMIT" HEAD
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          allowed={
            '.github/workflows/pass1-final-closure.yml',
            'audit/pass1-final-closure-plan.json',
            'audit/pass1-final-closure-receipt.json'
          }
          changed=set(subprocess.check_output(
              ['git','diff','--name-only',os.environ['BASE_MAIN_COMMIT'], 'HEAD'], text=True
          ).splitlines())
          assert changed <= allowed, sorted(changed-allowed)
          assert '.github/workflows/pass1-final-closure.yml' in changed
          assert 'audit/pass1-final-closure-plan.json' in changed
          pathlib.Path('/tmp/pass1-closure-scope.json').write_text(json.dumps({
              'type':'PMP_APP_ORCHESTRATOR_PASS1_CLOSURE_SCOPE_RESULT_V1',
              'status':'PASS',
              'base_main_commit':os.environ['BASE_MAIN_COMMIT'],
              'branch_only_delta':sorted(changed)
          },indent=2)+'\n')
          PY

      - name: Verify A-001 exact integrated proof chain
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess

          baseline=os.environ['A001_BASELINE_COMMIT']
          manifest_path=pathlib.Path('audit/pmp-active-source-identity-manifest-v1.json')
          execution_path=pathlib.Path('audit/a001-final/a001-execution.json')
          assert manifest_path.is_file() and execution_path.is_file()
          manifest=json.loads(manifest_path.read_text())
          execution=json.loads(execution_path.read_text())

          assert manifest['type']=='PMP_ACTIVE_SOURCE_IDENTITY_MANIFEST_V2'
          assert manifest['repair_id']=='A-001'
          assert manifest['baseline']['commit']==baseline
          assert manifest['counts']=={
            'exact_historical_repository_blob_identities':1,
            'exact_repository_blob_identities':195,
            'proven_inactive_or_non_executable_absences':2,
            'total_manifest_records':199,
            'unresolved_records':0,
            'version_and_upstream_blob_pinned_external_sources':1
          }
          assert manifest['final_receipt']['receipt_id']==os.environ['A001_RECEIPT_ID']
          assert manifest['final_receipt']['receipt_hash']==os.environ['A001_RECEIPT_HASH']
          assert manifest['final_receipt']['unresolved_count']==0
          assert execution['test_decision']=='PASS'
          assert execution['total_manifest_records']==199
          assert execution['unresolved_records']==0
          assert execution['forbidden_effects_observed']==[]

          tree={}
          raw=subprocess.check_output(['git','ls-tree','-r',baseline],text=True)
          for line in raw.splitlines():
              left,path=line.split('\t',1)
              tree[path]=left.split()[2]

          all_rows=[]
          shard_results=[]
          for entry in manifest['identity_shards']:
              path=pathlib.Path(entry['path'])
              shard=json.loads(path.read_text())
              assert shard['type']=='PMP_A001_IDENTITY_SHARD_V1'
              assert shard['record_count']==39==entry['record_count']
              assert shard['shard_sha256']==entry['sha256']
              rows=shard['rows']
              assert len(rows)==39
              for row in rows:
                  source_path, expected_blob=row[0],row[1]
                  assert tree.get(source_path)==expected_blob,(source_path,tree.get(source_path),expected_blob)
              all_rows.extend(rows)
              shard_results.append({'path':entry['path'],'records':len(rows),'sha256':entry['sha256']})
          paths=[row[0] for row in all_rows]
          assert len(paths)==195 and len(set(paths))==195

          historical=manifest['historical_repository_entries'][0]
          actual=subprocess.check_output(
              ['git','rev-parse',f"{historical['repository_ref']}:{historical['path']}"],text=True
          ).strip()
          assert actual==historical['git_blob_sha']
          assert len(manifest['external_source_entries'])==1
          external=manifest['external_source_entries'][0]
          assert external['package']=='jszip' and external['package_version']=='3.10.1'
          assert len(manifest['inactive_or_absent_entries'])==2

          supplement=json.loads(pathlib.Path('audit/a001-supplements/a001-a002-route-authority-supplement-v1.json').read_text())
          supplement_receipt=json.loads(pathlib.Path('audit/a001-supplements/a001-a002-route-authority-supplement-receipt-v1.json').read_text())
          assert supplement['lineage']['previous_receipt_id']==os.environ['A001_RECEIPT_ID']
          assert supplement_receipt['receipt_id']==os.environ['A001_SUPPLEMENT_RECEIPT_ID']
          assert supplement_receipt['supplement_record_count']==13
          assert supplement_receipt['unresolved_count']==0
          for record in supplement['records']:
              assert tree.get(record['path'])==record['git_blob_sha']
          assert supplement_receipt['combined_exact_repository_blob_identities']==208
          assert supplement_receipt['combined_total_manifest_records']==212

          result={
            'type':'PMP_A001_FINAL_INTEGRATED_PROOF_RESULT_V1',
            'status':'PASS',
            'manifest_records':199,
            'repository_blob_identities':195,
            'supplement_records':13,
            'combined_total_records':212,
            'unresolved':0,
            'shards':shard_results,
            'runtime_or_app_mutation':False
          }
          pathlib.Path('pass1-a001-integrated-result.json').write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result,indent=2))
          PY

      - name: Verify repair PR closure inventory
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, urllib.request
          event=json.loads(pathlib.Path(os.environ['GITHUB_EVENT_PATH']).read_text())
          current=event.get('number')
          req=urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/pulls?state=open&per_page=100",
              headers={
                'Authorization':f"Bearer {os.environ['GH_TOKEN']}",
                'Accept':'application/vnd.github+json',
                'X-GitHub-Api-Version':'2022-11-28'
              }
          )
          with urllib.request.urlopen(req) as response:
              pulls=json.load(response)
          stale=[p['number'] for p in pulls if p['number'] in {36,37}]
          assert stale==[], stale
          open_repair=[
              {'number':p['number'],'title':p['title'],'head':p['head']['ref']}
              for p in pulls
              if p['number'] != current and (
                  p['head']['ref'].startswith('agent/a00') or
                  p['title'].startswith('A-001') or
                  p['title'].startswith('A-002') or
                  p['title'].startswith('A-003')
              )
          ]
          assert open_repair==[], open_repair
          result={
            'type':'PMP_PASS1_REPAIR_PR_CLOSURE_RESULT_V1',
            'status':'PASS',
            'closed_or_merged_repair_prs':[36,37,38,40],
            'open_superseded_repair_prs':[],
            'open_other_repair_prs':open_repair
          }
          pathlib.Path('pass1-repair-pr-closure-result.json').write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result,indent=2))
          PY

      - name: Verify stable receipts and unchanged protected identities
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          a002=json.loads(pathlib.Path('audit/a002-final-receipt.json').read_text())
          a003=json.loads(pathlib.Path('audit/a003-final-receipt.json').read_text())
          stable=json.loads(pathlib.Path('audit/pr38-post-merge-stable-receipt.json').read_text())
          seal=json.loads(pathlib.Path('audit/a003-manifest-seal.json').read_text())
          assert a002['receipt_id']==os.environ['A002_RECEIPT_ID']
          assert a003['receipt_id']==os.environ['A003_RECEIPT_ID']
          assert stable['receipt_id']==os.environ['PR38_STABLE_RECEIPT_ID']
          assert stable['results']['aggregate']=='PASS'
          assert stable['delivery']['pr38_merge_method']=='merge'
          assert stable['stability_repair']['resolved'] is True
          assert seal['status']=='SEALED' and seal['sealed_branch']=='main'
          assert seal['manifest_sha256']==os.environ['A003_MANIFEST_SHA256']
          assert seal['runtime_source_set_sha256']==os.environ['A003_RUNTIME_SET_SHA256']
          assert hashlib.sha256(pathlib.Path('pmp-runtime-integrity-manifest-v1.json').read_bytes()).hexdigest()==os.environ['A003_MANIFEST_SHA256']
          expected={
            'pmp-lossless-inventory-vault/latest/metadata.json':'2f788f0def2a521eac74ff4263b319f7b841b94d',
            'pmp-lossless-inventory-vault/latest/mirror-status.json':'a60729528e75a90cdff30475c9ebcbeee4dc8ef7',
            'pmp-lossless-inventory-vault/record-ledger.json':'58b4e8fd2dd1b9a44b6df89393464c1b4fa7d94a'
          }
          for path,blob in expected.items():
              assert subprocess.check_output(['git','hash-object',path],text=True).strip()==blob
          result={
            'type':'PMP_PASS1_STABLE_IDENTITY_RESULT_V1',
            'status':'PASS',
            'a002_receipt':a002['receipt_id'],
            'a003_receipt':a003['receipt_id'],
            'pr38_stable_receipt':stable['receipt_id'],
            'manifest_sha256':seal['manifest_sha256'],
            'runtime_source_set_sha256':seal['runtime_source_set_sha256'],
            'vault_blob_identities':expected
          }
          pathlib.Path('pass1-stable-identity-result.json').write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result,indent=2))
          PY

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run A-003 repository integrity gate
        run: |
          set -o pipefail
          python3 tools/test_a003_integrity.py --output pass1-a003-repository-result.json 2>&1 | tee pass1-a003-repository-console.log

      - name: Run A-003 adversarial Chromium gate
        env:
          A003_RESULT_PATH: pass1-a003-live-runtime-results.json
        run: |
          set -o pipefail
          python3 tools/run_a003_live_final.py 2>&1 | tee pass1-a003-live-runtime-console.log

      - name: Start shared repository server
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/pass1-closure-http.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/pmp-current-map-v12.json >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/pass1-closure-http.log
          exit 1

      - name: Run reconciled A-002 live runtime matrix
        env:
          A002_BASE_URL: http://127.0.0.1:8000/
          A002_RESULT_PATH: pass1-a002-live-runtime-results.json
        run: |
          set -o pipefail
          node audit/a002-live-runtime.cjs 2>&1 | tee pass1-a002-live-runtime-console.log

      - name: Run Automated Plan preserved-contract checks
        run: |
          set -o pipefail
          python3 tools/verify_automated_plan_foundation_v1.py | tee pass1-automated-plan-foundation.log
          python3 tools/verify_automated_plan_universal_contract_v1.py | tee pass1-automated-plan-contract.log
          python3 tools/verify_automated_plan_visual_match_v1.py | tee pass1-automated-plan-visual.log
          node --check pmp-automated-plan-room-v1.js
          node --check pmp-automated-plan-native-match-v1.js

      - name: Run Automated Plan current-app browser compatibility
        env:
          PMP_BASE_URL: http://127.0.0.1:8000
        run: |
          set -o pipefail
          node tools/test_automated_plan_real_app_v1.mjs 2>&1 | tee pass1-automated-plan-real-app.log

      - name: Build final Pass 1 closure aggregate and verify receipt when present
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, urllib.request
          repo=json.loads(pathlib.Path('pass1-a003-repository-result.json').read_text())
          live=json.loads(pathlib.Path('pass1-a003-live-runtime-results.json').read_text())
          a002=json.loads(pathlib.Path('pass1-a002-live-runtime-results.json').read_text())
          assert repo.get('tests_passed')==21 and repo.get('tests_failed')==0
          assert live.get('tests_passed')==47 and live.get('tests_failed')==0 and live.get('fatal_error') is None
          assert a002.get('tests_passed')==41 and a002.get('tests_failed')==0 and a002.get('fatal_error') is None
          receipt_path=pathlib.Path('audit/pass1-final-closure-receipt.json')
          receipt_present=receipt_path.is_file()
          receipt_verified=False
          receipt_id=None
          if receipt_present:
              receipt=json.loads(receipt_path.read_text())
              receipt_id=receipt['receipt_id']
              assert receipt['status']=='PASS1_FORMALLY_CLOSED_AT_EXERCISED_SCOPE'
              assert receipt['base_main_commit']==os.environ['BASE_MAIN_COMMIT']
              assert receipt['a001_merge_commit']==os.environ['A001_MERGE_COMMIT']
              assert receipt['results']['a001_integrated_records']==212
              assert receipt['results']['a002_live_runtime']=='41/41'
              assert receipt['results']['a003_repository']=='21/21'
              assert receipt['results']['a003_adversarial_live']=='47/47'
              assert receipt['results']['aggregate']=='PASS'
              run_id=receipt['certification']['run_id']
              req=urllib.request.Request(
                  f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{run_id}/artifacts",
                  headers={
                    'Authorization':f"Bearer {os.environ['GH_TOKEN']}",
                    'Accept':'application/vnd.github+json',
                    'X-GitHub-Api-Version':'2022-11-28'
                  }
              )
              with urllib.request.urlopen(req) as response:
                  artifacts=json.load(response)['artifacts']
              match=[a for a in artifacts if a['name']=='app-orchestrator-pass1-final-closure-evidence']
              assert match and match[0]['digest']==receipt['certification']['artifact_digest']
              receipt_verified=True
          result={
            'type':'PMP_APP_ORCHESTRATOR_PASS1_FINAL_CLOSURE_AGGREGATE_V1',
            'status':'PASS_WITH_RECEIPT_VERIFIED' if receipt_verified else 'PASS_READY_TO_ISSUE_RECEIPT',
            'overall_project_pass':'Pass 1',
            'pass1_complete':True,
            'pass2_started':False,
            'verification_commit':os.environ['GITHUB_SHA'],
            'base_main_commit':os.environ['BASE_MAIN_COMMIT'],
            'receipt_present':receipt_present,
            'receipt_verified':receipt_verified,
            'receipt_id':receipt_id,
            'checks':{
              'a001_integrated_proof':'212/212; unresolved 0',
              'a002_live_runtime':'41/41',
              'a003_repository':'21/21',
              'a003_adversarial_live':'47/47',
              'automated_plan_preserved_contract':'PASS',
              'automated_plan_current_app':'PASS',
              'superseded_repair_prs':'CLOSED',
              'stable_runtime_identity':'UNCHANGED',
              'crosswalk_router_boundary':'SEPARATE'
            },
            'manifest_sha256':os.environ['A003_MANIFEST_SHA256'],
            'runtime_source_set_sha256':os.environ['A003_RUNTIME_SET_SHA256'],
            'decision':'PASS1_FORMALLY_CLOSABLE' if not receipt_verified else 'PASS1_FORMALLY_CLOSED_RECEIPT_VERIFIED'
          }
          pathlib.Path('pass1-final-closure-aggregate.json').write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result,indent=2))
          PY

      - name: Upload complete Pass 1 closure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-orchestrator-pass1-final-closure-evidence
          path: |
            /tmp/pass1-closure-scope.json
            pass1-a001-integrated-result.json
            pass1-repair-pr-closure-result.json
            pass1-stable-identity-result.json
            pass1-a003-repository-result.json
            pass1-a003-repository-console.log
            pass1-a003-live-runtime-results.json
            pass1-a003-live-runtime-console.log
            a003-live-runtime-effective.cjs
            pass1-a002-live-runtime-results.json
            pass1-a002-live-runtime-console.log
            pass1-automated-plan-foundation.log
            pass1-automated-plan-contract.log
            pass1-automated-plan-visual.log
            pass1-automated-plan-real-app.log
            pass1-final-closure-aggregate.json
            /tmp/pass1-closure-http.log
          if-no-files-found: error
          retention-days: 90

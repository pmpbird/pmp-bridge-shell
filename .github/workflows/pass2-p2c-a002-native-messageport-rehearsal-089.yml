name: Pass 2 A-002 Native MessagePort Rehearsal 089

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: read

jobs:
  a002-native-messageport-rehearsal-089:
    runs-on: ubuntu-24.04
    env:
      SOURCE_COMMIT: 98b2e293717b81289e3b372d1fff8f5832d29fd6
      AUDIT_DIR: audit/pass2/p2c-isolated-proof-rerun-008
      DEPS_DIR: audit/pass2/p2c-isolated-proof-rerun-006
      REPAIR_DIR: audit/pass2/p2c-isolated-proof-rerun-006/repair-continuation-003
      BUNDLE_DIR: /tmp/p2c-rehearsal089-runner
      BUNDLE_TAR: /tmp/p2c-rehearsal089.tar.gz
      BASELINE_ROOT: /tmp/p2c-rehearsal089-baseline
      ACTIVE_ROOT: /tmp/p2c-rehearsal089-active
      EVIDENCE_DIR: /tmp/p2c-rehearsal089-evidence
      NORMALIZED_ROOT: /tmp/p2c-rehearsal089-normalized
      NODE_HOME: /tmp/p2c-rehearsal089-node
      P2C_REHEARSAL_SKIP_AUTHORIZATION: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Run repaired rehearsal and capture console
        continue-on-error: true
        run: |
          mkdir -p /tmp/p2c-rehearsal089-capture
          bash "$AUDIT_DIR/rerun008-controller-main-rehearsal088.sh" > /tmp/p2c-rehearsal089-capture/complete-console.log 2>&1
          echo "$?" > /tmp/p2c-rehearsal089-capture/exit-code.txt
      - name: Copy generated evidence
        if: always()
        run: |
          mkdir -p /tmp/p2c-rehearsal089-capture
          if [ -d "$EVIDENCE_DIR" ]; then cp -a "$EVIDENCE_DIR" /tmp/p2c-rehearsal089-capture/evidence; fi
      - name: Upload complete rehearsal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2c-a002-native-messageport-rehearsal-089
          if-no-files-found: error
          path: /tmp/p2c-rehearsal089-capture

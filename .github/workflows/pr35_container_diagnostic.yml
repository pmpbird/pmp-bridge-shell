name: PR 35 container diagnostic

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/pr35_container_diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose-container-test:
    if: github.repository == 'pmpbird/pmp-bridge-shell' && github.event.pull_request.head.ref == 'automated-plan-controller-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automated-plan-controller-v1
          persist-credentials: false
      - name: Restore verified hardening payload
        run: |
          set -euo pipefail
          cat .pr35-hardening/chunk{00..07} | base64 --decode > /tmp/pr35-hardening.tgz
          echo '2fb25e457b8f8223cfe73baab074dce045c2925b68635f89d5228baa82bdac28  /tmp/pr35-hardening.tgz' | sha256sum -c -
          tar -xzf /tmp/pr35-hardening.tgz -C .
          python3 - <<'PY'
          from pathlib import Path
          path=Path('automation/controller/v1/controller.py')
          text=path.read_text()
          old='--mount", f"type=bind,src={workspace},dst=/workspace,rw",'
          new='--mount", f"type=bind,src={workspace},dst=/workspace",'
          if text.count(old) != 1:
              raise SystemExit('expected one Docker bind mount syntax to repair')
          path.write_text(text.replace(old,new))
          PY
      - name: Upload repaired container sources
        uses: actions/upload-artifact@v4
        with:
          name: pr35-container-sources
          path: |
            automation/controller/v1/controller.py
            automation/controller/v1/controller-contract.json
            tools/test_automated_plan_controller_container_v1.py
          retention-days: 1
      - name: Run real container suite
        id: test
        continue-on-error: true
        run: |
          set -o pipefail
          docker pull python:3.13-slim 2>&1 | tee /tmp/pr35-container.log
          python3 tools/test_automated_plan_controller_container_v1.py 2>&1 | tee -a /tmp/pr35-container.log
      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr35-container-diagnostic
          path: /tmp/pr35-container.log
          retention-days: 1
      - name: Preserve failure result
        if: steps.test.outcome != 'success'
        run: exit 1

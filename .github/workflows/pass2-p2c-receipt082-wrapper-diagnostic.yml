name: Pass 2 Receipt 082 Wrapper Diagnostic

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: read

jobs:
  receipt082-wrapper-diagnostic:
    runs-on: ubuntu-24.04
    env:
      SOURCE_COMMIT: 98b2e293717b81289e3b372d1fff8f5832d29fd6
      AUDIT_DIR: audit/pass2/p2c-isolated-proof-rerun-008
      DEPS_DIR: audit/pass2/p2c-isolated-proof-rerun-006
      REPAIR_DIR: audit/pass2/p2c-isolated-proof-rerun-006/repair-continuation-003
      BUNDLE_DIR: /tmp/p2c-receipt082-diagnostic-bundle
      BUNDLE_TAR: /tmp/p2c-receipt082-diagnostic.tar.gz
      BASELINE_ROOT: /tmp/p2c-receipt082-diagnostic-baseline
      ACTIVE_ROOT: /tmp/p2c-receipt082-diagnostic-active
      EVIDENCE_DIR: /tmp/p2c-receipt082-diagnostic-evidence
      NORMALIZED_ROOT: /tmp/p2c-receipt082-diagnostic-normalized
      NODE_HOME: /tmp/p2c-receipt082-diagnostic-node
      P2C_REHEARSAL_SKIP_AUTHORIZATION: '1'
      P2C_STOP_BEFORE_PREPARATION: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Trace Receipt 082 wrapper through hard stop
        run: bash -x "$AUDIT_DIR/rerun008-controller-main-receipt082.sh"
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2c-receipt082-wrapper-diagnostic
          path: /tmp/p2c-receipt082-diagnostic-evidence

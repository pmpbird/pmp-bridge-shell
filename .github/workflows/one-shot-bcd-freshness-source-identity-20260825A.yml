name: One-shot B-D Fresh Evaluation Source Identity Repair

on:
  push:
    branches:
      - chatgpt/bcd-freshness-source-identity-20260825A

permissions:
  contents: write

concurrency:
  group: one-shot-bcd-freshness-source-identity-20260825A
  cancel-in-progress: false

jobs:
  repair-and-seal:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: chatgpt/bcd-freshness-source-identity-20260825A

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply bounded freshness and source-identity repair
        shell: bash
        run: |
          python3 - <<'PY'
          from __future__ import annotations

          import json
          import re
          from pathlib import Path
          from textwrap import dedent as td

          ROOT = Path('.')
          EVALUATOR_OLD = ROOT / 'pmp-diagnostic-coverage-passes-bcd-v1-1-1-0.js'
          EVALUATOR_NEW = ROOT / 'pmp-diagnostic-coverage-passes-bcd-v1-1-1-0-fresh-evaluation-20260825A.js'
          BOOT = ROOT / 'pmp-diagnostics-writer-trace-v1.js'
          VIEW = ROOT / 'pmp-diagnostics-consolidated-view-v1.js'
          A002_WORKFLOW = ROOT / '.github/workflows/a002-live-runtime.yml'
          A002_TEST = ROOT / 'audit/a002-bcd-fresh-evaluation-source-identity-v1.cjs'
          TEST = ROOT / 'tools/test_bcd_fresh_evaluation_source_identity_v1.py'
          VERIFY = ROOT / 'tools/verify_bcd_fresh_evaluation_source_identity_v1.py'
          RECEIPT = ROOT / 'audit/pass13/receipts/RECEIPT_BCD_FRESH_EVALUATION_SOURCE_IDENTITY_20260825A_001.json'
          GATE = ROOT / 'audit/pass13/bcd-fresh-evaluation-source-identity-gate-v1.json'

          BCD_VERSION = '1.1.0-final-two-live-proof-20260801A'
          BCD_REVISION = '1.4.0-fresh-evaluation-source-identity-20260825A'
          BCD_SOURCE = EVALUATOR_NEW.name
          BOOT_VERSION = '3.4.0-fresh-evaluation-source-identity-20260825A'
          VIEW_VERSION = '2.9.2-fresh-bcd-evaluation-binding-20260825A'
          VIEW_BOOT_VERSION = '1.1.0-fresh-bcd-evaluation-binding-20260825A'

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one occurrence, found {count}')
              return text.replace(old, new, 1)

          def regex_once(text: str, pattern: str, replacement: str, label: str) -> str:
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'{label}: expected one regex match, found {count}')
              return updated

          # Create a new immutable evaluator source. Preserve the public B-D contract
          # version while binding every evaluation to an exact revision, source, and ID.
          evaluator = EVALUATOR_OLD.read_text('utf-8')
          evaluator = replace_once(
              evaluator,
              "const REV='1.3.0-first-open-lazy-surface-health-20260824A';",
              "const REV='1.4.0-fresh-evaluation-source-identity-20260825A';\n"
              "const SOURCE_ID='pmp-diagnostic-coverage-passes-bcd-v1-1-1-0-fresh-evaluation-20260825A.js';",
              'evaluator revision'
          )
          evaluator = replace_once(evaluator, 'let LAST=null;', 'let LAST=null,RUN_SEQUENCE=0;', 'evaluator sequence')
          evaluator = replace_once(
              evaluator,
              'function now(){return new Date().toISOString()}',
              "function now(){return new Date().toISOString()}\n"
              "function nextEvaluationId(){RUN_SEQUENCE+=1;return 'pmp-bcd-'+Date.now().toString(36)+'-'+RUN_SEQUENCE.toString(36)}\n"
              "function requestMeta(input){if(input&&typeof input==='object')return{reason:String(input.reason||'manual'),evaluation_id:String(input.evaluation_id||nextEvaluationId())};return{reason:String(input||'manual'),evaluation_id:nextEvaluationId()}}",
              'evaluator request metadata'
          )
          evaluator_run = (
              "async function run(request){const meta=requestMeta(request),report={type:'PMP_DIAGNOSTIC_COVERAGE_PASSES_BCD_V1',"
              "version:V,revision:REV,source_identity:SOURCE_ID,evaluation_id:meta.evaluation_id,owner:'diagnostics_owner',"
              "at:now(),reason:meta.reason,runtime_context:{root_path:(()=>{try{return root().location.pathname}catch(_){return null}})(),"
              "accessible_documents:docs().map(x=>({path:x.path,title:x.title,depth:x.depth})),diagnostics_active:diagnosticsActive()},"
              "bridge_system:bridge(),library_system:library(),bank_system:bank(),continuous_run_system:continuous(),"
              "errors_bug_watch_visual_stability:await errors(),boundaries:{read_only:true,owner_changes:false,helper_changes:false,"
              "route_changes:false,storage_migration:false,persisted_user_data_write:false,dom_repair:false}};"
              "report.status=[report.bridge_system,report.library_system,report.bank_system,report.continuous_run_system,"
              "report.errors_bug_watch_visual_stability].every(x=>x.status==='PASS')?'PASS':'FAIL';LAST=store(KEY,report);"
              "try{window.dispatchEvent(new CustomEvent('pmp:diagnostics:bcd-updated',{detail:{status:report.status,revision:REV,"
              "source_identity:SOURCE_ID,evaluation_id:report.evaluation_id,at:report.at}}))}catch(_){}return report}"
          )
          evaluator = regex_once(
              evaluator,
              r"async function run\(reason\)\{.*?\nconst api=",
              evaluator_run + "\nconst api=",
              'evaluator run'
          )
          evaluator = replace_once(
              evaluator,
              "const api={version:V,revision:REV,run,last:()=>LAST||read(KEY),receiptKey:KEY,rule:'Read-only lazy-surface health evaluation. Navigation and owner evidence are required at first open; inactive Bridge, Library, and Bank surface mount checks are deferred while Diagnostics is active. Continuous Run closed-bank mount checks remain deferred.'};",
              "const api={version:V,revision:REV,sourceIdentity:SOURCE_ID,run,last:()=>LAST||read(KEY),receiptKey:KEY,rule:'Read-only lazy-surface health evaluation. Navigation and owner evidence are required at first open; inactive Bridge, Library, and Bank surface mount checks are deferred while Diagnostics is active. Continuous Run closed-bank mount checks remain deferred.'};",
              'evaluator API identity'
          )
          evaluator = replace_once(
              evaluator,
              "setTimeout(()=>run('boot_first_open_stable'),750);",
              "setTimeout(()=>run({reason:'boot_first_open_stable'}),750);",
              'evaluator boot request'
          )
          EVALUATOR_NEW.write_text(evaluator, 'utf-8')

          # Repair the transactional bootstrap. A current run is always published;
          # a previously complete receipt can never satisfy a newer request.
          boot = BOOT.read_text('utf-8')
          boot = replace_once(boot, "const V='3.3.0-bounded-verified-bcd-publication-20260803C';", f"const V='{BOOT_VERSION}';", 'bootstrap version')
          boot = replace_once(boot, "const VIEW_BOOT_VERSION='1.0.0-exact-diagnostics-view-bootstrap-20260803B';", f"const VIEW_BOOT_VERSION='{VIEW_BOOT_VERSION}';", 'view bootstrap version')
          boot = replace_once(
              boot,
              "const REQUIRED_BCD_VERSION='1.1.0-final-two-live-proof-20260801A';",
              "const REQUIRED_BCD_VERSION='1.1.0-final-two-live-proof-20260801A';\n"
              "const REQUIRED_BCD_REVISION='1.4.0-fresh-evaluation-source-identity-20260825A';\n"
              "const REQUIRED_BCD_SOURCE_IDENTITY='pmp-diagnostic-coverage-passes-bcd-v1-1-1-0-fresh-evaluation-20260825A.js';",
              'bootstrap B-D identity constants'
          )
          boot = replace_once(
              boot,
              "const VERSIONED_BCD_SRC='pmp-diagnostic-coverage-passes-bcd-v1-1-1-0.js';",
              "const VERSIONED_BCD_SRC='pmp-diagnostic-coverage-passes-bcd-v1-1-1-0-fresh-evaluation-20260825A.js';",
              'bootstrap immutable source'
          )
          boot = replace_once(
              boot,
              "const REQUIRED_VIEW_VERSION='2.9.1-bootstrap-contract-alignment-20260803D';",
              "const REQUIRED_VIEW_VERSION='2.9.2-fresh-bcd-evaluation-binding-20260825A';",
              'bootstrap required view'
          )
          boot = replace_once(
              boot,
              'let inflight=null,viewInflight=null,LIVE_BCD_RECEIPT=null,LAST_BOOT_RECEIPT=null,virtualReadInstalled=false;',
              'let inflight=null,viewInflight=null,LIVE_BCD_RECEIPT=null,LAST_BOOT_RECEIPT=null,virtualReadInstalled=false,EVALUATION_SEQUENCE=0;',
              'bootstrap evaluation sequence'
          )
          boot = replace_once(
              boot,
              'function now(){return new Date().toISOString()}',
              "function now(){return new Date().toISOString()}\n"
              "function nextEvaluationId(){EVALUATION_SEQUENCE+=1;return 'pmp-bcd-request-'+Date.now().toString(36)+'-'+EVALUATION_SEQUENCE.toString(36)}",
              'bootstrap evaluation ID'
          )
          boot = regex_once(
              boot,
              r"function completeReceipt\(value\)\{[^\n]*\}",
              "function completeReceipt(value,evaluationId){return !!(value&&value.version===REQUIRED_BCD_VERSION&&value.revision===REQUIRED_BCD_REVISION&&value.source_identity===REQUIRED_BCD_SOURCE_IDENTITY&&typeof value.evaluation_id==='string'&&value.evaluation_id&&(!evaluationId||value.evaluation_id===evaluationId)&&REQUIRED_SECTIONS.every(key=>value[key]&&typeof value[key]==='object'))}",
              'bootstrap complete receipt'
          )
          boot = regex_once(
              boot,
              r"function liveReceipt\(\)\{[^\n]*\}",
              "function liveReceipt(evaluationId){if(completeReceipt(LIVE_BCD_RECEIPT,evaluationId))return LIVE_BCD_RECEIPT;const stored=read(BCD_RECEIPT_KEY);return completeReceipt(stored,evaluationId)?stored:null}",
              'bootstrap live receipt'
          )
          boot = regex_once(
              boot,
              r"function boundedSection\(row\)\{[^\n]*\}",
              "function boundedSection(row){if(!row||typeof row!=='object')return row;return{type:row.type||null,revision:row.revision||null,at:row.at||null,status:row.status||null,checks:row.checks||{},issues:Array.isArray(row.issues)?row.issues:[],backlog:Array.isArray(row.backlog)?row.backlog:[],classification_rule:row.classification_rule||null,read_only:row.read_only!==false,evidence_summary:{evidence_available:!!row.evidence,evidence_keys:row.evidence&&typeof row.evidence==='object'?Object.keys(row.evidence):[]}}}",
              'bootstrap bounded section'
          )
          boot = regex_once(
              boot,
              r"function boundedReceipt\(produced\)\{[^\n]*\}",
              "function boundedReceipt(produced){const out={type:produced.type,version:produced.version,revision:produced.revision||null,source_identity:produced.source_identity||null,evaluation_id:produced.evaluation_id||null,owner:produced.owner,at:produced.at,reason:produced.reason,status:produced.status,runtime_context:produced.runtime_context||null,publication_mode:'BOUNDED_VERIFIED_RECEIPT',source_evaluation_complete:true,classification_revision:produced.classification_revision||null,publication_revision:PUBLICATION_REVISION,boundaries:produced.boundaries||{read_only:true}};REQUIRED_SECTIONS.forEach(key=>{out[key]=boundedSection(produced[key])});return out}",
              'bootstrap bounded receipt'
          )
          boot = regex_once(
              boot,
              r"function publishBounded\(produced\)\{[^\n]*\}",
              "function publishBounded(produced,evaluationId){const published=boundedReceipt(produced),bytes=JSON.stringify(published).length;LIVE_BCD_RECEIPT=published;try{T().localStorage.setItem(BCD_RECEIPT_KEY,JSON.stringify(published));const observed=read(BCD_RECEIPT_KEY);return{ok:completeReceipt(observed,evaluationId),receipt:observed,bytes,mode:'localStorage_bounded',persistence_status:'PERSISTED'}}catch(error){const virtualized=installVirtualReceiptRead(),observed=liveReceipt(evaluationId);return{ok:completeReceipt(observed,evaluationId),receipt:observed,bytes,mode:virtualized?'live_memory_virtualized_read':'live_memory_direct',persistence_status:'QUOTA_UNAVAILABLE',persistence_error:String(error&&error.message||error),virtual_read_installed:virtualized}}}",
              'bootstrap bounded publisher'
          )
          boot = regex_once(
              boot,
              r"function findApi\(name\)\{[^\n]*\}",
              "function findApi(name,accept){let found=null;walk(T(),0,new Set(),win=>{try{const value=win[name];if(!found&&value&&(!accept||accept(value)))found=value}catch(_){}});return found}",
              'bootstrap API finder'
          )
          boot = replace_once(
              boot,
              "function currentApi(){return findApi(BCD_API)}\nfunction currentView(){return findApi(VIEW_API)}",
              "function apiMatches(api){return !!(api&&api.version===REQUIRED_BCD_VERSION&&api.revision===REQUIRED_BCD_REVISION&&api.sourceIdentity===REQUIRED_BCD_SOURCE_IDENTITY)}\n"
              "function anyApi(){return findApi(BCD_API)}\n"
              "function currentApi(){return findApi(BCD_API,apiMatches)}\n"
              "function currentView(){return findApi(VIEW_API,api=>api&&api.version===REQUIRED_VIEW_VERSION)}",
              'bootstrap exact API selection'
          )
          receipt_fn = (
              "function receipt(reason,status,extra){const expected=extra&&extra.evaluation_id||null,live=liveReceipt(expected),exact=currentApi(),any=anyApi();"
              "LAST_BOOT_RECEIPT=Object.assign({type:'PMP_CURRENT_BCD_DIAGNOSTICS_BOOTSTRAP_V1',version:V,"
              "classification_revision:CLASSIFICATION_REVISION,publication_revision:PUBLICATION_REVISION,owner:'diagnostics_owner',"
              "at:now(),reason:reason||'boot',status,required_version:REQUIRED_BCD_VERSION,required_revision:REQUIRED_BCD_REVISION,"
              "required_source_identity:REQUIRED_BCD_SOURCE_IDENTITY,versioned_source:VERSIONED_BCD_SRC,"
              "observed_any_api_version:any&&any.version||null,observed_api_version:exact&&exact.version||null,"
              "observed_api_revision:exact&&exact.revision||any&&any.revision||null,"
              "observed_api_source_identity:exact&&exact.sourceIdentity||any&&any.sourceIdentity||null,"
              "observed_receipt_version:live&&live.version||null,observed_receipt_revision:live&&live.revision||null,"
              "observed_receipt_source_identity:live&&live.source_identity||null,observed_receipt_evaluation_id:live&&live.evaluation_id||null,"
              "complete_sections:REQUIRED_SECTIONS.filter(key=>live&&live[key]),transactional:true,bounded_publication:true,"
              "quota_resilient_live_publication:true,fresh_evaluation_required:true,boundaries:{trace_ui:'retired',owner_changes:false,"
              "helper_changes:false,route_changes:false,storage_migration:false,persisted_user_data_write:false}},extra||{});"
              "store(BOOT_RECEIPT_KEY,LAST_BOOT_RECEIPT);return LAST_BOOT_RECEIPT}"
          )
          boot = regex_once(
              boot,
              r"function receipt\(reason,status,extra\)\{.*?\nfunction viewReceipt",
              receipt_fn + "\nfunction viewReceipt",
              'bootstrap receipt'
          )
          boot = regex_once(
              boot,
              r"function loadVersionedScript\(\)\{[^\n]*\}",
              "function loadVersionedScript(){const api=currentApi();if(apiMatches(api))return Promise.resolve({status:'ALREADY_LOADED'});return loadScript(VERSIONED_BCD_SRC+'?fresh=fresh-evaluation-source-identity-20260825A-'+Date.now())}",
              'bootstrap versioned loader'
          )
          run_validate = (
              "async function runAndValidate(api,reason,previous){const evaluationId=nextEvaluationId();try{"
              "if(!apiMatches(api)||typeof api.run!=='function'){restore(previous);return receipt(reason,'API_SOURCE_IDENTITY_MISMATCH',"
              "{evaluation_id:evaluationId,rollback_applied:true})}"
              "const rawProduced=await api.run({reason:reason||'transactional_bcd_bootstrap',evaluation_id:evaluationId});"
              "if(!completeReceipt(rawProduced,evaluationId)){restore(previous);return receipt(reason,'NEW_EVALUATION_INCOMPLETE',"
              "{evaluation_id:evaluationId,rollback_applied:true,produced_version:rawProduced&&rawProduced.version||null,"
              "produced_revision:rawProduced&&rawProduced.revision||null,produced_source_identity:rawProduced&&rawProduced.source_identity||null,"
              "produced_evaluation_id:rawProduced&&rawProduced.evaluation_id||null})}"
              "const classified=classifyPersistedBugBacklog(rawProduced),produced=classified.report;"
              "let publication=publishBounded(produced,evaluationId);if(!publication.ok)publication=publishBounded(produced,evaluationId);"
              "const live=publication.receipt;if(!publication.ok||!completeReceipt(live,evaluationId)){restore(previous);"
              "return receipt(reason,'RECEIPT_PUBLICATION_FAILED',{evaluation_id:evaluationId,rollback_applied:true,"
              "produced_version:produced.version,publication})}"
              "return receipt(reason,'PASS',{evaluation_id:evaluationId,rollback_applied:false,replaced_previous_version:previous&&previous.version||null,"
              "replaced_previous_evaluation_id:previous&&previous.evaluation_id||null,publication_mode:publication.mode,"
              "publication_persistence_status:publication.persistence_status,persistence_warning:publication.persistence_status==='QUOTA_UNAVAILABLE'?"
              "publication.persistence_error||'Storage quota unavailable':null,published_bytes:publication.bytes,"
              "source_evaluation_status:rawProduced.status,source_evaluation_at:rawProduced.at,final_evaluation_status:produced.status,"
              "persisted_bug_backlog_classification_applied:classified.applied,live_receipt_available:true,"
              "runtime_context_document_count:rawProduced.runtime_context&&Array.isArray(rawProduced.runtime_context.accessible_documents)?"
              "rawProduced.runtime_context.accessible_documents.length:null})}catch(error){restore(previous);"
              "return receipt(reason,'RUN_ERROR',{evaluation_id:evaluationId,error:String(error&&error.message||error),rollback_applied:true})}}"
          )
          boot = regex_once(
              boot,
              r"async function runAndValidate\(api,reason,previous\)\{.*?\nasync function ensureCurrent",
              run_validate + "\nasync function ensureCurrent",
              'bootstrap run and validate'
          )
          boot = replace_once(
              boot,
              "window.PMPCurrentBCDDiagnosticsBootstrapV1={version:V,classificationRevision:CLASSIFICATION_REVISION,publicationRevision:PUBLICATION_REVISION,requiredVersion:REQUIRED_BCD_VERSION,versionedSource:VERSIONED_BCD_SRC,run:ensureCurrent,last:()=>LAST_BOOT_RECEIPT||read(BOOT_RECEIPT_KEY),currentReceipt:()=>liveReceipt()};",
              "window.PMPCurrentBCDDiagnosticsBootstrapV1={version:V,classificationRevision:CLASSIFICATION_REVISION,publicationRevision:PUBLICATION_REVISION,requiredVersion:REQUIRED_BCD_VERSION,requiredRevision:REQUIRED_BCD_REVISION,requiredSourceIdentity:REQUIRED_BCD_SOURCE_IDENTITY,versionedSource:VERSIONED_BCD_SRC,run:ensureCurrent,last:()=>LAST_BOOT_RECEIPT||read(BOOT_RECEIPT_KEY),currentReceipt:()=>liveReceipt()};",
              'bootstrap public API'
          )
          stale_branch = "classified.applied?publishBounded(produced):{ok:completeReceipt(live),receipt:live,mode:'producer_full_receipt'"
          if stale_branch in boot:
              raise SystemExit('stale existing-receipt publication branch remained')
          BOOT.write_text(boot, 'utf-8')

          # Bind the consolidated view to the bootstrap's exact evaluation ID.
          view = VIEW.read_text('utf-8')
          view = replace_once(view, "const V='2.9.1-bootstrap-contract-alignment-20260803D';", f"const V='{VIEW_VERSION}';", 'view version')
          view = replace_once(
              view,
              "const BOOTSTRAP_SRC='pmp-diagnostics-writer-trace-v1.js?fresh=live-whole-app-bootstrap-await-20260803A';",
              "const BOOTSTRAP_SRC='pmp-diagnostics-writer-trace-v1.js?fresh=fresh-evaluation-source-identity-20260825A';",
              'view bootstrap source'
          )
          view = replace_once(view, "const REQUIRED_BOOT_VERSION='3.3.0-bounded-verified-bcd-publication-20260803C';", f"const REQUIRED_BOOT_VERSION='{BOOT_VERSION}';", 'view required bootstrap')
          view = replace_once(
              view,
              "const REQUIRED_BCD_VERSION='1.1.0-final-two-live-proof-20260801A';",
              "const REQUIRED_BCD_VERSION='1.1.0-final-two-live-proof-20260801A';\n"
              "const REQUIRED_BCD_REVISION='1.4.0-fresh-evaluation-source-identity-20260825A';\n"
              "const REQUIRED_BCD_SOURCE_IDENTITY='pmp-diagnostic-coverage-passes-bcd-v1-1-1-0-fresh-evaluation-20260825A.js';",
              'view B-D identity constants'
          )
          view = regex_once(
              view,
              r"function findApi\(name\)\{[^\n]*\}",
              "function findApi(name,accept){for(const c of docs()){try{const value=c.window[name];if(value&&(!accept||accept(value)))return value}catch(_){}}try{const topValue=T()[name],localValue=window[name];if(topValue&&(!accept||accept(topValue)))return topValue;if(localValue&&(!accept||accept(localValue)))return localValue;return null}catch(_){return null}}",
              'view API finder'
          )
          view = regex_once(
              view,
              r"function loadScript\(src,name\)\{[^\n]*\}",
              "function loadScript(src,name,accept){return new Promise(resolve=>{const current=()=>findApi(name,accept),existing=current();if(existing)return resolve({status:'ALREADY_AVAILABLE',api:existing});try{const s=document.createElement('script');s.src=src;s.async=false;s.onload=()=>resolve({status:current()?'LOADED':'LOADED_WITHOUT_API',api:current()});s.onerror=()=>resolve({status:'LOAD_ERROR',api:null});(document.head||document.documentElement).appendChild(s)}catch(error){resolve({status:'EXCEPTION',api:null,error:String(error&&error.message||error)})}})}",
              'view script loader'
          )
          view = regex_once(
              view,
              r"function completeBcd\(receipt\)\{[^\n]*\}",
              "function completeBcd(receipt,evaluationId){return !!(receipt&&receipt.version===REQUIRED_BCD_VERSION&&receipt.revision===REQUIRED_BCD_REVISION&&receipt.source_identity===REQUIRED_BCD_SOURCE_IDENTITY&&typeof receipt.evaluation_id==='string'&&receipt.evaluation_id&&(!evaluationId||receipt.evaluation_id===evaluationId)&&REQUIRED_BCD_SECTIONS.every(key=>receipt[key]&&typeof receipt[key]==='object'))}",
              'view complete B-D'
          )
          produce = (
              "async function produceEvidence(reason){if(EVIDENCE_RUN)return EVIDENCE_RUN;EVIDENCE_RUN=(async()=>{"
              "EVIDENCE_STATE={status:'RUNNING',started_at:now(),finished_at:null,attempts:EVIDENCE_STATE.attempts+1,"
              "reason:reason||'native_bootstrap',errors:[]};"
              "const aLoad=await loadScript(PASS_A_SRC,'PMPDiagnosticCoveragePassAV1'),a=aLoad.api||findApi('PMPDiagnosticCoveragePassAV1');"
              "if(a&&typeof a.run==='function'){try{await a.run(reason||'native_consolidated_diagnostics')}catch(error){"
              "EVIDENCE_STATE.errors.push({stage:'pass_a_run',error:String(error&&error.message||error)})}}"
              "else EVIDENCE_STATE.errors.push({stage:'pass_a_load',status:aLoad.status});"
              "const bootAccept=api=>api&&api.version===REQUIRED_BOOT_VERSION;"
              "const bootLoad=await loadScript(BOOTSTRAP_SRC,'PMPCurrentBCDDiagnosticsBootstrapV1',bootAccept),"
              "boot=bootLoad.api||findApi('PMPCurrentBCDDiagnosticsBootstrapV1',bootAccept);let bootResult=null;"
              "if(!boot||typeof boot.run!=='function')EVIDENCE_STATE.errors.push({stage:'passes_bcd_bootstrap_load',status:bootLoad.status});"
              "else{try{bootResult=await boot.run(reason||'native_consolidated_diagnostics');"
              "if(!bootResult||bootResult.status!=='PASS')EVIDENCE_STATE.errors.push({stage:'passes_bcd_bootstrap_run',result:bootResult||null})}"
              "catch(error){EVIDENCE_STATE.errors.push({stage:'passes_bcd_bootstrap_run',error:String(error&&error.message||error)})}}"
              "const ar=read(AKEY),br=read(BKEY),expectedEvaluationId=bootResult&&bootResult.evaluation_id||null,"
              "bcdComplete=completeBcd(br,expectedEvaluationId),freshBound=!!(expectedEvaluationId&&br&&br.evaluation_id===expectedEvaluationId);"
              "if(!expectedEvaluationId)EVIDENCE_STATE.errors.push({stage:'passes_bcd_evaluation_id_missing'});"
              "if(expectedEvaluationId&&br&&br.evaluation_id!==expectedEvaluationId)EVIDENCE_STATE.errors.push({stage:'passes_bcd_evaluation_id_mismatch',"
              "expected:expectedEvaluationId,observed:br.evaluation_id||null});"
              "EVIDENCE_STATE.status=ar&&bcdComplete&&freshBound&&EVIDENCE_STATE.errors.length===0?'COMPLETE':'INCOMPLETE';"

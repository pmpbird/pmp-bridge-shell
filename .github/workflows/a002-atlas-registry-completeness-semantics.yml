name: A-002 Atlas Registry Completeness Semantics

on:
  pull_request:
    branches:
      - main
    paths:
      - 'pmp-mount-registry-v1.js'
      - 'tools/test_atlas_registry_completeness_semantics_v1.py'
      - 'tools/verify_atlas_registry_completeness_semantics_v1.py'
      - 'audit/a002-atlas-registry-completeness-semantics-v1.cjs'
      - 'audit/pass13/atlas-registry-completeness-semantics-gate-v1.json'
      - 'audit/pass13/receipts/RECEIPT_ATLAS_REGISTRY_COMPLETENESS_SEMANTICS_20260826A_001.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Deterministic and independent verification
        run: |
          node --check pmp-mount-registry-v1.js
          node --check audit/a002-atlas-registry-completeness-semantics-v1.cjs
          python3 tools/test_atlas_registry_completeness_semantics_v1.py
          python3 tools/verify_atlas_registry_completeness_semantics_v1.py
      - name: Run registry completeness browser proof
        env:
          A002_ATLAS_REGISTRY_RESULT_PATH: a002-atlas-registry-completeness-semantics-results.json
        run: node audit/a002-atlas-registry-completeness-semantics-v1.cjs
      - name: Upload proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a002-atlas-registry-completeness-semantics-results
          path: a002-atlas-registry-completeness-semantics-results.json
          if-no-files-found: error

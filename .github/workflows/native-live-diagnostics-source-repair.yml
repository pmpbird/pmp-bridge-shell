name: Native live diagnostics source repair

on:
  push:
    branches:
      - chatgpt/native-live-diagnostics-source

permissions:
  contents: write

jobs:
  repair-and-reseal:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch exact diagnostics source and retire wrappers
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          root = Path('.')
          diag_path = root / 'pmp-diagnostics-consolidated-view-v1.js'
          text = diag_path.read_text('utf-8')

          text, n = re.subn(
              r"const V='[^']+';",
              "const V='2.3.0-native-live-receipts-20260730E';",
              text,
              count=1,
          )
          assert n == 1, 'diagnostics version replacement failed'

          native_functions = r'''
function liveFailureSummary(row){
  if(!row)return 'LIVE_DIAGNOSTIC_SECTION_MISSING';
  const issues=Array.isArray(row.issues)?row.issues:[];
  const codes=issues.map(item=>String(item&&item.code||item&&item.type||'')).filter(Boolean);
  return codes.length?codes.join(', '):String(row.status||'LIVE_DIAGNOSTIC_FAILED');
}
function nativeLiveHealthRow(key,row){
  const pass=!!(row&&String(row.status||'').toUpperCase()==='PASS');
  const summaries={
    app_orchestrator_system:'Current ownership runtime checked registered resources, writers, and helper declarations with no detected authority conflict.',
    active_path_and_routing:'Current Map, live frame chain, canonical Active Path, bounded Active Path, and current routing evidence were directly evaluated.',
    runtime_and_mount_lifecycle:'Current mount registry, lifecycle runtime, critical files, frames, and required APIs were directly evaluated.',
    bridge_system:'Bridge tab, surface, frame chain, owner boundary, and loaded Bridge scripts were directly evaluated.',
    library_system:'Library runtime, owner boundary, surface, entry, persistence, and current integration evidence were directly evaluated.',
    bank_system:'Bank tab, shell, detail slot, owner scripts, navigation, and live functionality were directly evaluated.',
    continuous_run_system:'Continuous Run level surfaces, expected levels, owner scripts, Resident runtime, and live state were directly evaluated.',
    errors_bug_watch_visual_stability:'Accessible documents, runtime errors, duplicate IDs, owner/DOM conflicts, Bug Watch, repaint helpers, and Diagnostic Journal publication were directly evaluated.'
  };
  return{
    status:pass?'PASS':'FAIL',
    summary:pass?summaries[key]:liveFailureSummary(row),
    evidence_reference:{
      type:row&&row.type||null,
      observed_at:row&&row.at||null,
      detail_path:'Full Diagnostics → '+key.replace(/_/g,' '),
      evidence_available:!!row,
      receipt_status:row&&row.status||'MISSING'
    }
  };
}
function nativeWholeAppHealth(){
  const a=read('pmp_diagnostic_coverage_pass_a_v1_receipt');
  const b=read('pmp_diagnostic_coverage_passes_bcd_v1_receipt');
  const source={
    app_orchestrator_system:a&&a.app_orchestrator_system,
    active_path_and_routing:a&&a.active_path_and_routing,
    runtime_and_mount_lifecycle:a&&a.runtime_and_mount_lifecycle,
    bridge_system:b&&b.bridge_system,
    library_system:b&&b.library_system,
    bank_system:b&&b.bank_system,
    continuous_run_system:b&&b.continuous_run_system,
    errors_bug_watch_visual_stability:b&&b.errors_bug_watch_visual_stability
  };
  const health={};
  Object.keys(source).forEach(key=>{health[key]=nativeLiveHealthRow(key,source[key])});
  return{
    type:'PMP_WHOLE_APP_HEALTH_V2',
    version:V,
    owner:OWNER,
    at:now(),
    scope:'compact health summary generated directly from current live diagnostic receipts for every major governed and implemented PMP system',
    health,
    overall:{
      failures:Object.keys(health).filter(key=>health[key].status==='FAIL'),
      warnings:[],
      not_proven:[]
    },
    live_coverage:{
      source_mode:'NATIVE_CONSOLIDATED_DIAGNOSTICS_SOURCE',
      pass_a:a?{version:a.version||null,status:a.status||null,at:a.at||null}:{status:'MISSING'},
      passes_bcd:b?{version:b.version||null,status:b.status||null,at:b.at||null}:{status:'MISSING'}
    },
    coverage_rule:'Whole App Health reads the current Pass A and Passes B-D receipts directly. Missing, stale, unavailable, or failed required evidence is an explicit FAIL; WARNING and NOT_PROVEN are not final classifications.',
    boundaries:{read_only:true,ownership_changes:false,helper_changes:false,route_changes:false,dom_repair:false,storage_migration:false,persisted_user_data_write:false}
  };
}
'''

          marker = 'function compactEvidence(key,e)'
          assert marker in text, 'compactEvidence marker missing'
          if 'function nativeWholeAppHealth()' not in text:
              text = text.replace(marker, native_functions + marker, 1)

          pattern = r"function wholeAppHealth\(report\)\{.*?\}\nfunction fullDiagnosticReport"
          replacement = "function wholeAppHealth(report){return nativeWholeAppHealth()}\nfunction fullDiagnosticReport"
          text, n = re.subn(pattern, replacement, text, count=1, flags=re.S)
          assert n == 1, 'wholeAppHealth source replacement failed'
          diag_path.write_text(text, 'utf-8')

          orch_path = root / 'pmp-app-orchestrator-v1.js'
          orch = orch_path.read_text('utf-8')
          orch = re.sub(
              r"const DIAGNOSTICS_CONSOLIDATED_VERSION='[^']+',DIAGNOSTICS_CONSOLIDATED_SRC='pmp-diagnostics-consolidated-view-v1\.js\?fresh=[^']+';",
              "const DIAGNOSTICS_CONSOLIDATED_VERSION='2.3.0-native-live-receipts-20260730E',DIAGNOSTICS_CONSOLIDATED_SRC='pmp-diagnostics-consolidated-view-v1.js?fresh=native-live-receipts-20260730E';",
              orch,
              count=1,
          )
          orch, n1 = re.subn(
              r"await load\(PASS_A_INTEGRATION_SRC,'PMPDiagnosticCoveragePassAIntegrationV1',PASS_A_INTEGRATION_VERSION\);const ai=.*?if\(ai&&ai\.install\)ai\.install\(\);",
              "",
              orch,
              count=1,
          )
          orch, n2 = re.subn(
              r"await load\(BCD_INTEGRATION_SRC,'PMPDiagnosticCoveragePassesBCDIntegrationV1',BCD_INTEGRATION_VERSION\);const bi=.*?if\(bi&&bi\.install\)bi\.install\(\);",
              "",
              orch,
              count=1,
          )
          assert n1 == 1, 'Pass A wrapper retirement failed'
          assert n2 == 1, 'B-D wrapper retirement failed'
          orch_path.write_text(orch, 'utf-8')

          boot_path = root / 'pmp-current-inner-cleanbug-rgcontrols-v30-direct-boot-surface-20260708A.html'
          boot = boot_path.read_text('utf-8')
          boot, removed = re.subn(
              r'<script src="pmp-diagnostic-coverage-pass-a-integration-v1\.js\?fresh=cross-frame-live-diagnostics-20260730D"></script>',
              '',
              boot,
              count=1,
          )
          assert removed == 1, 'explicit cross-frame wrapper script was not found'
          boot = boot.replace(
              'pmp-app-orchestrator-v1.js?fresh=live-diagnostics-a-through-f-integrity-reseal-20260730C',
              'pmp-app-orchestrator-v1.js?fresh=native-live-diagnostics-source-20260730E',
              1,
          )
          boot_path.write_text(boot, 'utf-8')
          PY

      - name: Verify JavaScript syntax and native contract
        run: |
          node --check pmp-diagnostics-consolidated-view-v1.js
          node --check pmp-app-orchestrator-v1.js
          python - <<'PY'
          from pathlib import Path
          text=Path('pmp-diagnostics-consolidated-view-v1.js').read_text('utf-8')
          assert "2.3.0-native-live-receipts-20260730E" in text
          assert "function wholeAppHealth(report){return nativeWholeAppHealth()}" in text
          assert "source_mode:'NATIVE_CONSOLIDATED_DIAGNOSTICS_SOURCE'" in text
          assert "warnings:[]" in text and "not_proven:[]" in text
          orch=Path('pmp-app-orchestrator-v1.js').read_text('utf-8')
          assert "native-live-receipts-20260730E" in orch
          assert "if(ai&&ai.install)ai.install()" not in orch
          assert "if(bi&&bi.install)bi.install()" not in orch
          boot=Path('pmp-current-inner-cleanbug-rgcontrols-v30-direct-boot-surface-20260708A.html').read_text('utf-8')
          assert "cross-frame-live-diagnostics-20260730D" not in boot
          assert "native-live-diagnostics-source-20260730E" in boot
          print('native source contract PASS')
          PY

      - name: Reseal protected runtime chain
        run: |
          python - <<'PY'
          import base64, hashlib, json, mimetypes, re
          from pathlib import Path

          root=Path('.')
          manifest_path=root/'pmp-runtime-integrity-manifest-v1.json'
          manifest=json.loads(manifest_path.read_text('utf-8'))
          def sha256(data): return hashlib.sha256(data).hexdigest()
          def blob(data): return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          for row in manifest['records']:
              data=(root/row['path']).read_bytes()
              digest=hashlib.sha256(data).digest()
              row['bytes']=len(data)
              row['git_blob_sha']=blob(data)
              row['sha256_hex']=digest.hex()
              row['sha256_base64']=base64.b64encode(digest).decode()
              row['sri']='sha256-'+base64.b64encode(digest).decode()
              row['mime_type']=mimetypes.guess_type(row['path'])[0] or 'application/octet-stream'
          manifest_path.write_text(json.dumps(manifest,indent=2,sort_keys=False)+'\n','utf-8')
          manifest_bytes=manifest_path.read_bytes()
          manifest_sha=sha256(manifest_bytes)

          identity={
            'records':[(r['path'],r['sha256_hex']) for r in manifest.get('records',[])],
            'historical_records':[(r['path'],r.get('repository_ref'),r['sha256_hex']) for r in manifest.get('historical_records',[])],
            'external_records':[(r['url'],r['sha256_hex']) for r in manifest.get('external_records',[])],
            'root_trust_anchors':manifest.get('root_trust_anchors',[]),
            'policy':{'algorithm':manifest.get('algorithm'),'unlisted_executable_policy':manifest.get('unlisted_executable_policy'),'network_policy':manifest.get('network_policy')},
          }
          runtime_identity=sha256(json.dumps(identity,sort_keys=True,separators=(',',':')).encode())

          bootstrap_path=root/'pmp-app-current.html'
          bootstrap=bootstrap_path.read_text('utf-8')
          bootstrap=re.sub(r"const target='[0-9a-f]{64}'",f"const target='{manifest_sha}'",bootstrap,count=1)
          bootstrap=re.sub(r"const MANIFEST_SHA256='[0-9a-f]{64}'",f"const MANIFEST_SHA256='{manifest_sha}'",bootstrap,count=1)
          bootstrap_path.write_text(bootstrap,'utf-8')

          seal_path=root/'audit/a003-manifest-seal.json'
          seal=json.loads(seal_path.read_text('utf-8'))
          seal['manifest_bytes']=len(manifest_bytes)
          seal['manifest_sha256']=manifest_sha
          seal['runtime_source_set_sha256']=runtime_identity
          seal['sealed_branch']='chatgpt/native-live-diagnostics-source'
          seal_path.write_text(json.dumps(seal,indent=2,sort_keys=True)+'\n','utf-8')

          receipt={
            'type':'PMP_NATIVE_LIVE_DIAGNOSTICS_SOURCE_REPAIR_V1',
            'version':'1.0.0-20260730E',
            'status':'PASS',
            'whole_app_health_version':'2.3.0-native-live-receipts-20260730E',
            'source_file':'pmp-diagnostics-consolidated-view-v1.js',
            'source_mode':'NATIVE_CONSOLIDATED_DIAGNOSTICS_SOURCE',
            'wrappers_retired':['PMPDiagnosticCoveragePassAIntegrationV1','PMPDiagnosticCoveragePassesBCDIntegrationV1','cross-frame boot integration'],
            'manifest_sha256':manifest_sha,
            'runtime_source_set_sha256':runtime_identity,
            'protected_record_count':len(manifest['records']),
            'required_live_output':{'warnings':[],'not_proven':[],'live_coverage_required':True},
            'boundaries':{'ownership_changes':False,'helper_changes':False,'route_destination_changes':False,'bank_rebuild':False,'continuous_run_mutation':False,'storage_migration':False,'persisted_user_data_write':False},
          }
          out=root/'audit/diagnostics/native-live-diagnostics-source-repair-20260730E.json'
          out.parent.mkdir(parents=True,exist_ok=True)
          out.write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n','utf-8')
          print(json.dumps(receipt,indent=2))
          PY

      - name: Commit repaired and resealed source
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add pmp-diagnostics-consolidated-view-v1.js pmp-app-orchestrator-v1.js pmp-current-inner-cleanbug-rgcontrols-v30-direct-boot-surface-20260708A.html pmp-runtime-integrity-manifest-v1.json pmp-app-current.html audit/a003-manifest-seal.json audit/diagnostics/native-live-diagnostics-source-repair-20260730E.json
          git diff --cached --quiet || git commit -m "Install native live diagnostics source and reseal [skip ci]"
          git push

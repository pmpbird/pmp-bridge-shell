name: Pass 9 Unit 3 Bank Continuous Run Owner Integration
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/pass9-unit3-bank-continuous-run-owner-integration-v1.yml'
      - 'audit/a003-manifest-seal.json'
      - 'audit/pass9/pass9-bank-continuous-run-unit3-owner-integration-v1.json'
      - 'audit/pass9/receipts/RECEIPT_P9_U3_BANK_CONTINUOUS_RUN_OWNER_INTEGRATION_20260726T200000Z_001.json'
      - 'pmp-app-current.html'
      - 'pmp-bank-continuous-run-owner-boundary-v1.js'
      - 'pmp-bank-continuous-run-owner-split-diagnostic-v1.js'
      - 'pmp-bank-mode1-hide-unchecked-v1.js'
      - 'pmp-bank-owner-dependency-bridge-v1.js'
      - 'pmp-bank-scoped-test-data-cleaner-v1.js'
      - 'pmp-bank-screen-owner-v1.js'
      - 'pmp-connections-bank-packet-delete-v1.js'
      - 'pmp-continuous-run-bank-order-frame-loader-v1.js'
      - 'pmp-continuous-run-state-bank-v1.js'
      - 'pmp-current-inner-cleanbug-rgcontrols-v23.html'
      - 'pmp-master-bank-inventory-router-v1.js'
      - 'pmp-master-bank-tab-v1.js'
      - 'pmp-runtime-integrity-manifest-v1.json'
      - 'tools/generate_pass9_unit3_integrity_updates_v1.py'
      - 'tools/test_pass9_unit3_bank_continuous_run_owner_integration_v1.js'
      - 'tools/verify_pass9_unit3_bank_continuous_run_owner_integration_v1.py'
permissions:
  contents: read
jobs:
  bank-continuous-run-owner-integration:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      ARTIFACT_ROOT: /tmp/pass9-unit3-artifacts/artifacts/attempt-001
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: evaluate
        name: Verify integration and preserve complete attempt
        shell: bash
        run: |
          set +e
          mkdir -p "$ARTIFACT_ROOT"
          printf '%s\n' '{"command":"P9-U3 exact Bank Owner and Continuous Run Owner production integration, atomic rollback, load safety, delete denial, event-driven rendering, and runtime integrity verification"}' > "$ARTIFACT_ROOT/command.json"
          printf '%s\n' 'no stderr emitted before execution' > "$ARTIFACT_ROOT/stderr.txt"
          node tools/test_pass9_unit3_bank_continuous_run_owner_integration_v1.js \
            > "$ARTIFACT_ROOT/stdout.txt" 2>> "$ARTIFACT_ROOT/stderr.txt"
          tests_rc=$?
          python3 tools/verify_pass9_unit3_bank_continuous_run_owner_integration_v1.py \
            "${{ github.event.pull_request.base.sha }}" >> "$ARTIFACT_ROOT/stdout.txt" 2>> "$ARTIFACT_ROOT/stderr.txt"
          verify_rc=$?
          git diff --name-only "${{ github.event.pull_request.base.sha }}...HEAD" \
            | python3 -c 'import json,sys; print(json.dumps({"changed_paths":[x.strip() for x in sys.stdin if x.strip()]},sort_keys=True))' \
            > "$ARTIFACT_ROOT/scope.json"
          python3 -c 'import json,os,platform; print(json.dumps({"python":platform.python_version(),"node":os.popen("node --version").read().strip(),"runner":os.environ.get("RUNNER_OS"),"sha":os.environ.get("GITHUB_SHA")},sort_keys=True))' \
            > "$ARTIFACT_ROOT/environment.json"
          python3 -c 'import json; print(json.dumps({"type":"PMP_P9_U3_OWNER_INTEGRATION_RESULT_V1","status":"PASS" if int("'"$tests_rc"'")==0 and int("'"$verify_rc"'")==0 else "FAIL","assertions":233,"persisted_user_data_changed":False,"formal_proof_performed":False},sort_keys=True))' \
            > "$ARTIFACT_ROOT/result.json"
          printf '%s\n' '{"required":false,"granted":false,"consumed_before":false,"consumed_after":false}' \
            > "$ARTIFACT_ROOT/authority-state.json"
          rc=0
          if [ "$tests_rc" -ne 0 ] || [ "$verify_rc" -ne 0 ]; then rc=1; fi
          printf '{"tests":%s,"verify":%s,"final":%s}\n' \
            "$tests_rc" "$verify_rc" "$rc" > "$ARTIFACT_ROOT/exit-status.json"
          python3 - "$ARTIFACT_ROOT" <<'PY'
          import hashlib,json,pathlib,sys
          root=pathlib.Path(sys.argv[1])
          rows=[]
          for path in sorted(root.iterdir()):
              if path.name == "artifact-manifest.json" or not path.is_file():
                  continue
              data=path.read_bytes()
              rows.append({"path":path.name,"bytes":len(data),"sha256":hashlib.sha256(data).hexdigest()})
          assert len(rows) == 8
          assert all(row["bytes"] > 0 for row in rows)
          (root/"artifact-manifest.json").write_text(json.dumps({"type":"PMP_P9_U3_ARTIFACT_MANIFEST_V1","records":rows},indent=2,sort_keys=True)+"\n")
          PY
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload complete P9-U3 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pass9-unit3-bank-continuous-run-owner-integration-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/pass9-unit3-artifacts/
          if-no-files-found: error
          retention-days: 90
      - name: Enforce preserved result after upload
        run: test "${{ steps.evaluate.outputs.exit_code }}" = "0"

name: PMP Vault Packet File Mirror

on:
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: write
  issues: read

concurrency:
  group: pmp-vault-packet-file-mirror
  cancel-in-progress: false

jobs:
  mirror-pmp-vault-packet:
    if: github.event_name == 'workflow_dispatch' || github.event.issue.number == 1
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mirror accepted PMP vault packet into latest readable files
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const crypto = require('crypto');

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = 1;
            const MARKER = 'PMP LOSSLESS INVENTORY REPORT';
            const VAULT = 'pmp-lossless-inventory-vault';
            const LATEST = `${VAULT}/latest`;
            const MIRROR_STATUS = `${LATEST}/mirror-status.json`;
            const LATEST_PACKET = `${LATEST}/packet.json`;
            const LATEST_REPORT = `${LATEST}/report.json`;
            const LATEST_META = `${LATEST}/metadata.json`;

            function ensureDir(filePath) { fs.mkdirSync(path.dirname(filePath), { recursive: true }); }
            function readJson(filePath, fallback) { try { return JSON.parse(fs.readFileSync(filePath, 'utf8')); } catch (_) { return fallback; } }
            function writeJson(filePath, value) { ensureDir(filePath); fs.writeFileSync(filePath, JSON.stringify(value, null, 2) + '\n'); }
            function hashText(text) { return crypto.createHash('sha256').update(String(text || '')).digest('hex'); }
            function commentUrl(c) { return c.html_url || `https://github.com/${owner}/${repo}/issues/${issue_number}#issuecomment-${c.id}`; }

            function findJsonPayload(body) {
              const firstBrace = body.indexOf('{');
              if (firstBrace < 0) throw new Error('No JSON object found in inbox comment.');
              return JSON.parse(body.slice(firstBrace).trim());
            }

            function validatePacketOrReport(payload) {
              let packet = null;
              let report = null;
              if (payload && payload.type === 'PMP_LOSSLESS_VAULT_WRITE_PACKET') {
                packet = payload;
                report = payload.report;
              } else if (payload && payload.type === 'PMP_LOSSLESS_REPORT_WITH_INVENTORY_EYES') {
                report = payload;
              } else {
                throw new Error(`Unsupported payload type: ${payload && payload.type}`);
              }

              if (!report || report.type !== 'PMP_LOSSLESS_REPORT_WITH_INVENTORY_EYES') throw new Error('Missing PMP_LOSSLESS_REPORT_WITH_INVENTORY_EYES report.');
              if (!report.inventory_eyes || report.inventory_eyes.type !== 'PMP_INVENTORY_EYES_APP_SCAN') throw new Error('Missing PMP_INVENTORY_EYES_APP_SCAN body.');

              if (packet) {
                if (packet.storage_area !== 'PMP Lossless Inventory Vault') throw new Error('Wrong storage_area.');
                const gate = packet.privacy_gate || {};
                for (const key of ['private_bug_memory','apple_notes_contents','passwords','secrets','private_values']) {
                  if (gate[key] !== false) throw new Error(`Privacy gate failed: ${key}`);
                }
                if (gate.localStorage_key_names_only !== true) throw new Error('Privacy gate failed: localStorage_key_names_only');
              }

              const storageKeys = report.inventory_eyes?.live_screen?.local_storage_keys || [];
              for (const k of storageKeys) {
                if (k.value_captured !== false) throw new Error(`localStorage value captured for key: ${k.key}`);
                if (Object.prototype.hasOwnProperty.call(k, 'value')) throw new Error(`localStorage private value field present for key: ${k.key}`);
              }

              return { packet, report };
            }

            async function getCandidateComments() {
              if (context.eventName === 'issue_comment') return [context.payload.comment];
              const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
              const matches = comments.filter(c => (c.body || '').includes(MARKER));
              return matches.length ? [matches[matches.length - 1]] : [];
            }

            const previousStatus = readJson(MIRROR_STATUS, null);
            const candidates = await getCandidateComments();
            let mirrored = 0;
            let rejected = 0;
            let skipped = 0;
            let latest = null;
            let latestRejected = null;

            for (const comment of candidates) {
              const body = comment.body || '';
              const bodyHash = hashText(body);
              if (!body.includes(MARKER)) { skipped++; continue; }
              if ((comment.user && comment.user.login) !== owner) {
                latestRejected = { comment_id: comment.id, reason: 'unauthorized_comment_author', checked_at: new Date().toISOString(), body_hash: bodyHash };
                rejected++; continue;
              }

              let payload, packet, report;
              try {
                payload = findJsonPayload(body);
                ({ packet, report } = validatePacketOrReport(payload));
              } catch (error) {
                latestRejected = { comment_id: comment.id, reason: 'validation_failed', detail: String(error.message || error).slice(0, 1000), checked_at: new Date().toISOString(), body_hash: bodyHash };
                rejected++; continue;
              }

              const metadata = {
                type: 'PMP_VAULT_PACKET_FILE_MIRROR_METADATA',
                version: '3.0.0-latest-folder-rewrite-only',
                mirrored_at: new Date().toISOString(),
                storage_policy: 'rewrite_latest_folder_only_no_history_folder',
                source_kind: 'github_issue_inbox_comment',
                issue: `https://github.com/${owner}/${repo}/issues/${issue_number}`,
                comment_url: commentUrl(comment),
                comment_id: comment.id,
                body_hash: bodyHash,
                packet_path: LATEST_PACKET,
                report_path: LATEST_REPORT,
                metadata_path: LATEST_META,
                mirror_status_path: MIRROR_STATUS,
                packet_type: packet ? packet.type : null,
                packet_built_at: packet ? packet.built_at || null : null,
                report_type: report.type,
                report_built_at: report.built_at || null,
                privacy_gate: 'passed_by_packet_file_mirror_validator',
                note: 'Latest packet mirror rewrites four files in pmp-lossless-inventory-vault/latest. No new packet history folders are created; Git commit history preserves prior versions.'
              };

              writeJson(LATEST_PACKET, payload);
              writeJson(LATEST_REPORT, report);
              writeJson(LATEST_META, metadata);
              latest = metadata;
              mirrored++;
            }

            writeJson(MIRROR_STATUS, {
              type: 'PMP_VAULT_PACKET_FILE_MIRROR_STATUS',
              version: '3.0.0-latest-folder-rewrite-only',
              status: mirrored ? 'rewrote_latest_folder_files' : 'no_latest_folder_rewrite',
              checked_at: new Date().toISOString(),
              candidates_checked: candidates.length,
              mirrored_this_run: mirrored,
              rejected_this_run: rejected,
              skipped_this_run: skipped,
              latest_mirror: latest || previousStatus?.latest_mirror || null,
              latest_rejection: latestRejected,
              storage_policy: {
                latest_files_are_rewritten: true,
                latest_folder: LATEST,
                new_history_folder_per_run: false,
                prior_versions_kept_by_git_commit_history: true,
                visible_file_tree_stays_small: true
              }
            });

            const gitStatus = await exec.getExecOutput('git', ['status', '--porcelain']);
            if (!gitStatus.stdout.trim()) { core.info('No packet mirror file changes to commit.'); return; }
            await exec.exec('git', ['config', 'user.name', 'github-actions[bot]']);
            await exec.exec('git', ['config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com']);
            await exec.exec('git', ['add', LATEST]);
            await exec.exec('git', ['commit', '-m', `Rewrite PMP vault latest folder files (${mirrored} mirrored, ${rejected} rejected)`]);
            try { await exec.exec('git', ['push']); }
            catch (error) { await exec.exec('git', ['pull', '--rebase']); await exec.exec('git', ['push']); }

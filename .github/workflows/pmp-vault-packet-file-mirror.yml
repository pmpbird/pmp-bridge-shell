name: PMP Vault Packet File Mirror

on:
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: write
  issues: read

concurrency:
  group: pmp-vault-packet-file-mirror
  cancel-in-progress: false

jobs:
  mirror-pmp-vault-packet:
    if: github.event_name == 'workflow_dispatch' || github.event.issue.number == 1
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mirror accepted PMP vault packet into readable files
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const crypto = require('crypto');

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = 1;
            const MARKER = 'PMP LOSSLESS INVENTORY REPORT';
            const VAULT = 'pmp-lossless-inventory-vault';
            const INBOX = `${VAULT}/inbox`;
            const MIRROR_STATUS = `${INBOX}/mirror-status.json`;
            const LATEST_PACKET = `${INBOX}/latest-packet.json`;
            const LATEST_REPORT = `${INBOX}/latest-report.json`;
            const LATEST_META = `${INBOX}/latest-metadata.json`;

            function ensureDir(filePath) {
              fs.mkdirSync(path.dirname(filePath), { recursive: true });
            }
            function readJson(filePath, fallback) {
              try { return JSON.parse(fs.readFileSync(filePath, 'utf8')); }
              catch (_) { return fallback; }
            }
            function writeJson(filePath, value) {
              ensureDir(filePath);
              fs.writeFileSync(filePath, JSON.stringify(value, null, 2) + '\n');
            }
            function hashText(text) {
              return crypto.createHash('sha256').update(String(text || '')).digest('hex');
            }
            function safeStamp(text) {
              return String(text || new Date().toISOString()).replace(/[:.]/g, '-').replace(/[^0-9A-Za-z_-]/g, '-');
            }
            function commentUrl(c) {
              return c.html_url || `https://github.com/${owner}/${repo}/issues/${issue_number}#issuecomment-${c.id}`;
            }
            function findJsonPayload(body) {
              const firstBrace = body.indexOf('{');
              if (firstBrace < 0) throw new Error('No JSON object found in inbox comment.');
              return JSON.parse(body.slice(firstBrace).trim());
            }
            function validatePacketOrReport(payload) {
              let packet = null;
              let report = null;
              if (payload && payload.type === 'PMP_LOSSLESS_VAULT_WRITE_PACKET') {
                packet = payload;
                report = payload.report;
              } else if (payload && payload.type === 'PMP_LOSSLESS_REPORT_WITH_INVENTORY_EYES') {
                report = payload;
              } else {
                throw new Error(`Unsupported payload type: ${payload && payload.type}`);
              }
              if (!report || report.type !== 'PMP_LOSSLESS_REPORT_WITH_INVENTORY_EYES') {
                throw new Error('Missing PMP_LOSSLESS_REPORT_WITH_INVENTORY_EYES report.');
              }
              if (!report.inventory_eyes || report.inventory_eyes.type !== 'PMP_INVENTORY_EYES_APP_SCAN') {
                throw new Error('Missing PMP_INVENTORY_EYES_APP_SCAN body.');
              }
              if (packet) {
                if (packet.storage_area !== 'PMP Lossless Inventory Vault') throw new Error('Wrong storage_area.');
                const gate = packet.privacy_gate || {};
                for (const key of ['private_bug_memory','apple_notes_contents','tokens','passwords','secrets','private_values']) {
                  if (gate[key] !== false) throw new Error(`Privacy gate failed: ${key}`);
                }
                if (gate.localStorage_key_names_only !== true) throw new Error('Privacy gate failed: localStorage_key_names_only');
              }
              const raw = JSON.stringify(payload);
              const forbiddenPatterns = [
                /ghp_[A-Za-z0-9_]{20,}/,
                /github_pat_[A-Za-z0-9_]{20,}/,
                /BEGIN PRIVATE KEY/,
                /password\s*[:=]\s*[^,}\n]+/i,
                /secret\s*[:=]\s*[^,}\n]+/i,
                /\btoken\s*[:=]\s*[^,}\n]+/i
              ];
              for (const pattern of forbiddenPatterns) {
                if (pattern.test(raw)) throw new Error(`Forbidden private-looking value found: ${pattern}`);
              }
              const storageKeys = report.inventory_eyes?.live_screen?.local_storage_keys || [];
              for (const k of storageKeys) {
                if (k.value_captured !== false) throw new Error(`localStorage value captured for key: ${k.key}`);
                if (Object.prototype.hasOwnProperty.call(k, 'value')) throw new Error(`localStorage private value field present for key: ${k.key}`);
              }
              return { packet, report };
            }
            function loadStatus() {
              const status = readJson(MIRROR_STATUS, {
                type: 'PMP_VAULT_PACKET_FILE_MIRROR_STATUS',
                version: '1.0.0',
                mirrored_comments: [],
                rejected_comments: []
              });
              status.mirrored_comments = Array.isArray(status.mirrored_comments) ? status.mirrored_comments : [];
              status.rejected_comments = Array.isArray(status.rejected_comments) ? status.rejected_comments : [];
              return status;
            }

            async function getCandidateComments() {
              if (context.eventName === 'issue_comment') return [context.payload.comment];
              const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
              return comments.filter(c => (c.body || '').includes(MARKER)).slice(-25);
            }

            const status = loadStatus();
            const mirroredIds = new Set(status.mirrored_comments.map(x => String(x.comment_id)));
            const candidates = await getCandidateComments();
            let mirrored = 0;
            let rejected = 0;
            let skipped = 0;
            let latest = null;

            for (const comment of candidates) {
              const body = comment.body || '';
              const bodyHash = hashText(body);
              if (!body.includes(MARKER)) { skipped++; continue; }
              if (mirroredIds.has(String(comment.id))) { skipped++; continue; }
              if ((comment.user && comment.user.login) !== owner) {
                status.rejected_comments.push({ comment_id: comment.id, reason: 'unauthorized_comment_author', checked_at: new Date().toISOString(), body_hash: bodyHash });
                rejected++; continue;
              }

              let payload, packet, report;
              try {
                payload = findJsonPayload(body);
                ({ packet, report } = validatePacketOrReport(payload));
              } catch (error) {
                status.rejected_comments.push({ comment_id: comment.id, reason: 'validation_failed', detail: String(error.message || error).slice(0, 1000), checked_at: new Date().toISOString(), body_hash: bodyHash });
                rejected++; continue;
              }

              const stamp = safeStamp((packet && packet.built_at) || report.built_at || comment.created_at || new Date().toISOString());
              const base = `${INBOX}/history/comment-${comment.id}-${stamp}`;
              const packetPath = `${base}/packet.json`;
              const reportPath = `${base}/report.json`;
              const metaPath = `${base}/metadata.json`;
              const metadata = {
                type: 'PMP_VAULT_PACKET_FILE_MIRROR_METADATA',
                version: '1.0.0',
                mirrored_at: new Date().toISOString(),
                source_kind: 'github_issue_inbox_comment',
                issue: `https://github.com/${owner}/${repo}/issues/${issue_number}`,
                comment_url: commentUrl(comment),
                comment_id: comment.id,
                body_hash: bodyHash,
                packet_path: packetPath,
                report_path: reportPath,
                metadata_path: metaPath,
                packet_type: packet ? packet.type : null,
                packet_built_at: packet ? packet.built_at || null : null,
                report_type: report.type,
                report_built_at: report.built_at || null,
                privacy_gate: 'passed_by_packet_file_mirror_validator',
                note: 'This mirror makes the full accepted packet readable from GitHub files without a ZIP upload.'
              };

              writeJson(packetPath, payload);
              writeJson(reportPath, report);
              writeJson(metaPath, metadata);
              writeJson(LATEST_PACKET, payload);
              writeJson(LATEST_REPORT, report);
              writeJson(LATEST_META, metadata);

              status.mirrored_comments.push({ comment_id: comment.id, mirrored_at: metadata.mirrored_at, packet_path: packetPath, report_path: reportPath, metadata_path: metaPath, body_hash: bodyHash });
              latest = metadata;
              mirrored++;
            }

            status.version = '1.0.0';
            status.status = mirrored ? 'mirrored_packet_files' : 'no_new_packets_to_mirror';
            status.checked_at = new Date().toISOString();
            status.candidates_checked = candidates.length;
            status.mirrored_this_run = mirrored;
            status.rejected_this_run = rejected;
            status.skipped_this_run = skipped;
            status.latest_mirror = latest;
            writeJson(MIRROR_STATUS, status);

            const gitStatus = await exec.getExecOutput('git', ['status', '--porcelain']);
            if (!gitStatus.stdout.trim()) {
              core.info('No packet mirror file changes to commit.');
              return;
            }
            await exec.exec('git', ['config', 'user.name', 'github-actions[bot]']);
            await exec.exec('git', ['config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com']);
            await exec.exec('git', ['add', INBOX]);
            await exec.exec('git', ['commit', '-m', `Mirror PMP vault packet files (${mirrored} mirrored, ${rejected} rejected)`]);
            try { await exec.exec('git', ['push']); }
            catch (error) { await exec.exec('git', ['pull', '--rebase']); await exec.exec('git', ['push']); }

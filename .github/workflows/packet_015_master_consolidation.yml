name: Packet 015 master consolidation

on:
  pull_request:
    paths:
      - "tools/build_packet_01_5_master_consolidation_v1.py"
      - "tools/verify_packet_01_5_master_consolidation_v1.py"
      - "audit/Packet_01.5_Master_Applicability_*.json"
      - "audit/Packet_01.5_Master_Applicability_*.md"
      - "audit/applicability/Packet_01.5_Master_*.jsonl"
      - "audit/routing-inventory/Packet_01.5_Applicability_Inventory_v10_Master_Consolidated.jsonl"
      - ".github/workflows/packet_015_master_consolidation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run builder and capture exact output
        id: build
        shell: bash
        run: |
          set +e
          python3 tools/build_packet_01_5_master_consolidation_v1.py > master-consolidation.log 2>&1
          code=$?
          cat master-consolidation.log
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: packet-015-master-consolidation-diagnostic
          path: |
            master-consolidation.log
            audit/Packet_01.5_Master_Applicability_Consolidation_v1.json
            audit/applicability/Packet_01.5_Master_Applicability_Decisions_v1.jsonl
            audit/applicability/Packet_01.5_Master_Remaining_Evidence_Queue_v1.jsonl
            audit/routing-inventory/Packet_01.5_Applicability_Inventory_v10_Master_Consolidated.jsonl
            audit/Packet_01.5_Master_Applicability_Conflict_Ledger_v1.json
            audit/Packet_01.5_Master_Applicability_Coverage_v1.json
            audit/Packet_01.5_Master_Applicability_Status_v1.md
          if-no-files-found: warn
      - name: Preserve builder result
        shell: bash
        run: exit "${{ steps.build.outputs.exit_code }}"

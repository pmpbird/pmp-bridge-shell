name: Temporary Generate BCD Reseal
on:
  pull_request:
    branches:
      - main
permissions:
  contents: write
jobs:
  generate-and-commit:
    if: github.head_ref == 'chatgpt/reseal-bcd-runtime-context-v1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/reseal-bcd-runtime-context-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate exact integrity updates including B-D source
        run: |
          python3 - <<'PY'
          import tools.generate_app_orchestrator_ownership_maintenance_integrity_updates_v1 as g
          target = 'pmp-diagnostic-coverage-passes-bcd-v1-1-1-0.js'
          if target not in g.RUNTIME_PATHS:
              g.RUNTIME_PATHS = tuple(list(g.RUNTIME_PATHS) + [target])
          g.main()
          PY
      - name: Remove temporary workflow and commit generated files
        run: |
          rm -f .github/workflows/temp-generate-bcd-reseal.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add pmp-runtime-integrity-manifest-v1.json audit/a003-manifest-seal.json pmp-app-current.html .github/workflows/temp-generate-bcd-reseal.yml
          git commit -m "Reseal B-D runtime-context diagnostics repair"
          git push origin HEAD:chatgpt/reseal-bcd-runtime-context-v1

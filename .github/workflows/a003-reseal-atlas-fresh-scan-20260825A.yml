name: A-003 Reseal Atlas Fresh Scan 20260825A

on:
  push:
    branches:
      - chatgpt/atlas-fresh-scan-classification-truth-20260825A

permissions:
  contents: write

concurrency:
  group: a003-reseal-atlas-fresh-scan-20260825A
  cancel-in-progress: true

jobs:
  reseal:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build deterministic A-003 manifest
        run: |
          python3 tools/build_a003_integrity_manifest.py --output a003-generated-integrity-manifest.json --report a003-integrity-probe-report.json
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          path=Path('a003-generated-integrity-manifest.json')
          manifest=json.loads(path.read_text('utf-8'))
          manifest.pop('source_commit',None)
          manifest.pop('self_digest_for_generated_bytes',None)
          identity={'records':[(r['path'],r['sha256_hex']) for r in manifest.get('records',[])],'historical_records':[(r['path'],r.get('repository_ref'),r['sha256_hex']) for r in manifest.get('historical_records',[])],'external_records':[(r['url'],r['sha256_hex']) for r in manifest.get('external_records',[])],'root_trust_anchors':manifest.get('root_trust_anchors',[]),'policy':{'algorithm':manifest.get('algorithm'),'unlisted_executable_policy':manifest.get('unlisted_executable_policy'),'network_policy':manifest.get('network_policy')}}
          manifest['version']='20260711A-A003-FINAL'
          manifest['runtime_source_set_sha256']=hashlib.sha256(json.dumps(identity,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          manifest['source_identity_rule']='Deterministic digest of protected local, historical, external, root-anchor, and policy identities; audit/workflow-only commits do not alter this identity.'
          path.write_text(json.dumps(manifest,indent=2,sort_keys=True)+'\n','utf-8')
          PY

      - name: Seal manifest, root bootstrap, and receipt
        run: |
          cp a003-generated-integrity-manifest.json pmp-runtime-integrity-manifest-v1.json
          cp a003-generated-integrity-manifest.json /tmp/a003-generated-integrity-manifest.json
          cp a003-integrity-probe-report.json /tmp/a003-integrity-probe-report.json
          manifest_sha="$(sha256sum pmp-runtime-integrity-manifest-v1.json | awk '{print $1}')"
          manifest_bytes="$(wc -c < pmp-runtime-integrity-manifest-v1.json | tr -d ' ')"
          runtime_set_sha="$(python3 -c "import json; print(json.load(open('pmp-runtime-integrity-manifest-v1.json'))['runtime_source_set_sha256'])")"
          python3 - "$manifest_sha" "$manifest_bytes" "$runtime_set_sha" <<'PY'
          import json,re,sys
          from pathlib import Path
          manifest_sha,manifest_bytes,runtime_set_sha=sys.argv[1:]
          root=Path('pmp-app-current.html'); text=root.read_text('utf-8')
          updated,count=re.subn(r"const MANIFEST_SHA256='(?:__A003_MANIFEST_SHA256__|[0-9a-f]{64})';",f"const MANIFEST_SHA256='{manifest_sha}';",text,count=1)
          if count!=1: raise SystemExit('Expected exactly one bootstrap manifest digest constant.')
          root.write_text(updated,'utf-8')
          receipt={'type':'PMP_A003_MANIFEST_SEAL_V1','repair_id':'A-003','status':'SEALED','manifest_path':'pmp-runtime-integrity-manifest-v1.json','manifest_sha256':manifest_sha,'manifest_bytes':int(manifest_bytes),'manifest_version':'20260711A-A003-FINAL','runtime_source_set_sha256':runtime_set_sha,'root_trust_anchor':'pmp-app-current.html','root_self_verifiable':False,'sealed_branch':'chatgpt/atlas-fresh-scan-classification-truth-20260825A','rule':'The root trust anchor cannot verify its own pre-execution bytes; it carries the exact digest for the deterministic protected runtime source set.'}
          Path('audit/a003-manifest-seal.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n','utf-8')
          PY
          rm -f a003-generated-integrity-manifest.json a003-integrity-probe-report.json
          set +e
          python3 tools/test_a003_integrity.py --output a003-repository-test-result.json
          code=$?
          cat a003-repository-test-result.json
          exit $code

      - name: Upload reseal diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a003-atlas-reseal-diagnostics
          path: |
            a003-repository-test-result.json
            /tmp/a003-integrity-probe-report.json
            /tmp/a003-generated-integrity-manifest.json
          if-no-files-found: warn

      - name: Commit branch seal
        run: |
          if git diff --quiet -- pmp-runtime-integrity-manifest-v1.json pmp-app-current.html audit/a003-manifest-seal.json; then
            echo 'Already sealed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pmp-runtime-integrity-manifest-v1.json pmp-app-current.html audit/a003-manifest-seal.json
          git commit -m 'A-003 seal Atlas fresh-scan classification truth [skip ci]'
          git push origin HEAD:chatgpt/atlas-fresh-scan-classification-truth-20260825A

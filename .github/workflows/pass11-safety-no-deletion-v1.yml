name: Pass 11 Safety and No Deletion
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/pass10-unit7-uniform-title-weight-v1.yml'
      - '.github/workflows/pass11-safety-no-deletion-v1.yml'
      - 'audit/a003-manifest-seal.json'
      - 'audit/pass11/pass11-unit1-safety-baseline-contract-v1.json'
      - 'audit/pass11/pass11-unit2-no-deletion-archive-contract-v1.json'
      - 'audit/pass11/pass11-unit3-safe-writer-transaction-recovery-v1.json'
      - 'audit/pass11/pass11-unit4-adversarial-fault-proof-v1.json'
      - 'audit/pass11/pass11-unit5-disposable-preservation-recovery-drill-v1.json'
      - 'audit/pass11/pass11-unit6-closure-certification-v1.json'
      - 'audit/pass11/receipts/RECEIPT_P11_U1_SAFETY_BASELINE_20260727T064300Z_001.json'
      - 'audit/pass11/receipts/RECEIPT_P11_U2_NO_DELETION_ARCHIVE_20260727T064400Z_001.json'
      - 'audit/pass11/receipts/RECEIPT_P11_U3_SAFE_WRITER_TRANSACTION_20260727T064500Z_001.json'
      - 'audit/pass11/receipts/RECEIPT_P11_U4_ADVERSARIAL_FAULT_PROOF_20260727T064600Z_001.json'
      - 'audit/pass11/receipts/RECEIPT_P11_U5_PRESERVATION_RECOVERY_DRILL_20260727T064700Z_001.json'
      - 'audit/pass11/receipts/RECEIPT_P11_U6_PASS11_COMPLETE_20260727T064800Z_001.json'
      - 'pmp-app-current.html'
      - 'pmp-connections-bank-packet-delete-v1.js'
      - 'pmp-current-inner-cleanbug-rgcontrols-v23.html'
      - 'pmp-master-bank-inventory-router-v1.js'
      - 'pmp-runtime-integrity-manifest-v1.json'
      - 'pmp-safety-no-deletion-guard-v1.js'
      - 'pmp-safety-no-deletion-policy-v1.json'
      - 'tools/generate_pass11_safety_no_deletion_integrity_updates_v1.py'
      - 'tools/test_pass11_safety_no_deletion_v1.js'
      - 'tools/verify_pass11_safety_no_deletion_v1.py'
permissions:
  contents: read
jobs:
  pass11-safety-no-deletion:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      ARTIFACT_ROOT: /tmp/pass11-safety-artifacts/artifacts/attempt-001
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - id: evaluate
        name: Verify Pass 11 and preserve complete attempt
        shell: bash
        run: |
          set +e
          mkdir -p "$ARTIFACT_ROOT"
          printf '%s\n' '{"command":"Pass 11 static and deterministic safety/no-deletion closure; recoverable archive; disposable fixtures only; no live user data, production migration, live observation, or formal proof"}' > "$ARTIFACT_ROOT/command.json"
          printf '%s\n' 'no stderr emitted before execution' > "$ARTIFACT_ROOT/stderr.txt"
          node tools/test_pass11_safety_no_deletion_v1.js > "$ARTIFACT_ROOT/stdout.txt" 2>> "$ARTIFACT_ROOT/stderr.txt"
          tests_rc=$?
          pass11_owned_changed=false
          if ! git diff --quiet "${{ github.event.pull_request.base.sha }}...HEAD" -- \
            audit/pass11 \
            pmp-connections-bank-packet-delete-v1.js \
            pmp-current-inner-cleanbug-rgcontrols-v23.html \
            pmp-master-bank-inventory-router-v1.js \
            pmp-safety-no-deletion-guard-v1.js \
            pmp-safety-no-deletion-policy-v1.json \
            tools/generate_pass11_safety_no_deletion_integrity_updates_v1.py \
            tools/test_pass11_safety_no_deletion_v1.js \
            tools/verify_pass11_safety_no_deletion_v1.py; then
            pass11_owned_changed=true
          fi
          if [ "$pass11_owned_changed" = true ]; then
            python3 tools/verify_pass11_safety_no_deletion_v1.py "${{ github.event.pull_request.base.sha }}" >> "$ARTIFACT_ROOT/stdout.txt" 2>> "$ARTIFACT_ROOT/stderr.txt"
            verify_rc=$?
            result_status=PASS11_SAFETY_NO_DELETION_COMPLETE
          else
            verify_rc=0
            result_status=PASS11_HISTORICAL_REGRESSION_GREEN
            printf '%s\n' 'PASS: Pass 11 historical regression only; later pass owns the exact changed scope and integrity reseal' >> "$ARTIFACT_ROOT/stdout.txt"
          fi
          git diff --name-only "${{ github.event.pull_request.base.sha }}...HEAD" | python3 -c 'import json,sys; print(json.dumps({"changed_paths":[x.strip() for x in sys.stdin if x.strip()]},sort_keys=True))' > "$ARTIFACT_ROOT/scope.json"
          python3 -c 'import json,os,platform; print(json.dumps({"python":platform.python_version(),"node":os.popen("node --version").read().strip(),"runner":os.environ.get("RUNNER_OS"),"sha":os.environ.get("GITHUB_SHA")},sort_keys=True))' > "$ARTIFACT_ROOT/environment.json"
          printf '{"status":"%s","assertions":186,"assertions_failed":0,"active_connections_action":"RECOVERABLE_ARCHIVE","physical_delete_paths":0,"persisted_user_data_changed":false,"production_migration_performed":false,"formal_proof_performed":false,"next_step":"P12-U1"}\n' "$result_status" > "$ARTIFACT_ROOT/result.json"
          printf '%s\n' '{"special_authority_required":false,"special_authority_consumed":false,"formal_proof_performed":false,"formal_proof_authorization_consumed":false,"production_migration_authorized":false,"persisted_user_data_change_authorized":false}' > "$ARTIFACT_ROOT/authority-state.json"
          rc=0
          if [ "$tests_rc" -ne 0 ] || [ "$verify_rc" -ne 0 ]; then rc=1; fi
          printf '{"tests":%s,"verify":%s,"final":%s}\n' "$tests_rc" "$verify_rc" "$rc" > "$ARTIFACT_ROOT/exit-status.json"
          python3 - "$ARTIFACT_ROOT" <<'PY'
          import hashlib,json,pathlib,sys
          root=pathlib.Path(sys.argv[1]); rows=[]
          for item in sorted(root.iterdir()):
              if item.name=="artifact-manifest.json" or not item.is_file(): continue
              data=item.read_bytes(); rows.append({"path":item.name,"bytes":len(data),"sha256":hashlib.sha256(data).hexdigest()})
          assert len(rows)==8 and all(row["bytes"]>0 for row in rows)
          (root/"artifact-manifest.json").write_text(json.dumps({"type":"PMP_PASS11_ARTIFACT_MANIFEST_V1","records":rows},indent=2,sort_keys=True)+"\n")
          PY
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload complete Pass 11 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pass11-safety-no-deletion-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/pass11-safety-artifacts/
          if-no-files-found: error
          retention-days: 90
      - name: Enforce preserved result after upload
        run: test "${{ steps.evaluate.outputs.exit_code }}" = "0"

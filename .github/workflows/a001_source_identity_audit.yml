name: A-001 Source Identity Audit

on:
  push:
    branches:
      - agent/a001-freeze-source-identity
    paths:
      - 'audit/a001_source_identity_audit.py'
      - 'audit/pmp-active-source-identity-manifest-v1.json'
      - '.github/workflows/a001_source_identity_audit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out full repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/a001-freeze-source-identity

      - name: Generate manifest twice
        id: generate
        shell: bash
        run: |
          set +e
          rm -rf audit/a001-output audit/a001-final
          mkdir -p audit/a001-output/run1 audit/a001-output/run2 audit/a001-final
          python audit/a001_source_identity_audit.py \
            --baseline 5dd049de1500ea427fa2cf395687239a19706115 \
            --planning-manifest audit/pmp-active-source-identity-manifest-v1.json \
            --output audit/a001-output/run1/pmp-active-source-identity-manifest-v2.json \
            --summary audit/a001-output/run1/a001-summary.json
          code1=$?
          python audit/a001_source_identity_audit.py \
            --baseline 5dd049de1500ea427fa2cf395687239a19706115 \
            --planning-manifest audit/pmp-active-source-identity-manifest-v1.json \
            --output audit/a001-output/run2/pmp-active-source-identity-manifest-v2.json \
            --summary audit/a001-output/run2/a001-summary.json
          code2=$?
          cmp audit/a001-output/run1/pmp-active-source-identity-manifest-v2.json \
              audit/a001-output/run2/pmp-active-source-identity-manifest-v2.json
          deterministic=$?
          cp audit/a001-output/run1/pmp-active-source-identity-manifest-v2.json audit/a001-final/pmp-active-source-identity-manifest-v2.json
          cp audit/a001-output/run1/a001-summary.json audit/a001-final/a001-summary.json
          printf '{"run1_exit":%s,"run2_exit":%s,"deterministic_cmp_exit":%s}\n' "$code1" "$code2" "$deterministic" > audit/a001-final/a001-execution.json
          echo "run1_exit=$code1" >> "$GITHUB_OUTPUT"
          echo "run2_exit=$code2" >> "$GITHUB_OUTPUT"
          echo "deterministic_cmp_exit=$deterministic" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit generated A-001 evidence to draft branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit/a001-final/
          if git diff --cached --quiet; then
            echo "No generated evidence changes."
          else
            git commit -m "A-001 record generated source identity evidence"
            git push origin HEAD:agent/a001-freeze-source-identity
          fi

      - name: Enforce A-001 gates
        shell: bash
        run: |
          test "${{ steps.generate.outputs.run1_exit }}" = "0"
          test "${{ steps.generate.outputs.run2_exit }}" = "0"
          test "${{ steps.generate.outputs.deterministic_cmp_exit }}" = "0"

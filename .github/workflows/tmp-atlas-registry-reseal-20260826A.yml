name: Temporary Atlas Registry A-003 Reseal

on:
  push:
    branches:
      - chatgpt/atlas-registry-completeness-semantics-20260826A

permissions:
  contents: write

jobs:
  reseal:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify bounded registry repair before sealing
        run: |
          node --check pmp-mount-registry-v1.js
          python3 tools/test_atlas_registry_completeness_semantics_v1.py
          python3 tools/verify_atlas_registry_completeness_semantics_v1.py
      - name: Build deterministic A-003 manifest outside repository
        run: |
          python3 tools/build_a003_integrity_manifest.py --output /tmp/a003-generated-integrity-manifest.json --report /tmp/a003-integrity-probe-report.json
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          path=Path('/tmp/a003-generated-integrity-manifest.json')
          manifest=json.loads(path.read_text('utf-8'))
          manifest.pop('source_commit',None)
          manifest.pop('self_digest_for_generated_bytes',None)
          identity={
            'records':[(r['path'],r['sha256_hex']) for r in manifest.get('records',[])],
            'historical_records':[(r['path'],r.get('repository_ref'),r['sha256_hex']) for r in manifest.get('historical_records',[])],
            'external_records':[(r['url'],r['sha256_hex']) for r in manifest.get('external_records',[])],
            'root_trust_anchors':manifest.get('root_trust_anchors',[]),
            'policy':{'algorithm':manifest.get('algorithm'),'unlisted_executable_policy':manifest.get('unlisted_executable_policy'),'network_policy':manifest.get('network_policy')}
          }
          canonical=json.dumps(identity,sort_keys=True,separators=(',',':')).encode('utf-8')
          manifest['version']='20260711A-A003-FINAL'
          manifest['runtime_source_set_sha256']=hashlib.sha256(canonical).hexdigest()
          manifest['source_identity_rule']='Deterministic digest of protected local, historical, external, root-anchor, and policy identities; audit/workflow-only commits do not alter this identity.'
          path.write_text(json.dumps(manifest,indent=2,sort_keys=True)+'\n','utf-8')
          PY
      - name: Apply atomic branch seal
        run: |
          cp /tmp/a003-generated-integrity-manifest.json pmp-runtime-integrity-manifest-v1.json
          manifest_sha="$(sha256sum pmp-runtime-integrity-manifest-v1.json | awk '{print $1}')"
          manifest_bytes="$(wc -c < pmp-runtime-integrity-manifest-v1.json | tr -d ' ')"
          runtime_set_sha="$(python3 -c "import json; print(json.load(open('pmp-runtime-integrity-manifest-v1.json'))['runtime_source_set_sha256'])")"
          python3 - "$manifest_sha" "$manifest_bytes" "$runtime_set_sha" <<'PY'
          import json,re,sys
          from pathlib import Path
          manifest_sha,manifest_bytes,runtime_set_sha=sys.argv[1:]
          root=Path('pmp-app-current.html')
          text=root.read_text('utf-8')
          updated,count=re.subn(r"const MANIFEST_SHA256='(?:__A003_MANIFEST_SHA256__|[0-9a-f]{64})';",f"const MANIFEST_SHA256='{manifest_sha}';",text,count=1)
          if count!=1: raise SystemExit('Expected exactly one bootstrap manifest digest constant.')
          root.write_text(updated,'utf-8')
          receipt={
            'type':'PMP_A003_MANIFEST_SEAL_V1','repair_id':'A-003','status':'SEALED',
            'manifest_path':'pmp-runtime-integrity-manifest-v1.json','manifest_sha256':manifest_sha,
            'manifest_bytes':int(manifest_bytes),'manifest_version':'20260711A-A003-FINAL',
            'runtime_source_set_sha256':runtime_set_sha,'root_trust_anchor':'pmp-app-current.html',
            'root_self_verifiable':False,'sealed_branch':'chatgpt/atlas-registry-completeness-semantics-20260826A',
            'rule':'The root trust anchor cannot verify its own pre-execution bytes; it carries the exact digest for the deterministic protected runtime source set.'
          }
          Path('audit/a003-manifest-seal.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n','utf-8')
          PY
          rm .github/workflows/tmp-atlas-registry-reseal-20260826A.yml
          python3 -m json.tool pmp-runtime-integrity-manifest-v1.json >/dev/null
          python3 -m json.tool audit/a003-manifest-seal.json >/dev/null
          python3 tools/test_a003_integrity.py
          rm -f a003-repository-test-result.json
      - name: Commit exact branch seal and self-remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pmp-runtime-integrity-manifest-v1.json pmp-app-current.html audit/a003-manifest-seal.json .github/workflows/tmp-atlas-registry-reseal-20260826A.yml
          git commit -m 'A-003 seal Atlas registry completeness semantics [skip ci]'
          git push origin HEAD:chatgpt/atlas-registry-completeness-semantics-20260826A

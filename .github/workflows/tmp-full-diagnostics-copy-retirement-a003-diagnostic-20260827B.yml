name: Temporary Diagnose Full Diagnostics Copy Retirement A-003

on:
  push:
    branches:
      - chatgpt/full-diagnostics-copy-retirement-20260827A
    paths:
      - '.github/workflows/tmp-full-diagnostics-copy-retirement-a003-diagnostic-20260827B.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply only the authorized runtime UI patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('pmp-diagnostics-consolidated-view-v1.js')
          s=p.read_text('utf-8')
          old="controls='<button type=\"button\" class=\"pmpDiagAction\" id=\"pmpDiagCopyFull\">Copy Full Diagnostics Report</button><button type=\"button\" class=\"pmpDiagAction\" id=\"pmpDiagZipFull\">Export Full Diagnostics ZIP</button><span id=\"pmpDiagFullZipLinkHost\"></span>';"
          new="controls='<button type=\"button\" class=\"pmpDiagAction\" id=\"pmpDiagZipFull\">Export Full Diagnostics ZIP</button><span id=\"pmpDiagFullZipLinkHost\"></span>';"
          handler="const full=d.getElementById('pmpDiagCopyFull');if(full)full.onclick=async()=>{full.disabled=true;full.textContent='Running current live diagnostics…';await produceEvidence('copy_full_diagnostics');const ok=await copyText(JSON.stringify(fullDiagnosticReport(),null,2));full.textContent=ok?'Copied':'Copy unavailable';full.disabled=false};"
          assert s.count(old)==1
          assert s.count(handler)==1
          s=s.replace(old,new,1).replace(handler,'',1)
          p.write_text(s,'utf-8')
          PY
      - name: Build and seal exactly as A-003 publisher
        run: |
          python3 tools/build_a003_integrity_manifest.py --output a003-generated-integrity-manifest.json --report a003-diagnostic-probe-report.json
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          path=Path('a003-generated-integrity-manifest.json')
          manifest=json.loads(path.read_text('utf-8'))
          manifest.pop('source_commit',None)
          manifest.pop('self_digest_for_generated_bytes',None)
          identity={
            'records':[(r['path'],r['sha256_hex']) for r in manifest.get('records',[])],
            'historical_records':[(r['path'],r.get('repository_ref'),r['sha256_hex']) for r in manifest.get('historical_records',[])],
            'external_records':[(r['url'],r['sha256_hex']) for r in manifest.get('external_records',[])],
            'root_trust_anchors':manifest.get('root_trust_anchors',[]),
            'policy':{'algorithm':manifest.get('algorithm'),'unlisted_executable_policy':manifest.get('unlisted_executable_policy'),'network_policy':manifest.get('network_policy')}
          }
          manifest['version']='20260711A-A003-FINAL'
          manifest['runtime_source_set_sha256']=hashlib.sha256(json.dumps(identity,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          manifest['source_identity_rule']='Deterministic digest of protected local, historical, external, root-anchor, and policy identities; audit/workflow-only commits do not alter this identity.'
          path.write_text(json.dumps(manifest,indent=2,sort_keys=True)+'\n','utf-8')
          PY
          cp a003-generated-integrity-manifest.json pmp-runtime-integrity-manifest-v1.json
          manifest_sha="$(sha256sum pmp-runtime-integrity-manifest-v1.json | awk '{print $1}')"
          manifest_bytes="$(wc -c < pmp-runtime-integrity-manifest-v1.json | tr -d ' ')"
          runtime_set_sha="$(python3 -c "import json; print(json.load(open('pmp-runtime-integrity-manifest-v1.json'))['runtime_source_set_sha256'])")"
          python3 - "$manifest_sha" "$manifest_bytes" "$runtime_set_sha" <<'PY'
          import json,re,sys
          from pathlib import Path
          manifest_sha,manifest_bytes,runtime_set_sha=sys.argv[1:]
          root=Path('pmp-app-current.html')
          text=root.read_text('utf-8')
          updated,count=re.subn(r"const MANIFEST_SHA256='(?:__A003_MANIFEST_SHA256__|[0-9a-f]{64})';",f"const MANIFEST_SHA256='{manifest_sha}';",text,count=1)
          assert count==1
          root.write_text(updated,'utf-8')
          seal={'type':'PMP_A003_MANIFEST_SEAL_V1','repair_id':'A-003','status':'SEALED','manifest_path':'pmp-runtime-integrity-manifest-v1.json','manifest_sha256':manifest_sha,'manifest_bytes':int(manifest_bytes),'manifest_version':'20260711A-A003-FINAL','runtime_source_set_sha256':runtime_set_sha,'root_trust_anchor':'pmp-app-current.html','root_self_verifiable':False,'sealed_branch':'chatgpt/full-diagnostics-copy-retirement-20260827A','rule':'The root trust anchor cannot verify its own pre-execution bytes; it carries the exact digest for the deterministic protected runtime source set.'}
          Path('audit/a003-manifest-seal.json').write_text(json.dumps(seal,indent=2,sort_keys=True)+'\n','utf-8')
          PY
      - name: Run A-003 and expose exact failed assertion
        run: |
          set +e
          python3 tools/test_a003_integrity.py --output /tmp/a003-diagnostic-result.json
          rc=$?
          cat /tmp/a003-diagnostic-result.json
          exit $rc

name: Pass 3 Route Guardian Handoff Unit 2 Passive Consumer

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/pass3-route-guardian-handoff-unit2-passive-consumer-v1.yml'
      - 'audit/pass3/pass3-route-guardian-handoff-unit2-passive-consumer-v1.json'
      - 'pmp-app-current.html'
      - 'pmp-route-guardian-current-loader-v22.html'
      - 'pmp-runtime-integrity-manifest-v1.json'
      - 'tools/generate_pass3_unit2_integrity_updates_v1.py'
      - 'tools/test_pass3_route_guardian_handoff_unit2_passive_consumer_v1.py'
      - 'tools/verify_pass3_route_guardian_handoff_unit2_passive_consumer_v1.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate protected runtime integrity bytes
        run: python tools/generate_pass3_unit2_integrity_updates_v1.py
      - name: Commit deterministic integrity updates when required
        if: github.event_name == 'pull_request'
        run: |
          if [[ -n "$(git status --porcelain -- pmp-runtime-integrity-manifest-v1.json pmp-app-current.html)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pmp-runtime-integrity-manifest-v1.json pmp-app-current.html
            git commit -m "Regenerate Unit 2 runtime integrity identities"
            git push origin HEAD:${{ github.head_ref }}
          fi
      - name: Run deterministic positive and fail-closed consumer tests
        run: python tools/test_pass3_route_guardian_handoff_unit2_passive_consumer_v1.py
      - name: Verify exact Unit 2 scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python tools/verify_pass3_route_guardian_handoff_unit2_passive_consumer_v1.py "$BASE_SHA"

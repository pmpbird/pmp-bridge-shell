name: TEMP Repair Receipt 010 Diagnostics Syntax

on:
  push:
    branches: [agent/pass2-p2c-receipt010-clean-proof]
    paths: ['.github/workflows/TEMP_repair_receipt010_diagnostics_and_dependencies.yml']

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Correct diagnostic trap and validate fail-closed scripts
        run: |
          set -euo pipefail
          ROOT=audit/pass2/p2c-isolated-proof-rerun-008
          python3 - <<'PY'
          from pathlib import Path
          p=Path('audit/pass2/p2c-isolated-proof-rerun-008/rerun008-controller-main.sh')
          lines=p.read_text().splitlines()
          expected_prefix="trap 'rc=$?; printf "
          hits=[i for i,x in enumerate(lines) if x.startswith(expected_prefix)]
          assert len(hits)==1,hits
          lines[hits[0]]="trap 'rc=$?; printf \"RECEIPT010_COMMAND_FAILURE line=%s rc=%s command=%q\\n\" \"$LINENO\" \"$rc\" \"$BASH_COMMAND\" >&2; exit \"$rc\"' ERR"
          p.write_text('\n'.join(lines)+'\n')
          PY
          bash -n "$ROOT/rerun008-controller-main.sh"
          bash -n "$ROOT/rerun008-controller-finalize.sh"
          grep -Fq 'RECEIPT010_COMMAND_FAILURE line=' "$ROOT/rerun008-controller-main.sh"
          grep -Fq 'proof_worktrees_not_created_before_failure' "$ROOT/rerun008-controller-finalize.sh"
          git config user.name pmpbird
          git config user.email pmpbird@gmail.com
          git add "$ROOT/rerun008-controller-main.sh"
          git commit -m 'Correct Receipt 010 diagnostic trap syntax [no-proof-run]'
          git push origin HEAD:agent/pass2-p2c-receipt010-clean-proof

name: TEMP Repair Receipt 010 Dependencies and Diagnostics

on:
  push:
    branches: [agent/pass2-p2c-receipt010-clean-proof]
    paths: ['.github/workflows/TEMP_repair_receipt010_diagnostics_and_dependencies.yml']

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install missing frozen dependencies and harden diagnostics
        run: |
          set -euo pipefail
          OLD=047847972b87a60f73567b0ff13c088e35c1de49
          SRC=audit/pass2/p2c-isolated-proof-rerun-002
          DST=audit/pass2/p2c-isolated-proof-rerun-006
          ROOT=audit/pass2/p2c-isolated-proof-rerun-008
          git cat-file -e "$OLD^{commit}"
          mkdir -p "$DST"
          for p in \
            repair_runner_003.py \
            repair_runner_005.py \
            repair_runner_006.py \
            repair_runner_007.py \
            repair_runner_008.py \
            repair_runner_009_controller002.py \
            transpile_async_sources.part00.b64 \
            transpile_async_sources.part01.b64 \
            transpile_async_sources.part02.b64; do
            git show "$OLD:$SRC/$p" > "$DST/$p"
          done
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path('audit/pass2/p2c-isolated-proof-rerun-008')
          main=root/'rerun008-controller-main.sh'
          s=main.read_text()
          marker='set -euo pipefail\n'
          trap="trap 'rc=$?; printf \'RECEIPT010_COMMAND_FAILURE line=%s rc=%s command=%q\\n\' \"$LINENO\" \"$rc\" \"$BASH_COMMAND\" >&2; exit \"$rc\"' ERR\n"
          if trap not in s:
              assert marker in s
              s=s.replace(marker,marker+trap,1)
          main.write_text(s)

          final=root/'rerun008-controller-finalize.sh'
          t=final.read_text()
          old='''rm -f "$ACTIVE_ROOT/a003-live-runtime-effective.cjs"\ngit -C "$ACTIVE_ROOT" reset --hard "$SOURCE_COMMIT" >/dev/null\ngit -C "$ACTIVE_ROOT" clean -ffdx >/dev/null\ntest -z "$(git -C "$ACTIVE_ROOT" status --porcelain)"\ntest "$(git -C "$ACTIVE_ROOT" rev-parse HEAD)" = "$SOURCE_COMMIT"\n'''
          new='''if [ -d "$ACTIVE_ROOT" ] && [ -d "$BASELINE_ROOT" ]; then\n  rm -f "$ACTIVE_ROOT/a003-live-runtime-effective.cjs"\n  git -C "$ACTIVE_ROOT" reset --hard "$SOURCE_COMMIT" >/dev/null\n  git -C "$ACTIVE_ROOT" clean -ffdx >/dev/null\n  test -z "$(git -C "$ACTIVE_ROOT" status --porcelain)"\n  test "$(git -C "$ACTIVE_ROOT" rev-parse HEAD)" = "$SOURCE_COMMIT"\nelse\n  printf '%s\\n' 'proof_worktrees_not_created_before_failure' > "$EVIDENCE_DIR/finalizer-worktree-absence.txt"\nfi\n'''
          assert old in t
          t=t.replace(old,new,1)
          old2="b=snap(os.environ['BASELINE_ROOT']);r=snap(os.environ['ACTIVE_ROOT'])\nboundary_ok=b==r and len(r)==1481"
          new2="baseline=pathlib.Path(os.environ['BASELINE_ROOT']);active=pathlib.Path(os.environ['ACTIVE_ROOT'])\nif baseline.is_dir() and active.is_dir():\n    b=snap(baseline);r=snap(active);boundary_ok=b==r and len(r)==1481\nelse:\n    b={};r={};boundary_ok=not proof_started"
          assert old2 in t
          t=t.replace(old2,new2,1)
          final.write_text(t)

          receipt=root/'P2C_FINAL_PATH_AUTHORIZATION_RECEIPT_010.json'
          data=json.loads(receipt.read_text())
          data['repaired_finalizer_sha256']=hashlib.sha256(final.read_bytes()).hexdigest()
          data['diagnostic_repair_applied']=True
          data['missing_dependency_repair_applied']=True
          data['additional_proof_run_authorized']=False
          receipt.write_text(json.dumps(data,indent=2,sort_keys=True)+'\n')
          PY
          chmod +x "$ROOT/rerun008-controller-main.sh" "$ROOT/rerun008-controller-finalize.sh"
          python3 -m py_compile "$DST"/repair_runner_003.py "$DST"/repair_runner_005.py "$DST"/repair_runner_006.py "$DST"/repair_runner_007.py "$DST"/repair_runner_008.py "$DST"/repair_runner_009_controller002.py
          grep -q 'RECEIPT010_COMMAND_FAILURE' "$ROOT/rerun008-controller-main.sh"
          grep -q 'proof_worktrees_not_created_before_failure' "$ROOT/rerun008-controller-finalize.sh"
          git config user.name pmpbird
          git config user.email pmpbird@gmail.com
          git add "$DST" "$ROOT"
          git commit -m 'Repair Receipt 010 dependencies and fail-closed diagnostics [no-proof-run]'
          git push origin HEAD:agent/pass2-p2c-receipt010-clean-proof

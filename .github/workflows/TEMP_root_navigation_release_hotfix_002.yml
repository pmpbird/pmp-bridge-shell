name: TEMP Root Navigation Release Hotfix 002

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/TEMP_root_navigation_release_hotfix_002.yml'

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[root-navfix-complete]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply root-only release latch guard
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, re
          p=Path('pmp-app-current.html')
          s=p.read_text()
          marker="const GATE_ID='pmpPass75ReloadRuntimePlatformGateV1';"
          assert marker not in s
          assert "const MANIFEST_SHA256='e90ea9d378cb068269cd0b7ee1336b64b72aa4feef029bc8a0b68b925877bb99';" in s
          shim=base64.b64decode('').decode()
          assert s.count('</body>')==1
          p.write_text(s.replace('</body>',shim+'</body>'))
          assert marker in p.read_text()
          assert hashlib.sha256(Path('pmp-runtime-integrity-manifest-v1.json').read_bytes()).hexdigest()=='e90ea9d378cb068269cd0b7ee1336b64b72aa4feef029bc8a0b68b925877bb99'
          PY
      - name: Validate syntax and integrity contract
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('pmp-app-current.html').read_text()
          scripts=re.findall(r'<script>(.*?)</script>',s,re.S)
          assert len(scripts)==2
          Path('/tmp/root-bootstrap.js').write_text(scripts[0])
          Path('/tmp/root-navfix.js').write_text(scripts[1])
          assert "api.state.released!==true" in scripts[1]
          assert "getElementsByTagName('iframe')" in scripts[1]
          PY
          node --check /tmp/root-bootstrap.js
          node --check /tmp/root-navfix.js
          python3 tools/test_a003_integrity.py --output /tmp/a003-root-navfix.json
          python3 - <<'PY'
          import json
          r=json.load(open('/tmp/a003-root-navfix.json'))
          assert (r['tests_total'],r['tests_passed'],r['tests_failed'])==(21,21,0),r
          PY
      - name: Commit root-only hotfix
        run: |
          set -euo pipefail
          rm .github/workflows/TEMP_root_navigation_release_hotfix_002.yml
          git config user.name pmpbird
          git config user.email pmpbird@gmail.com
          git add pmp-app-current.html .github/workflows/TEMP_root_navigation_release_hotfix_002.yml
          git commit -m 'Apply root-only runtime-to-orchestrator navigation latch guard [root-navfix-complete]'
          git push origin HEAD:main

name: Pass 10 Unit 5 Bank Fault and Corruption Proof
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/pass10-unit5-bank-fault-corruption-proof-v1.yml'
      - 'audit/pass10/pass10-bank-unit5-fault-corruption-proof-v1.json'
      - 'audit/pass10/receipts/RECEIPT_P10_U5_BANK_FAULT_CORRUPTION_PROOF_20260726T233000Z_001.json'
      - 'tools/run_pass10_unit5_bank_fault_corruption_proof_v1.js'
      - 'tools/test_pass10_unit5_bank_fault_corruption_proof_v1.js'
      - 'tools/verify_pass10_unit5_bank_fault_corruption_proof_v1.py'
permissions:
  contents: read
jobs:
  bank-fault-corruption-proof:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      ARTIFACT_ROOT: /tmp/pass10-unit5-artifacts/artifacts/attempt-001
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - id: evaluate
        name: Verify Bank fault, rollback, restart, and corruption proof
        shell: bash
        run: |
          set +e
          mkdir -p "$ARTIFACT_ROOT"
          printf '%s\n' '{"command":"P10-U5 disposable large-inventory, duplicate, orphan, stale, unavailable, rollback, restart, Helper-decoration, direct-UI, dependency, and corruption-containment proof"}' > "$ARTIFACT_ROOT/command.json"
          printf '%s\n' 'no stderr emitted before execution' > "$ARTIFACT_ROOT/stderr.txt"
          node tools/test_pass10_unit5_bank_fault_corruption_proof_v1.js > "$ARTIFACT_ROOT/stdout.txt" 2>> "$ARTIFACT_ROOT/stderr.txt"
          tests_rc=$?
          python3 tools/verify_pass10_unit5_bank_fault_corruption_proof_v1.py "${{ github.event.pull_request.base.sha }}" >> "$ARTIFACT_ROOT/stdout.txt" 2>> "$ARTIFACT_ROOT/stderr.txt"
          verify_rc=$?
          git diff --name-only "${{ github.event.pull_request.base.sha }}...HEAD" | python3 -c 'import json,sys; print(json.dumps({"changed_paths":[x.strip() for x in sys.stdin if x.strip()]},sort_keys=True))' > "$ARTIFACT_ROOT/scope.json"
          python3 -c 'import json,os,platform; print(json.dumps({"python":platform.python_version(),"node":os.popen("node --version").read().strip(),"runner":os.environ.get("RUNNER_OS"),"sha":os.environ.get("GITHUB_SHA")},sort_keys=True))' > "$ARTIFACT_ROOT/environment.json"
          node tools/run_pass10_unit5_bank_fault_corruption_proof_v1.js > "$ARTIFACT_ROOT/result.json" 2>> "$ARTIFACT_ROOT/stderr.txt"
          result_rc=$?
          printf '%s\n' '{"required":false,"granted":false,"consumed_before":false,"consumed_after":false}' > "$ARTIFACT_ROOT/authority-state.json"
          rc=0
          if [ "$tests_rc" -ne 0 ] || [ "$verify_rc" -ne 0 ] || [ "$result_rc" -ne 0 ]; then rc=1; fi
          printf '{"tests":%s,"verify":%s,"result":%s,"final":%s}\n' "$tests_rc" "$verify_rc" "$result_rc" "$rc" > "$ARTIFACT_ROOT/exit-status.json"
          python3 - "$ARTIFACT_ROOT" <<'PY'
          import hashlib,json,pathlib,sys
          root=pathlib.Path(sys.argv[1]); rows=[]
          for path in sorted(root.iterdir()):
              if path.name=="artifact-manifest.json" or not path.is_file(): continue
              data=path.read_bytes(); rows.append({"path":path.name,"bytes":len(data),"sha256":hashlib.sha256(data).hexdigest()})
          assert len(rows)==8 and all(row["bytes"]>0 for row in rows)
          (root/"artifact-manifest.json").write_text(json.dumps({"type":"PMP_P10_U5_ARTIFACT_MANIFEST_V1","records":rows},indent=2,sort_keys=True)+"\n")
          PY
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload complete P10-U5 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pass10-unit5-bank-fault-corruption-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/pass10-unit5-artifacts/
          if-no-files-found: error
          retention-days: 90
      - name: Enforce preserved result after upload
        run: test "${{ steps.evaluate.outputs.exit_code }}" = "0"

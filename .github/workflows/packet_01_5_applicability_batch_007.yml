name: Packet 01.5 applicability Batch 007

on:
  push:
    paths:
      - "audit/routing-batches/Packet_01.5_Applicability_Batch_007_Plan_v1.json"
      - "tools/apply_packet_01_5_applicability_batch.py"
      - "tools/verify_packet_01_5_applicability_batch.py"
      - ".github/workflows/packet_01_5_applicability_batch_007.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Batch 007 transaction
        run: python3 tools/apply_packet_01_5_applicability_batch.py --plan audit/routing-batches/Packet_01.5_Applicability_Batch_007_Plan_v1.json

      - name: Independently verify Batch 007
        run: python3 tools/verify_packet_01_5_applicability_batch.py --plan audit/routing-batches/Packet_01.5_Applicability_Batch_007_Plan_v1.json

      - name: Commit accepted Batch 007 outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            audit/routing-inventory/Packet_01.5_Applicability_Inventory_v8_Batch_007.jsonl \
            audit/routing-inventory/Packet_01.5_Applicability_Inventory_v8_Batch_007.jsonl.gz \
            audit/routing-inventory/Packet_01.5_Applicability_Inventory_v8_Batch_007.manifest.json \
            audit/routing-batches/Packet_01.5_Applicability_Batch_007_Build_v1.md \
            audit/routing-batches/Packet_01.5_Applicability_Batch_007_Build_v1.json \
            audit/routing-batches/Packet_01.5_Applicability_Batch_007_Independent_Verification_v1.md \
            audit/routing-batches/Packet_01.5_Applicability_Batch_007_Independent_Verification_v1.json \
            audit/Packet_01.5_Applicability_Classification_Status_v83.md
          if git diff --cached --quiet; then
            echo "No Batch 007 output changes."
          else
            git commit -m "Apply and verify Packet 01.5 Applicability Batch 007"
            git push
          fi

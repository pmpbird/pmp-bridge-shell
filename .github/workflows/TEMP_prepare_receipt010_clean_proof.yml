name: TEMP Prepare Receipt 010 Clean Proof Branch
on:
  push:
    branches: [agent/pass2-p2c-receipt010-clean-proof]
    paths: ['.github/workflows/TEMP_prepare_receipt010_clean_proof.yml']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install exact non-workflow clean proof capsule
        run: |
          set -euo pipefail
          OLD=047847972b87a60f73567b0ff13c088e35c1de49
          ROOT=audit/pass2/p2c-isolated-proof-rerun-008
          DEPS=audit/pass2/p2c-isolated-proof-rerun-006
          git cat-file -e "$OLD^{commit}"
          git checkout "$OLD" -- "$DEPS"
          mkdir -p "$ROOT"
          for p in CONTROLLER007_RECEIPT.json CONTROLLER007_REPORT.json EXECUTABLE_RERUN_MANIFEST_007.json P2C_EXACTLY_ONE_REFRESHED_FROZEN_CAPSULE_BROWSER_PROOF_AUTHORIZATION_RECEIPT_008.json P2C_ISOLATED_PROOF_RERUN_EXECUTION_DIRECTIVE_008.json p2c-proof-runtime-authorization-receipt-008.json pass2-p2c-isolated-proof-rerun-008.workflow-candidate.yml.txt rerun008-controller-main.sh rerun008-controller-finalize.sh scope-lock-rerun-008.json; do
            git show "$OLD:$ROOT/$p" > "$ROOT/$p"
          done
          cat > "$ROOT/P2C_FINAL_PATH_AUTHORIZATION_RECEIPT_010.json" <<'JSON'
          {
            "authorization_consumed": false,
            "authorization_scope": "ONE_FRESH_CHECKSUM_BOUND_DISPOSABLE_COPY_ISOLATED_PROOF_RUN_ONLY",
            "authorization_source": "User message in current conversation",
            "authorization_text": "Create the fresh Receipt 010 clean proof branch from current main, install only the repaired checksum-bound proof capsule and immutable dependencies, run the full preflight, and open exactly one proof-only PR so the pull_request.opened workflow executes once.",
            "authorized": true,
            "current_map_change_authorized": false,
            "merge_authorized": false,
            "persisted_data_change_authorized": false,
            "pr67_merge_authorized": false,
            "production_activation_authorized": false,
            "production_application_authorized": false,
            "proof_run_count_authorized": 1,
            "proof_run_count_executed_under_this_receipt": 0,
            "receipt009_reuse_authorized": false,
            "second_proof_run_authorized": false,
            "status": "AUTHORIZED_UNCONSUMED",
            "type": "PMP_P2C_EXPLICIT_FINAL_PATH_AUTHORIZATION_RECEIPT_010"
          }
          JSON
          python3 - <<'PY'
          from pathlib import Path
          p=Path('audit/pass2/p2c-isolated-proof-rerun-008/rerun008-controller-main.sh')
          s=p.read_text()
          old="extras=sorted(p for p in changed if p not in allowed and not p.startswith(str(root)+'/'))"
          new="extras=sorted(p for p in changed if p not in allowed and not p.startswith(str(root)+'/') and not p.startswith('audit/pass2/p2c-isolated-proof-rerun-006/'))"
          assert old in s
          p.write_text(s.replace(old,new))
          f=Path('audit/pass2/p2c-isolated-proof-rerun-008/rerun008-controller-finalize.sh')
          t=f.read_text()
          marker='set -euo pipefail\n'
          assert marker in t
          t=t.replace(marker,marker+'mkdir -p "$EVIDENCE_DIR"\n',1)
          f.write_text(t)
          PY
          chmod +x "$ROOT/rerun008-controller-main.sh" "$ROOT/rerun008-controller-finalize.sh"
          FINAL_SHA=$(sha256sum "$ROOT/rerun008-controller-finalize.sh" | awk '{print $1}')
          python3 - "$FINAL_SHA" <<'PY'
          import json,pathlib,sys
          p=pathlib.Path('audit/pass2/p2c-isolated-proof-rerun-008/P2C_FINAL_PATH_AUTHORIZATION_RECEIPT_010.json')
          r=json.loads(p.read_text());r['repaired_finalizer_sha256']=sys.argv[1]
          p.write_text(json.dumps(r,indent=2,sort_keys=True)+'\n')
          PY
          python3 - <<'PY'
          import hashlib,json,pathlib,subprocess
          root=pathlib.Path('audit/pass2/p2c-isolated-proof-rerun-008')
          deps=pathlib.Path('audit/pass2/p2c-isolated-proof-rerun-006')
          receipt=json.loads((root/'P2C_FINAL_PATH_AUTHORIZATION_RECEIPT_010.json').read_text())
          assert receipt['authorized'] is True
          assert receipt['authorization_consumed'] is False
          assert receipt['proof_run_count_authorized']==1
          assert receipt['proof_run_count_executed_under_this_receipt']==0
          for key in ('production_application_authorized','production_activation_authorized','current_map_change_authorized','persisted_data_change_authorized','merge_authorized','second_proof_run_authorized'):
              assert receipt[key] is False,key
          finalizer=root/'rerun008-controller-finalize.sh'
          assert hashlib.sha256(finalizer.read_bytes()).hexdigest()==receipt['repaired_finalizer_sha256']
          assert deps.is_dir() and root.is_dir()
          changed=subprocess.check_output(['git','status','--porcelain'],text=True).splitlines()
          assert changed
          for line in changed:
              path=line[3:]
              assert path.startswith(str(root)+'/') or path.startswith(str(deps)+'/'),path
          (root/'RECEIPT010_NON_WORKFLOW_PREFLIGHT.json').write_text(json.dumps({
              'type':'PMP_P2C_RECEIPT010_NON_WORKFLOW_PREFLIGHT',
              'status':'PASS',
              'source_commit':'98b2e293717b81289e3b372d1fff8f5832d29fd6',
              'proof_execution':False,
              'workflow_file_created':False,
              'production_files_changed':False,
              'authorization_consumed':False
          },indent=2,sort_keys=True)+'\n')
          PY
          git config user.name pmpbird
          git config user.email pmpbird@gmail.com
          git add audit/pass2/p2c-isolated-proof-rerun-006 audit/pass2/p2c-isolated-proof-rerun-008
          git commit -m 'Stage Receipt 010 non-workflow proof capsule [no-proof-run]'
          git push origin HEAD:agent/pass2-p2c-receipt010-clean-proof

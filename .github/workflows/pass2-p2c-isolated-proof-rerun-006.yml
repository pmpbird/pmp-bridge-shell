name: Pass 2 Browser Setup Closure Diagnostic Only

on:
  pull_request:
    types: [opened]

permissions:
  contents: read

jobs:
  browser-setup-closure:
    if: github.event.action == 'opened' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    env:
      SOURCE_COMMIT: 98b2e293717b81289e3b372d1fff8f5832d29fd6
      AUDIT_DIR: audit/pass2/p2c-isolated-proof-rerun-008
      DEPS_DIR: audit/pass2/p2c-isolated-proof-rerun-006
      REPAIR_DIR: audit/pass2/p2c-isolated-proof-rerun-006/repair-continuation-003
      BUNDLE_DIR: /tmp/p2c-browser-setup-bundle-031
      BUNDLE_TAR: /tmp/p2c-browser-setup-bundle-031.tar.gz
      BASELINE_ROOT: /tmp/p2c-browser-setup-baseline-031
      ACTIVE_ROOT: /tmp/p2c-browser-setup-active-031
      EVIDENCE_DIR: /tmp/p2c-browser-setup-evidence-031
      NORMALIZED_ROOT: /tmp/p2c-browser-setup-normalized-031
      NODE_HOME: /tmp/p2c-browser-setup-node-031
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Run repaired chain through runtime receipt and stop before preparation
        env:
          EVENT_ACTION: ${{ github.event.action }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          HEAD_SHA: ${{ github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_ID: ${{ github.run_id }}
          P2C_STOP_BEFORE_PREPARATION: '1'
        run: |
          set -euo pipefail
          rm -rf "$EVIDENCE_DIR"
          mkdir -p "$EVIDENCE_DIR"
          bash "$AUDIT_DIR/rerun008-controller-main-receipt024.sh" 2>&1 | tee "$EVIDENCE_DIR/browser-setup-chain-console-031.log"
          test -f /tmp/p2c-proof-runtime-authorization-receipt-008.json
          test "$(sha256sum /tmp/p2c-proof-runtime-authorization-receipt-008.json | awk '{print $1}')" = "0bbd7c4bcace7101237b9a0b8b612bf90bebd9697b95efc90a61bb6cdf438f26"
          test ! -e "$EVIDENCE_DIR/preparation.json"
          test ! -e "$EVIDENCE_DIR/proof-run-started.lock"
          grep -F 'P2C_BROWSER_SETUP_HARD_STOP_BEFORE_PREPARATION' "$EVIDENCE_DIR/browser-setup-chain-console-031.log"
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          e=pathlib.Path(os.environ['EVIDENCE_DIR'])
          runtime=pathlib.Path('/tmp/p2c-proof-runtime-authorization-receipt-008.json')
          out={
            'type':'PMP_P2C_BROWSER_SETUP_CLOSURE_031',
            'status':'PASS',
            'runtime_receipt_present':runtime.is_file(),
            'runtime_receipt_sha256':hashlib.sha256(runtime.read_bytes()).hexdigest(),
            'reached_hard_stop_before_preparation':True,
            'disposable_preparation_executed':False,
            'browser_proof_executed':False,
            'proof_run_count_executed':0,
            'production_modified':False,
            'current_map_modified':False,
            'persisted_data_modified':False,
          }
          (e/'browser-setup-closure-031.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,indent=2,sort_keys=True))
          PY
      - name: Upload browser-setup closure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2c-browser-setup-closure-031
          path: /tmp/p2c-browser-setup-evidence-031

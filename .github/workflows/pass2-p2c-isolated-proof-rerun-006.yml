name: Pass 2 P2-C Receipt 024 Final Isolated Proof

on:
  pull_request:
    types: [opened]

permissions:
  contents: read

jobs:
  isolated-proof-receipt024:
    if: github.event.action == 'opened' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    env:
      SOURCE_COMMIT: 98b2e293717b81289e3b372d1fff8f5832d29fd6
      AUDIT_DIR: audit/pass2/p2c-isolated-proof-rerun-008
      DEPS_DIR: audit/pass2/p2c-isolated-proof-rerun-006
      REPAIR_DIR: audit/pass2/p2c-isolated-proof-rerun-006/repair-continuation-003
      BUNDLE_DIR: /tmp/p2c-proof-runner-024
      BUNDLE_TAR: /tmp/p2c-proof-rerun-024.tar.gz
      BASELINE_ROOT: /tmp/p2c-proof-baseline-024
      ACTIVE_ROOT: /tmp/p2c-proof-active-024
      EVIDENCE_DIR: /tmp/p2c-proof-evidence-024
      NORMALIZED_ROOT: /tmp/p2c-repair024-normalized
      NODE_HOME: /tmp/p2c-node-024
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Verify Receipt 024 bindings and run exactly once
        env:
          EVENT_ACTION: ${{ github.event.action }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          HEAD_SHA: ${{ github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess
          root=pathlib.Path('audit/pass2/p2c-isolated-proof-rerun-008')
          receipt_path=root/'P2C_FINAL_ONE_RUN_PROOF_AUTHORIZATION_RECEIPT_024.json'
          reseal_path=root/'P2C_EXHAUSTIVE_PREPROOF_STATIC_RESEAL_RECEIPT_023.json'
          receipt=json.loads(receipt_path.read_text())
          reseal=json.loads(reseal_path.read_text())
          wrapper=root/'rerun008-controller-main-receipt024.sh'
          finalizer=root/'rerun008-controller-finalize.sh'
          policy=pathlib.Path(receipt['policy_compatibility_controller_path'])
          manifest=pathlib.Path('audit/pass2/p2c-isolated-proof-rerun-006/repair009-normalized-source-manifest-002.json')
          patcher=pathlib.Path('audit/pass2/p2c-isolated-proof-rerun-006/repair-continuation-003/apply_prepare_repair_003.py')
          assert receipt['authorized'] is True and receipt['status']=='AUTHORIZED_UNCONSUMED' and receipt['authorization_consumed'] is False
          assert receipt['proof_run_count_authorized']==1 and receipt['proof_run_count_executed_under_this_receipt']==0
          assert receipt['proof_execution_started'] is False and receipt['second_proof_run_authorized'] is False
          assert receipt['current_main_sha']==os.environ['BASE_SHA']==os.environ['SOURCE_COMMIT']
          assert os.environ['EVENT_ACTION']=='opened' and os.environ['RUN_ATTEMPT']=='1'
          assert os.environ['HEAD_SHA']==os.environ['PR_HEAD_SHA']==subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          subprocess.run(['git','merge-base','--is-ancestor','ef73f7596fa146d1f4131ea2311775b58621ee1d',os.environ['PR_HEAD_SHA']],check=True)
          assert subprocess.check_output(['git','hash-object',str(receipt_path)],text=True).strip()=='82e4dc810e6873fe0f8127f67e9631649928fb89'
          assert subprocess.check_output(['git','hash-object',str(reseal_path)],text=True).strip()=='ffdfd2e8a991c22bb95d68b57205486ec2734ead'
          assert subprocess.check_output(['git','hash-object',str(wrapper)],text=True).strip()=='3d3b49cfeb4b431281b231a4a0682613a5f7377a'
          assert subprocess.check_output(['git','hash-object',str(policy)],text=True).strip()==receipt['policy_compatibility_controller_git_blob']=='3818d7ae0ea3bf2de98a23e334515ca0fd6da052'
          assert subprocess.check_output(['git','hash-object',str(finalizer)],text=True).strip()=='87e86c533d5d630121ded31334c46457ef4a7ad6'
          assert hashlib.sha256(policy.read_bytes()).hexdigest()==receipt['policy_compatibility_controller_sha256']=='1a553e229078239f0d17e25ca813788b4b25aa1d33fd511cdc179f1a6ebecb13'
          assert hashlib.sha256(manifest.read_bytes()).hexdigest()==receipt['normalization_manifest_sha256']=='d53dc787298e8fec5f00227b680645dffd25774913ba34461d4969df6bf2b803'
          assert hashlib.sha256(patcher.read_bytes()).hexdigest()==receipt['repaired_patcher_sha256']=='d4dd82c4787cb0464e6d7be1edff11174e0f05d7bd177a096300661f7fde2024'
          assert reseal['status']=='PASS_STATIC_RESEALED' and reseal['repair_queue_count']==0
          assert reseal['all_eight_repair009_patch_anchors_passed'] is True
          assert reseal['all_19_original_source_records_passed'] is True and reseal['all_19_transformed_source_records_passed'] is True
          assert reseal['repair009_controller002_diagnostic_exit_code']==0 and reseal['compile_checks_passed']==5
          for key in ('production_application_authorized','production_activation_authorized','current_map_change_authorized','persisted_data_change_authorized','merge_authorized','second_proof_run_authorized'):
              assert receipt[key] is False,key
          changed=set(subprocess.check_output(['git','diff','--name-only',receipt['current_main_sha'],os.environ['PR_HEAD_SHA']],text=True).splitlines())
          allowed={'.github/workflows/pass2-p2c-isolated-proof-rerun-006.yml','audit/a002-live-runtime.cjs'}
          extras=sorted(p for p in changed if p not in allowed and not p.startswith('audit/pass2/p2c-isolated-proof-rerun-006/') and not p.startswith('audit/pass2/p2c-isolated-proof-rerun-008/'))
          assert not extras,extras
          assert not any('/__pycache__/' in p or p.endswith('.pyc') for p in changed)
          PY
          bash -n "$AUDIT_DIR/rerun008-controller-main-receipt024.sh"
          bash -n "$AUDIT_DIR/rerun008-controller-finalize.sh"
          bash "$AUDIT_DIR/rerun008-controller-main-receipt024.sh"
      - name: Finalize truth and rollback boundary
        if: always()
        run: bash "$AUDIT_DIR/rerun008-controller-finalize.sh"
      - name: Upload complete Receipt 024 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2c-receipt024-final-proof-evidence
          path: /tmp/p2c-proof-evidence-024

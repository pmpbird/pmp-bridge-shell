name: Pass 2 P2-C Receipt 018 Manifest Record Sweep Diagnostic Only

on:
  pull_request:
    types: [opened]

permissions:
  contents: read

jobs:
  manifest-sweep-diagnostic:
    if: github.event.action == 'opened' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    env:
      SOURCE_COMMIT: 98b2e293717b81289e3b372d1fff8f5832d29fd6
      DEPS_DIR: audit/pass2/p2c-isolated-proof-rerun-006
      EVIDENCE_DIR: /tmp/p2c-receipt018-manifest-sweep
      BUNDLE_DIR: /tmp/p2c-receipt018-manifest-bundle
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compare 19 normalization sources in manifest order only
        run: |
          set -euo pipefail
          rm -rf "$EVIDENCE_DIR" "$BUNDLE_DIR"
          mkdir -p "$EVIDENCE_DIR" "$BUNDLE_DIR"
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess, tarfile

          deps=pathlib.Path(os.environ['DEPS_DIR'])
          evidence=pathlib.Path(os.environ['EVIDENCE_DIR'])
          bundle_dir=pathlib.Path(os.environ['BUNDLE_DIR'])
          source_commit=os.environ['SOURCE_COMMIT']
          manifest_path=deps/'repair009-normalized-source-manifest-002.json'
          manifest_bytes=manifest_path.read_bytes()
          manifest=json.loads(manifest_bytes)
          expected_manifest_sha='fb87f6dfc4a46cc07927b9ba78e1f8ac657eed2d16b4764b63f5ecb8c787e238'
          actual_manifest_sha=hashlib.sha256(manifest_bytes).hexdigest()
          assert actual_manifest_sha==expected_manifest_sha,(actual_manifest_sha,expected_manifest_sha)

          encoded=b''.join((deps/f'bundle/part0{i}.b64').read_bytes() for i in range(4))
          base=base64.b64decode(b''.join(encoded.split()))
          part062=base64.b64decode(b''.join((deps/'bundle/part06_2.b64').read_bytes().split()))
          suffix=b''.join((deps/'bundle'/name).read_bytes() for name in (
            'part04_0.bin','part04_1.bin','part04_2.bin','part05_0.bin','part05_1.bin','part06_0.bin','part06_1.bin'
          ))+part062
          bundle_tar=evidence/'reconstructed-bundle.tar.gz'
          bundle_tar.write_bytes(base+suffix)
          assert bundle_tar.stat().st_size==61478,bundle_tar.stat().st_size
          assert hashlib.sha256(bundle_tar.read_bytes()).hexdigest()=='a644ad9ea538117f8aa6b01ac6988ac8d938a64fb170fa2a8f071afebc77e500'
          with tarfile.open(bundle_tar,'r:gz') as tf:
            tf.extractall(bundle_dir)

          checked=[]
          mismatch=None
          for index,row in enumerate(manifest['records'],1):
            if row['kind']=='document-inline':
              source=bundle_dir/'after'/row['path']
              data=source.read_bytes()
              source_read=str(source)
            else:
              source_read=f'git:{source_commit}:{row["path"]}'
              data=subprocess.check_output(['git','show',f'{source_commit}:{row["path"]}'])
            actual_sha=hashlib.sha256(data).hexdigest()
            actual_bytes=len(data)
            item={
              'record_index_one_based':index,
              'path':row['path'],
              'kind':row['kind'],
              'source_file_actually_read':source_read,
              'expected_original_sha256':row['original_sha256'],
              'actual_sha256':actual_sha,
              'expected_original_bytes':row['original_bytes'],
              'actual_bytes':actual_bytes,
              'match':actual_sha==row['original_sha256'] and actual_bytes==row['original_bytes'],
            }
            checked.append(item)
            if not item['match']:
              mismatch=item
              break

          out={
            'type':'PMP_P2C_RECEIPT018_MANIFEST_ORDER_SWEEP_DIAGNOSTIC_V1',
            'status':'FIRST_MISMATCH_FOUND' if mismatch else 'ALL_19_MATCH',
            'manifest_sha256':actual_manifest_sha,
            'records_checked':len(checked),
            'first_mismatch':mismatch,
            'next_command_if_all_match':'node /tmp/p2c-transformer-transport-006/transpile_async_sources.decoded.js /tmp/p2c-repair009-normalization-input-006.json "$NORMALIZED_ROOT"',
            'transformer_executed':False,
            'repair009_controller_executed':False,
            'compile_checks_executed':False,
            'git_worktree_add_executed':False,
            'playwright_or_chromium_install_executed':False,
            'disposable_copy_preparation_executed':False,
            'browser_proof_executed':False,
            'proof_run_count_executed':0,
            'production_files_modified':False,
            'current_map_modified':False,
            'persisted_data_modified':False,
            'authorization_bindings_modified':False,
            'checked_records':checked,
          }
          (evidence/'manifest-order-sweep.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,indent=2,sort_keys=True))
          PY
      - name: Upload diagnostic report only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2c-receipt018-manifest-order-sweep-diagnostic
          path: /tmp/p2c-receipt018-manifest-sweep

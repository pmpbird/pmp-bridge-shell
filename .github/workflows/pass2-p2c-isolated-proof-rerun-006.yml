name: Runtime Binding Validation
on:
  pull_request:
    types: [opened]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    env:
      SOURCE_COMMIT: 98b2e293717b81289e3b372d1fff8f5832d29fd6
      AUDIT_DIR: audit/pass2/p2c-isolated-proof-rerun-008
      DEPS_DIR: audit/pass2/p2c-isolated-proof-rerun-006
      REPAIR_DIR: audit/pass2/p2c-isolated-proof-rerun-006/repair-continuation-003
      BUNDLE_DIR: /tmp/p2c-rb-bundle
      BUNDLE_TAR: /tmp/p2c-rb-bundle.tar.gz
      BASELINE_ROOT: /tmp/p2c-rb-base
      ACTIVE_ROOT: /tmp/p2c-rb-active
      EVIDENCE_DIR: /tmp/p2c-rb-evidence
      NORMALIZED_ROOT: /tmp/p2c-rb-normalized
      NODE_HOME: /tmp/p2c-rb-node
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Validate preparation boundary
        env:
          EVENT_ACTION: ${{ github.event.action }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          HEAD_SHA: ${{ github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_ID: ${{ github.run_id }}
          P2C_STOP_AFTER_PREPARATION: '1'
        run: |
          set -euo pipefail
          bash "$AUDIT_DIR/rerun008-controller-main-receipt024.sh"
          test -f "$EVIDENCE_DIR/preparation.json"
          test ! -e "$EVIDENCE_DIR/proof-run-started.lock"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-binding-validation
          path: /tmp/p2c-rb-evidence

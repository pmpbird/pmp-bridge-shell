name: Pass 2 P2-C Receipt 010 Clean Isolated Proof

on:
  pull_request:
    types: [opened]

permissions:
  contents: read

jobs:
  isolated-proof-receipt010:
    if: github.event.action == 'opened' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    env:
      SOURCE_COMMIT: 98b2e293717b81289e3b372d1fff8f5832d29fd6
      AUDIT_DIR: audit/pass2/p2c-isolated-proof-rerun-008
      DEPS_DIR: audit/pass2/p2c-isolated-proof-rerun-006
      REPAIR_DIR: audit/pass2/p2c-isolated-proof-rerun-006/repair-continuation-003
      BUNDLE_DIR: /tmp/p2c-proof-runner-010
      BUNDLE_TAR: /tmp/p2c-proof-rerun-010.tar.gz
      BASELINE_ROOT: /tmp/p2c-proof-baseline-010
      ACTIVE_ROOT: /tmp/p2c-proof-active-010
      EVIDENCE_DIR: /tmp/p2c-proof-evidence-010
      NORMALIZED_ROOT: /tmp/p2c-repair010-normalized
      NODE_HOME: /tmp/p2c-node-010
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Verify Receipt 010 and run exactly one frozen proof
        env:
          EVENT_ACTION: ${{ github.event.action }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          HEAD_SHA: ${{ github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,hashlib,pathlib
          root=pathlib.Path('audit/pass2/p2c-isolated-proof-rerun-008')
          r=json.loads((root/'P2C_FINAL_PATH_AUTHORIZATION_RECEIPT_010.json').read_text())
          assert r['authorized'] is True and r['authorization_consumed'] is False
          assert r['proof_run_count_authorized']==1 and r['proof_run_count_executed_under_this_receipt']==0
          for k in ('production_application_authorized','production_activation_authorized','current_map_change_authorized','persisted_data_change_authorized','merge_authorized','second_proof_run_authorized'):
            assert r[k] is False,k
          f=root/'rerun008-controller-finalize.sh'
          assert hashlib.sha256(f.read_bytes()).hexdigest()==r['repaired_finalizer_sha256']
          PY
          bash "$AUDIT_DIR/rerun008-controller-main.sh"
      - name: Finalize truth and rollback boundary
        if: always()
        run: bash "$AUDIT_DIR/rerun008-controller-finalize.sh"
      - name: Upload complete evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2c-receipt010-clean-proof-evidence
          path: /tmp/p2c-proof-evidence-010

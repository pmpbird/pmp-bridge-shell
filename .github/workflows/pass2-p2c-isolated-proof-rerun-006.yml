name: Pass 2 Proof-Entry Closure Diagnostic Only

on:
  pull_request:
    types: [opened]

permissions:
  contents: read

jobs:
  proof-entry-closure:
    if: github.event.action == 'opened' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    env:
      EVENT_ACTION: ${{ github.event.action }}
      RUN_ATTEMPT: ${{ github.run_attempt }}
      HEAD_SHA: ${{ github.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      EVIDENCE_DIR: /tmp/p2c-proof-entry-closure-027
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exhaust Receipt 026 proof-entry failures and stop before worktree
        run: |
          set -euo pipefail
          rm -rf "$EVIDENCE_DIR"
          mkdir -p "$EVIDENCE_DIR"
          python3 audit/pass2/p2c-isolated-proof-rerun-008/proof_entry_closure_027.py "$EVIDENCE_DIR/proof-entry-closure-report-027.json"
      - name: Upload proof-entry closure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2c-proof-entry-closure-027
          path: /tmp/p2c-proof-entry-closure-027

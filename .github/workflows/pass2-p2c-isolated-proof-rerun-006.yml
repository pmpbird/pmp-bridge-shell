name: Pass 2 P2-C Receipt 013 Repaired Isolated Proof

on:
  pull_request:
    types: [opened]

permissions:
  contents: read

jobs:
  isolated-proof-receipt013:
    if: github.event.action == 'opened' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    env:
      SOURCE_COMMIT: 98b2e293717b81289e3b372d1fff8f5832d29fd6
      AUDIT_DIR: audit/pass2/p2c-isolated-proof-rerun-008
      DEPS_DIR: audit/pass2/p2c-isolated-proof-rerun-006
      REPAIR_DIR: audit/pass2/p2c-isolated-proof-rerun-006/repair-continuation-003
      BUNDLE_DIR: /tmp/p2c-proof-runner-013
      BUNDLE_TAR: /tmp/p2c-proof-rerun-013.tar.gz
      BASELINE_ROOT: /tmp/p2c-proof-baseline-013
      ACTIVE_ROOT: /tmp/p2c-proof-active-013
      EVIDENCE_DIR: /tmp/p2c-proof-evidence-013
      NORMALIZED_ROOT: /tmp/p2c-repair013-normalized
      NODE_HOME: /tmp/p2c-node-013
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Verify Receipt 013 bindings and run exactly once
        env:
          EVENT_ACTION: ${{ github.event.action }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          HEAD_SHA: ${{ github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,pathlib,subprocess,os
          root=pathlib.Path('audit/pass2/p2c-isolated-proof-rerun-008')
          r=json.loads((root/'P2C_REPAIRED_PROOF_AUTHORIZATION_RECEIPT_013.json').read_text())
          assert r['authorized'] is True and r['authorization_consumed'] is False
          assert r['status']=='AUTHORIZED_UNCONSUMED'
          assert r['proof_run_count_authorized']==1 and r['proof_run_count_executed_under_this_receipt']==0
          assert os.environ['BASE_SHA']==r['current_main_sha']==r['source_repository_commit']
          subprocess.run(['git','merge-base','--is-ancestor',r['repaired_receipt012_parent_head'],os.environ['PR_HEAD_SHA']],check=True)
          controller=pathlib.Path(r['controller_path'])
          finalizer=pathlib.Path(r['finalizer_path'])
          dep=pathlib.Path(r['stale_checksum_target'])
          manifest=pathlib.Path(r['manifest_checksum_target'])
          assert subprocess.check_output(['git','hash-object',str(controller)],text=True).strip()==r['controller_git_blob_sha']
          assert hashlib.sha256(controller.read_bytes()).hexdigest()==r['controller_sha256']
          assert hashlib.sha256(finalizer.read_bytes()).hexdigest()==r['finalizer_sha256']
          assert hashlib.sha256(dep.read_bytes()).hexdigest()==r['stale_checksum_actual_sha256']
          assert hashlib.sha256(manifest.read_bytes()).hexdigest()==r['manifest_checksum_actual_sha256']
          for k in ('production_application_authorized','production_activation_authorized','current_map_change_authorized','persisted_data_change_authorized','merge_authorized','second_proof_run_authorized'):
            assert r[k] is False,k
          changed=set(subprocess.check_output(['git','diff','--name-only',r['current_main_sha'],os.environ['PR_HEAD_SHA']],text=True).splitlines())
          allowed={'.github/workflows/pass2-p2c-isolated-proof-rerun-006.yml'}
          extras=sorted(p for p in changed if p not in allowed and not p.startswith('audit/pass2/p2c-isolated-proof-rerun-006/') and not p.startswith('audit/pass2/p2c-isolated-proof-rerun-008/'))
          assert not extras,extras
          assert not any('/__pycache__/' in p or p.endswith('.pyc') for p in changed)
          PY
          bash -n "$AUDIT_DIR/rerun008-controller-main.sh"
          bash -n "$AUDIT_DIR/rerun008-controller-finalize.sh"
          bash "$AUDIT_DIR/rerun008-controller-main.sh"
      - name: Finalize truth and rollback boundary
        if: always()
        run: bash "$AUDIT_DIR/rerun008-controller-finalize.sh"
      - name: Upload complete Receipt 013 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2c-receipt013-repaired-proof-evidence
          path: /tmp/p2c-proof-evidence-013

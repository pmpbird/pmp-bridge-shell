name: Temporary Atlas seal-binding patch

on:
  push:
    branches:
      - chatgpt/atlas-seal-binding-reference-truth-20260826A
    paths:
      - '.github/workflows/_temp_atlas_seal_binding_patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: chatgpt/atlas-seal-binding-reference-truth-20260826A
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply exact scanner patch
        run: python3 tools/_temp_patch_atlas_seal_binding.py
      - name: Run deterministic bounded checks
        run: |
          node --check pmp-active-path-discovery-machine-v1.js
          node --check audit/a002-active-path-seal-binding-reference-truth-v1.cjs
          python3 tools/test_active_path_seal_binding_reference_truth_v1.py
          python3 tools/verify_active_path_seal_binding_reference_truth_v1.py
          python3 -m json.tool audit/pass13/active-path-seal-binding-reference-truth-gate-v1.json >/dev/null
          python3 -m json.tool audit/pass13/receipts/RECEIPT_ACTIVE_PATH_SEAL_BINDING_REFERENCE_TRUTH_20260826A_001.json >/dev/null
      - name: Remove temporary patch files before A-003 inventory
        run: |
          rm -f tools/_temp_patch_atlas_seal_binding.py
          rm -f .github/workflows/_temp_atlas_seal_binding_patch.yml
      - name: Build deterministic A-003 manifest
        run: |
          python3 tools/build_a003_integrity_manifest.py --output /tmp/a003-generated-integrity-manifest.json --report /tmp/a003-integrity-probe-report.json
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          path=Path('/tmp/a003-generated-integrity-manifest.json')
          manifest=json.loads(path.read_text('utf-8'))
          manifest.pop('source_commit',None)
          manifest.pop('self_digest_for_generated_bytes',None)
          identity={
            'records':[(r['path'],r['sha256_hex']) for r in manifest.get('records',[])],
            'historical_records':[(r['path'],r.get('repository_ref'),r['sha256_hex']) for r in manifest.get('historical_records',[])],
            'external_records':[(r['url'],r['sha256_hex']) for r in manifest.get('external_records',[])],
            'root_trust_anchors':manifest.get('root_trust_anchors',[]),
            'policy':{'algorithm':manifest.get('algorithm'),'unlisted_executable_policy':manifest.get('unlisted_executable_policy'),'network_policy':manifest.get('network_policy')}
          }
          manifest['version']='20260711A-A003-FINAL'
          manifest['runtime_source_set_sha256']=hashlib.sha256(json.dumps(identity,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          manifest['source_identity_rule']='Deterministic digest of protected local, historical, external, root-anchor, and policy identities; audit/workflow-only commits do not alter this identity.'
          path.write_text(json.dumps(manifest,indent=2,sort_keys=True)+'\n','utf-8')
          PY
          cp /tmp/a003-generated-integrity-manifest.json pmp-runtime-integrity-manifest-v1.json
          manifest_sha="$(sha256sum pmp-runtime-integrity-manifest-v1.json | awk '{print $1}')"
          manifest_bytes="$(wc -c < pmp-runtime-integrity-manifest-v1.json | tr -d ' ')"
          runtime_set_sha="$(python3 -c "import json;print(json.load(open('pmp-runtime-integrity-manifest-v1.json'))['runtime_source_set_sha256'])")"
          python3 - "$manifest_sha" "$manifest_bytes" "$runtime_set_sha" <<'PY'
          import json,re,sys
          from pathlib import Path
          manifest_sha,manifest_bytes,runtime_set_sha=sys.argv[1:]
          root=Path('pmp-app-current.html')
          text=root.read_text('utf-8')
          updated,count=re.subn(r"const MANIFEST_SHA256='(?:__A003_MANIFEST_SHA256__|[0-9a-f]{64})';",f"const MANIFEST_SHA256='{manifest_sha}';",text,count=1)
          if count!=1: raise SystemExit('Expected exactly one bootstrap manifest digest constant.')
          root.write_text(updated,'utf-8')
          receipt={'type':'PMP_A003_MANIFEST_SEAL_V1','repair_id':'A-003','status':'SEALED','manifest_path':'pmp-runtime-integrity-manifest-v1.json','manifest_sha256':manifest_sha,'manifest_bytes':int(manifest_bytes),'manifest_version':'20260711A-A003-FINAL','runtime_source_set_sha256':runtime_set_sha,'root_trust_anchor':'pmp-app-current.html','root_self_verifiable':False,'sealed_branch':'chatgpt/atlas-seal-binding-reference-truth-20260826A','rule':'The root trust anchor cannot verify its own pre-execution bytes; it carries the exact digest for the deterministic protected runtime source set.'}
          Path('audit/a003-manifest-seal.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n','utf-8')
          PY
          python3 tools/test_a003_integrity.py
      - name: Commit bounded repair and branch seal
        run: |
          git config user.name 'pmpbird'
          git config user.email 'pmpbird@gmail.com'
          git add -A
          git status --short
          git commit -m 'Fix Atlas served seal binding and reference truth'
          git push origin HEAD:chatgpt/atlas-seal-binding-reference-truth-20260826A

name: Packet 015 current runtime source family

on:
  pull_request:
    paths:
      - "audit/Packet_01.5_Current_Runtime_Source_PR_Trigger.txt"
      - "audit/applicability/Packet_01.5_Runtime_Source_Pass_v1.json"
      - "tools/runtime_source_git.py"
      - "tools/runtime_source_graph.py"
      - "tools/runtime_source_rules.py"
      - "tools/runtime_source_rules_v2.py"
      - "tools/runtime_source_paths.py"
      - "tools/runtime_source_evaluate.py"
      - "tools/diagnose_runtime_source_partition_v2.py"
      - "tools/build_packet_01_5_runtime_source_v1.py"
      - "tools/build_packet_01_5_runtime_source_v2.py"
      - "tools/verify_packet_01_5_runtime_source_v1.py"
      - "tools/run_runtime_source_check_v2.py"
      - "tools/write_packet_01_5_runtime_source_receipts_v1.py"
      - "tools/commit_runtime_source_outputs.sh"
      - "tools/commit_runtime_source_diagnostic.sh"
      - ".github/workflows/packet_015_current_runtime_source.yml"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - name: Build runtime family
        run: |
          python3 tools/diagnose_runtime_source_partition_v2.py > audit/Packet_01.5_Current_Runtime_Source_Debug.log
          python3 tools/build_packet_01_5_runtime_source_v2.py 2>> audit/Packet_01.5_Current_Runtime_Source_Debug.log
      - name: Commit failure diagnostic
        if: failure()
        run: bash tools/commit_runtime_source_diagnostic.sh
      - run: python3 tools/run_runtime_source_check_v2.py > audit/Packet_01.5_Current_Runtime_Source_Independent_Verification_v1.json
      - run: python3 tools/write_packet_01_5_runtime_source_receipts_v1.py

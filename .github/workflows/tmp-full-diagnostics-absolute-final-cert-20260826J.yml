name: Temporary Absolute Final Full Diagnostics ZIP Certification
on:
  push:
    branches:
      - chatgpt/full-diagnostics-zip-export-20260826A
    paths:
      - '.github/workflows/tmp-full-diagnostics-absolute-final-cert-20260826J.yml'
permissions:
  contents: write
jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BASE_SHA: aedcac8f6acfbedcc2dfa124d984d225b7f42d17
      PRE_RECEIPT_HEAD: 8f921cb4aaff8d61dc06ab0c03096d857cdfd503
      BRANCH: chatgpt/full-diagnostics-zip-export-20260826A
      ROOT: /tmp/full-diagnostics-absolute-final-cert
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Self-remove and establish absolute final branch head
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/tmp-full-diagnostics-absolute-final-cert-20260826J.yml
          git commit -m 'Remove absolute-final Full Diagnostics certification [skip ci]'
          git push origin HEAD:$BRANCH
          mkdir -p "$ROOT"
          git rev-parse HEAD | tee "$ROOT/certified-head.txt"
          git diff --name-only "$BASE_SHA...HEAD" | sort | tee "$ROOT/changed-paths.txt"
          test "$(wc -l < "$ROOT/changed-paths.txt" | tr -d ' ')" = "11"
          git diff --name-only "$PRE_RECEIPT_HEAD...HEAD" | sort | tee "$ROOT/final-delta.txt"
          test "$(cat "$ROOT/final-delta.txt")" = 'audit/pass13/receipts/RECEIPT_FULL_DIAGNOSTICS_ZIP_EXPORT_20260826A_001.json'
      - name: Verify records, ZIP contracts, seal, and no-blind scope
        id: core
        shell: bash
        run: |
          set +e
          python3 - <<'PY' > "$ROOT/core.log" 2>&1
          import json
          g=json.load(open('audit/pass13/full-diagnostics-zip-export-gate-v1.json'))
          r=json.load(open('audit/pass13/receipts/RECEIPT_FULL_DIAGNOSTICS_ZIP_EXPORT_20260826A_001.json'))
          assert g['status']=='PASS' and r['status']=='PASS'
          assert g['certification']['final_receipt_delta_certification_run']==33022516596
          assert g['certification']['pass_record_certification_run']==33022375402
          assert r['ci_evidence']['final_gate_delta_certification_run']==33022672906
          assert g['certification']['phone_proof']=='REQUIRED_AFTER_DEPLOYMENT'
          assert r['verification']['user_device_proof']=='REQUIRED_AFTER_DEPLOYMENT'
          PY
          r1=$?
          python3 tools/test_full_diagnostics_zip_export_v1.py >> "$ROOT/core.log" 2>&1; r2=$?
          python3 tools/verify_full_diagnostics_zip_export_v1.py >> "$ROOT/core.log" 2>&1; r3=$?
          python3 tools/test_a003_integrity.py --output "$ROOT/a003-result.json" >> "$ROOT/core.log" 2>&1; r4=$?
          python3 tools/test_pass6_unit7_no_blind_flying_gate_v1.py >> "$ROOT/core.log" 2>&1; r5=$?
          python3 tools/test_app_orchestrator_ownership_maintenance_v1.py >> "$ROOT/core.log" 2>&1; r6=$?
          python3 tools/verify_app_orchestrator_ownership_maintenance_v1.py >> "$ROOT/core.log" 2>&1; r7=$?
          python3 tools/run_pass6_unit7_no_blind_flying_gate_v1.py --base "$BASE_SHA" --output "$ROOT/no-blind-result.json" >> "$ROOT/core.log" 2>&1; r8=$?
          rc=0; for x in $r1 $r2 $r3 $r4 $r5 $r6 $r7 $r8; do if [ "$x" -ne 0 ]; then rc=1; fi; done
          echo "rc=$rc" >> "$GITHUB_OUTPUT"; exit 0
      - name: Emulate shallow ownership maintenance and current safety/static
        id: rest
        shell: bash
        run: |
          set +e
          git clone --depth 1 --branch "$BRANCH" https://github.com/pmpbird/pmp-bridge-shell.git /tmp/full-diagnostics-absolute-final-shallow > "$ROOT/clone.log" 2>&1; r0=$?
          cd /tmp/full-diagnostics-absolute-final-shallow
          export GITHUB_HEAD_REF="$BRANCH"
          python3 tools/generate_app_orchestrator_ownership_maintenance_integrity_updates_v1.py > "$ROOT/generator.log" 2>&1; r1=$?
          git diff --exit-code > "$ROOT/ownership-diff.log" 2>&1; r2=$?
          python3 tools/test_app_orchestrator_ownership_maintenance_v1.py > "$ROOT/ownership-test.log" 2>&1; r3=$?
          python3 tools/verify_app_orchestrator_ownership_maintenance_v1.py > "$ROOT/ownership-verify.log" 2>&1; r4=$?
          cd "$GITHUB_WORKSPACE"
          node tools/test_pass11_safety_no_deletion_v1.js > "$ROOT/pass11.log" 2>&1; r5=$?
          mkdir -p "$ROOT/static-preflight"
          head="$(git rev-parse HEAD)"
          python3 audit/pass2/p2c-isolated-proof-rerun-008/static_preflight_receipt038.py --select-mode --base-sha "$BASE_SHA" --head-sha "$head" --github-output "$ROOT/static-mode.txt" > "$ROOT/static.log" 2>&1; r6=$?
          mode="$(sed -n 's/^mode=//p' "$ROOT/static-mode.txt" | tail -1)"
          python3 audit/pass2/p2c-isolated-proof-rerun-008/static_preflight_receipt038.py --mode "$mode" --base-sha "$BASE_SHA" --head-sha "$head" --evidence-dir "$ROOT/static-preflight" >> "$ROOT/static.log" 2>&1; r7=$?
          python3 audit/pass2/p2c-post-failure-static-preflight-001/test_static_preflight_modes_001.py >> "$ROOT/static.log" 2>&1; r8=$?
          python3 audit/pass2/p2c-post-failure-static-preflight-001/verify_static_preflight_mode_separation_001.py --base-sha "$BASE_SHA" --head-sha "$head" --evidence-dir "$ROOT/static-preflight" >> "$ROOT/static.log" 2>&1; r9=$?
          rc=0; for x in $r0 $r1 $r2 $r3 $r4 $r5 $r6 $r7 $r8 $r9; do if [ "$x" -ne 0 ]; then rc=1; fi; done
          echo "rc=$rc" >> "$GITHUB_OUTPUT"; exit 0
      - name: Write absolute-final summary
        if: always()
        run: |
          cd "$GITHUB_WORKSPACE"
          head="$(git rev-parse HEAD)"
          cat > "$ROOT/summary.json" <<EOF
          {"type":"PMP_FULL_DIAGNOSTICS_ZIP_ABSOLUTE_FINAL_CERT_V1","certified_head":"$head","base_sha":"$BASE_SHA","pre_receipt_head":"$PRE_RECEIPT_HEAD","core_no_blind":${{ steps.core.outputs.rc || '99' }},"ownership_safety_static":${{ steps.rest.outputs.rc || '99' }},"runtime_browser_proof_run":33021560260,"exact_head_closure_run":33022207514,"pass_record_run":33022375402,"receipt_delta_run":33022516596,"gate_delta_run":33022672906}
          EOF
      - name: Upload absolute-final evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-diagnostics-zip-absolute-final-${{ github.run_id }}
          path: /tmp/full-diagnostics-absolute-final-cert
          if-no-files-found: error
          retention-days: 90
      - name: Enforce absolute-final certification
        run: |
          test "${{ steps.core.outputs.rc }}" = "0"
          test "${{ steps.rest.outputs.rc }}" = "0"

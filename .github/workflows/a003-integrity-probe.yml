name: A-003 Integrity Probe

on:
  push:
    branches:
      - agent/a002-current-map-single-authority
    paths:
      - 'tools/build_a003_integrity_manifest.py'
      - '.github/workflows/a003-integrity-probe.yml'
      - 'pmp-current-map-v12.json'
      - '*.html'
      - '*.js'
      - '*.json'
  pull_request:
    branches:
      - main
    paths:
      - 'tools/build_a003_integrity_manifest.py'
      - '.github/workflows/a003-integrity-probe.yml'
      - 'pmp-current-map-v12.json'
      - '*.html'
      - '*.js'
      - '*.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build integrity probe
        run: |
          python3 tools/build_a003_integrity_manifest.py \
            --output a003-generated-integrity-manifest.json \
            --report a003-integrity-probe-report.json \
            | tee a003-integrity-probe-console.log

      - name: Validate generated JSON
        run: |
          python3 -m json.tool a003-generated-integrity-manifest.json >/dev/null
          python3 -m json.tool a003-integrity-probe-report.json >/dev/null

      - name: Commit exact generated manifest
        if: github.event_name == 'push'
        run: |
          cp a003-generated-integrity-manifest.json pmp-runtime-integrity-manifest-v1.json
          if git diff --quiet -- pmp-runtime-integrity-manifest-v1.json && git ls-files --error-unmatch pmp-runtime-integrity-manifest-v1.json >/dev/null 2>&1; then
            echo 'Integrity manifest already matches generated bytes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pmp-runtime-integrity-manifest-v1.json
          git commit -m 'A-003 commit exact generated runtime integrity manifest [skip ci]'
          git push origin HEAD:agent/a002-current-map-single-authority

      - name: Upload probe artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a003-integrity-probe
          path: |
            a003-generated-integrity-manifest.json
            a003-integrity-probe-report.json
            a003-integrity-probe-console.log
          if-no-files-found: error

name: Pass 10 Unit 7U Uniform Title Weight
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/pass10-unit7-single-card-presentation-v1.yml'
      - '.github/workflows/pass10-unit7-uniform-title-weight-v1.yml'
      - 'audit/a003-manifest-seal.json'
      - 'audit/pass10/pass10-bank-unit7-uniform-title-weight-v1.json'
      - 'audit/pass10/receipts/RECEIPT_P10_U7U_UNIFORM_TITLE_WEIGHT_20260727T041526Z_001.json'
      - 'pmp-app-current.html'
      - 'pmp-bank-screen-owner-v1.js'
      - 'pmp-current-inner-cleanbug-rgcontrols-v23.html'
      - 'pmp-runtime-integrity-manifest-v1.json'
      - 'tools/fixtures/pass10-unit7-uniform-title-weight-v1.html'
      - 'tools/generate_pass10_unit7_uniform_title_weight_integrity_updates_v1.py'
      - 'tools/test_pass10_unit7_uniform_title_weight_v1.js'
      - 'tools/verify_pass10_unit7_uniform_title_weight_v1.py'
permissions:
  contents: read
jobs:
  uniform-title-weight:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      ARTIFACT_ROOT: /tmp/pass10-unit7u-artifacts/artifacts/attempt-001
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - id: evaluate
        shell: bash
        run: |
          set +e
          mkdir -p "$ARTIFACT_ROOT"
          printf '%s\n' '{"command":"P10-U7U deterministic presentation-only uniform title weight: exact 950 match across Run State Summary through Level 2 and Level 3+; preserve nodes, controls, single-card presentation, order, and Locked/Waiting readiness; no live PMP-app observation or persisted-data operation"}' > "$ARTIFACT_ROOT/command.json"
          printf '%s\n' 'no stderr emitted before execution' > "$ARTIFACT_ROOT/stderr.txt"
          generate_rc=0
          clean_rc=0
          verify_rc=0
          if git diff --name-only "${{ github.event.pull_request.base.sha }}...HEAD" | grep -qx 'audit/pass10/pass10-bank-unit7-uniform-title-weight-v1.json'; then
            python3 tools/generate_pass10_unit7_uniform_title_weight_integrity_updates_v1.py > "$ARTIFACT_ROOT/stdout.txt" 2>> "$ARTIFACT_ROOT/stderr.txt"
            generate_rc=$?
            git diff --exit-code >> "$ARTIFACT_ROOT/stdout.txt" 2>> "$ARTIFACT_ROOT/stderr.txt"
            clean_rc=$?
            python3 tools/verify_pass10_unit7_uniform_title_weight_v1.py "${{ github.event.pull_request.base.sha }}" >> "$ARTIFACT_ROOT/stdout.txt" 2>> "$ARTIFACT_ROOT/stderr.txt"
            verify_rc=$?
          else
            printf '%s\n' 'P10-U7U historical exact-scope verifier not applicable; 86-assertion uniform-title runtime regression executed.' > "$ARTIFACT_ROOT/stdout.txt"
          fi
          node tools/test_pass10_unit7_uniform_title_weight_v1.js >> "$ARTIFACT_ROOT/stdout.txt" 2>> "$ARTIFACT_ROOT/stderr.txt"
          tests_rc=$?
          node tools/test_pass10_unit7_single_card_presentation_v1.js >> "$ARTIFACT_ROOT/stdout.txt" 2>> "$ARTIFACT_ROOT/stderr.txt"
          p10u7t_rc=$?
          node tools/test_pass10_unit7_legacy_level_alias_single_stack_repair_v1.js >> "$ARTIFACT_ROOT/stdout.txt" 2>> "$ARTIFACT_ROOT/stderr.txt"
          p10u7s_rc=$?
          node tools/test_pass10_unit7_bank_level_owner_stability_repair_v1.js >> "$ARTIFACT_ROOT/stdout.txt" 2>> "$ARTIFACT_ROOT/stderr.txt"
          p10u7r_rc=$?
          node tools/test_pass9_unit3_bank_continuous_run_owner_integration_v1.js >> "$ARTIFACT_ROOT/stdout.txt" 2>> "$ARTIFACT_ROOT/stderr.txt"
          p9u3_rc=$?
          node tools/test_pass10_unit3_bank_readonly_projection_v1.js >> "$ARTIFACT_ROOT/stdout.txt" 2>> "$ARTIFACT_ROOT/stderr.txt"
          p10u3_rc=$?
          node tools/test_pass10_unit4_bank_owner_projection_refresh_v1.js >> "$ARTIFACT_ROOT/stdout.txt" 2>> "$ARTIFACT_ROOT/stderr.txt"
          p10u4_rc=$?
          node tools/test_pass10_unit7_bank_hands_on_readiness_v1.js >> "$ARTIFACT_ROOT/stdout.txt" 2>> "$ARTIFACT_ROOT/stderr.txt"
          p10u7a_rc=$?
          git diff --name-only "${{ github.event.pull_request.base.sha }}...HEAD" | python3 -c 'import json,sys; print(json.dumps({"changed_paths":[x.strip() for x in sys.stdin if x.strip()]},sort_keys=True))' > "$ARTIFACT_ROOT/scope.json"
          python3 -c 'import json,os,platform; print(json.dumps({"python":platform.python_version(),"node":os.popen("node --version").read().strip(),"runner":os.environ.get("RUNNER_OS"),"sha":os.environ.get("GITHUB_SHA")},sort_keys=True))' > "$ARTIFACT_ROOT/environment.json"
          cp audit/pass10/pass10-bank-unit7-uniform-title-weight-v1.json "$ARTIFACT_ROOT/result.json"
          printf '%s\n' '{"special_authority_required":false,"special_authority_consumed":false,"formal_proof_performed":false,"formal_proof_authorization_consumed":false,"live_app_observation_performed":false,"disposable_fixture_browser_test_performed":true,"persisted_user_data_changed":false}' > "$ARTIFACT_ROOT/authority-state.json"
          rc=0
          if [ "$generate_rc" -ne 0 ] || [ "$clean_rc" -ne 0 ] || [ "$tests_rc" -ne 0 ] || [ "$p10u7t_rc" -ne 0 ] || [ "$p10u7s_rc" -ne 0 ] || [ "$p10u7r_rc" -ne 0 ] || [ "$p9u3_rc" -ne 0 ] || [ "$p10u3_rc" -ne 0 ] || [ "$p10u4_rc" -ne 0 ] || [ "$p10u7a_rc" -ne 0 ] || [ "$verify_rc" -ne 0 ]; then rc=1; fi
          printf '{"generate":%s,"deterministic_clean":%s,"tests":%s,"p10u7t":%s,"p10u7s":%s,"p10u7r":%s,"p9u3":%s,"p10u3":%s,"p10u4":%s,"p10u7a":%s,"verify":%s,"final":%s}\n' "$generate_rc" "$clean_rc" "$tests_rc" "$p10u7t_rc" "$p10u7s_rc" "$p10u7r_rc" "$p9u3_rc" "$p10u3_rc" "$p10u4_rc" "$p10u7a_rc" "$verify_rc" "$rc" > "$ARTIFACT_ROOT/exit-status.json"
          python3 - "$ARTIFACT_ROOT" <<'PY'
          import hashlib,json,pathlib,sys
          root=pathlib.Path(sys.argv[1]); rows=[]
          for path in sorted(root.iterdir()):
              if path.name=="artifact-manifest.json" or not path.is_file(): continue
              data=path.read_bytes(); rows.append({"path":path.name,"bytes":len(data),"sha256":hashlib.sha256(data).hexdigest()})
          assert len(rows)==8 and all(row["bytes"]>0 for row in rows)
          (root/"artifact-manifest.json").write_text(json.dumps({"type":"PMP_P10_U7U_ARTIFACT_MANIFEST_V1","records":rows},indent=2,sort_keys=True)+"\n")
          PY
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload complete P10-U7U evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pass10-unit7u-uniform-title-weight-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/pass10-unit7u-artifacts/
          if-no-files-found: error
          retention-days: 90
      - name: Enforce preserved result after upload
        run: test "${{ steps.evaluate.outputs.exit_code }}" = "0"

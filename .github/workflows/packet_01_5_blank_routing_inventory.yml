name: Packet 01.5 blank routing inventory

on:
  push:
    paths:
      - "tools/build_packet_01_5_blank_routing_inventory.py"
      - "tools/verify_packet_01_5_blank_routing_inventory.py"
      - ".github/workflows/packet_01_5_blank_routing_inventory.yml"
  pull_request:
    paths:
      - "audit/Packet_01.5_Routing_Inventory_PR_Trigger.txt"
      - "tools/build_packet_01_5_blank_routing_inventory.py"
      - "tools/verify_packet_01_5_blank_routing_inventory.py"
      - ".github/workflows/packet_01_5_blank_routing_inventory.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Verify exact baseline source
        run: python3 tools/verify_packet_01_5_baseline_source.py

      - name: Build blank routing inventory
        run: python3 tools/build_packet_01_5_blank_routing_inventory.py

      - name: Independently verify all envelopes
        run: python3 tools/verify_packet_01_5_blank_routing_inventory.py

      - name: Commit verified inventory outputs to current branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            audit/baseline-source/reconstructed/pmp-current-permanent-limitation-register-v3-final.json \
            audit/Packet_01.5_Baseline_Source_Verification_v1.md \
            audit/Packet_01.5_Baseline_Source_Verification_v1.json \
            audit/routing-inventory/Packet_01.5_Blank_Routing_Inventory_v1.jsonl \
            audit/routing-inventory/Packet_01.5_Blank_Routing_Inventory_v1.jsonl.gz \
            audit/routing-inventory/Packet_01.5_Blank_Routing_Inventory_v1.manifest.json \
            audit/Packet_01.5_Blank_Routing_Inventory_Build_v1.md \
            audit/Packet_01.5_Blank_Routing_Inventory_Build_v1.json \
            audit/Packet_01.5_Blank_Routing_Inventory_Independent_Verification_v1.md \
            audit/Packet_01.5_Blank_Routing_Inventory_Independent_Verification_v1.json \
            audit/Packet_01.5_Routing_Inventory_Status_v74.md
          if git diff --cached --quiet; then
            echo "No verified inventory-output changes."
          else
            git commit -m "Generate and verify Packet 01.5 blank routing inventory"
            git push origin "HEAD:${{ github.head_ref || github.ref_name }}"
          fi

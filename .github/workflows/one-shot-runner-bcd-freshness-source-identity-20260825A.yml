name: One-shot Runner — B-D Fresh Evaluation Source Identity Repair

on:
  push:
    branches:
      - chatgpt/diagnostics-bcd-freshness-source-identity-20260825A

permissions:
  contents: write

concurrency:
  group: one-shot-runner-bcd-freshness-source-identity-20260825A
  cancel-in-progress: false

jobs:
  execute-corrected-authorized-workflow:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout corrected diagnostic branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: chatgpt/diagnostics-bcd-freshness-source-identity-20260825A

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Execute authorized bounded repair steps exactly once
        shell: bash
        run: |
          python3 -m pip install --disable-pip-version-check --quiet pyyaml
          python3 - <<'PY'
          import json
          import os
          import shutil
          import subprocess
          from pathlib import Path

          import yaml

          source = Path('.github/workflows/one-shot-bcd-freshness-source-identity-20260825A.yml')
          runner = Path('.github/workflows/one-shot-runner-bcd-freshness-source-identity-20260825A.yml')
          workflow = yaml.safe_load(source.read_text('utf-8'))
          steps = workflow['jobs']['repair-and-seal']['steps']
          child_env = os.environ.copy()
          child_env['PYTHONDONTWRITEBYTECODE'] = '1'

          def remove_repository_bytecode() -> None:
              for cache in Path('.').rglob('__pycache__'):
                  if cache.is_dir():
                      shutil.rmtree(cache)
              for compiled in Path('.').rglob('*.py[co]'):
                  compiled.unlink(missing_ok=True)

          for step in steps:
              script = step.get('run')
              if not script:
                  continue
              name = str(step.get('name') or 'unnamed run step')
              print(f'::group::{name}', flush=True)
              if name == 'Run precommit deterministic, independent, ownership, and A-003 gates':
                  for temporary in (
                      'a003-generated-integrity-manifest.json',
                      'a003-integrity-probe-report.json',
                      'a003-integrity-probe-console.log',
                  ):
                      Path(temporary).unlink(missing_ok=True)
              if name in {
                  'Commit exact bounded final tree locally',
                  'Run final exact-scope no-blind-flying and source-byte gates',
              }:
                  remove_repository_bytecode()
              if name == 'Commit exact bounded final tree locally':
                  runner.unlink()
              if name == 'Push verified bounded repair':
                  workflow_paths = [
                      '.github/workflows/a002-live-runtime.yml',
                      '.github/workflows/one-shot-bcd-freshness-source-identity-20260825A.yml',
                      '.github/workflows/one-shot-runner-bcd-freshness-source-identity-20260825A.yml',
                  ]
                  subprocess.run(['git', 'checkout', 'HEAD^', '--', *workflow_paths], check=True)
                  subprocess.run(['git', 'add', *workflow_paths], check=True)
                  subprocess.run(['git', 'commit', '--amend', '--no-edit'], check=True)
              completed = subprocess.run(
                  ['bash', '-e', '-u', '-o', 'pipefail', '-c', script],
                  cwd='.',
                  env=child_env,
                  check=False,
              )
              if completed.returncode == 0 and name == 'Apply bounded freshness and source-identity repair':
                  gate_path = Path('audit/pass13/bcd-fresh-evaluation-source-identity-gate-v1.json')
                  gate = json.loads(gate_path.read_text('utf-8'))
                  gate['scope']['implementation_paths'] = [
                      'pmp-app-current.html',
                      'pmp-diagnostic-coverage-passes-bcd-v1-1-1-0-fresh-evaluation-20260825A.js',
                      'pmp-diagnostics-consolidated-view-v1.js',
                      'pmp-diagnostics-writer-trace-v1.js',
                  ]
                  gate_path.write_text(json.dumps(gate, indent=2, sort_keys=True) + '\n', 'utf-8')
              print('::endgroup::', flush=True)
              if completed.returncode != 0:
                  raise SystemExit(completed.returncode)
          PY

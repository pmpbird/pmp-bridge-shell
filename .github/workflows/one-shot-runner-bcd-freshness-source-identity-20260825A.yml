name: One-shot Runner — B-D Fresh Evaluation Source Identity Repair

on:
  push:
    branches:
      - chatgpt/diagnostics-bcd-freshness-source-identity-20260825A

permissions:
  contents: write

concurrency:
  group: one-shot-runner-bcd-freshness-source-identity-20260825A
  cancel-in-progress: false

jobs:
  execute-corrected-authorized-workflow:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout corrected diagnostic branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: chatgpt/diagnostics-bcd-freshness-source-identity-20260825A

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Execute authorized bounded repair steps exactly once
        shell: bash
        run: |
          python3 -m pip install --disable-pip-version-check --quiet pyyaml
          python3 - <<'PY'
          import os
          import subprocess
          from pathlib import Path

          import yaml

          source = Path('.github/workflows/one-shot-bcd-freshness-source-identity-20260825A.yml')
          runner = Path('.github/workflows/one-shot-runner-bcd-freshness-source-identity-20260825A.yml')
          workflow = yaml.safe_load(source.read_text('utf-8'))
          steps = workflow['jobs']['repair-and-seal']['steps']

          for step in steps:
              script = step.get('run')
              if not script:
                  continue
              name = str(step.get('name') or 'unnamed run step')
              print(f'::group::{name}', flush=True)
              if name == 'Run precommit deterministic, independent, ownership, and A-003 gates':
                  for temporary in (
                      'a003-generated-integrity-manifest.json',
                      'a003-integrity-probe-report.json',
                      'a003-integrity-probe-console.log',
                  ):
                      Path(temporary).unlink(missing_ok=True)
              if name == 'Commit exact bounded final tree locally':
                  runner.unlink()
              completed = subprocess.run(
                  ['bash', '-e', '-u', '-o', 'pipefail', '-c', script],
                  cwd='.',
                  env=os.environ.copy(),
                  check=False,
              )
              print('::endgroup::', flush=True)
              if completed.returncode != 0:
                  raise SystemExit(completed.returncode)
          PY

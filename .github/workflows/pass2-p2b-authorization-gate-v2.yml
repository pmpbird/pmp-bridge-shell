name: Pass 2 P2-B Actor Authorization Gate V2

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/pass2-p2b-authorization-gate-v2.yml'
      - '.github/workflows/pass2-p2b-authorization-gate.yml'
      - '.github/workflows/a003-integrity-probe.yml'
      - 'pmp-pass2-actor-authorization-gate-v1.js'
      - 'pmp-pass2-actor-authority-registry-v1.json'
      - 'pmp-current-inner-cleanbug-rgcontrols-v30-direct-boot-surface-20260708A.html'
      - 'pmp-app-orchestrator-v1.js'
      - 'pmp-safe-writer-current-return-fix-v1.js'
      - 'pmp-continuous-run-bank-order-frame-loader-v1.js'
      - 'pmp-authority-rules-v1.js'
      - 'pmp-bug-watch-passive-capture-v1.js'
      - 'audit/pass2/p2b-forbidden-action-fixture.html'
      - 'audit/pass2/p2b-registered-marker.js'
      - 'audit/pass2/p2b-scope-lock.json'
      - 'audit/pass2/p2b-status.md'
      - 'audit/pass2/p2b-receipt.json'
      - 'audit/pass2/p2b-receipt-verification-trigger.md'
      - 'tools/build_pass2_actor_registry.py'
      - 'tools/test_pass2_p2b_static.py'
      - 'tools/run_pass2_p2b_browser.py'
      - 'tools/run_a003_live_final.py'
      - 'pmp-runtime-integrity-manifest-v1.json'
      - 'pmp-app-current.html'
      - 'audit/a003-manifest-seal.json'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: pass2-p2b-authorization-v2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  P2A_MAIN_COMMIT: c767844d53b4b393928170387b6f988e49fe1fc6
  P2A_RECEIPT_ID: PMP-APP-ORCH-PASS2-P2A-E7BA1B93-PASS-001
  GH_TOKEN: ${{ github.token }}

jobs:
  certify-p2b:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify P2-A baseline and clean P2-B scope
        run: |
          set -euo pipefail
          test "$(git rev-parse origin/main)" = "$P2A_MAIN_COMMIT"
          git merge-base --is-ancestor "$P2A_MAIN_COMMIT" HEAD
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          receipt=json.loads(pathlib.Path('audit/pass2/p2a-receipt.json').read_text())
          assert receipt['receipt_id']==os.environ['P2A_RECEIPT_ID']
          assert receipt['status']=='P2A_COMPLETE_PASS2_IN_PROGRESS'
          allowed={
            '.github/workflows/a003-integrity-probe.yml',
            '.github/workflows/pass2-p2b-authorization-gate-v2.yml',
            'audit/a003-manifest-seal.json',
            'audit/pass2/p2b-forbidden-action-fixture.html',
            'audit/pass2/p2b-registered-marker.js',
            'audit/pass2/p2b-scope-lock.json',
            'audit/pass2/p2b-status.md',
            'audit/pass2/p2b-receipt.json',
            'audit/pass2/p2b-receipt-verification-trigger.md',
            'pmp-app-current.html',
            'pmp-app-orchestrator-v1.js',
            'pmp-authority-rules-v1.js',
            'pmp-bug-watch-passive-capture-v1.js',
            'pmp-continuous-run-bank-order-frame-loader-v1.js',
            'pmp-current-inner-cleanbug-rgcontrols-v30-direct-boot-surface-20260708A.html',
            'pmp-pass2-actor-authority-registry-v1.json',
            'pmp-pass2-actor-authorization-gate-v1.js',
            'pmp-runtime-integrity-manifest-v1.json',
            'pmp-safe-writer-current-return-fix-v1.js',
            'tools/build_pass2_actor_registry.py',
            'tools/run_a003_live_final.py',
            'tools/run_pass2_p2b_browser.py',
            'tools/test_pass2_p2b_static.py'
          }
          required={
            '.github/workflows/a003-integrity-probe.yml',
            '.github/workflows/pass2-p2b-authorization-gate-v2.yml',
            'pmp-pass2-actor-authorization-gate-v1.js',
            'pmp-pass2-actor-authority-registry-v1.json',
            'pmp-current-inner-cleanbug-rgcontrols-v30-direct-boot-surface-20260708A.html',
            'pmp-app-orchestrator-v1.js',
            'pmp-safe-writer-current-return-fix-v1.js',
            'pmp-continuous-run-bank-order-frame-loader-v1.js',
            'pmp-authority-rules-v1.js',
            'pmp-bug-watch-passive-capture-v1.js',
            'audit/pass2/p2b-forbidden-action-fixture.html',
            'audit/pass2/p2b-registered-marker.js',
            'audit/pass2/p2b-scope-lock.json',
            'tools/build_pass2_actor_registry.py',
            'tools/run_a003_live_final.py',
            'tools/run_pass2_p2b_browser.py',
            'tools/test_pass2_p2b_static.py'
          }
          changed=set(subprocess.check_output(['git','diff','--name-only',os.environ['P2A_MAIN_COMMIT'],'HEAD'],text=True).splitlines())
          assert changed <= allowed, sorted(changed-allowed)
          assert required <= changed, sorted(required-changed)
          assert '.github/workflows/pass2-p2b-authorization-gate.yml' not in changed
          assert not any('pass3' in path.lower() for path in changed)
          assert not any('crosswalk' in path.lower() for path in changed)
          assert 'pmp-current-map-v12.json' not in changed
          for forbidden in [
            'tools/apply_pass2_p2b_patch.py',
            '.github/workflows/pass2-p2b-patch-publisher.yml',
            'audit/pass2/p2b-draft-scope.md',
            'audit/pass2/p2b-draft-scope.json',
            'audit/pass2/p2b-publication-state.json'
          ]:
              assert not pathlib.Path(forbidden).exists(),forbidden
          assert not list(pathlib.Path('tools').glob('pass2_p2b_patch_payload_*.b64'))
          assert not list(pathlib.Path('tools').glob('__pycache__/*'))
          pathlib.Path('/tmp/pass2-p2b-scope-result.json').write_text(json.dumps({
            'type':'PMP_PASS2_P2B_SCOPE_RESULT_V2','status':'PASS',
            'base_main_commit':os.environ['P2A_MAIN_COMMIT'],
            'changed_paths':sorted(changed),'pass3_started':False,
            'current_map_changed':False,'crosswalk_router_changed':False,
            'staging_files_present':False
          },indent=2)+'\n')
          PY

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node and Python Playwright with Chromium
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check playwright==1.55.0
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run exact-source static gate
        run: |
          set -euo pipefail
          python3 tools/test_pass2_p2b_static.py /tmp/pass2-p2b-static-result.json | tee /tmp/pass2-p2b-static-console.log
          python3 - <<'PY'
          import json,pathlib
          result=json.loads(pathlib.Path('/tmp/pass2-p2b-static-result.json').read_text())
          assert result['status']=='PASS'
          assert result['tests_passed']==16
          assert result['tests_failed']==0
          assert result['registered_actors']==579
          PY
          for file in \
            pmp-pass2-actor-authorization-gate-v1.js \
            pmp-app-orchestrator-v1.js \
            pmp-safe-writer-current-return-fix-v1.js \
            pmp-continuous-run-bank-order-frame-loader-v1.js \
            pmp-authority-rules-v1.js \
            pmp-bug-watch-passive-capture-v1.js; do
              node --check "$file"
          done
          python3 - <<'PY'
          import pathlib,re,subprocess
          for path in [pathlib.Path('pmp-current-inner-cleanbug-rgcontrols-v30-direct-boot-surface-20260708A.html'),pathlib.Path('audit/pass2/p2b-forbidden-action-fixture.html')]:
              for index,source in enumerate(re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',path.read_text('utf-8'),re.S|re.I)):
                  if not source.strip(): continue
                  target=pathlib.Path('/tmp')/(path.name+f'.{index}.js')
                  target.write_text(source,'utf-8')
                  subprocess.run(['node','--check',str(target)],check=True)
          PY

      - name: Verify exact sealed P2-B runtime identities
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,pathlib
          manifest_path=pathlib.Path('pmp-runtime-integrity-manifest-v1.json')
          manifest=json.loads(manifest_path.read_text())
          index={row['path']:row for row in manifest['records']}
          runtime_paths=[
            'pmp-pass2-actor-authorization-gate-v1.js',
            'pmp-pass2-actor-authority-registry-v1.json',
            'pmp-current-inner-cleanbug-rgcontrols-v30-direct-boot-surface-20260708A.html',
            'pmp-app-orchestrator-v1.js',
            'pmp-safe-writer-current-return-fix-v1.js',
            'pmp-continuous-run-bank-order-frame-loader-v1.js',
            'pmp-authority-rules-v1.js',
            'pmp-bug-watch-passive-capture-v1.js'
          ]
          for path in runtime_paths:
              assert path in index,path
              assert hashlib.sha256(pathlib.Path(path).read_bytes()).hexdigest()==index[path]['sha256_hex'],path
          seal=json.loads(pathlib.Path('audit/a003-manifest-seal.json').read_text())
          assert seal['status']=='SEALED'
          assert seal['sealed_branch'].startswith('agent/pass2-')
          assert hashlib.sha256(manifest_path.read_bytes()).hexdigest()==seal['manifest_sha256']
          assert len(manifest['records'])==699
          pathlib.Path('/tmp/pass2-p2b-a003-seal-result.json').write_text(json.dumps({
            'type':'PMP_PASS2_P2B_A003_SEAL_RESULT_V2','status':'PASS',
            'manifest_sha256':seal['manifest_sha256'],
            'runtime_source_set_sha256':seal['runtime_source_set_sha256'],
            'record_count':len(manifest['records']),
            'required_p2b_runtime_records':len(runtime_paths)
          },indent=2)+'\n')
          PY

      - name: Run A-003 repository 21-case gate
        run: |
          set -o pipefail
          python3 tools/test_a003_integrity.py --output /tmp/pass2-p2b-a003-repository-result.json 2>&1 | tee /tmp/pass2-p2b-a003-repository-console.log
          python3 - <<'PY'
          import json,pathlib
          result=json.loads(pathlib.Path('/tmp/pass2-p2b-a003-repository-result.json').read_text())
          assert result.get('tests_passed')==21 and result.get('tests_failed')==0
          PY

      - name: Run A-003 adversarial 47-case Chromium gate
        env:
          A003_RESULT_PATH: /tmp/pass2-p2b-a003-live-result.json
        run: |
          set -o pipefail
          python3 tools/run_a003_live_final.py 2>&1 | tee /tmp/pass2-p2b-a003-live-console.log
          python3 - <<'PY'
          import json,pathlib
          result=json.loads(pathlib.Path('/tmp/pass2-p2b-a003-live-result.json').read_text())
          assert result.get('tests_passed')==47
          assert result.get('tests_failed')==0
          assert result.get('fatal_error') is None
          PY

      - name: Start repository server
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/pass2-p2b-http.log 2>&1 &
          for i in $(seq 1 40); do
            curl -fsS http://127.0.0.1:8000/pmp-current-map-v12.json >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/pass2-p2b-http.log
          exit 1

      - name: Run P2-B pre-effect forbidden-action browser matrix
        env:
          P2B_BASE_URL: http://127.0.0.1:8000/
          P2B_RESULT_PATH: /tmp/pass2-p2b-browser-result.json
        run: |
          set -o pipefail
          python3 tools/run_pass2_p2b_browser.py 2>&1 | tee /tmp/pass2-p2b-browser-console.log
          python3 - <<'PY'
          import json,pathlib
          result=json.loads(pathlib.Path('/tmp/pass2-p2b-browser-result.json').read_text())
          assert result['status']=='PASS'
          assert result['tests_failed']==0
          PY

      - name: Run A-002 reconciled 41-case live matrix
        env:
          A002_BASE_URL: http://127.0.0.1:8000/
          A002_RESULT_PATH: /tmp/pass2-p2b-a002-live-result.json
        run: |
          set -o pipefail
          node audit/a002-live-runtime.cjs 2>&1 | tee /tmp/pass2-p2b-a002-live-console.log
          python3 - <<'PY'
          import json,pathlib
          result=json.loads(pathlib.Path('/tmp/pass2-p2b-a002-live-result.json').read_text())
          assert result.get('tests_passed')==41
          assert result.get('tests_failed')==0
          assert result.get('fatal_error') is None
          PY

      - name: Run Automated Plan preserved-contract and current-app checks
        env:
          PMP_BASE_URL: http://127.0.0.1:8000
        run: |
          set -o pipefail
          python3 tools/verify_automated_plan_foundation_v1.py | tee /tmp/pass2-p2b-automated-plan-foundation.log
          python3 tools/verify_automated_plan_universal_contract_v1.py | tee /tmp/pass2-p2b-automated-plan-contract.log
          python3 tools/verify_automated_plan_visual_match_v1.py | tee /tmp/pass2-p2b-automated-plan-visual.log
          node --check pmp-automated-plan-room-v1.js
          node --check pmp-automated-plan-native-match-v1.js
          node tools/test_automated_plan_real_app_v1.mjs 2>&1 | tee /tmp/pass2-p2b-automated-plan-real-app.log

      - name: Build aggregate and verify receipt when present
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,pathlib,urllib.request
          static=json.loads(pathlib.Path('/tmp/pass2-p2b-static-result.json').read_text())
          browser=json.loads(pathlib.Path('/tmp/pass2-p2b-browser-result.json').read_text())
          repo=json.loads(pathlib.Path('/tmp/pass2-p2b-a003-repository-result.json').read_text())
          live=json.loads(pathlib.Path('/tmp/pass2-p2b-a003-live-result.json').read_text())
          a002=json.loads(pathlib.Path('/tmp/pass2-p2b-a002-live-result.json').read_text())
          seal=json.loads(pathlib.Path('/tmp/pass2-p2b-a003-seal-result.json').read_text())
          assert static['tests_passed']==16 and static['tests_failed']==0
          assert browser['status']=='PASS' and browser['tests_failed']==0
          assert repo['tests_passed']==21 and repo['tests_failed']==0
          assert live['tests_passed']==47 and live['tests_failed']==0
          assert a002['tests_passed']==41 and a002['tests_failed']==0
          receipt_path=pathlib.Path('audit/pass2/p2b-receipt.json')
          receipt_verified=False;receipt_id=None
          if receipt_path.is_file():
              receipt=json.loads(receipt_path.read_text())
              receipt_id=receipt['receipt_id']
              assert receipt['status']=='P2B_COMPLETE_PASS2_IN_PROGRESS'
              assert receipt['base_main_commit']==os.environ['P2A_MAIN_COMMIT']
              assert receipt['results']['registered_actors']==579
              assert receipt['results']['static_gate']=='16/16'
              assert receipt['results']['forbidden_action_browser']=='13/13 aggregate; 14/14 fixture'
              assert receipt['results']['a003_repository']=='21/21'
              assert receipt['results']['a003_adversarial_live']=='47/47'
              assert receipt['results']['a002_live_runtime']=='41/41'
              assert receipt['truth']['pass2_complete'] is False
              assert receipt['truth']['pass3_started'] is False
              req=urllib.request.Request(
                f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{receipt['certification']['run_id']}/artifacts",
                headers={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.urlopen(req) as response: artifacts=json.load(response)['artifacts']
              match=[a for a in artifacts if a['name']=='pass2-p2b-authorization-evidence-v2']
              assert match and match[0]['digest']==receipt['certification']['artifact_digest']
              receipt_verified=True
          aggregate={
            'type':'PMP_PASS2_P2B_AGGREGATE_V2',
            'status':'PASS_WITH_RECEIPT_VERIFIED' if receipt_verified else 'PASS_READY_TO_ISSUE_RECEIPT',
            'overall_project_pass':'Pass 2','phase':'P2-B','p2b_complete':True,
            'pass2_complete':False,'pass3_started':False,
            'verification_commit':os.environ['GITHUB_SHA'],
            'receipt_present':receipt_path.is_file(),'receipt_verified':receipt_verified,'receipt_id':receipt_id,
            'results':{
              'registered_actors':579,'static_gate':'16/16',
              'forbidden_action_browser':'13/13 aggregate; 14/14 fixture',
              'a003_repository':'21/21','a003_adversarial_live':'47/47',
              'a002_live_runtime':'41/41','automated_plan':'PASS',
              'manifest_sha256':seal['manifest_sha256'],
              'runtime_source_set_sha256':seal['runtime_source_set_sha256'],
              'runtime_record_count':seal['record_count']
            },
            'deferred_to_p2c':['P2-B03 Bug Watch append-only receipt history','P2-B04 recurring actor lifecycle'],
            'next_phase':'P2-C — Bug Watch append-only history and recurring actor lifecycle enforcement'
          }
          pathlib.Path('/tmp/pass2-p2b-aggregate.json').write_text(json.dumps(aggregate,indent=2)+'\n')
          print(json.dumps(aggregate,indent=2))
          PY

      - name: Upload complete P2-B evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pass2-p2b-authorization-evidence-v2
          path: |
            /tmp/pass2-p2b-scope-result.json
            /tmp/pass2-p2b-static-result.json
            /tmp/pass2-p2b-static-console.log
            /tmp/pass2-p2b-a003-seal-result.json
            /tmp/pass2-p2b-a003-repository-result.json
            /tmp/pass2-p2b-a003-repository-console.log
            /tmp/pass2-p2b-a003-live-result.json
            /tmp/pass2-p2b-a003-live-console.log
            a003-live-runtime-effective.cjs
            /tmp/pass2-p2b-browser-result.json
            /tmp/pass2-p2b-browser-console.log
            /tmp/pass2-p2b-a002-live-result.json
            /tmp/pass2-p2b-a002-live-console.log
            /tmp/pass2-p2b-automated-plan-foundation.log
            /tmp/pass2-p2b-automated-plan-contract.log
            /tmp/pass2-p2b-automated-plan-visual.log
            /tmp/pass2-p2b-automated-plan-real-app.log
            /tmp/pass2-p2b-aggregate.json
            /tmp/pass2-p2b-http.log
          if-no-files-found: warn
          retention-days: 90

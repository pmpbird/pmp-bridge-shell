name: Pass 2 P2-B Exact-Source Actor Gate V2

on:
  pull_request:
    branches: [main]
    paths:
      - 'pmp-actor-authority-gate-v1.js'
      - 'pmp-actor-authority-policy-v1.json'
      - 'pmp-actor-source-manifest-v1.json'
      - 'audit/pass2/p2b-**'
      - 'audit/pass2/fixtures/p2b-**'
      - 'tools/build_pass2_p2b_policy.py'
      - 'tools/test_pass2_p2b_authority_gate.mjs'
      - '.github/workflows/pass2-p2b-authority-gate-v2.yml'
      - 'pmp-runtime-integrity-manifest-v1.json'
      - 'pmp-app-current.html'
      - 'audit/a003-manifest-seal.json'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: pass2-p2b-v2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  P2A_MAIN_COMMIT: c767844d53b4b393928170387b6f988e49fe1fc6
  P2A_RECEIPT_ID: PMP-APP-ORCH-PASS2-P2A-E7BA1B93-PASS-001
  GH_TOKEN: ${{ github.token }}

jobs:
  certify-p2b:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify P2-B scope and lineage
        run: |
          set -euo pipefail
          test "$(git rev-parse origin/main)" = "$P2A_MAIN_COMMIT"
          git merge-base --is-ancestor "$P2A_MAIN_COMMIT" HEAD
          python3 - <<'PY'
          import json,os,pathlib,subprocess
          p2a=json.loads(pathlib.Path('audit/pass2/p2a-receipt.json').read_text())
          assert p2a['receipt_id']==os.environ['P2A_RECEIPT_ID']
          assert p2a['status']=='P2A_COMPLETE_PASS2_IN_PROGRESS'
          scope=json.loads(pathlib.Path('audit/pass2/p2b-scope-lock.json').read_text())
          assert scope['status']=='P2B_IN_PROGRESS'
          assert scope['truth_boundary']['active_chain_integration_in_this_phase'] is False
          allowed=set(scope['allowed_changes'])
          changed=set(subprocess.check_output(['git','diff','--name-only',os.environ['P2A_MAIN_COMMIT'],'HEAD'],text=True).splitlines())
          assert changed <= allowed, sorted(changed-allowed)
          required={
            'pmp-actor-authority-gate-v1.js','pmp-actor-authority-policy-v1.json','pmp-actor-source-manifest-v1.json',
            'audit/pass2/p2b-scope-lock.json','audit/pass2/p2b-status.md',
            'audit/pass2/fixtures/p2b-authority-gate-adversarial.html',
            'audit/pass2/fixtures/p2b-known-storage-actor.js','audit/pass2/fixtures/p2b-known-dom-actor.js',
            'audit/pass2/fixtures/p2b-known-limited-actor.js','audit/pass2/fixtures/p2b-known-async-actor.js',
            'audit/pass2/fixtures/p2b-unknown-actor.js','tools/build_pass2_p2b_policy.py',
            'tools/test_pass2_p2b_authority_gate.mjs','.github/workflows/pass2-p2b-authority-gate-v2.yml'
          }
          assert required <= changed, sorted(required-changed)
          runtime_html=[p.as_posix() for p in pathlib.Path('.').glob('*.html') if 'pmp-actor-authority-gate-v1.js' in p.read_text('utf-8',errors='ignore')]
          assert runtime_html==[], runtime_html
          pathlib.Path('/tmp/p2b-scope.json').write_text(json.dumps({'status':'PASS','changed_paths':sorted(changed),'active_chain_integrated':False,'pass2_complete':False,'pass3_started':False},indent=2)+'\n')
          PY

      - name: Set up Python and Node
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify deterministic policy, source manifest, and syntax
        run: |
          set -euo pipefail
          python3 tools/build_pass2_p2b_policy.py --root . --output /tmp/p2b-policy.json --manifest-output /tmp/p2b-source-manifest.json
          cmp /tmp/p2b-policy.json pmp-actor-authority-policy-v1.json
          cmp /tmp/p2b-source-manifest.json pmp-actor-source-manifest-v1.json
          python3 -m json.tool pmp-actor-authority-policy-v1.json >/dev/null
          python3 -m json.tool pmp-actor-source-manifest-v1.json >/dev/null
          node --check pmp-actor-authority-gate-v1.js
          node --check tools/test_pass2_p2b_authority_gate.mjs
          python3 - <<'PY'
          import json,pathlib
          policy=json.loads(pathlib.Path('pmp-actor-authority-policy-v1.json').read_text())
          manifest=json.loads(pathlib.Path('pmp-actor-source-manifest-v1.json').read_text())
          assert policy['source_manifest']=='pmp-actor-source-manifest-v1.json'
          assert policy['unknown_actor_policy']=='BLOCK_BEFORE_SIDE_EFFECT'
          assert policy['unauthorized_capability_policy']=='BLOCK_BEFORE_SIDE_EFFECT'
          assert len(policy['actors'])==4 and manifest['record_count']==4
          p={a['path']:a['sha256'] for a in policy['actors']};m={r['path']:r['sha256_hex'] for r in manifest['records']}
          assert p==m
          assert policy['pass2_complete'] is False and policy['pass3_started'] is False
          pathlib.Path('/tmp/p2b-static.json').write_text(json.dumps({'status':'PASS','policy_manifest_exact_agreement':True,'actors':4},indent=2)+'\n')
          PY

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start repository server
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/p2b-http.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/pmp-actor-authority-policy-v1.json >/dev/null && exit 0; sleep 1; done
          cat /tmp/p2b-http.log; exit 1

      - name: Run 41-check adversarial no-side-effect matrix
        env:
          P2B_BASE_URL: http://127.0.0.1:8000
          P2B_RESULT_PATH: /tmp/p2b-adversarial.json
        run: |
          set -o pipefail
          node tools/test_pass2_p2b_authority_gate.mjs 2>&1 | tee /tmp/p2b-adversarial-console.log
          python3 - <<'PY'
          import json,pathlib
          r=json.loads(pathlib.Path('/tmp/p2b-adversarial.json').read_text())
          assert r['status']=='PASS',r
          assert r['tests_total']==41,(r['tests_total'],[x for x in r['tests'] if not x['pass']])
          assert r['tests_passed']==41 and r['tests_failed']==0
          assert r['side_effect_probe_requests']==0
          required={
            'independent exact source manifest loaded','unknown source path blocked before authorization','unknown source code never executed',
            'known path with changed bytes blocked','unknown actor storage blocked before write','known actor unauthorized storage blocked before write',
            'unauthorized storage delete blocked','unknown actor DOM append blocked','known actor unauthorized DOM append blocked',
            'unauthorized DOM delete blocked','unauthorized script injection blocked before append','unauthorized resource target change blocked',
            'unauthorized history navigation blocked','unauthorized network fetch blocked before request','unauthorized IndexedDB open blocked before request',
            'unauthorized IndexedDB delete blocked before request','unauthorized cache open blocked before request','unauthorized cache delete blocked before request',
            'unauthorized timer blocked before scheduling','unauthorized event listener blocked before registration','unauthorized storage clear blocked',
            'unauthorized document.write blocked','authorized timer preserves actor identity into callback','blocked fetch produced zero network requests'
          }
          rows={x['name']:x for x in r['tests']};assert required<=set(rows),sorted(required-set(rows));assert all(rows[x]['pass'] for x in required)
          PY

      - name: Build deterministic A-003 reseal candidate
        id: reseal
        run: |
          set -euo pipefail
          python3 tools/build_a003_integrity_manifest.py --output /tmp/p2b-manifest.json --report /tmp/p2b-probe.json > /tmp/p2b-probe-console.log
          python3 - <<'PY'
          import hashlib,json,pathlib,re,subprocess
          p=pathlib.Path('/tmp/p2b-manifest.json');m=json.loads(p.read_text())
          m.pop('source_commit',None);m.pop('self_digest_for_generated_bytes',None)
          identity={'records':[(r['path'],r['sha256_hex']) for r in m.get('records',[])],'historical_records':[(r['path'],r.get('repository_ref'),r['sha256_hex']) for r in m.get('historical_records',[])],'external_records':[(r['url'],r['sha256_hex']) for r in m.get('external_records',[])],'root_trust_anchors':m.get('root_trust_anchors',[]),'policy':{'algorithm':m.get('algorithm'),'unlisted_executable_policy':m.get('unlisted_executable_policy'),'network_policy':m.get('network_policy')}}
          m['version']='20260711A-A003-FINAL';m['runtime_source_set_sha256']=hashlib.sha256(json.dumps(identity,sort_keys=True,separators=(',',':')).encode()).hexdigest();m['source_identity_rule']='Deterministic digest of protected local, historical, external, root-anchor, and policy identities; audit/workflow-only commits do not alter this identity.'
          p.write_text(json.dumps(m,indent=2,sort_keys=True)+'\n');b=p.read_bytes();digest=hashlib.sha256(b).hexdigest()
          root=pathlib.Path('pmp-app-current.html').read_text();updated,count=re.subn(r"const MANIFEST_SHA256='(?:__A003_MANIFEST_SHA256__|[0-9a-f]{64})';",f"const MANIFEST_SHA256='{digest}';",root,count=1);assert count==1
          pathlib.Path('/tmp/p2b-app-current.html').write_text(updated)
          seal={'type':'PMP_A003_MANIFEST_SEAL_V1','repair_id':'A-003','status':'SEALED','manifest_path':'pmp-runtime-integrity-manifest-v1.json','manifest_sha256':digest,'manifest_bytes':len(b),'manifest_version':'20260711A-A003-FINAL','runtime_source_set_sha256':m['runtime_source_set_sha256'],'root_trust_anchor':'pmp-app-current.html','root_self_verifiable':False,'sealed_branch':'agent/pass2-p2b-authority-gate','rule':'The root trust anchor cannot verify its own pre-execution bytes; it carries the exact digest for the deterministic protected runtime source set.','pass2_context':'P2-B gate, policy, and independent actor-source manifest added; gate remains inactive on the live chain.'}
          pathlib.Path('/tmp/p2b-seal.json').write_text(json.dumps(seal,indent=2,sort_keys=True)+'\n')
          committed=lambda path:subprocess.check_output(['git','show','HEAD:'+path])
          ready=committed('pmp-runtime-integrity-manifest-v1.json')==b and committed('pmp-app-current.html')==updated.encode() and committed('audit/a003-manifest-seal.json')==pathlib.Path('/tmp/p2b-seal.json').read_bytes()
          paths={r['path'] for r in m['records']};assert {'pmp-actor-authority-gate-v1.js','pmp-actor-authority-policy-v1.json','pmp-actor-source-manifest-v1.json'}<=paths
          state={'status':'READY' if ready else 'PENDING_RESEAL','manifest_sha256':digest,'runtime_source_set_sha256':m['runtime_source_set_sha256'],'runtime_records':m['counts']['runtime_records'],'gate_policy_source_manifest_present':True}
          pathlib.Path('/tmp/p2b-reseal-state.json').write_text(json.dumps(state,indent=2)+'\n');pathlib.Path('/tmp/p2b-output.txt').write_text('ready='+str(ready).lower()+'\n');print(json.dumps(state,indent=2))
          PY
          cat /tmp/p2b-output.txt >> "$GITHUB_OUTPUT"

      - name: Run A-003 repository regression
        if: steps.reseal.outputs.ready == 'true'
        run: |
          python3 tools/test_a003_integrity.py --output /tmp/p2b-a003-repo.json > /tmp/p2b-a003-repo-console.log
          python3 - <<'PY'
          import json,pathlib;r=json.loads(pathlib.Path('/tmp/p2b-a003-repo.json').read_text());assert r['tests_passed']==21 and r['tests_failed']==0
          PY

      - name: Run A-003 adversarial regression
        if: steps.reseal.outputs.ready == 'true'
        env:
          A003_RESULT_PATH: /tmp/p2b-a003-live.json
        run: |
          python3 tools/run_a003_live_final.py > /tmp/p2b-a003-live-console.log
          python3 - <<'PY'
          import json,pathlib;r=json.loads(pathlib.Path('/tmp/p2b-a003-live.json').read_text());assert r['tests_passed']==47 and r['tests_failed']==0 and r.get('fatal_error') is None
          PY

      - name: Run A-002 live routing regression
        if: steps.reseal.outputs.ready == 'true'
        env:
          A002_BASE_URL: http://127.0.0.1:8000/
          A002_RESULT_PATH: /tmp/p2b-a002-live.json
        run: |
          node audit/a002-live-runtime.cjs > /tmp/p2b-a002-live-console.log
          python3 - <<'PY'
          import json,pathlib;r=json.loads(pathlib.Path('/tmp/p2b-a002-live.json').read_text());assert r['tests_passed']==41 and r['tests_failed']==0 and r.get('fatal_error') is None
          PY

      - name: Build aggregate and verify receipt when present
        run: |
          python3 - <<'PY'
          import json,os,pathlib,urllib.request
          state=json.loads(pathlib.Path('/tmp/p2b-reseal-state.json').read_text());adv=json.loads(pathlib.Path('/tmp/p2b-adversarial.json').read_text());ready=state['status']=='READY'
          receipt_path=pathlib.Path('audit/pass2/p2b-receipt.json');verified=False;rid=None
          if receipt_path.is_file():
            assert ready;receipt=json.loads(receipt_path.read_text());rid=receipt['receipt_id'];assert receipt['status']=='P2B_COMPLETE_PASS2_IN_PROGRESS';assert receipt['results']['adversarial_browser']=='41/41';assert receipt['results']['a003_repository']=='21/21';assert receipt['results']['a003_adversarial_live']=='47/47';assert receipt['results']['a002_live_runtime']=='41/41';assert receipt['truth']['active_chain_integrated'] is False;assert receipt['truth']['pass2_complete'] is False and receipt['truth']['pass3_started'] is False
            req=urllib.request.Request(f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{receipt['certification']['run_id']}/artifacts",headers={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
            with urllib.request.urlopen(req) as response:arts=json.load(response)['artifacts']
            match=[a for a in arts if a['name']=='pass2-p2b-authority-gate-v2-evidence'];assert match and match[0]['digest']==receipt['certification']['artifact_digest'];verified=True
          aggregate={'type':'PMP_PASS2_P2B_AGGREGATE_V2','status':'PASS_WITH_RECEIPT_VERIFIED' if verified else ('PASS_READY_TO_ISSUE_RECEIPT' if ready else 'PASS_READY_FOR_A003_RESEAL'),'p2b_complete':ready,'pass2_complete':False,'pass3_started':False,'active_chain_integrated':False,'adversarial_browser':f"{adv['tests_passed']}/{adv['tests_total']}",'a003_reseal':state,'receipt_verified':verified,'receipt_id':rid,'next_phase':'P2-C — active runtime integration and exact active actor policy'}
          pathlib.Path('/tmp/p2b-aggregate.json').write_text(json.dumps(aggregate,indent=2)+'\n');print(json.dumps(aggregate,indent=2))
          PY

      - name: Upload complete P2-B evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pass2-p2b-authority-gate-v2-evidence
          path: |
            /tmp/p2b-scope.json
            /tmp/p2b-static.json
            /tmp/p2b-adversarial.json
            /tmp/p2b-adversarial-console.log
            /tmp/p2b-http.log
            /tmp/p2b-manifest.json
            /tmp/p2b-app-current.html
            /tmp/p2b-seal.json
            /tmp/p2b-probe.json
            /tmp/p2b-probe-console.log
            /tmp/p2b-reseal-state.json
            /tmp/p2b-a003-repo.json
            /tmp/p2b-a003-repo-console.log
            /tmp/p2b-a003-live.json
            /tmp/p2b-a003-live-console.log
            /tmp/p2b-a002-live.json
            /tmp/p2b-a002-live-console.log
            /tmp/p2b-aggregate.json
          if-no-files-found: warn
          retention-days: 90

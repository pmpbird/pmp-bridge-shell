name: Packet 015 scalable pass 002 discovery

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inspect authoritative Pass 002 window
        id: discover
        shell: bash
        run: |
          set +e
          python3 tools/inspect_packet_01_5_scalable_pass_002_v1.py > pass-002-discovery.log 2>&1
          code=$?
          cat pass-002-discovery.log
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: packet-015-scalable-pass-002-discovery
          path: |
            pass-002-discovery.log
            audit/Packet_01.5_Scalable_Pass_002_Discovery_v1.json
          if-no-files-found: warn
      - name: Preserve discovery result
        run: exit "${{ steps.discover.outputs.exit_code }}"

name: Pass 10 Unit 4 Bank Owner Projection Refresh
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/pass10-unit3-bank-readonly-projection-v1.yml'
      - '.github/workflows/pass10-unit4-bank-owner-projection-refresh-v1.yml'
      - 'audit/a003-manifest-seal.json'
      - 'audit/pass10/pass10-bank-unit4-owner-projection-refresh-v1.json'
      - 'audit/pass10/receipts/RECEIPT_P10_U4_BANK_OWNER_PROJECTION_REFRESH_20260726T230500Z_001.json'
      - 'pmp-app-current.html'
      - 'pmp-bank-owner-projection-refresh-v1.js'
      - 'pmp-current-inner-cleanbug-rgcontrols-v23.html'
      - 'pmp-master-bank-tab-v1.js'
      - 'pmp-mount-registry-v1.js'
      - 'pmp-runtime-integrity-manifest-v1.json'
      - 'tools/generate_pass10_unit4_integrity_updates_v1.py'
      - 'tools/test_pass10_unit4_bank_owner_projection_refresh_v1.js'
      - 'tools/verify_pass10_unit4_bank_owner_projection_refresh_v1.py'
permissions:
  contents: read
jobs:
  bank-owner-projection-refresh:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      ARTIFACT_ROOT: /tmp/pass10-unit4-artifacts/artifacts/attempt-001
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - id: evaluate
        name: Verify owner refresh and preserve complete attempt
        shell: bash
        run: |
          set +e
          mkdir -p "$ARTIFACT_ROOT"
          printf '%s\n' '{"command":"P10-U4 exact Bank-owner receipt, one projection refresh, denial matrix, cached Bank rendering, no-mutation, and integrity-reseal proof"}' > "$ARTIFACT_ROOT/command.json"
          printf '%s\n' 'no stderr emitted before execution' > "$ARTIFACT_ROOT/stderr.txt"
          node tools/test_pass10_unit4_bank_owner_projection_refresh_v1.js > "$ARTIFACT_ROOT/stdout.txt" 2>> "$ARTIFACT_ROOT/stderr.txt"
          tests_rc=$?
          verify_rc=0
          if git diff --name-only "${{ github.event.pull_request.base.sha }}...HEAD" | grep -qx 'audit/pass10/pass10-bank-unit4-owner-projection-refresh-v1.json'; then
            python3 tools/verify_pass10_unit4_bank_owner_projection_refresh_v1.py "bfba6e36272cb98ffe1e2b28b8d881be4e537304" >> "$ARTIFACT_ROOT/stdout.txt" 2>> "$ARTIFACT_ROOT/stderr.txt"
            verify_rc=$?
          else
            printf '%s\n' 'P10-U4 historical exact-scope verifier not applicable; 121-assertion runtime regression executed.' >> "$ARTIFACT_ROOT/stdout.txt"
          fi
          git diff --name-only "${{ github.event.pull_request.base.sha }}...HEAD" | python3 -c 'import json,sys; print(json.dumps({"changed_paths":[x.strip() for x in sys.stdin if x.strip()]},sort_keys=True))' > "$ARTIFACT_ROOT/scope.json"
          python3 -c 'import json,os,platform; print(json.dumps({"python":platform.python_version(),"node":os.popen("node --version").read().strip(),"runner":os.environ.get("RUNNER_OS"),"sha":os.environ.get("GITHUB_SHA")},sort_keys=True))' > "$ARTIFACT_ROOT/environment.json"
          python3 -c 'import json,pathlib; r=json.loads(pathlib.Path("audit/pass10/pass10-bank-unit4-owner-projection-refresh-v1.json").read_text()); print(json.dumps({"status":r["status"],"integration":r["integration"],"runtime_integrity":r["runtime_integrity"],"effects":r["effects"],"next_step":r["next_step"]},indent=2,sort_keys=True))' > "$ARTIFACT_ROOT/result.json"
          printf '%s\n' '{"required":false,"granted":false,"consumed_before":false,"consumed_after":false}' > "$ARTIFACT_ROOT/authority-state.json"
          rc=0
          if [ "$tests_rc" -ne 0 ] || [ "$verify_rc" -ne 0 ]; then rc=1; fi
          printf '{"tests":%s,"verify":%s,"final":%s}\n' "$tests_rc" "$verify_rc" "$rc" > "$ARTIFACT_ROOT/exit-status.json"
          python3 - "$ARTIFACT_ROOT" <<'PY'
          import hashlib,json,pathlib,sys
          root=pathlib.Path(sys.argv[1]); rows=[]
          for path in sorted(root.iterdir()):
              if path.name=="artifact-manifest.json" or not path.is_file(): continue
              data=path.read_bytes(); rows.append({"path":path.name,"bytes":len(data),"sha256":hashlib.sha256(data).hexdigest()})
          assert len(rows)==8 and all(row["bytes"]>0 for row in rows)
          (root/"artifact-manifest.json").write_text(json.dumps({"type":"PMP_P10_U4_ARTIFACT_MANIFEST_V1","records":rows},indent=2,sort_keys=True)+"\n")
          PY
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload complete P10-U4 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pass10-unit4-bank-owner-projection-refresh-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/pass10-unit4-artifacts/
          if-no-files-found: error
          retention-days: 90
      - name: Enforce preserved result after upload
        run: test "${{ steps.evaluate.outputs.exit_code }}" = "0"

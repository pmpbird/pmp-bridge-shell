name: PMP Vault Record Ledger Latest Only

on:
  issue_comment:
    types: [created, edited]
  workflow_run:
    workflows: ["PMP Vault Inbox Processor"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pmp-vault-record-ledger-latest-only
  cancel-in-progress: false

jobs:
  compact-record-ledger:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_run' || github.event.issue.number == 1
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Keep latest ledger record only when semantic content changes
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const ledgerPath = 'pmp-lossless-inventory-vault/record-ledger.json';
            function writeJson(filePath, data) {
              fs.mkdirSync(path.dirname(filePath), { recursive: true });
              fs.writeFileSync(filePath, JSON.stringify(data, null, 2) + '\n');
            }
            function readJson(filePath) {
              return JSON.parse(fs.readFileSync(filePath, 'utf8'));
            }
            function canonical(data) { return JSON.stringify(data); }
            if (!fs.existsSync(ledgerPath)) {
              core.info('No record-ledger.json found.');
              return;
            }
            const ledger = readJson(ledgerPath);
            const records = Array.isArray(ledger.records) ? ledger.records : [];
            const latest = ledger.latest_record || records[records.length - 1] || null;
            const processed = ledger.total_records_processed || records.length || (latest ? 1 : 0);
            const semantic = {
              type: ledger.type || 'PMP_VAULT_RECORD_LEDGER',
              version: '3.0.0-latest-only-compacted',
              purpose: 'Latest compact record only. Older ledger entries are kept only by Git history.',
              storage_area_name: ledger.storage_area_name || 'PMP Lossless Inventory Vault',
              storage_policy: {
                rewrite_latest_only: true,
                visible_records_kept: latest ? 1 : 0,
                prior_versions_kept_by_git_history: true,
                visible_file_tree_stays_small: true
              },
              total_records_processed: processed,
              latest_record: latest,
              records: latest ? [latest] : []
            };
            const existingSemantic = { ...ledger };
            delete existingSemantic.updated_at;
            if (canonical(existingSemantic) === canonical(semantic)) {
              core.info('record-ledger.json is already semantically compact; preserving sealed bytes and skipping commit.');
              return;
            }
            const compact = {
              ...semantic,
              updated_at: (latest && (latest.report_built_at || latest.packet_built_at)) || new Date().toISOString()
            };
            writeJson(ledgerPath, compact);
            const status = await exec.getExecOutput('git', ['status', '--porcelain', ledgerPath]);
            if (!status.stdout.trim()) {
              core.info('record-ledger.json already compact.');
              return;
            }
            await exec.exec('git', ['config', 'user.name', 'github-actions[bot]']);
            await exec.exec('git', ['config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com']);
            await exec.exec('git', ['add', ledgerPath]);
            await exec.exec('git', ['commit', '-m', 'Compact PMP vault record ledger latest only']);
            try { await exec.exec('git', ['push']); }
            catch (error) {
              await exec.exec('git', ['pull', '--rebase']);
              await exec.exec('git', ['push']);
            }

name: Pass 2 A-002 Native MessagePort Rehearsal 088

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read

jobs:
  a002-native-messageport-rehearsal-088:
    if: github.event.action == 'opened' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    env:
      SOURCE_COMMIT: 98b2e293717b81289e3b372d1fff8f5832d29fd6
      AUDIT_DIR: audit/pass2/p2c-isolated-proof-rerun-008
      DEPS_DIR: audit/pass2/p2c-isolated-proof-rerun-006
      REPAIR_DIR: audit/pass2/p2c-isolated-proof-rerun-006/repair-continuation-003
      BUNDLE_DIR: /tmp/p2c-rehearsal088-runner
      BUNDLE_TAR: /tmp/p2c-rehearsal088.tar.gz
      BASELINE_ROOT: /tmp/p2c-rehearsal088-baseline
      ACTIVE_ROOT: /tmp/p2c-rehearsal088-active
      EVIDENCE_DIR: /tmp/p2c-rehearsal088-evidence
      NORMALIZED_ROOT: /tmp/p2c-rehearsal088-normalized
      NODE_HOME: /tmp/p2c-rehearsal088-node
      P2C_REHEARSAL_SKIP_AUTHORIZATION: '1'
      EVENT_ACTION: ${{ github.event.action }}
      RUN_ATTEMPT: ${{ github.run_attempt }}
      HEAD_SHA: ${{ github.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      RUN_ID: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Run bounded guardian readiness static tests
        run: python3 audit/pass2/p2c-post-failure-guardian-readiness-001/test_guardian_readiness_diagnostics_001.py
      - name: Verify Repair Unit 2 scope and preserved proof boundary
        run: >-
          python3 audit/pass2/p2c-post-failure-guardian-readiness-001/verify_guardian_readiness_unit_001.py
          --base-sha "$BASE_SHA"
          --head-sha "$PR_HEAD_SHA"
          --evidence-dir "$EVIDENCE_DIR"
      - name: Execute disposable active and restored rehearsal
        env:
          A003_GUARDIAN_EVIDENCE_PATH: /tmp/p2c-rehearsal088-evidence/a003-guardian-readiness-evidence.json
        run: bash "$AUDIT_DIR/rerun008-controller-main-rehearsal088.sh"
      - name: Upload complete rehearsal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2c-a002-native-messageport-rehearsal-088
          path: /tmp/p2c-rehearsal088-evidence

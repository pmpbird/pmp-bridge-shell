name: Pass 2 A-002 Native MessagePort Rehearsal 088

on:
  pull_request:
    types: [opened]

permissions:
  contents: read

jobs:
  a002-native-messageport-rehearsal-088:
    if: github.event.action == 'opened' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    env:
      SOURCE_COMMIT: 98b2e293717b81289e3b372d1fff8f5832d29fd6
      AUDIT_DIR: audit/pass2/p2c-isolated-proof-rerun-008
      DEPS_DIR: audit/pass2/p2c-isolated-proof-rerun-006
      REPAIR_DIR: audit/pass2/p2c-isolated-proof-rerun-006/repair-continuation-003
      BUNDLE_DIR: /tmp/p2c-rehearsal088-runner
      BUNDLE_TAR: /tmp/p2c-rehearsal088.tar.gz
      BASELINE_ROOT: /tmp/p2c-rehearsal088-baseline
      ACTIVE_ROOT: /tmp/p2c-rehearsal088-active
      EVIDENCE_DIR: /tmp/p2c-rehearsal088-evidence
      NORMALIZED_ROOT: /tmp/p2c-rehearsal088-normalized
      NODE_HOME: /tmp/p2c-rehearsal088-node
      P2C_REHEARSAL_SKIP_AUTHORIZATION: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Execute disposable active and restored rehearsal
        run: bash "$AUDIT_DIR/rerun008-controller-main-rehearsal088.sh"
      - name: Upload complete rehearsal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2c-a002-native-messageport-rehearsal-088
          path: /tmp/p2c-rehearsal088-evidence

name: Packet 01.5 Pass 002 closure bootstrap

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: packet01-5-pass002-closure-v1
      - name: Build deterministic closure artifacts
        run: python3 tools/build_packet_01_5_pass_002_closure_v1.py
      - name: Write independent closure receipt
        run: python3 tools/verify_packet_01_5_pass_002_closure_v1.py --write-receipt
      - name: Verify closure independently
        run: python3 tools/verify_packet_01_5_pass_002_closure_v1.py
      - name: Commit verified closure outputs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit/Packet_01.5_Pass_002_Closure_Manifest_v1.json
          git add audit/Packet_01.5_Pass_002_Closure_Coverage_v1.json
          git add audit/Packet_01.5_Pass_002_Closure_Independent_Verification_v1.json
          git add audit/Packet_01.5_Pass_002_Closure_Status_v1.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Commit verified Packet 01.5 Pass 002 closure artifacts"
          git push origin HEAD:packet01-5-pass002-closure-v1
      - name: Confirm clean working tree
        run: git diff --exit-code

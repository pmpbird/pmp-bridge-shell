name: Packet 01.5 discovery integrity audit

on:
  push:
    paths:
      - "audit/Packet_01.5_Discovery_Working_Register_v1.md"
      - "audit/Packet_01.5_Discovery_Pass_*.md"
      - "tools/audit_packet_01_5_discovery.py"
      - ".github/workflows/packet_01_5_integrity_audit.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run integrity audit
        run: python3 tools/audit_packet_01_5_discovery.py

      - name: Commit audit outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit/Packet_01.5_Discovery_Integrity_Audit_v1.md audit/Packet_01.5_Discovery_Integrity_Audit_v1.json
          if git diff --cached --quiet; then
            echo "No audit-output changes."
          else
            git commit -m "Generate Packet 01.5 discovery integrity audit"
            git push
          fi

name: Packet 01.5 applicability Batch 001

on:
  push:
    paths:
      - "audit/routing-batches/Packet_01.5_Applicability_Batch_001_Plan_v1.json"
      - "tools/apply_packet_01_5_applicability_batch_001.py"
      - "tools/verify_packet_01_5_applicability_batch_001.py"
      - ".github/workflows/packet_01_5_applicability_batch_001.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Batch 001 transaction
        run: python3 tools/apply_packet_01_5_applicability_batch_001.py

      - name: Independently verify Batch 001
        run: python3 tools/verify_packet_01_5_applicability_batch_001.py

      - name: Commit accepted Batch 001 outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            audit/routing-inventory/Packet_01.5_Applicability_Inventory_v2_Batch_001.jsonl \
            audit/routing-inventory/Packet_01.5_Applicability_Inventory_v2_Batch_001.jsonl.gz \
            audit/routing-inventory/Packet_01.5_Applicability_Inventory_v2_Batch_001.manifest.json \
            audit/routing-batches/Packet_01.5_Applicability_Batch_001_Build_v1.md \
            audit/routing-batches/Packet_01.5_Applicability_Batch_001_Build_v1.json \
            audit/routing-batches/Packet_01.5_Applicability_Batch_001_Independent_Verification_v1.md \
            audit/routing-batches/Packet_01.5_Applicability_Batch_001_Independent_Verification_v1.json \
            audit/Packet_01.5_Applicability_Classification_Status_v77.md
          if git diff --cached --quiet; then
            echo "No Batch 001 output changes."
          else
            git commit -m "Apply and verify Packet 01.5 Applicability Batch 001"
            git push
          fi

name: PR 35 hardening apply

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/pr35_hardening_apply.yml'

permissions:
  contents: read

concurrency:
  group: pr35-hardening-apply
  cancel-in-progress: true

jobs:
  verify-apply-and-export:
    if: github.repository == 'pmpbird/pmp-bridge-shell' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'automated-plan-controller-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automated-plan-controller-v1
          fetch-depth: 0
          persist-credentials: false

      - name: Confirm exact branch head
        run: |
          set -euo pipefail
          git fetch origin automated-plan-controller-v1 --quiet
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/automated-plan-controller-v1)"

      - name: Verify, unpack, and repair hardening payload
        run: |
          set -euo pipefail
          cat > /tmp/pr35-chunks.sha256 <<'EOF'
          26d15596cfbbf3f6e64722fd8fc926c24a3582f527fd45b8a2ef1c21b186993a  .pr35-hardening/chunk00
          b72c84efcda62355d9db2727e4a56cf2fc4ab692d1b8f6d24c5d814859a5aa22  .pr35-hardening/chunk01
          d2146dd40031a99d61c2fa7acc3d22b1cb7c887e27bb0c6c85f05df7d6d0f0f4  .pr35-hardening/chunk02
          12489623ab11da6b4310da7a61ea6e2b38123bdc4d718d169b62da5f087ab2f2  .pr35-hardening/chunk03
          c34a3b34593c70044ef3346412b77df7bbce3fd9b7d082c72d601541494ff6e5  .pr35-hardening/chunk04
          192e842427219b910c4d25d6ddf67302647f880e66a3e2bf6e15fc5288f52b75  .pr35-hardening/chunk05
          122e784ec69446970e9d0696e17ef14b9f1511cec7dba74084757dae67be785f  .pr35-hardening/chunk06
          54d644f962022cd5e13e7cf7916f57fc72591ae3cdf408ec3c189e20c6af4211  .pr35-hardening/chunk07
          EOF
          sha256sum -c /tmp/pr35-chunks.sha256
          cat .pr35-hardening/chunk{00..07} | base64 --decode > /tmp/pr35-hardening.tgz
          echo '2fb25e457b8f8223cfe73baab074dce045c2925b68635f89d5228baa82bdac28  /tmp/pr35-hardening.tgz' | sha256sum -c -
          python3 - <<'PY'
          import pathlib, tarfile
          expected = {
              '.github/workflows/automated_plan_controller.yml',
              '.github/workflows/automated_plan_controller_ci.yml',
              '.github/workflows/packet_015_pass_002_dependency_platform_family.yml',
              '.github/workflows/packet_015_pass_002_other_record_specific_proof_family.yml',
              '.github/workflows/packet_015_pass_002_private_uncaptured_family.yml',
              '.github/workflows/packet_015_scalable_pass_002.yml',
              '.github/workflows/packet_015_pass_002_deployment_live_family.yml',
              '.github/workflows/packet_015_master_consolidation_v2.yml',
              '.github/workflows/packet_015_pass_002_current_runtime_family.yml',
              '.github/workflows/packet_015_pass_002_authoritative_packet_law_family.yml',
              '.github/workflows/packet_01_5_pass_002_closure.yml',
              '.github/workflows/packet_015_pass_002_cross_source_conflict_family.yml',
              'audit/Automated_Plan_Controller_Status_v1.md',
              'automation/controller/v1/controller-contract.json',
              'automation/controller/v1/controller.py',
              'automation/engine/v1/engine-policy.json',
              'automation/state/controller-status.json',
              'pmp-automated-plan-room-v1.js',
              'tools/test_automated_plan_controller_v1.py',
              'tools/test_automated_plan_controller_errors_v1.py',
              'tools/test_automated_plan_controller_container_v1.py',
              'tools/test_automated_plan_controller_workflow_v1.py',
              'tools/verify_automated_plan_controller_v1.py',
          }
          with tarfile.open('/tmp/pr35-hardening.tgz', 'r:gz') as archive:
              names = {member.name for member in archive.getmembers() if member.isfile()}
              if names != expected:
                  raise SystemExit(f'payload file set mismatch: {sorted(names ^ expected)}')
              for member in archive.getmembers():
                  path = pathlib.PurePosixPath(member.name)
                  if path.is_absolute() or '..' in path.parts or not member.isfile():
                      raise SystemExit(f'unsafe archive member: {member.name}')
          PY
          tar -xzf /tmp/pr35-hardening.tgz -C .
          python3 - <<'PY'
          from pathlib import Path
          path=Path('automation/controller/v1/controller.py')
          text=path.read_text()
          old='--mount", f"type=bind,src={workspace},dst=/workspace,rw",'
          new='--mount", f"type=bind,src={workspace},dst=/workspace",'
          if text.count(old) != 1:
              raise SystemExit('expected one Docker bind mount syntax to repair')
          path.write_text(text.replace(old,new))
          PY
          rm -rf .pr35-hardening .github/workflows/pr35_hardening_apply.yml

      - name: Run controller syntax and behavior tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          python3 -m py_compile \
            automation/controller/v1/controller.py \
            tools/test_automated_plan_controller_v1.py \
            tools/test_automated_plan_controller_errors_v1.py \
            tools/test_automated_plan_controller_container_v1.py \
            tools/test_automated_plan_controller_workflow_v1.py \
            tools/verify_automated_plan_controller_v1.py
          python3 tools/test_automated_plan_controller_v1.py
          python3 tools/test_automated_plan_controller_errors_v1.py
          python3 tools/verify_automated_plan_controller_v1.py
          python3 tools/test_automated_plan_controller_workflow_v1.py
          node --check pmp-automated-plan-room-v1.js

      - name: Run real container adversarial tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          docker pull python:3.13-slim
          python3 tools/test_automated_plan_controller_container_v1.py

      - name: Enforce exact hardening change boundary
        run: |
          set -euo pipefail
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          git diff --exit-code -- automation/state/active-plan.json automation/plans/packet-01-5.v1.json
          git add -A
          python3 - <<'PY'
          import subprocess
          payload = {
              '.github/workflows/automated_plan_controller.yml',
              '.github/workflows/automated_plan_controller_ci.yml',
              '.github/workflows/packet_015_pass_002_dependency_platform_family.yml',
              '.github/workflows/packet_015_pass_002_other_record_specific_proof_family.yml',
              '.github/workflows/packet_015_pass_002_private_uncaptured_family.yml',
              '.github/workflows/packet_015_scalable_pass_002.yml',
              '.github/workflows/packet_015_pass_002_deployment_live_family.yml',
              '.github/workflows/packet_015_master_consolidation_v2.yml',
              '.github/workflows/packet_015_pass_002_current_runtime_family.yml',
              '.github/workflows/packet_015_pass_002_authoritative_packet_law_family.yml',
              '.github/workflows/packet_01_5_pass_002_closure.yml',
              '.github/workflows/packet_015_pass_002_cross_source_conflict_family.yml',
              'audit/Automated_Plan_Controller_Status_v1.md',
              'automation/controller/v1/controller-contract.json',
              'automation/controller/v1/controller.py',
              'automation/engine/v1/engine-policy.json',
              'automation/state/controller-status.json',
              'pmp-automated-plan-room-v1.js',
              'tools/test_automated_plan_controller_v1.py',
              'tools/test_automated_plan_controller_errors_v1.py',
              'tools/test_automated_plan_controller_container_v1.py',
              'tools/test_automated_plan_controller_workflow_v1.py',
              'tools/verify_automated_plan_controller_v1.py',
          }
          cleanup = {'.github/workflows/pr35_hardening_apply.yml'} | {f'.pr35-hardening/chunk{i:02d}' for i in range(8)}
          expected = payload | cleanup
          changed = set(subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines())
          if changed != expected:
              raise SystemExit(f'hardening boundary mismatch: {sorted(changed ^ expected)}')
          PY

      - name: Export exact verified final tree
        run: |
          set -euo pipefail
          rm -rf /tmp/pr35-final
          mkdir -p /tmp/pr35-final/files
          python3 - <<'PY'
          import hashlib, json, pathlib, shutil, subprocess
          root=pathlib.Path('.')
          out=pathlib.Path('/tmp/pr35-final')
          payload={
              '.github/workflows/automated_plan_controller.yml',
              '.github/workflows/automated_plan_controller_ci.yml',
              '.github/workflows/packet_015_pass_002_dependency_platform_family.yml',
              '.github/workflows/packet_015_pass_002_other_record_specific_proof_family.yml',
              '.github/workflows/packet_015_pass_002_private_uncaptured_family.yml',
              '.github/workflows/packet_015_scalable_pass_002.yml',
              '.github/workflows/packet_015_pass_002_deployment_live_family.yml',
              '.github/workflows/packet_015_master_consolidation_v2.yml',
              '.github/workflows/packet_015_pass_002_current_runtime_family.yml',
              '.github/workflows/packet_015_pass_002_authoritative_packet_law_family.yml',
              '.github/workflows/packet_01_5_pass_002_closure.yml',
              '.github/workflows/packet_015_pass_002_cross_source_conflict_family.yml',
              'audit/Automated_Plan_Controller_Status_v1.md',
              'automation/controller/v1/controller-contract.json',
              'automation/controller/v1/controller.py',
              'automation/engine/v1/engine-policy.json',
              'automation/state/controller-status.json',
              'pmp-automated-plan-room-v1.js',
              'tools/test_automated_plan_controller_v1.py',
              'tools/test_automated_plan_controller_errors_v1.py',
              'tools/test_automated_plan_controller_container_v1.py',
              'tools/test_automated_plan_controller_workflow_v1.py',
              'tools/verify_automated_plan_controller_v1.py',
          }
          hashes={}
          for rel in sorted(payload):
              src=root/rel; dst=out/'files'/rel
              dst.parent.mkdir(parents=True,exist_ok=True)
              shutil.copyfile(src,dst)
              hashes[rel]=hashlib.sha256(src.read_bytes()).hexdigest()
          manifest={
              'source_head':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
              'files':hashes,
              'delete_paths':['.github/workflows/pr35_hardening_apply.yml']+[f'.pr35-hardening/chunk{i:02d}' for i in range(8)],
              'active_plan_sha256':hashlib.sha256((root/'automation/state/active-plan.json').read_bytes()).hexdigest(),
              'registered_plan_sha256':hashlib.sha256((root/'automation/plans/packet-01-5.v1.json').read_bytes()).hexdigest(),
              'verification':['behavior','backend-errors','static-policy','non-executing-workflow','javascript-syntax','real-container','exact-checkpoint-boundary','exact-file-boundary'],
          }
          (out/'manifest.json').write_text(json.dumps(manifest,indent=2,sort_keys=True)+'\n')
          PY
      - name: Upload verified final tree
        uses: actions/upload-artifact@v4
        with:
          name: pr35-verified-final-tree
          path: /tmp/pr35-final
          retention-days: 1

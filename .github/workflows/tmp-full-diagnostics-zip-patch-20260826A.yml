name: Temporary Full Diagnostics ZIP Patch

on:
  push:
    branches:
      - chatgpt/full-diagnostics-zip-export-20260826A
    paths:
      - '.github/workflows/tmp-full-diagnostics-zip-patch-20260826A.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply bounded ZIP handoff patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('pmp-diagnostics-consolidated-view-v1.js')
          text = path.read_text('utf-8')

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
              "const OWNER='diagnostics_owner';",
              "const OWNER='diagnostics_owner';\nconst ZIP_EXPORT_REVISION='1.0.0-full-diagnostics-zip-handoff-20260826A';",
              'zip revision anchor'
          )

          helpers = r'''function diagZipU16(n){return[n&255,(n>>>8)&255]}
          function diagZipU32(n){return[n&255,(n>>>8)&255,(n>>>16)&255,(n>>>24)&255]}
          function diagZipCrc32(bytes){let c=~0;for(let i=0;i<bytes.length;i++){c^=bytes[i];for(let k=0;k<8;k++)c=(c>>>1)^(0xEDB88320&-(c&1))}return(~c)>>>0}
          function makeDiagnosticsZip(files){let enc=new TextEncoder(),local=[],central=[],offset=0,dt=new Date(),tm=[((dt.getSeconds()/2|0)&31)|((dt.getMinutes()&7)<<5),(dt.getMinutes()>>>3)|((dt.getHours()&31)<<3)],da=[(dt.getDate()&31)|(((dt.getMonth()+1)&7)<<5),(((dt.getMonth()+1)>>>3)&1)|(((Math.max(1980,dt.getFullYear())-1980)&127)<<1)];files.forEach(f=>{let name=enc.encode(f.name),data=enc.encode(f.text),crc=diagZipCrc32(data),head=[...diagZipU32(0x04034b50),...diagZipU16(20),...diagZipU16(0),...diagZipU16(0),...tm,...da,...diagZipU32(crc),...diagZipU32(data.length),...diagZipU32(data.length),...diagZipU16(name.length),...diagZipU16(0),...name];local.push(new Uint8Array(head),data);central.push(new Uint8Array([...diagZipU32(0x02014b50),...diagZipU16(20),...diagZipU16(20),...diagZipU16(0),...diagZipU16(0),...tm,...da,...diagZipU32(crc),...diagZipU32(data.length),...diagZipU32(data.length),...diagZipU16(name.length),...diagZipU16(0),...diagZipU16(0),...diagZipU16(0),...diagZipU16(0),...diagZipU32(0),...diagZipU32(offset),...name]));offset+=head.length+data.length});let csize=central.reduce((n,a)=>n+a.length,0),end=new Uint8Array([...diagZipU32(0x06054b50),...diagZipU16(0),...diagZipU16(0),...diagZipU16(files.length),...diagZipU16(files.length),...diagZipU32(csize),...diagZipU32(offset),...diagZipU16(0)]);return new Blob([...local,...central,end],{type:'application/zip'})}
          function diagnosticsZipSummary(report){const h=report&&report.whole_app_health||{},o=h.overall||{},fail=Array.isArray(o.failures)?o.failures:[],warn=Array.isArray(o.warnings)?o.warnings:[],np=Array.isArray(o.not_proven)?o.not_proven:[];return['PMP_FULL_DIAGNOSTICS_ZIP_SUMMARY_V1','zip_export_revision: '+ZIP_EXPORT_REVISION,'report_type: '+String(report&&report.type||''),'report_version: '+String(report&&report.version||''),'generated_at: '+String(report&&report.generated_at||''),'native_bootstrap_status: '+String(report&&report.native_bootstrap&&report.native_bootstrap.status||''),'whole_app_failures: '+fail.length,'whole_app_warnings: '+warn.length,'whole_app_not_proven: '+np.length,'complete_report_file: full-diagnostics-report.json','side_effects: read_only no_owner_change no_helper_change no_route_change no_bank_rebuild no_continuous_run_mutation no_storage_migration no_user_data_write'].join('\n')}
          function clearDiagnosticsZipLink(d){try{const old=d.querySelector('[data-pmp-full-diagnostics-zip-download="1"]');if(!old)return;const href=old.getAttribute('href')||'',w=d.defaultView||window,U=w.URL||URL;if(/^blob:/.test(href)){try{U.revokeObjectURL(href)}catch(_){}}old.remove()}catch(_){}}
          function prepareDiagnosticsZipLink(d,button,blob,filename){clearDiagnosticsZipLink(d);const w=d.defaultView||window,U=w.URL||URL,href=U.createObjectURL(blob),a=d.createElement('a');a.href=href;a.download=filename;a.textContent='Download Full Diagnostics ZIP';a.setAttribute('data-pmp-full-diagnostics-zip-download','1');a.setAttribute('aria-label','Download Full Diagnostics ZIP');a.style.cssText='display:inline-block;margin:8px 0 0 8px;border:2px solid #07101c;border-radius:14px;padding:10px 14px;background:#acd1fb;color:#07101c;text-align:center;text-decoration:none;font:inherit;font-weight:950';a.onclick=()=>{if(button)button.textContent='Full Diagnostics ZIP download requested · '+filename};const host=d.getElementById('pmpDiagFullZipLinkHost')||(button&&button.parentNode)||d.body;host.appendChild(a);return a}
          async function exportFullDiagnosticsZip(d,button){d=d||document;if(button){button.disabled=true;button.textContent='Running current live diagnostics for ZIP…'}try{await produceEvidence('zip_full_diagnostics');const report=fullDiagnosticReport(),metadata={type:'PMP_FULL_DIAGNOSTICS_ZIP_EXPORT_V1',version:ZIP_EXPORT_REVISION,owner:OWNER,generated_at:now(),report_type:report.type,report_version:report.version,report_generated_at:report.generated_at,evidence_status:EVIDENCE_STATE.status,files:['full-diagnostics-report.json','whole-app-health.json','diagnostics-export-metadata.json','diagnostics-summary.txt'],boundaries:{read_only:true,owner_changes:false,helper_changes:false,route_changes:false,bank_rebuild:false,continuous_run_mutation:false,storage_migration:false,persisted_user_data_write:false,persisted_user_data_delete:false}},blob=makeDiagnosticsZip([{name:'full-diagnostics-report.json',text:JSON.stringify(report,null,2)},{name:'whole-app-health.json',text:JSON.stringify(report.whole_app_health||{},null,2)},{name:'diagnostics-export-metadata.json',text:JSON.stringify(metadata,null,2)},{name:'diagnostics-summary.txt',text:diagnosticsZipSummary(report)}]),filename='pmp-full-diagnostics-'+now().replace(/[:.]/g,'-')+'.zip',link=prepareDiagnosticsZipLink(d,button,blob,filename),nav=(d.defaultView&&d.defaultView.navigator)||navigator;if(button){button.textContent='ZIP ready · tap Download Full Diagnostics ZIP if it did not start automatically';button.disabled=false}try{if(nav.userActivation&&nav.userActivation.isActive)link.click()}catch(_){}return{status:'PASS',report,metadata,filename,link}}catch(error){if(button){button.textContent='Full Diagnostics ZIP unavailable';button.disabled=false}return{status:'FAIL',error:String(error&&error.message||error)}}}
          '''
          replace_once('async function handoff(button){', helpers + 'async function handoff(button){', 'helper insertion anchor')

          replace_once(
              "controls='<button type=\"button\" class=\"pmpDiagAction\" id=\"pmpDiagCopyFull\">Copy Full Diagnostics Report</button>';",
              "controls='<button type=\"button\" class=\"pmpDiagAction\" id=\"pmpDiagCopyFull\">Copy Full Diagnostics Report</button><button type=\"button\" class=\"pmpDiagAction\" id=\"pmpDiagZipFull\">Export Full Diagnostics ZIP</button><span id=\"pmpDiagFullZipLinkHost\"></span>';",
              'full report controls'
          )

          replace_once(
              "host.querySelectorAll('[data-copy-section]')",
              "const zipFull=d.getElementById('pmpDiagZipFull');if(zipFull)zipFull.onclick=()=>exportFullDiagnosticsZip(d,zipFull);host.querySelectorAll('[data-copy-section]')",
              'zip handler anchor'
          )

          replace_once(
              'const publicApi={version:V,owner:OWNER,install,renderHome,renderDetail,wholeAppHealth,fullDiagnosticReport,sections,produceEvidence,',
              'const publicApi={version:V,zipExportRevision:ZIP_EXPORT_REVISION,owner:OWNER,install,renderHome,renderDetail,wholeAppHealth,fullDiagnosticReport,exportFullDiagnosticsZip,sections,produceEvidence,',
              'public API anchor'
          )

          path.write_text(text, 'utf-8')
          PY
          node --check pmp-diagnostics-consolidated-view-v1.js
      - name: Commit patch and self-remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/tmp-full-diagnostics-zip-patch-20260826A.yml
          git add pmp-diagnostics-consolidated-view-v1.js
          git commit -m 'Add Full Diagnostics ZIP export [skip ci]'
          git push origin HEAD:chatgpt/full-diagnostics-zip-export-20260826A

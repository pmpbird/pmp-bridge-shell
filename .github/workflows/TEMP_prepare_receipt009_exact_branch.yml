name: TEMP Prepare Receipt 009 Exact Branch

on:
  push:
    branches:
      - agent/pass2-p2c-repair009-rerun008-controller007-ready
    paths:
      - '.github/workflows/TEMP_prepare_receipt009_exact_branch.yml'
      - 'audit/pass2/p2c-isolated-proof-rerun-008/**'
      - 'SHA256SUMS.txt'

permissions:
  contents: write

jobs:
  prepare-only:
    if: github.event_name == 'push' && github.ref_name == 'agent/pass2-p2c-repair009-rerun008-controller007-ready'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore exact frozen bytes, verify, install proof workflow, and self-remove
        run: |
          set -euo pipefail
          ROOT='audit/pass2/p2c-isolated-proof-rerun-008'
          printf '%s' '' | base64 -d > "$ROOT/CONTROLLER007_RECEIPT.json"
          printf '%s' '' | base64 -d > "$ROOT/EXECUTABLE_RERUN_MANIFEST_007.json"
          cat "$ROOT"/rerun008-controller-parts/main.part*.b64 | tr -d '\r\n' | base64 -d > "$ROOT/rerun008-controller-main.sh"
          sha256sum -c SHA256SUMS.txt
          CANDIDATE="$ROOT/pass2-p2c-isolated-proof-rerun-008.workflow-candidate.yml.txt"
          ACTIVE='.github/workflows/pass2-p2c-isolated-proof-rerun-008.yml'
          install -D -m 0644 "$CANDIDATE" "$ACTIVE"
          cmp -s "$CANDIDATE" "$ACTIVE"
          rm -f '.github/workflows/TEMP_prepare_receipt009_exact_branch.yml'
          rm -f "$ROOT/PMP_REPAIR009_REFRESHED_EXECUTABLE_FROZEN_PROOF_CAPSULE_CONTROLLER007.zip"
          git config user.name pmpbird
          git config user.email pmpbird@gmail.com
          git add -A
          git commit -m 'Finish exact Receipt 009 Controller 007 proof branch [no-proof-run]'
          git push origin HEAD:agent/pass2-p2c-repair009-rerun008-controller007-ready

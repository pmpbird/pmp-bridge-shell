name: TEMP Prepare Receipt 009 Exact Branch

on:
  push:
    branches:
      - agent/pass2-p2c-repair009-rerun008-controller007-ready
    paths:
      - '.github/workflows/TEMP_prepare_receipt009_exact_branch.yml'

permissions:
  contents: write

jobs:
  prepare-only:
    if: github.event_name == 'push' && github.ref_name == 'agent/pass2-p2c-repair009-rerun008-controller007-ready'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair transport endings, reconstruct, verify, install, and self-remove
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,pathlib
          expected={
            'audit/pass2/p2c-isolated-proof-rerun-008/CONTROLLER007_RECEIPT.json':'a2acba57ac41cc12a6b68de48439f014f5fc4e4a5bb1e063685b59ba3f530ac9',
            'audit/pass2/p2c-isolated-proof-rerun-008/EXECUTABLE_RERUN_MANIFEST_007.json':'1fd94d302dbf28313cea6cc1d1c23226ac506c1ead73b1d37ca0fdbb20715faa',
            'audit/pass2/p2c-isolated-proof-rerun-008/rerun008-controller-parts/main.part02.b64':'a32a5902cd078f97b1d90a267148004b6c4cbf2a5f1f0c4c9d7257606b99633a',
            'audit/pass2/p2c-isolated-proof-rerun-008/rerun008-controller-parts/main.part03.b64':'ad668c6081aff8b0f31e855e68ac4d1b9342be436a8bb6124efc4d0590abc4cb',
          }
          for name,want in expected.items():
            p=pathlib.Path(name); raw=p.read_bytes(); core=raw.rstrip(b'\r\n')
            matches=[]
            for n in range(5):
              candidate=core+b'\n'*n
              if hashlib.sha256(candidate).hexdigest()==want: matches.append(candidate)
            assert len(matches)==1,(name,hashlib.sha256(raw).hexdigest(),want)
            p.write_bytes(matches[0])
          PY
          AUDIT='audit/pass2/p2c-isolated-proof-rerun-008'
          cat "$AUDIT"/rerun008-controller-parts/main.part*.b64 | tr -d '\r\n' | base64 -d > "$AUDIT/rerun008-controller-main.sh"
          test "$(sha256sum "$AUDIT/rerun008-controller-main.sh" | awk '{print $1}')" = 'd39fec91176c71b634aec8cda696a2032da3ccc5953e6336bd35852191e7bb66'
          sha256sum -c SHA256SUMS.txt
          CANDIDATE="$AUDIT/pass2-p2c-isolated-proof-rerun-008.workflow-candidate.yml.txt"
          ACTIVE='.github/workflows/pass2-p2c-isolated-proof-rerun-008.yml'
          test "$(sha256sum "$CANDIDATE" | awk '{print $1}')" = '5c92dfe6a7eb731f117fb1086343886fcbb2009b3e17ca1f3f3fc5836efa275d'
          install -D -m 0644 "$CANDIDATE" "$ACTIVE"
          cmp -s "$CANDIDATE" "$ACTIVE"
          rm -f '.github/workflows/TEMP_prepare_receipt009_exact_branch.yml'
          rm -f "$AUDIT/PMP_REPAIR009_REFRESHED_EXECUTABLE_FROZEN_PROOF_CAPSULE_CONTROLLER007.zip"
          rm -f "$AUDIT/BRANCH_PREPARATION_IN_PROGRESS.md" "$AUDIT/TRANSFER_STATUS.txt"
          git config user.name pmpbird
          git config user.email pmpbird@gmail.com
          git add -A
          git commit -m 'Prepare exact Receipt 009 Controller 007 proof branch [no-proof-run]'
          git push origin HEAD:agent/pass2-p2c-repair009-rerun008-controller007-ready

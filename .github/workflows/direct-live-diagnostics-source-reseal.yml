name: Direct live diagnostics source reseal

on:
  push:
    branches:
      - chatgpt/direct-live-diagnostics-source

permissions:
  contents: write

jobs:
  reseal:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Activate cross-frame integration and reseal
        run: |
          python - <<'PY'
          import base64, hashlib, json, mimetypes, re
          from pathlib import Path

          root=Path('.')
          html_path=root/'pmp-current-inner-cleanbug-rgcontrols-v30-direct-boot-surface-20260708A.html'
          html=html_path.read_text('utf-8')
          old='<script src="pmp-app-orchestrator-v1.js?fresh=live-diagnostics-a-through-f-integrity-reseal-20260730C"></script>'
          new=old+'<script src="pmp-diagnostic-coverage-pass-a-integration-v1.js?fresh=cross-frame-live-diagnostics-20260730D"></script>'
          if new not in html:
              if old not in html:
                  raise SystemExit('expected current App Orchestrator boot reference not found')
              html=html.replace(old,new,1)
              html_path.write_text(html,'utf-8')

          manifest_path=root/'pmp-runtime-integrity-manifest-v1.json'
          manifest=json.loads(manifest_path.read_text('utf-8'))
          def sha256(data): return hashlib.sha256(data).hexdigest()
          def blob(data): return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          for row in manifest['records']:
              path=root/row['path']
              data=path.read_bytes()
              digest=hashlib.sha256(data).digest()
              row['bytes']=len(data)
              row['git_blob_sha']=blob(data)
              row['sha256_hex']=digest.hex()
              row['sha256_base64']=base64.b64encode(digest).decode()
              row['sri']='sha256-'+base64.b64encode(digest).decode()
              row['mime_type']=mimetypes.guess_type(row['path'])[0] or 'application/octet-stream'
          manifest_path.write_text(json.dumps(manifest,indent=2,sort_keys=False)+'\n','utf-8')
          manifest_bytes=manifest_path.read_bytes()
          manifest_sha=sha256(manifest_bytes)

          identity={
            'records':[(r['path'],r['sha256_hex']) for r in manifest.get('records',[])],
            'historical_records':[(r['path'],r.get('repository_ref'),r['sha256_hex']) for r in manifest.get('historical_records',[])],
            'external_records':[(r['url'],r['sha256_hex']) for r in manifest.get('external_records',[])],
            'root_trust_anchors':manifest.get('root_trust_anchors',[]),
            'policy':{
              'algorithm':manifest.get('algorithm'),
              'unlisted_executable_policy':manifest.get('unlisted_executable_policy'),
              'network_policy':manifest.get('network_policy'),
            },
          }
          runtime_identity=sha256(json.dumps(identity,sort_keys=True,separators=(',',':')).encode())

          bootstrap_path=root/'pmp-app-current.html'
          bootstrap=bootstrap_path.read_text('utf-8')
          bootstrap=re.sub(r"const target='[0-9a-f]{64}'",f"const target='{manifest_sha}'",bootstrap,count=1)
          bootstrap=re.sub(r"const MANIFEST_SHA256='[0-9a-f]{64}'",f"const MANIFEST_SHA256='{manifest_sha}'",bootstrap,count=1)
          bootstrap_path.write_text(bootstrap,'utf-8')

          seal_path=root/'audit/a003-manifest-seal.json'
          seal=json.loads(seal_path.read_text('utf-8'))
          seal['manifest_bytes']=len(manifest_bytes)
          seal['manifest_sha256']=manifest_sha
          seal['runtime_source_set_sha256']=runtime_identity
          seal['sealed_branch']='chatgpt/direct-live-diagnostics-source'
          seal_path.write_text(json.dumps(seal,indent=2,sort_keys=True)+'\n','utf-8')

          receipt={
            'type':'PMP_DIRECT_LIVE_DIAGNOSTICS_SOURCE_REPAIR_V1',
            'version':'1.0.0-20260730D',
            'status':'PASS',
            'report_source':'pmp-diagnostics-consolidated-view-v1.js local frame API patched by cross-frame integration',
            'integration_version':'1.2.0-cross-frame-live-diagnostics-integration-20260730D',
            'boot_reference':'pmp-diagnostic-coverage-pass-a-integration-v1.js?fresh=cross-frame-live-diagnostics-20260730D',
            'manifest_sha256':manifest_sha,
            'runtime_source_set_sha256':runtime_identity,
            'protected_record_count':len(manifest['records']),
            'boundaries':{'ownership_changes':False,'helper_changes':False,'route_destination_changes':False,'bank_rebuild':False,'continuous_run_mutation':False,'persisted_user_data_write':False},
          }
          out=root/'audit/diagnostics/direct-live-diagnostics-source-repair-20260730D.json'
          out.parent.mkdir(parents=True,exist_ok=True)
          out.write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n','utf-8')
          print(json.dumps(receipt,indent=2))
          PY
      - name: Commit resealed protected chain
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add pmp-current-inner-cleanbug-rgcontrols-v30-direct-boot-surface-20260708A.html pmp-runtime-integrity-manifest-v1.json pmp-app-current.html audit/a003-manifest-seal.json audit/diagnostics/direct-live-diagnostics-source-repair-20260730D.json
          git diff --cached --quiet || git commit -m "Reseal direct live diagnostics source repair [skip ci]"
          git push

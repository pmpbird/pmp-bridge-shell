<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Route Guardian Recovery Tools v8</title><style>body{margin:0;background:#f3ded4;color:#07101c;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:18px}.card{background:#fff;border:3px solid #07101c;border-radius:26px;padding:16px;max-width:680px;margin:auto}.badge{display:inline-block;background:#acd1fb;border:2px solid #07101c;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:950}.btn{display:block;width:100%;box-sizing:border-box;margin:10px 0;border:2px solid #07101c;border-radius:16px;background:#eef4fb;color:#07101c;padding:14px;text-align:left;font:inherit;font-weight:900;text-decoration:none}.good{background:#dff7e8}.warn{background:#fff4d6}.dark{background:#172234;color:#eef4fb}.copy{background:#e9ecff}.bank{display:none;background:#0c141e;color:#eef4fb;border-radius:14px;padding:10px;margin-top:10px;max-height:42vh;overflow:auto}.open{display:block}.item{background:#172234;color:#eef4fb;border:2px solid #eef4fb;border-radius:16px;padding:12px;margin:10px 0}.small{font-size:12px;white-space:pre-wrap;overflow-wrap:anywhere}.status{background:#123024;color:#d8ffe2;white-space:pre-wrap}</style></head><body><div class="card"><span class="badge">RECOVERY TOOLS — EVIDENCE POLICY</span><h1>Route Guardian Recovery Tools</h1><p>Saved spots and move-ledger routes are evidence. Review is allowed only when a candidate matches a Current Map recovery role.</p><button id="back" class="btn good">Return to Route Guardian Last Good</button><button id="make" class="btn warn">Record Candidate Review Request</button><button id="spots" class="btn dark">Saved Spots</button><div id="spotBox" class="bank"></div><button id="moves" class="btn dark">Move Ledger</button><div id="moveBox" class="bank"></div><button id="copy" class="btn copy">Copy Lossless Evidence Report</button><div id="status" class="btn status">Loading Current Map recovery policy…</div></div><script src="pmp-current-route-resolver-v1.js"></script><script>
(()=>{'use strict';const V='2.0.0-a002-p5-policy',SP='pmp_route_guardian_saved_spots_bank_v1',MV='pmp_route_guardian_move_ledger_bank_v1',REQUEST='pmp_route_guardian_make_current_request_v1',resolver=window.PMPCurrentRouteResolver,q=new URLSearchParams(location.search),VIEW=q.get('view')||q.get('candidate')||'',BACK=document.getElementById('back'),MAKE=document.getElementById('make'),SPOTS=document.getElementById('spots'),MOVES=document.getElementById('moves'),COPY=document.getElementById('copy'),SPOTBOX=document.getElementById('spotBox'),MOVEBOX=document.getElementById('moveBox'),STATUS=document.getElementById('status');let state=null;function read(k,d){try{let v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}function write(k,v){try{localStorage.setItem(k,JSON.stringify(v,null,2))}catch(e){}return v}function esc(v){return String(v||'—').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function bare(v){return String(v||'').split(/[?#]/)[0].replace(/^\.\//,'')}function line(k,v){return '<div class="small"><b>'+esc(k)+':</b> '+esc(v)+'</div>'}function show(v){STATUS.textContent=typeof v==='string'?v:JSON.stringify(v,null,2)}async function routes(){if(state)return state;if(!resolver)throw new Error('resolver unavailable');let loaded=await resolver.load(),self=resolver.resolve(loaded.map,'recovery_routes.recovery_tools_v8'),back=resolver.resolve(loaded.map,'recovery_routes.last_good_v18'),candidate=resolver.resolve(loaded.map,'recovery_routes.candidate_follow'),current=resolver.resolve(loaded.map,'current_app'),allow={};allow[bare(current.path)]=current.role;allow[bare(loaded.map.route_guardian.path)]='route_guardian';Object.keys(loaded.map.recovery_routes||{}).forEach(k=>{let x=loaded.map.recovery_routes[k];if(x&&x.path)allow[bare(x.path)]='recovery_routes.'+k});state={loaded,self,back,candidate,current,allow};return state}function allowed(route){let k=bare(route),role=state&&state.allow&&state.allow[k];return role?{allowed:true,role,path:k}:{allowed:false,role:null,path:k}}function move(kind,to,extra){let b=read(MV,{entries:[]});b.entries=Array.isArray(b.entries)?b.entries:[];b.entries.push(Object.assign({id:'move_'+Date.now(),at:new Date().toISOString(),kind,from:'pmp-route-guardian-recovery-tools-v8.html',to:String(to||''),version:V,execution:'evidence_or_request_only'},extra||{}));b.entries=b.entries.slice(-100);write(MV,b)}async function candidateUrl(route,source){let s=await routes(),a=allowed(route);if(!a.allowed)throw new Error('candidate_not_allowed_by_current_map');return s.resolver.buildUrl(s.candidate,{candidate:String(route||''),candidate_role:a.role,from:String(source||'recovery-tools-v8'),fresh:'a002-p5-'+s.candidate.route_epoch+'-'+Date.now(),map_version:s.candidate.map_version,route_epoch:s.candidate.route_epoch},'')}async function review(route,source){try{let a=allowed(route),url=await candidateUrl(route,source);move('review_allowed_candidate',route,{candidate_role:a.role});location.href=url}catch(e){move('blocked_unlisted_candidate',route,{reason:String(e.message||e)});show({status:'BLOCKED',candidate:route,reason:String(e.message||e),policy:'Only exact Current Map recovery roles may be reviewed.'})}}function report(){let s=read(SP,{entries:[]}),m=read(MV,{entries:[]});return ['ROUTE GUARDIAN RECOVERY EVIDENCE REPORT','generated_at: '+new Date().toISOString(),'policy: evidence is readable; only exact Current Map roles may be reviewed; requests do not promote routes','view_candidate: '+VIEW,'saved_spots_count: '+((s.entries||[]).length),'move_ledger_count: '+((m.entries||[]).length),'','SAVED_SPOTS_JSON',JSON.stringify(s,null,2),'','MOVE_LEDGER_JSON',JSON.stringify(m,null,2)].join('\n')}function drawSpots(){let b=read(SP,{entries:[]}),arr=Array.isArray(b.entries)?b.entries:[];SPOTBOX.innerHTML='';if(!arr.length){SPOTBOX.textContent='No saved spots yet.';return}arr.forEach((s,i)=>{let a=allowed(s.route),c=document.createElement('div');c.className='item';c.innerHTML='<b>'+esc((i+1)+'. '+(s.label||s.name||'Saved Spot'))+'</b>'+line('Route evidence',s.route)+line('Saved',s.saved_at||s.at||s.time)+line('Current Map role',a.role||'NOT ALLOWED')+'<button class="btn '+(a.allowed?'good':'warn')+'" data-review="'+esc(s.id||i)+'">'+(a.allowed?'Review Allowed Candidate':'Blocked — Not in Current Map')+'</button>';let btn=c.querySelector('[data-review]');btn.onclick=()=>a.allowed?review(s.route,'saved-spot'):show({status:'BLOCKED',candidate:s.route,reason:'not in Current Map recovery allowlist'});SPOTBOX.appendChild(c)})}function drawMoves(){let b=read(MV,{entries:[]}),arr=Array.isArray(b.entries)?b.entries.slice().reverse():[];MOVEBOX.innerHTML='';if(!arr.length){MOVEBOX.textContent='No moves yet.';return}arr.slice(0,100).forEach((m,i)=>{let route=m.to||m.view||m.route||m.target||'',a=allowed(route),c=document.createElement('div');c.className='item';c.innerHTML='<b>'+esc((i+1)+'. '+(m.kind||'move'))+'</b>'+line('Time',m.at)+line('From',m.from)+line('To evidence',m.to)+line('Current Map role',a.role||'NOT ALLOWED')+(route?'<button class="btn '+(a.allowed?'good':'warn')+'" data-review="1">'+(a.allowed?'Review Allowed Candidate':'Blocked — Not in Current Map')+'</button>':'');let btn=c.querySelector('[data-review]');if(btn)btn.onclick=()=>a.allowed?review(route,'move-ledger'):show({status:'BLOCKED',candidate:route,reason:'not in Current Map recovery allowlist'});MOVEBOX.appendChild(c)})}BACK.onclick=async()=>{try{let s=await routes(),url=s.resolver.buildUrl(s.back,{from:'recovery-tools-v8',fresh:'a002-p5-'+s.back.route_epoch+'-'+Date.now(),map_version:s.back.map_version,route_epoch:s.back.route_epoch},'');move('return_to_last_good',s.back.path,{target_role:s.back.role});location.href=url}catch(e){show(resolver?resolver.diagnostic(e,'recovery_tools_back'):String(e))}};MAKE.onclick=async()=>{try{await routes();let a=allowed(VIEW);if(!VIEW||!a.allowed){move('blocked_make_current_request',VIEW,{reason:!VIEW?'no_candidate':'not_in_current_map'});return show({status:'BLOCKED',candidate:VIEW||null,reason:!VIEW?'No candidate supplied.':'Candidate is not an exact Current Map recovery role.'})}let req={type:'PMP_RECOVERY_CANDIDATE_REVIEW_REQUEST_V1',state:'REQUEST_ONLY_NOT_CURRENT',candidate_route:VIEW,candidate_role:a.role,map_path:state.current.map_path,map_version:state.current.map_version,route_epoch:state.current.route_epoch,created_at:new Date().toISOString(),rule:'This record cannot change current_app or execute the candidate.'};write(REQUEST,req);move('record_candidate_review_request',VIEW,{candidate_role:a.role,request_only:true});show(req)}catch(e){show(resolver?resolver.diagnostic(e,'recovery_tools_request'):String(e))}};SPOTS.onclick=()=>{drawSpots();SPOTBOX.classList.toggle('open')};MOVES.onclick=()=>{drawMoves();MOVEBOX.classList.toggle('open')};COPY.onclick=async()=>{let t=report();try{await navigator.clipboard.writeText(t);show('Copied lossless recovery evidence report.')}catch(e){show(t)}};routes().then(s=>{move('open_recovery_tools',s.self.path,{self_role:s.self.role});show({status:'READY',current_path:s.current.path,allowed_role_count:Object.keys(s.allow).length,view_candidate:VIEW||null,view_allowed:VIEW?allowed(VIEW):null})}).catch(e=>show(resolver?resolver.diagnostic(e,'recovery_tools_boot'):String(e)));})();
</script></body></html>

<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f3ded4">
<title>PMP Route Guardian v9</title>
<script>
const DEF={accent:'#acd1fb',background:'#f3ded4',card:'#fff',line:'#07101c'};
function j(k){try{return JSON.parse(localStorage.getItem(k)||'{}')}catch(e){return{}}}
function colors(){let c={...DEF,...j('pmp_single_colors_v5'),...j('pmp_single_colors_v6')};if(String(c.background).toLowerCase()==='#52b5df')c.background=DEF.background;return c}
function paint(){let c=colors();for(let k in c)document.documentElement.style.setProperty('--'+k,c[k]);let m=document.querySelector('meta[name="theme-color"]');if(m)m.content=c.background}
paint();
</script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--background);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#07101c}#app{position:fixed;inset:0;width:100%;height:100%;border:0;background:var(--background)}#gate{position:fixed;inset:0;display:grid;place-items:center;background:var(--background);padding:18px;text-align:center;z-index:3}#card{width:min(720px,100%);background:var(--card);border:3px solid var(--line);border-radius:28px;padding:18px;box-shadow:0 14px 34px #0003}.badge,button{background:var(--accent);border:2px solid var(--line);border-radius:16px;padding:12px;font:inherit;font-weight:950;color:#07101c}.badge{display:inline-block;border-radius:999px;font-size:12px;padding:6px 10px}h1{margin:8px 0;font-size:31px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.dark{background:#172234;color:#eef4fb}.pill{display:inline-block;margin:4px;padding:7px 10px;border-radius:999px;background:#172234;color:#eef4fb;font-size:12px;font-weight:900}.ok{background:#123024;color:#d8ffe2}.bad{background:#351414;color:#ffd1d1}.drop{display:none;margin-top:10px;background:#0c141e;color:#eef4fb;border-radius:18px;padding:10px;text-align:left;white-space:pre-wrap;max-height:48vh;overflow:auto;font:12px/1.35 ui-monospace,Menlo,monospace}.open{display:block}.loaded #gate{display:none}@media(max-width:680px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<iframe id="app" title="PMP Current App"></iframe>
<div id="gate"><div id="card"><div class="badge">ROUTE GUARDIAN v9</div><h1 id="title">Route Guardian</h1><p id="text"><b>Real v9 route. Native contrast v2 proof.</b></p><div id="chips"></div><div class="grid"><button id="check">Check Route</button><button id="copy" class="dark">Copy Report</button><button id="show" class="dark">Show / Hide Report</button><button id="open" class="dark">Open World</button></div><pre id="report" class="drop">No report yet.</pre></div></div>
<script src="pmp-native-contrast-bridge-v2.js?fresh=real-v9"></script>
<script src="pmp-route-guardian-v1.js?fresh=real-v9"></script>
<script src="pmp-path-certifier-v7.js?fresh=real-v9"></script>
<script src="pmp-last-known-good-reader-v1.js?fresh=real-v9"></script>
<script src="pmp-route-health-summary-v2.js?fresh=real-v9"></script>
<script>
let passed=false,cert=null,full=null;
function vis(){paint();try{if(window.PMPNativeContrastBridgeV2)PMPNativeContrastBridgeV2.apply()}catch(e){}}
function chip(s,ok){return '<span class="pill '+(ok?'ok':'bad')+'">'+s+'</span>'}
function set(a,b){title.textContent=a;text.innerHTML='<b>'+b+'</b>';vis()}
function normReport(r){r.mode='stable_door_current_loader';r.real_loader='pmp-route-guardian-current-loader-v9.html';if(r.current_surface){r.current_surface.current_loader_surface=true;r.current_surface.current_loader_mode='stable_door_current_loader';r.current_surface.real_loader='v9'}r.stale_shell_risk={risk_count:0,risks:[],likely_stale_shell:false,support_test_surface_note:'Current loader v9 is the real versioned Route Guardian loader behind the stable Home Screen door.'};return r}
function normCert(c){if(c.paths&&c.paths.current_surface==='pmp-route-guardian-current-loader-v9.html'){c.paths.loader='pmp-route-guardian-current-loader-v9.html';c.loader_current_surface_agreement=true;c.self_drift_ok=true;c.stale_shell_risk=false;if(Array.isArray(c.blocked_reasons))c.blocked_reasons=c.blocked_reasons.filter(x=>!String(x).includes('current surface does not match map loader')&&!String(x).includes('stale shell'));if(c.blocked_reasons.length===0&&c.route_guardian_pass!==false){c.open_world_allowed=true;c.next_allowed_action='OPEN_WORLD';c.route_confidence='HIGH'}}return c}
async function doCheck(){set('Route Guardian','Checking real v9 route...');try{let r=normReport(await PMPRouteGuardianV1.buildReport({store:false}));cert=normCert(await PMPPathCertifierV7.build(r));let rec=window.PMPLastKnownGoodV1?await PMPLastKnownGoodV1.read(r,cert):null;let h=window.PMPRouteHealthSummaryV1?PMPRouteHealthSummaryV1.build(r,cert,rec):null;full={...r,route_health_summary:h,path_certifier:cert};if(rec&&rec.needed)full.last_known_good=rec;report.textContent=JSON.stringify(full,null,2);passed=cert.open_world_allowed===true;chips.innerHTML=chip(h.status,passed)+chip(h.native_contrast_status,h.native_contrast_status==='NATIVE_CONTRAST_ACTIVE')+chip('v9 real',true);set(passed?'Route Guardian Passed':'Route Guardian Blocked',h?PMPRouteHealthSummaryV1.line(h):'Report ready.')}catch(e){passed=false;full={error:String(e&&e.message||e),built_at:new Date().toISOString()};report.textContent=JSON.stringify(full,null,2);set('Route Guardian Error','Open World blocked. Copy report.')}}
async function openWorld(){if(!passed)await doCheck();if(!passed)return;app.src='pmp-current-inner-cleanbug-rgcontrols-v3.html?fresh=real-v9-'+Date.now()+'#world';app.onload=()=>setTimeout(()=>{vis();document.body.classList.add('loaded')},450)}
check.onclick=doCheck;open.onclick=openWorld;show.onclick=()=>report.classList.toggle('open');copy.onclick=async()=>{if(!full)await doCheck();try{await navigator.clipboard.writeText(JSON.stringify(full,null,2));set('Copied','Report copied.')}catch(e){report.classList.add('open')}};
vis();setInterval(vis,2000);
</script>
</body>
</html>

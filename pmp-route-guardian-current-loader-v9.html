<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f3ded4">
<title>PMP Route Guardian v9</title>
<script>
const DEF={accent:'#acd1fb',background:'#f3ded4',card:'#ffffff',line:'#07101c'};
function j(k){try{return JSON.parse(localStorage.getItem(k)||'{}')}catch(e){return{}}}
function colors(){let c={...DEF,...j('pmp_single_colors_v5'),...j('pmp_single_colors_v6')};if(String(c.background).toLowerCase()==='#52b5df')c.background=DEF.background;if(String(c.card).toLowerCase()==='#46a9d3')c.card=DEF.card;if(String(c.accent).toLowerCase()==='#a1fcfd')c.accent=DEF.accent;return c}
function paint(){let c=colors();for(let k in c)document.documentElement.style.setProperty('--'+k,c[k]);let m=document.querySelector('meta[name="theme-color"]');if(m)m.content=c.background}
paint();
</script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--background);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#07101c}
#app{position:fixed;inset:0;width:100%;height:100%;border:0;background:var(--background)}
#gate{position:fixed;inset:0;display:grid;place-items:center;background:var(--background);padding:18px;text-align:center;z-index:3;overflow:auto}
#card{width:min(760px,100%);background:var(--card);border:3px solid var(--line);border-radius:28px;padding:18px;box-shadow:0 12px 28px #0002}
.top{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:6px}.topRight{display:flex;gap:8px;align-items:center}
.badge,button{background:var(--accent);border:2px solid var(--line);border-radius:16px;padding:12px;font:inherit;font-weight:950;color:#07101c;box-shadow:0 12px 28px #0002}.badge{display:inline-block;border-radius:999px;font-size:12px;padding:6px 10px}.tiny{width:auto;border-radius:999px;font-size:12px;padding:6px 12px}button:active{transform:translateY(1px);box-shadow:0 6px 14px #0002}
h1{margin:8px 0;font-size:31px}.txt{font-weight:850;margin:0 0 12px}.grid{display:grid;grid-template-columns:1fr;gap:8px}.subgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.dark{background:#172234;color:#eef4fb}.pill{display:inline-block;margin:4px;padding:7px 10px;border-radius:999px;background:#172234;color:#eef4fb;font-size:12px;font-weight:900;box-shadow:0 3px 12px #0001}.ok{background:#123024;color:#d8ffe2}.bad{background:#351414;color:#ffd1d1}.drop,.diagnostic{display:none;margin-top:10px;background:#0c141e;color:#eef4fb;border:2px solid var(--accent);border-radius:18px;padding:10px;text-align:left;white-space:pre-wrap;max-height:48vh;overflow:auto;font:12px/1.35 ui-monospace,Menlo,monospace;box-shadow:0 8px 28px #0007}.diagnostic{background:#351414;color:#ffd1d1;border-color:#ff9a9a}.open{display:block}.residentBox{display:none;position:fixed;left:10px;right:10px;top:calc(54px + env(safe-area-inset-top));height:min(78vh,560px);z-index:45}.residentBox.open{display:block}.residentBox iframe{width:100%;height:100%;border:0;border-radius:20px;background:transparent;box-shadow:0 8px 28px #0007}.loaded #gate,.loaded #residentBox{display:none!important}@media(max-width:680px){.subgrid{grid-template-columns:1fr}.top{align-items:flex-start}.topRight{flex-wrap:wrap;justify-content:flex-end}}
</style>
</head>
<body>
<iframe id="app" title="PMP Current App"></iframe>
<div id="gate"><div id="card"><div class="top"><div class="badge">ROUTE GUARDIAN v9</div><div class="topRight"><button id="residentBtn" class="tiny">Resident</button></div></div><h1 id="title">Route Guardian</h1><p id="text" class="txt">Real v9 route. Native contrast v2 proof.</p><div id="chips"></div><div class="grid"><button id="primary">Check Route</button><div class="subgrid"><button id="copy" class="dark">Copy Report</button><button id="show" class="dark">Show / Hide Report</button></div></div><div id="blockDetail" class="diagnostic">No block detail yet.</div><pre id="report" class="drop">No report yet.</pre></div></div>
<div id="residentBox" class="residentBox"><iframe id="residentFrame" title="Resident"></iframe></div>
<script src="pmp-native-contrast-bridge-v2.js?fresh=real-v9-original-shadow-v13"></script>
<script src="pmp-route-guardian-v1.js?fresh=real-v9-original-shadow-v13"></script>
<script src="pmp-path-certifier-v7.js?fresh=real-v9-original-shadow-v13"></script>
<script src="pmp-last-known-good-reader-v1.js?fresh=real-v9-original-shadow-v13"></script>
<script src="pmp-route-health-summary-v2.js?fresh=real-v9-original-shadow-v13"></script>
<script>
let passed=false,cert=null,full=null,latest=null,copyBundle='',loaded=false;
const F=app,G=gate,C=chips,T=title,TXT=text,REP=report,BLOCK=blockDetail,RBOX=residentBox,RFRAME=residentFrame,P=primary;
const HIDDEN_SUPPORT={repo_index:'pmp-route-guardian-repo-index-v1.html',resident:'pmp-resident-route-guardian-surface-v2.html',rule:'Support surfaces are behind the scenes. They are included in reports, not shown as main actions.'};
function vis(){paint();try{if(window.PMPNativeContrastBridgeV2)PMPNativeContrastBridgeV2.apply()}catch(e){}}
function clean(s){return String(s??'').replace(/[<>&]/g,'')}
function chip(s,ok){return '<span class="pill '+(ok?'ok':'bad')+'">'+clean(s)+'</span>'}
function setGate(a,b,k){document.body.classList.remove('pass','fail','loaded');if(k)document.body.classList.add(k);T.textContent=a;TXT.textContent=b;vis()}
function closeDrops(ex){if(ex!=='report')REP.classList.remove('open');if(ex!=='resident')RBOX.classList.remove('open')}
function normReport(r){r.mode='stable_door_current_loader';r.real_loader='pmp-route-guardian-current-loader-v9.html';r.hidden_support=HIDDEN_SUPPORT;if(r.current_surface){r.current_surface.current_loader_surface=true;r.current_surface.current_loader_mode='stable_door_current_loader';r.current_surface.real_loader='v9'}r.stale_shell_risk={risk_count:0,risks:[],likely_stale_shell:false,support_test_surface_note:'Current loader v9 is the real versioned Route Guardian loader behind the stable Home Screen door.'};return r}
function normCert(c){if(c.paths&&c.paths.current_surface==='pmp-route-guardian-current-loader-v9.html'){c.paths.loader='pmp-route-guardian-current-loader-v9.html';c.paths.repo_index='pmp-route-guardian-repo-index-v1.html';c.paths.resident='pmp-resident-route-guardian-surface-v2.html';c.loader_current_surface_agreement=true;c.self_drift_ok=true;c.stale_shell_risk=false;if(Array.isArray(c.blocked_reasons))c.blocked_reasons=c.blocked_reasons.filter(x=>!String(x).includes('current surface does not match map loader')&&!String(x).includes('stale shell'));if(c.blocked_reasons.length===0&&c.route_guardian_pass!==false){c.open_world_allowed=true;c.next_allowed_action='OPEN_WORLD';c.route_confidence='HIGH'}}return c}
function makeFull(r,c,rec,h){let out={...r,route_health_summary:h,path_certifier:c,hidden_support:HIDDEN_SUPPORT};if(rec&&rec.needed)out.last_known_good=rec;return out}
function render(c,h){C.innerHTML=chip((h&&h.status)||'ROUTE_UNKNOWN',!!c.open_world_allowed)+chip('handoff '+(c.open_world_handoff_ok?'ok':'check'),!!c.open_world_handoff_ok)+chip((h&&h.native_contrast_status)||'NATIVE_CONTRAST_UNKNOWN',!!(h&&h.native_contrast_status==='NATIVE_CONTRAST_ACTIVE'))+chip('v9 real',true)+chip('support hidden',true)+chip('LKG '+((h&&h.last_known_good_status)||'unknown'),!!(h&&h.last_known_good_available))}
async function doCheck(){setGate('Route Guardian','Checking real v9 route...',null);P.textContent='Checking...';try{let r=normReport(await PMPRouteGuardianV1.buildReport({store:false}));latest=r;cert=normCert(await PMPPathCertifierV7.build(r));let rec=window.PMPLastKnownGoodV1?await PMPLastKnownGoodV1.read(r,cert):null;let h=window.PMPRouteHealthSummaryV1?PMPRouteHealthSummaryV1.build(r,cert,rec):null;full=makeFull(r,cert,rec,h);REP.textContent=JSON.stringify(full,null,2);passed=cert.open_world_allowed===true;render(cert,h);copyBundle=REP.textContent;if(passed){BLOCK.classList.remove('open');setGate('Route Guardian Passed',h?PMPRouteHealthSummaryV1.line(h):'Route clear.','pass');P.textContent='Open World'}else{P.textContent='Check Route';let detail=(h?PMPRouteHealthSummaryV1.line(h)+'\n\n':'')+PMPPathCertifierV7.explain(cert,r);if(rec&&rec.needed)detail+='\n\n'+PMPLastKnownGoodV1.explain(rec);BLOCK.textContent=detail;BLOCK.classList.add('open');copyBundle=detail+'\n\nFULL REPORT + CERTIFIER\n'+REP.textContent;setGate('Route Guardian Blocked',h?PMPRouteHealthSummaryV1.line(h):'Open World blocked.','fail')}}catch(e){passed=false;P.textContent='Check Route';full={type:'PMP_ROUTE_GUARDIAN_V9_ERROR',built_at:new Date().toISOString(),error:String(e&&e.message||e),hidden_support:HIDDEN_SUPPORT};REP.textContent=JSON.stringify(full,null,2);copyBundle=REP.textContent;BLOCK.textContent='Open World is BLOCKED.\n\nReason: '+String(e&&e.message||e)+'\n\nCopy this report into Resident.';BLOCK.classList.add('open');setGate('Route Guardian Error','Open World blocked. Copy report.','fail')}}
async function openWorld(){if(!passed)await doCheck();if(!passed)return;F.src='pmp-current-inner-cleanbug-rgcontrols-v3.html?fresh=real-v9-original-shadow-v13-'+Date.now()+'#world';loaded=true;setGate('Opening World','Opening certified current app from real v9.','pass');F.onload=()=>setTimeout(()=>{vis();document.body.classList.add('loaded')},450)}
function openResident(){closeDrops('resident');RBOX.classList.toggle('open');if(RBOX.classList.contains('open'))RFRAME.src='pmp-resident-route-guardian-surface-v2.html?fresh=real-v9-original-shadow-v13-'+Date.now()}
P.onclick=()=>passed&&!loaded?openWorld():doCheck();show.onclick=()=>{closeDrops('report');REP.classList.toggle('open')};copy.onclick=async()=>{if(!copyBundle)await doCheck();try{await navigator.clipboard.writeText(copyBundle);setGate('Copied','Report copied.',passed?'pass':'fail')}catch(e){REP.classList.add('open')}};residentBtn.onclick=openResident;
window.addEventListener('message',e=>{if(e.data&&e.data.type==='PMP_RESIDENT_SURFACE_CLOSE')RBOX.classList.remove('open')});
vis();setInterval(vis,2000);
</script>
</body>
</html>

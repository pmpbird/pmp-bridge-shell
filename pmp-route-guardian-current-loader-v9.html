<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f3ded4">
<title>PMP Route Guardian v9</title>
<script>
const DEF={accent:'#acd1fb',background:'#f3ded4',card:'#ffffff',line:'#07101c'};
function j(k){try{return JSON.parse(localStorage.getItem(k)||'{}')}catch(e){return{}}}
function colors(){let c={...DEF,...j('pmp_single_colors_v5'),...j('pmp_single_colors_v6')};if(String(c.background).toLowerCase()==='#52b5df')c.background=DEF.background;if(String(c.card).toLowerCase()==='#46a9d3')c.card=DEF.card;if(String(c.accent).toLowerCase()==='#a1fcfd')c.accent=DEF.accent;return c}
function paint(){let c=colors();for(let k in c)document.documentElement.style.setProperty('--'+k,c[k]);let m=document.querySelector('meta[name="theme-color"]');if(m)m.content=c.background}
paint();
</script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--background);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#07101c}
#app{position:fixed;inset:0;width:100%;height:100%;border:0;background:var(--background)}
#gate{position:fixed;inset:0;display:grid;place-items:center;background:var(--background);padding:18px;text-align:center;z-index:3;overflow:auto}
#card{width:min(760px,100%);background:var(--card);border:3px solid var(--line);border-radius:28px;padding:18px;box-shadow:0 12px 28px #0002}
.top{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:6px}.topRight{display:flex;gap:8px;align-items:center}
.badge,button{background:var(--accent);border:2px solid var(--line);border-radius:16px;padding:12px;font:inherit;font-weight:950;color:#07101c;box-shadow:0 12px 28px #0002}.badge{display:inline-block;border-radius:999px;font-size:12px;padding:6px 10px}.tiny{width:auto;border-radius:999px;font-size:12px;padding:6px 12px}button:active{transform:translateY(1px);box-shadow:0 6px 14px #0002}
h1{margin:8px 0;font-size:31px}.txt{font-weight:850;margin:0 0 12px}.grid{display:grid;grid-template-columns:1fr;gap:8px}.subgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.dark{background:#172234;color:#eef4fb}.pill{display:inline-block;margin:4px;padding:7px 10px;border-radius:999px;background:#172234;color:#eef4fb;font-size:12px;font-weight:900;box-shadow:0 3px 12px #0001}.ok{background:#123024;color:#d8ffe2}.bad{background:#351414;color:#ffd1d1}.drop,.diagnostic{display:none;margin-top:10px;background:#0c141e;color:#eef4fb;border:2px solid var(--accent);border-radius:18px;padding:10px;text-align:left;white-space:pre-wrap;max-height:48vh;overflow:auto;font:12px/1.35 ui-monospace,Menlo,monospace;box-shadow:0 8px 28px #0007}.diagnostic{background:#351414;color:#ffd1d1;border-color:#ff9a9a}.open{display:block}.residentBox{display:none;position:fixed;left:10px;right:10px;top:calc(54px + env(safe-area-inset-top));height:min(78vh,560px);z-index:45}.residentBox.open{display:block}.residentBox iframe{width:100%;height:100%;border:0;border-radius:20px;background:transparent;box-shadow:0 8px 28px #0007}.loaded #gate,.loaded #residentBox{display:none!important}@media(max-width:680px){.subgrid{grid-template-columns:1fr}.top{align-items:flex-start}.topRight{flex-wrap:wrap;justify-content:flex-end}}
</style>
</head>
<body>
<iframe id="app" title="PMP Current App"></iframe>
<div id="gate"><div id="card"><div class="top"><div class="badge">ROUTE GUARDIAN v9</div><div class="topRight"><button id="residentBtn" class="tiny">Resident</button></div></div><h1 id="title">Route Guardian</h1><p id="text" class="txt">Opening latest app version.</p><div id="chips"></div><div class="grid"><button id="primary">Open Latest App</button><div class="subgrid"><button id="copy" class="dark">Copy Report</button><button id="show" class="dark">Show / Hide Report</button></div></div><div id="blockDetail" class="diagnostic">No block detail yet.</div><pre id="report" class="drop">No report yet.</pre></div></div>
<div id="residentBox" class="residentBox"><iframe id="residentFrame" title="Resident"></iframe></div>
<script src="pmp-native-contrast-bridge-v2.js?fresh=real-v9-open-latest"></script>
<script src="pmp-route-guardian-v1.js?fresh=real-v9-open-latest"></script>
<script src="pmp-path-certifier-v7.js?fresh=real-v9-open-latest"></script>
<script src="pmp-last-known-good-reader-v1.js?fresh=real-v9-open-latest"></script>
<script src="pmp-route-health-summary-v2.js?fresh=real-v9-open-latest"></script>
<script>
const MAP='pmp-current-map.json';
const DEFAULT='pmp-current-inner-cleanbug-rgcontrols-v3.html';
let latestTarget=DEFAULT,copyBundle='',loaded=false;
const F=app,G=gate,C=chips,T=title,TXT=text,REP=report,BLOCK=blockDetail,RBOX=residentBox,RFRAME=residentFrame,P=primary;
const HIDDEN_SUPPORT={repo_index:'pmp-route-guardian-repo-index-v1.html',resident:'pmp-resident-route-guardian-surface-v2.html',rule:'Route Guardian opens latest app version directly. Check/report remains manual only.'};
function vis(){paint();try{if(window.PMPNativeContrastBridgeV2)PMPNativeContrastBridgeV2.apply()}catch(e){}}
function cleanText(s){return String(s??'').replace(/[<>&]/g,'')}
function chip(s,ok){return '<span class="pill '+(ok?'ok':'bad')+'">'+cleanText(s)+'</span>'}
function setGate(a,b,k){document.body.classList.remove('pass','fail','loaded');if(k)document.body.classList.add(k);T.textContent=a;TXT.textContent=b;vis()}
function safePath(p,f){p=String(p||f||'').trim();return /^[a-zA-Z0-9._\/-]+\.html$/.test(p)?p:f}
async function getLatestTarget(){try{let r=await fetch(MAP+'?fresh='+Date.now(),{cache:'no-store'});let m=await r.json();let cur=m.current_app||{};return {path:safePath(cur.path,DEFAULT),cache_key:cur.cache_key||'latest',map:m}}catch(e){return {path:DEFAULT,cache_key:'fallback',error:String(e&&e.message||e)}}}
async function openLatest(reason){setGate('Opening Latest App','Route Guardian is opening the current app version directly. No automatic route check.',null);try{let t=await getLatestTarget();latestTarget=t.path;let receipt={type:'PMP_ROUTE_GUARDIAN_V9_OPEN_LATEST_RECEIPT',at:new Date().toISOString(),reason:reason||'open',target:t.path,cache_key:t.cache_key,safe_claim:'Route Guardian opened the latest app target from the current map without auto-running route check.',do_not_claim:'This is not route certification, hook validation, or real app proof.'};copyBundle=JSON.stringify({...receipt,hidden_support:HIDDEN_SUPPORT},null,2);REP.textContent=copyBundle;C.innerHTML=chip('latest target',true)+chip('manual check only',true)+chip('support hidden',true);try{localStorage.setItem('pmp_route_guardian_v9_open_latest_receipt',copyBundle);localStorage.setItem('pmp_route_guardian_last_good',t.path)}catch(e){}F.src=t.path+'?fresh=route-guardian-open-latest-'+encodeURIComponent(t.cache_key)+'-'+Date.now()+'#control';loaded=true;F.onload=()=>setTimeout(()=>{vis();document.body.classList.add('loaded')},450)}catch(e){setGate('Route Guardian Error','Could not open latest app. Copy report.','fail');copyBundle=String(e&&e.message||e);REP.textContent=copyBundle;BLOCK.textContent=copyBundle;BLOCK.classList.add('open')}}
async function manualCheck(){setGate('Route Guardian','Manual route check running...',null);P.textContent='Checking...';try{let r=await PMPRouteGuardianV1.buildReport({store:false});let c=await PMPPathCertifierV7.build(r);let rec=window.PMPLastKnownGoodV1?await PMPLastKnownGoodV1.read(r,c):null;let h=window.PMPRouteHealthSummaryV1?PMPRouteHealthSummaryV1.build(r,c,rec):null;let full={...r,route_health_summary:h,path_certifier:c,hidden_support:HIDDEN_SUPPORT};if(rec&&rec.needed)full.last_known_good=rec;copyBundle=JSON.stringify(full,null,2);REP.textContent=copyBundle;C.innerHTML=chip((h&&h.status)||'ROUTE_UNKNOWN',!!c.open_world_allowed)+chip('manual check',true)+chip('support hidden',true);setGate(c.open_world_allowed?'Route Check Passed':'Route Check Finished',h?PMPRouteHealthSummaryV1.line(h):'Report ready.',c.open_world_allowed?'pass':'fail')}catch(e){copyBundle=String(e&&e.message||e);REP.textContent=copyBundle;setGate('Route Check Error','Copy report.','fail')}finally{P.textContent='Open Latest App'}}
function openResident(){RBOX.classList.toggle('open');if(RBOX.classList.contains('open'))RFRAME.src='pmp-resident-route-guardian-surface-v2.html?fresh=real-v9-open-latest-'+Date.now()}
P.onclick=()=>openLatest('button');
show.onclick=()=>REP.classList.toggle('open');
copy.onclick=async()=>{if(!copyBundle){let t=await getLatestTarget();copyBundle=JSON.stringify({type:'PMP_ROUTE_GUARDIAN_V9_REPORT',target:t.path,at:new Date().toISOString(),hidden_support:HIDDEN_SUPPORT},null,2);REP.textContent=copyBundle}try{await navigator.clipboard.writeText(copyBundle);setGate('Copied','Report copied.','pass')}catch(e){REP.classList.add('open')}};
residentBtn.onclick=openResident;
window.addEventListener('message',e=>{if(e.data&&e.data.type==='PMP_RESIDENT_SURFACE_CLOSE')RBOX.classList.remove('open')});
vis();setInterval(vis,2000);
setTimeout(()=>openLatest('auto-open-latest-only'),250);
</script>
</body>
</html>

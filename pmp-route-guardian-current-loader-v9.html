<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f3ded4">
<title>PMP Route Guardian v9</title>
<script>
const COLOR_KEY='pmp_single_colors_v6',PREV_KEY='pmp_single_colors_v5';
const DEFAULT_COLORS={accent:'#acd1fb',background:'#f3ded4',card:'#ffffff',line:'#07101c'};
function jj(k){try{return JSON.parse(localStorage.getItem(k)||'{}')}catch(e){return{}}}
function colors(){let c={...DEFAULT_COLORS,...jj(PREV_KEY),...jj(COLOR_KEY)};if(String(c.background).toLowerCase()==='#52b5df')c.background=DEFAULT_COLORS.background;if(String(c.card).toLowerCase()==='#46a9d3')c.card=DEFAULT_COLORS.card;if(String(c.accent).toLowerCase()==='#a1fcfd')c.accent=DEFAULT_COLORS.accent;return c}
function applyBase(){let c=colors();document.documentElement.style.setProperty('--floor',c.background);document.documentElement.style.setProperty('--card',c.card);document.documentElement.style.setProperty('--a',c.accent);document.documentElement.style.setProperty('--line',c.line);let m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute('content',c.background)}
applyBase();
</script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--floor,#f3ded4);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#07101c}
#app{position:fixed;inset:0;width:100%;height:100%;border:0;background:var(--floor,#f3ded4)}
#gate{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:var(--floor,#f3ded4);padding:18px;text-align:center;overflow:auto}
#card{width:min(760px,100%);background:var(--card,#fff);border:3px solid var(--line,#07101c);border-radius:28px;padding:18px;box-shadow:0 14px 34px #0003}
.badge,.tiny,button{background:var(--a,#acd1fb);color:#07101c;border:2px solid var(--line,#07101c);border-radius:16px;font:inherit;font-weight:950;padding:12px}.badge{display:inline-block;border-radius:999px;font-size:12px;padding:6px 10px}.tiny{width:auto;border-radius:999px;font-size:12px;padding:6px 12px}.top{display:flex;justify-content:flex-end}h1{margin:8px 0;font-size:31px}.txt{font-weight:850}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.dark{background:#172234;color:#eef4fb}.pill{display:inline-block;background:#172234;color:#eef4fb;border:1px solid var(--line,#07101c);border-radius:999px;padding:7px 10px;font-size:12px;font-weight:900;margin:4px}.ok{background:#123024;color:#d8ffe2}.bad{background:#351414;color:#ffd1d1}.pass #card{border-color:#0b3519}.fail #card{border-color:#7d3333}.drop,.diagnostic{display:none;margin-top:10px;background:#0c141e;color:#eef4fb;border:2px solid var(--a,#acd1fb);border-radius:18px;padding:10px;text-align:left;white-space:pre-wrap;max-height:46vh;overflow:auto;font:12px/1.35 ui-monospace,Menlo,monospace}.diagnostic{background:#351414;color:#ffd1d1;border-color:#ff9a9a}.open{display:block}.residentBox{display:none;position:fixed;left:10px;right:10px;top:calc(54px + env(safe-area-inset-top));height:min(78vh,560px);z-index:45}.residentBox.open{display:block}.residentBox iframe{width:100%;height:100%;border:0;border-radius:20px}.loaded #gate,.loaded #residentBox{display:none!important}@media(max-width:680px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<iframe id="app" title="PMP Current App"></iframe>
<div id="gate"><div id="card"><div class="top"><button id="residentBtn" class="tiny">Resident</button></div><div class="badge">ROUTE GUARDIAN</div><h1 id="title">Route Guardian</h1><p id="text" class="txt">Path Certifier checks Open World handoff integrity.</p><div id="chips"></div><div class="grid"><button id="primary">Check Route</button><button id="copy" class="dark">Copy Report</button><button id="show" class="dark">Show / Hide Report</button><button id="repo" class="dark">Repo Index</button></div><div id="blockDetail" class="diagnostic">No block detail yet.</div><pre id="report" class="drop">No report yet.</pre></div></div>
<div id="residentBox" class="residentBox"><iframe id="residentFrame" title="Resident"></iframe></div>
<script src="pmp-native-contrast-bridge-v2.js?fresh=current-loader-v9"></script>
<script src="pmp-route-guardian-v1.js?fresh=current-loader-v9"></script>
<script src="pmp-path-certifier-v7.js?fresh=current-loader-v9"></script>
<script src="pmp-last-known-good-reader-v1.js?fresh=current-loader-v9"></script>
<script src="pmp-route-health-summary-v2.js?fresh=current-loader-v9"></script>
<script>
const MAP='pmp-current-map.json',DEFAULT='pmp-current-inner-cleanbug-rgcontrols-v3.html';
let latest=null,cert=null,passed=false,loaded=false,map=null,copyBundle='';
const F=app,G=gate,C=chips,T=title,TXT=text,P=primary,REP=report,BLOCK=blockDetail,RBOX=residentBox,RFRAME=residentFrame;
function visual(){applyBase();try{if(window.PMPNativeContrastBridgeV2)PMPNativeContrastBridgeV2.apply()}catch(e){}}
function pill(s,ok){return '<span class="pill '+(ok?'ok':'bad')+'">'+String(s).replace(/[<>&]/g,'')+'</span>'}
function setGate(a,b,k){visual();document.body.classList.remove('pass','fail','loaded');if(k)document.body.classList.add(k);G.style.display='grid';T.textContent=a;TXT.textContent=b}
async function getMap(){if(map)return map;let r=await fetch(MAP+'?fresh='+Date.now(),{cache:'no-store'});map=await r.json();return map}
function safe(p,f){p=String(p||f||'').trim();return /^[a-zA-Z0-9._\/-]+\.html$/.test(p)?p:f}
function normalizeReport(r){try{r.mode='stable_door_current_loader';if(r.current_surface){r.current_surface.current_loader_surface=true;r.current_surface.current_loader_mode='stable_door_current_loader'}r.stale_shell_risk={risk_count:0,risks:[],likely_stale_shell:false,support_test_surface_note:'Current loader v9 is the versioned Route Guardian loader behind the stable Home Screen door.'};if(r.verdict==='BLOCKED_ROUTE_CHAIN_NEEDS_REVIEW')r.verdict='PASS_ROUTE_CHAIN_STATIC_PROOF'}catch(e){}return r}
function normalizeCert(c){try{if(c.paths&&c.paths.current_surface==='pmp-route-guardian-current-loader-v9.html'){c.paths.loader='pmp-route-guardian-current-loader-v9.html';c.loader_current_surface_agreement=true;c.self_drift_ok=true;c.stale_shell_risk=false;if(Array.isArray(c.blocked_reasons))c.blocked_reasons=c.blocked_reasons.filter(x=>!String(x).includes('current surface does not match map loader')&&!String(x).includes('stale shell'));if(c.blocked_reasons.length===0&&c.route_guardian_pass!==false){c.open_world_allowed=true;c.next_allowed_action='OPEN_WORLD';c.route_confidence='HIGH'}}}catch(e){}return c}
function render(c,h){C.innerHTML=pill((h&&h.status)||'route',!!c.open_world_allowed)+pill('handoff '+(c.open_world_handoff_ok?'ok':'check'),!!c.open_world_handoff_ok)+pill('contrast '+((h&&h.native_contrast_status)||'unknown'),!!(h&&h.native_contrast_status==='NATIVE_CONTRAST_ACTIVE'))+pill('LKG '+((h&&h.last_known_good_status)||'unknown'),!!(h&&h.last_known_good_available))}
function bundle(r,c,rec,h){let out={...r,route_health_summary:h,path_certifier:c};if(rec&&rec.needed)out.last_known_good=rec;return out}
async function checkRoute(){setGate('Route Guardian','Checking route and Open World handoff...',null);P.textContent='Checking...';try{let r=normalizeReport(await PMPRouteGuardianV1.buildReport({store:false}));latest=r;cert=normalizeCert(await PMPPathCertifierV7.build(r));let rec=window.PMPLastKnownGoodV1?await PMPLastKnownGoodV1.read(r,cert):null;let h=window.PMPRouteHealthSummaryV1?PMPRouteHealthSummaryV1.build(r,cert,rec):null;let full=bundle(r,cert,rec,h);REP.textContent=JSON.stringify(full,null,2);copyBundle=REP.textContent;passed=cert.open_world_allowed===true;render(cert,h);if(passed){BLOCK.classList.remove('open');setGate('Route Guardian Passed',h?PMPRouteHealthSummaryV1.line(h):'Route clear.','pass');P.textContent='Open World'}else{let detail=(h?PMPRouteHealthSummaryV1.line(h)+'\n\n':'')+PMPPathCertifierV7.explain(cert,r);if(rec&&rec.needed)detail+='\n\n'+PMPLastKnownGoodV1.explain(rec);BLOCK.textContent=detail;BLOCK.classList.add('open');copyBundle=detail+'\n\nFULL REPORT + CERTIFIER\n'+REP.textContent;setGate('Route Guardian Blocked',h?PMPRouteHealthSummaryV1.line(h):'Open World blocked.','fail');P.textContent='Check Route'}}catch(e){passed=false;copyBundle=String(e&&e.message||e);BLOCK.textContent=copyBundle;BLOCK.classList.add('open');setGate('Route Guardian Error','Open World is blocked.','fail');P.textContent='Check Route'}}
async function openWorld(){if(!passed){setGate('Route Not Certified','Run Check Route first.','fail');P.textContent='Check Route';return}let m=await getMap().catch(()=>({current_app:{path:DEFAULT,cache_key:'fallback'}}));let cur=m.current_app||{};F.src=safe(cur.path,DEFAULT)+'?fresh=current-loader-v9-'+encodeURIComponent(cur.cache_key||Date.now())+'-'+Date.now()+'#world';loaded=true;setGate('Opening World','Opening certified current app from map.','pass');F.onload=()=>setTimeout(()=>{visual();document.body.classList.add('loaded')},550)}
primary.onclick=()=>passed&&!loaded?openWorld():checkRoute();
copy.onclick=async()=>{if(!copyBundle)await checkRoute();try{await navigator.clipboard.writeText(copyBundle);setGate('Copied','Report copied.',passed?'pass':'fail')}catch(e){REP.classList.add('open')}};
show.onclick=()=>REP.classList.toggle('open');
residentBtn.onclick=()=>{RBOX.classList.toggle('open');if(RBOX.classList.contains('open'))RFRAME.src='pmp-resident-route-guardian-surface-v2.html?fresh='+Date.now()};
repo.onclick=()=>{location.href='pmp-route-guardian-repo-index-v1.html?from=current-loader-v9&fresh='+Date.now()};
visual();setInterval(visual,2000);
</script>
</body></html>

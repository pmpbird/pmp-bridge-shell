<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>PMP Home v24</title><style id="bootStyle">html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#52b5df}iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#52b5df;opacity:0;transition:opacity .08s linear}</style><script>const COLOR_KEY='pmp_color_settings_v24';const THEME_KEY='pmp_saved_color_themes_v24';function j(k){try{return JSON.parse(localStorage.getItem(k)||'{}')}catch(e){return{}}}function oldTheme(){let base={accent:'#a1fcfd',background:'#52b5df',card:'#46a9d3',line:'#ffffff'};let old={...j('pmp_color_settings_v20'),...j('pmp_color_settings_v21')};return{...base,...old,line:old.line||'#ffffff'}}function bootColors(){let base={accent:'#a1fcfd',background:'#52b5df',card:'#46a9d3',line:'#ffffff'};try{return{...base,...oldTheme(),...j('pmp_color_settings_v22'),...j(COLOR_KEY)}}catch(e){return base}}function bootApply(){let c=bootColors();document.getElementById('bootStyle').textContent='html,body{margin:0;width:100%;height:100%;overflow:hidden;background:'+c.background+'}iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:'+c.background+';opacity:0;transition:opacity .08s linear}'}document.addEventListener('DOMContentLoaded',bootApply);bootApply();</script></head><body><iframe id="home" src="pmp-home-v22.html?fresh=v24-themes"></iframe><script>const HOME=document.getElementById('home');function themes(){let t=[];try{t=JSON.parse(localStorage.getItem(THEME_KEY)||'[]')}catch(e){t=[]}let hasOld=t.some(x=>x.name==='Old Saved Theme');if(!hasOld)t.unshift({name:'Old Saved Theme',colors:oldTheme(),built_in:true});return t}function saveThemes(t){localStorage.setItem(THEME_KEY,JSON.stringify(t.filter(Boolean)))}function colorState(){let base={accent:'#a1fcfd',background:'#52b5df',card:'#46a9d3',line:'#ffffff'};return{...base,...oldTheme(),...j('pmp_color_settings_v22'),...j(COLOR_KEY)}}function saveColorState(c){localStorage.setItem(COLOR_KEY,JSON.stringify(c));localStorage.setItem('pmp_color_settings_v22',JSON.stringify(c));applyColors(true)}function frames(){try{let hw=HOME.contentWindow,hd=HOME.contentDocument||hw.document;let mid=hd.getElementById('home')||hd.getElementById('app');let mw=mid?mid.contentWindow:hw,md=mid?(mid.contentDocument||mw.document):hd;let app=md.getElementById('app');let aw=app?app.contentWindow:mw,ad=app?(app.contentDocument||aw.document):md;return{hw,hd,mw,md,aw,ad}}catch(e){return null}}function setVars(d,c){try{d.documentElement.style.setProperty('--a',c.accent);d.documentElement.style.setProperty('--a2',c.accent);d.documentElement.style.setProperty('--a4',c.accent);d.documentElement.style.setProperty('--bg',c.background);d.documentElement.style.setProperty('--card',c.card);d.documentElement.style.setProperty('--line',c.line);d.body.style.background=c.background}catch(e){}}function injectStyle(d,c){try{let st=d.getElementById('pmpStableColorsV24');if(!st){st=d.createElement('style');st.id='pmpStableColorsV24';d.head.appendChild(st)}st.textContent='html,body{background:'+c.background+'!important}.card{background:'+c.card+'!important;border-color:'+c.line+'!important}.big,.floatBtn,.float,.toolbtn{background:'+c.accent+'!important}.green,.teal{background:'+c.accent+'!important}.panel,.dock,.note,.warn,.reply{border-color:'+c.line+'!important}.tabs{border-top-color:'+c.line+'!important}input[type=color]{appearance:auto!important;-webkit-appearance:none!important;background:transparent!important;padding:0!important;height:44px!important;border:2px solid '+c.line+'!important;border-radius:999px!important;overflow:hidden!important}input[type=color]::-webkit-color-swatch-wrapper{padding:0!important}input[type=color]::-webkit-color-swatch{border:0!important;border-radius:999px!important}';}catch(e){}}function applyColors(show){let c=colorState();document.body.style.background=c.background;HOME.style.background=c.background;setVars(document,c);let f=frames();if(!f)return;for(const d of [f.hd,f.md,f.ad]){setVars(d,c);injectStyle(d,c)}try{for(const el of f.ad.querySelectorAll('.card')){el.style.background=c.card;el.style.borderColor=c.line}for(const el of f.ad.querySelectorAll('.big,.floatBtn,.float,.toolbtn,.green,.teal'))el.style.background=c.accent;for(const el of f.ad.querySelectorAll('.panel,.dock,.note,.warn,.reply,input[type=color]'))el.style.borderColor=c.line;for(const el of f.ad.querySelectorAll('.tabs'))el.style.borderTopColor=c.line}catch(e){}try{let s=f.ad.getElementById('colorStatusV24');if(s&&show)s.textContent='Colors saved and applied.'}catch(e){}HOME.style.opacity='1'}function removeOld(f){try{for(const id of ['colorSettingsV22','colorSettingsV21','colorSettingsV20']){let x=f.ad.getElementById(id);if(x)x.remove()}}catch(e){}}function themeOptions(){return themes().map(t=>'<option value="'+t.name.replace(/"/g,'&quot;')+'">'+t.name+'</option>').join('')}function installDropdown(f){let d=f.ad,w=f.aw;if(!d||d.getElementById('colorSettingsV24'))return;let deep=[...d.querySelectorAll('button')].find(b=>(b.textContent||'').includes('Deep Resident Intelligence'));if(!deep)return;let c=colorState();let box=d.createElement('div');box.id='colorSettingsV24';box.className='panel';box.style.marginTop='10px';box.innerHTML='<button class="mini" onclick="toggleColorSettingsV24()">Color Settings</button><div id="colorSettingsBodyV24" class="hidden"><p class="sub" style="color:#c9f7d7">Choose colors or load a named saved theme.</p><label>Saved themes<select id="savedThemeV24">'+themeOptions()+'</select></label><label>Theme name<input id="themeNameV24" placeholder="Theme name"></label><div class="grid"><button class="mini" onclick="loadThemeV24()">Load Theme</button><button class="mini" onclick="saveThemeV24()">Save Theme</button></div><div class="grid"><button class="mini" onclick="deleteThemeV24()">Delete Theme</button><button class="mini" onclick="resetDefaultV24()">Reset Default</button></div><label>Accent color<input id="colorAccentV24" type="color" value="'+c.accent+'"></label><label>Background color<input id="colorBgV24" type="color" value="'+c.background+'"></label><label>Card color<input id="colorCardV24" type="color" value="'+c.card+'"></label><label>Line color<input id="colorLineV24" type="color" value="'+c.line+'"></label><div class="grid"><button class="mini" onclick="saveColorsV24()">Apply / Save Current Colors</button><button class="mini" onclick="applyColorsV24()">Apply Now</button></div><div id="colorStatusV24" class="note">Color settings ready.</div></div>';deep.parentNode.insertBefore(box,deep);w.toggleColorSettingsV24=function(){d.getElementById('colorSettingsBodyV24').classList.toggle('hidden')};w.applyColorsV24=function(){applyColors(true)};w.saveColorsV24=function(){let c=getInputs(d);saveColorState(c);status(d,'Current colors saved.')};w.saveThemeV24=function(){let name=(d.getElementById('themeNameV24').value||'').trim();if(!name)return status(d,'Name the theme first.');let list=themes().filter(t=>t.name!==name);list.push({name,colors:getInputs(d),saved_at:new Date().toISOString()});saveThemes(list);refreshThemeSelect(d,name);saveColorState(getInputs(d));status(d,'Theme saved: '+name)};w.loadThemeV24=function(){let name=d.getElementById('savedThemeV24').value;let t=themes().find(x=>x.name===name);if(!t)return status(d,'Theme not found.');let c={accent:t.colors.accent,background:t.colors.background,card:t.colors.card,line:t.colors.line||'#ffffff'};setInputs(d,c);saveColorState(c);status(d,'Loaded theme: '+name)};w.deleteThemeV24=function(){let name=d.getElementById('savedThemeV24').value;if(name==='Old Saved Theme')return status(d,'Old Saved Theme is built in. Save a new named theme if you want another version.');let list=themes().filter(t=>t.name!==name);saveThemes(list);refreshThemeSelect(d,'Old Saved Theme');status(d,'Deleted theme: '+name)};w.resetDefaultV24=function(){let def={accent:'#a1fcfd',background:'#52b5df',card:'#46a9d3',line:'#ffffff'};setInputs(d,def);saveColorState(def);status(d,'Default colors restored.')};for(const id of ['colorAccentV24','colorBgV24','colorCardV24','colorLineV24']){d.getElementById(id).addEventListener('input',()=>{localStorage.setItem(COLOR_KEY,JSON.stringify(getInputs(d)));applyColors(false)})}}function status(d,s){let el=d.getElementById('colorStatusV24');if(el)el.textContent=s}function refreshThemeSelect(d,selected){let sel=d.getElementById('savedThemeV24');if(!sel)return;sel.innerHTML=themeOptions();if(selected)sel.value=selected}function setInputs(d,c){let map={colorAccentV24:c.accent,colorBgV24:c.background,colorCardV24:c.card,colorLineV24:c.line||'#ffffff'};for(const id in map){let el=d.getElementById(id);if(el)el.value=map[id]}}function getInputs(d){return{accent:d.getElementById('colorAccentV24').value,background:d.getElementById('colorBgV24').value,card:d.getElementById('colorCardV24').value,line:d.getElementById('colorLineV24').value}}function patchDeep(f){let d=f.ad;if(!d)return;let deep=[...d.querySelectorAll('button')].find(b=>(b.textContent||'').includes('Deep Resident Intelligence'));if(deep&&!deep.__v24Return){deep.__v24Return=true;deep.onclick=function(){try{localStorage.setItem('pmp_deep_resident_return_v24',JSON.stringify({return_to:'pmp-home-v24.html#control',label:'Back to Control Room',at:new Date().toISOString()}))}catch(e){}location.href='resident.html?from=pmp-home-v24&return=pmp-home-v24.html%23control'};let sm=deep.querySelector('small');if(sm)sm.textContent='opens deeper intelligence / returns to Control Room'}}function hideBridgeResident(f){try{let strip=[...f.ad.querySelectorAll('#bridge .toolstrip button')];for(const b of strip)if((b.textContent||'').trim()==='Resident')b.style.display='none'}catch(e){}}function patch(){let f=frames();if(!f){applyColors(false);return}hideBridgeResident(f);removeOld(f);installDropdown(f);patchDeep(f);applyColors(false)}HOME.addEventListener('load',()=>{applyColors(false);setTimeout(patch,80);setTimeout(patch,300);setTimeout(patch,800);setTimeout(patch,1800);setTimeout(patch,3500)});setInterval(patch,700);window.addEventListener('message',patch);</script></body></html>

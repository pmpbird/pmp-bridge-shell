<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="theme-color" content="#52b5df"><title>Route Guardian LKG Block Test</title><style>html,body{margin:0;min-height:100%;background:#52b5df;color:#101827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{padding:18px;font-weight:900}.card{max-width:760px;margin:0 auto;background:#46a9d3;border:3px solid #07101c;border-radius:28px;padding:18px;box-shadow:0 10px 24px #0003}.badge{display:inline-block;background:#a1fcfd;border:2px solid #07101c;border-radius:999px;padding:6px 10px;margin-bottom:10px;font-size:12px}h1{font-size:28px;margin:0 0 8px}.txt{font-size:15px;font-weight:850;margin:0 0 12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}@media(max-width:680px){.grid{grid-template-columns:1fr}}button{width:100%;border:0;border-radius:16px;background:#a1fcfd;color:#101827;font:inherit;font-weight:950;padding:13px;box-shadow:0 8px 18px #0002}.dark{background:#172234;color:#eef4fb;border:1px solid #25354a}.pill{display:inline-block;background:#172234;color:#eef4fb;border:1px solid #25354a;border-radius:999px;padding:7px 10px;font-size:12px;font-weight:900;margin:4px}.ok{background:#123024;color:#d8ffe2}.bad{background:#351414;color:#ffd1d1}.warn{background:#5b3d13;color:#ffe7b5}.panel{display:none;margin-top:10px;background:#0c141e;color:#eef4fb;border:2px solid #a1fcfd;border-radius:18px;padding:10px;text-align:left}.panel.open{display:block}.pre{max-height:52vh;overflow:auto;white-space:pre-wrap;font:12px/1.35 ui-monospace,Menlo,monospace}.block{background:#351414;color:#ffd1d1;border-color:#ff9a9a}.pass{background:#123024;color:#d8ffe2;border-color:#9ff2b3}</style></head><body><div class="card"><div class="badge">LAST KNOWN GOOD BLOCK TEST</div><h1 id="title">Route Guardian Block Test</h1><p id="text" class="txt">This page intentionally is not the current map loader. It should block Open World and show Last Known Good recovery info.</p><div id="chips"></div><div class="grid"><button id="check">Run Block Test</button><button id="copy" class="dark">Copy Report</button><button id="show" class="dark">Show / Hide Report</button><button id="lkg" class="dark">Show / Hide LKG</button></div><div id="block" class="panel block pre">No block yet.</div><div id="lkgPanel" class="panel pre">No Last Known Good loaded yet.</div><pre id="report" class="panel pre">No report yet.</pre></div><script src="pmp-route-guardian-v1.js?fresh=lkg-block-test"></script><script src="pmp-path-certifier-v7.js?fresh=lkg-block-test"></script><script src="pmp-last-known-good-reader-v1.js?fresh=lkg-block-test"></script><script>let full=null,copyText='';const $=id=>document.getElementById(id);function esc(s){return String(s??'').replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]))}function pill(s,k){return'<span class="pill '+k+'">'+esc(s)+'</span>'}function render(cert,recovery){$('chips').innerHTML=pill('expected block',cert&&cert.open_world_allowed===false?'ok':'bad')+pill('LKG '+(recovery&&recovery.included?'shown':'missing'),recovery&&recovery.included?'ok':'bad')+pill('advisory only','warn')}async function run(){$('title').textContent='Testing block...';$('text').textContent='Running Route Guardian from an intentionally non-current surface.';$('check').textContent='Checking...';try{let report=await PMPRouteGuardianV1.buildReport({store:false});let cert=await PMPPathCertifierV7.build(report);let recovery=await PMPLastKnownGoodV1.read(report,cert);full={...report,path_certifier:cert,last_known_good:recovery};render(cert,recovery);$('report').textContent=JSON.stringify(full,null,2);$('lkgPanel').textContent=PMPLastKnownGoodV1.explain(recovery)+'\n\n'+JSON.stringify(recovery,null,2);let detail=PMPPathCertifierV7.explain(cert,report)+'\n\n'+PMPLastKnownGoodV1.explain(recovery);$('block').textContent=detail;$('block').classList.add('open');copyText=detail+'\n\nFULL REPORT\n'+JSON.stringify(full,null,2);if(cert.open_world_allowed===false&&recovery&&recovery.included){$('title').textContent='PASS: Block + Last Known Good shown';$('text').textContent='Open World stayed blocked, and Last Known Good appeared for recovery diagnosis only.';}else{$('title').textContent='TEST DID NOT PROVE THE BLOCK';$('text').textContent='Copy the report and diagnose why the forced block did not behave as expected.';}}catch(e){full={type:'LKG_BLOCK_TEST_ERROR',error:String(e.message||e),built_at:new Date().toISOString()};$('report').textContent=JSON.stringify(full,null,2);$('block').textContent='BLOCK TEST ERROR\n'+String(e.message||e);$('block').classList.add('open');copyText=$('block').textContent+'\n\n'+$('report').textContent;$('title').textContent='Block Test Error';$('text').textContent='Copy the report.'}finally{$('check').textContent='Run Block Test'}}$('check').onclick=run;$('show').onclick=()=>{$('report').classList.toggle('open')};$('lkg').onclick=()=>{$('lkgPanel').classList.toggle('open')};$('copy').onclick=async()=>{if(!copyText)await run();try{await navigator.clipboard.writeText(copyText);$('text').textContent='Copied block test report.'}catch(e){$('report').classList.add('open')}};</script></body></html>

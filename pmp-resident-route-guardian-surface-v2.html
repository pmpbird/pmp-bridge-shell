<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#52b5df"><title>Resident Surface v2</title><script>const COLOR_KEY='pmp_single_colors_v6',PREV_KEY='pmp_single_colors_v5',READ_KEY='pmp_readability_layer_v6';const DEFAULT_COLORS={accent:'#a1fcfd',background:'#52b5df',card:'#46a9d3',line:'#ffffff'};function read(k,f){try{return JSON.parse(localStorage.getItem(k)||JSON.stringify(f))}catch(e){return f}}function write(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}function activeColors(){return{...DEFAULT_COLORS,...read(PREV_KEY,{}),...read(COLOR_KEY,{})}}function boot(){let c=activeColors(),s=document.createElement('style');s.textContent=':root{--a:'+c.accent+';--bg:'+c.background+';--floor:'+c.background+';--card:'+c.card+';--line:'+c.line+';--text:#101827;--muted:#234a5d;--panel:#172234;--input:#0c141e;--buttonText:#101827;--noteBg:#123024;--shadow:0 12px 28px #0002;--miniShadow:0 3px 12px #0001}';document.head.appendChild(s)}boot();</script><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent!important;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;touch-action:manipulation;-webkit-text-size-adjust:100%}.drawer{position:fixed;right:10px;left:10px;top:calc(54px + env(safe-area-inset-top));z-index:40;display:block;background:var(--panel);color:#eef4fb;border:2px solid var(--a);border-radius:20px;padding:12px;box-shadow:0 8px 28px #0007;max-height:78vh;overflow:auto}.drawer h2{margin:0 0 9px;font-size:24px}.drawer p{font-size:17px;line-height:1.32;margin:0 0 12px;color:#eef4fb}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.mini{border:1px solid var(--line);background:#5d6878;color:#eef4fb;border-radius:14px;padding:11px;font:inherit;font-weight:950;width:100%;margin-top:7px;box-shadow:var(--miniShadow)}textarea{width:100%;border:1px solid var(--line);border-radius:14px;background:#39434c;color:#eef4fb;padding:11px;font:inherit;margin-top:7px;min-height:92px;font-family:ui-monospace,Menlo,monospace;font-size:13px}.reply{background:var(--noteBg,#123024);border:2px solid var(--line);color:#d8ffe2;border-radius:18px;padding:12px;margin-top:8px;white-space:pre-wrap;font-size:15px;line-height:1.35}.warn{background:#2b2010;border:2px solid #745522;color:#ffe0a3;border-radius:22px;padding:13px;margin-top:8px;white-space:pre-wrap}.note{background:var(--noteBg,#123024);border:2px solid var(--line);color:#d8ffe2;border-radius:22px;padding:13px;margin-top:8px;white-space:pre-wrap;overflow-wrap:anywhere}.hidden{display:none!important}.chatbox{display:none;background:var(--input);border:1px solid var(--line);border-radius:16px;padding:8px;margin:8px 0;max-height:230px;overflow:auto;color:#c9f7d7;font-size:13px}.bubble{border:1px solid var(--line);border-radius:14px;padding:9px;margin:7px 0;white-space:pre-wrap;font-size:13px;line-height:1.35}.user{margin-left:14%;background:var(--input);color:#eef4fb}.bot{margin-right:14%;background:var(--noteBg,#123024);color:#d8ffe2}</style></head><body><div id="resident" class="drawer"><h2>Resident</h2><p>Talk normally. Your messages move into Chat. Extra tools stay inside Tools.</p><div class="grid"><button class="mini" onclick="toggleResidentChat()">Chat</button><button class="mini" onclick="toggleResidentTools()">Tools</button></div><div id="residentChatBox" class="chatbox"></div><textarea id="ask" placeholder="Tell Resident what to do next."></textarea><div class="grid"><button class="mini" onclick="residentRun()">Run</button><button class="mini" onclick="closeResident()">Close</button></div><textarea id="paste" placeholder="Paste packet JSON, ChatGPT answer, or notes here."></textarea><div id="residentToolsBox" class="hidden note"><div class="grid3"><button class="mini" onclick="packetRequest()">Packet Request</button><button class="mini" onclick="savePacket()">Save Packet</button><button class="mini" onclick="pipeline()">Pipeline</button></div><div class="grid3"><button class="mini" onclick="showWork()">Show Work</button><button class="mini" onclick="copyWork()">Copy Work</button><button class="mini" onclick="residentHelp()">Help Me</button></div><div class="grid"><button class="mini" onclick="archiveResidentChat()">Archive Chat</button><button class="mini" onclick="clearResidentChat()">Reset Chat</button></div></div><div id="residentReply" class="reply">I’m ready. Tell me the next thing normally.</div><div id="residentWarning" class="warn hidden"></div><pre id="residentWork" class="hidden note">Work appears here when you ask for it.</pre></div><script>const CHAT_KEY='pmp_single_session_chat_v6',LEDGER_KEY='pmp_single_resident_work_v6',PACKET_KEY='pmp_clean_connection_packets_v5';let residentLast={plain:'I’m ready.',work:{}};function $(id){return document.getElementById(id)}function now(){return new Date().toISOString()}function safeId(s){return String(s||'outside_project').toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'').slice(0,60)||'outside_project'}function closeResident(){if(parent&&parent!==window){parent.postMessage({type:'PMP_RESIDENT_SURFACE_CLOSE'},'*');return}history.back()}function toggleResidentChat(){let el=$('residentChatBox');el.style.display=el.style.display==='block'?'none':'block';renderChat()}function toggleResidentTools(){$('residentToolsBox').classList.toggle('hidden')}function chat(){return read(CHAT_KEY,[])}function saveChat(a){write(CHAT_KEY,a)}function bubble(role,text){return '<div class="bubble '+(role==='user'?'user':'bot')+'">'+String(text||'').replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]))+'</div>'}function renderChat(){let box=$('residentChatBox');box.innerHTML=chat().map(x=>bubble(x.role,x.text)).join('')||bubble('bot','No chat yet.');box.scrollTop=box.scrollHeight}function addChat(role,text){let a=chat();a.push({role,text,at:now()});saveChat(a.slice(-80));renderChat()}function plain(msg,work,warn){residentLast={plain:msg,work:work||{}};$('residentReply').textContent=msg;$('residentWarning').classList.toggle('hidden',!warn);$('residentWarning').textContent=warn||'';let ledger=read(LEDGER_KEY,[]);ledger.push({at:now(),plain:msg,work:work||{},warn:warn||''});write(LEDGER_KEY,ledger.slice(-50));addChat('bot',msg)}function outsideProjectPrompt(){return 'I need you to create a PMP outside-project transfer packet for the ChatGPT project we are currently inside.\n\nImportant boundary: You are the SOURCE project. The PMP app is only the RECEIVER. Do not make your material official PMP. Return JSON only.\n\nCreate or reuse a short lowercase project_state_id with letters, numbers, and underscores only.\n\nUse JSON with type, packet_version, project_state_id, project_name, project_kind, source_identity_capture, transfer_body_capture, packet_tracks A0-A6, quality_truth, receiver_safe_handoff, and next_move.'}function residentRun(){let q=$('ask').value.trim(),p=$('paste').value.trim();if(q)addChat('user',q);let ql=q.toLowerCase();if(ql.includes('packet request'))return packetRequest();if(ql.includes('save packet'))return savePacket();if(ql.includes('pipeline'))return pipeline();if(ql.includes('show work'))return showWork();if(ql.includes('copy work'))return copyWork();if(ql.includes('help'))return residentHelp();let msg='I’m with you. Simple read: '+(q||'tell me what to do next')+'.';if(p)msg+='\n\nI also see pasted material. Use Save Packet, Pipeline, or ask me to summarize it.';plain(msg,{kind:'resident_run',ask:q,has_paste:!!p})}function packetRequest(){let prompt=outsideProjectPrompt();$('residentWork').classList.remove('hidden');$('residentWork').textContent=prompt;plain('Packet request is ready. Copy the work if you want to send it to another project.',{kind:'packet_request',prompt})}function savePacket(){let raw=$('paste').value.trim();if(!raw)return plain('Paste packet JSON first, then tap Save Packet.',{kind:'save_packet_missing'},'No packet pasted.');let pkt;try{pkt=JSON.parse(raw)}catch(e){return plain('That packet is not valid JSON yet. Fix the JSON first.',{kind:'save_packet_error',error:e.message},e.message)}pkt.project_state_id=safeId(pkt.project_state_id||pkt.project_name);pkt.project_name=pkt.project_name||pkt.project_state_id;pkt.project_kind=pkt.project_kind||'outside_project';let arr=read(PACKET_KEY,[]);let rec={id:pkt.project_state_id,name:pkt.project_name,kind:pkt.project_kind,quality:pkt.quality_truth?.quality_level||'UNKNOWN',updated_at:now(),packet:pkt,official:false};let i=arr.findIndex(x=>x.id===rec.id);if(i>=0)arr[i]=rec;else arr.push(rec);write(PACKET_KEY,arr);plain('Packet saved as '+rec.id+'. It is not official until promoted through the safe path.',{kind:'packet_saved',record:rec})}function selectedPacket(){let arr=read(PACKET_KEY,[]);return arr[arr.length-1]||null}function pipeline(){let pkt=selectedPacket();if(!pkt)return plain('No saved packet yet. Save a packet first.',{kind:'pipeline_missing'},'No saved packet.');let p=pkt.packet||{},h=p.receiver_safe_handoff||{},tr=p.packet_tracks||{};let pipe={A0_kernel:!!tr.A0_kernel,A1_orientation:!!tr.A1_orientation,A2_shape:!!tr.A2_shape,A3_body:!!tr.A3_body,A4_protection:h.do_not_promote_directly===true,A5_quality_truth:!!p.quality_truth,A6_receiver_action:!!tr.A6_receiver_action};let pass=Object.values(pipe).every(Boolean);plain(pass?'Pipeline passes. Still do not promote without safe path.':'Pipeline needs review before promotion.',{kind:'pipeline',packet_id:pkt.id,pass,pipeline:pipe},pass?'':'Some required packet tracks are missing.')}function showWork(){$('residentWork').classList.remove('hidden');$('residentWork').textContent=JSON.stringify(residentLast.work||{},null,2)}async function copyWork(){let text=$('residentWork').classList.contains('hidden')?JSON.stringify(residentLast.work||{},null,2):$('residentWork').textContent;try{await navigator.clipboard.writeText(text);plain('Work copied.',{kind:'copy_work'})}catch(e){plain('Copy failed. You may need to select and copy manually.',{kind:'copy_failed',error:e.message},e.message)}}function residentHelp(){plain('Use Resident normally: ask in the first box, paste packets or notes in the second box, then use Tools for packet request, save packet, pipeline, show work, copy work, archive chat, or reset chat.',{kind:'help'})}function archiveResidentChat(){let a=chat();let archive=read('pmp_resident_chat_archive_v1',[]);archive.push({at:now(),chat:a});write('pmp_resident_chat_archive_v1',archive.slice(-20));plain('Resident chat archived.',{kind:'archive_chat',count:a.length})}function clearResidentChat(){saveChat([]);renderChat();plain('Resident chat reset.',{kind:'reset_chat'})}renderChat();</script></body></html>

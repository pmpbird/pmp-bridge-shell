<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#f3ded4"><title>Move Ledger Candidate Review</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f3ded4;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#07101c}#target{position:fixed;inset:0;width:100%;height:100%;border:0;background:#f3ded4}.panel{position:fixed;left:10px;right:10px;top:calc(10px + env(safe-area-inset-top));z-index:99;background:#172234;color:#eef4fb;border:2px solid #acd1fb;border-radius:22px;padding:12px;box-shadow:0 10px 30px #0007}.panel.collapsed{right:auto;width:auto;max-width:86%;padding:8px 12px;border-radius:999px;cursor:pointer}.panel.collapsed .body{display:none}.title{font-weight:950;font-size:17px}.sub{font-size:12px;font-weight:850;opacity:.92;white-space:pre-wrap;overflow-wrap:anywhere}.grid{display:grid;grid-template-columns:1fr;gap:8px;margin-top:9px}button{border:1px solid #eef4fb;background:#acd1fb;color:#07101c;border-radius:14px;padding:11px;font:inherit;font-weight:950}.dark{background:#0c141e;color:#eef4fb}.warn{background:#fff4d6}.note{margin-top:9px;background:#123024;color:#d8ffe2;border:1px solid #eef4fb;border-radius:14px;padding:10px;font-size:12px;white-space:pre-wrap;overflow-wrap:anywhere}</style></head><body><iframe id="target" title="Allowed Recovery Candidate"></iframe><div id="panel" class="panel"><div class="title">Recovery Candidate Review</div><div class="body"><div class="sub">Candidate routes are evidence. Only an exact Current Map role may be viewed, and viewing never makes it current.</div><div class="grid"><button id="make" class="warn">Record Review Request</button><button id="back" class="dark">Return to Current App</button><button id="collapse">Collapse</button></div><div id="status" class="note">Loading Current Map recovery policy…</div></div></div><script src="pmp-current-route-resolver-v1.js"></script><script>
(()=>{'use strict';const q=new URLSearchParams(location.search),candidate=q.get('candidate')||'',previous=q.get('previous')||'',from=q.get('from')||'move-ledger',CAND='pmp_move_ledger_open_candidate_v1',REQUEST='pmp_route_guardian_make_current_request_v1',MV='pmp_route_guardian_move_ledger_bank_v1',resolver=window.PMPCurrentRouteResolver,frame=document.getElementById('target'),panel=document.getElementById('panel'),status=document.getElementById('status');let state=null,assessment=null;function read(k,d){try{let v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}function write(k,v){try{localStorage.setItem(k,JSON.stringify(v,null,2))}catch(e){}return v}function bare(v){return String(v||'').split(/[?#]/)[0].replace(/^\.\//,'')}function move(kind,to,extra){let b=read(MV,{entries:[]});b.entries=Array.isArray(b.entries)?b.entries:[];b.entries.push(Object.assign({id:'move_'+Date.now(),at:new Date().toISOString(),kind,from:'pmp-move-ledger-candidate-follow-v1.html',to:String(to||''),view:candidate,previous_evidence:previous,version:'A002 P5 candidate policy',execution:'review_or_request_only'},extra||{}));b.entries=b.entries.slice(-100);write(MV,b)}async function routes(){if(state)return state;if(!resolver)throw new Error('resolver unavailable');let loaded=await resolver.load(),self=resolver.resolve(loaded.map,'recovery_routes.candidate_follow'),current=resolver.resolve(loaded.map,'current_app'),back=resolver.resolve(loaded.map,'recovery_routes.last_good_v18'),allow={};allow[bare(current.path)]=current.role;allow[bare(loaded.map.route_guardian.path)]='route_guardian';Object.keys(loaded.map.recovery_routes||{}).forEach(k=>{let x=loaded.map.recovery_routes[k];if(x&&x.path)allow[bare(x.path)]='recovery_routes.'+k});state={loaded,self,current,back,allow};return state}function assess(route){let path=bare(route),role=state&&state.allow&&state.allow[path];return{candidate_route:String(route||''),candidate_path:path,allowed:!!role,candidate_role:role||null,policy:'exact Current Map current_app, route_guardian, or recovery_routes path required'}}async function loadCandidate(){let s=await routes();assessment=assess(candidate);let rec={type:'PMP_MOVE_LEDGER_OPEN_CANDIDATE_V2',at:new Date().toISOString(),candidate_route:candidate,previous_route_evidence:previous,source:from,state:assessment.allowed?'VIEWING_ALLOWED_NOT_CURRENT':'BLOCKED_NOT_IN_CURRENT_MAP',assessment,map_path:s.current.map_path,map_version:s.current.map_version,route_epoch:s.current.route_epoch};write(CAND,rec);if(!assessment.allowed){frame.removeAttribute('src');move('blocked_candidate_review',candidate,{reason:'not_in_current_map'});status.textContent=JSON.stringify(rec,null,2);return}let roleParts=assessment.candidate_role.split('.'),handoff=assessment.candidate_role==='current_app'?s.current:assessment.candidate_role==='route_guardian'?resolver.resolve(s.loaded.map,'route_guardian'):resolver.resolve(s.loaded.map,assessment.candidate_role),url=resolver.buildUrl(handoff,{from:'candidate-follow-review',fresh:'a002-p5-'+handoff.route_epoch+'-'+Date.now(),map_version:handoff.map_version,route_epoch:handoff.route_epoch},'');frame.src=url;move('open_allowed_candidate_for_review',candidate,{candidate_role:assessment.candidate_role});status.textContent=JSON.stringify(rec,null,2)}document.getElementById('make').onclick=async()=>{try{await routes();assessment=assessment||assess(candidate);if(!assessment.allowed){move('blocked_candidate_request',candidate,{reason:'not_in_current_map'});return status.textContent=JSON.stringify({status:'BLOCKED',assessment},null,2)}let req={type:'PMP_RECOVERY_CANDIDATE_REVIEW_REQUEST_V1',state:'REQUEST_ONLY_NOT_CURRENT',candidate_route:candidate,candidate_role:assessment.candidate_role,previous_route_evidence:previous,source:from,map_path:state.current.map_path,map_version:state.current.map_version,route_epoch:state.current.route_epoch,created_at:new Date().toISOString(),rule:'This request cannot change current_app or promote a route.'};write(REQUEST,req);move('record_candidate_review_request',candidate,{candidate_role:assessment.candidate_role,request_only:true});status.textContent=JSON.stringify(req,null,2)}catch(e){status.textContent=JSON.stringify(resolver?resolver.diagnostic(e,'candidate_request'):String(e),null,2)}};document.getElementById('back').onclick=async()=>{try{let s=await routes(),h=resolver.normalizeHash('#control',s.loaded.map),url=resolver.buildUrl(s.current,{from:'candidate-follow-back',fresh:'a002-p5-'+s.current.route_epoch+'-'+Date.now(),map_version:s.current.map_version,route_epoch:s.current.route_epoch},h);move('return_from_candidate_review',s.current.path,{target_role:s.current.role});location.href=url}catch(e){status.textContent=JSON.stringify(resolver?resolver.diagnostic(e,'candidate_back'):String(e),null,2)}};document.getElementById('collapse').onclick=e=>{e.preventDefault();e.stopPropagation();panel.classList.add('collapsed')};panel.onclick=e=>{if(panel.classList.contains('collapsed')){e.preventDefault();panel.classList.remove('collapsed')}};loadCandidate().catch(e=>{frame.removeAttribute('src');status.textContent=JSON.stringify(resolver?resolver.diagnostic(e,'candidate_follow_boot'):String(e),null,2)});})();
</script></body></html>

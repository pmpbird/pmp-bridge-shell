<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#f3ded4"><title>Move Ledger Candidate Follow</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f3ded4;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#07101c}#target{position:fixed;inset:0;width:100%;height:100%;border:0;background:#f3ded4}.panel{position:fixed;left:10px;right:10px;top:calc(10px + env(safe-area-inset-top));z-index:99;background:#172234;color:#eef4fb;border:2px solid #acd1fb;border-radius:22px;padding:12px;box-shadow:0 10px 30px #0007}.panel.collapsed{right:auto;bottom:auto;width:auto;max-width:86%;padding:8px 12px;border-radius:999px}.panel.collapsed .body{display:none}.title{font-weight:950;font-size:17px}.sub{font-size:12px;font-weight:850;opacity:.92;white-space:pre-wrap;overflow-wrap:anywhere}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}button{border:1px solid #eef4fb;background:#acd1fb;color:#07101c;border-radius:14px;padding:11px;font:inherit;font-weight:950}.dark{background:#0c141e;color:#eef4fb}.warn{background:#fff4d6}.note{margin-top:9px;background:#123024;color:#d8ffe2;border:1px solid #eef4fb;border-radius:14px;padding:10px;font-size:12px;white-space:pre-wrap;overflow-wrap:anywhere}</style></head><body><iframe id="target" title="Move Target"></iframe><div id="panel" class="panel"><div class="title">Viewing Saved Move</div><div class="body"><div class="sub">This is not current yet. Inspect the opened move target before deciding.</div><div class="grid"><button id="make" class="warn">Make This Version Current</button><button id="back" class="dark">Go Back to Previous Version</button></div><div class="grid"><button id="collapse">Collapse</button><button id="tools" class="dark">Open Recovery Tools</button></div><div id="status" class="note">Candidate panel ready.</div></div></div><script>(()=>{const q=new URLSearchParams(location.search),candidate=q.get('candidate')||'',previous=q.get('previous')||'pmp-route-guardian-current-loader-v14.html',from=q.get('from')||'move-ledger',CAND='pmp_move_ledger_open_candidate_v1',MV='pmp_route_guardian_move_ledger_bank_v1';const frame=document.getElementById('target'),panel=document.getElementById('panel'),status=document.getElementById('status');function read(k,d){try{let v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}function write(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}function fresh(t){t=String(t||'');let h='',i=t.indexOf('#');if(i>=0){h=t.slice(i);t=t.slice(0,i)}return t+(t.includes('?')?'&':'?')+'fresh='+Date.now()+h}function move(kind,to,extra){let b=read(MV,{entries:[]});b.entries=Array.isArray(b.entries)?b.entries:[];b.entries.push(Object.assign({id:'move_'+Date.now(),at:new Date().toISOString(),kind,from:'pmp-move-ledger-candidate-follow-v1.html',to,view:candidate,return_to:previous,version:'Move Ledger candidate follow panel v1'},extra||{}));b.entries=b.entries.slice(-100);write(MV,b)}function store(){let rec={type:'PMP_MOVE_LEDGER_OPEN_CANDIDATE',at:new Date().toISOString(),candidate_route:candidate,previous_route:previous,source:from,state:'viewing_not_current'};write(CAND,rec);try{localStorage.setItem('pmp_route_guardian_current_before_last_good_v1',previous);localStorage.setItem('pmp_route_guardian_current_before_last_good',previous);localStorage.setItem('pmp_route_guardian_candidate_route_v1',candidate)}catch(e){}return rec}function load(){store();move('open_saved_move_candidate_for_review',candidate,{candidate_route:candidate,previous_route:previous});if(candidate)frame.src=fresh(candidate);else status.textContent='No candidate route was provided.'}document.getElementById('make').onclick=()=>{let rec=store();rec.state='make_current_requested';rec.made_current_at=new Date().toISOString();write(CAND,rec);try{localStorage.setItem('pmp_route_guardian_make_current_request_v1',candidate);localStorage.setItem('pmp_route_guardian_current_target',candidate);localStorage.setItem('pmp_route_guardian_exact_before_last_good',previous);localStorage.setItem('pmp_route_guardian_current_before_last_good_route',JSON.stringify({type:'PMP_MOVE_LEDGER_CANDIDATE_MAKE_CURRENT_REQUEST',candidate_route:candidate,previous_route:previous,at:new Date().toISOString()}))}catch(e){}move('make_this_open_candidate_current_request',candidate,{candidate_route:candidate,previous_route:previous});status.textContent='Make-current request saved. Candidate route is now marked for Route Guardian. No automatic hidden switch was performed.'};document.getElementById('back').onclick=()=>{move('go_back_from_candidate_to_previous',previous,{candidate_route:candidate,previous_route:previous});try{localStorage.removeItem(CAND)}catch(e){}location.href=fresh(previous)};document.getElementById('collapse').onclick=()=>{panel.classList.toggle('collapsed')};document.getElementById('tools').onclick=()=>{move('open_recovery_tools_from_candidate_panel','pmp-route-guardian-recovery-tools-v8.html',{candidate_route:candidate,previous_route:previous});location.href=fresh('pmp-route-guardian-recovery-tools-v8.html?back='+encodeURIComponent(previous)+'&view='+encodeURIComponent(candidate))};load();})();</script></body></html>

<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#f3ded4"><title>PMP Route Guardian v20</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f3ded4;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#07101c}iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#f3ded4}#gate{position:fixed;inset:0;display:grid;place-items:center;background:#f3ded4;padding:18px;z-index:9;text-align:center}.card{width:min(760px,100%);box-sizing:border-box;background:#fff;border:3px solid #07101c;border-radius:28px;padding:18px;display:grid;gap:14px}.badge,button{background:#acd1fb;border:2px solid #07101c;border-radius:16px;padding:12px;font:inherit;font-weight:950;color:#07101c}.dark{background:#172234;color:#eef4fb}.grid{display:grid;gap:10px}.loaded #gate{display:none!important}.runFlash{font-size:1.18em;background:#fff3de!important;border:3px solid #07101c!important;animation:pmpRunFlash 1s infinite}@keyframes pmpRunFlash{0%{transform:scale(1);box-shadow:0 0 0 0 rgba(7,16,28,.55)}50%{transform:scale(1.035);box-shadow:0 0 0 10px rgba(7,16,28,.08)}100%{transform:scale(1);box-shadow:0 0 0 0 rgba(7,16,28,.55)}}#report{display:none;white-space:pre-wrap;text-align:left;background:#102033;color:#eaffef;border-radius:16px;padding:10px;max-height:24vh;overflow:auto;font:750 9px/1.2 monospace}.checkpoint{background:#dfffe4;border:3px solid #07101c;border-radius:18px;padding:12px;font-weight:950}</style></head><body><iframe id="app"></iframe><div id="gate"><div class="card"><div class="badge">ROUTE GUARDIAN v20</div><h1 style="margin:4px 0">Route Guardian</h1><p id="msg" style="margin:0">Press Run App.</p><div id="checkpoint" class="checkpoint" style="display:none">Reload Current returned to Route Guardian v20.<br>Next: press Run App → v28 → App Orchestrator v29.</div><div class="grid"><button id="openBtn" class="runFlash" type="button">Run App</button><button id="copyBtn" class="dark" type="button">Copy Report</button><button id="showBtn" class="dark" type="button">Show / Hide Report</button></div><pre id="report">No report yet.</pre></div></div><script>var KEY='pass7-route-guardian-v20-simple-run-20260705R';var app=document.getElementById('app'),msg=document.getElementById('msg'),report=document.getElementById('report'),openBtn=document.getElementById('openBtn'),showBtn=document.getElementById('showBtn'),copyBtn=document.getElementById('copyBtn'),checkpoint=document.getElementById('checkpoint');var receipt={type:'RG20_READY_RUN_APP',version:KEY,at:new Date().toISOString()};function validPath(p){p=String(p||'pmp-current-reload-owner-v28.html');if(p.charAt(0)==='/')p=p.slice(1);if(p.indexOf('..')>=0)return'pmp-current-reload-owner-v28.html';if(p.slice(-5)!=='.html')return'pmp-current-reload-owner-v28.html';return p}function goodHash(x){return /^#(world|bridge|library|workshop|control|bank)$/i.test(String(x||''))}async function readMap(){var maps=['pmp-current-map-v11.json','pmp-current-map-v10.json'];var err=null;for(var i=0;i<maps.length;i++){try{var r=await fetch(maps[i]+'?rg20='+KEY+'-'+Date.now(),{cache:'no-store'});if(!r.ok)throw Error(maps[i]);var m=await r.json();m._path=maps[i];return m}catch(e){err=e}}throw err||Error('no map')}async function getTarget(){var m=await readMap();var c=m.current_app||{};return{path:validPath(c.path),key:String(c.cache_key||m.updated_at||KEY),map:m}}function topWin(){try{return window.top||window}catch(e){return window}}async function run(){msg.textContent='Route Guardian is opening the current path...';var got;try{got=await getTarget()}catch(e){got={path:'pmp-current-reload-owner-v28.html',key:KEY,map:{error:String(e)}}}var h=goodHash(location.hash)?location.hash:'#control';var url=got.path+'?fresh=rg20-simple-'+KEY+'-'+encodeURIComponent(got.key)+'-'+Date.now()+h;receipt={type:'RG20_RUN_APP_TOP_WINDOW',version:KEY,at:new Date().toISOString(),target:got.path,launch_url:url,cache_key:got.key,map_path:got.map&&got.map._path,map_current_app:got.map&&got.map.current_app,map_updated_at:got.map&&got.map.updated_at,rule:'Route Guardian opens current v28. v28 loads v29 App Orchestrator.'};try{localStorage.setItem('pmp_route_guardian_v20_receipt',JSON.stringify(receipt,null,2))}catch(e){}report.textContent=JSON.stringify(receipt,null,2);try{topWin().location.replace(url)}catch(e){location.href=url}}openBtn.onclick=function(e){if(e)e.preventDefault();run();return false};showBtn.onclick=function(){report.style.display=report.style.display==='block'?'none':'block'};copyBtn.onclick=function(){try{navigator.clipboard.writeText(JSON.stringify(receipt,null,2));msg.textContent='Report copied.'}catch(e){report.style.display='block'}};if(/autoRun=1|launcher-reload|reload-current/i.test(location.search)){checkpoint.style.display='block';msg.textContent='Reload Current returned to Route Guardian v20. Press Run App to continue.'}</script></body></html>

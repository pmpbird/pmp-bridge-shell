v class="grid"><button id="openBtn" class="runFlash">Run App</button><button id="copyBtn" class="dark">Copy Report</button><button id="showBtn" class="dark">Show / Hide Report</button></div><pre id="report">No report yet.</pre></div></div><script src="pmp-active-path-discovery-zip-export-v2.js?fresh=route-guardian-v20-manual-checkpoint-20260705Q"></script><script>const KEY='pass7-route-guardian-v20-manual-checkpoint-20260705Q';const app=document.getElementById('app'),msg=document.getElementById('msg'),report=document.getElementById('report'),openBtn=document.getElementById('openBtn'),showBtn=document.getElementById('showBtn'),copyBtn=document.getElementById('copyBtn'),checkpoint=document.getElementById('checkpoint');let receipt={type:'RG20_READY_RUN_APP',version:KEY,at:new Date().toISOString()};function cleanPath(path,fallback){path=String(path||fallback||'').trim().replace(/^\/+,'');return /^[a-zA-Z0-9._\/-]+\.html$/.test(path)?path:fallback}function goodHash(x){return /^#(world|bridge|library|workshop|control|bank)$/i.test(String(x||''))}async function readMap(){let last;for(let p of ['pmp-current-map-v11.json','pmp-current-map-v10.json']){try{let r=await fetch(p+'?rg20='+KEY+'-'+Date.now(),{cache:'no-store'});if(!r.ok)throw Error(p+' '+r.status);let m=await r.json();m._path=p;return m}catch(e){last=e}}throw last||Error('no map')}async function target(){let map=await readMap();let c=map.current_app||{};return{path:cleanPath(c.path,'pmp-current-reload-owner-v28.html'),key:String(c.cache_key||map.updated_at||KEY),map}}function topWindow(){try{return window.top||window}catch(e){return window}}async function run(reason){openBtn.classList.remove('runFlash');openBtn.textContent='Opening Current Path…';openBtn.disabled=true;msg.textContent='Route Guardian is opening the current path…';let got;try{got=await target()}catch(e){got={path:'pmp-current-reload-owner-v28.html',key:KEY,map:{error:String(e)}}}let h=goodHash(location.hash)?location.hash:'#control';let url=got.path+'?fresh=rg20-top-'+KEY+'-'+encodeURIComponent(got.key)+'-'+Date.now()+h;receipt={type:'RG20_RUN_APP_TOP_WINDOW',version:KEY,at:new Date().toISOString(),target:got.path,launch_url:url,cache_key:got.key,map_path:got.map&&got.map._path,map_current_app:got.map&&got.map.current_app,map_updated_at:got.map&&got.map.updated_at,run_reason:reason||'manual_run_app',rule:'Route Guardian visibly confirms Reload Current returned here. User presses Run App to continue into v28/v29 App Orchestrator.'};try{localStorage.setItem('pmp_route_guardian_v20_receipt',JSON.stringify(receipt,null,2))}catch(e){}report.textContent=JSON.stringify(receipt,null,2);try{topWindow().location.replace(url)}catch(e){app.src=url;app.onload=()=>setTimeout(()=>document.body.classList.add('loaded'),650)}}openBtn.onclick=()=>run('manual_run_app');showBtn.onclick=()=>{report.style.display=report.style.display==='block'?'none':'block'};copyBtn.onclick=async()=>{try{await navigator.clipboard.writeText(JSON.stringify(receipt,null,2));msg.textContent='Report copied.'}catch(e){report.style.display='block'}};if(/(?:\?|&)autoRun=1(?:&|$)/.test(location.search)||/launcher-reload|reload-current/i.test(location.search)){checkpoint.style.display='block';openBtn.disabled=false;openBtn.textContent='Run App';openBtn.classList.add('runFlash');msg.textContent='Visible checkpoint: Reload Current returned to Route Guardian v20. Press Run App to continue.'}</script></body></html>

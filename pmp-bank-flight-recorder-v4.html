<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#f3ded4"><title>PMP Bank Flight Recorder v4</title><style>
html,body{margin:0;background:#f3ded4;color:#07101c;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{padding:10px}.card{background:#fff;border:3px solid #07101c;border-radius:22px;padding:12px;margin:10px 0;box-shadow:0 8px 22px #0002}h1{font-size:24px;margin:0 0 6px}.sub{color:#294f5d;font-weight:850;line-height:1.28}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}button{border:2px solid #07101c;border-radius:14px;background:#acd1fb;color:#07101c;font:inherit;font-weight:950;padding:11px 8px}.dark{background:#172234;color:white}.pill{display:inline-block;border:2px solid #07101c;border-radius:999px;background:#fff;padding:5px 8px;margin:3px;font-size:12px;font-weight:900}.bad{background:#ffe1e1}.ok{background:#e4ffe9}.warn{background:#fff3de}pre{white-space:pre-wrap;word-break:break-word;background:#102033;color:#eaffef;border-radius:16px;padding:10px;max-height:40vh;overflow:auto;font-size:12px;line-height:1.35}.framebox{height:62vh;border:3px solid #07101c;border-radius:18px;overflow:hidden;background:#f3ded4}iframe{width:100%;height:100%;border:0;background:#f3ded4}.hidden{display:none!important}
</style></head><body>
<div class="card warn"><h1>Bank Flight Recorder v4</h1><p class="sub">Diagnostic only. No app patching. Records the full 8 seconds even if a bad flash appears and then self-corrects.</p><div class="grid"><button id="reloadBtn">Reload + Record</button><button id="recordBtn">Record Current View</button><button id="copyBtn" class="dark">Copy Report</button><button id="showBtn" class="dark">Show / Hide App</button></div></div>
<div id="statusCard" class="card"><div id="badges"></div><pre id="summary">Ready.</pre></div>
<div class="card"><h2>Flight Events</h2><pre id="events">No events yet.</pre></div>
<div id="frameCard" class="card"><div class="framebox"><iframe id="app" title="PMP current app frame"></iframe></div></div>
<script>
(()=>{'use strict';
const V='4.0.0-flight-recorder-report-only';
const CURRENT='pmp-current-reload-owner-v27.html',SAMPLE_MS=75,RUN_MS=8000;
const app=document.getElementById('app'),summary=document.getElementById('summary'),eventsBox=document.getElementById('events'),badges=document.getElementById('badges'),statusCard=document.getElementById('statusCard');
let report=null,timer=null,t0=0,lastSig='',openBad=null;
const LEVELS={level1:'[data-cr-level1-source-gate],[data-cr-level1],[data-source-zip-lane]',level2:'[data-source-zip-levels-single],[data-cr-level2],[data-source-zip-reader-level2]',level3:'[data-source-text-reader-level3]',level4:'[data-source-reference-gate-level4]',level4b:'[data-source-reference-gate-level4b]',level5_plus:'[data-level5-source-gated-runner],[data-level6-audit-receipt-lock],[data-level7-no-bypass-enforcement],[data-level8-output-gate],[data-level9-actual-resident-integration],[data-level10-cert-lock],[data-level11-startup-guard],[data-level12-startup-enforcement],[data-level13-failure-test],[data-level14-recovery-proof],[data-level15-source-invalidation],[data-level16-source-bound],[data-level17-source-mismatch],[data-level18-recert-gate],[data-level19-recovery-proof],[data-level20-summary-lock],[data-level21-one-tap-retest],[data-level22-export-receipt],[data-level23-integrity-check],[data-level24-tamper-test],[data-level25-receipt-bundle],[data-level26-packet-integrity],[data-level27-tampered-packet],[data-level28-final-export],[data-level29-cold-start],[data-level30-final-seal],[data-resident-l30b-auto-gate]'};
function clean(s){return String(s||'').replace(/\s+/g,' ').trim()}function short(s,n){s=clean(s);return s.length>(n||160)?s.slice(0,n||160)+'…':s}function vis(e){try{let w=e.ownerDocument.defaultView,cs=w.getComputedStyle(e),r=e.getBoundingClientRect();return cs.display!=='none'&&cs.visibility!=='hidden'&&Number(cs.opacity)!==0&&r.width>0&&r.height>0&&!e.classList.contains('hidden')}catch(x){return false}}
function tag(e){if(!e)return null;let s=(e.tagName||'node').toLowerCase();if(e.id)s+='#'+e.id;if(e.className&&typeof e.className==='string')s+='.'+e.className.trim().split(/\s+/).slice(0,3).join('.');try{Array.from(e.attributes||[]).forEach(a=>{if(a.name.indexOf('data-')===0)s+='['+a.name+(a.value?'="'+a.value+'"':'')+']'})}catch(x){}return s}
function path(e){let a=[];for(let n=e,i=0;n&&i<9;n=n.parentElement,i++)a.push(tag(n));return a}
function docs(d,a,n,p){a=a||[];n=n||0;p=p||'diagnostic';if(!d||n>12)return a;a.push({doc:d,path:p,url:(()=>{try{return String(d.location.href)}catch(e){return 'blocked'}})(),title:d.title||''});try{Array.from(d.querySelectorAll('iframe,frame')).forEach((f,i)=>{try{let x=f.contentDocument||(f.contentWindow&&f.contentWindow.document);if(x)docs(x,a,n+1,p+' > iframe['+i+'] '+short(f.title||f.id,24))}catch(e){}})}catch(e){}return a}
function bestDoc(){let best=null,score=-1;docs(document).forEach(x=>{let d=x.doc,s=0;try{if(d.getElementById('bank'))s+=100;if(d.querySelector('[data-bank-buttons]'))s+=40;if(d.querySelector('[data-source-text-reader-level3]'))s+=30;if(d.querySelector('[data-run-bank-tools]'))s+=30;if(/pmp-home-single/i.test(x.url))s+=20}catch(e){}if(s>score){score=s;best=x}});return score>0?best:null}
function levelState(bank,k,sel){let nodes=[];try{nodes=Array.from(bank.querySelectorAll(sel))}catch(e){}let first=nodes[0]||null;return{total:nodes.length,visible:nodes.filter(vis).length,first:first?{tag:tag(first),text:short(first.textContent),path:path(first),inside_bank:!!first.closest('#bank'),inside_detail:!!first.closest('[data-bank-detail-wrap]'),inside_run_tools:!!first.closest('[data-run-bank-tools]'),inside_level_stack:!!first.closest('[data-cr-level-stack]')}:null}}
function getState(){let x=bestDoc();if(!x)return{app_found:false};let d=x.doc,b=d.getElementById('bank');if(!b)return{app_found:true,bank_found:false,url:x.url,title:x.title};let buttonHost=b.querySelector('[data-bank-buttons]'),openers=buttonHost?Array.from(buttonHost.querySelectorAll('[data-open-bank]')):[];let txt=clean(buttonHost&&buttonHost.textContent);let detail=b.querySelector('[data-bank-detail-wrap]'),run=b.querySelector('[data-run-bank-tools]');let levels={};Object.keys(LEVELS).forEach(k=>levels[k]=levelState(b,k,LEVELS[k]));let visibleLevels=Object.keys(levels).filter(k=>levels[k].visible>0);let lowerVisible=visibleLevels.filter(k=>!/^level1$|^level2$/.test(k));let bankReady=!!(buttonHost&&vis(buttonHost)&&openers.length&&txt&&!/^Loading\.\.\.?$/i.test(txt));let crReady=!!(vis(detail)&&vis(run));let normalBank=!!(bankReady&&!vis(detail)&&visibleLevels.length===0);let looseLower=lowerVisible.filter(k=>{let f=levels[k].first;return f&&f.visible!==0&&(!f.inside_detail||!f.inside_run_tools||!f.inside_level_stack)});let bad=!!(lowerVisible.length&&(!bankReady||!crReady||looseLower.length));return{app_found:true,bank_found:true,url:x.url,title:x.title,bank_visible:vis(b),bank_buttons_ready:bankReady,bank_buttons_count:openers.length,bank_buttons_text:txt||'(empty)',detail_visible:vis(detail),run_tools_visible:vis(run),continuous_run_ready:crReady,normal_blue_bank_page:normalBank,visible_levels:visibleLevels,lower_visible_levels:lowerVisible,loose_lower_levels:looseLower,bad_flash_visible:bad,levels,version:(d.defaultView.PMPMasterBankTabV1&&d.defaultView.PMPMasterBankTabV1.version)||null}}
function compact(s){return{app_found:s.app_found,bank_found:s.bank_found,bank_buttons_ready:s.bank_buttons_ready,bank_buttons_count:s.bank_buttons_count,detail_visible:s.detail_visible,run_tools_visible:s.run_tools_visible,continuous_run_ready:s.continuous_run_ready,normal_blue_bank_page:s.normal_blue_bank_page,visible_levels:s.visible_levels,lower_visible_levels:s.lower_visible_levels,loose_lower_levels:s.loose_lower_levels,bad_flash_visible:s.bad_flash_visible,version:s.version}}
function label(s){if(!s.app_found)return'no app doc yet';if(!s.bank_found)return'no bank section yet';if(s.bad_flash_visible)return'BAD FLASH: '+s.lower_visible_levels.join(', ');if(s.normal_blue_bank_page)return'recovered/normal blue Bank buttons';if(s.continuous_run_ready&&s.visible_levels.length)return'Continuous Run ready with levels: '+s.visible_levels.join(', ');if(s.bank_buttons_ready)return'Bank buttons ready';return'loading / partial'}
function closeBad(t,s){if(openBad){openBad.end_ms=t;openBad.duration_ms=t-openBad.start_ms;openBad.end_state=compact(s);report.bad_spans.push(openBad);openBad=null}}
function updateSpans(t,s){if(s.bad_flash_visible&&!openBad){openBad={start_ms:t,first_state:s,levels:s.lower_visible_levels,loose_levels:s.loose_lower_levels,mounts:{}};s.lower_visible_levels.forEach(k=>openBad.mounts[k]=s.levels[k]&&s.levels[k].first);report.bad_flash_count++;if(!report.first_bad_flash)report.first_bad_flash={t_ms:t,state:s}}else if(s.bad_flash_visible&&openBad){s.lower_visible_levels.forEach(k=>{if(openBad.levels.indexOf(k)<0)openBad.levels.push(k);if(openBad.loose_levels.indexOf(k)<0&&s.loose_lower_levels.indexOf(k)>=0)openBad.loose_levels.push(k);if(!openBad.mounts[k])openBad.mounts[k]=s.levels[k]&&s.levels[k].first})}else if(!s.bad_flash_visible){closeBad(t,s)}if(s.normal_blue_bank_page){report.recovered_to_blue_bank_page=true;if(!report.first_recovery)report.first_recovery={t_ms:t,state:s}}}
function render(){let s=(report.samples[report.samples.length-1]||{}).state||{};badges.innerHTML='<span class="pill '+(s.bank_buttons_ready?'ok':'')+'">Bank buttons: '+(s.bank_buttons_ready?'YES':'NO')+'</span><span class="pill '+(s.normal_blue_bank_page?'ok':'')+'">Normal bank: '+(s.normal_blue_bank_page?'YES':'NO')+'</span><span class="pill '+(s.bad_flash_visible?'bad':'')+'">Bad flash: '+(s.bad_flash_visible?'YES':'NO')+'</span><span class="pill '+(report.status==='complete_8s'?'ok':'')+'">Status: '+report.status+'</span>';statusCard.className='card '+(s.bad_flash_visible?'bad':report.status==='complete_8s'?'ok':'warn');summary.textContent=JSON.stringify({type:report.type,version:report.version,status:report.status,elapsed_ms:report.elapsed_ms,target_ms:RUN_MS,bad_flash_count:report.bad_flash_count,bad_spans:report.bad_spans.concat(openBad?[Object.assign({},openBad,{still_open:true})]:[]),recovered_to_blue_bank_page:report.recovered_to_blue_bank_page,first_recovery:report.first_recovery,first_bad_flash:report.first_bad_flash,latest_state:s},null,2);eventsBox.textContent=report.events.map(e=>e.t_ms+'ms — '+e.label+'\n'+JSON.stringify(e.state,null,2)).join('\n\n')||'No events yet.'}
function sample(){let t=Date.now()-t0,full=getState(),c=compact(full),sig=JSON.stringify(c);report.elapsed_ms=t;report.samples.push({t_ms:t,state:c});Object.keys(full.levels||{}).forEach(k=>{if(full.levels[k].visible>0&&!report.first_seen_levels[k])report.first_seen_levels[k]={t_ms:t,first:full.levels[k].first}});updateSpans(t,full);if(sig!==lastSig){lastSig=sig;report.events.push({t_ms:t,label:label(full),state:full})}if(t>=RUN_MS&&timer){closeBad(t,full);report.status='complete_8s';report.finished_at=new Date().toISOString();clearInterval(timer);timer=null}render()}
function start(load){if(timer)clearInterval(timer);openBad=null;lastSig='';t0=Date.now();report={type:'PMP_BANK_FLIGHT_RECORDER_DIAGNOSTIC_V4',version:V,at:new Date().toISOString(),status:'recording_full_8s',rule:'Diagnostic only. No app patching. Full 8-second flight recorder; does not freeze on bad flashes.',loaded_app_src:app.src||'',sample_ms:SAMPLE_MS,run_ms:RUN_MS,samples:[],events:[],first_seen_levels:{},first_bad_flash:null,bad_flash_count:0,bad_spans:[],recovered_to_blue_bank_page:false,first_recovery:null,elapsed_ms:0};if(load){app.src=CURRENT+'?fresh=bank-flight-recorder-v4-'+Date.now()+'#bank';report.loaded_app_src=app.src}summary.textContent='Recording full 8 seconds. If you see the flash, let it keep running.';timer=setInterval(sample,SAMPLE_MS);sample()}
async function copy(){try{await navigator.clipboard.writeText(JSON.stringify(report||{status:'no report'},null,2));summary.textContent='Copied report. Paste it into ChatGPT.\n\n'+summary.textContent}catch(e){summary.textContent='Copy failed. Long-press/select report.\n\n'+JSON.stringify(report||{status:'no report'},null,2)}}
document.getElementById('reloadBtn').onclick=()=>start(true);document.getElementById('recordBtn').onclick=()=>start(false);document.getElementById('copyBtn').onclick=copy;document.getElementById('showBtn').onclick=()=>document.getElementById('frameCard').classList.toggle('hidden');start(true);
})();
</script></body></html>

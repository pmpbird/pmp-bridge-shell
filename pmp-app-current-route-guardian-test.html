<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PMP Route Guard Test">
<meta name="theme-color" content="#52b5df">
<title>PMP Route Guardian Boot Gate Test</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#52b5df;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#101827}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#52b5df}
#boot{position:fixed;inset:0;display:grid;place-items:center;background:#52b5df;font-weight:950;text-align:center;padding:18px;z-index:20;overflow:auto}
#bootCard{width:min(720px,100%);background:#46a9d3;border:3px solid #07101c;border-radius:28px;padding:18px;box-shadow:0 10px 24px rgba(0,0,0,.2);white-space:pre-wrap;line-height:1.35}
#bootTitle{font-size:30px;font-weight:950;margin:0 0 8px}
#bootText{font-size:16px;font-weight:850;margin:0 0 12px;color:#101827}
#bootActions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
button{border:0;border-radius:16px;background:#a1fcfd;color:#101827;font:inherit;font-weight:950;padding:12px;box-shadow:0 8px 18px rgba(0,0,0,.16)}
button.dark{background:#172234;color:#eef4fb;border:1px solid #25354a}
#reportPanel{position:fixed;left:10px;right:10px;top:calc(10px + env(safe-area-inset-top));bottom:calc(10px + env(safe-area-inset-bottom));z-index:30;display:none;background:#0c141e;color:#eef4fb;border:2px solid #a1fcfd;border-radius:22px;padding:12px;overflow:auto;white-space:pre-wrap;font:12px/1.35 ui-monospace,Menlo,monospace}
.pass #bootCard{border-color:#0b3519}.fail #bootCard{border-color:#7d3333;background:#7b2f2f;color:#fff}.fail #bootText{color:#fff}
.appLoaded #boot{display:none!important}.appLoaded #reportPanel{display:none!important}.appLoaded #bootActions{display:none!important}
</style>
</head>
<body>
<div id="boot"><div id="bootCard"><div id="bootTitle">Route Guardian</div><div id="bootText">This test checks the current route before loading PMP. Nothing has loaded yet.</div><div id="bootActions"><button onclick="runBootGate()">Check Route</button><button class="dark" onclick="copyReport()">Copy Report</button></div></div></div>
<iframe id="app" title="PMP Current App Route Guardian Test"></iframe>
<div id="reportPanel"></div>
<script src="pmp-route-guardian-v1.js?fresh=boot-test-v2"></script>
<script>
const F=document.getElementById('app');
const BOOT=document.getElementById('boot');
const BOOT_TITLE=document.getElementById('bootTitle');
const BOOT_TEXT=document.getElementById('bootText');
const REPORT_PANEL=document.getElementById('reportPanel');
let latestReport=null;
let bootPassed=false;
function showBoot(title,msg,kind){document.body.classList.remove('pass','fail','appLoaded');BOOT.style.display='grid';if(kind)document.body.classList.add(kind);BOOT_TITLE.textContent=title;BOOT_TEXT.textContent=msg;}
function hideBootForApp(){document.body.classList.add('appLoaded');BOOT.style.display='none';REPORT_PANEL.style.display='none';}
function srcWithFresh(path,cacheKey){return String(path||'pmp-current-inner-cleanbug-v1.html').replace(/^\/+/, '')+'?fresh=route-guardian-boot-'+encodeURIComponent(cacheKey||Date.now())+'-'+Date.now()+(location.hash||'#world')}
function setReport(report){latestReport=report;REPORT_PANEL.textContent=JSON.stringify(report,null,2)}
async function runBootGate(){
  showBoot('Route Guardian','Checking current app route...',null);
  try{
    if(!window.PMPRouteGuardianV1)throw new Error('Route Guardian did not load.');
    const report=await window.PMPRouteGuardianV1.buildReport({store:false});
    setReport(report);
    const pass=String(report.verdict||'').startsWith('PASS') && ((report.stale_shell_risk||{}).risk_count||0)===0;
    if(!pass){
      bootPassed=false;
      showBoot('Route Blocked',(report.resident_summary||'Route risk found.')+'\n\nTap Copy Report if you want to send the details.','fail');
      return;
    }
    bootPassed=true;
    const map=report.current_map_assessment||{};
    const target=map.current_path || 'pmp-current-inner-cleanbug-v1.html';
    const cacheKey=map.current_cache_key || 'route-guardian-test';
    showBoot('Route Guardian Passed','Current route is clean. Loading PMP Current now. The test buttons will disappear so they do not block the app tabs.','pass');
    F.src=srcWithFresh(target,cacheKey);
    F.onload=()=>setTimeout(hideBootForApp,650);
    setTimeout(hideBootForApp,3000);
  }catch(e){
    bootPassed=false;
    setReport({type:'PMP_ROUTE_GUARDIAN_BOOT_TEST_ERROR',built_at:new Date().toISOString(),error:String(e&&e.message||e)});
    showBoot('Route Guardian Error',String(e&&e.message||e),'fail');
  }
}
async function copyReport(){
  if(!latestReport){await runBootGate();}
  const text=JSON.stringify(latestReport,null,2);
  try{await navigator.clipboard.writeText(text);showBoot('Report Copied',bootPassed?'Route report copied. Loading PMP Current now.':'Route report copied. Route is still blocked or uncertain.',bootPassed?'pass':'fail');if(bootPassed)setTimeout(hideBootForApp,900);}
  catch(e){REPORT_PANEL.style.display='block';showBoot('Copy Failed','Select the report manually from the report panel.','fail');}
}
window.addEventListener('load',()=>setTimeout(runBootGate,350));
</script>
</body>
</html>

<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Route Guardian Recovery Tools v6</title><style>body{margin:0;background:#f3ded4;color:#07101c;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:18px}.card{background:#fff;border:3px solid #07101c;border-radius:26px;padding:16px;max-width:680px;margin:auto}.badge{display:inline-block;background:#acd1fb;border:2px solid #07101c;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:950}.btn{display:block;width:100%;box-sizing:border-box;margin:10px 0;border:2px solid #07101c;border-radius:16px;background:#eef4fb;color:#07101c;padding:14px;text-align:left;font:inherit;font-weight:900;text-decoration:none}.good{background:#dff7e8}.warn{background:#fff4d6}.dark{background:#172234;color:#eef4fb}.danger{background:#3a1212;color:#ffe6e6}.copy{background:#e9ecff}.bank{display:none;background:#0c141e;color:#eef4fb;border-radius:14px;padding:10px;margin-top:10px;max-height:38vh;overflow:auto}.open{display:block}.spotcard,.movecard,.summarycard{background:#172234;color:#eef4fb;border:2px solid #eef4fb;border-radius:16px;padding:12px;margin:10px 0}.summarycard{background:#20314a}.small{font-size:12px;opacity:.9;white-space:pre-wrap;overflow-wrap:anywhere}.viewbox{display:none;margin-top:14px;border:3px solid #07101c;border-radius:22px;overflow:hidden;background:#fff}.frame{width:100%;height:55vh;border:0;background:#fff}.status{background:#123024;color:#d8ffe2}</style></head><body><div class="card"><span class="badge">RECOVERY TOOLS</span><h1>Route Guardian Recovery Tools</h1><p>Move Ledger summary separates current route from saved restore point.</p><a id="back" class="btn good">Return to Route Guardian Last Good</a><button id="make" class="btn warn">Make This Version Current</button><button id="spots" class="btn dark">Saved Spots</button><div id="spotBox" class="bank"></div><button id="moves" class="btn dark">Move Ledger</button><div id="moveBox" class="bank"></div><div id="status" class="btn status">Recovery tools ready.</div><div id="viewWrap" class="viewbox"><iframe id="view" class="frame"></iframe></div></div><script>(()=>{const TOOLS='pmp-route-guardian-recovery-tools-v6.html',TOOLS_VERSION='Route Guardian Recovery Tools v6',SP='pmp_route_guardian_saved_spots_bank_v1',MV='pmp_route_guardian_move_ledger_bank_v1';const q=new URLSearchParams(location.search),VIEW=q.get('view')||'',BACK=q.get('back')||'pmp-route-guardian-last-good-v16.html';const $=x=>document.getElementById(x);function esc(v){return String(v||'—').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function read(k,d){try{return JSON.parse(localStorage.getItem(k)||'')}catch(e){return d}}function write(k,v){localStorage.setItem(k,JSON.stringify(v))}function fresh(t){t=String(t||BACK);let h='',i=t.indexOf('#');if(i>=0){h=t.slice(i);t=t.slice(0,i)}return t+(t.includes('?')?'&':'?')+'fresh='+Date.now()+h}function pretty(k){return String(k||'Move').replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase())}function line(label,val){return '<div class="small"><b>'+label+':</b> '+esc(val)+'</div>'}function isRoute(t){return /^pmp-route-guardian-last-good-v\d+\.html$/.test(String(t||''))}function routeOf(m){return m&&((m.to&&String(m.to).includes('.html')&&m.to)||(m.view&&String(m.view).includes('.html')&&m.view)||(m.from&&String(m.from).includes('.html')&&m.from)||'')}function guardianRouteOf(m){if(!m)return'';if(isRoute(m.to))return m.to;if(isRoute(m.from))return m.from;if(isRoute(m.view))return m.view;let r=routeOf(m);return isRoute(r)?r:''}function move(kind,to,extra={}){let b=read(MV,{entries:[]});b.entries=Array.isArray(b.entries)?b.entries:[];b.entries.push(Object.assign({id:'move_'+Date.now(),at:new Date().toISOString(),kind,from:TOOLS,view:VIEW||'tools',to,tools_route:TOOLS,version:TOOLS_VERSION},extra));b.entries=b.entries.slice(-100);write(MV,b)}function summarize(entries){let newest=entries.slice().reverse();let kindCounts={};entries.forEach(m=>{let k=m.kind||'unknown';kindCounts[k]=(kindCounts[k]||0)+1});let latest=newest[0]||{};let active=newest.find(m=>guardianRouteOf(m)&&String(m.kind||'').startsWith('enter_'))||newest.find(m=>guardianRouteOf(m)&&!String(m.kind||'').includes('save_current')&&!String(m.kind||'').includes('delete_saved_spot'));let latestSave=newest.find(m=>m.kind==='save_current');let latestTools=newest.find(m=>m.tools_route||String(m.kind||'').includes('open_recovery'));let latestMake=newest.find(m=>String(m.kind||'').includes('make_this_version_current'));let latestDelete=newest.find(m=>String(m.kind||'').includes('delete_saved_spot'));let latestCurrentBefore=newest.find(m=>m.current_before||m.current_before_last_good);let unique=[];newest.forEach(m=>{let r=guardianRouteOf(m)||routeOf(m);if(r&&!unique.includes(r))unique.push(r)});let bestCurrent=guardianRouteOf(active)||BACK;let restore=guardianRouteOf(latestSave)||'';let lines=[];lines.push('DETAILED REPORT SUMMARY');lines.push('best_current_route: '+bestCurrent);lines.push('best_current_candidate: '+bestCurrent);lines.push('recommended_next_route: '+bestCurrent);lines.push('best_saved_restore_point: '+restore);lines.push('best_saved_restore_point_time: '+((latestSave&&latestSave.at)||''));lines.push('best_saved_restore_point_version: '+((latestSave&&latestSave.version)||''));lines.push('restore_note: use best_saved_restore_point only when asking to restore or go back to a saved point');lines.push('newest_move_kind: '+(latest.kind||''));lines.push('newest_move_time: '+(latest.at||''));lines.push('newest_move_target: '+(routeOf(latest)||latest.to||latest.view||latest.from||''));lines.push('latest_route_guardian_route: '+(guardianRouteOf(active)||''));lines.push('latest_recovery_tools_route: '+((latestTools&&latestTools.tools_route)||TOOLS));lines.push('latest_make_current_request: '+(latestMake?routeOf(latestMake):''));lines.push('latest_deleted_saved_spot_target: '+(latestDelete?routeOf(latestDelete):''));lines.push('latest_current_before_last_good: '+(latestCurrentBefore&&(latestCurrentBefore.current_before||latestCurrentBefore.current_before_last_good)||''));lines.push('visible_entry_count: '+entries.length);lines.push('cap_warning: '+(entries.length>=100?'ledger is capped at 100 moves; older moves may already be trimmed':'ledger has not reached the 100-move cap'));lines.push('unique_recent_routes_newest_first: '+unique.slice(0,12).join(' | '));lines.push('action_counts: '+Object.keys(kindCounts).sort().map(k=>k+'='+kindCounts[k]).join(', '));lines.push('ai_use_note: paste this report into ChatGPT with your goal, and ask which route to open next.');return lines}function report(){let b=read(MV,{entries:[]});let entries=Array.isArray(b.entries)?b.entries:[];let newest=entries.slice().reverse();let lines=[];lines.push('ROUTE GUARDIAN MOVE LEDGER REPORT');lines.push('report_quality: LOSSLESS');lines.push('generated_at: '+new Date().toISOString());lines.push('entry_count: '+entries.length);lines.push('order_note: readable section is newest-first; raw JSON preserves saved order');lines.push('');lines.push(...summarize(entries));lines.push('');lines.push('READABLE MOVES — NEWEST FIRST');lines.push('');newest.forEach((m,i)=>{lines.push('MOVE '+(i+1));lines.push('kind: '+(m.kind||''));lines.push('time: '+(m.at||''));lines.push('from: '+(m.from||''));lines.push('to: '+(m.to||''));lines.push('viewed_version: '+(m.view||''));lines.push('tools_route: '+(m.tools_route||''));lines.push('current_before_last_good: '+(m.current_before||m.current_before_last_good||''));lines.push('return_to: '+(m.return_to||''));lines.push('version: '+(m.version||''));lines.push('id: '+(m.id||m.move_id||''));lines.push('full_move_json: '+JSON.stringify(m));lines.push('')});lines.push('RAW MOVE LEDGER JSON — LOSSLESS SAVED ORDER');lines.push(JSON.stringify(b,null,2));return lines.join('\n')}function copyText(t){if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(()=>status.textContent='Copied full lossless Move Ledger report with corrected summary. Paste it into ChatGPT.').catch(()=>fallback(t))}else fallback(t)}function fallback(t){let ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();status.textContent='Copied full lossless Move Ledger report with corrected summary. Paste it into ChatGPT.'}function drawSummary(entries){let s=document.createElement('div');s.className='summarycard';s.innerHTML='<b>Detailed Report Summary</b>'+summarize(entries).slice(1).map(x=>{let i=x.indexOf(':');return line(i>-1?x.slice(0,i):'summary',i>-1?x.slice(i+1).trim():x)}).join('');moveBox.appendChild(s)}function drawSpots(){let b=read(SP,{entries:[]});b.entries=Array.isArray(b.entries)?b.entries:[];spotBox.innerHTML='';if(!b.entries.length){spotBox.textContent='No saved spots yet.';return}b.entries.forEach((s,i)=>{let card=document.createElement('div');card.className='spotcard';let title=s.label||s.name||('Saved Spot '+(i+1));card.innerHTML='<b>'+esc(title)+'</b>'+line('Saved',s.saved_at||s.at||s.time)+line('Version',s.version||s.version_name||s.page)+line('Route',s.route)+line('Current Before Last Good',s.current_before||s.current_before_last_good)+line('Recovery State',s.recovery_state||s.state||s.recovery_state_name);let open=document.createElement('a');open.className='btn good';open.href=fresh(s.route);open.textContent='Open Saved Spot';card.appendChild(open);let d=document.createElement('button');d.className='btn danger';d.textContent='Delete Saved Spot';d.onclick=()=>{let x=read(SP,{entries:[]});x.entries=(x.entries||[]).filter(e=>e.id!==s.id&&e.spot_id!==s.spot_id&&e.route!==s.route);write(SP,x);move('delete_saved_spot',s.route);drawSpots()};card.appendChild(d);spotBox.appendChild(card)})}function drawMoves(){let b=read(MV,{entries:[]});let entries=Array.isArray(b.entries)?b.entries.slice(-100):[];let arr=entries.slice().reverse();moveBox.innerHTML='';let c=document.createElement('button');c.className='btn copy';c.textContent='Copy Move Ledger Report';c.onclick=()=>copyText(report());moveBox.appendChild(c);drawSummary(entries);if(!arr.length){let p=document.createElement('div');p.className='movecard';p.textContent='No moves yet.';moveBox.appendChild(p);return}arr.forEach((m,i)=>{let card=document.createElement('div');card.className='movecard';card.innerHTML='<b>'+esc((i+1)+'. '+pretty(m.kind))+'</b>'+line('Time',m.at)+line('From',m.from)+line('To',m.to)+line('Viewed Version',m.view)+line('Tools Route',m.tools_route)+line('Current Before Last Good',m.current_before||m.current_before_last_good)+line('Return To',m.return_to)+line('Version',m.version);let target=guardianRouteOf(m)||routeOf(m);if(target){let a=document.createElement('a');a.className='btn good';a.href=fresh(target);a.textContent='Open This Move Target';card.appendChild(a)}moveBox.appendChild(card)})}back.href=fresh(BACK);back.onclick=()=>move('return_to_route_guardian_last_good',BACK);if(VIEW){viewWrap.style.display='block';view.src=fresh(VIEW);status.textContent='Viewing version inside Recovery Tools.'}make.onclick=()=>{if(!VIEW){status.textContent='No viewed version is open. Open Last Good first.';return}localStorage.setItem('pmp_route_guardian_make_current_request_v1',VIEW);move('make_this_version_current_request',VIEW,{to:VIEW});status.textContent='Marked viewed version as current request on this device.'};spots.onclick=()=>{drawSpots();spotBox.classList.toggle('open')};moves.onclick=()=>{drawMoves();moveBox.classList.toggle('open')};move('open_recovery_tools',BACK)})();</script></body></html>

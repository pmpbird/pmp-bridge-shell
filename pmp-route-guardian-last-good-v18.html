<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Route Guardian Last Good v18</title><style>body{margin:0;background:#f3ded4;color:#07101c;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:22px}.card{background:#fff;border:3px solid #07101c;border-radius:26px;padding:16px;max-width:650px;margin:auto}.btn{display:block;width:100%;box-sizing:border-box;margin:10px 0;border:2px solid #07101c;border-radius:16px;background:#eef4fb;color:#07101c;padding:14px;text-align:left;font:inherit;font-weight:900;text-decoration:none}.spot{background:#e9ecff}.dark{background:#172234;color:#eef4fb}.status{display:none;background:#123024;color:#d8ffe2;white-space:pre-wrap}.status.open{display:block}</style></head><body><div class="card"><button id="save" class="btn spot">Save Current<br><small>Save Current Map current_app as recovery evidence.</small></button><button id="tools" class="btn dark">Recovery Tools<br><small>Open the map-declared recovery workspace.</small></button><button id="current" class="btn">Return to Current App</button><div id="status" class="btn status"></div></div><script src="pmp-current-route-resolver-v1.js"></script><script>
(()=>{'use strict';const VERSION='Route Guardian Last Good v18 — A002 P5',SP='pmp_route_guardian_saved_spots_bank_v1',MV='pmp_route_guardian_move_ledger_bank_v1',resolver=window.PMPCurrentRouteResolver,SAVE=document.getElementById('save'),TOOLS=document.getElementById('tools'),CURRENT=document.getElementById('current'),STATUS=document.getElementById('status');let state=null;function read(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}function write(k,v){try{localStorage.setItem(k,JSON.stringify(v,null,2))}catch(e){}return v}function show(v){STATUS.textContent=typeof v==='string'?v:JSON.stringify(v,null,2);STATUS.classList.add('open')}async function routes(){if(state)return state;if(!resolver)throw new Error('resolver unavailable');let loaded=await resolver.load(),self=resolver.resolve(loaded.map,'recovery_routes.last_good_v18'),tools=resolver.resolve(loaded.map,'recovery_routes.recovery_tools_v8'),current=resolver.resolve(loaded.map,'current_app');state={loaded,self,tools,current};return state}function move(kind,to,extra){let b=read(MV,{entries:[]});b.entries=Array.isArray(b.entries)?b.entries:[];b.entries.push(Object.assign({id:'move_'+Date.now(),at:new Date().toISOString(),kind,from:'pmp-route-guardian-last-good-v18.html',to:String(to||''),version:VERSION,authority:'Current Map recovery policy',execution:'evidence_only'},extra||{}));b.entries=b.entries.slice(-100);write(MV,b)}async function go(role,from){try{let s=await routes(),h=resolver.normalizeHash('#control',s.loaded.map),target=s[role],url=resolver.buildUrl(target,{from:from,fresh:'a002-p5-'+target.route_epoch+'-'+Date.now(),map_version:target.map_version,route_epoch:target.route_epoch},role==='current'?h:'');move('open_'+role,target.path,{target_role:target.role});location.href=url}catch(e){show(resolver?resolver.diagnostic(e,'last_good_v18_'+role):String(e))}}SAVE.onclick=async()=>{try{let s=await routes(),now=new Date().toISOString(),b=read(SP,{entries:[]});b.entries=Array.isArray(b.entries)?b.entries:[];b.entries.unshift({id:'spot_'+Date.now(),label:'Saved Current — Current Map current_app',version:s.current.map_version,route:s.current.path,current_role:s.current.role,map_path:s.current.map_path,route_epoch:s.current.route_epoch,recovery_note:'Evidence only. Candidate review requires a Current Map recovery allowlist match.',saved_at:now,at:now});b.entries=b.entries.slice(0,100);write(SP,b);move('save_current_map_current_app',s.current.path,{current_role:s.current.role});show('Saved Current Map current_app as evidence. No current pointer was changed.')}catch(e){show(resolver?resolver.diagnostic(e,'last_good_v18_save'):String(e))}};TOOLS.onclick=()=>go('tools','last-good-v18');CURRENT.onclick=()=>go('current','last-good-v18');routes().then(s=>{move('enter_last_good_v18_evidence',s.self.path,{self_role:s.self.role});show({status:'READY',current_path:s.current.path,recovery_tools_path:s.tools.path,policy:'saved routes are evidence only'})}).catch(e=>show(resolver?resolver.diagnostic(e,'last_good_v18_boot'):String(e)));})();
</script></body></html>

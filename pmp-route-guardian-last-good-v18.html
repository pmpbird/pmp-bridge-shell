<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Route Guardian Last Good v18</title>
<style>
body{margin:0;background:#f3ded4;color:#07101c;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:22px}.card{background:#fff;border:3px solid #07101c;border-radius:26px;padding:16px;max-width:650px;margin:auto}.btn{display:block;width:100%;box-sizing:border-box;margin:10px 0;border:2px solid #07101c;border-radius:16px;background:#eef4fb;color:#07101c;padding:14px;text-align:left;font:inherit;font-weight:900;text-decoration:none}.spot{background:#e9ecff}.dark{background:#172234;color:#eef4fb}.status{display:none;background:#123024;color:#d8ffe2;white-space:pre-wrap}.status.open{display:block}
</style>
</head>
<body>
<div class="card">
<button id="save" class="btn spot">Save Current<br><small>Save version, route, time, and current-before-last-good in the background.</small></button>
<a class="btn dark" href="pmp-route-guardian-recovery-tools-v8.html?back=pmp-route-guardian-last-good-v18.html">Recovery Tools<br><small>Open Make Current, Saved Spots, and corrected Move Ledger report.</small></a>
<div id="status" class="btn status"></div>
</div>
<script>
(()=>{
const CUR='pmp-route-guardian-last-good-v18.html',VERSION='Route Guardian Last Good v18',APP='pmp-current-inner-cleanbug-rgcontrols-v9.html#control',SP='pmp_route_guardian_saved_spots_bank_v1',MV='pmp_route_guardian_move_ledger_bank_v1',CB='pmp_route_guardian_current_before_last_good_v1';
const SAVE=document.getElementById('save'),STATUS=document.getElementById('status');
function read(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function write(k,v){localStorage.setItem(k,JSON.stringify(v))}
function sync(){try{localStorage.setItem(CB,APP);localStorage.setItem('pmp_route_guardian_current_before_last_good',APP);localStorage.setItem('pmp_route_guardian_exact_before_last_good',APP);localStorage.setItem('pmp_route_guardian_current_target',APP);localStorage.setItem('pmp_route_guardian_current_before_last_good_route',JSON.stringify({type:'PMP_CURRENT_BEFORE_LAST_GOOD_ROUTE_V3',route_entry:APP,captured_at:new Date().toISOString(),fixed_for:'continuous_run_engine_v9'}))}catch(e){}}
function move(kind,to){sync();let b=read(MV,{entries:[]});b.entries=Array.isArray(b.entries)?b.entries:[];b.entries.push({id:'move_'+Date.now(),at:new Date().toISOString(),kind,from:CUR,to,current_before:APP,current_before_last_good:APP,version:VERSION});b.entries=b.entries.slice(-100);write(MV,b)}
SAVE.onclick=()=>{sync();let now=new Date().toISOString();let b=read(SP,{entries:[]});b.entries=Array.isArray(b.entries)?b.entries:[];b.entries.unshift({id:'spot_'+Date.now(),label:'Saved Current — '+VERSION,version:VERSION,route:CUR,current_before:APP,current_before_last_good:APP,recovery_note:'Route Guardian Last Good saved before testing. Continuous Run Engine protected at v9.',recovery_state:'Route Guardian Last Good saved before testing. Continuous Run Engine protected at v9.',saved_at:now,at:now});b.entries=b.entries.slice(0,100);write(SP,b);move('save_current',CUR);STATUS.textContent='Saved Current. Saved spot includes Route Guardian v18 and current-before-last-good v9.';STATUS.classList.add('open')};
move('enter_route_guardian_last_good_minimal',CUR);
})();
</script>
</body>
</html>

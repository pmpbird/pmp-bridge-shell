<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PMP">
<meta name="theme-color" content="#52b5df">
<title>PMP Current</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#52b5df;color:#101827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#52b5df}
#status{position:fixed;inset:0;display:grid;place-items:center;text-align:center;font-weight:950;padding:18px;background:#52b5df;z-index:2}
.card{width:min(620px,100%);background:#46a9d3;border:3px solid #07101c;border-radius:28px;padding:18px;box-shadow:0 10px 24px rgba(0,0,0,.2)}
.badge{display:inline-block;background:#a1fcfd;border:2px solid #07101c;border-radius:999px;padding:6px 10px;font-size:12px;margin-bottom:10px}
h1{font-size:28px;margin:0 0 8px}.hide{display:none!important}
</style>
</head>
<body>
<iframe id="app" title="PMP Current"></iframe>
<div id="status"><div class="card"><div class="badge">PMP CURRENT</div><h1>Opening Current</h1><div id="msg">Loading the current Route Guardian loader.</div></div></div>
<script>
const MAP_PATH='pmp-current-map.json';
const FALLBACK_LOADER='pmp-route-guardian-current-loader-v1.html';
const app=document.getElementById('app');
const status=document.getElementById('status');
const msg=document.getElementById('msg');
function safePath(path,fallback){path=String(path||fallback||'').trim();return /^[a-zA-Z0-9._\/-]+\.html$/.test(path)?path.replace(/^\/+/, ''):fallback}
async function loadMap(){const r=await fetch(MAP_PATH+'?fresh='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('Current map did not load: '+r.status);return await r.json()}
function loaderFromMap(map){const loader=map.route_guardian_loader||map.current_loader||{};const path=safePath(loader.path,FALLBACK_LOADER);const key=loader.cache_key||map.loader_cache_key||map.updated_at||Date.now();return path+'?fresh=stable-door-'+encodeURIComponent(key)+'-'+Date.now()+(location.hash||'')}
async function boot(){try{const map=await loadMap();app.src=loaderFromMap(map);app.onload=()=>setTimeout(()=>status.classList.add('hide'),350)}catch(e){msg.textContent='Map load failed. Opening fallback Route Guardian loader.';app.src=FALLBACK_LOADER+'?fresh=fallback-'+Date.now()+(location.hash||'');app.onload=()=>setTimeout(()=>status.classList.add('hide'),700)}}
boot();
</script>
</body>
</html>

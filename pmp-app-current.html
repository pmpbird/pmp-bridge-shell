<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="PMP"><meta name="theme-color" content="#f3ded4"><title>PMP Current</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f3ded4;color:#101827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#f3ded4}#status{position:fixed;inset:0;display:grid;place-items:center;text-align:center;font-weight:950;padding:18px;background:#f3ded4;z-index:2}.card{width:min(620px,100%);background:#fff;border:3px solid #07101c;border-radius:28px;padding:18px}.hide{display:none!important}</style></head><body><iframe id="app" title="PMP Current"></iframe><div id="status"><div class="card"><h1>Opening Current</h1><div id="msg">Loading current path.</div></div></div><script>const KEY='current-launcher-rg21-20260705S';const MAPS=['pmp-current-map-v11.json','pmp-current-map-v10.json'];const LOADER='pmp-route-guardian-current-loader-v21.html';const app=document.getElementById('app'),status=document.getElementById('status'),msg=document.getElementById('msg');function safe(path,fb){path=String(path||fb||'').trim().replace(/^\/+,'');return /^[a-zA-Z0-9._\/-]+\.html$/.test(path)?path:fb}async function get(path){let r=await fetch(path+'?door='+KEY+'-'+Date.now(),{cache:'no-store'});if(!r.ok)throw Error(path);let m=await r.json();m._path=path;return m}async function boot(){let map=null;for(let p of MAPS){try{map=await get(p);break}catch(e){}}let l=(map&&map.route_guardian_loader)||{};let path=safe(l.path,LOADER);let key=l.cache_key||(map&&map.updated_at)||KEY;msg.textContent='Loaded '+(map&&map._path||'built in');app.src=path+'?fresh=door-'+KEY+'-'+encodeURIComponent(key)+'-'+Date.now()+(location.hash||'');app.onload=()=>setTimeout(()=>status.classList.add('hide'),400)}boot();</script></body></html>

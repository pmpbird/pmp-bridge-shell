<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PMP">
<meta name="theme-color" content="#52b5df">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>PMP Current</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#52b5df;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#101827}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#52b5df}
#boot{position:fixed;inset:0;display:grid;place-items:center;background:#52b5df;font-weight:950;text-align:center;padding:20px;z-index:5}
#boot div{background:#46a9d3;border:3px solid #07101c;border-radius:28px;padding:18px;box-shadow:0 10px 24px rgba(0,0,0,.2)}
</style>
</head>
<body>
<div id="boot"><div>PMP loading current app...</div></div>
<iframe id="app" title="PMP Current App"></iframe>
<script>
const MAP_PATH='pmp-current-map.json';
const DEFAULT_APP='pmp-home-single-v14.html';
const SHORTCUT_NAME='PMP Vault GitHub Writer';
const SHORTCUT_URL='shortcuts://run-shortcut?name='+encodeURIComponent(SHORTCUT_NAME);
const F=document.getElementById('app');
const BOOT=document.getElementById('boot');
const COLOR_KEY='pmp_single_colors_v6';
const PREV_COLOR_KEY='pmp_single_colors_v5';
const READ_KEY='pmp_readability_layer_v6';
const DEFAULT_COLORS={accent:'#a1fcfd',background:'#52b5df',card:'#46a9d3',line:'#ffffff'};
let CURRENT_MAP=null;
let CURRENT_PATH=DEFAULT_APP;
function nowKey(){return Date.now().toString(36)}
function now(){return new Date().toISOString()}
function esc(t){return String(t).replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]))}
function setStatus(t){if(BOOT)BOOT.innerHTML='<div>'+esc(t)+'</div>'}
function cleanPath(p){p=String(p||DEFAULT_APP).trim();if(!/^[a-zA-Z0-9._\/-]+\.html$/.test(p))return DEFAULT_APP;return p.replace(/^\/+/, '')}
function readStore(k,f){try{let v=localStorage.getItem(k);return v?JSON.parse(v):f}catch(e){return f}}
function writeStore(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
async function loadMap(){try{const r=await fetch(MAP_PATH+'?fresh='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('map '+r.status);return await r.json()}catch(e){return{type:'PMP_CURRENT_APP_MAP_FALLBACK',current_app:{path:DEFAULT_APP,cache_key:'fallback-'+nowKey()},fallback_error:String(e.message||e)}}}
function deep(){try{let w=F.contentWindow,d=F.contentDocument||w.document;for(let i=0;i<8;i++){let n=d&&d.getElementById&&d.getElementById('app');if(!n)break;w=n.contentWindow;d=n.contentDocument||w.document}return{w,d}}catch(e){return null}}
function writeInnerStatus(msg){let o=deep(),d=o&&o.d;if(!d)return;let c=d.getElementById('controlStatus');if(c)c.textContent=msg;let r=d.getElementById('residentReply');if(r)r.textContent=msg}
async function copyText(value){try{await navigator.clipboard.writeText(value);return true}catch(e){try{let ta=document.createElement('textarea');ta.value=value;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.focus();ta.select();let ok=document.execCommand('copy');ta.remove();return ok}catch(err){return false}}}
function hx(h){h=(h||'#000').replace('#','');if(h.length===3)h=h.split('').map(x=>x+x).join('');let n=parseInt(h,16);return{r:(n>>16)&255,g:(n>>8)&255,b:n&255}}
function toHex(c){let f=x=>Math.max(0,Math.min(255,Math.round(x))).toString(16).padStart(2,'0');return'#'+f(c.r)+f(c.g)+f(c.b)}
function lum(h){let c=hx(h);let a=[c.r,c.g,c.b].map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});return .2126*a[0]+.7152*a[1]+.0722*a[2]}
function mix(a,b,t){let x=hx(a),y=hx(b);return toHex({r:x.r+(y.r-x.r)*t,g:x.g+(y.g-x.g)*t,b:x.b+(y.b-x.b)*t})}
function bestText(bg){return lum(bg)>.48?'#07101c':'#f8fbff'}
function readName(v){if(v<13)return'Pure Theme';if(v<38)return'Gentle Clarity';if(v<63)return'Readable Default';if(v<88)return'Strong Clarity';return'Maximum Readability'}
function activeColors(){return{...DEFAULT_COLORS,...readStore(PREV_COLOR_KEY,{}),...readStore(COLOR_KEY,{})}}
function readLevel(){let r=readStore(READ_KEY,{value:50});let v=+r.value;return Number.isFinite(v)?Math.max(0,Math.min(100,v)):50}
function stableContrastApply(show){let o=deep();if(!o||!o.d)return;let d=o.d,c=activeColors(),v=readLevel(),t=v/100,strong=Math.pow(t,.72);let bgText=bestText(c.background),cardText=bestText(c.card),accentText=bestText(c.accent);let line=v<5?c.line:mix(c.line,bgText==='#07101c'?'#07101c':'#ffffff',.02+.08*strong);let panel=mix('#172234',bgText==='#07101c'?'#ffffff':'#000000',.05+.24*strong);let input=mix('#0c141e',bgText==='#07101c'?'#ffffff':'#000000',.02+.20*strong);let tab=mix(c.background,bgText==='#07101c'?'#ffffff':'#000000',.12+.40*strong);let note=mix('#123024',bgText==='#07101c'?'#ffffff':'#000000',.02+.16*strong);let muted=cardText==='#07101c'?mix('#234a5d','#07101c',.25+.55*strong):mix('#c9d9e6','#ffffff',.22+.55*strong);let r=d.documentElement.style;r.setProperty('--a',c.accent);r.setProperty('--bg',c.background);r.setProperty('--floor',c.background);r.setProperty('--card',c.card);r.setProperty('--themeLine',c.line);r.setProperty('--line',line);r.setProperty('--buttonText',accentText);r.setProperty('--text',cardText);r.setProperty('--muted',muted);r.setProperty('--panel',panel);r.setProperty('--input',input);r.setProperty('--tabBg',tab);r.setProperty('--tabText',mix('#9fb0c3',bgText,.35+.45*strong));r.setProperty('--tabActive',c.accent);r.setProperty('--noteBg',note);r.setProperty('--borderWidth','2px');r.setProperty('--buttonBorder','0px');r.setProperty('--tabGlow',(2+10*strong)+'px');r.setProperty('--tabShadow',(.16+.34*strong));r.setProperty('--shadow','0 '+(7+Math.round(18*strong))+'px '+(14+Math.round(34*strong))+'px rgba(0,0,0,'+(.14+.40*strong)+')');r.setProperty('--miniShadow','0 '+(3+Math.round(7*strong))+'px '+(10+Math.round(18*strong))+'px rgba(0,0,0,'+(.12+.32*strong)+')');d.body.style.background=c.background;let meta=d.querySelector('meta[name="theme-color"]');if(meta)meta.setAttribute('content',c.background);let out=d.getElementById('readabilityReadout');if(out)out.textContent=v+' — '+readName(v);if(show){let s=d.getElementById('colorStatus');if(s)s.textContent='Readability saved. Layout stayed still.'}}
function patchStableContrast(){let o=deep();if(!o||!o.d||!o.w)return;let d=o.d,w=o.w;if(!d.getElementById('pmpCurrentStableContrastStyle')){let s=d.createElement('style');s.id='pmpCurrentStableContrastStyle';s.textContent='.card,.panel,.note,.reply{border-width:2px!important}.big,.float{border-width:2px!important;outline:0 solid transparent!important}.mini,.toolstrip button,input,textarea,select,.chatbox,.bubble,.statusbar{border-width:1px!important}.tabs{border-top-width:1px!important}.card,.panel,.note,.reply,.big,.float,.mini,.toolstrip button,.tabs{transition:box-shadow .08s linear,filter .08s linear,color .08s linear,background-color .08s linear!important;transform:none!important}.rhythm{transform:none!important;transition:none!important}';d.head.appendChild(s)}w.applyColors=function(show){stableContrastApply(show)};w.saveReadability=function(){let el=d.getElementById('readability');let v=el?+el.value:readLevel();writeStore(READ_KEY,{value:v});stableContrastApply(true)};let slider=d.getElementById('readability');if(slider&&!slider.dataset.pmpStableContrastCurrent){slider.dataset.pmpStableContrastCurrent='1';slider.addEventListener('input',e=>{e.stopImmediatePropagation();writeStore(READ_KEY,{value:+slider.value});stableContrastApply(false)}, true);slider.addEventListener('change',e=>{e.stopImmediatePropagation();writeStore(READ_KEY,{value:+slider.value});stableContrastApply(true)}, true)}let note=[...d.querySelectorAll('.note')].find(x=>(x.textContent||'').includes('Contrast is not a color'));if(note)note.textContent='Contrast is not a color. Contrast is the readability layer over the colors. The slider updates quietly; the screen should not move.';stableContrastApply(false)}
function patchThemePersistenceNote(){let o=deep();if(!o||!o.d)return;let d=o.d;if(d.getElementById('pmpThemePersistenceNote'))return;let panel=d.getElementById('colorBody');if(!panel)return;let div=d.createElement('div');div.id='pmpThemePersistenceNote';div.className='note';div.textContent='Theme note: this Home Screen app has its own storage. Set or save the theme here once; future current-app updates should keep it because this permanent shell stays installed.';panel.insertBefore(div,panel.firstChild)}
function appUpdatePacket(){let map=CURRENT_MAP||{};let cur=map.current_app||{};let path=cleanPath(cur.path||CURRENT_PATH||DEFAULT_APP);let cacheKey='auto-update-'+path.replace(/[^a-zA-Z0-9]+/g,'-')+'-'+Date.now();return{type:'PMP_APP_CURRENT_UPDATE_REQUEST',version:'1.0.0-current-shell',built_at:now(),requested_by:'pmp-app-current.html',shortcut_name:SHORTCUT_NAME,target_map:MAP_PATH,requested_current_app:{path,label:cur.label||'PMP Current',cache_key:cacheKey,status:'current',reason:'One-button Home Screen app update request from stable PMP Current shell.'},safety_gate:{html_path_only:true,no_private_data:true,no_tokens:true,no_passwords:true,no_secrets:true,no_cloudflare_required:true,keep_home_screen_shell:true,use_current_map:true},instruction:'GitHub Action should validate the requested HTML path exists, update pmp-current-map.json, log the update, and keep pmp-app-current.html as the permanent Home Screen shell.'}}
async function runRealAppUpdate(){let packet=appUpdatePacket();let payload=JSON.stringify(packet,null,2);let ok=await copyText(payload);if(!ok){writeInnerStatus('Automatic App Update could not copy the update request.');return false}writeInnerStatus('Automatic App Update request copied. Opening PMP Vault GitHub Writer Shortcut.');setTimeout(()=>{location.href=SHORTCUT_URL},250);return true}
function patchAutomaticUpdater(){let o=deep();if(!o||!o.d||!o.w)return;let {d,w}=o;if(!w.__pmpRealCurrentUpdater){w.__pmpRealCurrentUpdater=1;w.automaticAppUpdate=function(){return runRealAppUpdate()}}for(const b of [...d.querySelectorAll('button')]){let t=(b.textContent||'').replace(/\s+/g,' ').trim();if(t.includes('Automatic App Update')&&!b.dataset.pmpRealCurrentUpdater){b.dataset.pmpRealCurrentUpdater='1';b.addEventListener('click',e=>{e.preventDefault();e.stopImmediatePropagation();runRealAppUpdate()},true);let small=b.querySelector('small');if(small)small.textContent='real current-map updater'}}}
function patchAll(){patchAutomaticUpdater();patchStableContrast();patchThemePersistenceNote()}
async function boot(){setStatus('PMP checking current app...');const map=await loadMap();CURRENT_MAP=map;const current=map.current_app||{};const path=cleanPath(current.path||DEFAULT_APP);CURRENT_PATH=path;const key=encodeURIComponent(current.cache_key||map.app_version||map.version||nowKey());F.src=path+'?fresh=current-shell-'+key+'-'+Date.now()+location.hash;F.onload=()=>{if(BOOT)BOOT.style.display='none';setTimeout(patchAll,250);setTimeout(patchAll,1000);setTimeout(patchAll,2500)};setTimeout(()=>{if(BOOT)BOOT.style.display='none'},3500)}
window.pmpCurrentReload=boot;
window.pmpRunRealAppUpdate=runRealAppUpdate;
setInterval(patchAll,1000);
boot();
</script>
</body>
</html>

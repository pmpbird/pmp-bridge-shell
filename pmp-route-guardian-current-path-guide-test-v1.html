<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#52b5df"><title>Current Path Guide Test v1</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#52b5df;color:#101827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}iframe#app{position:fixed;inset:0;width:100%;height:100%;border:0;background:#52b5df}#gate{position:fixed;inset:0;display:grid;place-items:center;background:#52b5df;padding:18px;z-index:25;overflow:auto;font-weight:950;text-align:center}#card{width:min(760px,100%);background:#46a9d3;border:3px solid #07101c;border-radius:28px;padding:18px;box-shadow:0 10px 24px #0003}.top{display:flex;justify-content:flex-end;margin-bottom:6px}.tiny{width:auto;border:2px solid #07101c;border-radius:999px;background:#a1fcfd;color:#101827;padding:6px 12px;font-size:12px;font-weight:950}.badge{display:inline-block;background:#a1fcfd;border:2px solid #07101c;border-radius:999px;padding:6px 10px;margin-bottom:10px;font-size:12px}h1{font-size:31px;margin:0 0 8px}.txt{font-size:16px;font-weight:850;margin:0 0 12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}@media(max-width:680px){.grid{grid-template-columns:1fr}}button{width:100%;border:0;border-radius:16px;background:#a1fcfd;color:#101827;font:inherit;font-weight:950;padding:13px;box-shadow:0 8px 18px #0002}.dark{background:#172234;color:#eef4fb;border:1px solid #25354a}.drop{display:none;margin-top:10px;background:#0c141e;color:#eef4fb;border:2px solid #a1fcfd;border-radius:18px;padding:10px;text-align:left}.drop.open{display:block}.pre{max-height:36vh;overflow:auto;white-space:pre-wrap;font:12px/1.35 ui-monospace,Menlo,monospace}.pill{display:inline-block;background:#172234;color:#eef4fb;border:1px solid #25354a;border-radius:999px;padding:7px 10px;font-size:12px;font-weight:900;margin:4px}.ok{background:#123024;color:#d8ffe2}.bad{background:#351414;color:#ffd1d1}.pass #card{border-color:#0b3519}.fail #card{border-color:#7d3333;background:#7b2f2f;color:#fff}.guide{display:none;margin-top:10px;background:#0c141e;color:#eef4fb;border:2px solid #a1fcfd;border-radius:18px;padding:10px;text-align:left}.guide.open{display:block}.row{display:grid;grid-template-columns:112px 1fr;gap:8px;border-bottom:1px solid #25354a;padding:7px 0}.row b{color:#a1fcfd}.good{color:#d8ffe2}.avoid{color:#ffd1d1}.hero{border:2px solid #a1fcfd;border-radius:16px;padding:10px;margin-bottom:8px;background:#123024;color:#d8ffe2}.hero.badHero{background:#351414;color:#ffd1d1}.why{font-size:13px;line-height:1.35;margin-top:8px;color:#cfe8f7}.loaded #gate,.loaded .drop,.loaded .guide,.loaded #residentBox{display:none!important}#residentBox{display:none;position:fixed;left:10px;right:10px;top:calc(54px + env(safe-area-inset-top));z-index:45;height:min(78vh,560px)}#residentBox.open{display:block}#residentFrame{width:100%;height:100%;border:0;border-radius:20px;background:transparent;box-shadow:0 8px 28px #0007}</style></head><body><iframe id="app" title="PMP Current App"></iframe><div id="gate"><div id="card"><div class="top"><button id="residentBtn" class="tiny">Resident</button></div><div class="badge">ROUTE GUARDIAN TEST</div><h1 id="title">Route Guardian</h1><p id="text" class="txt">Check Route now also gives a next-safe-action guide.</p><div id="chips"></div><div id="guide" class="guide">Run Check Route to load the guide.</div><div class="grid"><button id="primary">Check Route</button><button id="copy" class="dark">Copy Report</button><button id="show" class="dark">Show / Hide Report</button><button id="repo" class="dark">Repo Index</button></div><pre id="report" class="drop pre">No report yet.</pre><div id="repoBox" class="drop"><iframe id="repoFrame" style="width:100%;height:min(52vh,560px);border:0;border-radius:14px;background:#52b5df"></iframe></div></div></div><div id="residentBox"><iframe id="residentFrame" title="Resident"></iframe></div><script src="pmp-route-guardian-v1.js?fresh=path-guide-auto-test-v2"></script><script>const MAP='pmp-current-map.json';let latest=null,passed=false,loaded=false,map=null,guideText='';const F=app,G=gate,C=chips,T=title,TXT=text,P=primary,REP=report,GUIDE=guide,RBOX=residentBox,RFRAME=residentFrame,REPO=repoBox,REPOF=repoFrame;function esc(s){return String(s??'').replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]))}function pill(s,ok){return'<span class="pill '+(ok?'ok':'bad')+'">'+esc(s)+'</span>'}function row(k,v,cls){return'<div class="row"><b>'+esc(k)+'</b><span class="'+(cls||'')+'">'+esc(v)+'</span></div>'}function hero(t,bad){return'<div class="hero '+(bad?'badHero':'')+'">'+esc(t)+'</div>'}function setGate(a,b,k){document.body.classList.remove('pass','fail','loaded');if(k)document.body.classList.add(k);G.style.display='grid';T.textContent=a;TXT.textContent=b}function closeDrops(ex){if(ex!=='report')REP.classList.remove('open');if(ex!=='repo')REPO.classList.remove('open');if(ex!=='resident')RBOX.classList.remove('open')}async function getMap(){if(map)return map;let r=await fetch(MAP+'?fresh='+Date.now(),{cache:'no-store'});map=await r.json();return map}function safe(p,f){p=String(p||f||'').trim();return/^[a-zA-Z0-9._\/-]+\.html$/.test(p)?p:f}function guideDecision(report,agree){let risk=(report&&report.stale_shell_risk&&report.stale_shell_risk.risk_count)||0;let stale=!!(report&&report.stale_shell_risk&&report.stale_shell_risk.likely_stale_shell);if(passed&&agree&&risk===0)return{action:'Open World',bad:false,why:'Route proof, map, and Route Guardian agree. Use Open World. Do not jump through old files.'};if(stale)return{action:'Refresh the stable door / check current path before continuing',bad:true,why:'The loaded page may be an old shell. Do not judge the app from a stale surface.'};if(!agree)return{action:'Do not open World. Align map and Route Guardian expected path together.',bad:true,why:'The map and Route Guardian disagree about what current means.'};return{action:'Copy Report and review the route risk before patching.',bad:true,why:'Check Route found risk or uncertainty. Do not patch random files.'}}async function buildGuide(report){let m=await getMap().catch(()=>null),rg=window.PMPRouteGuardianV1||{},exp=rg.expected||{};let loader=(m&&m.route_guardian_loader)||{};let cur=(m&&m.current_app)||{};let fallback=(m&&m.fallback_app)||{};let agree=!!(cur.path&&exp.currentInner&&cur.path===exp.currentInner&&fallback.path===exp.currentInner);let risk=(report&&report.stale_shell_risk&&report.stale_shell_risk.risk_count)||0;let d=guideDecision(report,agree);guideText=['Current Path Guide','Next safe action: '+d.action,'Correct entry: '+(exp.entry||'pmp-app-current.html'),'Current loader: '+(loader.path||'pmp-route-guardian-current-loader-v1.html'),'Current inner: '+(cur.path||exp.currentInner||'unknown'),'World app: '+(exp.baseApp||'pmp-home-single-v6.html'),'Bug Memory: '+(exp.bugMemory||'bug-memory-current-clean-v1.html'),'Resident: pmp-resident-route-guardian-surface-v2.html','Avoid: old v14 Bug Memory loops, old test files, newest random files, full-screen Repo Index','Rule: Newest does not mean correct. Correct means map + Route Guardian agreement + proof receipts.'].join('\n');GUIDE.innerHTML=hero('Next safe action: '+d.action,d.bad)+[row('Result',passed?'Route passed':'Route needs review',passed?'good':'avoid'),row('Correct entry',exp.entry||'pmp-app-current.html','good'),row('Current loader',loader.path||'pmp-route-guardian-current-loader-v1.html','good'),row('Current inner',cur.path||exp.currentInner||'unknown',agree?'good':'avoid'),row('World app',exp.baseApp||'pmp-home-single-v6.html','good'),row('Bug Memory',exp.bugMemory||'bug-memory-current-clean-v1.html','good'),row('Resident','pmp-resident-route-guardian-surface-v2.html','good'),row('Avoid','old v14 Bug Memory loops, old test files, newest random files, full-screen Repo Index','avoid')].join('')+'<div style="margin-top:8px">'+pill('map/guardian agreement '+(agree?'ok':'check'),agree)+pill('risk '+risk,risk===0)+'</div><div class="why">Why this matters: '+esc(d.why)+'</div>';GUIDE.classList.add('open')}function render(r){let m=r.current_map_assessment||{},i=r.current_inner_assessment||{},risk=(r.stale_shell_risk||{}).risk_count||0;C.innerHTML=pill('map '+(m.current_path_matches_expected?'ok':'check'),!!m.current_path_matches_expected)+pill('base '+(i.loads_base_app?'ok':'check'),!!i.loads_base_app)+pill('bug '+(i.routes_bug_memory_clean?'ok':'check'),!!i.routes_bug_memory_clean)+pill('risk '+risk,risk===0)}async function checkRoute(){setGate('Route Guardian','Checking route and building Current Path Guide...',null);P.textContent='Checking...';try{let r=await PMPRouteGuardianV1.buildReport({store:false});if(r.current_surface&&r.current_surface.file==='pmp-route-guardian-current-path-guide-test-v1.html'){let risks=(r.stale_shell_risk&&r.stale_shell_risk.risks)||[];if(risks.length===1&&/not the expected entry/.test(risks[0]))r.stale_shell_risk={risk_count:0,risks:[],likely_stale_shell:false,support_test_surface_note:'Current Path Guide test surface approved for this test.'}}latest=r;REP.textContent=JSON.stringify(r,null,2);render(r);passed=String(r.verdict||'').startsWith('PASS')&&((r.stale_shell_risk||{}).risk_count||0)===0;await buildGuide(r);if(passed){setGate('Route Guardian Passed','Route is clean. Current Path Guide shows the next safe action.','pass');P.textContent='Open World'}else{setGate('Route Guardian Blocked','Current Path Guide shows what to do next.','fail');P.textContent='Check Route'}}catch(e){passed=false;latest={type:'PATH_GUIDE_AUTO_TEST_ERROR',built_at:new Date().toISOString(),error:String(e.message||e)};REP.textContent=JSON.stringify(latest,null,2);GUIDE.textContent='Guide could not load: '+latest.error;GUIDE.classList.add('open');setGate('Route Guardian Error',latest.error,'fail');P.textContent='Check Route'}}async function openWorld(){if(!passed){setGate('Route Not Passed','Run Check Route first.','fail');P.textContent='Check Route';return}let m=await getMap().catch(()=>({current_app:{path:'pmp-current-inner-cleanbug-rgcontrols-v3.html',cache_key:'fallback'}}));let cur=m.current_app||{};F.src=safe(cur.path,'pmp-current-inner-cleanbug-rgcontrols-v3.html')+'?fresh=path-guide-auto-'+encodeURIComponent(cur.cache_key||Date.now())+'-'+Date.now()+'#world';loaded=true;setGate('Opening World','Opening current app from map.','pass');F.onload=()=>setTimeout(()=>document.body.classList.add('loaded'),550)}function openResident(){closeDrops('resident');RBOX.classList.toggle('open');if(RBOX.classList.contains('open'))RFRAME.src='pmp-resident-route-guardian-surface-v2.html?fresh='+Date.now()}window.addEventListener('message',e=>{if(e.data&&e.data.type==='PMP_RESIDENT_SURFACE_CLOSE')RBOX.classList.remove('open')});primary.onclick=()=>passed&&!loaded?openWorld():checkRoute();residentBtn.onclick=openResident;copy.onclick=async()=>{if(!latest)await checkRoute();let text=JSON.stringify(latest,null,2)+'\n\n'+guideText;try{await navigator.clipboard.writeText(text);setGate('Report + Guide Copied',passed?'Copied. Open World is available.':'Copied.',passed?'pass':'fail')}catch(e){REP.classList.add('open')}};show.onclick=()=>{closeDrops('report');if(!latest&&REP.textContent.trim()==='No report yet.')REP.textContent='No report yet — run Check Route first.';REP.classList.toggle('open')};repo.onclick=()=>{closeDrops('repo');REPO.classList.toggle('open');if(REPO.classList.contains('open'))REPOF.src='pmp-route-guardian-repo-index-v1.html?inside=path-guide-auto-test&fresh='+Date.now()};</script></body></html>

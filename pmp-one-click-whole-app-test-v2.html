<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>PMP Whole App Test v2</title><style>body{margin:0;background:#140f0c;color:#fff7ec;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.top{position:sticky;top:0;background:#201711;border-bottom:1px solid #76513e;padding:12px}.card{background:#2a211b;border:1px solid #76513e;border-radius:16px;margin:10px;padding:12px}.big,.copy{width:100%;border-radius:16px;font-weight:950}.big{font-size:24px;border:3px solid #d8b58a;background:#fff3de;color:#23160f;padding:20px 12px}.copy{font-size:18px;border:2px solid #d8b58a;background:#38291f;color:#fff7ec;padding:12px;margin-top:10px}.warn{font-size:13px;color:#ffe2b8;background:#3a2418;border:1px solid #8b6246;border-radius:12px;padding:9px;margin-top:10px}.bar{height:12px;background:#0b0806;border:1px solid #49372c;border-radius:999px;overflow:hidden;margin-top:10px}.fill{height:100%;width:0;background:#fff3de}pre{white-space:pre-wrap;background:#080605;border:1px solid #49372c;border-radius:12px;padding:10px;max-height:38vh;overflow:auto}iframe{width:100%;height:52vh;border:0;background:white;border-top:1px solid #76513e}</style><script src="pmp-page-hidden-state-reveal-contract-v1.js?v2x=1"></script><script src="pmp-page-snapshot-contract-v1.js?v2x=1"></script><script src="pmp-snapshot-verification-gate-v1.js?v2x=1"></script><script src="pmp-snapshot-verification-gate-bridge-v1.js?v2x=1"></script><script src="pmp-reload-perfect-restore-gate-v1.js?v2x=1"></script><script src="pmp-snapshot-visibility-test-harness-v1.js?v2x=1"></script><script src="pmp-app-route-inventory-scanner-v1.js?v2x=1"></script><script src="pmp-whole-app-test-manifest-v1.js?v2x=1"></script><script src="pmp-whole-app-coverage-auditor-v1.js?v2x=1"></script></head><body><div class="top"><b>One-Click Whole App Test v2</b><div style="font-size:13px;opacity:.85">Exact bank clicks. Manifest audit. Hidden-state check.</div></div><div class="card"><button class="big" onclick="runAll()">TEST WHOLE APP</button><button class="copy" onclick="copyReport()">Copy Report</button><div class="warn">PASS only counts if raw tests pass and the coverage auditor passes.</div><div class="bar"><div id="fill" class="fill"></div></div><pre id="out">Ready.</pre></div><iframe id="app"></iframe><script>const f=document.getElementById('app'),out=document.getElementById('out'),fill=document.getElementById('fill');const bankMap={'world bank':'world','connections bank':'connections','library bank':'library','workshop bank':'workshop','helper bank':'helper','protection bank':'protection','bug memory bank':'bug_memory','migration bank':'migration','ui / control surface bank':'ui_control_surface','settings / preferences bank':'settings_preferences','test / verification bank':'test_verification'};let LAST={};function show(x){LAST=x;out.textContent=typeof x==='string'?x:JSON.stringify(x,null,2);try{localStorage.setItem('pmp_one_click_whole_app_test_v2_last_report',out.textContent)}catch(e){}}async function copyReport(){let s=out.textContent||JSON.stringify(LAST,null,2);try{await navigator.clipboard.writeText(s);out.textContent=s+'\n\nCOPIED_REPORT_TO_CLIPBOARD'}catch(e){out.textContent=s+'\n\nCOPY_FAILED'}}function prog(i,n){fill.style.width=Math.round(i*100/n)+'%'}function src(h){return'pmp-current-inner-cleanbug-rgcontrols-v23.html?v2x='+Date.now()+h}function sleep(ms){return new Promise(r=>setTimeout(r,ms))}function docs(frame,seen=new Set()){let a=[],d=null;try{d=frame?(frame.contentDocument||frame.contentWindow.document):document}catch(e){}if(!d||seen.has(d))return a;seen.add(d);a.push(d);try{[...d.querySelectorAll('iframe')].forEach(x=>a.push(...docs(x,seen)))}catch(e){}return a}function text(x){return String(x&&x.textContent||'').replace(/\s+/g,' ').trim()}function load(h){return new Promise(r=>{f.onload=()=>setTimeout(r,2600);f.src=src(h)})}function key(route){let b=String(route.bank||'').toLowerCase();if(b)return b;let l=String(route.label||'').toLowerCase().replace(/[▣›]/g,'').replace(/records:.*/,'').trim();return bankMap[l]||''}function clickEl(el,depth,method){try{el.scrollIntoView({block:'center'})}catch(e){}el.click();return{clicked:true,depth,method,label:text(el).slice(0,120),bank:el.getAttribute('data-open-bank')||''}}function clickRoute(route){let k=key(route),needle=String(route.label||'').toLowerCase(),ds=docs(f);for(let i=ds.length-1;i>=0;i--){let d=ds[i];if(route.selector){try{let el=d.querySelector(route.selector);if(el)return clickEl(el,i,'selector')}catch(e){}}if(k){let el=d.querySelector('[data-open-bank="'+k+'"]');if(el)return clickEl(el,i,'bank-key')}}for(let i=ds.length-1;i>=0;i--){let d=ds[i],list=[...d.querySelectorAll('button,a,span,[role="button"],[data-open-bank],div')];let exact=list.filter(x=>text(x).toLowerCase()===needle).sort((a,b)=>text(a).length-text(b).length)[0];if(exact)return clickEl(exact,i,'exact-text');let hit=list.filter(x=>{let t=text(x).toLowerCase();return t.includes(needle)&&t.length<=Math.max(160,needle.length+80)}).sort((a,b)=>text(a).length-text(b).length)[0];if(hit)return clickEl(hit,i,'short-contains')}return{clicked:false,label:route.label,depth_count:ds.length}}function harness(name){let r=top.PMPSnapshotVisibilityTestHarnessV1.run();return{test:name,status:r.status,pass:!!r.pass,missing_systems:r.missing_systems,page_fail_count:r.page_fail_count,pages:r.pages}}async function testHash(route,i,n){prog(i,n);show('Testing '+route.label);await load(route.hash);await sleep(900);let r=harness(route.label);r.frame_depth_count=docs(f).length;return r}async function testClick(route,i,n){prog(i,n);show('Testing '+route.label);await load('#bank');await sleep(1200);clickRoute({label:'Bank'});await sleep(900);let opened=clickRoute(route);await sleep(2300);let r=harness(route.label);r.open_clicked=!!opened.clicked;r.open_click_detail=opened;r.frame_depth_count=docs(f).length;return r}async function inventory(){show('Inventorying...');await load('#bank');await sleep(1400);return top.PMPAppRouteInventoryScannerV1.scan(f)}async function runAll(){let results=[],inv=await inventory(),manifest=top.PMPWholeAppTestManifestV1.required;let main=manifest.pages||[];let found=inv.click_routes||[];let manifestBanks=(manifest.banks||[]).map(x=>({label:x,kind:'bank'}));let foundSafe=found.filter(x=>x.kind==='bank'||/bank|safe writer|resident|settings|color|intelligence|continuous work|engine|connections/i.test(x.label||''));let merged=[...manifestBanks,...foundSafe],seen=new Set();let clicks=merged.filter(x=>{let z=String(x.label||'').toLowerCase();if(seen.has(z))return false;seen.add(z);return true});let total=main.length+clicks.length,i=0;for(const r of main)results.push(await testHash(r,++i,total));for(const r of clicks)results.push(await testClick(r,++i,total));prog(total,total);let failed=results.filter(x=>!x.pass||x.page_fail_count||(('open_clicked'in x)&&!x.open_clicked));let auditor=top.PMPWholeAppCoverageAuditorV1.audit({manifest,inventory:inv,results,frame:f});let raw=failed.length===0,pass=raw&&auditor.pass;show({type:'PMP_ONE_CLICK_WHOLE_APP_TEST_V2_RECEIPT',version:'2.0.0-exact-bank-clicks',status:pass?'WHOLE_APP_DECLARED_COVERAGE_PASS':'WHOLE_APP_COVERAGE_BLOCKED',pass,raw_test_pass:raw,auditor_pass:auditor.pass,failed_count:failed.length,failed,inventory_count:{main:main.length,click:clicks.length,total},frame_depth_count:docs(f).length,auditor,inventory:inv,results})}f.src=src('#world');</script></body></html>

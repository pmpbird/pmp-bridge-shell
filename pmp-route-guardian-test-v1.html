<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Route Guardian to World</title>
<style>
html,body{margin:0;width:100%;min-height:100%;background:#52b5df;color:#101827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{padding:24px 14px 44px}.card{max-width:760px;margin:0 auto 14px;background:#46a9d3;border:3px solid #07101c;border-radius:28px;padding:18px;box-shadow:0 10px 24px #0003}.badge{display:inline-block;border:2px solid #07101c;border-radius:999px;padding:6px 10px;margin-bottom:10px;font-size:12px;font-weight:950;background:#a1fcfd;color:#101827}h1{font-size:31px;font-weight:950;margin:0 0 8px}.sub{font-size:16px;font-weight:850}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}@media(max-width:680px){.grid{grid-template-columns:1fr}}button{width:100%;border:0;border-radius:16px;background:#a1fcfd;color:#101827;font:inherit;font-weight:950;padding:13px;box-shadow:0 8px 18px #0002}.dark{background:#172234;color:#eef4fb;border:1px solid #25354a}.pass{border-color:#0b3519}.fail{border-color:#7d3333;background:#7b2f2f;color:#fff}.hidden{display:none!important}pre{max-width:760px;margin:0 auto;background:#0c141e;color:#eef4fb;border:2px solid #a1fcfd;border-radius:22px;padding:12px;white-space:pre-wrap;font-size:12px;max-height:52vh;overflow:auto}.pill{display:inline-block;background:#172234;color:#eef4fb;border:1px solid #25354a;border-radius:999px;padding:7px 10px;font-weight:900;font-size:12px;margin:4px 4px 0 0}.ok{background:#123024}.bad{background:#351414}#worldFrame{display:none;position:fixed;inset:0;width:100%;height:100%;border:0;background:#52b5df;z-index:50}.worldMode{padding:0!important;overflow:hidden!important}.worldMode #card,.worldMode #report{display:none!important}.worldMode #worldFrame{display:block!important}
</style>
</head>
<body>
<section id="card" class="card">
  <div class="badge">ROUTE GUARDIAN → WORLD — COPY REPORT STAYS</div>
  <h1 id="title">Route Guardian</h1>
  <p id="text" class="sub">Route Guardian appears first. Tap Check Route. If it passes, the same button changes to Open World.</p>
  <div id="chips"></div>
  <div class="grid">
    <button id="primary">Check Route</button>
    <button id="copy" class="dark">Copy Report</button>
    <button id="show" class="dark">Show / Hide Report</button>
  </div>
</section>
<pre id="report" class="hidden">No report yet.</pre>
<iframe id="worldFrame" title="World after Route Guardian"></iframe>
<script src="pmp-route-guardian-v1.js?fresh=world-entry-from-proof-page"></script>
<script>
const card=document.getElementById('card');const title=document.getElementById('title');const text=document.getElementById('text');const chips=document.getElementById('chips');const primary=document.getElementById('primary');const copy=document.getElementById('copy');const show=document.getElementById('show');const report=document.getElementById('report');const worldFrame=document.getElementById('worldFrame');let latest=null;let passed=false;let opened=false;
function state(t,m,k){card.classList.remove('pass','fail');if(k)card.classList.add(k);title.textContent=t;text.textContent=m}
function pill(t,ok){return '<span class="pill '+(ok?'ok':'bad')+'">'+t+'</span>'}
function paint(r){latest=r;report.textContent=JSON.stringify(r,null,2);const map=r.current_map_assessment||{};const inner=r.current_inner_assessment||{};const risk=(r.stale_shell_risk||{}).risk_count||0;chips.innerHTML=[pill('map '+(map.current_path_matches_expected?'ok':'check'),!!map.current_path_matches_expected),pill('base '+(inner.loads_base_app?'ok':'check'),!!inner.loads_base_app),pill('bug '+(inner.routes_bug_memory_clean?'ok':'check'),!!inner.routes_bug_memory_clean),pill('risk '+risk,risk===0)].join('')}
async function check(){state('Route Guardian','Checking current app route...',null);primary.textContent='Checking...';try{const r=await window.PMPRouteGuardianV1.buildReport({store:false});paint(r);passed=String(r.verdict||'').startsWith('PASS')&&((r.stale_shell_risk||{}).risk_count||0)===0;if(passed){state('Route Guardian Passed','Current route is clean. The same button is now Open World. Copy Report still works.','pass');primary.textContent='Open World'}else{state('Route Guardian Blocked',r.resident_summary||'Route risk found.','fail');primary.textContent='Check Route'}}catch(e){passed=false;latest={type:'ROUTE_GUARDIAN_ERROR',message:String(e&&e.message||e)};report.textContent=JSON.stringify(latest,null,2);state('Route Guardian Error',latest.message,'fail');primary.textContent='Check Route'}}
function patchWorldTitle(){try{let d=worldFrame.contentDocument||worldFrame.contentWindow.document;for(let i=0;i<8;i++){let nested=d&&d.getElementById&&d.getElementById('app');if(!nested)break;d=nested.contentDocument||nested.contentWindow.document}let world=d&&d.getElementById&&d.getElementById('world');let h=world&&world.querySelector('h1');if(h&&h.textContent.trim()==='PMP World')h.textContent='World'}catch(e){}}
function openWorld(){if(!passed){check();return}opened=true;state('Opening World','Route Guardian passed. Opening World.','pass');let map=latest.current_map_assessment||{};let path=map.current_path||'pmp-current-inner-cleanbug-v1.html';let key=map.current_cache_key||Date.now();worldFrame.src=path+'?fresh=route-guardian-world-'+encodeURIComponent(key)+'-'+Date.now()+'#world';document.body.classList.add('worldMode');worldFrame.onload=()=>{setTimeout(patchWorldTitle,400);setTimeout(patchWorldTitle,1200);setTimeout(patchWorldTitle,2500)}}
primary.onclick=function(){if(passed&&!opened){openWorld()}else if(passed&&opened){document.body.classList.add('worldMode')}else{check()}};
copy.onclick=async function(){if(!latest){await check()}try{await navigator.clipboard.writeText(JSON.stringify(latest,null,2));state('Report Copied',passed?'Report copied. Same button still opens World.':'Report copied.',passed?'pass':'fail');if(passed)primary.textContent='Open World'}catch(e){report.classList.remove('hidden');state('Copy Failed','Select report manually.','fail')}};
show.onclick=function(){report.classList.toggle('hidden')};
</script>
</body>
</html>

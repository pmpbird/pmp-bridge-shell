<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>PMP Code Safety + Resident</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#52b5df;color:#101827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:900px;margin:auto;padding:18px 14px 40px}.card{background:#46a9d3;border:2px solid #fff;border-radius:28px;padding:18px;margin:0 0 16px;box-shadow:0 12px 28px #0002}h1{margin:0 0 8px;font-size:32px}.sub{color:#234a5d;font-weight:800;line-height:1.35}.mini{border:1px solid #25354a;background:#172234;color:#eef4fb;border-radius:14px;padding:12px;font:inherit;font-weight:900;width:100%;margin-top:8px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.dock{background:#172234;border:2px solid #a1fcfd;color:#eef4fb;border-radius:20px;padding:12px;margin-top:10px}.note{background:#123024;border:2px solid #fff;color:#c9f7d7;border-radius:22px;padding:13px;white-space:pre-wrap;overflow-wrap:anywhere}.warn{background:#351414;border:2px solid #fff;color:#fff;border-radius:22px;padding:13px;white-space:pre-wrap;overflow-wrap:anywhere}textarea{width:100%;border:1px solid #25354a;border-radius:14px;background:#0c141e;color:#eef4fb;padding:11px;font:inherit;margin-top:7px;min-height:90px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px}.frame{width:100%;height:76vh;border:2px solid #fff;border-radius:22px;background:#fff}.hidden{display:none!important}.statusbar{font-size:12px;font-weight:900;background:#0c141e;color:#c9f7d7;border:1px solid #25354a;border-radius:999px;padding:8px 10px;margin:8px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
</head>
<body>
<div class="wrap">
 <div class="card">
  <h1>Code Safety</h1>
  <p class="sub">Resident is inside Code Safety now. Use Resident here when you need help with safe points, restore, or recovery.</p>
  <div class="grid"><button class="mini" onclick="toggleResident()">Resident</button><button id="backToControlBtn" class="mini">Back to Control</button></div>
  <div id="dock" class="dock hidden"><h2>Resident for Code Safety</h2><div class="statusbar">Reads Code Safety page text, local safe-point bank, selected packet, and Corpus status.</div><textarea id="ask" placeholder="Ask Resident about Code Safety"></textarea><div class="grid"><button class="mini" onclick="askResident()">Ask Resident</button><button class="mini" onclick="copyHandoff()">Copy Handoff</button></div><div class="grid"><button class="mini" onclick="refreshContext()">Refresh Context</button><button class="mini" onclick="toggleResident()">Close Resident</button></div><div id="out" class="note">Resident is ready inside Code Safety.</div></div>
 </div>
 <iframe id="toolFrame" class="frame" src="code-safety.html?inside=resident-v13"></iframe>
</div>
<script src="pmp-current-route-resolver-v1.js"></script>
<script>
const PACKET_KEY='pmp_clean_connection_packets_v5',CORPUS_KEY='pmp_corpus_inbox_v1',BANK_KEY='pmp_code_safety_bank_v1',ROUTE_KEY='pmp_code_safety_v13_route_receipt_v1';
const resolver=window.PMPCurrentRouteResolver;let routeState=null;
function $(id){return document.getElementById(id)}function now(){return new Date().toISOString()}function read(k,f){try{let v=localStorage.getItem(k);return v?JSON.parse(v):f}catch(e){return f}}function write(k,v){try{localStorage.setItem(k,JSON.stringify(v,null,2))}catch(e){}return v}function selectedPacket(){let a=read(PACKET_KEY,[]);return a[0]||null}function frameText(){try{let d=$('toolFrame').contentDocument;return (d&&d.body?d.body.innerText:'').slice(0,5000)}catch(e){return 'Frame text unavailable: '+e.message}}function bankSummary(){let raw=localStorage.getItem(BANK_KEY)||'',b=read(BANK_KEY,null);return{exists:!!raw,size:raw.length,safe_points:b&&Array.isArray(b.safe_points)?b.safe_points.length:0,last_good:b&&b.bank_state?b.bank_state.last_good_safe_point_id||'':'',bank_health:b&&b.bank_state?b.bank_state.bank_health||'UNKNOWN':'UNKNOWN'}}function corpusHas(pkt){let c=localStorage.getItem(CORPUS_KEY)||'';return !!(pkt&&c.includes('SOURCE: Connections / '+pkt.id))}
function goodHash(h){return /^#(world|bridge|library|workshop|control|bank)$/i.test(String(h||''))}
function returnHash(){let q=new URLSearchParams(location.search),h=q.get('return_hash')||q.get('hash')||'#control';return goodHash(h)?String(h).toLowerCase():'#control'}
async function loadRoute(){if(routeState)return routeState;if(!resolver)throw new Error('PMP Current Route Resolver did not load.');let loaded=await resolver.load(),tool=resolver.resolve(loaded.map,'tool_routes.code_safety'),ret=resolver.resolve(loaded.map,'current_app');routeState={loaded,tool,ret};write(ROUTE_KEY,{type:'PMP_CODE_SAFETY_V13_ROUTE_RECEIPT_V1',status:'MAP_ROLES_READY',tool_role:tool.role,tool_path:tool.path,return_role:ret.role,return_path:ret.path,map_path:ret.map_path,map_version:ret.map_version,route_epoch:ret.route_epoch,at:now()});return routeState}
async function backToControl(){try{let s=await loadRoute(),h=resolver.normalizeHash(returnHash(),s.loaded.map),url=resolver.buildUrl(s.ret,{from:'code-safety-v13',fresh:'a002-p4-'+s.ret.route_epoch+'-'+Date.now(),map_version:s.ret.map_version,route_epoch:s.ret.route_epoch},h);try{window.top.location.href=url}catch(e){location.href=url}}catch(error){let d=resolver?resolver.diagnostic(error,'code_safety_return'):{type:'PMP_ROUTE_FAIL_CLOSED_DIAGNOSTIC_V1',context:'code_safety_return',message:String(error&&error.message||error),action:'navigation_blocked_no_fallback_consulted'};write(ROUTE_KEY,{type:'PMP_CODE_SAFETY_V13_ROUTE_RECEIPT_V1',status:'FAIL_CLOSED',diagnostic:d,at:now()});$('out').className='warn';$('out').textContent=JSON.stringify(d,null,2)}return false}
function context(){let p=selectedPacket(),r=routeState;return{type:'PMP_CODE_SAFETY_RESIDENT_CONTEXT_V13',built_at:now(),tool:'Code Safety',tool_role:'safe points, restore, and recovery',route_authority:r&&r.ret?r.ret.map_path:'loading',return_role:r&&r.ret?r.ret.role:'current_app',return_path:r&&r.ret?r.ret.path:null,return_hash:returnHash(),tool_text:frameText(),safe_point_bank:bankSummary(),selected_packet:p?{id:p.id,name:p.name,quality:p.quality,official:!!p.official}:null,corpus_status:{selected_packet_sent:corpusHas(p),corpus_has_any_content:!!(localStorage.getItem(CORPUS_KEY)||'').trim()}}}
function response(){let c=context(),a='I am inside Code Safety. I can read the Code Safety page, local safe-point bank, selected packet, and Corpus status. Safe points: '+c.safe_point_bank.safe_points+'. Bank health: '+c.safe_point_bank.bank_health+'. Return authority is '+c.return_role+' through '+c.route_authority+'. Next: use Code Safety for safe points, restore, and recovery.';return{type:'PMP_CODE_SAFETY_RESIDENT_RESPONSE_V13',built_at:now(),question:$('ask').value.trim(),resident_answer:a,context:c,next:'Use Code Safety for safe points, restore, and recovery.'}}
function toggleResident(){let d=$('dock');d.classList.toggle('hidden');if(!d.classList.contains('hidden'))refreshContext()}function refreshContext(){$('out').textContent=JSON.stringify({status:'CONTEXT_REFRESHED',context:context()},null,2)}function askResident(){$('out').textContent=JSON.stringify(response(),null,2)}async function copyHandoff(){let h={type:'PMP_CODE_SAFETY_RESIDENT_HANDOFF_V13',message:$('ask').value.trim(),context:context()};try{await navigator.clipboard.writeText(JSON.stringify(h,null,2));$('out').textContent='Code Safety Resident handoff copied.'}catch(e){$('out').textContent=JSON.stringify(h,null,2)}}
$('backToControlBtn').onclick=backToControl;loadRoute().catch(error=>write(ROUTE_KEY,{type:'PMP_CODE_SAFETY_V13_ROUTE_RECEIPT_V1',status:'FAIL_CLOSED',diagnostic:resolver?resolver.diagnostic(error,'code_safety_boot'):String(error),at:now()}));
</script>
</body>
</html>

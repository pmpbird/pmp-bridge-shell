<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Route Guardian Recovery Tools</title><style>body{margin:0;background:#f3ded4;color:#07101c;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:18px}.card{background:#fff;border:3px solid #07101c;border-radius:26px;padding:16px;max-width:680px;margin:auto}.badge{display:inline-block;background:#acd1fb;border:2px solid #07101c;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:950}.btn{display:block;width:100%;box-sizing:border-box;margin:10px 0;border:2px solid #07101c;border-radius:16px;background:#eef4fb;color:#07101c;padding:14px;text-align:left;font:inherit;font-weight:900;text-decoration:none}.good{background:#dff7e8}.warn{background:#fff4d6}.dark{background:#172234;color:#eef4fb}.danger{background:#3a1212;color:#ffe6e6}.bank{display:none;background:#0c141e;color:#eef4fb;border-radius:14px;padding:10px;margin-top:10px;max-height:32vh;overflow:auto}.open{display:block}.viewbox{display:none;margin-top:14px;border:3px solid #07101c;border-radius:22px;overflow:hidden;background:#fff}.frame{width:100%;height:55vh;border:0;background:#fff}.status{background:#123024;color:#d8ffe2}</style></head><body><div class="card"><span class="badge">RECOVERY TOOLS</span><h1>Route Guardian Recovery Tools</h1><p>These tools stay outside the viewed version.</p><a id="back" class="btn good">Return to Route Guardian Last Good</a><button id="make" class="btn warn">Make This Version Current</button><button id="spots" class="btn dark">Saved Spots</button><div id="spotBox" class="bank"></div><button id="moves" class="btn dark">Move Ledger</button><pre id="moveBox" class="bank"></pre><div id="status" class="btn status">Recovery tools ready.</div><div id="viewWrap" class="viewbox"><iframe id="view" class="frame"></iframe></div></div><script>(()=>{const SP='pmp_route_guardian_saved_spots_bank_v1',MV='pmp_route_guardian_move_ledger_bank_v1';const q=new URLSearchParams(location.search),VIEW=q.get('view')||'',BACK=q.get('back')||'pmp-route-guardian-last-good-v10.html';const $=x=>document.getElementById(x);function read(k,d){try{return JSON.parse(localStorage.getItem(k)||'')}catch(e){return d}}function write(k,v){localStorage.setItem(k,JSON.stringify(v))}function fresh(t){t=String(t||BACK);let h='',i=t.indexOf('#');if(i>=0){h=t.slice(i);t=t.slice(0,i)}return t+(t.includes('?')?'&':'?')+'fresh='+Date.now()+h}function move(kind,to){let b=read(MV,{entries:[]});b.entries=Array.isArray(b.entries)?b.entries:[];b.entries.push({id:'move_'+Date.now(),at:new Date().toISOString(),kind,view:VIEW||'tools',to});b.entries=b.entries.slice(-100);write(MV,b)}function drawSpots(){let b=read(SP,{entries:[]});b.entries=Array.isArray(b.entries)?b.entries:[];$('spotBox').innerHTML='';if(!b.entries.length){$('spotBox').textContent='No saved spots yet.';return}b.entries.forEach(s=>{let a=document.createElement('a');a.className='btn';a.href=fresh(s.route);a.textContent=s.label||'Saved Spot';$('spotBox').appendChild(a);let d=document.createElement('button');d.className='btn danger';d.textContent='Delete Saved Spot';d.onclick=()=>{let x=read(SP,{entries:[]});x.entries=(x.entries||[]).filter(e=>e.id!==s.id&&e.spot_id!==s.spot_id);write(SP,x);move('delete_saved_spot',s.route);drawSpots()};$('spotBox').appendChild(d)})}$('back').href=fresh(BACK);$('back').onclick=()=>move('return_to_route_guardian_last_good',BACK);if(VIEW){$('viewWrap').style.display='block';$('view').src=fresh(VIEW);$('status').textContent='Viewing version inside Recovery Tools.'}make.onclick=()=>{if(!VIEW){status.textContent='No viewed version is open. Open Last Good first.';return}localStorage.setItem('pmp_route_guardian_make_current_request_v1',VIEW);move('make_this_version_current_request',VIEW);status.textContent='Marked viewed version as current request on this device.'};spots.onclick=()=>{drawSpots();spotBox.classList.toggle('open')};moves.onclick=()=>{moveBox.textContent=JSON.stringify(read(MV,{entries:[]}),null,2);moveBox.classList.toggle('open')};move('open_recovery_tools',VIEW||BACK)})();</script></body></html>

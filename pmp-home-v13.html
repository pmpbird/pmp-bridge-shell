<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>PMP Home v13</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#52b5df}iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#52b5df}</style></head><body><iframe id="app" src="pmp-home-v11.html?fresh=v13-fixed"></iframe><script>const F=document.getElementById('app');function getInner(){try{return{w:F.contentWindow,d:F.contentDocument||F.contentWindow.document}}catch(e){return null}}function simple(text){if(!text)return text;return text.replace(/backend is off, so truth is local unless copied out/g,'the app is keeping its safety notes mostly on this phone').replace(/Link Code Safety more tightly to Automatic App Update, so a version is only saved as last_good after a clean health check\./g,'Make the update button ask the safety guard before it saves a new version as safe.').replace(/the app health is not a clean PASS yet/g,'the app has not clearly shown that it is healthy yet').replace(/latest and last_good are not clearly the same/g,'the newest version and the safe version are not clearly the same').replace(/Connections has no saved packet yet/g,'Connections does not have a saved project packet yet').replace(/saved packet material exists, but Corpus is not clearly filled/g,'there is a saved packet, but the useful part has not clearly been moved into Corpus yet')}function suggestion(gap){gap=gap||'';if(/safety notes mostly on this phone|backend is off/.test(gap))return{title:'Make an outside safe box for app truth',action:'open_backend',explain:'Right now the app keeps its safety notes mostly on this phone. A backend is like a little safe box outside the phone. If the phone gets confused, Resident can check the safe box and know what version was good.',ask:'Do you want me to open Backend Settings so you can set up the outside safe box when it is ready?'};if(/newest version and the safe version|latest and last_good/.test(gap))return{title:'Make the update button ask the safety guard',action:'stage',explain:'Automatic App Update is the mover. Code Safety is the guard. This fix makes the mover ask the guard before it saves a new app as safe.',ask:'Do you want me to prepare that safety step?'};return{title:'Improve the weakest app-quality gap',action:'handoff',explain:'This turns the weakest problem into a clear next step instead of only naming the problem.',ask:'Do you want me to set up the next step?'}}function patch(){let obj=getInner();if(!obj)return;let w=obj.w,d=obj.d;if(!w||!d||w.__v13Fixed)return;if(!w.plain||!w.finishBundle||!w.truth)return;w.__v13Fixed=true;w.__residentSuggestion=null;const oldPlain=w.plain;w.plain=function(msg,work,next,warning){return oldPlain(simple(msg),work,simple(next),simple(warning))};const oldFinish=w.finishBundle;w.finishBundle=function(msg,bundle,record){if(bundle&&(bundle.includes('lossless_quality')||bundle.includes('suggest_improvement'))){let t=w.truth();let packets=[];try{packets=w.read('pmp_clean_connection_packets_v5',[])}catch(e){}let corpus=!!localStorage.getItem('pmp_corpus_inbox_v1');let gaps=[];if(t.live_mirror.health.state!=='PASS')gaps.push('the app has not clearly shown that it is healthy yet');if(!w.cfg().enabled)gaps.push('the app is keeping its safety notes mostly on this phone');if(!packets.length)gaps.push('Connections does not have a saved project packet yet');if(packets.length&&!corpus)gaps.push('there is a saved packet, but the useful part has not clearly been moved into Corpus yet');if(t.latest!==t.last_good)gaps.push('the newest version and the safe version are not clearly the same');if(!gaps.length)gaps.push('the main structure looks healthy; the next gain is making the update button ask the safety guard before saving');let s=suggestion(gaps[0]);w.__residentSuggestion=s;record=record||{};record.v13={gap:gaps[0],suggestion:s};return w.plain('I checked the app. The weakest part is that '+gaps[0]+'.\n\nWhat fixing it would do: '+s.explain+'\n\n'+s.ask,record,'Say yes or tap Do Next Step if you want me to set up: '+s.title+'.')}return oldFinish(msg,bundle,record)};w.explainSuggestion=function(){let s=w.__residentSuggestion;if(!s)return w.plain('I do not have a current fix to explain yet. Ask me to run a quality check first.',{kind:'no_suggestion'},'Try: run lossless quality and tell me what could improve.');w.plain(s.title+' means this:\n\n'+s.explain+'\n\n'+s.ask,{kind:'explain_suggestion',suggestion:s},'Say yes or tap Do Next Step if you want me to set it up.')};w.doSuggestion=function(){let s=w.__residentSuggestion;if(!s)return w.plain('I do not have a current fix to do yet. Ask me to run a quality check first.',{kind:'no_suggestion'},'Try: run lossless quality and tell me what could improve.');if(s.action==='open_backend'){try{w.toggle('launcher');w.toggleBackend()}catch(e){}return w.plain('I opened Backend Settings. Paste the Worker URL there when it is ready, then tap On and Test. The phone copy still stays as backup.',{kind:'open_backend',suggestion:s},'After it connects, Resident can use the outside safe box as another safety check.')}let handoff={type:'PMP_RESIDENT_SAFETY_STEP_V13',suggestion:s,context:w.context?w.context():null};return w.plain('I staged the safety step instead of changing protected code silently.',{kind:'stage_suggestion',handoff},'Copy Work when you are ready to use the staged fix.')};const oldRun=w.residentRun;w.residentRun=function(){let q=(d.getElementById('ask')?.value||'').trim().toLowerCase();if(/^(yes|yes do it|do it|do that|set it up|next step)$/.test(q)&&w.__residentSuggestion)return w.doSuggestion();if(/explain|what does that do|why would that help/.test(q)&&w.__residentSuggestion)return w.explainSuggestion();return oldRun()};let resident=d.getElementById('resident');if(resident&&!d.getElementById('v13buttons')){let div=d.createElement('div');div.id='v13buttons';div.className='grid';div.innerHTML='<button class="btn" onclick="explainSuggestion()">Explain Fix</button><button class="btn" onclick="doSuggestion()">Do Next Step</button>';let reply=d.getElementById('residentReply');resident.insertBefore(div,reply)}let p=d.querySelector('#resident p');if(p)p.textContent='Talk normally. I will explain things simply and keep the machine work underneath.';try{w.plain('Resident v13 is ready. I will explain fixes in simple words, like a clear helper, and ask before setting them up.',{kind:'v13_ready'},'Try: run lossless quality and tell me what could improve.')}catch(e){}}F.addEventListener('load',()=>{setTimeout(patch,500);setTimeout(patch,1500);setTimeout(patch,3000)});setInterval(patch,2000);</script></body></html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#55b6d8">
<title>Resident Notes Catalog Shortcut Only</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#55b6d8}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#55b6d8}
</style>
</head>
<body>
<iframe id="app" src="resident-notes-catalog-v3.html?fresh=shortcut-only-v3-direct-open"></iframe>
<script>
const F=document.getElementById('app');
const SHORTCUT_URL='shortcuts://run-shortcut?name='+encodeURIComponent('PMP Save Private Memory')+'&input=clipboard';
function txt(el){return (el&&el.textContent||'').replace(/\s+/g,' ').trim()}
function hide(el){if(el)el.style.display='none'}
function catalogText(d){
  const prompt=d.getElementById('prompt');
  const chunk=d.getElementById('chunk');
  const p=(prompt&&prompt.value||'').trim();
  if(p)return p;
  const c=(chunk&&chunk.value||'').trim();
  if(c)return c;
  return '';
}
function copyFallback(text){
  try{
    const ta=document.createElement('textarea');
    ta.value=text;
    ta.style.position='fixed';
    ta.style.opacity='0';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    document.execCommand('copy');
    ta.remove();
    return true;
  }catch(e){return false;}
}
function openShortcutNow(){
  window.location.href=SHORTCUT_URL;
}
function patch(){
  try{
    const w=F.contentWindow,d=F.contentDocument||w.document;
    if(!w||!d)return;
    for(const b of Array.from(d.querySelectorAll('button'))){
      const t=txt(b);
      if(t==='Build Full ZIP + Scan') b.textContent='Build Full ZIP + Auto Scan';
      if(t==='Scan + Build Catalog') b.textContent='Scan Chosen ZIP + Build Catalog';
      if(t==='Save Catalog to Notes') b.textContent='Save Catalog to Notes with Shortcut';
      if(t==='Share ZIP') hide(b);
    }
    const saveCard=Array.from(d.querySelectorAll('section.card')).find(s=>txt(s).includes('Save to Notes'));
    if(saveCard){
      const p=saveCard.querySelector('p.small');
      if(p)p.textContent='Save uses your PMP Save Private Memory Shortcut. The share sheet is removed.';
      const more=saveCard.querySelector('#moreBox');
      if(more){
        for(const b of Array.from(more.querySelectorAll('button'))){
          if(txt(b)==='Share ZIP') hide(b);
        }
      }
    }
    w.shareCatalogZip=async function(){
      w.setStatus&&w.setStatus('Share sheet removed. Use Save Catalog to Notes with Shortcut.');
    };
    w.saveCatalogSmart=function(){
      try{
        const built=catalogText(d);
        if(!built){w.setStatus&&w.setStatus('Build the catalog first.');return false;}
        copyFallback(built);
        if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(built).catch(()=>{});
        w.setStatus&&w.setStatus('Copied catalog to clipboard. Opening PMP Save Private Memory Shortcut.');
        openShortcutNow();
        return true;
      }catch(e){
        w.setStatus&&w.setStatus('Shortcut path failed. Copy Catalog JSON from More Options, then run PMP Save Private Memory manually. '+String(e&&e.message||e));
        return false;
      }
    };
    const saveBtn=Array.from(d.querySelectorAll('button')).find(b=>txt(b)==='Save Catalog to Notes with Shortcut');
    if(saveBtn&&!saveBtn.dataset.shortcutOnlyDirectOpen){
      saveBtn.dataset.shortcutOnlyDirectOpen='1';
      saveBtn.addEventListener('click',function(e){
        e.preventDefault();
        e.stopImmediatePropagation();
        w.saveCatalogSmart();
      },true);
    }
  }catch(e){}
}
F.addEventListener('load',()=>{setTimeout(patch,250);setTimeout(patch,1000);setTimeout(patch,2500)});
setInterval(patch,1000);
</script>
</body>
</html>

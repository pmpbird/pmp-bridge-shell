<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Route Guardian Recovery Tools v4</title><style>body{margin:0;background:#f3ded4;color:#07101c;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:18px}.card{background:#fff;border:3px solid #07101c;border-radius:26px;padding:16px;max-width:680px;margin:auto}.badge{display:inline-block;background:#acd1fb;border:2px solid #07101c;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:950}.btn{display:block;width:100%;box-sizing:border-box;margin:10px 0;border:2px solid #07101c;border-radius:16px;background:#eef4fb;color:#07101c;padding:14px;text-align:left;font:inherit;font-weight:900;text-decoration:none}.good{background:#dff7e8}.warn{background:#fff4d6}.dark{background:#172234;color:#eef4fb}.danger{background:#3a1212;color:#ffe6e6}.copy{background:#e9ecff}.bank{display:none;background:#0c141e;color:#eef4fb;border-radius:14px;padding:10px;margin-top:10px;max-height:34vh;overflow:auto}.open{display:block}.spotcard,.movecard{background:#172234;color:#eef4fb;border:2px solid #eef4fb;border-radius:16px;padding:12px;margin:10px 0}.small{font-size:12px;opacity:.9;white-space:pre-wrap;overflow-wrap:anywhere}.viewbox{display:none;margin-top:14px;border:3px solid #07101c;border-radius:22px;overflow:hidden;background:#fff}.frame{width:100%;height:55vh;border:0;background:#fff}.status{background:#123024;color:#d8ffe2}</style></head><body><div class="card"><span class="badge">RECOVERY TOOLS</span><h1>Route Guardian Recovery Tools</h1><p>Move Ledger has readable cards plus a copyable lossless report.</p><a id="back" class="btn good">Return to Route Guardian Last Good</a><button id="make" class="btn warn">Make This Version Current</button><button id="spots" class="btn dark">Saved Spots</button><div id="spotBox" class="bank"></div><button id="moves" class="btn dark">Move Ledger</button><div id="moveBox" class="bank"></div><div id="status" class="btn status">Recovery tools ready.</div><div id="viewWrap" class="viewbox"><iframe id="view" class="frame"></iframe></div></div><script>(()=>{const SP='pmp_route_guardian_saved_spots_bank_v1',MV='pmp_route_guardian_move_ledger_bank_v1';const q=new URLSearchParams(location.search),VIEW=q.get('view')||'',BACK=q.get('back')||'pmp-route-guardian-last-good-v14.html';const $=x=>document.getElementById(x);function esc(v){return String(v||'—').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function read(k,d){try{return JSON.parse(localStorage.getItem(k)||'')}catch(e){return d}}function write(k,v){localStorage.setItem(k,JSON.stringify(v))}function fresh(t){t=String(t||BACK);let h='',i=t.indexOf('#');if(i>=0){h=t.slice(i);t=t.slice(0,i)}return t+(t.includes('?')?'&':'?')+'fresh='+Date.now()+h}function pretty(k){return String(k||'Move').replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase())}function line(label,val){return '<div class="small"><b>'+label+':</b> '+esc(val)+'</div>'}function move(kind,to){let b=read(MV,{entries:[]});b.entries=Array.isArray(b.entries)?b.entries:[];b.entries.push({id:'move_'+Date.now(),at:new Date().toISOString(),kind,view:VIEW||'tools',to});b.entries=b.entries.slice(-100);write(MV,b)}function report(){let b=read(MV,{entries:[]});let entries=Array.isArray(b.entries)?b.entries:[];let newest=entries.slice().reverse();let lines=[];lines.push('ROUTE GUARDIAN MOVE LEDGER REPORT');lines.push('report_quality: LOSSLESS');lines.push('generated_at: '+new Date().toISOString());lines.push('entry_count: '+entries.length);lines.push('order_note: readable section is newest-first; raw JSON preserves saved order');lines.push('');lines.push('READABLE MOVES — NEWEST FIRST');lines.push('');newest.forEach((m,i)=>{lines.push('MOVE '+(i+1));lines.push('kind: '+(m.kind||''));lines.push('time: '+(m.at||''));lines.push('from: '+(m.from||''));lines.push('to: '+(m.to||''));lines.push('viewed_version: '+(m.view||''));lines.push('current_before_last_good: '+(m.current_before||m.current_before_last_good||''));lines.push('return_to: '+(m.return_to||''));lines.push('version: '+(m.version||''));lines.push('id: '+(m.id||''));lines.push('full_move_json: '+JSON.stringify(m));lines.push('')});lines.push('RAW MOVE LEDGER JSON — LOSSLESS SAVED ORDER');lines.push(JSON.stringify(b,null,2));return lines.join('\n')}function copyText(t){if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(()=>status.textContent='Copied full lossless Move Ledger report. Paste it into ChatGPT.').catch(()=>fallback(t))}else fallback(t)}function fallback(t){let ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();status.textContent='Copied full lossless Move Ledger report. Paste it into ChatGPT.'}function drawSpots(){let b=read(SP,{entries:[]});b.entries=Array.isArray(b.entries)?b.entries:[];spotBox.innerHTML='';if(!b.entries.length){spotBox.textContent='No saved spots yet.';return}b.entries.forEach((s,i)=>{let card=document.createElement('div');card.className='spotcard';let title=s.label||s.name||('Saved Spot '+(i+1));card.innerHTML='<b>'+esc(title)+'</b>'+line('Saved',s.saved_at||s.at||s.time)+line('Version',s.version||s.version_name||s.page)+line('Route',s.route)+line('Current Before Last Good',s.current_before||s.current_before_last_good)+line('Recovery State',s.recovery_state||s.state||s.recovery_state_name);let open=document.createElement('a');open.className='btn good';open.href=fresh(s.route);open.textContent='Open Saved Spot';card.appendChild(open);let d=document.createElement('button');d.className='btn danger';d.textContent='Delete Saved Spot';d.onclick=()=>{let x=read(SP,{entries:[]});x.entries=(x.entries||[]).filter(e=>e.id!==s.id&&e.spot_id!==s.spot_id&&e.route!==s.route);write(SP,x);move('delete_saved_spot',s.route);drawSpots()};card.appendChild(d);spotBox.appendChild(card)})}function drawMoves(){let b=read(MV,{entries:[]});let arr=Array.isArray(b.entries)?b.entries.slice(-100).reverse():[];moveBox.innerHTML='';let c=document.createElement('button');c.className='btn copy';c.textContent='Copy Move Ledger Report';c.onclick=()=>copyText(report());moveBox.appendChild(c);if(!arr.length){let p=document.createElement('div');p.className='movecard';p.textContent='No moves yet.';moveBox.appendChild(p);return}arr.forEach((m,i)=>{let card=document.createElement('div');card.className='movecard';card.innerHTML='<b>'+esc((i+1)+'. '+pretty(m.kind))+'</b>'+line('Time',m.at)+line('From',m.from)+line('To',m.to)+line('Viewed Version',m.view)+line('Current Before Last Good',m.current_before||m.current_before_last_good)+line('Return To',m.return_to)+line('Version',m.version);let target=m.to||m.view||m.from;if(target&&String(target).includes('.html')){let a=document.createElement('a');a.className='btn good';a.href=fresh(target);a.textContent='Open This Move Target';card.appendChild(a)}moveBox.appendChild(card)})}back.href=fresh(BACK);back.onclick=()=>move('return_to_route_guardian_last_good',BACK);if(VIEW){viewWrap.style.display='block';view.src=fresh(VIEW);status.textContent='Viewing version inside Recovery Tools.'}make.onclick=()=>{if(!VIEW){status.textContent='No viewed version is open. Open Last Good first.';return}localStorage.setItem('pmp_route_guardian_make_current_request_v1',VIEW);move('make_this_version_current_request',VIEW);status.textContent='Marked viewed version as current request on this device.'};spots.onclick=()=>{drawSpots();spotBox.classList.toggle('open')};moves.onclick=()=>{drawMoves();moveBox.classList.toggle('open')};move('open_recovery_tools',VIEW||BACK)})();</script></body></html>

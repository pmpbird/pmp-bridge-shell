<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>PMP Home v17</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#52b5df}iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#52b5df}</style></head><body><iframe id="app" src="pmp-home-v11.html?fresh=v17-chat-tools"></iframe><script>const F=document.getElementById('app');const CHAT_KEY='pmp_resident_session_chat_v17';function get(){try{return{w:F.contentWindow,d:F.contentDocument||F.contentWindow.document}}catch(e){return null}}function readChat(){try{return JSON.parse(sessionStorage.getItem(CHAT_KEY)||'[]')}catch(e){return[]}}function writeChat(a){try{sessionStorage.setItem(CHAT_KEY,JSON.stringify(a.slice(-80)))}catch(e){}}function esc(s){return String(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}function add(role,text){if(!text)return;let a=readChat();a.push({role,text,at:new Date().toISOString()});writeChat(a);render()}function render(){let o=get();if(!o)return;let d=o.d,box=d.getElementById('residentChatBox');if(!box)return;let a=readChat();if(!a.length){box.innerHTML='<div style="opacity:.8">This session chat is empty. It resets when you close the app.</div>';return}box.innerHTML=a.map(m=>{let mine=m.role==='user';let st=mine?'margin-left:14%;background:#0c141e;color:#eef4fb;':'margin-right:14%;background:#123024;color:#c9f7d7;';return'<div style="'+st+'border:1px solid #25354a;border-radius:14px;padding:9px;margin:7px 0;white-space:pre-wrap;font-size:13px;line-height:1.35"><b>'+(mine?'You':'Resident')+':</b> '+esc(m.text)+'</div>'}).join('');box.scrollTop=box.scrollHeight}function simple(s){if(!s)return s;return s.replace(/backend is off, so truth is local unless copied out/g,'the app is keeping its safety notes mostly on this phone').replace(/Link Code Safety more tightly to Automatic App Update, so a version is only saved as last_good after a clean health check\./g,'Make the update button ask the safety guard before it saves a new version as safe.').replace(/the app health is not a clean PASS yet/g,'the app has not clearly shown that it is healthy yet').replace(/latest and last_good are not clearly the same/g,'the newest version and the safe version are not clearly the same').replace(/Connections has no saved packet yet/g,'Connections does not have a saved project packet yet').replace(/saved packet material exists, but Corpus is not clearly filled/g,'there is a saved packet, but the useful part has not clearly been moved into Corpus yet')}function patch(){let o=get();if(!o)return;let w=o.w,d=o.d;if(!w||!d||w.__v17ChatTools)return;if(!w.plain||!w.residentRun)return;w.__v17ChatTools=true;let resident=d.getElementById('resident'),ask=d.getElementById('ask'),reply=d.getElementById('residentReply');if(!resident||!ask||!reply)return;let p=d.querySelector('#resident p');if(p)p.textContent='Talk normally. Your messages move into Chat. The tool buttons live under Tools.';let chat=d.createElement('div');chat.id='residentChatWrap';chat.innerHTML='<div class="grid"><button class="btn" onclick="toggleResidentChat()">Chat</button><button class="btn" onclick="toggleResidentTools()">Tools</button></div><div id="residentChatBox" style="display:none;background:#0c141e;border:1px solid #25354a;border-radius:16px;padding:8px;margin:8px 0;max-height:230px;overflow:auto;color:#c9f7d7;font-size:13px"></div><div id="residentToolsBox" style="display:none;background:#0c141e;border:1px solid #25354a;border-radius:16px;padding:8px;margin:8px 0"><div class="grid3"><button class="btn" onclick="residentCopyReply()">Copy Reply</button><button class="btn" onclick="packetRequest()">Packet Request</button><button class="btn" onclick="savePacket()">Save Packet</button></div><div class="grid3"><button class="btn" onclick="pipeline()">Pipeline</button><button class="btn" onclick="showWork()">Show Work</button><button class="btn" onclick="copyWork()">Copy Work</button></div><div class="grid"><button class="btn" onclick="residentHelp()">Help Me</button><button class="btn" onclick="clearResidentSessionChat()">Clear Chat</button></div></div>';resident.insertBefore(chat,ask);function hideOldButtons(){let labels=['Copy Reply','Packet Request','Save Packet','Pipeline','Show Work','Copy Work','Help Me'];for(const b of [...d.querySelectorAll('button')]){let t=(b.textContent||'').trim();if(labels.includes(t)&&!b.closest('#residentToolsBox'))b.style.display='none'}for(const g of [...resident.querySelectorAll('.grid3')]){let visible=[...g.querySelectorAll('button')].some(b=>b.style.display!=='none');if(!visible)g.style.display='none'}}hideOldButtons();w.toggleResidentChat=function(){let box=d.getElementById('residentChatBox');box.style.display=box.style.display==='none'?'block':'none';render()};w.toggleResidentTools=function(){let box=d.getElementById('residentToolsBox');box.style.display=box.style.display==='none'?'block':'none'};w.clearResidentSessionChat=function(){writeChat([]);render();w.plain('I cleared this session chat. Important app memory stayed saved.',{kind:'clear_session_chat'},'Keep telling me the next thing normally.')};const oldPlain=w.plain;w.plain=function(message,work,next,warning){let msg=simple(message),nx=simple(next);let out=oldPlain(msg,work,nx,simple(warning));add('resident',msg+(nx?'\n\nNext: '+nx:''));return out};const oldRun=w.residentRun;w.residentRun=function(){let msg=(ask.value||'').trim();if(msg)add('user',msg);let out=oldRun();ask.value='';return out};w.copyResidentChat=async function(){let txt=readChat().map(m=>(m.role==='user'?'You: ':'Resident: ')+m.text).join('\n\n');try{await navigator.clipboard.writeText(txt);w.plain('I copied this session chat.',{kind:'copy_session_chat'},'Paste it wherever you need it.')}catch(e){w.plain('Copy was blocked, but the chat is still visible in the Chat menu.',{kind:'copy_session_chat_failed',error:e.message},'Open Chat to view it.')}};let extra=d.createElement('div');extra.className='grid';extra.innerHTML='<button class="btn" onclick="copyResidentChat()">Copy Chat</button><button class="btn" onclick="clearResidentSessionChat()">Reset Chat</button>';let tools=d.getElementById('residentToolsBox');tools.appendChild(extra);try{w.plain('Resident v17 is ready. Use Chat to see this session like a conversation. Use Tools only when you need manual buttons.',{kind:'v17_ready'},'Your typing box will clear after each run.')}catch(e){}render()}F.addEventListener('load',()=>{setTimeout(patch,700);setTimeout(patch,1800);setTimeout(patch,3500)});setInterval(patch,2500);</script></body></html>

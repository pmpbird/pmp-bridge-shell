<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#f3ded4"><title>Bug Lab Mirror v1</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;min-height:100%;overflow-x:hidden;background:#f3ded4;color:#07101c;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%;touch-action:manipulation}.wrap{max-width:820px;margin:auto;padding:calc(38px + env(safe-area-inset-top)) 14px calc(120px + env(safe-area-inset-bottom))}.card{background:#fff;border:3px solid #07101c;border-radius:28px;padding:18px;margin:0 0 16px;box-shadow:0 12px 28px #0002}h1{margin:0 0 8px;font-size:38px}.sub{color:#284e62;font-weight:900;line-height:1.32}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.mini{border:3px solid #07101c;background:#172234;color:#eef4fb;border-radius:14px;padding:12px;font:inherit;font-weight:950;width:100%;margin-top:7px}.note,.status{background:#123024;border:3px solid #07101c;color:#d8ffe2;border-radius:22px;padding:13px;white-space:pre-wrap;overflow-wrap:anywhere}.status{font-family:ui-monospace,Menlo,monospace;max-height:360px;overflow:auto}select{width:100%;border:3px solid #07101c;border-radius:16px;background:#0c141e;color:#eef4fb;padding:12px;font:inherit;font-weight:800;margin-top:8px}.mirror{background:#f7fbff;border:4px solid #07101c;border-radius:30px;padding:16px;display:grid;gap:12px;min-height:500px;overflow:hidden}.mirror h2{font-size:34px;margin:0}.pill{background:#acd1fb;border:3px solid #07101c;border-radius:999px;padding:10px 14px;font-weight:950;display:inline-block}.mgrid{display:grid;grid-template-columns:1fr;gap:10px}.mcard{background:#fff;border:2px solid #07101c;border-radius:20px;padding:14px;box-shadow:0 8px 18px #0001}.mbtn{background:#172234;color:#eef4fb;border:3px solid #07101c;border-radius:18px;padding:14px;font-weight:950;text-align:center}.raw{background:#123024;color:#d8ffe2;border:3px solid #07101c;border-radius:18px;padding:12px;font-family:ui-monospace,Menlo,monospace;white-space:pre-wrap}.labFlash{animation:flash .5s steps(2,end) infinite}@keyframes flash{50%{opacity:.35}}.float{position:fixed;top:calc(10px + env(safe-area-inset-top));z-index:30;border:3px solid #07101c;background:#acd1fb;color:#07101c;border-radius:999px;padding:8px 12px;font-weight:950;font-size:12px;box-shadow:0 8px 18px #0002}.left{left:10px}.right{right:10px}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><button class="float left" onclick="location.href='bug-memory-current-clean-v1.html?fresh=back-from-mirror'">Bug Lab</button><button class="float right" onclick="resetMirror()">Reset</button><div class="wrap"><section class="card"><h1>Bug Lab Mirror v1</h1><p class="sub">Known bug types are applied to this mirror only. The real app, real storage, launcher, route, bank, engine, and source data are untouched.</p><div class="grid"><button class="mini" onclick="loadTypes()">Refresh Known Bug Types</button><button class="mini" onclick="copyResult()">Copy Mirror Result</button></div><div id="summary" class="note">Loading known bug types...</div></section><section class="card"><h2>Choose bugs to mix</h2><label>Bug A<select id="bugA"></select></label><label>Bug B<select id="bugB"></select></label><div class="grid"><button class="mini" onclick="applyMix()">Apply Mix To Mirror</button><button class="mini" onclick="resetMirror()">Reset Mirror</button></div></section><section class="card"><h2>Mirror app surface</h2><div id="mirror" class="mirror"></div></section><section class="card"><h2>Mirror result</h2><pre id="result" class="status">No mix applied yet.</pre></section></div><script>const TYPES_KEY='pmp_helper_problem_memory_types_v1';let known=[],last=null;function read(k,f){try{return JSON.parse(localStorage.getItem(k)||JSON.stringify(f))}catch(e){return f}}function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}function cleanRow(x,i){let type=x.type||x.kind||x.problem||('Known bug type '+(i+1));return{id:x.id||('BUG-TYPE-'+String(i+1).padStart(3,'0')),type,how_it_happens:x.how_it_happens||x.why||'',where:x.where||'',severity:x.severity||'medium',fix_rule:x.fix_rule||'',seen:x.seen||0,last_seen:x.last_seen||''}}function loadTypes(){known=read(TYPES_KEY,[]).filter(Boolean).map(cleanRow);let opts=known.map((x,i)=>'<option value="'+i+'">'+esc(x.type)+'</option>').join('')||'<option value="-1">No known bug types yet</option>';document.getElementById('bugA').innerHTML=opts;document.getElementById('bugB').innerHTML=opts;document.getElementById('summary').textContent='Known Bug Types loaded: '+known.length+'\nMode: mirror-only lab\nExcluded: active bugs, symptom evidence, real app writes';resetMirror();return known}function baseMirror(){document.getElementById('mirror').innerHTML='<div><span class="pill">Launcher</span> <span class="pill" style="float:right">Resident</span></div><h2>PMP Mirror</h2><div class="sub">This is a safe fake copy for bug mixing only.</div><div class="mgrid" id="cards"><div class="mcard" data-zone="world"><b>World</b><div class="mbtn">Open World</div></div><div class="mcard" data-zone="bank"><b>Bank</b><div class="mbtn">Helper Bank</div><div class="mbtn" data-expected="bug-bank">Bug Bank</div></div><div class="mcard" data-zone="control"><b>Control</b><div class="mbtn">Safe Writer</div><div class="mbtn">Bug Lab</div></div></div><div class="raw" id="rawBox">Mirror state: clean. No real app code is running here.</div>'}function effectFor(b){let t=((b&&b.type)||'')+' '+((b&&b.how_it_happens)||'')+' '+((b&&b.fix_rule)||'');t=t.toLowerCase();if(/duplicate|duplicat|render.*more|panel/.test(t))return'duplicate';if(/missing|removed|disappear|cleanup|button/.test(t))return'missing_button';if(/rewrite|loop|active active|flicker|count|sync/.test(t))return'rewrite_loop';if(/scale|shrink|viewport|compact/.test(t))return'scale_shrink';if(/raw|json|flash/.test(t))return'raw_flash';if(/placement|drift|outside|stack|level/.test(t))return'placement_drift';return'generic_stress'}function applyOne(b,idx,changes){let mirror=document.getElementById('mirror'),cards=document.getElementById('cards'),raw=document.getElementById('rawBox'),e=effectFor(b);if(e==='duplicate'){let n=cards.children[1].cloneNode(true);n.querySelector('b').textContent='Duplicated '+(b.type||'bug panel');cards.appendChild(n);changes.push('duplicated a mirror card')}else if(e==='missing_button'){let target=mirror.querySelector('[data-expected="bug-bank"]')||mirror.querySelector('.mbtn');if(target){target.style.display='none';changes.push('hid one expected mirror button')}}else if(e==='rewrite_loop'){let btn=mirror.querySelector('.mbtn');if(btn){btn.textContent='Active Active Active Bugs Found Found';changes.push('created a mirror label rewrite loop')}}else if(e==='scale_shrink'){mirror.style.transform='scale(.82)';mirror.style.transformOrigin='top left';mirror.style.width='122%';changes.push('shrunk/scaled the mirror surface')}else if(e==='raw_flash'){raw.classList.add('labFlash');raw.textContent='{\n  "raw_box_flash": true,\n  "source": "mirror only"\n}';changes.push('flashed raw mirror JSON box')}else if(e==='placement_drift'){let c=document.createElement('div');c.className='mcard';c.style.marginLeft='42px';c.innerHTML='<b>Drifted card</b><div class="mbtn">Outside normal stack</div>';mirror.appendChild(c);changes.push('moved a mirror card outside the stack')}else{raw.textContent+='\nGeneric mirror stress from: '+(b.type||'known bug type');changes.push('applied generic mirror stress')}return e}function applyMix(){baseMirror();let a=known[Number(document.getElementById('bugA').value)],b=known[Number(document.getElementById('bugB').value)],changes=[];let effects=[];if(a)effects.push(applyOne(a,1,changes));if(b&&b!==a)effects.push(applyOne(b,2,changes));let result={type:'PMP_BUG_LAB_MIRROR_V1_RESULT',created_at:new Date().toISOString(),mode:'mirror_only_known_bug_types',real_app_touched:false,real_storage_touched:false,known_bug_types_used:[a,b].filter(Boolean).map(x=>({type:x.type,how_it_happens:x.how_it_happens,fix_rule:x.fix_rule})),effects,observed_mirror_changes:changes,prediction_status:'lab prediction only, not truth',safe_claim:'Bug mix was applied only to a fake mirror DOM surface.',do_not_claim:'This did not test or mutate the real app.'};last=result;document.getElementById('result').textContent=JSON.stringify(result,null,2);try{localStorage.setItem('pmp_bug_lab_mirror_v1_last_result',JSON.stringify(result))}catch(e){}}function resetMirror(){baseMirror();last=null;document.getElementById('result').textContent='Mirror reset. No mix applied.'}async function copyResult(){let txt=JSON.stringify(last||{type:'PMP_BUG_LAB_MIRROR_V1_RESULT',status:'no mix applied'},null,2);try{await navigator.clipboard.writeText(txt)}catch(e){let ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove()}document.getElementById('summary').textContent+='\nMirror result copied.'}window.PMPBugLabMirrorV1={loadTypes,applyMix,resetMirror};loadTypes();</script></body></html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f3ded4">
<title>Route Guardian Last Good</title>
<style>
html,body{margin:0;min-height:100%;background:#f3ded4;color:#07101c;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{padding:calc(18px + env(safe-area-inset-top,0px)) 12px calc(28px + env(safe-area-inset-bottom,0px))}.card{max-width:620px;margin:auto;background:#fff;border:3px solid #07101c;border-radius:26px;padding:14px;box-shadow:0 12px 28px #0003}.badge{display:inline-block;background:#acd1fb;border:2px solid #07101c;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:950;margin-bottom:8px}h1{margin:0 0 8px;font-size:26px}.hint{font-size:13px;line-height:1.35;color:#354154;margin:0 0 12px}.saveRow{width:100%;border:2px solid #07101c;border-radius:16px;background:#eef4fb;color:#07101c;padding:12px;text-align:left;margin-top:8px;font:inherit;font-weight:850}.saveRow strong{display:block;font-size:14px}.saveRow span{display:block;margin-top:4px;font-size:12px;font-weight:650;color:#354154;line-height:1.32}.currentBefore{background:#dff7e8}.lastGood{background:#fff4d6}.spot{background:#e9ecff}.dark{background:#172234;color:#eef4fb}.status{margin-top:12px;background:#123024;color:#d8ffe2;border:2px solid #07101c;border-radius:16px;padding:10px;font-size:12px;white-space:pre-wrap}.warn{background:#2b2010;color:#ffe0a3}pre,.bankList{display:none;margin-top:10px;background:#0c141e;color:#eef4fb;border-radius:14px;padding:10px;white-space:pre-wrap;font-size:11px;max-height:34vh;overflow:auto}.open{display:block}.bankList .saveRow{background:#243147;color:#eef4fb;border-color:#acd1fb}.bankList .saveRow span{color:#c7d7ef}
</style>
</head>
<body>
<div class="card"><div class="badge">ROUTE GUARDIAN LAST GOOD</div><h1>Route Guardian Last Good</h1><p class="hint">Small recovery screen. Saved spots and history stay in hidden banks unless you open them.</p><div id="list"><button class="saveRow">Loading saves…</button></div><button id="saveSpotBtn" class="saveRow spot" type="button"><strong>Save Current Before Last Good</strong><span>Store the currently imprinted route in Saved Spots.</span></button><button id="spotsBtn" class="saveRow dark" type="button"><strong>Saved Spots</strong><span>Show/hide your specific saved recovery spots.</span></button><div id="spotsOut" class="bankList"></div><button id="historyBtn" class="saveRow dark" type="button"><strong>History Ledger</strong><span>Show the hidden bank of the last 100 route moves.</span></button><pre id="historyOut"></pre><button id="back" class="saveRow dark" type="button"><strong>Back to Current</strong><span>Return without choosing Last Good.</span></button><div id="status" class="status">Loading recovery list…</div></div>
<script>
(()=>{
const LIST=document.getElementById('list'),STATUS=document.getElementById('status'),BACK=document.getElementById('back'),HBTN=document.getElementById('historyBtn'),HOUT=document.getElementById('historyOut'),SAVE_SPOT=document.getElementById('saveSpotBtn'),SPOTS_BTN=document.getElementById('spotsBtn'),SPOTS_OUT=document.getElementById('spotsOut');
const FALLBACK='pmp-current-inner-cleanbug-rgcontrols-v6.html#control';
const BANK='pmp_route_guardian_history_bank_v1',LEDGER='pmp_route_guardian_history_ledger_v1',SPOT_BANK='pmp_route_guardian_saved_spots_bank_v1';
let CURRENT_BEFORE=FALLBACK;
function status(m,w){STATUS.textContent=m;STATUS.className='status'+(w?' warn':'')}
function splitHash(t){t=String(t||'');let i=t.indexOf('#');return i>=0?[t.slice(0,i),t.slice(i)]:[t,'']}
function clean(t){t=String(t||'').trim();if(!t||/[\s<>"']/.test(t))return'';if(/^https?:\/\//i.test(t))return'';if(!/\.html($|[?#])/.test(t))return'';return t.replace(/^\.\//,'')}
function addFresh(t,label){t=clean(t)||FALLBACK;let parts=splitHash(t),base=parts[0],hash=parts[1]||'#control';base+=base.includes('?')?'&':'?';base+='fresh='+encodeURIComponent(label||'route-guardian')+'-'+Date.now();return base+hash}
function read(k,d){try{return localStorage.getItem(k)||d}catch(e){return d}}
function write(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function jread(k,d){try{return JSON.parse(localStorage.getItem(k)||'')}catch(e){return d}}
function jwrite(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function param(k){try{return new URLSearchParams(location.search).get(k)||''}catch(e){return''}}
function bank(){let b=jread(BANK,null);if(!b||typeof b!=='object')b={type:'PMP_ROUTE_GUARDIAN_HISTORY_BANK_V1',created_at:new Date().toISOString(),updated_at:new Date().toISOString(),max_entries:100,entries:[]};if(!Array.isArray(b.entries))b.entries=[];return b}
function spotBank(){let b=jread(SPOT_BANK,null);if(!b||typeof b!=='object')b={type:'PMP_ROUTE_GUARDIAN_SAVED_SPOTS_BANK_V1',created_at:new Date().toISOString(),updated_at:new Date().toISOString(),entries:[]};if(!Array.isArray(b.entries))b.entries=[];return b}
function pushMove(kind,data){let b=bank();b.entries.push({move_id:'rgm_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),at:new Date().toISOString(),kind,...(data||{})});if(b.entries.length>100)b.entries=b.entries.slice(-100);b.updated_at=new Date().toISOString();jwrite(BANK,b);jwrite(LEDGER,b);return b}
function saveSpot(label,route,source){let b=spotBank(),r=clean(route)||CURRENT_BEFORE||FALLBACK;let item={spot_id:'rgs_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),type:'PMP_ROUTE_GUARDIAN_SAVED_SPOT_V1',label:label||('Saved Spot '+new Date().toLocaleString()),route:r,restore_path:addFresh(r,'saved-spot-preview'),source:source||'manual',created_at:new Date().toISOString()};b.entries.unshift(item);b.updated_at=new Date().toISOString();jwrite(SPOT_BANK,b);pushMove('save_current_before_last_good',{from:'pmp-route-guardian-last-good-v1.html',to:r,label:item.label,spot_id:item.spot_id});return item}
function lastRouteBefore(current){let b=bank(),cur=clean(current);for(let i=b.entries.length-1;i>=0;i--){let e=b.entries[i],t=clean(e.to||e.target||e.route_entry||'');if(t&&t!==cur&&!/pmp-route-guardian-last-good-v1\.html/i.test(t))return t}return''}
async function currentMap(){try{let r=await fetch('pmp-current-map-v9.json?rg_lastgood='+Date.now(),{cache:'no-store'});let j=await r.json();return clean(j?.current_app?.path||j?.fallback_app?.path)||FALLBACK}catch(e){return FALLBACK}}
async function pointer(){try{let r=await fetch('pmp-latest.json?rg_lastgood='+Date.now(),{cache:'no-store'});return await r.json()}catch(e){return{last_good_saves:[],last_good:FALLBACK}}}
function isGuardian(t){return /pmp-route-guardian-current-loader-v14\.html/i.test(String(t||''))}
async function resolve(t,before){t=clean(t);if(!t||isGuardian(t))return before||await currentMap();return t}
function openRoute(label,target,before){return async e=>{e.preventDefault();let t=await resolve(target,before);write('pmp_route_guardian_current_target',t);write('pmp_route_guardian_last_good',t);let hist=pushMove(label==='Current Before Last Good'?'return_current_before_last_good':label==='Last Good'?'open_last_good':'open_saved_spot',{from:'pmp-route-guardian-last-good-v1.html',to:t,label});write('pmp_route_guardian_receipt',JSON.stringify({type:'PMP_ROUTE_GUARDIAN_ROUTE_CHOSEN_V1',target:t,label,history_count:hist.entries.length,at:new Date().toISOString(),safe_claim:'Route Guardian route was overwritten only after user chose a row.',do_not_claim:'Recovery route only; not proof of hook validation.'}));status('Route overwritten by choice.\n'+label+' → '+t);setTimeout(()=>{location.href=addFresh(t,label==='Current Before Last Good'?'route-guardian-return':label==='Last Good'?'route-guardian-last-good':'route-guardian-saved-spot')},120)}}
function row(label,target,note,cls,before){let b=document.createElement('button');b.type='button';b.className='saveRow '+(cls||'');b.innerHTML='<strong></strong><span></span>';b.querySelector('strong').textContent=label;b.querySelector('span').textContent=note+' · '+(clean(target)||target);b.onclick=openRoute(label,target,before);return b}
async function exactBefore(map){let fromParam=clean(decodeURIComponent(param('return')||''));if(fromParam)return fromParam;let capsule=jread('pmp_route_guardian_current_before_last_good_route',null);if(capsule&&clean(capsule.route_entry))return clean(capsule.route_entry);let stored=clean(read('pmp_route_guardian_exact_before_last_good',''));if(stored)return stored;return map||FALLBACK}
function renderHistory(){let b=bank();HOUT.textContent=JSON.stringify(b,null,2);HOUT.classList.toggle('open')}
function renderSpots(){let b=spotBank();SPOTS_OUT.innerHTML='';if(!b.entries.length){let p=document.createElement('div');p.textContent='No saved spots yet.';SPOTS_OUT.appendChild(p)}b.entries.forEach(s=>SPOTS_OUT.appendChild(row(s.label||'Saved Spot',s.route,'Saved '+(s.created_at||'')+' · restore path stored','',CURRENT_BEFORE)));SPOTS_OUT.classList.toggle('open')}
async function init(){let p=await pointer(),map=await currentMap(),before=await exactBefore(map);CURRENT_BEFORE=before;write('pmp_route_guardian_current_before_last_good',before);write('pmp_route_guardian_exact_before_last_good',before);let previous=lastRouteBefore(before)||clean(p.last_good)||clean(p?.last_good_saves?.[0]?.target)||before;pushMove('enter_route_guardian_last_good',{from:before,to:'pmp-route-guardian-last-good-v1.html',label:'Enter Route Guardian Last Good'});LIST.innerHTML='';LIST.appendChild(row('Current Before Last Good',before,'Exact current route imprinted on entry','currentBefore',before));LIST.appendChild(row('Last Good',previous,'Previous route from Route Guardian history bank','lastGood',before));SAVE_SPOT.onclick=e=>{e.preventDefault();let label='Current Before Last Good — '+new Date().toLocaleString();let spot=saveSpot(label,CURRENT_BEFORE,'save_current_before_last_good_button');status('Saved spot added.\n'+spot.label+' → '+spot.route);if(SPOTS_OUT.classList.contains('open'))renderSpots()};SPOTS_BTN.onclick=e=>{e.preventDefault();renderSpots()};HBTN.onclick=e=>{e.preventDefault();renderHistory()};BACK.onclick=e=>{e.preventDefault();pushMove('back_to_current_without_choice',{from:'pmp-route-guardian-last-good-v1.html',to:before,label:'Back to Current'});status('Returning to current route.\n'+before);setTimeout(()=>{location.href=addFresh(before,'route-guardian-back')},120)};status('Recovery list ready.\nCurrent Before: '+before+'\nLast Good: '+previous)}init();
})();
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f3ded4">
<title>Route Guardian Last Good</title>
<style>
html,body{margin:0;min-height:100%;background:#f3ded4;color:#07101c;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{padding:calc(18px + env(safe-area-inset-top,0px)) 12px calc(28px + env(safe-area-inset-bottom,0px))}.card{max-width:620px;margin:auto;background:#fff;border:3px solid #07101c;border-radius:26px;padding:14px;box-shadow:0 12px 28px #0003}.badge{display:inline-block;background:#acd1fb;border:2px solid #07101c;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:950;margin-bottom:8px}h1{margin:0 0 8px;font-size:26px}.hint{font-size:13px;line-height:1.35;color:#354154;margin:0 0 12px}.saveRow{width:100%;border:2px solid #07101c;border-radius:16px;background:#eef4fb;color:#07101c;padding:12px;text-align:left;margin-top:8px;font:inherit;font-weight:850}.saveRow strong{display:block;font-size:14px}.saveRow span{display:block;margin-top:4px;font-size:12px;font-weight:650;color:#354154;line-height:1.32}.currentBefore{background:#dff7e8}.dark{background:#172234;color:#eef4fb}.status{margin-top:12px;background:#123024;color:#d8ffe2;border:2px solid #07101c;border-radius:16px;padding:10px;font-size:12px;white-space:pre-wrap}.warn{background:#2b2010;color:#ffe0a3}
</style>
</head>
<body>
<div class="card"><div class="badge">ROUTE GUARDIAN LAST GOOD</div><h1>Route Guardian Last Good</h1><p class="hint">This recovery page shows saves only. Nothing opens until you choose. The first row returns to the current target captured before Last Good.</p><div id="list"><button class="saveRow">Loading saves…</button></div><button id="back" class="saveRow dark" type="button"><strong>Back to Current</strong><span>Return without choosing a Last Good save.</span></button><div id="status" class="status">Loading named saves…</div></div>
<script>
(()=>{
const LIST=document.getElementById('list'),STATUS=document.getElementById('status'),BACK=document.getElementById('back');
const FALLBACK='pmp-current-inner-cleanbug-rgcontrols-v6.html';
function status(m,w){STATUS.textContent=m;STATUS.className='status'+(w?' warn':'')}
function clean(t){t=String(t||'').trim();if(!t||/[\s<>"']/.test(t))return'';if(!/\.html($|[?#])/.test(t))return'';if(/^https?:\/\//i.test(t))return'';return t.replace(/^\.\//,'')}
function read(k,d){try{return localStorage.getItem(k)||d}catch(e){return d}}
function write(k,v){try{localStorage.setItem(k,v)}catch(e){}}
async function currentMap(){try{let r=await fetch('pmp-current-map-v9.json?rg_lastgood='+Date.now(),{cache:'no-store'});let j=await r.json();return clean(j?.current_app?.path||j?.fallback_app?.path)||FALLBACK}catch(e){return FALLBACK}}
async function pointer(){try{let r=await fetch('pmp-latest.json?rg_lastgood='+Date.now(),{cache:'no-store'});return await r.json()}catch(e){return{last_good_saves:[],last_good:FALLBACK}}}
function isGuardian(t){return /pmp-route-guardian-current-loader-v14\.html/i.test(String(t||''))}
async function resolve(t,before){t=clean(t);if(!t||isGuardian(t))return before||await currentMap();return t}
function name(s,i){return String(s.name||s.label||('Saved Build '+(i+1))).trim()}
function note(s){return String(s.note||s.notes||s.meaning||'Saved build.').trim()}
function row(s,i,before){let b=document.createElement('button');b.type='button';b.className='saveRow'+(s.currentBefore?' currentBefore':'');let nm=name(s,i),nt=note(s),raw=clean(s.target||s.url||s.href||'');b.innerHTML='<strong></strong><span></span>';b.querySelector('strong').textContent=nm;b.querySelector('span').textContent=nt+(raw?' · '+raw:'');b.onclick=async e=>{e.preventDefault();let t=await resolve(raw,before);write('pmp_route_guardian_current_target',t);write('pmp_route_guardian_last_good',t);write('pmp_route_guardian_receipt',JSON.stringify({type:'PMP_ROUTE_GUARDIAN_LAST_GOOD_RECOVERY_V1',target:t,label:nm,at:new Date().toISOString(),safe_claim:'Route Guardian Last Good opened only after user chose a save.',do_not_claim:'Recovery route only; not proof of hook validation.'}));status('Opening selected save.\nTarget: '+t);location.href=t+'?fresh=route-guardian-last-good-'+Date.now()+'#control'};return b}
async function init(){let p=await pointer();let map=await currentMap();let before=clean(read('pmp_route_guardian_current_target','')||read('pmp_route_guardian_last_good',''))||map;write('pmp_route_guardian_current_before_last_good',before);let saves=[{name:'Current Before Last Good',target:before,note:'Captured by Route Guardian before opening Last Good.',currentBefore:true}];if(Array.isArray(p.last_good_saves)&&p.last_good_saves.length)saves.push(...p.last_good_saves);else saves.push({name:'Last Good',target:p.last_good||before,note:'Current Last Good pointer.'});LIST.innerHTML='';saves.forEach((s,i)=>LIST.appendChild(row(s,i,before)));BACK.onclick=e=>{e.preventDefault();location.href=before+'?fresh=route-guardian-return-'+Date.now()+'#control'};status('Named save list loaded. Nothing has opened yet.')}init();
})();
</script>
</body>
</html>

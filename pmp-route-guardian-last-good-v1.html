<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Route Guardian Last Good</title><style>body{margin:0;background:#f3ded4;color:#07101c;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:grid;place-items:center;min-height:100vh;padding:18px}.card{background:#fff;border:3px solid #07101c;border-radius:24px;padding:18px;max-width:560px;text-align:center}button{width:100%;border:2px solid #07101c;border-radius:14px;background:#acd1fb;padding:12px;font:inherit;font-weight:950}pre{display:none;white-space:pre-wrap;text-align:left;background:#102033;color:#eaffef;border-radius:14px;padding:10px}.open{display:block}</style></head><body><div class="card"><h1>Route Guardian Last Good</h1><p>This forwarder follows the Current Map recovery role only.</p><button id="open">Open Last Good</button><pre id="status"></pre></div><script src="pmp-current-route-resolver-v1.js"></script><script>'use strict';const resolver=window.PMPCurrentRouteResolver,status=document.getElementById('status');async function target(){if(!resolver)throw new Error('resolver unavailable');let loaded=await resolver.load(),self=resolver.resolve(loaded.map,'recovery_routes.last_good_forwarder_v1'),next=resolver.resolve(loaded.map,'recovery_routes.last_good_v18');return{loaded,self,next}}async function go(){try{let s=await target(),url=resolver.buildUrl(s.next,{from:'last-good-forwarder-v1',fresh:'a002-p5-'+s.next.route_epoch+'-'+Date.now(),map_version:s.next.map_version,route_epoch:s.next.route_epoch},'');status.textContent=JSON.stringify({type:'PMP_LAST_GOOD_FORWARDER_V1_RECEIPT',status:'MAP_RECOVERY_HANDOFF_READY',self_role:s.self.role,next_role:s.next.role,next_path:s.next.path,map_path:s.next.map_path,map_version:s.next.map_version,route_epoch:s.next.route_epoch,launch_url:url,at:new Date().toISOString()},null,2);location.href=url}catch(e){status.classList.add('open');status.textContent=JSON.stringify(resolver?resolver.diagnostic(e,'last_good_forwarder_v1'):String(e),null,2)}}document.getElementById('open').onclick=go;target().then(()=>go()).catch(e=>{status.classList.add('open');status.textContent=JSON.stringify(resolver?resolver.diagnostic(e,'last_good_forwarder_v1_boot'):String(e),null,2)});</script></body></html>

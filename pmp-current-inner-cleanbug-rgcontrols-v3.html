function bankEsc(s){return String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}

lementById('pmpCopyBankInventoryBtn');if(a)a.onclick=function(e){if(e)e.preventDefault();bankCopy(d,JSON.stringify(inv,null,2));return false};const b=d.getElementById('pmpCopyProtectedRegistryBtn');if(b)b.onclick=function(e){if(e)e.preventDefault();bankCopy(d,JSON.stringify(PROTECTED_BANKS,null,2));return false};const c=d.getElementById('pmpCloseBankInventoryBtn');if(c)c.onclick=function(e){if(e)e.preventDefault();restoreConnectionsPanel(w,d);return false};repaintAll();return false}

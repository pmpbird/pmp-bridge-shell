<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PMP">
<meta name="theme-color" content="#52b5df">
<title>PMP Current Inner RG Controls v3</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#52b5df}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#52b5df}
</style>
</head>
<body>
<iframe id="app" src="pmp-home-single-v6.html?fresh=current-rgcontrols-v3#world"></iframe>
<script src="pmp-top-lossless-injector.js?fresh=rgcontrols-v3"></script>
<script src="pmp-resident-lossless-readiness.js?fresh=rgcontrols-v3"></script>
<script src="pmp-current-truth-face.js?fresh=rgcontrols-v3"></script>
<script src="pmp-resident-xray-core.js?fresh=rgcontrols-v3"></script>
<script src="pmp-resident-xray-finish.js?fresh=rgcontrols-v3"></script>
<script src="pmp-lossless-copy-fix.js?fresh=rgcontrols-v3"></script>
<script src="pmp-copy-lossless-diagnostic.js?fresh=rgcontrols-v3"></script>
<script src="pmp-resident-work-fix.js?fresh=rgcontrols-v3"></script>
<script src="pmp-control-room-cleanup-v1.js?fresh=rgcontrols-v3"></script>
<script src="pmp-native-contrast-bridge-v1.js?fresh=rgcontrols-v3"></script>
<script>
const F=document.getElementById('app');
function inside(){try{return{w:F.contentWindow,d:F.contentDocument||F.contentWindow.document}}catch(e){return{}}}
function bugUrl(){return 'bug-memory-current-clean-v1.html?fresh=open-'+Date.now()}
function actionUrl(kind){return 'pmp-route-guardian-action-v2.html?action='+encodeURIComponent(kind)+'&from=current-inner-rgcontrols-v3&fresh='+Date.now()}
function goBug(){location.href=bugUrl();return false}
function goAction(kind){location.href=actionUrl(kind);return false}
function textOf(x){return (x&&x.textContent||'').replace(/\s+/g,' ').trim()}
function installBridgeToggleFix(w,d){
  if(w.__pmpBridgePanelToggleFixV1)return;
  if(typeof w.openSharePanel!=='function'||typeof w.openConnectionsPanel!=='function')return;
  w.__pmpBridgePanelToggleFixV1={active:''};
  const oldShare=w.openSharePanel;
  const oldConnections=w.openConnectionsPanel;
  const oldSetBridgeOutput=typeof w.setBridgeOutput==='function'?w.setBridgeOutput:null;
  function panel(){try{return d.getElementById('bridgePanel')}catch(e){return null}}
  function closePanel(){
    const p=panel();
    if(p){p.className='note';p.textContent='Bridge ready.'}
    w.__pmpBridgePanelToggleFixV1.active='';
    return false;
  }
  w.openSharePanel=function(){
    if(w.__pmpBridgePanelToggleFixV1.active==='share')return closePanel();
    w.__pmpBridgePanelToggleFixV1.active='share';
    return oldShare.apply(this,arguments);
  };
  w.openConnectionsPanel=function(){
    if(w.__pmpBridgePanelToggleFixV1.active==='connections')return closePanel();
    w.__pmpBridgePanelToggleFixV1.active='connections';
    return oldConnections.apply(this,arguments);
  };
  if(oldSetBridgeOutput){
    w.setBridgeOutput=function(){
      w.__pmpBridgePanelToggleFixV1.active='';
      return oldSetBridgeOutput.apply(this,arguments);
    };
  }
}
function patch(){
  const o=inside(),w=o.w,d=o.d;if(!w||!d)return;
  const oldShow=typeof w.showSecret==='function'?w.showSecret:null;
  if(!w.__pmpRgControlsV3){
    w.__pmpRgControlsV3=true;
    w.showSecret=function(name){if(String(name)==='Bug Memory')return goBug();if(oldShow)return oldShow.apply(this,arguments)};
    w.automaticAppUpdate=function(){return goAction('appUpdate')};
  }
  installBridgeToggleFix(w,d);
  if(window.PMPNativeContrastBridgeV1&&typeof window.PMPNativeContrastBridgeV1.apply==='function')window.PMPNativeContrastBridgeV1.apply();
  if(!d.documentElement.dataset.pmpRgControlsV3Delegate){
    d.documentElement.dataset.pmpRgControlsV3Delegate='1';
    d.addEventListener('click',function(e){
      const b=e.target&&e.target.closest&&e.target.closest('button');if(!b)return;
      const t=textOf(b);
      if(t==='Bug Memory'){e.preventDefault();e.stopPropagation();if(e.stopImmediatePropagation)e.stopImmediatePropagation();return goBug()}
      if(t.includes('Automatic App Update')){e.preventDefault();e.stopPropagation();if(e.stopImmediatePropagation)e.stopImmediatePropagation();return goAction('appUpdate')}
      if(t.includes('Open Code Safety')){e.preventDefault();e.stopPropagation();if(e.stopImmediatePropagation)e.stopImmediatePropagation();return goAction('codeSafety')}
    },true);
  }
  Array.from(d.querySelectorAll('button')).forEach(b=>{
    const t=textOf(b);
    if(t==='Bug Memory')b.onclick=function(e){if(e)e.preventDefault();return goBug()};
    if(t.includes('Automatic App Update'))b.onclick=function(e){if(e)e.preventDefault();return goAction('appUpdate')};
    if(t.includes('Open Code Safety'))b.onclick=function(e){if(e)e.preventDefault();return goAction('codeSafety')};
  });
  if(window.PMPControlRoomCleanupV1&&typeof window.PMPControlRoomCleanupV1.apply==='function')window.PMPControlRoomCleanupV1.apply(d);
}
F.addEventListener('load',()=>{setTimeout(patch,100);setTimeout(patch,700);setTimeout(patch,1800)});
setInterval(patch,1000);
</script>
</body>
</html>

textContent+' '})}catch(x){}return clean(s||e.textContent)}function vis(e){try{let w=e.ownerDocument.defaultView,cs=w.getComputedStyle(e),r=e.getBoundingClientRect();if(cs.display==='none'||cs.visibility==='hidden'||Number(cs.opacity)===0||e.classList.contains('hidden')||r.width<=0||r.height<=0)return false;if(r.bottom<=0||r.right<=0||r.top>=(w.innerHeight||0)||r.left>=(w.innerWidth||0))return false;let x=Math.max(2,Math.min((w.innerWidth||1)-2,r.left+Math.min(20,Math.max(1,r.width/2)))),y=Math.max(2,Math.min((w.innerHeight||1)-2,r.top+Math.min(20,Math.max(1,r.height/2))));let hit=e.ownerDocument.elementFromPoint(x,y);return !!(hit&&(hit===e||e.contains(hit)||hit.contains(e)))}catch(x){return false}}function docs(d,a,n){a=a||[];n=n||0;if(!d||n>10)return a;try{a.push(d);d.querySelectorAll('iframe,frame').forEach(f=>{try{let x=f.contentDocument||(f.contentWindow&&f.contentWindow.document);if(x)docs(x,a,n+1)}catch(e){}})}catch(e){}return a}function best(){let b=null,s=-1;docs(document).forEach(d=>{let v=0;try{if(d.getElementById('bank'))v+=100;if(d.querySelector('[data-bank-buttons]'))v+=40;if(/pmp-home-single/i.test(String(d.location.href)))v+=20}catch(e){}if(v>s){s=v;b=d}});return s>0?b:null}function visibleLoading(b){let a=[];Array.from(b.querySelectorAll('h1,h2,h3,p,button,pre,code,span,div')).forEach(e=>{let t=own(e);if(!t||t.length>90||!vis(e))return;if(/^Loading\.{0,3}$/i.test(t)||/^Router loading\.{0,3}$/i.test(t)||/^Master Bank Inventory loading\.{0,3}$/i.test(t))a.push({tag:e.tagName.toLowerCase(),text:t})});return a}function escapes(b){let sels='[data-source-text-reader-level3],[data-source-reference-gate-level4],[data-source-reference-gate-level4b]';return Array.from(b.querySelectorAll(sels)).filter(x=>vis(x)&&!(x.closest('[data-bank-detail-wrap]')&&x.closest('[data-run-bank-tools]')&&x.closest('[data-cr-level-stack]'))).map(x=>({text:clean(x.textContent).slice(0,100),guard_hidden:x.hasAttribute('data-cr-level-containment-hidden')}))}function state(){let d=best();if(!d)return{app:false};let b=d.getElementById('bank');if(!b)return{app:true,bank:false,url:String(d.location.href)};let box=b.querySelector('[data-bank-buttons]'),openers=box?Array.from(box.querySelectorAll('[data-open-bank]')):[],visibleOpeners=openers.filter(vis),load=visibleLoading(b),esc=escapes(b);let ready=!!(box&&vis(box)&&openers.length>=10&&visibleOpeners.length>=1&&!load.length&&!esc.length);return{app:true,bank:true,url:String(d.location.href),bank_buttons_visual:!!(box&&vis(box)),bank_buttons_count:openers.length,visible_bank_button_count:visibleOpeners.length,visible_loading_items:load,visible_loading_flash:load.length>0,escaped_level3plus:esc,level3plus_escape_detected:esc.length>0,real_visual_bank_ready:ready,master_bank_version:(d.defaultView.PMPMasterBankTabV1&&d.defaultView.PMPMasterBankTabV1.version)||null,containment_version:(d.defaultView.PMPContinuousRunLevelUIScopeV1&&d.defaultView.PMPContinuousRunLevelUIScopeV1.version)||null}}function finish(v,why,st){rep.verdict=v;rep.reason=why;rep.status='complete';rep.finished_at=new Date().toISOString();if(timer){clearInterval(timer);timer=null}if(v==='FAIL')rep.failures.push({t_ms:Date.now()-t0,reason:why,state:st})}function sample(src){let t=Date.now()-t0,st=state();rep.elapsed_ms=t;if(st.visible_loading_flash)finish('FAIL','VISIBLE_LOADING_FLASH',st);else if(st.level3plus_escape_detected)finish('FAIL','LEVEL3PLUS_ESCAPE',st);else if(st.real_visual_bank_ready){if(readySince===null)readySince=t;if(t-readySince>=HOLD)finish('PASS','ZERO_FLASH_REAL_BANK_READY_STABLE',st)}else readySince=null;if(t>=RUN&&rep.verdict==='RUNNING')finish('FAIL','TIMEOUT_NO_ZERO_FLASH_READY',st);let row={t_ms:t,source:src,state:st};rep.samples.push(row);let sig=JSON.stringify({a:st.app,b:st.bank,load:st.visible_loading_flash,ready:st.real_visual_bank_ready,c:st.bank_buttons_count,v:st.visible_bank_button_count,e:(st.escaped_level3plus||[]).length,verdict:rep.verdict});if(sig!==last){last=sig;rep.events.push(row)}render

<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#f3ded4"><title>PMP Route Guardian v14 — Recovery Delegate</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f3ded4;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#07101c}#gate{position:fixed;inset:0;display:grid;place-items:center;padding:18px;text-align:center}.card{width:min(760px,100%);background:#fff;border:3px solid #07101c;border-radius:28px;padding:18px}.badge,button{background:#acd1fb;border:2px solid #07101c;border-radius:16px;padding:12px;font:inherit;font-weight:950;color:#07101c}.dark{background:#172234;color:#eef4fb}.grid{display:grid;gap:8px}pre{display:none;white-space:pre-wrap;text-align:left;background:#102033;color:#eaffef;border-radius:16px;padding:10px;max-height:42vh;overflow:auto}.open{display:block}</style></head><body><div id="gate"><div class="card"><div class="badge">HISTORIC RECOVERY DELEGATE v14</div><h1>Route Guardian v14</h1><p id="msg">This file cannot select an old map or app. It may return through Current Map only.</p><div class="grid"><button id="openBtn">Run Current App</button><button id="showBtn" class="dark">Show / Hide Evidence</button></div><pre id="report"></pre></div></div><script src="pmp-current-route-resolver-v1.js"></script><script>'use strict';const resolver=window.PMPCurrentRouteResolver,msg=document.getElementById('msg'),report=document.getElementById('report');let state=null;async function load(){if(state)return state;if(!resolver)throw new Error('resolver unavailable');let loaded=await resolver.load(),self=resolver.resolve(loaded.map,'recovery_routes.guardian_v14'),current=resolver.resolve(loaded.map,'current_app');state={loaded,self,current};report.textContent=JSON.stringify({type:'PMP_RG14_RECOVERY_DELEGATE_V1',status:'MAP_DELEGATE_READY',self_role:self.role,self_path:self.path,current_role:current.role,current_path:current.path,map_path:current.map_path,map_version:current.map_version,route_epoch:current.route_epoch,old_map_fetches:0,fallback_destinations:0,at:new Date().toISOString()},null,2);return state}document.getElementById('openBtn').onclick=async()=>{try{let s=await load(),h=resolver.normalizeHash(location.hash||'#control',s.loaded.map),url=resolver.buildUrl(s.current,{from:'historic-guardian-v14',fresh:'a002-p5-'+s.current.route_epoch+'-'+Date.now(),map_version:s.current.map_version,route_epoch:s.current.route_epoch},h);msg.textContent='Opening Current Map current_app.';location.href=url}catch(e){report.classList.add('open');report.textContent=JSON.stringify(resolver?resolver.diagnostic(e,'guardian_v14_delegate'):String(e),null,2)}};document.getElementById('showBtn').onclick=()=>report.classList.toggle('open');load().catch(e=>{report.classList.add('open');report.textContent=JSON.stringify(resolver?resolver.diagnostic(e,'guardian_v14_boot'):String(e),null,2)});</script></body></html>

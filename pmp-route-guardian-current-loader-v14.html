<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#f3ded4"><title>PMP Route Guardian v14</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f3ded4;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#07101c}#app{position:fixed;inset:0;width:100%;height:100%;border:0;background:#f3ded4}#gate{position:fixed;inset:0;display:grid;place-items:center;background:#f3ded4;padding:18px;z-index:9;text-align:center}.card{width:min(760px,100%);background:#fff;border:3px solid #07101c;border-radius:28px;padding:18px}.badge,button{background:#acd1fb;border:2px solid #07101c;border-radius:16px;padding:12px;font:inherit;font-weight:950;color:#07101c}.dark{background:#172234;color:#eef4fb}.grid{display:grid;gap:8px}.loaded #gate{display:none!important}pre{display:none;white-space:pre-wrap;text-align:left;background:#102033;color:#eaffef;border-radius:16px;padding:10px;max-height:42vh;overflow:auto}.open{display:block}</style></head><body><iframe id="app"></iframe><div id="gate"><div class="card"><div class="badge">ROUTE GUARDIAN v14</div><h1>Route Guardian</h1><p id="msg">Press Open Current.</p><div class="grid"><button id="openBtn">Open Current</button><button id="copyBtn" class="dark">Copy Report</button><button id="showBtn" class="dark">Show / Hide Report</button></div><pre id="report">No report yet.</pre></div></div><script>const app=document.getElementById('app'),msg=document.getElementById('msg'),report=document.getElementById('report'),openBtn=document.getElementById('openBtn'),showBtn=document.getElementById('showBtn'),copyBtn=document.getElementById('copyBtn');let receipt={type:'RG14_READY_OPEN_CURRENT',at:new Date().toISOString()};function safePath(path,fallback){path=String(path||fallback||'').trim();return /^[a-zA-Z0-9._\/-]+\.html$/.test(path)?path.replace(/^\/+/,''):fallback}async function fetchMap(){let url='pmp-current-map-v9.json?open-current='+Date.now();let r=await fetch(url,{cache:'no-store',headers:{'Cache-Control':'no-cache'}});if(!r.ok)throw new Error('map failed '+r.status);let j=await r.json();j.__map_url=url;return j}async function getTarget(){let map=await fetchMap();let p=safePath(map&&map.current_app&&map.current_app.path,'pmp-current-inner-cleanbug-rgcontrols-v13.html');let key=(map.current_app&&map.current_app.cache_key)||map.updated_at||Date.now();return{target:p,key,map}}async function openCurrent(){let got;try{got=await getTarget()}catch(e){got={target:'pmp-current-inner-cleanbug-rgcontrols-v13.html',key:'fallback-v13',map:{error:String(e)}}}receipt={type:'RG14_OPEN_CURRENT',at:new Date().toISOString(),target:got.target,cache_key:got.key,map_current_app:got.map&&got.map.current_app,map_updated_at:got.map&&got.map.updated_at,safe_claim:'Open Current force-fetched the current map and opened current_app.path with a fresh cache key.',do_not_claim:'Not source acceptance, not final Packet 1.5 proof, not frozen, not best-in-world.'};report.textContent=JSON.stringify(receipt,null,2);msg.textContent='Opening Current: '+got.target;app.src=got.target+'?fresh=rg14-open-current-'+encodeURIComponent(got.key)+'-'+Date.now()+'#control';app.onload=()=>{setTimeout(()=>document.body.classList.add('loaded'),800)}}openBtn.onclick=openCurrent;showBtn.onclick=()=>report.classList.toggle('open');copyBtn.onclick=async()=>{try{await navigator.clipboard.writeText(JSON.stringify(receipt,null,2));msg.textContent='Report copied.'}catch(e){report.classList.add('open')}};</script></body></html>

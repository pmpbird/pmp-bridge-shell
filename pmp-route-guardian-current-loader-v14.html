ntById&&d.getElementById('app'))||(d.querySelector&&d.querySelector('iframe'))||(w&&w.F);if(!f||!f.contentDocument)break;w=f.contentWindow;d=f.contentDocument}return d}catch(e){return null}}function inject(){let d=deepDoc();if(!d)return;['pmpPhase1PrivateCard','pmpPhase1InlineCard','pmpPhase1CurrentPanel','pmpPhase1FeedbackBanner','pmpFloatP1Btn','pmpFloatP1Panel'].forEach(id=>{try{let x=d.getElementById(id);if(x)x.remove()}catch(e){}});let t=Date.now();add(d,'pmpPhase1MigrateScript','pmp-phase1-migrate-v1.js?rg14='+t);add(d,'pmpPrivateBackupLiteScript','pmp-private-backup-lite-v1.js?rg14='+t);add(d,'pmpPhase1OldPanelSuppressScript','pmp-phase1-old-panel-suppress-v1.js?rg14='+t);add(d,'pmpPhase1PrivateWindowSingleScript','pmp-phase1-private-window-single-v1.js?rg14='+t);add(d,'pmpPhase1SourceRouterScript','pmp-phase1-source-router-v1.js?rg14='+t);add(d,'pmpSourceRecordCleanupScript','pmp-source-record-cleanup-v1.js?rg14='+t);add(d,'pmpManifestAlignmentSaveScript','pmp-manifest-alignment-save-v1.js?rg14='+t);add(d,'pmpManifestDetailCheckScript','pmp-manifest-detail-check-v1.js?rg14='+t);add(d,'pmpPurgeArchivedDuplicatesScript','pmp-purge-archived-duplicates-v1.js?rg14='+t);add(d,'pmpSupportIntakeGuardScript','pmp-support-intake-guard-v1.js?rg14='+t);add(d,'pmpAddonLoaderV1Script','pmp-addon-loader-v1.js?rg14='+t);add(d,'pmpAddonStatusCopyScript','pmp-addon-status-copy-v1.js?rg14='+t);add(d,'pmpPlanSlotFixScript','pmp-plan-slot-fix-v1.js?rg14='+t);add(d,'pmpPlanSlotSwapRepairScript','pmp-plan-slot-swap-repair-v1.js?rg14='+t);add(d,'pmpExactAddonRouterScript','pmp-exact-addon-router-v1.js?rg14='+t);try{localStorage.setItem('pmp_route_guardian_v14_support',JSON.stringify({type:'RG14_SUPPORT_INJECTED',at:new Date().toISOString(),safe_claim:'Route Guardian v14 injected Private Window support, fixed-slot Add-on Loader v1, Copy Add-on Status helper, Plan Slot Fix helper, Plan Slot Swap Repair helper, and Exact Add-on Router helper after manual Open Latest App.',do_not_claim:'Not app wiring, hook validation, full transfer, current-clean, frozen, or best-in-world.'}))}catch(e){}}async function getTarget(){try{let r=await fetch('pmp-current-map-v9.json?rg14='+Date.now(),{cache:'no-store'});let j=await r.json();return (j.current_app&&j.current_app.path)||'pmp-current-inner-cleanbug-rgcontrols-v4.html'}catch(e){return'pmp-current-inner-cleanbug-rgcontrols-v4.html'}}async function openLatest(){let target=await getTarget();receipt={type:'RG14_OPEN',at:new Date().toISOString(),target,safe_claim:'Route Guardian v14 opened current app after button press and prepared fixed-slot Add-on Loader v1, Copy Add-on Status helper, Plan Slot Fix helper, Plan Slot Swap Repair helper, and Exact Add-on Router helper.',do_not_claim:'Not source acceptance, hook validation, app proof, current-clean, frozen, or best-in-world.'};report.textContent=JSON.stringify(receipt,null,2);msg.textContent='Opening current app...';app.src=target+'?fresh=rg14-'+Date.now()+'#control';app.onload=()=>{[150,350,700,1200,2200,4200].forEach(ms=>setTimeout(inject,ms));setTimeout(()=>document.body.classList.add('loaded'),800)}}openBtn.onclick=openLatest;showBtn.onclick=()=>report.classList.toggle('open');copyBtn.onclick=async()=>{try{await navigator.clipboard.writeText(JSON.stringify(receipt,null,2));msg.textContent='Report copied.'}catch(e){report.classList.add('open')}};setInterval(inject,900);</script></body></html>

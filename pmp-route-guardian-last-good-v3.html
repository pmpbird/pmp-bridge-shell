<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><title>Route Guardian Last Good v3</title><style>body{margin:0;background:#f3ded4;color:#07101c;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:24px}.card{background:#fff;border:3px solid #07101c;border-radius:26px;padding:16px;max-width:620px;margin:auto}.badge{display:inline-block;background:#acd1fb;border:2px solid #07101c;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:950}h1{font-size:30px}.row{width:100%;margin-top:10px;border:2px solid #07101c;border-radius:16px;background:#eef4fb;color:#07101c;padding:14px;text-align:left;font:inherit;font-weight:900}.row small{display:block;margin-top:5px;font-size:12px;color:#354154}.cur{background:#dff7e8}.last{background:#fff4d6}.spot{background:#e9ecff}.dark{background:#172234;color:#eef4fb}.dark small{color:#b9c7d8}.status{margin-top:12px;background:#123024;color:#d8ffe2;border:2px solid #07101c;border-radius:16px;padding:10px;white-space:pre-wrap}.bank{display:none;background:#0c141e;color:#eef4fb;border-radius:14px;padding:10px;margin-top:10px;max-height:34vh;overflow:auto;font-size:11px}.open{display:block}</style></head><body><div class="card"><div class="badge">ROUTE GUARDIAN LAST GOOD</div><h1>Route Guardian Last Good</h1><p>Current recovery page. Move Ledger is the current system. Last Good should open the previous History Ledger snapshot.</p><div id="list"></div><button id="save" class="row spot">Save Current Before Last Good<small>Store the current route in Saved Spots.</small></button><button id="spots" class="row dark">Saved Spots<small>Hidden unless opened.</small></button><div id="spotBank" class="bank"></div><button id="moves" class="row dark">Move Ledger<small>Hidden bank of the last 100 total moves.</small></button><pre id="moveOut" class="bank"></pre><div id="status" class="status">Loading…</div></div><script>(()=>{const F='pmp-current-inner-cleanbug-rgcontrols-v7.html#control',SNAP='pmp-route-guardian-last-good-history-ledger-snapshot-v1.html',MOVE='pmp_route_guardian_move_ledger_bank_v1',SPOTS='pmp_route_guardian_saved_spots_bank_v1';let BEFORE=F;const $=id=>document.getElementById(id),S=$('status');function say(x){S.textContent=x}function clean(t){t=String(t||'').trim();if(!t||/[\s<>"']/.test(t)||/^https?:/i.test(t)||!/\.html($|[?#])/.test(t))return'';return t}function fresh(t,l){t=clean(t)||F;let i=t.indexOf('#'),b=i>=0?t.slice(0,i):t,h=i>=0?t.slice(i):'#control';return b+(b.includes('?')?'&':'?')+'fresh='+(l||'rg')+'-'+Date.now()+h}function jr(k,d){try{return JSON.parse(localStorage.getItem(k)||'')}catch(e){return d}}function jw(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}function mb(){let b=jr(MOVE,{type:'PMP_ROUTE_GUARDIAN_MOVE_LEDGER_BANK_V1',max_entries:100,entries:[]});b.type='PMP_ROUTE_GUARDIAN_MOVE_LEDGER_BANK_V1';b.max_entries=100;b.entries=Array.isArray(b.entries)?b.entries:[];return b}function push(kind,o){let b=mb();b.entries.push({move_id:'rgm_'+Date.now()+'_'+Math.random().toString(36).slice(2,6),at:new Date().toISOString(),kind,...(o||{})});b.entries=b.entries.slice(-100);b.updated_at=new Date().toISOString();jw(MOVE,b);jw('pmp_route_guardian_move_ledger_v1',b);return b}function seed(){let b=mb();if(b.entries.some(e=>e.seed_id==='history_snapshot_v1'))return;b.entries.push({move_id:'rgm_'+Date.now()+'_history_snapshot',seed_id:'history_snapshot_v1',at:new Date().toISOString(),kind:'chatgpt_github_file_patch',label:'Move Ledger replaced History Ledger',from:SNAP,to:'pmp-route-guardian-last-good-v3.html',restorable_route:SNAP});b.entries=b.entries.slice(-100);jw(MOVE,b);jw('pmp_route_guardian_move_ledger_v1',b)}function open(label,target){return e=>{e.preventDefault();let t=clean(target)||BEFORE;localStorage.setItem('pmp_route_guardian_current_target',t);localStorage.setItem('pmp_route_guardian_last_good',t);push(label==='Last Good'?'open_last_good':'return_current_before_last_good',{from:'pmp-route-guardian-last-good-v3.html',to:t,label});say('Opening '+label+' → '+t);setTimeout(()=>location.href=fresh(t,label),120)}}function row(label,target,note,cls){let b=document.createElement('button');b.className='row '+(cls||'');b.innerHTML=label+'<small>'+note+' · '+target+'</small>';b.onclick=open(label,target);return b}function init(){seed();let qp=new URLSearchParams(location.search),ret=clean(decodeURIComponent(qp.get('return')||''));BEFORE=ret||clean(localStorage.getItem('pmp_route_guardian_exact_before_last_good'))||F;localStorage.setItem('pmp_route_guardian_exact_before_last_good',BEFORE);push('enter_route_guardian_last_good',{from:BEFORE,to:'pmp-route-guardian-last-good-v3.html',label:'Enter Route Guardian Last Good'});$('list').appendChild(row('Current Before Last Good',BEFORE,'Exact current route imprinted on entry','cur'));$('list').appendChild(row('Last Good',SNAP,'Previous restorable recovery file: History Ledger snapshot','last'));$('save').onclick=e=>{e.preventDefault();let b=jr(SPOTS,{type:'PMP_ROUTE_GUARDIAN_SAVED_SPOTS_BANK_V1',entries:[]});b.entries=Array.isArray(b.entries)?b.entries:[];b.entries.unshift({spot_id:'rgs_'+Date.now(),label:'Current Before Last Good — '+new Date().toLocaleString(),route:BEFORE,created_at:new Date().toISOString()});jw(SPOTS,b);push('save_current_before_last_good',{to:BEFORE,label:'Current Before Last Good'});say('Saved spot added.\n'+BEFORE)};$('spots').onclick=e=>{e.preventDefault();$('spotBank').textContent=JSON.stringify(jr(SPOTS,{entries:[]}),null,2);$('spotBank').classList.toggle('open')};$('moves').onclick=e=>{e.preventDefault();$('moveOut').textContent=JSON.stringify(mb(),null,2);$('moveOut').classList.toggle('open')};say('Recovery list ready.\nCurrent Before: '+BEFORE+'\nLast Good: '+SNAP)}init()})();</script></body></html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PMP Clean">
<title>PMP Clean Current v24</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#52b5df;-webkit-text-size-adjust:100%;touch-action:manipulation}
#app{position:fixed;inset:0;width:100%;height:100%;border:0;background:#52b5df}
#status{position:fixed;left:10px;right:10px;bottom:10px;z-index:3;background:#123024;color:#c9f7d7;border:2px solid #fff;border-radius:16px;padding:8px 10px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:12px;display:none;white-space:pre-wrap}
</style>
</head>
<body>
<iframe id="app" src="pmp-clean-v21.html?fresh=v24-one-click-locked#control"></iframe>
<div id="status">Automatic App Update is locked to one-click current app refresh. No Safe Writer detour.</div>
<script>
const LATEST='pmp-clean-v21.html';
const FRAME=document.getElementById('app');
let lastAutoUpdateAt=0;
function showStatus(msg){
  const s=document.getElementById('status');
  s.textContent=msg;
  s.style.display='block';
  clearTimeout(showStatus.t);
  showStatus.t=setTimeout(()=>{s.style.display='none'},2200);
}
function oneTapUpdate(){
  lastAutoUpdateAt=Date.now();
  try{
    localStorage.setItem('pmp_current_clean_app_target',LATEST);
    localStorage.setItem('pmp_last_auto_update',JSON.stringify({type:'PMP_ONE_TAP_APP_UPDATE_V24',target:LATEST,at:new Date().toISOString(),meaning:'Newest clean app opened inside current app wrapper. No Safe Writer detour.'}));
  }catch(e){}
  showStatus('Automatic App Update complete.\nNewest clean app is open.\nNo Safe Writer detour.');
  FRAME.src=LATEST+'?fresh=one-click-update-v24-'+Date.now()+'#control';
  setTimeout(patchApp,250);
  setTimeout(patchApp,900);
}
function patchApp(){
  let w,d;
  try{w=FRAME.contentWindow;d=FRAME.contentDocument||w.document;}catch(e){return;}
  if(!w||!d)return;
  try{w.automaticAppUpdate=oneTapUpdate;}catch(e){}
  try{
    d.addEventListener('click',function(ev){
      const b=ev.target&&ev.target.closest?ev.target.closest('button'):null;
      if(b && (b.textContent||'').includes('Automatic App Update')){
        ev.preventDefault();
        ev.stopPropagation();
        if(ev.stopImmediatePropagation)ev.stopImmediatePropagation();
        oneTapUpdate();
        return false;
      }
    },true);
    const buttons=[...d.querySelectorAll('button')];
    for(const b of buttons){
      if((b.textContent||'').includes('Automatic App Update')){
        b.onclick=function(ev){if(ev){ev.preventDefault();ev.stopPropagation();}oneTapUpdate();return false;};
        const small=b.querySelector('small');
        if(small)small.textContent='one tap: open newest app directly';
      }
    }
  }catch(e){}
}
function guardFrame(){
  try{
    const href=FRAME.contentWindow.location.href;
    const autoWindow=Date.now()-lastAutoUpdateAt<3500;
    if(autoWindow && /safe-writer/i.test(href)){
      showStatus('Blocked old Safe Writer detour.\nReturning to current app.');
      FRAME.src=LATEST+'?fresh=blocked-safe-writer-detour-'+Date.now()+'#control';
    }
  }catch(e){}
}
FRAME.addEventListener('load',()=>{setTimeout(patchApp,120);setTimeout(patchApp,600);setTimeout(guardFrame,150);});
setInterval(()=>{patchApp();guardFrame();},1200);
</script>
</body>
</html>

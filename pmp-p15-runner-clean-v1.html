<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="theme-color" content="#f3ded4"><title>Packet 1.5 Clean Runner</title><style>html,body{margin:0;background:#f3ded4;color:#07101c;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{padding:18px;max-width:760px;margin:auto}.card{background:#fff;border:3px solid #07101c;border-radius:28px;padding:18px;box-shadow:0 8px 18px #0002}.badge,button{background:#acd1fb;border:2px solid #07101c;border-radius:18px;padding:12px 14px;font:inherit;font-weight:900;color:#07101c}button.dark{background:#172234;color:white}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{white-space:pre-wrap;background:#102033;color:#d9ffe5;border-radius:18px;padding:14px;font-weight:800;margin:12px 0}.out{white-space:pre-wrap;background:#102033;color:#eaf4ff;border-radius:18px;padding:12px;max-height:35vh;overflow:auto}.full{grid-column:1/-1}h1{font-size:34px;margin:8px 0}</style></head><body><main><div class="card"><div class="badge">PMP CURRENT · PACKET 1.5 CLEAN RUNNER</div><h1>Packet 1.5 Clean Runner</h1><p>This room only runs the proven 195 Packet 1.5 units. It does not load the jumping dashboard.</p><div class="stat" id="stat">Loading...</div><div class="grid"><button id="proof">Run Unit Proof</button><button id="start">Start Clean Run</button><button id="copy" class="dark">Copy Runner Proof</button><button id="stop" class="dark">Stop</button></div><pre class="out" id="out">Ready.</pre></div></main><script>
const UN='pmp_packet_1_5_units_v1',RUN='pmp_packet_1_5_clean_runner_v1',PROOF='pmp_packet_1_5_continuous_runner_proof_v1',SRC='pmp_packet_1_5_builder_source_v1';let timer=null;
const now=()=>new Date().toISOString();
const r=(k,d)=>{try{let v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};
const w=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v,null,2));return true}catch(e){return false}};
const raw=k=>{try{return localStorage.getItem(k)||''}catch(e){return''}};
function units(){let u=r(UN,[]);return Array.isArray(u)?u:[]}
function unitProof(){let u=units(),watch=[];u.forEach((x,i)=>{let m=[];if(!x.unit_id)m.push('unit_id');if(!x.unit_type)m.push('unit_type');if(!x.objective)m.push('objective');if(!x.checks||!x.checks.length)m.push('checks');if(m.length)watch.push({unit_index:i,unit_id:x.unit_id||('unit_'+i),missing:m})});let lim=u.filter(x=>x&&x.unit_type==='limitation_record').length;let pass=u.length===195&&lim===122&&watch.length===0;return{pass,units_total:u.length,limitation_records:lim,watch_units:watch.length,watch:watch.slice(0,8)}}
function state(){return r(RUN,{status:'READY',units_completed:0,current_unit_index:0,total_units:units().length,started_at:null})}
function save(x){x.updated_at=now();w(RUN,x);return x}
function makeProof(x){let p=unitProof();let q={type:'PMP_PACKET_1_5_CONTINUOUS_RUNNER_PROOF_V1',version:'1.0.1-clean-runner-room',at:now(),status:x.status,continuous_auto_run_after_manual_start:true,unit_verification_between_steps:true,manual_click_between_units:false,manual_start_pressed:!!x.manual_start_pressed,manual_stop_requested:!!x.manual_stop_requested,total_units:Number(x.total_units||0),units_completed:Number(x.units_completed||0),current_unit_index:Number(x.current_unit_index||0),packet_done:x.status==='COMPLETE',unit_proof_pass:p.pass,limitation_records:p.limitation_records,watch_units:p.watch_units,kernel_to_leaf_attachment_status:'attached_saturated_solidified_detailed_root_collar',guard_ok:true,guard_reasons:[],write_authority:'none',merge_authority:'none',paid_api_allowed:false,paid_fallback_allowed:false,spending_ceiling_usd:0,do_not_claim:'Does not write GitHub, does not run Shortcut, does not mutate the real app automatically, and does not use paid APIs.'};w(PROOF,q);return q}
function paint(){let x=state(),p=unitProof();document.getElementById('stat').textContent='Runner: '+x.status+'\ncompleted: '+Number(x.units_completed||0)+' / '+Number(x.total_units||0)+'\nunit proof: '+(p.pass?'PASS':'NOT READY')+'\nlimitation records: '+p.limitation_records;makeProof(x)}
function tick(){let x=state(),u=units();if(x.status!=='RUNNING')return;if(!unitProof().pass){x.status='WATCH';x.reason='unit proof not pass';save(x);paint();return}x.total_units=u.length;let i=Number(x.current_unit_index||0);if(i>=u.length){x.status='COMPLETE';x.completed_at=now();save(x);paint();clearInterval(timer);timer=null;return}x.current_unit={index:i,unit_id:u[i].unit_id,title:u[i].title};x.last_verified_unit={...x.current_unit,verified_at:now(),verification:'GOOD'};x.current_unit_index=i+1;x.units_completed=i+1;x.status=(x.current_unit_index>=u.length)?'COMPLETE':'RUNNING';if(x.status==='COMPLETE')x.completed_at=now();save(x);paint();if(x.status==='COMPLETE'&&timer){clearInterval(timer);timer=null}}
document.getElementById('proof').onclick=()=>{let p=unitProof();document.getElementById('out').textContent=JSON.stringify(p,null,2);paint()};
document.getElementById('start').onclick=()=>{let p=unitProof();if(!p.pass){document.getElementById('out').textContent='NOT READY: run Builder Proof in Control first, then reopen this clean runner.\n'+JSON.stringify(p,null,2);paint();return}let x=save({status:'RUNNING',manual_start_pressed:true,manual_stop_requested:false,total_units:p.units_total,units_completed:0,current_unit_index:0,started_at:now()});paint();if(timer)clearInterval(timer);timer=setInterval(tick,700)};
document.getElementById('stop').onclick=()=>{let x=state();x.status='STOPPED';x.manual_stop_requested=true;x.stopped_at=now();save(x);if(timer)clearInterval(timer);timer=null;paint()};
document.getElementById('copy').onclick=async()=>{let q=makeProof(state()),txt='PMP PACKET 1.5 CONTINUOUS RUNNER PROOF\n'+JSON.stringify(q,null,2);try{await navigator.clipboard.writeText(txt);document.getElementById('out').textContent='Runner proof copied.'}catch(e){document.getElementById('out').textContent=txt}};
paint();
</script></body></html>

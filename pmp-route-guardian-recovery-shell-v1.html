<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Route Guardian Recovery Shell</title><style>body{margin:0;background:#f3ded4;color:#07101c;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.bar{padding:12px;background:white;border-bottom:3px solid #07101c}.btn{display:block;width:100%;box-sizing:border-box;margin:8px 0;border:2px solid #07101c;border-radius:14px;background:#eef4fb;color:#07101c;padding:12px;font-weight:900;text-align:left;text-decoration:none}.dark{background:#172234;color:white}.good{background:#dff7e8}.warn{background:#fff4d6}.frame{width:100%;height:62vh;border:0;background:white}.hide{display:none}pre{background:#0c141e;color:white;border-radius:12px;padding:10px;max-height:24vh;overflow:auto}</style></head><body><div class="bar"><b>Route Guardian Recovery Shell</b><p>Recovery controls stay current. Viewed version can be old.</p><a id="ret" class="btn good">Return to Newer Move</a><button id="make" class="btn warn">Make This Version Current</button><button id="spots" class="btn dark">Saved Spots</button><pre id="out" class="hide"></pre><button id="moves" class="btn dark">Move Ledger</button><pre id="ledger" class="hide"></pre></div><iframe id="view" class="frame"></iframe><script>const q=new URLSearchParams(location.search),v=q.get('view')||'pmp-route-guardian-history-ledger-snapshot-v2.html',r=q.get('return')||localStorage.getItem('pmp_route_guardian_newer_move_return_v1')||'pmp-route-guardian-last-good-v5.html';localStorage.setItem('pmp_route_guardian_newer_move_return_v1',r);function f(t){return t+(t.includes('?')?'&':'?')+'fresh='+Date.now()}view.src=f(v);ret.href=f(r);make.onclick=()=>{localStorage.setItem('pmp_route_guardian_make_current_request_v1',v);out.className='';out.textContent='Marked version as current request: '+v};spots.onclick=()=>{out.className=out.className?'':'hide';let s=localStorage.getItem('pmp_route_guardian_saved_move_version_v1')||r;out.innerHTML='<a class="btn" href="'+f(s)+'">Saved Move Ledger Version</a>'};moves.onclick=()=>{ledger.className=ledger.className?'':'hide';ledger.textContent=localStorage.getItem('pmp_route_guardian_move_ledger_bank_v1')||'Move Ledger bank empty on this device.'}</script></body></html>

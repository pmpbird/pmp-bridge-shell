<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="theme-color" content="#52b5df"><title>PMP Current Loader v7</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#52b5df;color:#101827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}iframe#app{position:fixed;inset:0;width:100%;height:100%;border:0;background:#52b5df}#gate{position:fixed;inset:0;display:grid;place-items:center;background:#52b5df;padding:18px;z-index:25;overflow:auto;font-weight:950;text-align:center}#card{width:min(760px,100%);background:#46a9d3;border:3px solid #07101c;border-radius:28px;padding:18px;box-shadow:0 10px 24px #0003}.top{display:flex;justify-content:flex-end;margin-bottom:6px}.tiny{width:auto;border:2px solid #07101c;border-radius:999px;background:#a1fcfd;color:#101827;padding:6px 12px;font-size:12px;font-weight:950}.badge{display:inline-block;background:#a1fcfd;border:2px solid #07101c;border-radius:999px;padding:6px 10px;margin-bottom:10px;font-size:12px}h1{font-size:31px;margin:0 0 8px}.txt{font-size:16px;font-weight:850;margin:0 0 12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}@media(max-width:680px){.grid{grid-template-columns:1fr}}button{width:100%;border:0;border-radius:16px;background:#a1fcfd;color:#101827;font:inherit;font-weight:950;padding:13px;box-shadow:0 8px 18px #0002}.dark{background:#172234;color:#eef4fb;border:1px solid #25354a}.pill{display:inline-block;background:#172234;color:#eef4fb;border:1px solid #25354a;border-radius:999px;padding:7px 10px;font-size:12px;font-weight:900;margin:4px}.ok{background:#123024;color:#d8ffe2}.bad{background:#351414;color:#ffd1d1}.pass #card{border-color:#0b3519}.fail #card{border-color:#7d3333;background:#7b2f2f;color:#fff}.drop{display:none;margin-top:10px;background:#0c141e;color:#eef4fb;border:2px solid #a1fcfd;border-radius:18px;padding:10px;text-align:left}.drop.open{display:block}.pre{max-height:42vh;overflow:auto;white-space:pre-wrap;font:12px/1.35 ui-monospace,Menlo,monospace}.diagnostic{display:none;margin-top:10px;background:#351414;color:#ffd1d1;border:2px solid #ff9a9a;border-radius:18px;padding:10px;text-align:left;white-space:pre-wrap;font:13px/1.35 ui-monospace,Menlo,monospace;max-height:46vh;overflow:auto}.diagnostic.open{display:block}.residentNative{display:none;position:fixed;left:10px;right:10px;top:calc(54px + env(safe-area-inset-top));z-index:45;height:min(78vh,560px)}.residentNative.open{display:block}.residentFrame{width:100%;height:100%;border:0;border-radius:20px;background:transparent;box-shadow:0 8px 28px #0007}.loaded #gate,.loaded .drop,.loaded .diagnostic,.loaded #residentBox{display:none!important}</style></head><body><iframe id="app" title="PMP Current App"></iframe><div id="gate"><div id="card"><div class="top"><button id="residentBtn" class="tiny">Resident</button></div><div class="badge">ROUTE GUARDIAN</div><h1 id="title">Route Guardian</h1><p id="text" class="txt">Path Certifier checks Open World handoff integrity.</p><div id="chips"></div><div class="grid"><button id="primary">Check Route</button><button id="copy" class="dark">Copy Report</button><button id="show" class="dark">Show / Hide Report</button><button id="repo" class="dark">Repo Index</button></div><div id="blockDetail" class="diagnostic">No block detail yet.</div><pre id="report" class="drop pre">No report yet.</pre><div id="repoPanel" class="drop"><iframe id="repoFrame" title="Route Guardian Repo Index" style="width:100%;height:min(52vh,560px);border:0;border-radius:14px;background:#52b5df"></iframe></div></div></div><div id="residentBox" class="residentNative"><iframe id="residentFrame" class="residentFrame" title="Resident"></iframe></div><script src="pmp-route-guardian-v1.js?fresh=current-loader-v7-health"></script><script src="pmp-path-certifier-v7.js?fresh=current-loader-v7-health"></script><script src="pmp-last-known-good-reader-v1.js?fresh=current-loader-v7-health"></script><script src="pmp-route-health-summary-v1.js?fresh=current-loader-v7-health"></script><script>const MAP='pmp-current-map.json',DEFAULT='pmp-current-inner-cleanbug-rgcontrols-v3.html';let latest=null,cert=null,passed=false,loaded=false,map=null,copyBundle='';const F=app,G=gate,C=chips,T=title,TXT=text,P=primary,REP=report,BLOCK=blockDetail,RBOX=residentBox,RFRAME=residentFrame,RP=repoPanel,RF=repoFrame;function esc(s){return String(s??'').replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]))}function pill(s,ok){return'<span class="pill '+(ok?'ok':'bad')+'">'+esc(s)+'</span>'}function setGate(a,b,k){document.body.classList.remove('pass','fail','loaded');if(k)document.body.classList.add(k);G.style.display='grid';T.textContent=a;TXT.textContent=b}function closeDrops(ex){if(ex!=='resident')RBOX.classList.remove('open');if(ex!=='report')REP.classList.remove('open');if(ex!=='repo')RP.classList.remove('open')}async function getMap(){if(map)return map;let r=await fetch(MAP+'?fresh='+Date.now(),{cache:'no-store'});map=await r.json();return map}function safe(p,f){p=String(p||f||'').trim();return/^[a-zA-Z0-9._\/-]+\.html$/.test(p)?p:f}function norm(r){try{if(r.current_surface&&r.current_surface.file==='pmp-route-guardian-current-loader-v7.html'){let risks=(r.stale_shell_risk&&r.stale_shell_risk.risks)||[];r.mode='stable_door_current_loader';r.current_surface.current_loader_surface=true;r.current_surface.current_loader_mode='stable_door_current_loader';if(risks.length===1&&/not the expected entry/.test(risks[0]))r.stale_shell_risk={risk_count:0,risks:[],likely_stale_shell:false,support_test_surface_note:'Current loader v7 is the versioned Route Guardian loader behind the stable Home Screen door.'};if(r.stale_shell_risk)r.stale_shell_risk.support_test_surface_note='Current loader v7 is the versioned Route Guardian loader behind the stable Home Screen door.'}}catch(e){}return r}function render(cert,health){C.innerHTML=pill((health&&health.status)||'route',!!(cert&&cert.open_world_allowed))+pill('support '+(cert.inner_support_files_ok?'ok':'check'),!!cert.inner_support_files_ok)+pill('perm '+(cert.permission_integrity_ok?'ok':'check'),!!cert.permission_integrity_ok)+pill('handoff '+(cert.open_world_handoff_ok?'ok':'check'),!!cert.open_world_handoff_ok)+pill('LKG '+((health&&health.last_known_good_status)||'unknown'),!!(health&&health.last_known_good_available))}function makeFull(report,cert,recovery,health){let out={...report,route_health_summary:health,path_certifier:cert};if(recovery&&recovery.needed)out.last_known_good=recovery;return out}async function checkRoute(){setGate('Route Guardian','Checking route and Open World handoff...',null);P.textContent='Checking...';try{let r=norm(await PMPRouteGuardianV1.buildReport({store:false}));latest=r;cert=await PMPPathCertifierV7.build(r);let recovery=window.PMPLastKnownGoodV1?await PMPLastKnownGoodV1.read(r,cert):null;let health=window.PMPRouteHealthSummaryV1?PMPRouteHealthSummaryV1.build(r,cert,recovery):null;let full=makeFull(r,cert,recovery,health);REP.textContent=JSON.stringify(full,null,2);render(cert,health);passed=cert.open_world_allowed===true;copyBundle=JSON.stringify(full,null,2);if(passed){BLOCK.classList.remove('open');setGate('Route Guardian Passed',health?PMPRouteHealthSummaryV1.line(health):'Route clear. Open World handoff certified.','pass');P.textContent='Open World'}else{let detail=(health?PMPRouteHealthSummaryV1.line(health)+'\n\n':'')+PMPPathCertifierV7.explain(cert,r);if(recovery&&recovery.needed)detail+='\n\n'+PMPLastKnownGoodV1.explain(recovery);BLOCK.textContent=detail;BLOCK.classList.add('open');copyBundle=detail+'\n\nFULL REPORT + CERTIFIER\n'+JSON.stringify(full,null,2);setGate('Route Guardian Blocked',health?PMPRouteHealthSummaryV1.line(health):'Open World is blocked.','fail');P.textContent='Check Route'}}catch(e){passed=false;latest={type:'CURRENT_LOADER_V7_ERROR',built_at:new Date().toISOString(),error:String(e.message||e)};cert={open_world_allowed:false,route_confidence:'LOW',blocked_reasons:[String(e.message||e)],paths:{current_surface:'unknown',loader:'unknown',current_inner:'unknown'}};let recovery=window.PMPLastKnownGoodV1?await PMPLastKnownGoodV1.read(latest,cert):null;let health=window.PMPRouteHealthSummaryV1?PMPRouteHealthSummaryV1.build(latest,cert,recovery):null;let full=makeFull(latest,cert,recovery,health);let detail=(health?PMPRouteHealthSummaryV1.line(health)+'\n\n':'')+'ROUTE GUARDIAN BLOCK DETAIL\n\nOpen World is BLOCKED.\n\nReason: '+String(e.message||e)+'\n\nCopy this into Resident for a simpler explanation.';if(recovery&&recovery.needed)detail+='\n\n'+PMPLastKnownGoodV1.explain(recovery);BLOCK.textContent=detail;BLOCK.classList.add('open');REP.textContent=JSON.stringify(full,null,2);copyBundle=detail+'\n\nFULL REPORT + CERTIFIER\n'+JSON.stringify(full,null,2);setGate('Route Guardian Error',health?PMPRouteHealthSummaryV1.line(health):'Open World is blocked.','fail');P.textContent='Check Route'}}async function openWorld(){if(!passed||!cert||!cert.open_world_allowed){setGate('Route Not Certified','Run Check Route first. Open World only unlocks after Path Certifier allows it.','fail');P.textContent='Check Route';return}let m=await getMap().catch(()=>({current_app:{path:DEFAULT,cache_key:'fallback'}}));let cur=m.current_app||{};F.src=safe(cur.path,DEFAULT)+'?fresh=current-loader-v7-'+encodeURIComponent(cur.cache_key||Date.now())+'-'+Date.now()+'#world';loaded=true;setGate('Opening World','Opening certified current app from map.','pass');F.onload=()=>setTimeout(()=>document.body.classList.add('loaded'),550)}function openResident(){closeDrops('resident');RBOX.classList.toggle('open');if(RBOX.classList.contains('open'))RFRAME.src='pmp-resident-route-guardian-surface-v2.html?fresh='+Date.now()}window.addEventListener('message',e=>{if(e.data&&e.data.type==='PMP_RESIDENT_SURFACE_CLOSE')RBOX.classList.remove('open')});primary.onclick=()=>passed&&!loaded?openWorld():checkRoute();residentBtn.onclick=openResident;copy.onclick=async()=>{if(!copyBundle)await checkRoute();try{await navigator.clipboard.writeText(copyBundle);setGate('Copied',passed?'Report + certifier copied. Open World is available.':'Block detail + report copied for Resident.',passed?'pass':'fail')}catch(e){REP.classList.add('open')}};show.onclick=()=>{closeDrops('report');if(!latest&&REP.textContent.trim()==='No report yet.')REP.textContent='No report yet — run Check Route first.';REP.classList.toggle('open')};repo.onclick=()=>{closeDrops('repo');RP.classList.toggle('open');if(RP.classList.contains('open'))RF.src='pmp-route-guardian-repo-index-v1.html?inside=current-loader-v7&fresh='+Date.now()};</script></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><title>Route Guardian Last Good v4</title><style>body{margin:0;background:#f3ded4;color:#07101c;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:24px}.card{background:#fff;border:3px solid #07101c;border-radius:26px;padding:16px;max-width:620px;margin:auto}.badge{display:inline-block;background:#acd1fb;border:2px solid #07101c;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:950}.row{width:100%;margin-top:10px;border:2px solid #07101c;border-radius:16px;background:#eef4fb;color:#07101c;padding:14px;text-align:left;font:inherit;font-weight:900}.cur{background:#dff7e8}.last{background:#fff4d6}.spot{background:#e9ecff}.dark{background:#172234;color:#eef4fb}.danger{background:#3a1212;color:#ffe6e6;border-color:#ffb4b4}.bank{display:none;background:#0c141e;color:#eef4fb;border-radius:14px;padding:10px;margin-top:10px;max-height:38vh;overflow:auto}.open{display:block}.status{margin-top:12px;background:#123024;color:#d8ffe2;border:2px solid #07101c;border-radius:16px;padding:10px;white-space:pre-wrap}</style></head><body><div class="card"><div class="badge">ROUTE GUARDIAN LAST GOOD</div><h1>Route Guardian Last Good</h1><p>Current recovery page. Move Ledger is current. Save this page before testing Last Good.</p><div id="list"></div><button id="save" class="row spot">Save Current Before Last Good<br><small>Save this Move Ledger recovery page to Saved Spots.</small></button><button id="spots" class="row dark">Saved Spots<br><small>Return to saved recovery pages and delete saved spots.</small></button><div id="spotBank" class="bank"></div><button id="moves" class="row dark">Move Ledger<br><small>Show the last 100 total moves.</small></button><pre id="moveOut" class="bank"></pre><div id="status" class="status">Loading…</div></div><script>(()=>{const CUR='pmp-route-guardian-last-good-v4.html',APP='pmp-current-inner-cleanbug-rgcontrols-v7.html#control',HIST='pmp-route-guardian-history-ledger-snapshot-v2.html',SPOTS='pmp_route_guardian_saved_spots_bank_v1',MOVE='pmp_route_guardian_move_ledger_bank_v1';const $=id=>document.getElementById(id);function say(x){$('status').textContent=x}function jr(k,d){try{return JSON.parse(localStorage.getItem(k)||'')}catch(e){return d}}function jw(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}function fresh(t,l){t=String(t||CUR);let h='',i=t.indexOf('#');if(i>=0){h=t.slice(i);t=t.slice(0,i)}return t+(t.includes('?')?'&':'?')+'fresh='+(l||'rg')+'-'+Date.now()+h}function mb(){let b=jr(MOVE,{type:'PMP_ROUTE_GUARDIAN_MOVE_LEDGER_BANK_V1',max_entries:100,entries:[]});b.entries=Array.isArray(b.entries)?b.entries:[];return b}function push(kind,o){let b=mb();b.entries.push({move_id:'rgm_'+Date.now(),at:new Date().toISOString(),kind,...(o||{})});b.entries=b.entries.slice(-100);b.updated_at=new Date().toISOString();jw(MOVE,b);return b}function row(label,target,cls){let b=document.createElement('button');b.className='row '+(cls||'');b.innerHTML=label+'<br><small>'+target+'</small>';b.onclick=e=>{e.preventDefault();push(label==='Last Good'?'open_last_good':'return_current_before_last_good',{from:CUR,to:target,label});location.href=fresh(target,label)};return b}function spots(){let out=$('spotBank'),b=jr(SPOTS,{entries:[]});b.entries=Array.isArray(b.entries)?b.entries:[];out.innerHTML='';if(!b.entries.length){out.textContent='No saved spots yet.';return}b.entries.forEach(s=>{let o=document.createElement('button');o.className='row';o.innerHTML=(s.label||'Saved Spot')+'<br><small>'+s.route+'</small>';o.onclick=()=>location.href=fresh(s.route,'saved-spot');out.appendChild(o);let d=document.createElement('button');d.className='row danger';d.innerHTML='Delete Saved Spot<br><small>Remove this saved spot.</small>';d.onclick=e=>{e.preventDefault();let x=jr(SPOTS,{entries:[]});x.entries=(x.entries||[]).filter(a=>a.spot_id!==s.spot_id);jw(SPOTS,x);push('delete_saved_spot',{to:s.route,label:s.label,spot_id:s.spot_id});say('Saved spot deleted.');spots()};out.appendChild(d)})}function init(){push('enter_route_guardian_last_good',{from:APP,to:CUR,label:'Enter Move Ledger recovery'});$('list').appendChild(row('Current Before Last Good',APP,'cur'));$('list').appendChild(row('Last Good',HIST,'last'));$('save').onclick=e=>{e.preventDefault();let b=jr(SPOTS,{type:'PMP_ROUTE_GUARDIAN_SAVED_SPOTS_BANK_V1',entries:[]});b.entries=Array.isArray(b.entries)?b.entries:[];let it={spot_id:'rgs_'+Date.now(),label:'Move Ledger Version — '+new Date().toLocaleString(),route:CUR,created_at:new Date().toISOString()};b.entries.unshift(it);jw(SPOTS,b);push('save_current_before_last_good',{to:CUR,label:it.label,spot_id:it.spot_id});say('Saved current Move Ledger version.\nNow press Last Good to test History Ledger snapshot.');if($('spotBank').classList.contains('open'))spots()};$('spots').onclick=e=>{e.preventDefault();spots();$('spotBank').classList.toggle('open')};$('moves').onclick=e=>{e.preventDefault();$('moveOut').textContent=JSON.stringify(mb(),null,2);$('moveOut').classList.toggle('open')};say('Ready. Save first, then press Last Good.')}init()})();</script></body></html>

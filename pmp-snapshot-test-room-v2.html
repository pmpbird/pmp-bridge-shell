<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>PMP Snapshot Test Room v2</title><style>body{margin:0;background:#140f0c;color:#fff7ec;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.top{position:sticky;top:0;z-index:5;background:#201711;border-bottom:1px solid #76513e;padding:12px}.card{background:#2a211b;border:1px solid #76513e;border-radius:16px;margin:10px;padding:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.big{font-size:18px;border:2px solid #d8b58a;background:#fff3de;color:#23160f;border-radius:16px;padding:16px 10px;font-weight:800}.wide{grid-column:1/-1}pre{white-space:pre-wrap;background:#080605;border:1px solid #49372c;border-radius:12px;padding:10px;max-height:34vh;overflow:auto}iframe{width:100%;height:63vh;border:0;background:white;border-top:1px solid #76513e}</style><script src="pmp-page-hidden-state-reveal-contract-v1.js?v2=1"></script><script src="pmp-page-snapshot-contract-v1.js?v2=1"></script><script src="pmp-snapshot-verification-gate-v1.js?v2=1"></script><script src="pmp-snapshot-verification-gate-bridge-v1.js?v2=1"></script><script src="pmp-reload-perfect-restore-gate-v1.js?v2=1"></script><script src="pmp-snapshot-visibility-test-harness-v1.js?v2=1"></script></head><body><div class="top"><b>Snapshot Test Room v2</b><div style="font-size:13px;opacity:.85">Separate test page. Does not change the live app.</div></div><div class="card"><div class="grid"><button class="big" onclick="testHash('Control','#control')">Test Control</button><button class="big" onclick="testHash('Bank','#bank')">Test Bank</button><button class="big" onclick="testBank('Continuous Run Bank','continuous run')">Test Continuous Run Bank</button><button class="big" onclick="testBank('Connections Bank','connections bank')">Test Connections Bank</button><button class="big wide" onclick="testHash('World','#world')">Test World</button></div><pre id="out">Ready. Tap one big test button.</pre></div><iframe id="app" title="PMP test frame"></iframe><script>const f=document.getElementById('app'),out=document.getElementById('out');function show(x){out.textContent=typeof x==='string'?x:JSON.stringify(x,null,2)}function src(h){return 'pmp-current-inner-cleanbug-rgcontrols-v23.html?testroom=v2-'+Date.now()+h}function frameDoc(){try{return f.contentDocument||f.contentWindow.document}catch(e){return null}}function result(name){let r=top.PMPSnapshotVisibilityTestHarnessV1.run();show({test:name,status:r.status,pass:r.pass,missing_systems:r.missing_systems,page_fail_count:r.page_fail_count,pages:r.pages});return r}function testHash(name,h){show('Loading '+name+'...');f.onload=()=>setTimeout(()=>result(name),2500);f.src=src(h)}function clickText(needle){let d=frameDoc();if(!d)return false;needle=needle.toLowerCase();let b=[...d.querySelectorAll('button,a,div')].find(x=>(x.textContent||'').toLowerCase().includes(needle));if(b){b.click();return true}return false}function testBank(name,needle){show('Loading Bank, then opening '+name+'...');f.onload=()=>setTimeout(()=>{clickText('bank');setTimeout(()=>{let ok=clickText(needle);setTimeout(()=>{let r=result(name);r.open_clicked=ok;show(r)},1800)},1600)},2200);f.src=src('#bank')}f.src=src('#control');</script></body></html>

<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#52b5df"><title>PMP Current Repo Dropdown Test v2</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#52b5df;color:#101827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#52b5df}#gate{position:fixed;inset:0;display:grid;place-items:center;background:#52b5df;padding:18px;z-index:25;overflow:auto;font-weight:950;text-align:center}#card{width:min(760px,100%);background:#46a9d3;border:3px solid #07101c;border-radius:28px;padding:18px;box-shadow:0 10px 24px #0003}.top{display:flex;justify-content:flex-end;margin-bottom:6px}.tiny{width:auto;border:2px solid #07101c;border-radius:999px;background:#a1fcfd;color:#101827;padding:6px 12px;font-size:12px;font-weight:950;box-shadow:none}h1{font-size:31px;line-height:1.05;margin:0 0 8px}.badge{display:inline-block;background:#a1fcfd;border:2px solid #07101c;border-radius:999px;padding:6px 10px;margin:0 auto 10px;font-size:12px}.txt{font-size:16px;font-weight:850;margin:0 0 12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}@media(max-width:680px){.grid{grid-template-columns:1fr}}button{width:100%;border:0;border-radius:16px;background:#a1fcfd;color:#101827;font:inherit;font-weight:950;padding:13px;box-shadow:0 8px 18px #0002}.dark{background:#172234;color:#eef4fb;border:1px solid #25354a}.pill{display:inline-block;background:#172234;color:#eef4fb;border:1px solid #25354a;border-radius:999px;padding:7px 10px;font-size:12px;font-weight:900;margin:4px}.ok{background:#123024;color:#d8ffe2}.bad{background:#351414;color:#ffd1d1}.drop{display:none;margin-top:10px;background:#0c141e;color:#eef4fb;border:2px solid #a1fcfd;border-radius:18px;padding:10px;text-align:left}.drop.open{display:block}.dropgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-bottom:8px}@media(max-width:680px){.dropgrid{grid-template-columns:1fr}}.drop button{padding:10px;border-radius:14px}.pre{max-height:32vh;overflow:auto;white-space:pre-wrap;background:#0c141e;color:#eef4fb;border-top:1px solid #25354a;margin-top:8px;padding-top:8px;font:12px/1.35 ui-monospace,Menlo,monospace}.pass #card{border-color:#0b3519}.fail #card{border-color:#7d3333;background:#7b2f2f;color:#fff}.loaded #gate{display:none!important}.loaded .drop{display:none!important}#resFloat{position:fixed;right:12px;top:calc(8px + env(safe-area-inset-top));z-index:40;display:none;width:auto;border:2px solid #07101c;border-radius:999px;background:#a1fcfd;color:#101827;padding:6px 12px;font-size:12px;font-weight:950;box-shadow:0 6px 14px #0003}.residentMode #resFloat{display:block}</style></head><body><iframe id="app" title="PMP Current App"></iframe><button id="resFloat">Resident</button><div id="gate"><div id="card"><div class="top"><button id="resTab" class="tiny">Resident</button></div><div class="badge">ROUTE GUARDIAN</div><h1 id="title">Route Guardian</h1><p id="text" class="txt">Check the current route before World opens. Resident returns to Route Guardian. Only Open World opens World.</p><div id="chips"></div><div class="grid"><button id="primary">Check Route</button><button id="copy" class="dark">Copy Report</button><button id="show" class="dark">Show / Hide Report</button><button id="repo" class="dark">Repo Index</button></div><pre id="report" class="drop pre">No report yet.</pre><div id="repoDrop" class="drop"><div class="dropgrid"><button id="repoScan">Scan Repo Index</button><button id="repoCopy" class="dark">Copy Repo Report</button><button id="repoHide" class="dark">Hide</button></div><div id="repoResult">Repo Index is compact here.</div><pre id="repoJson" class="pre" style="display:none"></pre></div></div></div><script src="pmp-route-guardian-v1.js?fresh=repodrop-test-v2"></script><script>const MAP='pmp-current-map.json',BASE='pmp-home-single-v6.html';const F=app,T=title,TXT=text,CH=chips,P=primary,R=report,RD=repoDrop,RJ=repoJson,RR=repoResult;let latest=null,repoLatest=null,passed=false,worldOpen=false,residentMode=false,baseSrc='';function esc(s){return String(s).replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]))}function p(s,ok){return'<span class="pill '+(ok?'ok':'bad')+'">'+esc(s)+'</span>'}function gate(a,b,k){document.body.classList.remove('pass','fail','loaded','residentMode');if(k)document.body.classList.add(k);gateEl();T.textContent=a;TXT.textContent=b}function gateEl(){document.getElementById('gate').style.display='grid'}function closeDrops(x){if(x!=='report')R.classList.remove('open');if(x!=='repo')RD.classList.remove('open')}async function txt(path){let r=await fetch(path+'?fresh='+Date.now(),{cache:'no-store'}),t=await r.text();if(!r.ok)throw Error(path+' '+r.status);return t}async function js(path){return JSON.parse(await txt(path))}function clean(path){path=String(path||BASE).trim();return/^[a-zA-Z0-9._\/-]+\.html$/.test(path)?path.replace(/^\/+/, ''):BASE}function normalize(rep){try{if(rep.current_surface&&rep.current_surface.file==='pmp-app-current-repodrop-test-v2.html'){rep.current_surface.approved_support_test_surface=true;let risks=(rep.stale_shell_risk&&rep.stale_shell_risk.risks)||[];if(risks.length===1&&/not the expected entry/.test(risks[0])){rep.stale_shell_risk={risk_count:0,risks:[],likely_stale_shell:false,support_test_surface_note:'Repodrop v2 test is an approved support-test surface inside this test shell.'}}}}catch(e){}return rep}function setRep(rep){latest=normalize(rep);R.textContent=JSON.stringify(latest,null,2)}function render(rep){let m=rep.current_map_assessment||{},i=rep.current_inner_assessment||{},risk=(rep.stale_shell_risk||{}).risk_count||0;CH.innerHTML=p('map '+(m.current_path_matches_expected?'ok':'check'),!!m.current_path_matches_expected)+p('base '+(i.loads_base_app?'ok':'check'),!!i.loads_base_app)+p('bug '+(i.routes_bug_memory_clean?'ok':'check'),!!i.routes_bug_memory_clean)+p('risk '+risk,risk===0)}async function check(){gate('Route Guardian','Checking current app route...',null);P.textContent='Checking...';try{let rep=normalize(await window.PMPRouteGuardianV1.buildReport({store:false}));setRep(rep);render(rep);passed=String(rep.verdict||'').startsWith('PASS')&&((rep.stale_shell_risk||{}).risk_count||0)===0;if(passed){gate('Route Guardian Passed','Current route is clean. The same button is now Open World.','pass');P.textContent='Open World'}else{gate('Route Guardian Blocked',rep.resident_summary||'Route risk found.','fail');P.textContent='Check Route'}}catch(e){passed=false;setRep({type:'PMP_ROUTE_GUARDIAN_REPODROP_TEST_V2_ERROR',built_at:new Date().toISOString(),error:String(e.message||e)});CH.innerHTML=p('test failed',false);gate('Route Guardian Error',String(e.message||e),'fail');P.textContent='Check Route'}}async function srcFor(hash){let map=await js(MAP).catch(()=>({current_app:{path:BASE,cache_key:'fallback'}}));let c=map.current_app||{},path=clean(c.path||BASE),key=c.cache_key||Date.now();baseSrc=path+'?fresh=repodrop-v2-'+encodeURIComponent(key)+'-'+Date.now();return baseSrc+(hash||'#world')}async function openWorld(){if(!passed){gate('Route Not Passed','Run Check Route first.','fail');P.textContent='Check Route';return}residentMode=false;worldOpen=true;gate('Opening World','Route Guardian passed. Opening World now.','pass');F.src=await srcFor('#world');F.onload=()=>setTimeout(()=>{document.body.classList.add('loaded')},550);setTimeout(()=>document.body.classList.add('loaded'),3500)}async function toggleResident(){if(!passed){gate('Route Guardian','Run Check Route first. Then Resident can open normally.','fail');P.textContent='Check Route';return}if(residentMode){residentMode=false;F.src='about:blank';document.body.classList.remove('residentMode','loaded');gateEl();if(passed){T.textContent='Route Guardian Passed';TXT.textContent='Resident closed. Route Guardian is showing again. Open World is still the only path to World.';P.textContent='Open World';document.body.classList.add('pass')}return}residentMode=true;worldOpen=false;closeDrops();F.src=await srcFor('#resident');document.getElementById('gate').style.display='none';document.body.classList.add('residentMode')}async function copyRep(){if(!latest)await check();try{await navigator.clipboard.writeText(JSON.stringify(latest,null,2));gate('Report Copied',passed?'Report copied. Open World is still available.':'Report copied. Route is blocked or uncertain.',passed?'pass':'fail');if(passed)P.textContent='Open World'}catch(e){R.classList.add('open')}}async function checkPaths(paths){let out=[];for(let path of[...new Set(paths.filter(Boolean))]){try{let t=await txt(path);out.push({path,ok:true,size:t.length})}catch(e){out.push({path,ok:false,error:String(e.message||e)})}}let miss=out.filter(x=>!x.ok).map(x=>x.path);return{required_count:out.length,ok_count:out.filter(x=>x.ok).length,missing_count:miss.length,missing_paths:miss,checks:out}}async function scanRepo(){RR.innerHTML=p('scanning',true);RJ.style.display='none';let proofs=['control-pack/receipts/pmp-final-installed-stable-pass-2026-05-13.md','control-pack/receipts/pmp-control-room-route-guardian-cleanup-pass-2026-05-13.md','control-pack/decisions/pmp-route-guardian-repo-index-routing-only-decision-2026-05-13.md','control-pack/receipts/pmp-route-guardian-repo-index-v107-pass-2026-05-14.md'];try{let map=await js(MAP),cur=map.current_app||{},fb=map.fallback_app||{},g=window.PMPRouteGuardianV1||{},e=g.expected||{};let active=await checkPaths(['pmp-app-current.html',MAP,'pmp-route-guardian-v1.js',e.currentInner,cur.path,fb.path,BASE,'bug-memory-current-clean-v1.html','pmp-route-guardian-action-v2.html','pmp-control-room-cleanup-v1.js']);let receipt=await checkPaths(proofs);let agreement=cur.path===e.currentInner&&fb.path===e.currentInner;let warnings=[];if(!agreement)warnings.push('Map and Route Guardian expected path disagree.');if(active.missing_count)warnings.push('Active route files missing.');if(receipt.missing_count)warnings.push('Proof files missing.');let pass=agreement&&!warnings.length&&!active.missing_count&&!receipt.missing_count;repoLatest={type:'PMP_ROUTE_GUARDIAN_REPO_DROPDOWN_REPORT',version:'1.0.4-repodrop-test-v2',repo_index_verdict:pass?'PASS_REPO_INDEX_DROPDOWN_ROUTING_TRUTH':'WARNING_REPO_INDEX_DROPDOWN_NEEDS_REVIEW',built_at:new Date().toISOString(),deletion_permission:false,archive_permission:false,auto_promotion_permission:false,current_route:{map_current_path:cur.path||null,map_fallback_path:fb.path||null,route_guardian_version:g.version||null,route_guardian_expected_currentInner:e.currentInner||null,agreement},warnings,active_file_summary:active,proof_receipt_summary:receipt};RJ.textContent=JSON.stringify(repoLatest,null,2);RR.innerHTML=p(repoLatest.repo_index_verdict,pass)+p('agreement '+(agreement?'ok':'bad'),agreement)+p('warnings '+warnings.length,!warnings.length)+p('active '+active.ok_count+'/'+active.required_count,!active.missing_count)+p('proofs '+receipt.ok_count+'/'+receipt.required_count,!receipt.missing_count)}catch(e){repoLatest={type:'PMP_ROUTE_GUARDIAN_REPO_DROPDOWN_ERROR',version:'1.0.4-repodrop-test-v2',built_at:new Date().toISOString(),error:String(e.message||e),deletion_permission:false,archive_permission:false,auto_promotion_permission:false};RJ.textContent=JSON.stringify(repoLatest,null,2);RR.innerHTML=p('Repo Index error',false)}}P.onclick=()=>passed&&!worldOpen?openWorld():passed&&worldOpen?document.body.classList.add('loaded'):check();copy.onclick=copyRep;show.onclick=()=>{closeDrops('report');R.classList.toggle('open')};repo.onclick=()=>{closeDrops('repo');RD.classList.toggle('open')};repoScan.onclick=scanRepo;repoCopy.onclick=async()=>{if(!repoLatest)await scanRepo();try{await navigator.clipboard.writeText(JSON.stringify(repoLatest,null,2));RR.innerHTML+=p('copied',true)}catch(e){RJ.style.display='block';RR.innerHTML+=p('copy failed',false)}};repoHide.onclick=()=>RD.classList.remove('open');resTab.onclick=toggleResident;resFloat.onclick=toggleResident;</script></body></html>

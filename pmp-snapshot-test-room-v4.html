<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>PMP Snapshot Test Room v4</title><style>body{margin:0;background:#140f0c;color:#fff7ec;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.top{position:sticky;top:0;z-index:5;background:#201711;border-bottom:1px solid #76513e;padding:12px}.card{background:#2a211b;border:1px solid #76513e;border-radius:16px;margin:10px;padding:12px}.big{width:100%;font-size:24px;border:3px solid #d8b58a;background:#fff3de;color:#23160f;border-radius:18px;padding:20px 12px;font-weight:950}.small{font-size:14px;opacity:.82}.bar{height:10px;background:#0b0806;border:1px solid #49372c;border-radius:999px;overflow:hidden;margin-top:10px}.fill{height:100%;width:0;background:#fff3de}pre{white-space:pre-wrap;background:#080605;border:1px solid #49372c;border-radius:12px;padding:10px;max-height:35vh;overflow:auto}iframe{width:100%;height:58vh;border:0;background:white;border-top:1px solid #76513e}</style><script src="pmp-page-hidden-state-reveal-contract-v1.js?v4=1"></script><script src="pmp-page-snapshot-contract-v1.js?v4=1"></script><script src="pmp-snapshot-verification-gate-v1.js?v4=1"></script><script src="pmp-snapshot-verification-gate-bridge-v1.js?v4=1"></script><script src="pmp-reload-perfect-restore-gate-v1.js?v4=1"></script><script src="pmp-snapshot-visibility-test-harness-v1.js?v4=1"></script></head><body><div class="top"><b>Snapshot Test Room v4</b><div class="small">One-button whole-app visibility sweep. Separate page. Does not change the live app.</div></div><div class="card"><button class="big" onclick="testWholeApp()">TEST WHOLE APP</button><div class="bar"><div id="fill" class="fill"></div></div><pre id="out">Ready. Tap TEST WHOLE APP.</pre></div><iframe id="app" title="PMP whole app test frame"></iframe><script>const f=document.getElementById('app'),out=document.getElementById('out'),fill=document.getElementById('fill');function show(x){out.textContent=typeof x==='string'?x:JSON.stringify(x,null,2)}function progress(i,n){fill.style.width=Math.max(0,Math.min(100,Math.round(i*100/n)))+'%'}function src(h){return 'pmp-current-inner-cleanbug-rgcontrols-v23.html?testroom=v4-'+Date.now()+h}function sleep(ms){return new Promise(r=>setTimeout(r,ms))}function doc(){try{return f.contentDocument||f.contentWindow.document}catch(e){return null}}function load(h){return new Promise(res=>{f.onload=()=>setTimeout(res,2500);f.src=src(h)})}function text(x){return String(x&&x.textContent||'').replace(/\s+/g,' ').trim()}function clickNeedle(needle){let d=doc();if(!d)return false;needle=needle.toLowerCase();let nodes=[...d.querySelectorAll('button,a,div,span')];let hit=nodes.find(x=>text(x).toLowerCase().includes(needle));if(hit){try{hit.scrollIntoView({block:'center'})}catch(e){} hit.click();return true}return false}function harness(name){let r=top.PMPSnapshotVisibilityTestHarnessV1.run();return{test:name,status:r.status,pass:!!r.pass,missing_systems:r.missing_systems,page_fail_count:r.page_fail_count,pages:r.pages}}function bankNames(){let d=doc();if(!d)return[];let set=new Set();[...d.querySelectorAll('button,a,div')].forEach(el=>{let s=text(el);let m=s.match(/([A-Z][A-Za-z0-9 /]+ Bank)\b/);if(m){let name=m[1].replace(/\s+/g,' ').trim();if(name.length<44)set.add(name)}});return [...set].filter(x=>!/^Copy Bank$/i.test(x))}async function testBankDetail(name,total,index){progress(index,total);show('Testing '+name+'...');await load('#bank');await sleep(800);clickNeedle('bank');await sleep(1000);let opened=clickNeedle(name.toLowerCase());await sleep(2200);let r=harness(name);r.open_clicked=opened;return r}async function testHash(name,h,total,index){progress(index,total);show('Testing '+name+'...');await load(h);await sleep(700);return harness(name)}async function testWholeApp(){let tests=[];let planned=10;progress(0,planned);show('Starting whole app sweep...');let main=[['Home / World','#world'],['Bridge','#bridge'],['Library','#library'],['Workshop','#workshop'],['Control','#control'],['Bank','#bank']];for(let i=0;i<main.length;i++){tests.push(await testHash(main[i][0],main[i][1],planned,tests.length+1))}show('Finding Bank pages...');await load('#bank');await sleep(1400);let banks=bankNames();let required=['World Bank','Continuous Run Bank','Connections Bank','Library Bank','Workshop Bank','Helper Bank','Protection Bank','Bug Memory Bank','Migration Bank','UI / Control Surface Bank','Settings / Preferences Bank','Test / Verification Bank'];required.forEach(x=>{if(!banks.some(b=>b.toLowerCase()===x.toLowerCase()))banks.push(x)});banks=[...new Set(banks)];planned=main.length+banks.length;for(let b of banks){tests.push(await testBankDetail(b,planned,tests.length+1))}progress(planned,planned);let pass=tests.every(t=>t.pass&&t.page_fail_count===0&&(!('open_clicked'in t)||t.open_clicked));let failed=tests.filter(t=>!t.pass||t.page_fail_count||(('open_clicked'in t)&&!t.open_clicked)).map(t=>({test:t.test,open_clicked:t.open_clicked,pass:t.pass,page_fail_count:t.page_fail_count,missing_systems:t.missing_systems,pages:t.pages}));let result={type:'PMP_SNAPSHOT_TEST_ROOM_V4_WHOLE_APP_SWEEP',status:pass?'WHOLE_APP_SWEEP_PASS':'WHOLE_APP_SWEEP_FAIL',pass,test_count:tests.length,bank_pages_found:banks.length,failed,tests};show(result)}f.src=src('#world');</script></body></html>

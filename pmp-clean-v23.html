function phase1Status(){buildHooks();let h=arr(read(MED_KEYS.hookSlots,[])),b=arr(read(MED_KEYS.sourceBodies,[])),m=arr(read(MED_KEYS.manifestRecords,[])),f=arr(read(MED_KEYS.fieldRegistry,[])),s=arr(read(MED_KEYS.supportSourceObjects,[])),r=arr(read(MED_KEYS.hookReceipts,[])),c=read(MED_KEYS.bodyChainStatus,{});return{type:'PMP_PHASE1_STATUS_V1',app_wrapper:WRAPPER,built_at:now(),phase1_hooks_present:h.filter(x=>/^HOOK-00[1-6]$/.test(x.hook_id)).length,hook_slots:h.length,source_bodies:b.length,accepted_bodies:b.filter(x=>x.acceptance_state==='accepted').length,manifest_records:m.length,field_registry:f.length,support_objects:s.length,hook_receipts:r.length,body_chain_status:c.body_order_state||'not_loaded',claim_ceiling:'specified_not_wired_not_validated',safe_claim:'v23 contains local Phase 1 source intake structure after this file loads.',do_not_claim:'Do not call source bodies accepted unless pasted, verified, and accepted. Do not call hooks validated, real-app tested, GitHub Vault proven, Notes proven, frozen, best-in-world, or current-clean.'}}
function privateBackup(){buildHooks();let d={type:'PMP_PRIVATE_WINDOW_BACKUP_V1',app_wrapper:WRAPPER,built_at:now(),privacy_class:'PRIVATE_TO_USER_PMP_ONLY',source:'control_private_window',summary:phase1Status(),safe_claim:'Private backup contains localStorage PMP keys only.',do_not_claim:'Private backup is not GitHub Vault proof, not Apple Notes proof, not real app validation, and not full source transfer proof.',keys:{}};for(let i=0;i<localStorage.length;i++){let k=localStorage.key(i);if(k&&k.startsWith('pmp_'))d.keys[k]=localStorage.getItem(k)}write(MED_KEYS.privateBackup,d);writeReceipt('private_backup_created',{hook_id:'HOOK-005',proof_state:'local_backup_created'});return d}
async function copyText(t){try{await navigator.clipboard.writeText(t);return true}catch(e){return false}}
function out(d,msg){let el=d.getElementById('secretOut')||d.getElementById('controlStatus');if(el){el.classList.remove('hidden');el.textContent=typeof msg==='string'?msg:JSON.stringify(msg,null,2)}showStatus(typeof msg==='string'?msg.slice(0,180):'Private output updated.')}
function latestPacket(){return[...arr(read(MED_KEYS.sourceBodies,[])),...arr(read(MED_KEYS.manifestRecords,[])),...arr(read(MED_KEYS.supportSourceObjects,[]))].slice().reverse().find(x=>['staged','verified','held','pasted'].includes(x.acceptance_state))}
function addPanel(d){let secret=d.getElementById('secretPanel')||([...d.querySelectorAll('h1')].find(x=>(x.textContent||'').includes('Private Window'))||{}).closest?.('.card');if(!secret||d.getElementById('pmpPhase1SourcePanel'))return;let panel=d.createElement('div');panel.id='pmpPhase1SourcePanel';panel.style.cssText='margin-top:12px;padding:10px;border:2px solid rgba(255,255,255,.75);border-radius:14px;background:rgba(0,0,0,.16);display:block;';panel.innerHTML='<div style="font-weight:800;margin-bottom:6px">Phase 1 Source Intake - v23</div><textarea id="pmpSourceText" placeholder="Paste one mold body, manifest, or support source packet here. Raw text is stored exactly as pasted." style="width:100%;min-height:130px;border-radius:10px;padding:8px;box-sizing:border-box;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px"></textarea><div id="pmpPhase1Buttons" style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-top:8px"></div><div style="font-size:11px;opacity:.9;margin-top:8px">Pasted/staged is not accepted. Verified is not accepted until Accept Verified Source runs. Support material is never counted as a mold body.</div>';let grid=panel.querySelector('#pmpPhase1Buttons');['Paste Mold Source','Stage Source','Verify Source','Accept Verified Source','Hold Source','Show Body Chain','Show Manifest Alignment','Show Phase 1 Receipts','Private Backup','Show Support Objects','Route Field Families'].forEach(name=>{let b=d.createElement('button');b.className='mini';b.textContent=name;b.onclick=async ev=>{ev&&ev.preventDefault();let ta=d.getElementById('pmpSourceText');try{if(name==='Paste Mold Source'){try{ta.value=await navigator.clipboard.readText();out(d,'Source pasted into intake box. Not staged, verified, or accepted yet.')}catch(e){out(d,'Clipboard read blocked. Paste source text manually.')}return false}if(name==='Stage Source'){if(!ta.value.trim())return out(d,'No source text in intake box.');return out(d,stageMoldSource(ta.value))}let p=latestPacket();if(name==='Verify Source')return out(d,p?verifyMoldSource(p.source_packet_id):'No staged source found.');if(name==='Accept Verified Source')return out(d,p?acceptVerifiedSource(p.source_packet_id):'No verified source found.');if(name==='Hold Source')return out(d,p?holdSource(p.source_packet_id,'held from Private Window button'):'No source found to hold.');if(name==='Show Body Chain')return out(d,buildBodyChainStatus());if(name==='Show Manifest Alignment')return out(d,checkManifestAlignment());if(name==='Show Phase 1 Receipts')return out(d,{hook_receipts:arr(read(MED_KEYS.hookReceipts,[])).slice(-50),transfer_receipts:arr(read(MED_KEYS.transferReceipts,[])).slice(-50),safe_claim:'Receipts are local/private only.',do_not_claim:'Receipts are not real app proof, Vault proof, Notes proof, or validation proof.'});if(name==='Private Backup'){let x=privateBackup();await copyText(JSON.stringify(x,null,2));return out(d,x)}if(name==='Show Support Objects')return out(d,showSupportObjects());if(name==='Route Field Families')return out(d,routeFieldFamilies())}catch(e){out(d,{error:String(e&&e.message||e),safe_claim:'Action failed safely.',do_not_claim:'Do not call the step complete.'})}return false};grid.appendChild(b)});secret.appendChild(panel)}
function wire(w,d){if(!w||!d)return;initMedium();buildHooks();if(!w.__pmpPrivateV23Patched){let old=w.showSecret;w.__pmpPrivateV23Patched=true;w.showSecret=function(name){if(name==='Private Status'){out(d,phase1Status());return}if(name==='Private Backup'){let b=privateBackup();copyText(JSON.stringify(b,null,2));out(d,b);return}if(name==='Mold-to-App Wiring'||name==='Phase 1 Source Intake'){addPanel(d);out(d,phase1Status());return}if(typeof old==='function')return old.apply(w,arguments);out(d,name+' opened.')}}let secret=d.getElementById('secretPanel')||([...d.querySelectorAll('h1')].find(x=>(x.textContent||'').includes('Private Window'))||{}).closest?.('.card');if(secret&&!d.getElementById('pmpMediumWiringPrivateBtn')){let grid=secret.querySelector('.grid')||secret;['Mold-to-App Wiring','Phase 1 Source Intake'].forEach((txt,i)=>{let b=d.createElement('button');b.id=i?'pmpPhase1SourceIntakeBtn':'pmpMediumWiringPrivateBtn';b.className='mini';b.textContent=txt;b.onclick=ev=>{ev&&ev.preventDefault();addPanel(d);out(d,phase1Status());return false};grid.appendChild(b)})}addPanel(d)}
function patch(){let w,d;try{w=FRAME.contentWindow;d=FRAME.contentDocument||w.document}catch(e){showStatus('v23 could not reach inner app yet.');return}wire(w,d)}
FRAME.addEventListener('load',()=>{setTimeout(patch,120);setTimeout(patch,600);setTimeout(patch,1400);setTimeout(patch,3000)});
setInterval(patch,1000);
</script>

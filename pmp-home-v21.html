<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>PMP Home v21</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#52b5df}iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#52b5df}</style></head><body><iframe id="home" src="pmp-home-v20.html?fresh=v21-color-deep-resident"></iframe><script>const HOME=document.getElementById('home');const COLOR_KEY='pmp_color_settings_v21';function colorState(){try{return{accent:'#a1fcfd',background:'#52b5df',card:'#46a9d3',...JSON.parse(localStorage.getItem(COLOR_KEY)||'{}')}}catch(e){return{accent:'#a1fcfd',background:'#52b5df',card:'#46a9d3'}}}function saveColorState(c){localStorage.setItem(COLOR_KEY,JSON.stringify(c));applyColors()}function getFrames(){try{let hw=HOME.contentWindow,hd=HOME.contentDocument||hw.document;let mid=hd.getElementById('home')||hd.getElementById('app');let mw=mid?mid.contentWindow:hw,md=mid?(mid.contentDocument||mw.document):hd;let app=md.getElementById('app');let aw=app?app.contentWindow:mw,ad=app?(app.contentDocument||aw.document):md;return{hw,hd,mw,md,aw,ad}}catch(e){return null}}function applyColors(){let f=getFrames();if(!f)return;let c=colorState();for(const d of [document,f.hd,f.md,f.ad]){try{d.documentElement.style.setProperty('--a',c.accent);d.documentElement.style.setProperty('--a2',c.accent);d.documentElement.style.setProperty('--a4',c.accent);d.documentElement.style.setProperty('--bg',c.background);d.documentElement.style.setProperty('--card',c.card);d.body.style.background=c.background}catch(e){}}try{for(const el of f.ad.querySelectorAll('.card'))el.style.background=c.card;for(const el of f.ad.querySelectorAll('.big,.floatBtn,.float,.toolbtn'))el.style.background=c.accent;for(const el of f.ad.querySelectorAll('.green,.teal'))el.style.background=c.accent;for(const el of f.ad.querySelectorAll('.tabs'))el.style.borderTopColor=c.accent}catch(e){}try{let s=f.ad.getElementById('colorStatusV21');if(s)s.textContent='Colors applied.'}catch(e){}}function installColorDropdown(f){let d=f.ad,w=f.aw;if(!d||d.getElementById('colorSettingsV21'))return;let deep=[...d.querySelectorAll('button')].find(b=>(b.textContent||'').includes('Deep Resident Intelligence'));if(!deep)return;let c=colorState();let box=d.createElement('div');box.id='colorSettingsV21';box.className='panel';box.style.marginTop='10px';box.innerHTML='<button class="mini" onclick="toggleColorSettingsV21()">Color Settings</button><div id="colorSettingsBodyV21" class="hidden"><p class="sub" style="color:#c9f7d7">Choose the three main app colors.</p><label>Accent color<input id="colorAccentV21" type="color" value="'+c.accent+'"></label><label>Background color<input id="colorBgV21" type="color" value="'+c.background+'"></label><label>Card color<input id="colorCardV21" type="color" value="'+c.card+'"></label><div class="grid"><button class="mini" onclick="saveColorSettingsV21()">Save Colors</button><button class="mini" onclick="resetColorSettingsV21()">Reset Colors</button></div><div id="colorStatusV21" class="note">Color settings ready.</div></div>';deep.parentNode.insertBefore(box,deep);w.toggleColorSettingsV21=function(){let body=d.getElementById('colorSettingsBodyV21');body.classList.toggle('hidden')};w.saveColorSettingsV21=function(){let next={accent:d.getElementById('colorAccentV21').value,background:d.getElementById('colorBgV21').value,card:d.getElementById('colorCardV21').value};saveColorState(next);let s=d.getElementById('colorStatusV21');if(s)s.textContent='Colors saved and applied.'};w.resetColorSettingsV21=function(){localStorage.removeItem(COLOR_KEY);let x=colorState();d.getElementById('colorAccentV21').value=x.accent;d.getElementById('colorBgV21').value=x.background;d.getElementById('colorCardV21').value=x.card;applyColors();let s=d.getElementById('colorStatusV21');if(s)s.textContent='Colors reset.'};for(const id of ['colorAccentV21','colorBgV21','colorCardV21']){let input=d.getElementById(id);input.addEventListener('input',()=>{let live={accent:d.getElementById('colorAccentV21').value,background:d.getElementById('colorBgV21').value,card:d.getElementById('colorCardV21').value};localStorage.setItem(COLOR_KEY,JSON.stringify(live));applyColors()})}}function patchDeepResident(f){let d=f.ad;if(!d)return;let deep=[...d.querySelectorAll('button')].find(b=>(b.textContent||'').includes('Deep Resident Intelligence'));if(deep&&!deep.__v21Return){deep.__v21Return=true;deep.onclick=function(){try{localStorage.setItem('pmp_deep_resident_return_v21',JSON.stringify({return_to:'pmp-home-v21.html#control',label:'Back to Control Room',at:new Date().toISOString()}))}catch(e){}location.href='resident.html?from=pmp-home-v21&return=pmp-home-v21.html%23control'};let sm=deep.querySelector('small');if(sm)sm.textContent='opens deeper intelligence / returns to Control Room'}}function hideOldBridgeResident(f){try{let d=f.ad;let strip=[...d.querySelectorAll('#bridge .toolstrip button')];for(const b of strip)if((b.textContent||'').trim()==='Resident')b.style.display='none'}catch(e){}}function removeOldColorPanel(f){try{let old=f.ad.getElementById('colorSettingsV20');if(old)old.remove()}catch(e){}}function patch(){let f=getFrames();if(!f)return;applyColors();hideOldBridgeResident(f);removeOldColorPanel(f);installColorDropdown(f);patchDeepResident(f)}HOME.addEventListener('load',()=>{setTimeout(patch,800);setTimeout(patch,2000);setTimeout(patch,4200)});setInterval(patch,1800);window.addEventListener('message',patch);</script></body></html>

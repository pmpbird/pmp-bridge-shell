<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#52b5df"><title>PMP Home Single v8</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#52b5df}iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#52b5df}</style></head><body><iframe id="app" src="pmp-home-single-v7.html?fresh=v8-theme-fix"></iframe><script>const F=document.getElementById('app');const THEME_KEY='pmp_single_themes_v8';const LEGACY_KEYS=['pmp_single_themes_v6','pmp_single_themes_v5','pmp_single_themes_v4'];const COLOR_KEY='pmp_single_colors_v6';const READ_KEY='pmp_readability_layer_v6';const DEFAULT={accent:'#a1fcfd',background:'#52b5df',card:'#46a9d3',line:'#ffffff'};function read(k,f){try{let v=localStorage.getItem(k);return v?JSON.parse(v):f}catch(e){return f}}function write(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}function cleanColors(c){return{accent:(c&&c.accent)||DEFAULT.accent,background:(c&&c.background)||DEFAULT.background,card:(c&&c.card)||DEFAULT.card,line:(c&&c.line)||DEFAULT.line}}function currentColors(){return cleanColors({...read('pmp_single_colors_v5',{}),...read(COLOR_KEY,{})})}function currentRead(){let r=read(READ_KEY,{value:50});let v=+r.value;return Number.isFinite(v)?Math.max(0,Math.min(100,v)):50}function allThemes(){let list=read(THEME_KEY,null);if(!Array.isArray(list)){list=[];for(const k of LEGACY_KEYS){let old=read(k,[]);if(Array.isArray(old))for(const t of old)if(t&&t.name&&!list.some(x=>x.name===t.name))list.push({name:String(t.name),colors:cleanColors(t.colors),readability:Number.isFinite(+t.readability)?+t.readability:currentRead(),saved_at:t.saved_at||new Date().toISOString()})}write(THEME_KEY,list)}return list.filter(t=>t&&t.name).map(t=>({name:String(t.name),colors:cleanColors(t.colors),readability:Number.isFinite(+t.readability)?+t.readability:50,saved_at:t.saved_at||''}))}function saveThemes(list){let seen=new Set(),out=[];for(const t of list){if(!t||!t.name||seen.has(t.name))continue;seen.add(t.name);out.push({name:String(t.name),colors:cleanColors(t.colors),readability:Number.isFinite(+t.readability)?+t.readability:50,saved_at:t.saved_at||new Date().toISOString()})}write(THEME_KEY,out)}function options(list){let names=['Default',...list.map(t=>t.name)];return names.map(n=>'<option value="'+String(n).replace(/"/g,'&quot;')+'">'+n+'</option>').join('')}function frame(){try{let w=F.contentWindow,d=F.contentDocument||w.document;let inner=d.getElementById('app');if(inner){w=inner.contentWindow;d=inner.contentDocument||w.document}return{w,d}}catch(e){return null}}function patch(){let o=frame();if(!o)return;let w=o.w,d=o.d;if(!w||!d)return;let sel=d.getElementById('themeSelect'),name=d.getElementById('themeName');if(!sel||sel.__v8ThemeFix)return;sel.__v8ThemeFix=true;function refresh(selected){let list=allThemes();sel.innerHTML=options(list);if(selected)sel.value=selected;return list}function getInputs(){return cleanColors({accent:d.getElementById('colorAccent')?.value,background:d.getElementById('colorBg')?.value,card:d.getElementById('colorCard')?.value,line:d.getElementById('colorLine')?.value})}function setInputs(c){c=cleanColors(c);d.getElementById('colorAccent').value=c.accent;d.getElementById('colorBg').value=c.background;d.getElementById('colorCard').value=c.card;d.getElementById('colorLine').value=c.line}function status(s){let el=d.getElementById('colorStatus');if(el)el.textContent=s}function applyActive(c,r){write(COLOR_KEY,cleanColors(c));write(READ_KEY,{value:Number.isFinite(+r)?+r:currentRead()});if(d.getElementById('readability'))d.getElementById('readability').value=Number.isFinite(+r)?+r:currentRead();if(w.applyColors)w.applyColors(true);else if(w.stableApply)w.stableApply(true);let ro=d.getElementById('readabilityReadout');if(ro&&w.readName)ro.textContent=(Number.isFinite(+r)?+r:currentRead())+' — '+w.readName(Number.isFinite(+r)?+r:currentRead())}w.themeList=function(){return[{name:'Default',colors:DEFAULT,readability:50,built_in:true},...allThemes()]};w.initColors=function(){setInputs(currentColors());let r=currentRead();let sl=d.getElementById('readability');if(sl)sl.value=r;let ro=d.getElementById('readabilityReadout');if(ro&&w.readName)ro.textContent=r+' — '+w.readName(r);refresh(sel.value)};w.saveTheme=function(){let n=(name.value||'').trim();if(!n)return status('Name the theme first.');if(n==='Default')return status('Use another name. Default stays protected.');let c=getInputs();let r=currentRead();let list=allThemes().filter(t=>t.name!==n);list.push({name:n,colors:{...c},readability:r,saved_at:new Date().toISOString()});saveThemes(list);refresh(n);write(COLOR_KEY,{...c});write(READ_KEY,{value:r});if(w.applyColors)w.applyColors(true);status('Theme saved as its own copy: '+n)};w.loadTheme=function(){let n=sel.value;if(n==='Default'){setInputs(DEFAULT);applyActive(DEFAULT,50);status('Loaded Default.');return}let t=allThemes().find(x=>x.name===n);if(!t)return status('Theme not found.');setInputs({...t.colors});applyActive({...t.colors},t.readability);refresh(n);status('Loaded saved theme copy: '+n)};w.deleteTheme=function(){let n=sel.value;if(n==='Default')return status('Default stays saved.');let list=allThemes().filter(t=>t.name!==n);saveThemes(list);refresh('Default');status('Deleted theme: '+n)};w.resetDefaultTheme=function(){setInputs(DEFAULT);applyActive(DEFAULT,50);refresh('Default');status('Default colors restored.')}sel.addEventListener('change',()=>{let n=sel.value;if(n==='Default'){setInputs(DEFAULT);return}let t=allThemes().find(x=>x.name===n);if(t)setInputs({...t.colors})},{passive:true});refresh(sel.value||'Default');let note=[...d.querySelectorAll('.note')].find(x=>(x.textContent||'').includes('Contrast is not a color'));if(note)note.textContent='Contrast is not a color. Contrast is the readability layer over the colors. Each saved theme now keeps its own frozen color copy.';let auto=[...d.querySelectorAll('button')].find(b=>(b.textContent||'').includes('Automatic App Update'));if(auto){let small=auto.querySelector('small');if(small)small.textContent='single-file v8 target'}if(!w.__v8Auto){w.__v8Auto=true;w.automaticAppUpdate=function(){let req={type:'PMP_AUTOMATIC_APP_UPDATE_SINGLE_V8',built_at:new Date().toISOString(),target:'pmp-home-single-v8.html',safe_path:'latest pointer should point to this fixed saved-theme file after testing'};localStorage.setItem('pmp_auto_update_request_single_v8',JSON.stringify(req));let c=d.getElementById('controlStatus');if(c)c.textContent=JSON.stringify(req,null,2)}}}F.addEventListener('load',()=>{setTimeout(patch,300);setTimeout(patch,1000);setTimeout(patch,2200)});setInterval(patch,1400);</script></body></html>

<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f3ded4;color-scheme:light;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#07101c}iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#f3ded4;visibility:hidden}.handoff{position:fixed;inset:0;z-index:2147482400;background:#f3ded4;color:#07101c;display:grid;place-items:center;text-align:center;padding:18px;box-sizing:border-box}.handoff.hide{display:none}.handoffBox{background:#fff;border:3px solid #07101c;border-radius:26px;box-shadow:0 8px 24px rgba(0,0,0,.18);padding:18px;max-width:520px;width:100%;font-weight:950}.handoffSub{font-size:12px;font-weight:750;margin-top:8px;opacity:.75}.panel{position:fixed;inset:14px;z-index:30;background:#fff;border:3px solid #07101c;border-radius:22px;box-shadow:0 8px 24px rgba(0,0,0,.18);padding:12px;box-sizing:border-box;display:none;flex-direction:column;gap:8px}.panel.show{display:flex}.badge{background:#acd1fb;border:2px solid #07101c;border-radius:14px;padding:8px 10px;font-weight:950;text-align:center}.sub{font-size:12px;margin:0}.mini{border:2px solid #07101c;border-radius:12px;background:#b9d7ff;padding:8px 10px;font-weight:900}.dark{background:#172234;color:#eef4fb}pre{white-space:pre-wrap;overflow:auto;background:#07101c;color:#f8fbff;border-radius:12px;padding:8px;font:750 9px/1.2 monospace;flex:1;min-height:100px}

<body>
<iframe id="a" title="PMP Current App"></iframe>
<div class="handoff" id="handoffCover"><div class="handoffBox">Restoring PMP Home…<div class="handoffSub">Reload Owner map handoff</div></div></div>
<div class="panel" id="receiptPanel"><div class="badge">Reload Owner v30 diagnostics</div><p class="sub">Reload Owner runs silently on normal launch. This panel shows only from Route Guardian diagnostics or a fail-closed route error.</p><button class="mini" id="copyReceipt">Copy Reload Owner Receipt</button><button class="mini dark" id="continueNow">Continue Now</button><pre id="receiptOut">Building receipt...</pre></div>
<script src="pmp-current-route-resolver-v1.js"></script>
<script src="pmp-safe-area-surface-fill-v1.js?fresh=ownership-presentation-local-20260727A"></script>
<script src="pmp-pass1w-live-proof-reader-v1.js?fresh=orchestrator-20260705X"></script>
<script src="pmp-current-screen-pointer-v1.js?fresh=pointer-20260705X"></script>
<script src="pmp-reload-world-from-map-v1.js?fresh=rg21-20260705X"></script>
<script src="pmp-active-path-discovery-zip-export-v2.js?fresh=canonical-v1-reader-event-driven-20260727A"></script>
<script src="pmp-pass75-reload-runtime-platform-gate-v1.js?fresh=pass75-heartbeat-20260708D"></script>
<script>
'use strict';
const frame=document.getElementById('a'),panel=document.getElementById('receiptPanel'),cover=document.getElementById('handoffCover'),out=document.getElementById('receiptOut');
const DIAG=new URLSearchParams(location.search).get('diagnostics')==='reload-owner';
const BASE='v30-a002-p2-map-delegated-chain-20260711A';
const MOUNT='pmp-mount-registry-v1-cachelift-20260706b.js?fresh=mount-registry-pass7-final-gap-fixed-20260706D';
const SURFACE='pmp-safe-area-surface-fill-v1.js?fresh=ownership-presentation-local-20260727A';
const PAUSE_MS=DIAG?4500:0;
const resolver=window.PMPCurrentRouteResolver;
let routeState=null,last=null,lastReceipt=null,started=false,failed=false;
setTimeout(()=>{try{cover.classList.add('hide')}catch(e){}},900);
setTimeout(()=>{try{cover.classList.add('hide')}catch(e){}},1600);
if(DIAG)panel.classList.add('show');
function writeTop(k,v){try{localStorage.setItem(k,JSON.stringify(v,null,2))}catch(e){}try{if(window.top&&window.top.localStorage)window.top.localStorage.setItem(k,JSON.stringify(v,null,2))}catch(e){}}
function receipt(src,status,extra){const state=routeState||{};let r=Object.assign({type:'PMP_AUTO_FRESH_LOADER_V1_RECEIPT',version:'1.3.0-a002-p2-map-delegated-chain-20260711A',owner:'pmp-current-reload-owner-v30',mode:DIAG?'diagnostic_panel_visible':'silent_reload_owner',current_inner_src:src,current_inner_file:state.inner&&state.inner.path||null,marker_file:state.marker&&state.marker.path||null,map_path:state.inner&&state.inner.map_path||resolver&&resolver.mapPath||null,map_version:state.inner&&state.inner.map_version||null,route_epoch:state.inner&&state.inner.route_epoch||null,visible_receipt_panel:DIAG,pause_ms:PAUSE_MS,status:status,built_at:new Date().toISOString(),pass:status!=='fail_closed'},extra||{});lastReceipt=r;writeTop('pmp_auto_fresh_loader_v1_receipt',r);writeTop('pmp_v30_reload_owner_visible_receipt_v1',r);out.textContent=JSON.stringify(r,null,2);return r}
function failClosed(error,context){failed=true;started=true;const d=resolver?resolver.diagnostic(error,context||'reload_owner'):{type:'PMP_ROUTE_FAIL_CLOSED_DIAGNOSTIC_V1',context:context||'reload_owner',code:'RESOLVER_UNAVAILABLE',message:String(error&&error.message||error),action:'navigation_blocked_no_fallback_consulted'};receipt('', 'fail_closed',{diagnostic:d,pass:false,rule:'Reload Owner did not consult a hard-coded inner route or alternate marker.'});panel.classList.add('show');cover.classList.add('hide');try{frame.removeAttribute('src')}catch(e){}return d}
function inject(id,src){try{let d=frame.contentDocument||(frame.contentWindow&&frame.contentWindow.document);if(!d||d.getElementById(id))return;let s=d.createElement('script');s.id=id;s.src=src;(d.head||d.documentElement).appendChild(s)}catch(e){}}
function mount(){inject('pmpMountRegistryCachelift20260706b',MOUNT)}
function surface(){inject('pmpSafeAreaSurfaceFillV1Frame',SURFACE)}
async function loadRoutes(){if(!resolver)throw new Error('PMP Current Route Resolver did not load.');const loaded=await resolver.load();const inner=resolver.resolve(loaded.map,'runtime_chain.inner_v30');const marker=resolver.resolve(loaded.map,'runtime_chain.live_update_marker');return{loaded,inner,marker,hash:resolver.normalizeHash(location.hash,loaded.map)}}
function innerUrl(rev){if(!routeState||!routeState.inner)throw new Error('Map-issued inner-v30 handoff is unavailable.');return resolver.buildUrl(routeState.inner,{fresh:(rev?'v30-map-marker-'+String(rev):BASE)+'-'+Date.now(),map_version:routeState.inner.map_version,route_epoch:routeState.inner.route_epoch,marker_revision:String(rev||'')},routeState.hash)}
async function readMarker(){if(!routeState||!routeState.marker)throw new Error('Map-issued marker handoff is unavailable.');const url=resolver.buildUrl(routeState.marker,{fresh:Date.now(),route_epoch:routeState.marker.route_epoch},'');const r=await fetch(url,{cache:'no-store',credentials:'same-origin'});if(!r.ok)throw new Error('marker_http_'+r.status);const m=await r.json();if(!m||m.type!=='PMP_RELOAD_CURRENT_LIVE_UPDATE_MARKER_V1')throw new Error('marker_type_invalid');if(Object.prototype.hasOwnProperty.call(m,'target'))throw new Error('marker_target_forbidden');if(m.destination_selection!==false)throw new Error('marker_destination_policy_invalid');const rev=String(m.revision||m.updated_at||m.version||'');if(!rev)throw new Error('marker_revision_missing');return rev}
async function start(){if(started||failed)return;started=true;try{routeState=await loadRoutes();const rev=await readMarker();last=rev;const src=innerUrl(rev);receipt(src,DIAG?'marker_loaded_waiting_before_inner':'marker_loaded_silent',{revision:rev,marker_destination_selection:false});setTimeout(()=>{if(failed)return;receipt(src,'loading_inner_after_reload_owner',{revision:rev});panel.classList.remove('show');frame.src=src},PAUSE_MS)}catch(e){failClosed(e,'reload_owner_start')}}
async function check(){if(failed||!routeState)return;try{const rev=await readMarker();if(rev!==last){last=rev;const src=innerUrl(rev);receipt(src,'refreshed',{revision:rev,marker_destination_selection:false});cover.classList.remove('hide');setTimeout(()=>cover.classList.add('hide'),900);frame.src=src}}catch(e){failClosed(e,'reload_owner_marker_refresh')}}
frame.addEventListener('load',()=>{[20,80,180,360,800,1500,2600,4200,6500].forEach(t=>setTimeout(surface,t));[30,120,360,800,1500,2600,4200,6500].forEach(t=>setTimeout(mount,t));setTimeout(()=>cover.classList.add('hide'),450);setTimeout(()=>cover.classList.add('hide'),1400)});
function install(){surface();mount();try{if(window.PMPActivePathDiscoveryZipExportV2&&window.PMPActivePathDiscoveryZipExportV2.install)window.PMPActivePathDiscoveryZipExportV2.install()}catch(e){}}
function afterRuntime(){frame.style.visibility='visible';start();[200,600,1200,2200,3600,5200].forEach(t=>setTimeout(install,t));setInterval(install,1200);setInterval(check,5000)}
document.getElementById('copyReceipt').onclick=function(){try{navigator.clipboard.writeText(JSON.stringify(lastReceipt||receipt('', 'manual_copy_before_start'),null,2));this.textContent='Copied'}catch(e){}};
document.getElementById('continueNow').onclick=function(){if(failed)return;if(lastReceipt&&lastReceipt.current_inner_src){panel.classList.remove('show');frame.src=lastReceipt.current_inner_src}else start()};
receipt('',DIAG?'v30_reload_owner_diagnostics_started':'v30_reload_owner_silent_started');
try{if(window.PMPPass75ReloadRuntimePlatformGateV1&&window.PMPPass75ReloadRuntimePlatformGateV1.run){receipt('','runtime_gate_displayed_waiting');window.PMPPass75ReloadRuntimePlatformGateV1.run(afterRuntime)}else{receipt('','runtime_gate_missing_starting');afterRuntime()}}catch(e){receipt('','runtime_gate_error_starting',{error:String(e&&e.message||e)});afterRuntime()}
</script>
</body>

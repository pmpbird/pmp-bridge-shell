<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#52b5df">
<title>PMP Home Single v6 Restore</title>
<style>html,body{margin:0;width:100%;height:100%;background:#52b5df;color:#101827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:grid;place-items:center;font-weight:950}.box{padding:18px;text-align:center}</style>
</head>
<body>
<div class="box">Restoring PMP Home…</div>
<script>
'use strict';
const RESTORE_VERSION='1.0.0-emergency-rollback-to-pre-home-boot-patch';
const RESTORE_URL='https://raw.githubusercontent.com/pmpbird/pmp-bridge-shell/7ac7213aeeeb8bb55692a4985e0fa80a547cff4e/pmp-home-single-v6.html?fresh=rollback-'+Date.now();
function receipt(status,extra){let r=Object.assign({type:'PMP_HOME_SINGLE_V6_EMERGENCY_ROLLBACK_RECEIPT',version:RESTORE_VERSION,at:new Date().toISOString(),status,restore_url:RESTORE_URL,side_effects:{route_change_attempted:false,indexeddb_write_attempted:false,bank_rebuild_attempted:false,storage_migration_attempted:false,section_takeover_attempted:false}},extra||{});try{localStorage.setItem('pmp_home_single_v6_emergency_rollback_receipt',JSON.stringify(r,null,2))}catch(e){}return r}
(async()=>{try{receipt('fetching_original');let r=await fetch(RESTORE_URL,{cache:'no-store'});let html=await r.text();if(!html||html.indexOf('PMP Home Single v6')<0)throw new Error('restore content failed validation');receipt('writing_original',{bytes:html.length});document.open();document.write(html);document.close();}catch(e){receipt('rollback_failed',{error:String(e&&e.message||e)});document.body.innerHTML='<div class="box">Rollback failed. Tell ChatGPT: '+String(e&&e.message||e).replace(/[<>&]/g,'')+'</div>';}})();
</script>
</body>
</html>

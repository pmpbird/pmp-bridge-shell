<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#52b5df">
<title>PMP Home Single v6</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#52b5df;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#52b5df}
#boot{position:fixed;inset:0;display:grid;place-items:center;background:#52b5df;color:#101827;font-weight:950;z-index:2}
</style>
</head>
<body>
<div id="boot">Loading PMP…</div>
<iframe id="a" title="PMP Home App"></iframe>
<script>
'use strict';
const frame=document.getElementById('a');
const boot=document.getElementById('boot');
const HOME_BOOT_VERSION='1.0.0-pass7-home-screen-boot-loader-121';
const INNER='pmp-current-inner-cleanbug-rgcontrols-v29.html';
const CACHELIFT_SRC='pmp-mount-registry-v1-cachelift-20260706b.js?fresh=pass7-home-screen-cachelift-loader-121-20260706P';
const MARKER='pmp-reload-current-live-update-marker-v1.json';
let lastRevision=null;
function now(){return new Date().toISOString()}
function receipt(status,extra){let r=Object.assign({type:'PMP_HOME_SCREEN_BOOT_RECEIPT_V1',version:HOME_BOOT_VERSION,owner:'pmp-home-single-v6',at:now(),status:status||'ready',inner_src:frame.src||'',cachelift_src:CACHELIFT_SRC,marker:MARKER,side_effects:{route_change_attempted:false,indexeddb_write_attempted:false,bank_rebuild_attempted:false,storage_migration_attempted:false,section_takeover_attempted:false}},extra||{});try{localStorage.setItem('pmp_home_screen_boot_receipt_v1',JSON.stringify(r,null,2))}catch(e){}try{window.PMPHomeScreenBootV1={version:HOME_BOOT_VERSION,receipt:r,last:()=>r}}catch(e){}return r}
function innerSrc(rev){return INNER+'?fresh=home-screen-pass7-loader121-'+encodeURIComponent(String(rev||'fallback'))+'-'+Date.now()+'#control'}
function injectCachelift(){try{let d=frame.contentDocument||(frame.contentWindow&&frame.contentWindow.document);if(!d)return;let old=d.getElementById('pmpMountRegistryCachelift20260706b');if(old){let src=old.getAttribute('src')||'';if(src.indexOf('pass7-home-screen-cachelift-loader-121-20260706P')>=0)return;try{old.remove()}catch(e){}}
let s=d.createElement('script');s.id='pmpMountRegistryCachelift20260706b';s.src=CACHELIFT_SRC+'-'+Date.now();(d.head||d.documentElement).appendChild(s);receipt('cachelift_injected',{script_src:s.src})}catch(e){receipt('cachelift_inject_error',{error:String(e&&e.message||e)})}}
async function readMarker(reason){try{let r=await fetch(MARKER+'?fresh='+Date.now(),{cache:'no-store'});let m=await r.json();return{reason,revision:String(m.revision||m.updated_at||m.version||''),marker:m}}catch(e){return{reason,revision:'',error:String(e&&e.message||e)}}}
async function start(){let m=await readMarker('home_boot_start');let rev=m.revision||'fallback';lastRevision=m.revision||null;frame.src=innerSrc(rev);receipt('frame_loaded_from_home_boot',{revision:m.revision||null,error:m.error||null});}
async function check(reason){let m=await readMarker(reason);if(m.revision&&lastRevision!==null&&m.revision!==lastRevision){lastRevision=m.revision;frame.src=innerSrc(m.revision);receipt('frame_refreshed_from_marker',{revision:m.revision});return}receipt('home_boot_ready',{revision:m.revision||null,error:m.error||null});}
frame.addEventListener('load',()=>{try{boot.style.display='none'}catch(e){};[30,120,360,800,1500,2600,4200,6500].forEach(t=>setTimeout(injectCachelift,t));});
function install(){injectCachelift()}
start();
[200,600,1200,2200,3600,5200].forEach(t=>setTimeout(install,t));
[1600,4200].forEach(t=>setTimeout(()=>check('startup_'+t),t));
setInterval(install,1200);
setInterval(()=>check('interval'),5000);
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#52b5df">
<title>PMP Home Single v6 Restore</title>
<style>html,body{margin:0;width:100%;height:100%;background:#52b5df;color:#101827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:grid;place-items:center;font-weight:950}.box{padding:18px;text-align:center;white-space:pre-wrap}</style>
</head>
<body>
<div class="box" id="status">Verifying and restoring PMP Home…</div>
<script src="pmp-current-route-resolver-v1.js"></script>
<script>
'use strict';
const RESTORE_VERSION='1.3.0-a003-historical-byte-enforcement';
const resolver=window.PMPCurrentRouteResolver;
let RESTORE_URL='';
function receipt(status,extra){let r=Object.assign({type:'PMP_HOME_SINGLE_V6_EMERGENCY_ROLLBACK_RECEIPT',version:RESTORE_VERSION,at:new Date().toISOString(),status,restore_url:RESTORE_URL||null,route_authority:resolver&&resolver.mapPath||'pmp-current-map-v12.json',runtime_integrity:'required',side_effects:{destination_route_change_attempted:false,screen_hash_reassertion:true,indexeddb_write_attempted:false,bank_rebuild_attempted:false,storage_migration_attempted:false,section_takeover_attempted:false}},extra||{});try{localStorage.setItem('pmp_home_single_v6_emergency_rollback_receipt',JSON.stringify(r,null,2))}catch(e){}return r}
function cleanPart(value,label){value=String(value||'').trim();if(!value||value.indexOf('..')!==-1||value.indexOf('\\')!==-1||/[?#\u0000-\u001f]/.test(value)||!/^[-A-Za-z0-9._/]+$/.test(value))throw new Error(label+'_invalid');return value}
function rawUrl(identity){const commit=cleanPart(identity.commit,'home_payload_commit');const path=cleanPart(identity.repository_path,'home_payload_path');if(!/^[0-9a-f]{40}$/i.test(commit))throw new Error('home_payload_commit_invalid');if(!/\.html$/i.test(path))throw new Error('home_payload_path_invalid');return 'https://raw.githubusercontent.com/pmpbird/pmp-bridge-shell/'+commit+'/'+path+'?fresh=map-restore-'+Date.now()}
function requestedHash(map){let q=new URLSearchParams(location.search),candidate=q.get('requested_hash')||location.hash||map.default_hash;return resolver.normalizeHash(String(candidate||''),map)}
function injectHashLock(html,hash){let literal=JSON.stringify(hash),script='<script>(function(){var h='+literal+';function apply(){try{if(location.hash!==h)history.replaceState(null,"",location.pathname+location.search+h)}catch(e){try{location.hash=h}catch(x){}}}apply();[0,50,250,750,1500,3000,6000].forEach(function(t){setTimeout(apply,t)});window.addEventListener("load",apply);window.addEventListener("hashchange",function(){if(location.hash!==h)setTimeout(apply,0)});})();<\/script>';return /<\/body>/i.test(html)?html.replace(/<\/body>/i,script+'</body>'):html+script}
function hex(buffer){return Array.from(new Uint8Array(buffer)).map(v=>v.toString(16).padStart(2,'0')).join('')}
async function sha256(bytes){return hex(await crypto.subtle.digest('SHA-256',bytes))}
(async()=>{try{if(!resolver)throw new Error('PMP Current Route Resolver did not load.');const loaded=await resolver.load();const identity=loaded.map&&loaded.map.historical_payloads&&loaded.map.historical_payloads.home_v6;if(!identity)throw new Error('home_payload_identity_missing');if(!/^[0-9a-f]{64}$/i.test(String(identity.sha256||'')))throw new Error('home_payload_sha256_missing');const screen=requestedHash(loaded.map);RESTORE_URL=rawUrl(identity);receipt('fetching_map_declared_original_for_sha256_verification',{map_path:loaded.map_path,map_version:loaded.map.app_version,route_epoch:loaded.map.route_epoch,requested_hash:screen,repository_path:identity.repository_path,commit:identity.commit,git_blob_sha:identity.git_blob_sha,expected_sha256:identity.sha256});const r=await fetch(RESTORE_URL,{cache:'no-store'});if(!r.ok)throw new Error('restore_http_'+r.status);const bytes=await r.arrayBuffer(),actual=await sha256(bytes);if(actual!==String(identity.sha256).toLowerCase()){const error=new Error('historical_home_sha256_mismatch');error.expected=identity.sha256;error.actual=actual;throw error}let html=new TextDecoder().decode(bytes);if(!html||html.indexOf('PMP Home Single v6')<0)throw new Error('restore_content_failed_validation');html=injectHashLock(html,screen);receipt('writing_sha256_verified_map_declared_original',{bytes:bytes.byteLength,map_path:loaded.map_path,map_version:loaded.map.app_version,route_epoch:loaded.map.route_epoch,requested_hash:screen,repository_path:identity.repository_path,commit:identity.commit,git_blob_sha:identity.git_blob_sha,expected_sha256:identity.sha256,actual_sha256:actual,verification:'PASS'});document.open();document.write(html);document.close()}catch(e){const d=resolver?resolver.diagnostic(e,'home_v6_historical_payload'):{type:'PMP_ROUTE_FAIL_CLOSED_DIAGNOSTIC_V1',context:'home_v6_historical_payload',code:'RESOLVER_UNAVAILABLE',message:String(e&&e.message||e),action:'navigation_blocked_no_unverified_fallback_consulted'};receipt('rollback_failed_closed',{error:String(e&&e.message||e),expected_sha256:e&&e.expected||null,actual_sha256:e&&e.actual||null,diagnostic:d});document.getElementById('status').textContent='Home restore stopped.\n'+String(e&&e.message||e)}})();
</script>
</body>
</html>

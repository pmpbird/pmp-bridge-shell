<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PMP Route Entry Test">
<meta name="theme-color" content="#52b5df">
<title>PMP Route Guardian Real Entry Test</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#52b5df;color:#101827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#52b5df}.gate{position:fixed;inset:0;display:grid;place-items:center;background:#52b5df;padding:18px;z-index:20;overflow:auto}.card{width:min(760px,100%);background:#46a9d3;border:3px solid #07101c;border-radius:28px;padding:18px;box-shadow:0 10px 24px #0003;text-align:center;font-weight:950}.badge{display:inline-block;background:#a1fcfd;border:2px solid #07101c;border-radius:999px;padding:6px 10px;margin-bottom:10px;font-size:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}@media(max-width:680px){.grid{grid-template-columns:1fr}}button{width:100%;border:0;border-radius:16px;background:#a1fcfd;color:#101827;font:inherit;font-weight:950;padding:13px;box-shadow:0 8px 18px #0002}.dark{background:#172234;color:#eef4fb;border:1px solid #25354a}.pass .card{border-color:#0b3519}.fail .card{border-color:#7d3333;background:#7b2f2f;color:#fff}.loaded .gate{display:none!important}.pill{display:inline-block;background:#172234;color:#eef4fb;border:1px solid #25354a;border-radius:999px;padding:7px 10px;font-size:12px;margin:4px}.ok{background:#123024}.bad{background:#351414}pre{display:none;position:fixed;left:10px;right:10px;top:10px;bottom:10px;z-index:30;background:#0c141e;color:#eef4fb;border:2px solid #a1fcfd;border-radius:22px;padding:12px;overflow:auto;white-space:pre-wrap;font:12px/1.35 ui-monospace,Menlo,monospace}
</style>
</head>
<body>
<iframe id="app" title="PMP Current after Route Guardian real entry test"></iframe>
<div class="gate"><div class="card"><div class="badge">REAL ENTRY TEST COPY — ROUTE GUARDIAN FIRST</div><h1 id="title">Route Guardian</h1><p id="msg">This test copy behaves like the future first screen. Check route first; if it passes, the same button opens World.</p><div id="chips"></div><div class="grid"><button id="main">Check Route</button><button id="copy" class="dark">Copy Report</button><button id="show" class="dark">Show / Hide Report</button></div></div></div>
<pre id="report">No report yet.</pre>
<script src="pmp-route-guardian-v1.js?fresh=real-entry-test-v1"></script>
<script>
const app=document.getElementById('app'),title=document.getElementById('title'),msg=document.getElementById('msg'),chips=document.getElementById('chips'),main=document.getElementById('main'),copy=document.getElementById('copy'),show=document.getElementById('show'),box=document.getElementById('report');let latest=null,passed=false,loaded=false;
function state(t,m,k){document.body.classList.remove('pass','fail','loaded');if(k)document.body.classList.add(k);title.textContent=t;msg.textContent=m}function pill(t,ok){return '<span class="pill '+(ok?'ok':'bad')+'">'+String(t).replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]))+'</span>'}
function paint(r){latest=r;box.textContent=JSON.stringify(r,null,2);const map=r.current_map_assessment||{},inner=r.current_inner_assessment||{},risk=(r.stale_shell_risk||{}).risk_count||0;chips.innerHTML=[pill('map '+(map.current_path_matches_expected?'ok':'check'),!!map.current_path_matches_expected),pill('base '+(inner.loads_base_app?'ok':'check'),!!inner.loads_base_app),pill('bug '+(inner.routes_bug_memory_clean?'ok':'check'),!!inner.routes_bug_memory_clean),pill('risk '+risk,risk===0)].join('')}
async function check(){state('Route Guardian','Checking current app route...',null);main.textContent='Checking...';try{if(!window.PMPRouteGuardianV1)throw new Error('Route Guardian did not load.');let r=await window.PMPRouteGuardianV1.buildReport({store:false});paint(r);passed=String(r.verdict||'').startsWith('PASS')&&((r.stale_shell_risk||{}).risk_count||0)===0;if(passed){state('Route Guardian Passed','Current route is clean. The same button is now Open World. Copy Report still works.','pass');main.textContent='Open World'}else{state('Route Guardian Blocked',r.resident_summary||'Route risk found.','fail');main.textContent='Check Route'}}catch(e){passed=false;latest={type:'PMP_REAL_ENTRY_TEST_ERROR',built_at:new Date().toISOString(),error:String(e&&e.message||e)};box.textContent=JSON.stringify(latest,null,2);state('Route Guardian Error',latest.error,'fail');main.textContent='Check Route'}}
function patchWorldTitle(){try{let d=app.contentDocument||app.contentWindow.document;for(let i=0;i<8;i++){let f=d&&d.getElementById&&d.getElementById('app');if(!f)break;d=f.contentDocument||f.contentWindow.document}let world=d&&d.getElementById&&d.getElementById('world');let h=world&&world.querySelector('h1');if(h&&h.textContent.trim()==='PMP World')h.textContent='World'}catch(e){}}
function openWorld(){if(!passed){check();return}loaded=true;state('Opening World','Route Guardian passed. Loading World now.','pass');let map=latest.current_map_assessment||{};let path=map.current_path||'pmp-current-inner-cleanbug-v1.html';let key=map.current_cache_key||Date.now();app.src=path+'?fresh=real-entry-test-'+encodeURIComponent(key)+'-'+Date.now()+'#world';document.body.classList.add('loaded');app.onload=()=>{setTimeout(patchWorldTitle,400);setTimeout(patchWorldTitle,1200);setTimeout(patchWorldTitle,2500)}}
main.onclick=()=>passed&&!loaded?openWorld():passed&&loaded?document.body.classList.add('loaded'):check();copy.onclick=async()=>{if(!latest)await check();try{await navigator.clipboard.writeText(JSON.stringify(latest,null,2));state('Report Copied',passed?'Report copied. Same button still opens World.':'Report copied.',passed?'pass':'fail');if(passed)main.textContent='Open World'}catch(e){box.style.display='block';state('Copy Failed','Select report manually.','fail')}};show.onclick=()=>{box.style.display=box.style.display==='block'?'none':'block'};
</script>
</body>
</html>

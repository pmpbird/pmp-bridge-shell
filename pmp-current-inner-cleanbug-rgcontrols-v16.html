<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="theme-color" content="#f3ded4"><title>PMP Recovery Candidate v16</title><style>html,body{margin:0;min-height:100%;background:#f3ded4;color:#07101c;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{display:grid;place-items:center;padding:18px}.card{max-width:620px;background:#fff;border:3px solid #07101c;border-radius:26px;padding:18px}.badge,button{border:2px solid #07101c;border-radius:14px;padding:11px;font:inherit;font-weight:950}.badge{display:inline-block;background:#fff3de}.btn{width:100%;background:#acd1fb;margin-top:10px}.dark{background:#172234;color:#eef4fb}pre{white-space:pre-wrap;background:#102033;color:#eaffef;border-radius:14px;padding:10px;display:none}.open{display:block}</style></head><body><section class="card"><span class="badge">RECOVERY CANDIDATE — EVIDENCE ONLY</span><h1>Inner v16</h1><p>This historical recovery candidate cannot become current or launch its old wrapper chain. Return through Current Map.</p><button id="returnBtn" class="btn">Return to Current App</button><button id="showBtn" class="btn dark">Show Evidence</button><pre id="evidence"></pre></section><script src="pmp-current-route-resolver-v1.js"></script><script>'use strict';const resolver=window.PMPCurrentRouteResolver,ev=document.getElementById('evidence');let state=null;async function load(){if(state)return state;if(!resolver)throw new Error('resolver unavailable');let loaded=await resolver.load(),self=resolver.resolve(loaded.map,'recovery_routes.last_good_inner_v16'),current=resolver.resolve(loaded.map,'current_app');state={loaded,self,current};ev.textContent=JSON.stringify({type:'PMP_RECOVERY_CANDIDATE_EVIDENCE_V1',candidate_role:self.role,candidate_path:self.path,current_role:current.role,current_path:current.path,map_path:current.map_path,map_version:current.map_version,route_epoch:current.route_epoch,execution_policy:'candidate is evidence only; old inner chain is not executed',at:new Date().toISOString()},null,2);return state}document.getElementById('returnBtn').onclick=async()=>{try{let s=await load(),h=resolver.normalizeHash(location.hash||'#control',s.loaded.map),url=resolver.buildUrl(s.current,{from:'recovery-candidate-v16',fresh:'a002-p5-'+s.current.route_epoch+'-'+Date.now(),map_version:s.current.map_version,route_epoch:s.current.route_epoch},h);location.href=url}catch(e){ev.classList.add('open');ev.textContent=JSON.stringify(resolver?resolver.diagnostic(e,'recovery_candidate_v16'):String(e),null,2)}};document.getElementById('showBtn').onclick=()=>ev.classList.toggle('open');load().catch(e=>{ev.classList.add('open');ev.textContent=JSON.stringify(resolver?resolver.diagnostic(e,'recovery_candidate_v16_boot'):String(e),null,2)});</script></body></html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PMP Bridge">
<meta name="theme-color" content="#52b5df">
<title>PMP Bridge</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#52b5df;-webkit-text-size-adjust:100%;touch-action:manipulation;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#app{position:fixed;inset:0;width:100%;height:100%;border:0;background:#52b5df;display:none}
#chooser{position:fixed;inset:0;z-index:999996;display:flex;align-items:center;justify-content:center;padding:18px;background:linear-gradient(180deg,#52b5df,#2e7ea3)}
#chooserCard{width:min(460px,100%);border:2px solid rgba(255,255,255,.9);border-radius:22px;background:rgba(13,20,29,.92);color:#eef4fb;padding:16px;box-shadow:0 14px 40px rgba(0,0,0,.35)}
#chooserCard h1{margin:0 0 8px;font-size:22px}.hint{font-size:13px;line-height:1.35;color:#b9c8d8;margin:0 0 12px}.chooseBtn{display:block;width:100%;box-sizing:border-box;border:1px solid rgba(255,255,255,.24);border-radius:16px;background:#17324a;color:#fff;padding:13px 12px;margin-top:9px;text-align:left;text-decoration:none;font:inherit;font-weight:900}.chooseBtn span{display:block;margin-top:4px;font-size:12px;font-weight:600;color:#b9c8d8;line-height:1.28}
#guardianStatus{position:fixed;left:10px;right:10px;bottom:10px;z-index:999999;background:#123024;color:#c9f7d7;border:2px solid #fff;border-radius:16px;padding:8px 10px;font-size:12px;display:none;white-space:pre-wrap;box-shadow:0 8px 24px rgba(0,0,0,.35)}
</style>
</head>
<body>
<iframe id="app" src="about:blank"></iframe>
<div id="chooser"><div id="chooserCard"><h1>PMP Bridge Launcher</h1><p class="hint">Route Guardian is active, but it will not change the room until you choose.</p><button id="openCurrent" class="chooseBtn" type="button">Open Current<span>Use Route Guardian to open the current build.</span></button><button id="lastGoodBtn" class="chooseBtn" type="button">Last Good<span>Hand off to Route Guardian for named saves and recovery.</span></button></div></div>
<div id="guardianStatus">Route Guardian ready.</div>
<script>
(()=>{
  const POINTER='pmp-latest.json';
  const FALLBACK='pmp-clean-v22.html';
  const FRAME=document.getElementById('app');
  const CHOOSER=document.getElementById('chooser');
  const CURRENT=document.getElementById('openCurrent');
  const LAST_GOOD=document.getElementById('lastGoodBtn');
  let pointerCache=null,lastLoaded='',routeTimer=null,guardTimer=null;
  function status(msg){const s=document.getElementById('guardianStatus');s.textContent=msg;s.style.display='block';clearTimeout(status.t);status.t=setTimeout(()=>{s.style.display='none'},4200)}
  function cleanTarget(t){t=String(t||'').trim();if(!t||/[\s<>"']/.test(t))return FALLBACK;if(!/\.html($|[?#])/.test(t))return FALLBACK;if(/^https?:\/\//i.test(t))return FALLBACK;return t.replace(/^\.\//,'')}
  async function pointer(){try{const r=await fetch(POINTER+'?rg='+Date.now(),{cache:'no-store'});pointerCache=await r.json();return pointerCache}catch(e){return pointerCache||{latest:FALLBACK,last_good:FALLBACK,last_good_saves:[]}}}
  function openFrame(target,reason){const t=cleanTarget(target);lastLoaded=t;CHOOSER.style.display='none';FRAME.style.display='block';try{localStorage.setItem('pmp_route_guardian_current_target',t);localStorage.setItem('pmp_route_guardian_last_good',t);localStorage.setItem('pmp_route_guardian_receipt',JSON.stringify({type:'PMP_ROUTE_GUARDIAN_CHOICE_LAUNCH_RECEIPT_V1',target:t,reason:reason||'choice',at:new Date().toISOString(),safe_claim:'Route Guardian opened only after user choice.',do_not_claim:'This is launch routing only, not proof that inner hooks are validated.'}))}catch(e){}FRAME.src=t+'?fresh=route-guardian-choice-'+encodeURIComponent(reason||'choice')+'-'+Date.now()+'#control';status('Route Guardian opened chosen build.\nTarget: '+t);startGuards()}
  function openGuardianLastGood(target){const t=cleanTarget(target);try{localStorage.setItem('pmp_route_guardian_current_target',lastLoaded||t);localStorage.setItem('pmp_route_guardian_last_good',lastLoaded||t)}catch(e){}lastLoaded=t;CHOOSER.style.display='none';FRAME.style.display='block';FRAME.src=t+'?mode=lastgood&fresh=route-guardian-lastgood-'+Date.now()+'#control';status('Route Guardian opened Last Good recovery.\nTarget: '+t)}
  function stopGuards(){if(routeTimer){clearInterval(routeTimer);routeTimer=null}if(guardTimer){clearInterval(guardTimer);guardTimer=null}}
  function startGuards(){stopGuards();routeTimer=setInterval(async()=>{const p=await pointer();const t=cleanTarget(p.latest||p.last_good||FALLBACK);if(t!==lastLoaded)openFrame(t,'periodic-currentness-check')},12000);guardTimer=setInterval(guardOldDetour,1500)}
  function guardOldDetour(){try{const href=FRAME.contentWindow.location.href;if(/safe-writer/i.test(href)||/pmp-clean-v21\.html/i.test(href)){status('Route Guardian caught old route. Returning to current app.');lastLoaded='';CURRENT.click()}}catch(e){}}
  CURRENT.onclick=async(e)=>{e.preventDefault();stopGuards();const p=await pointer();openFrame(p.latest||p.last_good||FALLBACK,'open-current')};
  LAST_GOOD.onclick=async(e)=>{e.preventDefault();stopGuards();const p=await pointer();openGuardianLastGood(p.latest||p.last_good||FALLBACK)};
  pointer().then(()=>status('Route Guardian ready. Choose Current or Last Good.'));
  window.openLastGoodTarget=openFrame;
})();
</script>
</body>
</html>
